<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 2 — Properties of materials — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>
</head>

s a lower mass"], "answer": 0, "explain": "Concentration is about how many solute particles are packed into the solvent.", "src": "L|More particles of the solute are dissolved in a concentrated solution than in a dilute solution."}, {"id": "y8c02-m013", "type": "mcq", "topic": "2.2", "source": "opus", "q": "What word describes a solid that dissolves in water?", "options": ["Soluble", "Insoluble", "Saturated", "Transparent"], "answer": 0, "explain": "Sodium chloride and sugar are both soluble in water.", "src": "L|A solid that dissolves in a solvent such as water is said to be soluble."}, {"id": "y8c02-m023", "type": "mcq", "topic": "2.3", "source": "opus", "q": "What is the variable you change called?", "options": ["The independent variable", "The dependent variable", "The control variable", "The fair variable"], "answer": 0, "explain": "In the salt investigation, the temperature of the water was the independent variable.", "src": "L|The variable you change is called the independent variable."}, {"id": "y8c02-m024", "type": "mcq", "topic": "2.3", "source": "opus", "q": "What is the variable you measure called?", "options": ["The dependent variable", "The independent variable", "The control variable", "The measured constant"], "answer": 0, "explain": "Its value depends on what you did to the independent variable.", "src": "L|The variable you measure is called the dependent variable."}, {"id": "y8c02-m030", "type": "mcq", "topic": "2.4", "source": "opus", "q": "What technique separates the different coloured inks in black ink?", "options": ["Paper chromatography", "Filtration", "Evaporation", "Distillation"], "answer": 0, "explain": "Black ink looks like one colour but is really a mixture.", "src": "L|You can separate out the coloured inks by using a technique called paper chromatography."}, {"id": "y8c02-m031", "type": "mcq", "topic": "2.4", "source": "opus", "q": "What is the finished image on the chromatography paper called?", "options": ["A chromatogram", "A chromatograph", "A filtrate", "A solvent front"], "answer": 0, "explain": "The chromatogram is the record of how far each substance travelled.", "src": "L|The resulting image on the paper is called a chromatogram."}, {"id": "y8c02-m042", "type": "mcq", "topic": "2.4", "source": "opus", "q": "Sofia's drop of liquid did not move up the paper at all, although the water did. Why?", "options": ["The liquid did not dissolve in the water, so the water could not carry it", "She used too much liquid", "The paper was too long", "She waited too long before looking"], "answer": 0, "explain": "A sample that is insoluble in the solvent stays exactly where it was put. She needs a different solvent.", "src": "W|After about 15 minutes she saw that the water had moved up the paper but the drop of liquid had not."}, {"id": "y8c02-m044", "type": "mcq", "topic": "2.3", "source": "opus", "q": "Marcus recorded the same number of spatulas for all three solutes. What does this suggest?", "options": ["He stopped adding solute before the solution was really saturated", "All three solutes have exactly the same solubility", "He used too much water", "His thermometer was broken"], "answer": 0, "explain": "Identical results for three different solutes point to a fault in the method, not a real pattern.", "src": "W|Marcus has the same number of spatulas for all three solutes."}, {"id": "y8c02-m046", "type": "fill", "topic": "2.1", "source": "opus", "q": "The substance that dissolves is called the ____.", "answer": ["solute"], "explain": "Remember: solute dissolves INTO the solvent.", "src": "L|The substance that dissolves is called the solute."}, {"id": "y8c02-m052", "type": "fill", "topic": "2.2", "source": "opus", "q": "A solution is made when a solute is dissolved in a ____.", "answer": ["solvent"], "explain": "Solute + solvent = solution.", "src": "L|A solution is made when a solute is dissolved in a solvent."}, {"id": "y8c02-m059", "type": "fill", "topic": "2.3", "source": "opus", "q": "The variable you change is called the ____ variable.", "answer": ["independent"], "explain": "You choose its values before the experiment starts.", "src": "L|The variable you change is called the independent variable."}, {"id": "y8c02-m065", "type": "fill", "topic": "2.4", "source": "opus", "q": "You can separate out the coloured inks by using a technique called paper ____.", "answer": ["chromatography"], "explain": "It works because the inks have different solubilities.", "src": "L|You can separate out the coloured inks by using a technique called paper chromatography."}, {"id": "y8c02-r001", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why the sugar has not disappeared, even though you can no longer see it.", "answer": "The sugar is still there; its particles have simply been separated and spread out among the water particles, so they are too small to see.", "keywords": ["still there", "spread out", "too small"], "explain": "Dissolving rearranges particles; it does not destroy them.", "src": "L|Although the sugar seems to disappear, it is still there."}, {"id": "y8c02-r002", "type": "short", "topic": "2.1", "source": "opus", "q": "Use particle theory to explain how a sugar crystal dissolves in water.", "answer": "The vibrating, sliding water particles bump into the tightly packed sugar particles and separate them, until the sugar particles are all mixed in among the water particles.", "keywords": ["water particles", "separate", "mixed"], "explain": "Nothing pulls the crystal apart from outside; the moving water particles do the work.", "src": "L|As the water particles vibrate and slide past one another they bump into the vibrating sugar particles."}, {"id": "y8c02-r003", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain how you can tell, just by looking, that milk is not a solution.", "answer": "All solutions are transparent, and you cannot see through milk, so milk cannot be a solution.", "keywords": ["transparent", "see through", "not"], "explain": "Transparent is not the same as colourless: blue copper sulfate solution is still transparent.", "src": "L|Because of this, you can tell that milk is not a solution."}, {"id": "y8c02-r004", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why a blue copper sulfate solution is still called transparent.", "answer": "Transparent means you can see through it, and you can see through the blue solution even though it is coloured.", "keywords": ["see through", "coloured", "transparent"], "explain": "Colour and transparency are two separate properties.", "src": "L|For example, if you dissolve a coloured salt, such as copper sulfate, the solution formed is blue."}, {"id": "y8c02-r005", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why the mass of a salt solution equals the mass of the salt plus the mass of the water.", "answer": "The salt particles are still in the water and nothing has been lost, so the mass is conserved.", "keywords": ["still", "conserved", "not lost"], "explain": "This is the evidence that dissolving is not the same as disappearing.", "src": "L|The mass of the solution equals the total mass of the solute and solvent."}, {"id": "y8c02-r006", "type": "short", "topic": "2.1", "source": "opus", "q": "9 g of salt is dissolved in 50 g of water. Explain how you work out the mass of the solution.", "answer": "Mass of solute plus mass of solvent equals mass of solution, so 9 g + 50 g = 59 g.", "keywords": ["9", "50", "59"], "explain": "You can do this for any solution, because mass is always conserved.", "src": "L|What mass of salt solution is made when 9g of salt is dissolved in 50g of water?"}, {"id": "y8c02-r007", "type": "short", "topic": "2.1", "source": "opus", "q": "A green powder was stirred into water; the water looked cloudy and lumps could still be seen. Explain whether a solution has been formed.", "answer": "No solution has formed, because a solution is transparent and this mixture is cloudy with visible lumps, so the powder has not dissolved.", "keywords": ["no", "transparent", "cloudy"], "explain": "Cloudiness means solid particles are still suspended in the liquid.", "src": "L|After it was stirred, the water looked cloudy and lumps of powder could still be seen."}, {"id": "y8c02-r008", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain the difference between dissolving and melting.", "answer": "Melting is one substance changing from solid to liquid when it is heated; dissolving is a solute spreading out among the particles of a solvent to make a solution, with two substances involved.", "keywords": ["melting", "solvent", "two"], "explain": "Sugar in cold water dissolves; it does not melt.", "src": "L|What is the difference between dissolving and melting?"}, {"id": "y8c02-r009", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain how a concentrated solution differs from a dilute solution in terms of particles.", "answer": "A concentrated solution has more particles of the solute dissolved in the same amount of solvent than a dilute solution has.", "keywords": ["more", "particles", "same"], "explain": "It is the ratio of solute to solvent that decides the concentration.", "src": "L|More particles of the solute are dissolved in a concentrated solution than in a dilute solution."}, {"id": "y8c02-r010", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain why it is important to measure the food dye solution and the water accurately when making solutions of different concentrations.", "answer": "The concentration depends on the ratio of dye to water, so an inaccurate measurement would give a concentration different from the one intended and the comparison would not be valid.", "keywords": ["accurate", "concentration", "compar"], "explain": "The whole point of the task is to compare known concentrations.", "src": "L|4 Why is it important to measure the food dye solution and the water accurately?"}, {"id": "y8c02-r011", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain why using a measuring cylinder that reads up to 100 cm3 would make these small volumes less accurate.", "answer": "A large cylinder has widely spaced divisions, so measuring only a few cubic centimetres in it gives a much larger percentage error than using a small cylinder.", "keywords": ["large", "divisions", "error"], "explain": "Choose the smallest measuring instrument that will hold the volume you need.", "src": "L|5 If you only had a measuring cylinder that measured up to 100cm3, would using these same volumes of copper sulfate and water be accurate?"}, {"id": "y8c02-r012", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain what has happened when no more of a solid will dissolve in a beaker of water.", "answer": "The solution has become saturated: at that temperature the water can hold no more of that solute.", "keywords": ["saturated", "no more", "temperature"], "explain": "A saturated solution can still dissolve more if you heat it.", "src": "L|If you keep adding a soluble solid to a beaker of water, there comes a point where no more of the solid will dissolve."}, {"id": "y8c02-r013", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain what it means to say that sodium chloride has a greater solubility than lead chloride.", "answer": "Much more sodium chloride than lead chloride will dissolve in the same volume of water at the same temperature.", "keywords": ["more", "same", "dissolve"], "explain": "Solubility is always quoted for a stated mass of solvent and a stated temperature.", "src": "L|If you have 100 cm3 of water, you would be able to dissolve a lot of sodium chloride in it, but only a tiny amount of lead chloride."}, {"id": "y8c02-r014", "type": "short", "topic": "2.2", "source": "opus", "q": "Counting spatulas is a rough measure of how much solute was added. Suggest a better way, and explain why it is better.", "answer": "Weigh the solute on a balance and record the mass added, because spatulas hold different amounts each time while a mass is a measured quantity that can be repeated.", "keywords": ["mass", "balance", "repeat"], "explain": "Replacing a rough count with a measurement is the usual way to improve accuracy.", "src": "L|Suggest another way of measuring the amount of solute used, to improve the accuracy of the results."}, {"id": "y8c02-r015", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain why you must use a known amount of solvent when comparing the solubility of different solutes.", "answer": "Solubility is how much solute dissolves in a fixed amount of solvent, so unless the amount of solvent is the same for each solute the results cannot be compared.", "keywords": ["same", "fixed", "compare"], "explain": "This is the control variable that makes the comparison fair.", "src": "L|To compare the solubility of different solutes you must measure how much of each solute will dissolve in a known amount of the solvent."}, {"id": "y8c02-r016", "type": "short", "topic": "2.2", "source": "opus", "q": "Use particle theory to explain why most solutes dissolve faster in hot water than in cold water.", "answer": "The more energy the particles have, the more they vibrate and move, so the water particles collide with the solute more often and separate its particles more quickly.", "keywords": ["energy", "move", "faster"], "explain": "The same reasoning explains why more solute can dissolve when the water is hotter.", "src": "L|The more energy the particles have, the more they vibrate and move."}, {"id": "y8c02-r017", "type": "short", "topic": "2.2", "source": "opus", "q": "204 g of sugar dissolves in 100 g of water at 20 °C. Explain how to work out how much dissolves in 50 g of water at the same temperature.", "answer": "Halving the mass of water halves the mass of sugar that will dissolve, so 204 divided by 2 gives 102 g.", "keywords": ["half", "102", "proportion"], "explain": "Solubility is proportional to the mass of solvent as long as the temperature is unchanged.", "src": "L|b In 100g water, 204g sugar dissolves In 1g water, 204 100g sugar dissolves = 2.04g In 50g water, 2.04 × 50g sugar dissolves = 102g"}, {"id": "y8c02-r018", "type": "short", "topic": "2.2", "source": "opus", "q": "Look at the solubility graph for three salts. Describe the general trend and explain what it tells you.", "answer": "For all three salts the solubility increases as the temperature increases, which shows that hotter water can hold more dissolved solute.", "keywords": ["increases", "temperature", "all three"], "explain": "Reading the overall trend first stops you being distracted by single points.", "src": "L|What is the general trend for the solubility of all three salts?"}, {"id": "y8c02-r019", "type": "short", "topic": "2.2", "source": "opus", "q": "Nail polish will not dissolve in water but does dissolve in propanone. Explain what this shows about solvents.", "answer": "A substance that is insoluble in one solvent may be soluble in another, so the right solvent has to be chosen for the job.", "keywords": ["insoluble", "another", "choose"], "explain": "It is why methylated spirit, not water, is used to clean paint brushes.", "src": "L|Nail polish does not dissolve in water but dissolves in nail polish remover, most nail polish remover contains the solvent propanone (acetone)."}, {"id": "y8c02-r020", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain how the results of the salt-dissolving investigation would be affected if the volume of water were not kept the same.", "answer": "More water would dissolve more salt whatever the temperature, so you could not tell whether a change in the result was caused by the temperature or by the volume of water.", "keywords": ["more water", "temperature", "cannot tell"], "explain": "Two variables changing at once makes a result impossible to interpret.", "src": "L|How do you think the volume of water will affect the results if it is not kept the same?"}, {"id": "y8c02-r021", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain the difference between the independent variable and the dependent variable.", "answer": "The independent variable is the one you deliberately change; the dependent variable is the one you measure, because its value depends on the change you made.", "keywords": ["change", "measure", "depends"], "explain": "Naming them correctly is what lets you decide what to plot on each axis.", "src": "L|The variable you change is called the independent variable."}, {"id": "y8c02-r022", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain which variable goes on each axis when you plot a graph of your results.", "answer": "The independent variable goes along the horizontal axis and the dependent variable goes up the vertical axis.", "keywords": ["independent", "horizontal", "vertical"], "explain": "This convention lets anyone read your graph without being told what you did.", "src": "L|When you plot a graph of your results, the independent variable always goes along the horizontal axis."}, {"id": "y8c02-r023", "type": "short", "topic": "2.3", "source": "opus", "q": "As well as the volume of water, suggest another variable in this investigation that must be controlled, and explain why.", "answer": "The size of the spatula and how full it is loaded each time, because otherwise each 'spatula' would be a different mass of salt and the counts could not be compared.", "keywords": ["spatula", "same", "mass"], "explain": "Hidden variables like this are the most common reason a fair test is not actually fair.", "src": "L|(Hint: think about the spatula.)"}, {"id": "y8c02-r024", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain how paper chromatography separates the different coloured inks in black ink.", "answer": "As the water soaks up the paper it dissolves the inks and carries their particles with it, and because the inks have different solubilities their particles are carried different distances before being left behind.", "keywords": ["carries", "solubil", "different distances"], "explain": "The separation depends on a difference in solubility, not on colour.", "src": "L|As the water moves up the paper, the different coloured inks that make black ink separate out."}, {"id": "y8c02-r025", "type": "short", "topic": "2.4", "source": "opus", "q": "On a chromatogram, explain how you can tell which coloured substance is the most soluble.", "answer": "The more soluble substance is carried further by the solvent, so the spot that has travelled furthest up the paper is the most soluble.", "keywords": ["furthest", "more soluble", "carried"], "explain": "The same rule run backwards identifies the least soluble spot.", "src": "L|The more soluble the ink, the further its particles are carried."}, {"id": "y8c02-r026", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why the line on the chromatography paper is drawn in pencil rather than in ink.", "answer": "Pencil is not soluble in the solvent, so it will not dissolve and run up the paper and spoil the chromatogram, as an ink line would.", "keywords": ["pencil", "not soluble", "ink"], "explain": "The pencil line is a fixed reference to measure from.", "src": "L|Questions  1 Why did you use a line drawn in pencil on the paper?"}, {"id": "y8c02-r027", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why the ink spot must stay above the level of the water in the beaker.", "answer": "If the spot were under the water the ink would simply dissolve away into the beaker instead of being carried up the paper, so no chromatogram would form.", "keywords": ["dissolve", "into the water", "not carried"], "explain": "The solvent must travel through the spot, not around it.", "src": "L|2 Why was it important not to let the ink spot go under the water?"}, {"id": "y8c02-r028", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why the paper must be taken out before the water reaches the top of the strip.", "answer": "Once the solvent reaches the end it can go no further, so the spots stop separating and you cannot tell how far each substance was really carried.", "keywords": ["no further", "separat", "how far"], "explain": "The solvent front is the measuring mark, so it must stay on the paper.", "src": "L|3 Why was it important to remove the strip of paper before the water level reached the end of the strip?"}, {"id": "y8c02-r029", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain how a chromatogram shows you which food dyes are pure substances.", "answer": "A pure substance gives only one spot on the chromatogram, while a mixture separates into two or more spots.", "keywords": ["one spot", "pure", "mixture"], "explain": "Chromatography is a test for purity as well as a way of separating substances.", "src": "L|Which food dyes are pure substances?"}, {"id": "y8c02-r030", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why ethanol, and not water, was used as the solvent for the green pigment from spinach.", "answer": "The green pigment does not dissolve in water but does dissolve in ethanol, so only ethanol will carry it up the paper.", "keywords": ["dissolve", "ethanol", "not water"], "explain": "The same reason means permanent marker ink needs alcohol rather than water.", "src": "L|Questions  1 Why was ethanol used in this investigation and not water?"}, {"id": "y8c02-r031", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain how public health scientists use chromatography to check that a hair dye is safe.", "answer": "They run a chromatogram of the dye alongside a chromatogram of the permitted colourings, and compare the spots: any spot that does not match a permitted one shows an unapproved substance is present.", "keywords": ["compare", "permitted", "match"], "explain": "The permitted-dye chromatogram is the control the sample is judged against.", "src": "L|To do this they compare chromatograms taken from a solution of the food, hair dye or ink and those of the colourings that are permitted."}, {"id": "y8c02-r2001", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why a sugar crystal can be seen but dissolved sugar cannot.", "answer": "The crystal is visible because it is made of lots of groups of particles tightly packed together, which is big enough for your eye to see. Once it dissolves the sugar particles are no longer in groups — they are spread out singly among the water particles — and single particles are far too small to be seen.", "keywords": ["groups of particles", "tightly packed", "spread out", "too small to be seen"], "explain": "Visibility depends on the particles being clumped, not on the substance existing.", "src": "L|The sugar crystal is visible because it is made of lots of groups of vibrating particles that are tightly packed together."}, {"id": "y8c02-r2002", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain the part played by the moving water particles in dissolving.", "answer": "The water particles vibrate and slide past one another and bump into the vibrating sugar particles. Those collisions knock sugar particles off the crystal and separate them, and the particles then get mixed up among the water particles until the whole crystal has been broken apart.", "keywords": ["water particles move", "bump into", "separate", "mixed up"], "explain": "Dissolving is done by the solvent, not by the solute falling apart on its own.", "src": "L|As the water particles vibrate and slide past one another they bump into the vibrating sugar particles."}, {"id": "y8c02-r2003", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why nail polish remover is called a solvent even though it is not water.", "answer": "The solvent is whichever substance the solute dissolves into — it does not have to be water. Nail polish dissolves in propanone, so in that mixture propanone is the solvent and the nail polish is the solute.", "keywords": ["solvent", "dissolves into", "not only water", "propanone"], "explain": "The definition is about the role, not about the identity of the liquid.", "src": "L|The substance that it dissolves into is called the solvent."}, {"id": "y8c02-r2004", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why a blue copper sulfate solution is still a solution even though it is not colourless.", "answer": "A solution is a mixture in which the solute particles are spread evenly among the solvent particles and are too small to see. Copper sulfate is a coloured salt, so the solution formed is blue, but it is still clear and even throughout, which is what makes it a solution.", "keywords": ["spread evenly", "too small to see", "coloured salt", "still clear"], "explain": "Colour and clarity are different properties.", "src": "L|For example, if you dissolve a coloured salt, such as copper sulfate, the solution formed is blue."}, {"id": "y8c02-r2005", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain, in terms of particles, why no mass is lost when salt dissolves in water.", "answer": "Dissolving only spreads the salt particles out among the water particles; it does not destroy any of them. All the particles that were in the salt and in the water are still in the beaker, so the mass of the solution equals the mass of the solute plus the mass of the solvent.", "keywords": ["particles spread out", "none destroyed", "still there", "mass of solute plus solvent"], "explain": "Conservation of mass follows directly from particles not disappearing.", "src": "L|When salt is added to water and it dissolves, it has not disappeared."}, {"id": "y8c02-r2006", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain how to measure the volume of a liquid as accurately as possible.", "answer": "Use the smallest measuring cylinder that will hold the volume, stand it on a level surface, and read the bottom of the meniscus with your eye level with it. A cylinder that is too large has big divisions, and reading from above or below gives a value that is too high or too low.", "keywords": ["smallest cylinder", "level surface", "meniscus", "eye level"], "explain": "Choice of instrument and line of sight are two separate errors.", "src": "L|When measuring the volume of a liquid, what should you do in order to make your measurement as accurate as possible?"}, {"id": "y8c02-r2007", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain how the number of dye particles differs between the most concentrated and the most dilute solution you made.", "answer": "Both contain the same kind of dye particles, but the concentrated solution has more dye particles in the same volume. In the dilute solution some of the dye has been replaced with water, so the dye particles are more spread out and there are fewer of them in each cubic centimetre.", "keywords": ["more particles", "same volume", "more spread out", "fewer"], "explain": "Concentration is about number per volume, not about the particles being different.", "src": "L|6 Compare the number of particles of food dye in the most concentrated solution of food dye and the most dilute solution."}, {"id": "y8c02-r2008", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain why you could not judge the concentrations by eye if you used salt solution instead of food dye.", "answer": "Food dye solutions can be ranked by eye because the deeper the colour, the more dye particles there are in the same volume. Salt and sugar solutions are all colourless, so there is no visible difference at all and you would have to measure something else, such as mass or density, instead.", "keywords": ["colour depth", "more particles", "colourless", "no visible difference", "measure instead"], "explain": "The method depends on a property the solute happens to have.", "src": "L|3 If you repeated this task using a salt or sugar solution, would you be able to identify the most and least concentrated solutions?"}, {"id": "y8c02-r2009", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain what has happened at the particle level when no more solid will dissolve in a beaker of water.", "answer": "The water particles can only hold so many solute particles apart among themselves. Once that limit is reached, any extra solid that is added has no room to spread out into, so it stays as a solid at the bottom and the solution is described as saturated.", "keywords": ["limit reached", "no room", "stays solid", "saturated"], "explain": "Saturation is a property of the solvent's capacity, not of the solid running out.", "src": "L|If you keep adding a soluble solid to a beaker of water, there comes a point where no more of the solid will dissolve."}, {"id": "y8c02-r2010", "type": "short", "topic": "2.2", "source": "opus", "q": "Use particle theory to explain why more of a solid dissolves in hot water than in cold water.", "answer": "The more energy the particles have, the more they vibrate and move. In hot water the particles move faster and collide with the solid more often and more forcefully, so they knock particles off the solid more effectively and can keep more of them separated among themselves.", "keywords": ["more energy", "move faster", "collide more often", "knock particles off"], "explain": "Temperature acts on particle movement, and movement is what does the dissolving.", "src": "L|The more energy the particles have, the more they vibrate and move."}, {"id": "y8c02-r2011", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain what the statement 'as temperature increases, solubility increases' allows you to predict.", "answer": "It lets you predict that the same mass of water will dissolve more of a solute if it is heated, and that a saturated solution made when hot will deposit crystals as it cools, because the cooler water can no longer hold all the dissolved solute.", "keywords": ["more dissolves when hot", "crystals form on cooling", "cannot hold as much"], "explain": "A trend is only useful if you can say what it predicts.", "src": "L|In other words, as the temperature increases, the solubility of most solutes also increases."}, {"id": "y8c02-r2012", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain why heating the water lets you dissolve more sugar, using the figures given.", "answer": "At 20 °C, 100 g of water dissolves 204 g of sugar, but at 80 °C the same 100 g dissolves 362 g. The hot water particles have more energy and move more, so they can separate and hold apart a far greater number of sugar particles — an extra 158 g for every 100 g of water.", "keywords": ["204 g", "362 g", "more energy", "hold more apart"], "explain": "Quoting both figures shows the size of the effect, not just its direction.", "src": "L|How much more sugar can be dissolved if the 250g of water is at 80°C?"}, {"id": "y8c02-r2013", "type": "short", "topic": "2.2", "source": "opus", "q": "Explain why alcohol rather than water must be used to separate the ink in a permanent marker.", "answer": "Chromatography only works if the solvent dissolves the substances being separated and carries them up the paper. Permanent marker ink is not soluble in water, so water would leave the spot where it is. Alcohol does dissolve it, so it can carry the different inks different distances.", "keywords": ["not soluble in water", "solvent must dissolve it", "alcohol", "carries the ink"], "explain": "Choosing the solvent is choosing something the solute will dissolve in.", "src": "L|To separate out the colours in these inks, you would need to use a different solvent, such as alcohol."}, {"id": "y8c02-r2014", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain why the students spend time listing everything that could affect their results before starting.", "answer": "Any factor they overlook could change the amount of salt that dissolves without them realising, so a difference in the results might be caused by that factor instead of by temperature. Identifying the variables first lets them decide which one to change and which ones to keep the same.", "keywords": ["could affect results", "another cause", "decide which to change", "keep the same"], "explain": "Planning the controls is what makes the conclusion attributable to temperature.", "src": "L|They are trying to think of all the different things that could affect the results."}, {"id": "y8c02-r2015", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain why the number of spatulas of salt is called the dependent variable.", "answer": "It is the variable the students measure, and its value depends on the variable they chose to change — the temperature of the water. Its name says exactly that: what happens to it depends on what they did to the independent variable.", "keywords": ["measured", "depends on", "temperature", "independent variable"], "explain": "The name of the variable states the logic of the experiment.", "src": "L|This is the variable that depends on the temperature of the water."}, {"id": "y8c02-r2016", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain the rule for which variable goes on which axis of a graph, and why it matters.", "answer": "The independent variable always goes along the horizontal axis and the dependent variable up the vertical axis. Following the rule means anyone reading the graph knows immediately which quantity was changed and which one responded, so the graph can be interpreted without extra explanation.", "keywords": ["independent horizontal", "dependent vertical", "same for everyone", "interpreted"], "explain": "A convention is valuable precisely because everybody follows it.", "src": "L|When you plot a graph of your results, the independent variable always goes along the horizontal axis."}, {"id": "y8c02-r2017", "type": "short", "topic": "2.3", "source": "opus", "q": "Besides the volume of water, suggest another variable in this investigation that must be controlled, and explain why.", "answer": "The size of the spatula and how full it is loaded must be the same each time, otherwise 'one spatula' means a different mass at different temperatures and the counts cannot be compared. The stirring, the type of salt and the length of time allowed for each spatula to dissolve must also be kept the same.", "keywords": ["size of spatula", "same mass", "stirring", "same time", "comparable"], "explain": "A counted unit is only a measurement if the unit stays constant.", "src": "L|Is there any other variable that needs to be controlled?"}, {"id": "y8c02-r2018", "type": "short", "topic": "2.3", "source": "opus", "q": "Zara and Arun get different numbers of spatulas for the same solute. Explain how that can happen without either being wrong.", "answer": "They may have used different sizes of spatula, or loaded them differently, or used different volumes of water. Each is counting in a unit of their own, so the two numbers are not comparable — but the order in which they rank the solutes can still agree, and that is the part of the result that means something.", "keywords": ["different spatula", "different volume", "not comparable", "order can still agree"], "explain": "Rankings survive a change of unit; raw counts do not.", "src": "W|Explain the difference in the reading that Zara and Arun got."}, {"id": "y8c02-r2019", "type": "short", "topic": "2.3", "source": "opus", "q": "Marcus gets the same number of spatulas for all three solutes. Explain why his results are so different from the others'.", "answer": "He has probably stopped adding at a fixed number rather than at the point where no more would dissolve, or has not stirred long enough for each spatula to dissolve before adding the next. Either way he has not reached saturation, so he is measuring his own procedure rather than the solubility of the solutes.", "keywords": ["stopped too early", "not stirred", "not saturated", "measuring the procedure"], "explain": "Identical results across different substances are a warning sign, not a discovery.", "src": "W|Explain why his results are so different from those of Zara and Arun."}, {"id": "y8c02-r2020", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain what a student should do about a point on their graph that does not fit the pattern.", "answer": "They should mark it as anomalous and repeat that measurement under the same conditions rather than simply ignoring it. If the repeat falls on the line the first value was an error and can be replaced; if it does not, there is something real to investigate.", "keywords": ["anomalous", "repeat", "same conditions", "replace or investigate"], "explain": "You never delete a point just because it is inconvenient.", "src": "W|Which other point does not fit the pattern of the graph?"}, {"id": "y8c02-r2021", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why different coloured inks travel different distances up the chromatography paper.", "answer": "The water carries the ink particles with it as it moves up the paper, but not all the ink particles have the same solubility. The more soluble an ink is, the longer it stays dissolved and the further its particles are carried before they are left behind on the paper.", "keywords": ["carried by the water", "different solubility", "more soluble", "travels further"], "explain": "Separation depends on a difference in solubility, so identical solubility gives no separation.", "src": "L|The different kinds of ink particles are carried different distances before they are left behind on the paper."}, {"id": "y8c02-r2022", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why a scientist comparing many samples runs them side by side on one large sheet rather than separately.", "answer": "The solvent moves up through all the samples at the same time, under exactly the same conditions of paper, solvent, temperature and time. The distances travelled can then be compared directly, whereas separate runs might differ for reasons that have nothing to do with the samples.", "keywords": ["same time", "same conditions", "compared directly", "separate runs differ"], "explain": "Running samples together is a control, not just a convenience.", "src": "L|The scientist will allow the solvent to move up through all the samples at the same time."}, {"id": "y8c02-r2023", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain how a public health scientist decides whether a dye in a product is permitted.", "answer": "They run a chromatogram of the product alongside a chromatogram of all the permitted colourings. Each permitted dye travels a known distance under those conditions, so any spot in the product that does not line up with one of the permitted spots must be a different substance, and further tests are then needed.", "keywords": ["compare chromatograms", "permitted colourings", "does not match", "further tests"], "explain": "The comparison only works because both were run under identical conditions.", "src": "L|To do this they compare chromatograms taken from a solution of the food, hair dye or ink and those of the colourings that are permitted."}, {"id": "y8c02-r2024", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain how a chromatogram shows whether a food dye is a pure substance or a mixture.", "answer": "A pure substance contains only one kind of particle, so it travels one distance and leaves a single spot. A mixture contains substances of different solubilities, which are carried different distances, so it separates into two or more spots.", "keywords": ["one spot", "pure", "several spots", "mixture", "different solubilities"], "explain": "Counting the spots counts the substances.", "src": "L|Some food dyes contain only one substance; they are a pure substance."}, {"id": "y8c02-r2025", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why the crushed spinach is left to stand for about ten minutes in the ethanol.", "answer": "Dissolving is not instant — the ethanol particles have to collide with the pigment and separate its particles out of the leaf. Standing for ten minutes gives time for enough of the green pigment to dissolve in the ethanol so the spot loaded onto the paper is concentrated enough to see.", "keywords": ["time to dissolve", "collide", "concentrated enough", "visible spot"], "explain": "A faint spot gives a faint chromatogram.", "src": "L|Let it stand for about 10 minutes to leave time for the green pigment to dissolve in the ethanol."}, {"id": "y8c02-r2026", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why each drop of liquid must be dried before the next one is added.", "answer": "Adding a wet drop on top of a wet spot lets the liquid spread sideways, giving a large smeared start instead of a small one. Drying between drops builds up more colour in the same small spot, so the separated substances appear as sharp bands rather than overlapping smudges.", "keywords": ["dry between drops", "small spot", "does not spread", "sharp bands"], "explain": "The starting spot's size sets the sharpness of everything above it.", "src": "L|Allow the spot to dry before adding more of the liquid."}, {"id": "y8c02-r2027", "type": "short", "topic": "2.4", "source": "opus", "q": "Sofia's drop of flower liquid did not move at all while the water rose past it. Explain what this shows and what she should change.", "answer": "It shows the pigment is not soluble in water, so the water could not dissolve it and carry it up the paper. She should repeat the chromatogram using a different solvent, such as ethanol, in which the pigment does dissolve.", "keywords": ["not soluble in water", "cannot be carried", "different solvent", "ethanol"], "explain": "A spot that does not move is information about solubility, not a failed experiment.", "src": "W|After about 15 minutes she saw that the water had moved up the paper but the drop of liquid had not."}, {"id": "y8c02-r2028", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain what the solvent front is and why it must not reach the top of the paper.", "answer": "The solvent front is the point that the solvent has reached. Once it runs off the top edge you no longer know how far the solvent travelled, so the distances moved by the spots cannot be compared with it, and spots near the top may be carried off the paper altogether.", "keywords": ["point the solvent reaches", "runs off", "cannot compare distances", "spots lost"], "explain": "The front is the reference all the other distances are measured against.", "src": "L|The point that the solvent reaches is called the solvent front."}, {"id": "y8c02-o001", "type": "short", "topic": "2.1", "source": "opus", "q": "What is the name given to a substance that dissolves?", "answer": "The solute.", "keywords": ["solute"], "explain": "The solute is the substance that dissolves into the solvent.", "src": "L|The substance that dissolves is called the solute."}, {"id": "y8c02-o002", "type": "short", "topic": "2.1", "source": "opus", "q": "What is the name given to the substance that a solute dissolves into?", "answer": "The solvent.", "keywords": ["solvent"], "explain": "The solvent is the liquid that the solute dissolves into.", "src": "L|The substance that it dissolves into is called the solvent."}, {"id": "y8c02-o003", "type": "short", "topic": "2.1", "source": "opus", "q": "What is the mixture called that forms when a solute dissolves in a solvent?", "answer": "A solution.", "keywords": ["solution"], "explain": "A solute dissolved in a solvent makes a solution.", "src": "L|You are left with a colourless solution."}, {"id": "y8c02-o004", "type": "short", "topic": "2.1", "source": "opus", "q": "In a mixture of sugar and water, which substance is the solute?", "answer": "The sugar.", "keywords": ["sugar"], "explain": "The sugar is the substance that dissolves, so it is the solute.", "src": "L|So, in our example, the colourless solution is a mixture of sugar and water."}, {"id": "y8c02-o005", "type": "short", "topic": "2.1", "source": "opus", "q": "In a mixture of sugar and water, which substance is the solvent?", "answer": "The water.", "keywords": ["water"], "explain": "The water is the substance the sugar dissolves into, so it is the solvent.", "src": "L|So, in our example, the colourless solution is a mixture of sugar and water."}, {"id": "y8c02-o006", "type": "short", "topic": "2.1", "source": "opus", "q": "Is a solution a mixture or a compound?", "answer": "A mixture.", "keywords": ["mixture"], "explain": "The solute and solvent are not chemically joined, so a solution is a mixture.", "src": "L|So, in our example, the colourless solution is a mixture of sugar and water."}, {"id": "y8c02-o007", "type": "short", "topic": "2.1", "source": "opus", "q": "When sugar dissolves in water it seems to disappear. Has it really gone?", "answer": "No, the sugar is still there.", "keywords": ["no", "still there"], "explain": "Dissolving spreads the sugar out; it does not destroy it.", "src": "L|Although the sugar seems to disappear, it is still there."}, {"id": "y8c02-o008", "type": "short", "topic": "2.1", "source": "opus", "q": "What has happened to the sugar particles once the sugar has dissolved?", "answer": "They have spread out among the water particles.", "keywords": ["spread out", "water particles"], "explain": "The sugar particles mix evenly among the water particles.", "src": "L|The sugar particles have simply spread out among the water particles."}, {"id": "y8c02-o046", "type": "short", "topic": "2.2", "source": "opus", "q": "When is a solution made?", "answer": "When a solute is dissolved in a solvent.", "keywords": ["solute", "solvent"], "explain": "A solution needs both a solute and a solvent.", "src": "L|A solution is made when a solute is dissolved in a solvent."}, {"id": "y8c02-o047", "type": "short", "topic": "2.2", "source": "opus", "q": "Which has more dissolved solute particles, a concentrated solution or a dilute solution?", "answer": "A concentrated solution.", "keywords": ["concentrated"], "explain": "Concentrated means more solute particles in the same volume.", "src": "L|More particles of the solute are dissolved in a concentrated solution than in a dilute solution."}, {"id": "y8c02-o048", "type": "short", "topic": "2.2", "source": "opus", "q": "What word describes a solution that contains a lot of solute particles?", "answer": "Concentrated.", "keywords": ["concentrated"], "explain": "A concentrated solution of sugar has a lot of sugar particles.", "src": "L|A concentrated solution of sugar has a lot of sugar particles."}, {"id": "y8c02-o106", "type": "short", "topic": "2.3", "source": "opus", "q": "What name is given to the different things that could affect the results of an investigation?", "answer": "Variables.", "keywords": ["variables"], "explain": "Anything that could change and affect the result is a variable.", "src": "L|They are trying to think of all the different things that could affect the results."}, {"id": "y8c02-o107", "type": "short", "topic": "2.3", "source": "opus", "q": "What are the students investigating in Topic 2.3?", "answer": "How temperature affects the amount of salt that will dissolve in water.", "keywords": ["temperature", "salt", "dissolve"], "explain": "Temperature is changed and the amount of dissolved salt is measured.", "src": "L|These students are discussing how they will investigate how temperature affects the amount of salt that will dissolve in water."}, {"id": "y8c02-o108", "type": "short", "topic": "2.3", "source": "opus", "q": "What volume of water do the students use in each test?", "answer": "50 cm3.", "keywords": ["50"], "explain": "They dissolve salt in 50 cm3 of water each time.", "src": "L|They decide to count the number of spatulas of salt (sodium chloride) that will dissolve in 50cm3 of water."}, {"id": "y8c02-o109", "type": "short", "topic": "2.3", "source": "opus", "q": "What range of temperatures do the students use?", "answer": "From 20 degrees Celsius to 80 degrees Celsius.", "keywords": ["20", "80"], "explain": "The range is the lowest and highest values used.", "src": "L|They will repeat the experiment at different temperatures from 20°C to 80°C."}, {"id": "y8c02-o110", "type": "short", "topic": "2.3", "source": "opus", "q": "Which variable do the students change?", "answer": "The temperature of the water.", "keywords": ["temperature"], "explain": "The variable you deliberately change is the independent variable.", "src": "L|The variable they change is the temperature of the water."}, {"id": "y8c02-o111", "type": "short", "topic": "2.3", "source": "opus", "q": "Which variable do the students measure?", "answer": "The number of spatulas of salt that dissolve.", "keywords": ["spatulas", "salt"], "explain": "This is the variable that depends on the temperature.", "src": "L|They will count the number of spatulas of salt that will dissolve."}, {"id": "y8c02-o112", "type": "short", "topic": "2.3", "source": "opus", "q": "Which variable do the students keep the same?", "answer": "The volume of water.", "keywords": ["volume", "water"], "explain": "Keeping the volume of water the same makes the test fair.", "src": "L|The volume of water is the variable that the students keep the same, to ensure that the test is fair."}, {"id": "y8c02-o116", "type": "short", "topic": "2.3", "source": "opus", "q": "Which axis of a graph does the independent variable go on?", "answer": "The horizontal axis.", "keywords": ["horizontal", "x"], "explain": "The independent variable always goes along the horizontal axis.", "src": "L|When you plot a graph of your results, the independent variable always goes along the horizontal axis."}, {"id": "y8c02-o117", "type": "short", "topic": "2.3", "source": "opus", "q": "Which axis of a graph does the dependent variable go on?", "answer": "The vertical axis.", "keywords": ["vertical", "y"], "explain": "The dependent variable always goes up the vertical axis.", "src": "L|The dependent variable always goes up the vertical axis."}, {"id": "y8c02-o118", "type": "short", "topic": "2.3", "source": "opus", "q": "In the salt investigation, what is the independent variable?", "answer": "The temperature of the water.", "keywords": ["temperature"], "explain": "Temperature is the variable being changed.", "src": "L|Which variable is the independent variable in the students’ investigation?"}, {"id": "y8c02-o142", "type": "short", "topic": "2.4", "source": "opus", "q": "Black ink looks like one colour. What is it really?", "answer": "A mixture of different coloured inks.", "keywords": ["mixture"], "explain": "Several coloured inks together look black.", "src": "L|In fact, it is a mixture of different coloured inks."}, {"id": "y8c02-o143", "type": "short", "topic": "2.4", "source": "opus", "q": "Which technique is used to separate the coloured inks in black ink?", "answer": "Paper chromatography.", "keywords": ["chromatography"], "explain": "Paper chromatography separates dissolved substances.", "src": "L|You can separate out the coloured inks by using a technique called paper chromatography."}, {"id": "y8c02-o144", "type": "short", "topic": "2.4", "source": "opus", "q": "What kind of paper is used for chromatography?", "answer": "Special paper, a bit like filter paper.", "keywords": ["filter paper", "special"], "explain": "Chromatography paper behaves like filter paper.", "src": "L|Special paper, a bit like filter paper, is used."}, {"id": "y8c02-o145", "type": "short", "topic": "2.4", "source": "opus", "q": "What happens to the water in the beaker during chromatography?", "answer": "It soaks up into the paper.", "keywords": ["soaks", "up"], "explain": "The solvent travels up the paper by capillary action.", "src": "L|The water in the beaker has soaked up into the paper."}, {"id": "y8c02-o146", "type": "short", "topic": "2.4", "source": "opus", "q": "What happens to the coloured inks as the water moves up the paper?", "answer": "They separate out.", "keywords": ["separate"], "explain": "Different inks are carried different distances.", "src": "L|As the water moves up the paper, the different coloured inks that make black ink separate out."}, {"id": "y8c02-w001", "type": "mcq", "topic": "2.1", "source": "opus", "q": "20 g of salt is added to 100 g of water. The salt dissolves and seems to disappear. What has happened to it?", "options": ["The salt particles have spread out between the water particles to form a solution", "The salt particles have been destroyed by the water", "The salt particles have turned into water particles", "The salt particles have floated out of the beaker as a gas"], "answer": 0, "explain": "Nothing is lost when something dissolves. Weigh the beaker before and after and the mass is the same; the salt is still there, just too spread out to see.", "src": "W|When 20 g of salt is added to a beaker containing 100 g of water the salt dissolves and seems to disappear as a solution is formed."}, {"id": "y8c02-w002", "type": "mcq", "topic": "2.1", "source": "opus", "q": "What is the difference between dissolving and melting?", "options": ["Dissolving needs a solvent; melting only needs the solid to be heated", "Dissolving happens to metals and melting happens to salts", "Melting needs a solvent; dissolving only needs heating", "They are two words for exactly the same change"], "answer": 0, "explain": "Sugar melts on its own if you heat it hard enough. Sugar dissolves only if you put it in something, such as water.", "src": "W|Explain the difference between the terms dissolving and melting."}, {"id": "y8c02-w004", "type": "mcq", "topic": "2.2", "source": "opus", "q": "Solution A has more solute particles in it than solution B. What does that make solution A?", "options": ["More concentrated than solution B", "More dilute than solution B", "Less soluble than solution B", "More transparent than solution B"], "answer": 0, "explain": "Concentration is about how many solute particles there are in a given volume of solvent.", "src": "W|Solution A is more than solution B."}, {"id": "y8c02-w005", "type": "mcq", "topic": "2.2", "source": "opus", "q": "Sofia adds more and more copper sulfate to a beaker of water until no more will dissolve. What has she made?", "options": ["A saturated solution of copper sulfate", "A pure sample of copper sulfate", "A suspension of copper sulfate", "A dilute solution of copper sulfate"], "answer": 0, "explain": "Saturated means the solvent is holding as much solute as it can at that temperature. Any extra just sits on the bottom.", "src": "W|Sofia has added more and more copper sulfate to a beaker of water until no more will dissolve."}, {"id": "y8c02-w023", "type": "fill", "topic": "2.1", "source": "opus", "q": "A substance that will not dissolve in water is said to be ____.", "answer": ["insoluble"], "explain": "Sand and chalk are both insoluble in water.", "src": "W|A substance that will not dissolve in water is ."}, {"id": "y8c02-w025", "type": "fill", "topic": "2.2", "source": "opus", "q": "Copper sulfate dissolves in water, so copper sulfate is said to be ____.", "answer": ["soluble"], "explain": "Solubility is measured as the mass that will dissolve in 100 g of solvent.", "src": "W|Copper sulfate dissolves in water so it is said to be"}, {"id": "y8c02-w027", "type": "fill", "topic": "2.3", "source": "opus", "q": "The variable you measure in order to see the effect is called the ____ variable.", "answer": ["dependent"], "explain": "It is called dependent because its value depends on what you did to the independent variable.", "src": "W|Name the dependent variable in the investigation."}, {"id": "y8c02-w029", "type": "fill", "topic": "2.4", "source": "opus", "q": "Separating the substances in a mixture by letting a solvent carry them up a piece of paper is called ____.", "answer": ["chromatography"], "explain": "Substances that dissolve better in the solvent travel further up the paper.", "src": "W|She places drops of the drink on chromatography paper."}, {"id": "qwen-01-01", "type": "mcq", "topic": "2.1", "source": "qwen", "q": "In a mixture of sugar and water, what is the name for the substance that dissolves?", "explain": "The substance which dissolves is called the solute.", "src": "L|The substance that dissolves is called the solute.", "options": ["Solvent", "Solute", "Solution", "Mixture"], "answer": 1}, {"id": "qwen-01-03", "type": "mcq", "topic": "2.1", "source": "qwen", "q": "What property do all solutions have?", "explain": "All solutions are transparent, meaning you can see through them.", "src": "L|All solutions are transparent.", "options": ["They are opaque", "They are transparent", "They are always colourless", "They are solid"], "answer": 1}, {"id": "qwen-01-04", "type": "fill", "topic": "2.1", "source": "qwen", "q": "Milk is not a solution because it is ____ and you cannot see through it.", "explain": "Milk is opaque, which means you cannot see through it, so it is not a solution.", "src": "L|A liquid such as milk is not transparent. You cannot see through it. It is opaque.", "answer": ["opaque"]}, {"id": "qwen-01-06", "type": "fill", "topic": "2.2", "source": "qwen", "q": "A solution with a lot of solute particles is called a ____ solution.", "explain": "A concentrated solution as one with more solute particles than a dilute solution.", "src": "L|More particles of the solute are dissolved in a concentrated solution than in a dilute solution.", "answer": ["concentrated"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "2.2", "source": "qwen", "q": "What is the name for a solution where no more solid will dissolve?", "explain": "If you keep adding a soluble solid until no more dissolves, you have made a saturated solution.", "src": "L|You have made a saturated solution.", "options": ["Dilute", "Saturated", "Concentrated", "Insoluble"], "answer": 1}, {"id": "qwen-02-03", "type": "mcq", "topic": "2.2", "source": "qwen", "q": "Which of these substances is insoluble in water?", "explain": "Iron filings do not dissolve in water at all, so they are insoluble. Sodium chloride, sugar and copper sulfate all dissolve.", "src": "L|Iron filings are insoluble in water.", "options": ["Iron filings", "Sodium chloride", "Sugar", "Copper sulfate"], "answer": 0}, {"id": "qwen-03-01", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "What is the name of the image produced on paper after separating ink colours using a solvent?", "explain": "The resulting image on the paper is called a chromatogram.", "src": "L|The resulting image on the paper is called a chromatogram.", "options": ["Chromatogram", "Solvent front", "Filter paper", "Spatula"], "answer": 0}, {"id": "qwen-03-03", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "Why do different coloured inks separate from each other on the paper?", "explain": "This is because not all the ink particles have the same solubility.", "src": "L|not all the ink particles have the same solubility", "options": ["They have different solubilities", "The water is too hot", "The paper is wet", "They are different weights"], "answer": 0}, {"id": "qwen-03-04", "type": "fill", "topic": "2.3", "source": "qwen", "q": "In an investigation, the variable that you change is called the ____ variable.", "explain": "This term: 'The variable you change is called the independent variable.'", "src": "L|The variable you change is called the independent variable.", "answer": ["independent"]}, {"id": "qwen-03-05", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "In a graph of investigation results, which variable is plotted on the vertical axis?", "explain": "The dependent variable always goes up the vertical axis.", "src": "L|The dependent variable always goes up the vertical axis.", "options": ["Dependent variable", "Independent variable", "Control variable", "Range"], "answer": 0}, {"id": "qwen-03-06", "type": "fill", "topic": "2.3", "source": "qwen", "q": "Variables that are kept the same to ensure a fair test are called ____ variables.", "explain": "The variables you keep the same are the control variables.", "src": "L|The variables you keep the same are the control variables.", "answer": ["control"]}, {"id": "qwen-03-11", "type": "fill", "topic": "2.4", "source": "qwen", "q": "Scientists use chromatography to check if food dyes contain substances that could be ____ or cause allergic reactions.", "explain": "We need to know if any substances could be a health risk; for example, they could be toxic.", "src": "L|they could be toxic or cause allergic reactions", "answer": ["toxic"]}, {"id": "qwenw-01-01", "type": "mcq", "topic": "2.2", "source": "qwen", "q": "What is the term for a substance that will not dissolve in water?", "explain": "A substance that will not dissolve in water is insoluble.", "src": "W|A substance that will not dissolve in water is .", "options": ["soluble", "insoluble", "saturated", "diluted"], "answer": 1}, {"id": "qwenw-01-02", "type": "fill", "topic": "2.2", "source": "qwen", "q": "If a solution has more solute particles than another, it is described as being more ____.", "explain": "A solution with more solute particles is more concentrated.", "src": "W|Solution A has more solute particles in it than solution B. Solution A is more", "answer": ["concentrated"]}, {"id": "qwenw-01-06", "type": "fill", "topic": "2.3", "source": "qwen", "q": "Marcus and Sofia investigate how much salt dissolves in different volumes of water. The volume of water is the ____ variable.", "explain": "The volume of water is the one thing they deliberately change, so it is the independent variable. The mass of salt that dissolves is the dependent variable.", "src": "W|The volume of water they use is the independent variable.", "answer": ["independent"]}, {"id": "qwenw-01-08", "type": "fill", "topic": "2.1", "source": "qwen", "q": "When salt is added to water and dissolves, the resulting liquid is called a ____.", "explain": "When salt dissolves in water, a solution is formed.", "src": "W|the salt dissolves and seems to disappear as a solution is formed.", "answer": ["solution"]}, {"id": "qwenw-01-10", "type": "fill", "topic": "2.1", "source": "qwen", "q": "The liquid in which a solute dissolves is called the ____.", "explain": "A solute is the substance that dissolves, the solvent is the liquid it dissolves in, and together they make a solution.", "src": "W|solvent", "answer": ["solvent"]}, {"id": "qwenw-02-01", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "In the investigation comparing salts X and Y, what is the independent variable?", "explain": "The independent variable is the factor that is changed on purpose. Here, Arun and Marcus are changing which salt they use (X or Y) to see how it affects solubility.", "src": "W|Arun and Marcus are asked to compare the solubility of two salts in water at room temperature. The two salts are labelled X and Y.", "options": ["The type of salt used", "The mass of salt dissolved", "The temperature of the water", "The volume of water used"], "answer": 0}, {"id": "qwenw-03-01", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "What is the name of the technique used to separate mixtures by moving a solvent up paper?", "explain": "Paper chromatography separates a mixture by letting a solvent move up the paper, carrying the different colourings different distances.", "src": "W|2.4 Paper chromatography", "options": ["Paper chromatography", "Filtration", "Evaporation", "Distillation"], "answer": 0}, {"id": "qwenw-03-02", "type": "fill", "topic": "2.4", "source": "qwen", "q": "In paper chromatography, a solvent such as ____ is used to carry the colourings up the paper.", "explain": "The solvent soaks up through the paper and carries the dissolved colourings with it, and water is the solvent used for colourings that dissolve in it.", "src": "W|She uses water to allow the colouring to separate.", "answer": ["wate (function(){
