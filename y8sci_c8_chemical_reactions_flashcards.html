<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 8 — Chemical reactions — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>
</head>

c": "8.5", "source": "opus", "image": "img/L_p30_spirit_burner.png", "figure": "L_p30_spirit_burner", "q": "Click on the thermometer in the diagram.", "caption": "Apparatus for comparing the thermal energy given out by different fuels.", "target": {"x": 40, "y": 30, "r": 6}, "explain": "The thermometer is labelled on this diagram in the textbook.", "src": "L|thermometer"}, {"id": "y8c08-f09h2", "type": "hotspot", "topic": "8.5", "source": "opus", "image": "img/L_p30_spirit_burner.png", "figure": "L_p30_spirit_burner", "q": "Click on the water in the diagram.", "caption": "Apparatus for comparing the thermal energy given out by different fuels.", "target": {"x": 26, "y": 48, "r": 6}, "explain": "The water is labelled on this diagram in the textbook.", "src": "L|water"}, {"id": "y8c08-f09h3", "type": "hotspot", "topic": "8.5", "source": "opus", "image": "img/L_p30_spirit_burner.png", "figure": "L_p30_spirit_burner", "q": "Click on the spirit burner in the diagram.", "caption": "Apparatus for comparing the thermal energy given out by different fuels.", "target": {"x": 34, "y": 78, "r": 5}, "explain": "The spirit burner is labelled on this diagram in the textbook.", "src": "L|spirit burner"}, {"id": "y8c08-m001", "type": "mcq", "topic": "8.1", "source": "opus", "q": "What is burning?", "options": ["A chemical reaction in which a substance combines with oxygen", "A physical change in which a substance melts", "A reaction in which a substance combines with water", "A reaction that absorbs thermal energy"], "answer": 0, "explain": "Burning is also called combustion.", "src": "L|Burning is a chemical reaction in which a substance combines with oxygen."}, {"id": "y8c08-m027", "type": "mcq", "topic": "8.2", "source": "opus", "q": "What do some chemical reactions do with thermal energy from their surroundings?", "options": ["They absorb it and change it to chemical energy stored in the chemical bonds", "They give it out as light", "They destroy it completely", "They change it into new atoms"], "answer": 0, "explain": "These are called endothermic reactions.", "src": "L|Some chemical reactions absorb thermal energy from their surroundings and change it to chemical energy stored in the chemical bonds."}, {"id": "y8c08-m056", "type": "mcq", "topic": "8.3", "source": "opus", "q": "What do many metals do if they get hot enough?", "options": ["They react with oxygen", "They melt without reacting", "They absorb water", "They turn into acids"], "answer": 0, "explain": "The product is the metal oxide.", "src": "L|Many metals react with oxygen if they get hot enough."}, {"id": "y8c08-m079", "type": "mcq", "topic": "8.4", "source": "opus", "q": "Why is sandpaper used on the metal before placing it in water?", "options": ["To clean the surface of the metal", "To make the metal thinner", "To make the metal hotter", "To weigh the metal"], "answer": 0, "explain": "A clean surface lets the metal react with the water directly.", "src": "L|Use sandpaper to clean the surface of the metal."}, {"id": "y8c08-m097", "type": "mcq", "topic": "8.4", "source": "opus", "q": "Why is copper used for the roofs of some buildings and magnesium is not?", "options": ["Copper does not react with water but magnesium does", "Copper is lighter than magnesium", "Magnesium is more expensive than copper", "Copper conducts electricity better"], "answer": 0, "explain": "A roof must survive rain without reacting away.", "src": "W|Using the information above, explain why copper is used for the roofs of some buildings and magnesium is not."}, {"id": "y8c08-m099", "type": "mcq", "topic": "8.5", "source": "opus", "q": "What are the products when magnesium reacts with hydrochloric acid?", "options": ["Magnesium chloride and hydrogen", "Magnesium oxide and water", "Magnesium hydroxide and oxygen", "Magnesium and chlorine"], "answer": 0, "explain": "Magnesium chloride is an example of a salt.", "src": "L|magnesium + hydrochloric acid magnesium chloride + hydrogen"}, {"id": "y8c08-m103", "type": "mcq", "topic": "8.5", "source": "opus", "q": "What did Arun and Marcus watch for to compare the reactivity of the metals with acid?", "options": ["How many bubbles each metal produces", "How hot each test tube became", "How much the metal changed colour", "How long each metal took to dissolve completely"], "answer": 0, "explain": "More bubbles in the same time means a more reactive metal.", "src": "W|They watch to see how many bubbles it produces."}, {"id": "y8c08-m109", "type": "fill", "topic": "8.1", "source": "opus", "q": "Burning is a chemical reaction in which a substance combines with ____.", "answer": ["oxygen"], "explain": "Burning is also called combustion.", "src": "L|Burning is a chemical reaction in which a substance combines with oxygen."}, {"id": "y8c08-m117", "type": "fill", "topic": "8.2", "source": "opus", "q": "Reactions that absorb thermal energy from their surroundings are called ____ reactions.", "answer": ["endothermic"], "explain": "The temperature at the end is lower than at the start.", "src": "L|These are called endothermic reactions."}, {"id": "y8c08-m125", "type": "fill", "topic": "8.3", "source": "opus", "q": "Sodium, potassium and calcium are so reactive that they have to be stored under ____.", "answer": ["oil"], "explain": "Oil keeps air and water away from the metal.", "src": "L|These metals are so reactive that they have to be stored under oil to prevent them reacting."}, {"id": "y8c08-m132", "type": "fill", "topic": "8.4", "source": "opus", "q": "The general word equation for a metal reacting with water is metal + water -> metal ____ + hydrogen.", "answer": ["hydroxide"], "explain": "Sodium and potassium both follow this pattern.", "src": "L|metal + water metal hydroxide + hydrogen"}, {"id": "y8c08-m138", "type": "fill", "topic": "8.5", "source": "opus", "q": "Magnesium chloride is an example of a ____.", "answer": ["salt"], "explain": "Every metal + acid reaction makes a salt.", "src": "L|Magnesium chloride is an example of a salt."}, {"id": "y8c08-m141", "type": "fill", "topic": "8.5", "source": "opus", "q": "The metals produce ____ when they are added to dilute hydrochloric acid.", "answer": ["hydrogen"], "explain": "Timing how long it takes to collect the gas compares reactivity.", "src": "W|The metals produce hydrogen when they are added to dilute hydrochloric acid."}, {"id": "y8c08-r001", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain why burning is described as a chemical reaction and not just a physical change.", "answer": "In burning, the substance combines with oxygen and the atoms rearrange to form a completely new substance, an oxide. A physical change would leave the same substance behind, but after burning the original substance is gone, so it is a chemical reaction.", "keywords": ["combines with oxygen", "atoms rearrange", "new substance", "oxide"], "explain": "The test is whether a new substance is made, not whether heat is involved.", "src": "L|Burning is a chemical reaction in which a substance combines with oxygen."}, {"id": "y8c08-r002", "type": "short", "topic": "8.1", "source": "opus", "q": "Trace the energy changes that happen when a fuel such as wood burns.", "answer": "The chemical energy stored in the fuel is changed into thermal, light and sound energy. That energy then dissipates, which means it spreads out into the surroundings, so the temperature of the surroundings rises.", "keywords": ["chemical energy", "thermal", "light", "dissipate", "surroundings"], "explain": "Name the store it starts in and where it ends up.", "src": "L|When the fuel burns, the chemical energy is changed to thermal, light and sound energy."}, {"id": "y8c08-r003", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain why a fire goes out if you smother it with a damp blanket.", "answer": "Burning requires three things together: oxygen, fuel and heat. A blanket cuts off the supply of oxygen from the air, so even though fuel and heat are still there the reaction cannot continue.", "keywords": ["oxygen", "fuel", "heat", "cuts off", "cannot continue"], "explain": "Remove any one of the three and the reaction stops.", "src": "L|Burning requires oxygen, fuel and heat (thermal energy)"}, {"id": "y8c08-r004", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain what makes a reaction exothermic, using burning as your example.", "answer": "In an exothermic reaction thermal energy is given out. When a fuel burns, the atoms of carbon and oxygen join together in new ways, chemical energy is changed to thermal energy and the temperature rises, so energy is leaving the reaction and going into the surroundings.", "keywords": ["given out", "thermal energy", "temperature rises", "surroundings"], "explain": "Exothermic is defined by the direction the energy travels.", "src": "L|A chemical reaction in which thermal energy is given out is called an exothermic reaction."}, {"id": "y8c08-r005", "type": "short", "topic": "8.1", "source": "opus", "q": "Describe the evidence you would look for to show that burning is exothermic.", "answer": "You would look for a rise in temperature of the surroundings: the flame feels hot, a thermometer near it reads higher, and light and sound are also given out. All of these show energy leaving the reaction rather than being taken in.", "keywords": ["temperature rises", "feels hot", "energy given out", "surroundings"], "explain": "Evidence for exothermic is always about the surroundings getting hotter.", "src": "L|How can you tell that burning is an exothermic reaction?"}, {"id": "y8c08-r006", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain, in terms of atoms, where the energy comes from when hydrogen burns.", "answer": "The hydrogen and oxygen combine to form water. When the atoms of hydrogen and oxygen rearrange themselves and combine together, energy is given out, so the energy was stored in the chemical bonds of the original substances and is released when those bonds are rearranged.", "keywords": ["rearrange", "combine", "energy given out", "stored", "bonds"], "explain": "Energy is not created; it is released from the chemical store.", "src": "L|When the atoms of hydrogen and oxygen rearrange themselves and combine together, energy is given out."}, {"id": "y8c08-r007", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain how the burning of hydrogen inside a bottle makes the bottle shoot along a string.", "answer": "The reaction gives out a lot of energy very quickly, which pushes the stopper out of the bottle. The chemical energy is changed into kinetic energy as well as thermal, sound and light, and the kinetic energy makes the bottle move very quickly along the string.", "keywords": ["gives out energy", "stopper pushed out", "kinetic energy", "moves"], "explain": "The same reaction supplies several forms of energy at once.", "src": "L|The reaction gives out a lot of energy and the stopper is pushed out."}, {"id": "y8c08-r008", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain why a spark is needed to start the hydrogen reaction, even though the reaction gives out energy.", "answer": "The hot spark provides the energy needed to start the reaction. A reaction can be exothermic overall and still need a small input of energy to get going; once started, the energy it gives out keeps it going.", "keywords": ["spark", "energy to start", "still exothermic", "keeps going"], "explain": "Needing a starter does not make a reaction endothermic.", "src": "L|The hot spark provides the energy to start the reaction."}, {"id": "y8c08-r009", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain why burning magnesium is called an oxidation reaction as well as an exothermic reaction.", "answer": "It is an oxidation reaction because the magnesium combines with oxygen and a new substance, magnesium oxide, is formed. It is also exothermic because energy is given out as heat and light as the magnesium and oxygen atoms rearrange themselves. The two names describe different things: what reacts, and which way the energy goes.", "keywords": ["combines with oxygen", "oxide formed", "energy given out", "heat and light"], "explain": "One reaction can belong to more than one category.", "src": "L|Any reaction in which a substance combines with oxygen is an oxidation reaction."}, {"id": "y8c08-r010", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain why the temperature of the surroundings rises when potassium reacts with water.", "answer": "The bonds between the atoms of oxygen and hydrogen in the water break and the atoms rearrange to form potassium hydroxide and hydrogen. Stored chemical energy is changed to thermal energy, which dissipates into the environment, so the surroundings get hotter.", "keywords": ["bonds break", "rearrange", "chemical energy", "thermal energy", "dissipates"], "explain": "Bond breaking and making is where the energy change happens.", "src": "L|Stored chemical energy is changed to thermal energy, which dissipates into the environment."}, {"id": "y8c08-r011", "type": "short", "topic": "8.1", "source": "opus", "q": "A test tube gets hot when magnesium is added to dilute hydrochloric acid. Explain what this tells you about the reaction.", "answer": "It tells you the reaction is exothermic. Thermal energy is being given out by the reaction and transferred to the test tube and the surroundings, so their temperature rises. If the reaction were endothermic the test tube would feel cold instead.", "keywords": ["exothermic", "given out", "transferred", "temperature rises"], "explain": "The feel of the tube is a reading of the energy direction.", "src": "L|If you add magnesium to dilute hydrochloric acid the test tube gets hot."}, {"id": "y8c08-r012", "type": "short", "topic": "8.1", "source": "opus", "q": "Marcus got a higher final temperature than Sofia in the same reaction. Explain why that does not prove more chemical energy was changed to thermal energy in his experiment.", "answer": "The final temperature depends on the starting temperature as well as the energy released, so what matters is the temperature rise, not the final reading. They also may have lost different amounts of heat to the surroundings, so the two final temperatures are not a fair comparison on their own.", "keywords": ["temperature rise", "starting temperature", "heat loss", "not a fair comparison"], "explain": "Comparing final readings instead of changes is a classic trap.", "src": "L|Sofi a thought that both reactions changed the same amount of chemical energy to thermal energy."}, {"id": "y8c08-r013", "type": "short", "topic": "8.1", "source": "opus", "q": "Sofia and Marcus want a larger temperature change. Explain how you would turn 'use a different metal' into an investigation they could actually carry out.", "answer": "You would write it as a question with one variable to change and one to measure, such as 'Which metal gives the largest temperature rise when added to dilute hydrochloric acid?' Everything else — the volume and concentration of acid, the mass of metal, the type of container and the starting temperature — must be kept the same so the temperature change can be linked to the metal alone.", "keywords": ["one variable", "temperature rise", "keep the same", "volume", "mass"], "explain": "A scientific question names the variable that changes and the one that is measured.", "src": "L|Their ideas included adding more magnesium, using a different metal and using a different acid."}, {"id": "y8c08-r014", "type": "short", "topic": "8.1", "source": "opus", "q": "Explain why safety glasses must be worn when magnesium is added to dilute hydrochloric acid.", "answer": "The reaction gives out thermal energy and produces hydrogen gas, so the mixture bubbles and can spit. Acid splashed into the eye would cause serious damage, and the eye cannot be washed as easily as skin, so eye protection is essential.", "keywords": ["acid", "spit", "bubbles", "eye", "damage"], "explain": "Link the hazard to the specific thing the reaction does.", "src": "L|Explain why it is a good idea to wear safety glasses whilst carrying out this investigation."}, {"id": "y8c08-r015", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain what happens to energy in an endothermic reaction.", "answer": "Thermal energy is absorbed from the surroundings and changed to chemical energy stored in the chemical bonds of the products. Because energy is being taken out of the surroundings, the surroundings get colder.", "keywords": ["absorb", "surroundings", "chemical energy", "bonds", "colder"], "explain": "Endothermic is the mirror image of exothermic.", "src": "L|Some chemical reactions absorb thermal energy from their surroundings and change it to chemical energy stored in the chemical bonds."}, {"id": "y8c08-r016", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain how you can tell from a thermometer that a reaction is endothermic.", "answer": "The temperature at the end of the reaction is lower than that at the start. Because the reaction is taking thermal energy out of the mixture and its surroundings, the reading falls rather than rises.", "keywords": ["lower", "end", "start", "takes energy", "falls"], "explain": "The direction of the temperature change is the diagnostic.", "src": "L|When an endothermic reaction takes place, the temperature at the end of the reaction is lower than that at the start of the reaction."}, {"id": "y8c08-r017", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why a test tube feels cooler when sodium hydrogen carbonate reacts with citric acid.", "answer": "During this reaction thermal energy is absorbed from the surroundings and stored in the form of chemical bonds. The test tube and the air around it are the surroundings, so they lose thermal energy and their temperature falls, making the tube feel cool.", "keywords": ["absorbed", "surroundings", "chemical bonds", "temperature falls"], "explain": "Your hand senses that energy has left it, not that 'cold' entered.", "src": "L|So, if this reaction was carried out in a test tube, the surroundings will have a lower temperature and the test tube will feel cooler."}, {"id": "y8c08-r018", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why sherbet sweets give a cool, fizzy feeling in your mouth.", "answer": "The sherbet is a mixture of dry citric acid and sodium hydrogen carbonate. These do not react while dry, but in your mouth they dissolve in your saliva and react together. The reaction is endothermic, absorbing thermal energy from your mouth, and the carbon dioxide produced gives the fizz.", "keywords": ["dissolve", "saliva", "react", "endothermic", "absorbs energy", "carbon dioxide"], "explain": "Two separate facts explain the two separate sensations.", "src": "L|When you eat the sweets, these substances dissolve in your saliva, and react together."}, {"id": "y8c08-r019", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why sherbet can be stored dry in a packet without reacting.", "answer": "The citric acid and sodium hydrogen carbonate are both solids and cannot mix properly at the particle level while dry. They only react once they dissolve in a liquid such as saliva, which lets their particles move and meet, so the packet stays unreacted.", "keywords": ["dry solids", "dissolve", "particles move", "meet", "saliva"], "explain": "Dissolving is what puts the reacting particles in contact.", "src": "L|The sherbet is a mixture of dry citric acid and sodium hydrogen carbonate."}, {"id": "y8c08-r020", "type": "short", "topic": "8.2", "source": "opus", "q": "Stirring potassium chloride into water makes the beaker feel cold, yet no reaction has happened. Explain this.", "answer": "No new substances are formed — the potassium chloride simply dissolves, giving a solution in which potassium chloride is the solute and water the solvent. Dissolving still absorbs thermal energy from the surroundings, so it is an endothermic process rather than an endothermic reaction.", "keywords": ["no new substances", "dissolves", "solute", "solvent", "endothermic process"], "explain": "Endothermic processes and endothermic reactions differ in whether new substances appear.", "src": "L|In this case, no chemical reaction has taken place."}, {"id": "y8c08-r021", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why melting ice is called an endothermic process and not an endothermic reaction.", "answer": "Thermal energy is absorbed from the surroundings as the solid ice changes to liquid water, which makes it endothermic. But no new substance is formed — it is still water, just in a different state — so it is a process and not a reaction.", "keywords": ["absorbs energy", "change of state", "no new substance", "still water"], "explain": "Same substance, different state, equals process.", "src": "L|Why is ice melting called an endothermic process and not an endothermic reaction?"}, {"id": "y8c08-r022", "type": "short", "topic": "8.2", "source": "opus", "q": "Use particle theory to explain what the absorbed energy does when ice melts.", "answer": "The particles in the ice are lined up in rows and can only vibrate about fixed positions. As they absorb thermal energy from the surroundings they vibrate more and more, and when they have enough energy they can move and overcome the forces holding them in place, so the solid becomes a liquid.", "keywords": ["vibrate", "fixed positions", "absorb energy", "overcome forces", "move"], "explain": "The energy goes into breaking the hold between particles, not into raising temperature.", "src": "L|When the particles have enough energy, they can move and overcome the forces holding them in place."}, {"id": "y8c08-r023", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why you feel cold when you come out of a swimming pool, even on a warm day.", "answer": "The water on your skin evaporates, and evaporation is an endothermic process — the particles need to absorb energy to escape from the liquid. That energy comes from your skin, which therefore loses thermal energy and feels cold.", "keywords": ["evaporates", "endothermic", "absorbs energy", "from your skin", "cools"], "explain": "Evaporation cools the surface it leaves from.", "src": "L|Use your understanding of endothermic processes to explain why."}, {"id": "y8c08-r024", "type": "short", "topic": "8.2", "source": "opus", "q": "Suggest whether water freezing is endothermic or exothermic, and explain your reasoning.", "answer": "It is exothermic. Melting absorbs energy to let the particles break free, so the reverse change must give that energy back out as the particles settle into fixed positions again. Energy is released into the surroundings, so freezing is exothermic.", "keywords": ["exothermic", "reverse", "gives out", "surroundings", "fixed positions"], "explain": "Reversing a change reverses the direction of the energy flow.", "src": "L|Suggest whether water freezing is an endothermic or exothermic process."}, {"id": "y8c08-r025", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain how a self-heating can of food works.", "answer": "The can holds calcium oxide and water in two separate sealed compartments. Opening the can breaks the seal between them so they mix and react. That reaction is exothermic, so thermal energy is given out and transferred to the food, heating it without any power supply.", "keywords": ["two compartments", "calcium oxide", "water", "mix and react", "exothermic", "heats the food"], "explain": "Keeping the reactants apart is what lets you choose when the heating starts.", "src": "L|When the water and calcium oxide are mixed together they react, and heat is given off."}, {"id": "y8c08-r026", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why self-heating cans are expensive to produce.", "answer": "The compartments must be sealed from one another and from the food, so that the food does not become contaminated by the chemicals. Making and testing those seals costs far more than making an ordinary can.", "keywords": ["sealed", "from one another", "from the food", "contaminated", "costs more"], "explain": "The cost comes from a safety requirement, not the chemicals.", "src": "L|The cans are expensive to produce because the compartments must be sealed from one another and from the food, so that it does not become contaminated."}, {"id": "y8c08-r027", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain why a self-heating food container can only be used once.", "answer": "Once the seal is broken the calcium oxide and water mix and react, and the reaction changes them into a new substance. The original reactants no longer exist, so there is nothing left to react a second time, and the compartments cannot be re-sealed.", "keywords": ["reactants used up", "new substance", "cannot be re-sealed", "once"], "explain": "A chemical reaction is not undone by putting the can back.", "src": "L|Explain why a self-heating food container can only be used once."}, {"id": "y8c08-r028", "type": "short", "topic": "8.2", "source": "opus", "q": "Explain how a chemical ice pack works and why it needs no freezer.", "answer": "The pack has two compartments, one containing ammonium nitrate and one water. Pushing on the pack breaks the inner compartment so the water mixes with the ammonium nitrate and it begins to dissolve. Dissolving is an endothermic process, so the temperature drops and the pack cools the injury without ever being chilled beforehand.", "keywords": ["two compartments", "ammonium nitrate", "dissolves", "endothermic", "temperature drops"], "explain": "The cold is made on the spot, not stored.", "src": "L|This is an endothermic process, so the temperature drops."}, {"id": "y8c08-r029", "type": "short", "topic": "8.2", "source": "opus", "q": "Compare the advantages and disadvantages of a frozen ice pack and a chemical ice pack.", "answer": "A frozen pack can be refrozen and used again and again, which is cheaper, but it must be stored in a fridge or freezer so it is no use where there is no power. A chemical pack can be used anywhere and needs no freezer, but once the compartment is broken the substances have mixed, so it can only be used once.", "keywords": ["reusable", "needs a freezer", "used anywhere", "once only"], "explain": "Each advantage buys its own disadvantage.", "src": "L|Describe one advantage and one disadvantage of each of the two types of icepack described above."}, {"id": "y8c08-r032", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain how you can tell from these experiments that magnesium is more reactive than iron.", "answer": "Magnesium reacts more quickly with oxygen than iron does, and it needs less encouragement to start. Comparing how fast and how vigorously two metals react with the same substance is how you place them in order of reactivity.", "keywords": ["reacts more quickly", "vigorously", "same substance", "order of reactivity"], "explain": "Reactivity is judged by comparing rates under the same conditions.", "src": "L|For example, magnesium is more reactive than iron because magnesium reacts more quickly than iron."}, {"id": "y8c08-r033", "type": "short", "topic": "8.3", "source": "opus", "q": "Suggest why learners are not given sodium or potassium to heat in a Bunsen flame.", "answer": "These metals are so reactive that they react very quickly with oxygen even without being heated. Heating them would produce a violent reaction that could not be controlled safely in a school laboratory.", "keywords": ["very reactive", "without heating", "violent", "not safe"], "explain": "The reason is the position of these metals in the reactivity order.", "src": "L|3 Suggest why were you not given metals such as sodium or potassium to heat."}, {"id": "y8c08-r034", "type": "short", "topic": "8.3", "source": "opus", "q": "Suggest why learners are not given gold or silver to heat.", "answer": "Gold does not react with oxygen at all and silver reacts only very slowly, so there would be nothing to observe. They are also expensive, so using them in a class experiment would be wasteful for no result.", "keywords": ["do not react", "very slowly", "nothing to observe", "expensive"], "explain": "An experiment that can produce no observation teaches nothing.", "src": "L|4 Suggest why were you not given metals such as gold or silver to heat."}, {"id": "y8c08-r035", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain why a freshly cut piece of sodium is shiny but soon becomes dull.", "answer": "Cutting exposes clean metal, which is shiny. The shiny surface soon becomes dull because the metal reacts with the oxygen in the air, and the surface becomes covered with a new substance, the oxide of the metal.", "keywords": ["freshly cut", "shiny", "reacts with oxygen", "oxide", "dull"], "explain": "The dullness is a new substance, not dirt.", "src": "L|The shiny surface soon becomes dull because the metal reacts with the oxygen in the air."}, {"id": "y8c08-r036", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain why sodium and potassium are stored under oil.", "answer": "They are so reactive that they react with the oxygen and water vapour in the air as soon as they are exposed to it. A layer of oil keeps the air away from the metal surface, so the metal stays unreacted until it is needed.", "keywords": ["so reactive", "air kept away", "oxygen", "water vapour", "unreacted"], "explain": "The oil is a physical barrier to the reactants.", "src": "L|These metals are so reactive that they have to be stored under oil to prevent them reacting."}, {"id": "y8c08-r037", "type": "short", "topic": "8.3", "source": "opus", "q": "The layer of oxide on some metals stops further reaction. Explain why this is useful.", "answer": "The oxide layer covers the surface and prevents any more of the metal from reacting with the air or water vapour. The metal underneath is protected, so the object keeps its strength instead of being eaten away.", "keywords": ["layer", "prevents", "protects the metal underneath", "keeps its strength"], "explain": "A product of the reaction can stop the reaction continuing.", "src": "L|The layer of metal oxide on the surface prevents any more of the metal from reacting with the air or water vapour."}, {"id": "y8c08-r038", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain why the rusting of iron is described as a reaction that is not useful.", "answer": "The iron reacts with oxygen to form iron oxide, so the iron changes and no longer has the same properties. A strong iron girder can become rusted and fall apart, so the reaction destroys exactly the property that made the metal worth using.", "keywords": ["iron oxide", "no longer the same properties", "girder", "fall apart"], "explain": "A reaction is 'useful' or not depending on what it does to the product we want.", "src": "L|This is not a very useful reaction because it means that the iron changes and no longer has the same properties."}, {"id": "y8c08-r039", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain what the four test tubes in the rusting experiment are designed to show.", "answer": "Each tube removes a different condition: tube 3 has calcium chloride to keep the air dry, tube 4 has boiled water with the dissolved gas removed, and the others have both water and air. Comparing them shows that the reaction between iron and oxygen only takes place when both water and oxygen are present.", "keywords": ["removes a condition", "dry air", "boiled water", "both water and oxygen", "compare"], "explain": "Each tube is a control for one variable.", "src": "L|The reaction between iron and oxygen only takes place when both water and oxygen are present."}, {"id": "y8c08-r040", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain why the same type of nail must be used in all four test tubes.", "answer": "The nail is a control variable. If the nails were different — different metal, different size, different coating — a difference in rusting could be caused by the nail instead of by the conditions being tested, so no conclusion about water and oxygen could be drawn.", "keywords": ["control variable", "same", "difference caused by", "conclusion"], "explain": "Only one thing may differ between tubes if the comparison is to mean anything.", "src": "L|Why is the same type of nail used in all test tubes?"}, {"id": "y8c08-r041", "type": "short", "topic": "8.3", "source": "opus", "q": "Using the results of the rusting experiment, explain two ways of preventing iron from rusting.", "answer": "Rusting needs both water and oxygen, so removing either one stops it. You can keep the air away by covering the iron with paint, plastic or oil, or you can galvanise it by covering it with another metal, and keeping the iron dry also prevents the reaction.", "keywords": ["needs water and oxygen", "remove one", "coat", "galvanise", "keep dry"], "explain": "Prevention follows directly from the conditions the reaction needs.", "src": "L|What conditions are needed to prevent iron from rusting?"}, {"id": "y8c08-r042", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain why rusting takes weeks while burning magnesium takes seconds, even though both are oxidation.", "answer": "Both reactions are a metal combining with oxygen, but iron is not very reactive with oxygen, so the reaction takes a long time to happen. Magnesium is much more reactive, so once it is hot enough it reacts very quickly and gives out energy as heat and light.", "keywords": ["both oxidation", "iron not very reactive", "long time", "magnesium more reactive", "quickly"], "explain": "Same type of reaction, very different rate, because of reactivity.", "src": "L|The reaction takes a long time to happen – iron is not very reactive with oxygen."}, {"id": "y8c08-r043", "type": "short", "topic": "8.3", "source": "opus", "q": "Explain why a silver object that is not cleaned goes black over time.", "answer": "Silver reacts slowly with the air, and a thin layer of a new black compound builds up on the surface, so the black colour is a different substance rather than dirt on the silver. Your course calls this compound silver oxide; chemists have since shown that most of the black tarnish is silver sulfide, formed with sulfur compounds in the air. Either way, it is a new substance made by a slow reaction with the air.", "keywords": ["reacts slowly", "silver oxide", "new substance", "surface"], "explain": "Cleaning removes the compound; polishing alone does not stop it forming again.", "src": "L|Silver reacts slowly with the air and if a silver object is not cleaned it goes black over time, as silver oxide is formed."}, {"id": "y8c08-r044", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain why the hydrogen produced when sodium reacts with water often catches fire.", "answer": "So much thermal energy is generated by the reaction that the hydrogen gas produced in the reaction catches fire. The reaction is strongly exothermic, and the heat it releases is enough to ignite the hydrogen it is making at the same time.", "keywords": ["thermal energy", "exothermic", "hydrogen", "ignites"], "explain": "The reaction supplies both the fuel and the heat to light it.", "src": "L|So much thermal energy is generated that the hydrogen gas produced in the reaction catches fire."}, {"id": "y8c08-r045", "type": "short", "topic": "8.4", "source": "opus", "q": "Write the general pattern for a metal reacting with water and explain what it tells you.", "answer": "The metal reacts with water to produce hydrogen and the metal hydroxide. It tells you that whichever reactive metal you use, the same two kinds of product appear, so you can predict the products of a reaction you have not yet seen.", "keywords": ["metal hydroxide", "hydrogen", "same pattern", "predict"], "explain": "A general equation is a prediction tool.", "src": "L|In these two reactions the metal reacted with water to produce hydrogen and the metal hydroxide."}, {"id": "y8c08-r046", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain how you could tell whether calcium or magnesium is more reactive with water.", "answer": "You would compare how vigorously each reacts under the same conditions — how quickly bubbles of hydrogen appear, or how long it takes to collect a fixed volume of gas. The metal that produces gas faster is the more reactive, provided the mass of metal, the volume and temperature of the water and the apparatus are kept the same.", "keywords": ["compare", "how quickly", "bubbles", "same conditions", "fair test"], "explain": "Reactivity must be measured, not just watched.", "src": "L|Some other metals react less vigorously with water – for example, calcium and magnesium."}, {"id": "y8c08-r047", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain which factors must be controlled to make a comparison of calcium and magnesium a fair test.", "answer": "The mass and surface area of the metal, the volume and temperature of the water, and the apparatus used must all be the same. Only the metal should differ, otherwise any difference in the rate of bubbling might be caused by one of the other factors instead.", "keywords": ["mass", "surface area", "volume", "temperature", "only the metal differs"], "explain": "Surface area is the control variable students most often forget.", "src": "L|What factors should you take into account to make this a fair test?"}, {"id": "y8c08-r048", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain how a filter funnel and test tube let you collect the gas from a metal reacting with water.", "answer": "The upside-down funnel over the metal channels all the bubbles upwards into one place instead of letting them escape across the surface. The test tube full of water above it collects the gas by the displacement of water, so the gas pushes the water out and you can see how much has been made.", "keywords": ["funnel", "channels bubbles", "displacement of water", "collects", "measure"], "explain": "Collecting the gas turns a vague observation into a measurement.", "src": "L|The gas given off is collected in a test tube by the displacement of water."}, {"id": "y8c08-r049", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain why magnesium reacts more rapidly with steam than with cold water.", "answer": "The particles in steam have much more energy and move much faster than those in cold water, so they collide with the magnesium surface more often and with more energy. More of those collisions have enough energy to react, so the reaction goes much faster.", "keywords": ["particles", "more energy", "collide more often", "more energy collisions", "faster"], "explain": "Temperature acts on the frequency and energy of collisions.", "src": "L|Even magnesium will react more rapidly with steam than with water."}, {"id": "y8c08-r050", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain the difference between steam and water vapour.", "answer": "Steam is formed by boiling water and is very hot, whereas water vapour is made up of water particles in the air at lower temperatures. They are the same substance in the same state, but the particles in steam carry far more energy, which is why steam reacts with metals that water vapour does not.", "keywords": ["boiling", "very hot", "lower temperature", "same substance", "more energy"], "explain": "The difference is temperature, and temperature is what changes the chemistry.", "src": "L|Steam is formed by boiling water and is very hot whereas water vapour is made up of water particles in the air at lower temperatures."}, {"id": "y8c08-r051", "type": "short", "topic": "8.4", "source": "opus", "q": "Suggest why some metals react with hot water but not with cold water.", "answer": "Reactions only happen when particles collide with enough energy. In hot water the particles have more energy and collide more often, so a metal that is only moderately reactive can now react, while in cold water almost no collision has enough energy to start the reaction.", "keywords": ["more energy", "collide", "enough energy", "moderately reactive"], "explain": "Heating does not change the metal; it changes the collisions.", "src": "L|3 Suggest why some metals will react with hot water but not cold."}, {"id": "y8c08-r052", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain why the surface of the metal is cleaned with sandpaper before the experiment.", "answer": "Many metals are already covered with a layer of oxide formed by reaction with the air. That layer prevents the water from reaching the metal underneath, so the reaction would look slower than it really is. Sandpapering exposes fresh metal and makes the comparison fair.", "keywords": ["oxide layer", "prevents", "reaching the metal", "fresh surface", "fair"], "explain": "The oxide layer from 8.3 is exactly what has to be removed here.", "src": "L|Use sandpaper to clean the surface of the metal."}, {"id": "y8c08-r053", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain what it means to say an element is inert, and give an example.", "answer": "An inert element is one that does not react, or reacts only very reluctantly, with other substances. Gold is an example: it does not react with oxygen and does not react with water at all, which is why gold jewellery keeps its shine for centuries.", "keywords": ["does not react", "gold", "oxygen", "water", "keeps its shine"], "explain": "Inertness is a chemical property with a very visible consequence.", "src": "L|If an element is said to be inert, what does it mean?"}, {"id": "y8c08-r054", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain why copper is used for the roofs of some buildings but magnesium is not.", "answer": "Copper is very low in the reactivity order: it does not react with water and reacts only very slowly with air, so a copper roof lasts for many years in the rain. Magnesium is much more reactive and would react with water and oxygen, so the roof would corrode away.", "keywords": ["copper unreactive", "does not react with water", "magnesium reactive", "corrode"], "explain": "The choice of material follows from reactivity.", "src": "W|Using the information above, explain why copper is used for the roofs of some buildings and magnesium is not."}, {"id": "y8c08-r055", "type": "short", "topic": "8.4", "source": "opus", "q": "Explain why water pipes are made of copper, and what would happen if iron were used instead.", "answer": "Copper does not react with water, so the pipes stay intact and do not contaminate the water. Iron reacts with water and oxygen to form rust, so iron pipes would gradually weaken, leak and discolour the water with iron oxide.", "keywords": ["copper does not react", "iron rusts", "weaken", "leak", "discolour"], "explain": "Rusting needs both water and oxygen, and a water pipe supplies both.", "src": "W|Explain why copper is used and explain what would happen if pipes made of iron were used?"}, {"id": "y8c08-r056", "type": "short", "topic": "8.5", "source": "opus", "q": "State the general pattern for a metal reacting with a dilute acid and explain why it is useful.", "answer": "When a metal reacts with an acid, the products are a salt and hydrogen. This is useful because it lets you predict the products of a reaction you have never seen: you only need to know which metal and which acid were used to name the salt.", "keywords": ["salt", "hydrogen", "predict", "general equation"], "explain": "The pattern does the work; you do not memorise each reaction.", "src": "L|When a metal reacts with an acid, the products are a salt and hydrogen."}, {"id": "y8c08-r057", "type": "short", "topic": "8.5", "source": "opus", "q": "Describe and explain what you would observe if magnesium were added to dilute hydrochloric acid in a test tube.", "answer": "You would see bubbles of gas rising from the metal as hydrogen is produced, the magnesium getting smaller and eventually disappearing as it is used up, and the test tube getting warm because the reaction is exothermic.", "keywords": ["bubbles", "hydrogen", "metal disappears", "warm", "exothermic"], "explain": "Three observations, each traced to a different part of the chemistry.", "src": "L|Describe what you would observe if this reaction took place in a test tube."}, {"id": "y8c08-r058", "type": "short", "topic": "8.5", "source": "opus", "q": "Counting bubbles is used to compare how reactive metals are with acid. Explain the weakness of this method.", "answer": "Bubbles are hard to count once the reaction is fast, they vary in size so equal numbers do not mean equal volumes of gas, and it is easy to lose count. A better method is to time how long it takes to collect a fixed volume of hydrogen, which gives a number that can be compared directly.", "keywords": ["hard to count", "vary in size", "not equal volumes", "time to collect a fixed volume"], "explain": "Replace a subjective count with a measurement.", "src": "W|They watch to see how many bubbles it produces."}, {"id": "y8c08-r059", "type": "short", "topic": "8.5", "source": "opus", "q": "Marcus used dilute hydrochloric acid and Arun used very dilute sulfuric acid. Explain why their results cannot be compared.", "answer": "They changed two things at once: the metal and the acid. A slower reaction in Arun's tubes could be caused by the metal being less reactive or by his acid being more dilute, and there is no way to tell which, so no conclusion about the metals can be drawn.", "keywords": ["two variables", "acid different", "cannot tell which", "no conclusion"], "explain": "Two variables changing at once destroys the comparison.", "src": "W|Explain why Marcus and Arun cannot use their observations to decide if copper or aluminium are more or less reactive than lead or zinc."}, {"id": "y8c08-r060", "type": "short", "topic": "8.5", "source": "opus", "q": "Write the key features of a plan that would let Marcus and Arun compare four metals fairly.", "answer": "Use the same acid at the same concentration and the same volume in every tube, the same mass and surface area of each metal, and the same starting temperature. Measure the same thing each time — for example the time to collect a fixed volume of hydrogen — and repeat each test so a mean can be calculated.", "keywords": ["same acid", "same volume", "same mass", "same measurement", "repeat", "mean"], "explain": "Every item on the list is a variable that would otherwise confound the result.", "src": "W|Write a plan for them to carry out this investigation so that their results are more reliable and can be compared fairly."}, {"id": "y8c08-r061", "type": "short", "topic": "8.5", "source": "opus", "q": "Explain the practical difficulties of timing how long it takes to collect a test tube of hydrogen.", "answer": "Some gas escapes before the tube is in position, the reaction may be so fast that the timing is inaccurate or so slow that it takes very long, the tube is not a precise volume, and it is hard to judge exactly when it is full. Each of these makes the measured time less accurate.", "keywords": ["gas escapes", "too fast", "too slow", "judging when full", "less accurate"], "explain": "Naming the source of the error is the first step to reducing it.", "src": "W|Explain the practical difficulties in using this method to obtain accurate results."}, {"id": "y8c08-r062", "type": "short", "topic": "8.5", "source": "opus", "q": "Suggest how Zara could improve the accuracy of her results when comparing six metals.", "answer": "She could collect the gas in a measuring cylinder or gas syringe so the volume is known exactly, start the timer at the moment the metal touches the acid, use a bung so no gas escapes, and repeat each measurement to calculate a mean. Using the same mass and surface area of metal each time makes the comparison fair as well as accurate.", "keywords": ["gas syringe", "known volume", "bung", "repeat", "mean", "same mass"], "explain": "Accuracy and fairness are two different improvements; a good answer covers both.", "src": "W|Suggest how Zara could improve the accuracy of her results."}, {"id": "y8c08-r063", "type": "short", "topic": "8.5", "source": "opus", "q": "One of Zara's six results does not fit the pattern. Suggest how such an odd result could arise.", "answer": "The metal may have been covered with an oxide layer that was not cleaned off, a different mass or surface area may have been used, gas may have leaked from the apparatus, or the timing may have started late. Any one of these would change the measured time without the metal's reactivity being different.", "keywords": ["oxide layer", "different surface area", "leak", "timing error"], "explain": "An anomalous result usually points to a procedure slip, not to strange chemistry.", "src": "W|Suggest how Zara could have obtained this odd result."}, {"id": "y8c08-r064", "type": "short", "topic": "8.5", "source": "opus", "q": "Explain how you can tell that a reaction has taken place when a metal is put into acid.", "answer": "You would see bubbles of hydrogen gas being given off, the piece of metal getting smaller as it is used up, and the test tube getting warmer because the reaction is exothermic. Any of these shows a new substance is being made.", "keywords": ["bubbles", "metal gets smaller", "warmer", "new substance"], "explain": "Evidence of reaction is always a change you can observe.", "src": "W|How can they tell that a reaction has taken place?"}, {"id": "y8c08-o002", "type": "short", "topic": "8.1", "source": "opus", "q": "What name is given to the substance that reacts with oxygen when something burns?", "answer": "It is called a fuel.", "keywords": ["fuel"], "explain": "The fuel is the substance that supplies the chemical energy store.", "src": "L|The substance that reacts with oxygen is called a fuel."}, {"id": "y8c08-o003", "type": "short", "topic": "8.1", "source": "opus", "q": "Where is the energy stored in a fuel before it burns?", "answer": "Fuels have a store of chemical energy.", "keywords": ["chemical energy"], "explain": "Chemical energy is stored in the bonds between the atoms of the fuel.", "src": "L|Fuels have a store of chemical energy."}, {"id": "y8c08-o051", "type": "short", "topic": "8.3", "source": "opus", "q": "Do all metals react with oxygen?", "answer": "Many metals react with oxygen if they get hot enough.", "keywords": ["many metals", "hot enough"], "explain": "Some metals need heating first; a few, such as gold, do not react at all.", "src": "L|Many metals react with oxygen if they get hot enough."}, {"id": "y8c08-o052", "type": "short", "topic": "8.3", "source": "opus", "q": "How do you know that magnesium is more reactive than iron?", "answer": "Because magnesium reacts more quickly than iron.", "keywords": ["more quickly"], "explain": "The speed of the reaction is the evidence used to compare reactivity.", "src": "L|For example, magnesium is more reactive than iron because magnesium reacts more quickly than iron."}, {"id": "y8c08-o053", "type": "short", "topic": "8.3", "source": "opus", "q": "What type of reaction takes place between a metal and oxygen?", "answer": "It is an oxidation reaction.", "keywords": ["oxidation"], "explain": "Any reaction in which a substance combines with oxygen is oxidation.", "src": "L|This reaction between metals and oxygen is an oxidation reaction."}, {"id": "y8c08-o068", "type": "short", "topic": "8.4", "source": "opus", "q": "Describe how sodium reacts with water.", "answer": "Sodium reacts vigorously with water.", "keywords": ["vigorously"], "explain": "The reaction is fast and gives out a lot of energy.", "src": "L|Sodium reacts vigorously with water."}, {"id": "y8c08-o069", "type": "short", "topic": "8.4", "source": "opus", "q": "Which is more reactive with water, sodium or potassium?", "answer": "Potassium is even more reactive than sodium.", "keywords": ["potassium", "more reactive"], "explain": "Reactivity increases as you go down this group of metals.", "src": "L|Potassium is even more reactive than sodium."}, {"id": "y8c08-o070", "type": "short", "topic": "8.4", "source": "opus", "q": "Why does the hydrogen catch fire when potassium reacts with water?", "answer": "Because so much thermal energy is generated by the reaction.", "keywords": ["thermal energy"], "explain": "The energy released is enough to ignite the hydrogen produced.", "src": "L|So much thermal energy is generated that the hydrogen gas produced in the reaction catches fire."}, {"id": "y8c08-o081", "type": "short", "topic": "8.5", "source": "opus", "q": "Write the word equation for magnesium reacting with hydrochloric acid.", "answer": "magnesium + hydrochloric acid -> magnesium chloride + hydrogen", "keywords": ["magnesium chloride", "hydrogen"], "explain": "The salt is named from the metal and from the acid used.", "src": "L|magnesium + hydrochloric acid magnesium chloride + hydrogen"}, {"id": "y8c08-o082", "type": "short", "topic": "8.5", "source": "opus", "q": "What type of substance is magnesium chloride?", "answer": "It is an example of a salt.", "keywords": ["salt"], "explain": "A salt is the compound formed when a metal replaces the hydrogen in an acid.", "src": "L|Magnesium chloride is an example of a salt."}, {"id": "y8c08-o084", "type": "short", "topic": "8.5", "source": "opus", "q": "Write the general word equation for a metal reacting with an acid.", "answer": "metal + acid -> salt + hydrogen", "keywords": ["salt", "hydrogen"], "explain": "This pattern works for every metal that reacts with dilute acid.", "src": "L|The general equation for this reaction is: metal + acid salt + hydrogen"}, {"id": "y8c08-w001", "type": "mcq", "topic": "8.1", "source": "opus", "q": "Sofia and Marcus want to find out whether a longer piece of magnesium ribbon gives a bigger temperature rise. What is the independent variable?", "options": ["The length of the magnesium ribbon.", "The temperature rise of the acid.", "The volume of hydrochloric acid.", "The type of test tube used."], "answer": 0, "explain": "The independent variable is the one the investigators deliberately change.", "src": "W|What is the independent variable in this investigation?"}, {"id": "y8c08-w014", "type": "mcq", "topic": "8.2", "source": "opus", "q": "Sherbet sweets react in your mouth and give a cool, fizzy feeling. What kind of reaction is this?", "options": ["Exothermic, because energy is given out.", "Endothermic, because the reaction takes energy in and leaves your mouth feeling cool.", "Neither, because no new substance is made.", "Exothermic, because it is happening inside your warm mouth."], "answer": 1, "explain": "Endothermic reactions take energy from their surroundings, so the surroundings get colder.", "src": "W|Is this an exothermic or endothermic reaction?"}, {"id": "y8c08-w020", "type": "mcq", "topic": "8.3", "source": "opus", "q": "What is the chemical name for rust?", "options": ["Iron oxide, formed when iron reacts with water and air.", "Iron chloride.", "Iron sulfate.", "Iron hydroxide only."], "answer": 0, "explain": "Rust is hydrated iron oxide, which needs both oxygen and water to form.", "src": "W|What is the chemical name for rust?"}, {"id": "y8c08-w045", "type": "fill", "topic": "8.1", "source": "opus", "q": "The variable that you deliberately change in an investigation is called the ____ variable.", "answer": ["independent"], "explain": "Everything else must be kept the same so that only this variable can affect the result.", "src": "W|What is the independent variable in this investigation?"}, {"id": "y8c08-w047", "type": "fill", "topic": "8.2", "source": "opus", "q": "A reaction that takes energy in from its surroundings, so that the temperature falls, is called ____.", "answer": ["endothermic"], "explain": "A reaction that gives energy out and warms its surroundings is exothermic.", "src": "W|For each of the reactions in the table, write exothermic or endothermic."}, {"id": "y8c08-w049", "type": "fill", "topic": "8.3", "source": "opus", "q": "The chemical name for rust is hydrated iron ____.", "answer": ["oxide"], "explain": "Both oxygen and water are needed for it to form.", "src": "W|What is the chemical name for rust?"}, {"id": "y8c08-w050", "type": "fill", "topic": "8.4", "source": "opus", "q": "The gas given off when a metal reacts with water or with steam is ____.", "answer": ["hydrogen"], "explain": "It is identified by a lighted splint, which makes it burn with a squeaky pop.", "src": "W|Which gas is given off in this reaction?"}, {"id": "qwen-01-01", "type": "mcq", "topic": "8.1", "source": "qwen", "q": "What is the name of a chemical reaction that gives out thermal energy?", "explain": "A chemical reaction in which thermal energy is given out is called an exothermic reaction.", "src": "L|A chemical reaction in which thermal energy is given out is called an exothermic reaction.", "options": ["Endothermic reaction", "Exothermic reaction", "Oxidation reaction", "Combustion"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "8.1", "source": "qwen", "q": "The substance that reacts with oxygen during burning is called a ____.", "explain": "The substance that reacts with oxygen as a fuel.", "src": "L|The substance that reacts with oxygen is called a fuel.", "answer": ["fuel"]}, {"id": "qwen-10-01", "type": "mcq", "topic": "8.2", "source": "qwen", "q": "What are the products when sodium hydrogen carbonate reacts with citric acid?", "explain": "The products in the word equation for this reaction.", "src": "L|sodium hydrogen carbonate + citric acid sodium citrate + water + carbon dioxide", "options": ["sodium citrate, water and carbon dioxide", "sodium hydrogen carbonate, water and oxygen", "citric acid, sodium citrate and carbon monoxide", "water, carbon dioxide and hydrogen gas"], "answer": 0}, {"id": "qwen-10-02", "type": "fill", "topic": "8.2", "source": "qwen", "q": "Chemical reactions that absorb thermal energy from their surroundings are called ____ reactions.", "explain": "Endothermic reactions as those that absorb thermal energy.", "src": "L|These are called endothermic reactions.", "answer": ["endothermic"]}, {"id": "qwen-12-02", "type": "fill", "topic": "8.3", "source": "qwen", "q": "Metals that do not react with oxygen, such as gold, are described as ____.", "explain": "Some metals like gold do not react with oxygen and are described as inert.", "src": "L|They are described as inert.", "answer": ["inert"]}, {"id": "qwen-12-03", "type": "mcq", "topic": "8.3", "source": "qwen", "q": "Why do sodium and potassium have to be stored under oil?", "explain": "These metals are so reactive they must be stored under oil to prevent them reacting.", "src": "L|stored under oil to prevent them reacting", "options": ["To keep them shiny", "To prevent them reacting with air or water vapour", "To make them dissolve faster", "To increase their temperature"], "answer": 1}, {"id": "qwen-14-01", "type": "mcq", "topic": "8.4", "source": "qwen", "q": "Why do you need to use sandpaper on the metal before putting it in water?", "explain": "Metals may be covered in a surface layer of metal oxide, and sandpaper is used to clean the surface so the metal can come in direct contact with water.", "src": "L|use sandpaper to clean the surface of the metals so that the metal can come in direct contact with the water", "options": ["To make the metal smaller", "To remove a layer of metal oxide so the water can touch the metal", "To heat up the metal quickly", "To make the metal shiny for better observation"], "answer": 1}, {"id": "qwen-14-02", "type": "fill", "topic": "8.4", "source": "qwen", "q": "Metals may be covered in a surface layer of ____ if they have reacted with oxygen in the air.", "explain": "It is difficult to see reactions because metals may be covered in a surface layer of metal oxide.", "src": "L|they may be covered in a surface layer of metal oxide if they have reacted with the oxygen", "answer": ["metal oxide"]}, {"id": "qwen-14-09", "type": "mcq", "topic": "8.4", "source": "qwen", "q": "Why might it be difficult to see how some metals react with water?", "explain": "It can be difficult to see reactions because metals may be covered in a surface layer of metal oxide.", "src": "L|It can be diffi cult to see how some metals react with water because they may be covered in a surface layer of metal oxide", "options": ["The water is too clear", "The metal pieces are too small", "They may be covered in a surface layer of metal oxide", "The test tubes are dirty"], "answer": 2}, {"id": "qwen-24-01", "type": "mcq", "topic": "8.5", "source": "qwen", "q": "What are the two products formed when a metal reacts with an acid?", "explain": "When a metal reacts with an acid, the products are a salt and hydrogen.", "src": "L|When a metal reacts with an acid, the products are a salt and hydrogen.", "options": ["salt and hydrogen", "metal oxide and water", "salt and oxygen", "hydrogen and carbon dioxide"], "answer": 0}, {"id": "qwen-24-04", "type": "fill", "topic": "8.5", "source": "qwen", "q": "The reaction between magnesium and dilute hydrochloric acid produces magnesium chloride and ____.", "explain": "The word equation shows hydrogen as the second product.", "src": "L|magnesium + hydrochloric acid magnesium chloride + hydrogen", "answer": ["hydrogen"]}, {"id": "qwenw-01-02", "type": "fill", "topic": "8.1", "source": "qwen", "q": "The students are measuring the temperature rise in a reaction between magnesium ribbon and ____ acid.", "explain": "The acid used in the reaction as hydrochloric acid.", "src": "W|reaction between magnesium ribbon and hydrochloric acid", "answer": ["hydrochloric"]}, {"id": "qwenw-01-09", "type": "mcq", "topic": "8.1", "source": "qwen", "q": "Who are the two people conducting the experiment?", "explain": "The text introduces the experimenters as Sofi a and Marcus.", "src": "W|Sofi a and Marcus are measuring", "options": ["Sofi a and Marcus", "Alice and Bob", "James and Sarah", "Tom and Jerry"], "answer": 0}, {"id": "qwenw-04-03", "type": "mcq", "topic": "8.2", "source": "qwen", "q": "Which of these reactions is endothermic?", "explain": "An endothermic reaction involves a decrease in temperature. The option with 19°C to 16°C shows the temperature dropping.", "src": "W|In an endothermic reaction energy is transferred from the surroundings and the temperature decreases.", "options": ["A reaction where the temperature goes from 21°C to 45°C", "A reaction where the temperature goes from 19°C to 16°C", "A reaction where the temperature goes from 18°C to 20°C", "A reaction where the temperature goes from 18°C to 22°C"], "answer": 1}, {"id": "qwenw-04-04", "type": "fill", "topic": "8.3", "source": "qwen", "q": "Rusting is a chemical reaction that is not ____.", "explain": "Rusting as a chemical reaction that is not useful.", "src": "W|Rusting is a chemical reaction that is not useful.", "answer": ["useful"]}, {"id": "qwenw-05-01", "type": "mcq", "topic": "8.5", "source": "qwen", "q": "What gas is produced when metals react with dilute hydrochloric acid?", "explain": "The metals produce hydrogen when they are added to dilute hydrochloric acid.", "src": "W|The metals produce hydrogen when they are added to dilute hydrochloric acid.", "options": ["Oxygen", "Hydrogen", "Carbon dioxide", "Nitrogen"], "answer": 1}], "figures": {"img/L_p02_fire_triangle.png": {"caption": "Burning requires oxygen, fuel and heat (thermal energy).", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAEoARQDAREAAhEBAxEB/8QAGwABAAIDAQ
