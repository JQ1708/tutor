input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}

 19.0, "y": 43.6, "r": 7.0}, "explain": "Mercury is the closest planet to the Sun. Its gravity strength is only 3.7 N/kg because its mass is small.", "src": "L|Mercury"}, {"id": "y7c03-f01h6", "type": "hotspot", "topic": "3.1", "source": "opus", "image": "img/L_p06_gravity_strengths.png", "figure": "L_p06_gravity_strengths", "q": "Click on the label of the second planet from the Sun.", "caption": "The strength of gravity in some other parts of the Solar System.", "target": {"x": 21.5, "y": 54.7, "r": 7.0}, "explain": "Venus is the second planet from the Sun, with a gravity strength of 8.9 N/kg.", "src": "L|Venus"}, {"id": "y7c03-f01h7", "type": "hotspot", "topic": "3.1", "source": "opus", "image": "img/L_p06_gravity_strengths.png", "figure": "L_p06_gravity_strengths", "q": "Click on the label of the fourth planet from the Sun.", "caption": "The strength of gravity in some other parts of the Solar System.", "target": {"x": 28.1, "y": 58.9, "r": 7.0}, "explain": "Mars is the fourth planet from the Sun. Its gravity strength is 3.7 N/kg, the same as Mercury's.", "src": "L|Mars"}, {"id": "y7c03-f01h8", "type": "hotspot", "topic": "3.1", "source": "opus", "image": "img/L_p06_gravity_strengths.png", "figure": "L_p06_gravity_strengths", "q": "Click on the label of the seventh planet from the Sun.", "caption": "The strength of gravity in some other parts of the Solar System.", "target": {"x": 80.2, "y": 35.0, "r": 7.0}, "explain": "Uranus is the seventh planet from the Sun, with a gravity strength of 8.7 N/kg.", "src": "L|Uranus"}, {"id": "y7c03-f01h9", "type": "hotspot", "topic": "3.1", "source": "opus", "image": "img/L_p06_gravity_strengths.png", "figure": "L_p06_gravity_strengths", "q": "Click on the label of the planet furthest from the Sun.", "caption": "The strength of gravity in some other parts of the Solar System.", "target": {"x": 90.5, "y": 35.0, "r": 7.0}, "explain": "Neptune is the most distant planet. Even though the Sun's gravity is much weaker that far out, it is still strong enough to hold Neptune in orbit.", "src": "L|Neptune"}, {"id": "y7c03-f02a", "type": "label", "topic": "3.4", "source": "opus", "image": "img/L_p25_tides.png", "figure": "L_p25_tides", "q": "This diagram shows the Earth from above the North Pole, with the Moon to one side. Name the tide labelled {n}.", "caption": "How the Moon's gravity causes the tides. The Earth is viewed from above the North Pole.", "labels": [{"n": 1, "text": "low tide", "alt": [], "x": 35.8, "y": 7.6, "w": 10.3, "h": 6.5}, {"n": 2, "text": "high tide", "alt": [], "x": 65.8, "y": 35.2, "w": 11.5, "h": 6.5}, {"n": 3, "text": "high tide", "alt": [], "x": 4.3, "y": 48.4, "w": 11.5, "h": 6.5}, {"n": 4, "text": "low tide", "alt": [], "x": 35.4, "y": 89.0, "w": 10.3, "h": 6.5}], "src": "L|low tide"}, {"id": "y7c03-f02h1", "type": "hotspot", "topic": "3.4", "source": "opus", "image": "img/L_p25_tides.png", "figure": "L_p25_tides", "q": "Click on the words that name the tide on the side of the Earth closest to the Moon.", "caption": "How the Moon's gravity causes the tides. The Earth is viewed from above the North Pole.", "target": {"x": 71.5, "y": 38.5, "r": 7.0}, "explain": "The Moon's gravity pulls the ocean water towards the Moon, so the water is deepest on the near side. That is a high tide.", "src": "L|high tide"}, {"id": "y7c03-f02h2", "type": "hotspot", "topic": "3.4", "source": "opus", "image": "img/L_p25_tides.png", "figure": "L_p25_tides", "q": "Click on the words that name the tide on the side of the Earth furthest from the Moon.", "caption": "How the Moon's gravity causes the tides. The Earth is viewed from above the North Pole.", "target": {"x": 10.1, "y": 51.6, "r": 7.0}, "explain": "There is a second high tide on the far side of the Earth. This is why a place gets two high tides in every 24 hours, 12 hours apart.", "src": "L|high tide"}, {"id": "y7c03-f02h3", "type": "hotspot", "topic": "3.4", "source": "opus", "image": "img/L_p25_tides.png", "figure": "L_p25_tides", "q": "Click on the words that name the tide at the top of this diagram.", "caption": "How the Moon's gravity causes the tides. The Earth is viewed from above the North Pole.", "target": {"x": 40.9, "y": 10.8, "r": 7.0}, "explain": "At the top and bottom of the diagram the water has been pulled away towards the two high tides, so it is shallowest there. That is a low tide.", "src": "L|low tide"}, {"id": "y7c03-f03h2", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p33_bus_energy.png", "figure": "L_p33_bus_energy", "q": "Click on the label of the energy the bus has because it is moving.", "caption": "This bus has many types of energy.", "target": {"x": 73.2, "y": 10.9, "r": 7.0}, "explain": "Kinetic energy is the energy stored in a moving object. The faster the bus moves, the more kinetic energy it has.", "src": "L|kinetic"}, {"id": "y7c03-f03h4", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p33_bus_energy.png", "figure": "L_p33_bus_energy", "q": "Click on the label of the energy stored in the hot engine.", "caption": "This bus has many types of energy.", "target": {"x": 5.7, "y": 43.4, "r": 7.0}, "explain": "A hot object is a store of thermal energy. Most of this thermal energy in an engine is wasted energy.", "src": "L|thermal"}, {"id": "y7c03-f03h5", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p33_bus_energy.png", "figure": "L_p33_bus_energy", "q": "Click on the label of the energy transferred from the noisy engine.", "caption": "This bus has many types of energy.", "target": {"x": 5.2, "y": 66.0, "r": 7.0}, "explain": "Vibrating objects such as an engine transfer energy as sound. Sound is a transfer, not a store.", "src": "L|sound"}, {"id": "y7c03-r001", "type": "short", "topic": "3.1", "source": "opus", "q": "A pen and the Earth both cause forces of gravity, yet you never see objects fall towards a pen. Explain why.", "answer": "All objects, even pens and pencils, cause forces of gravity, but objects with small mass cause very weak forces of gravity. The force from a pen is so weak that we do not notice other objects being attracted to it, while objects with large mass, such as the Earth, cause strong forces. So the difference is one of size of force, not of whether the force exists at all.", "keywords": ["all objects cause gravity", "small mass gives a very weak force", "large mass gives a strong force", "too weak to notice"], "src": "L|Objects with small mass, such as pens and pencils, cause very weak forces of gravity."}, {"id": "y7c03-r002", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why people at the South Pole do not fall off the Earth.", "answer": "The force of gravity caused by an object acts towards the centre of the object, so at every position around the Earth gravity pulls towards the centre. For someone at the South Pole, that direction is the one they call down, just as it is for someone at the North Pole, even though the two directions are opposite in space. There is no single direction called down for the whole Earth, so no one is upside down.", "keywords": ["gravity acts towards the centre of the Earth", "down is different at each place", "no single down direction"], "src": "L|That means when you drop an object, the object falls in a line that points towards the centre of the Earth."}, {"id": "y7c03-r003", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain what happens to the force of gravity on a spacecraft as it travels away from Earth.", "answer": "The strength of gravity decreases as you go further from a large object such as Earth, so the force of gravity from the Earth acting on the spacecraft gets steadily weaker with distance. It does not switch off at some boundary; it simply keeps getting smaller. This is why a spacecraft needs its largest push at the start of the journey, when the Earth's pull on it is strongest.", "keywords": ["gravity decreases with distance", "gets weaker gradually", "does not switch off", "strongest near the Earth"], "src": "L|The strength of gravity decreases as you go further from a large object such as Earth."}, {"id": "y7c03-r004", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why a book resting on a desk does not move, even though gravity pulls it down.", "answer": "The weight of the book pulls it down, but the desk pushes up on it with a contact force. The contact force acts up from any surface to support an object, and it is always equal to the weight of the object when the surface is not moving. Because the two forces are equal in size and opposite in direction, they balance, so there is no overall force and the book stays still.", "keywords": ["weight pulls down", "contact force pushes up", "equal when the surface is not moving", "forces balance"], "src": "L|The contact force is always equal to the weight of the object when the surface is not moving."}, {"id": "y7c03-r005", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why a car parked on soft sand sinks but the same car on a road does not.", "answer": "A surface supports an object by providing a contact force equal to the object's weight. Sometimes the weight of the object is larger than the contact force the surface can provide, and if this happens the surface will break, or the object will sink into the surface. Soft sand can only push up with a small force, so the car sinks; a road can provide a contact force as large as the car's weight, so it does not.", "keywords": ["contact force must equal the weight", "sand provides too small a force", "object sinks", "road can provide enough"], "src": "L|If this happens, the surface will break, or the object will sink into the surface."}, {"id": "y7c03-r006", "type": "short", "topic": "3.1", "source": "opus", "q": "A car's wheels need a contact force of 24000 N each but the mud first provides only 2000 N. Explain why the wheels sink and then stop.", "answer": "At first the contact force from the mud is far smaller than the force needed to support each wheel, so the weight is larger than the contact force and the wheel sinks into the surface. The contact force from the mud increases with depth, so as the wheel goes deeper the upward force grows. Sinking stops at the depth where the contact force has risen to match the force needed, because the forces then balance.", "keywords": ["weight larger than contact force", "wheel sinks", "contact force increases with depth", "stops when forces balance"], "src": "L|b The contact force from the mud increases with depth."}, {"id": "y7c03-r007", "type": "short", "topic": "3.1", "source": "opus", "q": "'The weight of my bag is 10 kg' is a sentence scientists would not accept. Explain what is wrong with it.", "answer": "Weight is the force of gravity on an object and it is measured in newtons, while mass is the quantity of matter in an object and is measured in kilograms. The sentence attaches a mass unit to the word weight, so it mixes up two different quantities. The correct sentence is that the mass of the bag is 10 kg; its weight would be 100 N on Earth.", "keywords": ["weight is a force in newtons", "mass is matter in kilograms", "wrong unit for the quantity", "mass of the bag is 10 kg"], "src": "L|They often say things such as: ‘The weight of my bag is 10kg.’ This sentence is not correct because it makes a statement about weight, but gives a mass."}, {"id": "y7c03-r008", "type": "short", "topic": "3.1", "source": "opus", "q": "An astronaut takes a 2 kg tool to the Moon. Explain what changes and what does not.", "answer": "The mass of an object does not change, because mass is the quantity of matter in the object and no matter is added or removed by the journey. The weight of an object changes when the strength of gravity changes, and the Moon's gravity is weaker than the Earth's, so the tool weighs less there. The astronaut would find the tool just as hard to shake from side to side but easier to lift.", "keywords": ["mass stays the same", "quantity of matter unchanged", "weight changes with gravity strength", "weighs less on the Moon"], "src": "L|The weight of an object changes when the strength of gravity changes."}, {"id": "y7c03-r009", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain what the figure 10 N/kg actually tells you.", "answer": "On Earth, the force of gravity is 10 N on every 1 kg of mass, and the force of gravity that pulls on 1 kg tells you the strength of gravity. So 10 N/kg is read as ten newtons per kilogram and it is a rate: it says how much weight each kilogram of matter is given. That is why weight is calculated as mass multiplied by 10, and why the same mass has a different weight where the strength of gravity is different.", "keywords": ["10 newtons per kilogram", "force on each kilogram of mass", "a rate not a total", "used to calculate weight"], "src": "L|On Earth, the force of gravity is 10N on every 1kg of mass."}, {"id": "y7c03-r010", "type": "short", "topic": "3.1", "source": "opus", "q": "When you stand on bathroom scales you see a value in kilograms. Explain whether the scales measure your mass or your weight.", "answer": "The scales actually respond to the force pressing down on them, which is your weight in newtons. They then divide by 10 N/kg and display the answer in kilograms, because on Earth the strength of gravity is 10 N/kg. So the quantity measured is weight and the quantity displayed is mass, and the conversion only works because the scales assume they are on Earth.", "keywords": ["scales respond to the force, the weight", "display mass in kilograms", "assumes 10 N/kg", "would be wrong on another planet"], "src": "L|Explain whether it is your mass or your weight that makes the scales work."}, {"id": "y7c03-r011", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why a larger force is needed for a spacecraft to travel from Earth to the Moon than to come back.", "answer": "The strength of gravity at the Earth's surface is much greater than at the Moon's surface, because the Earth has far more mass. Leaving Earth therefore means pushing against a much stronger gravitational pull than leaving the Moon does, so a much larger force is needed for the outward journey. The mass of the spacecraft is the same on both journeys, so the difference comes entirely from the strength of gravity.", "keywords": ["Earth's gravity is much stronger", "Earth has more mass", "must push against a stronger pull", "same spacecraft mass"], "src": "L|Explain why a larger force is needed for a spacecraft to go from Earth to the Moon than to come back from the Moon to the Earth."}, {"id": "y7c03-r012", "type": "short", "topic": "3.1", "source": "opus", "q": "The strength of gravity is 25 N/kg on Jupiter and 8.7 N/kg on Uranus. Explain what this means for a 50 kg astronaut.", "answer": "Weight is mass multiplied by the strength of gravity, so the astronaut would weigh 50 times 25, which is 1250 N on Jupiter, and 50 times 8.7, which is 435 N on Uranus. The astronaut's mass stays 50 kg in both places because the quantity of matter has not changed. Jupiter's greater strength of gravity comes from its much greater mass, which is why the same body is pulled almost three times as hard there.", "keywords": ["weight = mass x strength of gravity", "1250 N on Jupiter", "435 N on Uranus", "mass stays 50 kg"], "src": "L|The diagram shows the strength of gravity in some other parts of the Solar System."}, {"id": "y7c03-r013", "type": "short", "topic": "3.2", "source": "opus", "q": "No one saw the Solar System form. Explain how scientists can still make claims about how it happened.", "answer": "Observe means to watch something happening, and when the Solar System formed there were no people to observe it. Scientists can still work on the problem in two ways: they can look for evidence, in the form of facts from observations or experiments, to support a theory, and they can think of a testable theory, called an hypothesis, and then look for evidence to support it. Both routes replace direct watching with evidence that must fit.", "keywords": ["no one could observe it", "look for evidence to support a theory", "propose a testable hypothesis", "evidence must fit"], "src": "L|So how do we know what happened?"}, {"id": "y7c03-r014", "type": "short", "topic": "3.2", "source": "opus", "q": "All the planets orbit the Sun in the same direction and in the same plane. Explain why these facts count as evidence for the flat-disc hypothesis.", "answer": "If each planet had formed separately and been captured later, there would be no reason for them all to share a direction or a plane, so those features would be coincidences. A hypothesis that the planets formed together from one spinning flat disc of dust and gas predicts exactly these shared features. Scientists use these facts as evidence because the hypothesis explains them while the alternative leaves them unexplained.", "keywords": ["shared direction and plane would be coincidences", "one spinning disc predicts them", "hypothesis explains the facts"], "src": "L|The Sun and all the planets (except Venus and Uranus) spin on their axes (singular: axis) in the same direction."}, {"id": "y7c03-r015", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain what it means to say that all the planets orbit the Sun in the same plane.", "answer": "Objects that are in the same plane could all be placed on the same flat surface, just like objects on a tabletop. Applied to the Solar System this means the orbits are not tilted at random angles to one another but lie close to a single flat sheet, which is why the Solar System looks flat. If the orbits had random tilts the system would look like a ball of paths rather than a disc.", "keywords": ["same plane means on one flat surface", "orbits not tilted at random", "Solar System looks flat"], "src": "L|All the planets orbit the Sun in the same plane."}, {"id": "y7c03-r016", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain how watching other parts of space helps scientists study something that happened 4.6 billion years ago.", "answer": "Scientists can see distant stars forming in other parts of space, from clouds of dust and gas called nebulae, and some young stars can also be seen with a flat disc of dust around them. Because these systems are at different stages, looking at many of them shows the sequence even though no single one can be watched from start to finish. Scientists think our Solar System was formed this way.", "keywords": ["stars forming in nebulae can be seen now", "young stars with discs of dust", "many systems at different stages", "sequence pieced together"], "src": "L|A cloud of dust and gas in space is called a nebula."}, {"id": "y7c03-r017", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain what a scientific model is and why computers are used to model the birth of the Solar System.", "answer": "A model is a way of representing something that is difficult to observe directly, and scientists cannot observe a star or Solar System forming in an experiment. So they put many of the known laws of physics into a computer program, and the computer uses this information to predict what will happen, starting with a cloud of dust and gas. The prediction, a star surrounded by planets, can then be compared with what is actually seen.", "keywords": ["model represents what cannot be observed directly", "laws of physics put into a program", "computer predicts the outcome", "compare with observations"], "src": "L|A model is a way of representing something that is difficult to observe directly."}, {"id": "y7c03-r018", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain why a clump of dust and gas in space grows faster and faster once it starts to form.", "answer": "All the particles of dust and gas have their own weak gravity and pull on each other. As they stick together, their total mass increases, and as their mass increases, so does the strength of their gravity. That means they attract more dust and gas with a stronger force, which adds still more mass. Each round of growth makes the next round quicker, so the process speeds up as the ball gets bigger.", "keywords": ["particles pull on each other", "mass increases as they stick together", "greater mass means stronger gravity", "attracts more, so it speeds up"], "src": "L|That means they attract more dust and gas with a stronger force."}, {"id": "y7c03-r019", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain what decides whether a growing ball of dust and gas becomes a star or a planet.", "answer": "If the ball gets beyond a certain size, it will get hot enough to become a star; otherwise it will become a planet. So the deciding factor is how much mass it manages to gather, because more mass means stronger gravity squeezing the material and a higher temperature at the centre. Scientists think the planet Jupiter almost reached the size to be a star, which shows the boundary is a matter of degree.", "keywords": ["size and mass gathered", "beyond a certain size it gets hot enough", "otherwise it becomes a planet", "Jupiter nearly reached it"], "src": "L|If the ball gets beyond a certain size, it will get hot enough to become a star."}, {"id": "y7c03-r020", "type": "short", "topic": "3.2", "source": "opus", "q": "Venus spins in the opposite direction to the other planets. Explain why this does not simply prove the hypothesis wrong.", "answer": "Most of the facts about the Solar System support or agree with the hypothesis, and only this one seems to contradict it, where contradict means to go against something. A hypothesis is judged on the whole body of evidence, not on a single fact, and an unusual case may have its own later explanation such as a collision. Scientists therefore keep the hypothesis while treating Venus as a problem still to be solved.", "keywords": ["most facts support the hypothesis", "contradict means to go against", "judged on all the evidence", "the exception needs its own explanation"], "src": "L|The fact that Venus spins on its axis in the opposite way to all the other planets seems to contradict this hypothesis."}, {"id": "y7c03-r021", "type": "short", "topic": "3.2", "source": "opus", "q": "It takes millions of years to form a star or a planet. Explain why this makes the process hard to study.", "answer": "Scientists can see stars forming in clouds of dust and gas that are visible from Earth, but the complete process takes millions of years, far longer than any person or any instrument will last. No one can watch a single star from cloud to finished system, so the process cannot be followed directly. Evidence has to come from many objects caught at different stages, and from computer models.", "keywords": ["process takes millions of years", "longer than any observer can watch", "cannot follow one star through", "use many objects and models"], "src": "L|It takes millions of years to form a star or a planet."}, {"id": "y7c03-r022", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why the Sun, rather than any planet, holds the Solar System together.", "answer": "Objects with more mass have more gravity, and the Sun is the object with the largest mass in the Solar System; in fact the mass of the Sun is more than the mass of all the other planets added together. Its gravity is therefore far stronger than any planet's, which is why it holds all the planets in their orbits rather than being pulled around by them.", "keywords": ["more mass means more gravity", "Sun has the largest mass", "more than all the planets together", "holds the planets in orbit"], "src": "L|The mass of the Sun is times greater than the mass of the Earth."}, {"id": "y7c03-r023", "type": "short", "topic": "3.3", "source": "opus", "q": "Neptune is 30 times further from the Sun than Earth. Explain how the Sun can still hold it in orbit.", "answer": "The Sun's gravity gets weaker as the distance from the Sun increases, so the pull on Neptune is much weaker than the pull on Earth. But weaker is not the same as absent: the force is still large enough to keep Neptune turning, partly because Neptune's mass is about 17 times the mass of Earth. So although the Sun's gravity gets weaker, it is strong enough to hold Neptune in orbit.", "keywords": ["gravity weakens with distance", "weaker is not zero", "Neptune has large mass", "still strong enough to hold it"], "src": "L|So although the Sun’s gravity gets weaker, it is strong enough to hold Neptune in orbit."}, {"id": "y7c03-r024", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain what would happen to a planet if the Sun's gravity suddenly stopped acting on it.", "answer": "To keep any object moving in a circle, there needs to be a force causing it to turn, and the force of gravity from the Sun that acts on a planet always acts towards the Sun. If this force did not act in this way, the planet would travel off in a straight line into space. So gravity is not what makes the planet move; it is what keeps bending its path into an orbit.", "keywords": ["a force is needed to keep turning", "gravity acts towards the Sun", "without it the planet goes straight", "gravity bends the path"], "src": "L|If this force did not act in this way, the planet would travel off in a straight line into space!"}, {"id": "y7c03-r025", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why Mercury travels faster in its orbit than Earth does.", "answer": "Mercury is the closest planet to the Sun, so it has the strongest pull from the Sun's gravity. A stronger pull turns the planet more sharply, and this causes Mercury to orbit with the highest speed of all the planets: its average speed around the Sun is 170000 km/h against about 100000 km/h for Earth. Distance from the Sun therefore sets both the strength of the pull and the orbital speed.", "keywords": ["closest to the Sun", "strongest pull from the Sun's gravity", "highest orbital speed", "170000 km/h against 100000 km/h"], "src": "L|Mercury, which is the closest planet to the Sun, has the strongest pull from the Sun’s gravity."}, {"id": "y7c03-r026", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why air resistance always slows a moving object rather than speeding it up.", "answer": "Air resistance is caused by a moving object having to push against the particles in the air, and it acts in the opposite direction to movement. Because the force opposes the direction the object is going, it can only reduce the speed. The faster an object moves, the greater the air resistance on the object, so the effect grows exactly when the object is going fastest.", "keywords": ["object pushes against air particles", "acts opposite to the movement", "opposing force reduces speed", "greater at higher speed"], "src": "L|Air resistance acts in the opposite direction to movement."}, {"id": "y7c03-r027", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain how changing the shape of an aeroplane wing helps the aeroplane slow down after landing.", "answer": "The shape of the wing can be changed to produce extra air resistance, and air resistance acts in the opposite direction to movement. Making the wing present a larger, blunter surface means more air particles have to be pushed aside each second, so the backward force is bigger. A bigger backward force slows the aeroplane more quickly, which is why the wing is reshaped at exactly that moment.", "keywords": ["wing shape changed to increase air resistance", "acts opposite to movement", "more air pushed aside", "slows the aeroplane faster"], "src": "L|The shape of the wing can be changed to produce extra air resistance."}, {"id": "y7c03-r028", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why the planets do not gradually slow down and stop.", "answer": "On Earth all objects that move have forces acting on them to slow them down, and air resistance is one of those forces. Earth and the other planets are moving in a vacuum, which is a space where there are very few particles, so there is no air resistance to slow them down. The only force acting on the planets is from gravity, and that acts sideways to the motion, turning the planet rather than slowing it.", "keywords": ["planets move in a vacuum", "no air resistance", "only gravity acts", "gravity turns rather than slows"], "src": "L|Earth and the other planets are also moving in a vacuum."}, {"id": "y7c03-r029", "type": "short", "topic": "3.3", "source": "opus", "q": "The Juno probe reached a record speed near Jupiter. Explain why the same probe could not reach that speed on Earth.", "answer": "The Juno probe would have a lot of air resistance if it were moving on Earth, because air resistance is caused by pushing against the particles in the air and the faster an object moves the greater that force becomes. In space there is a vacuum and no air resistance, so nothing opposes the motion and the probe keeps gaining speed. On Earth the growing resistance would stop the speed rising long before that value.", "keywords": ["air resistance on Earth", "grows as speed increases", "vacuum in space", "nothing opposes the motion"], "src": "L|This speed would not be possible for the Juno probe on Earth because of air resistance."}, {"id": "y7c03-r030", "type": "short", "topic": "3.3", "source": "opus", "q": "Some spacecraft launched in the 1970s have no engines yet keep a constant speed. Explain how this is possible.", "answer": "These spacecraft are now far outside the Solar System, moving through a vacuum where there is no air resistance. An object only changes speed when a force acts along its direction of travel, and out there essentially nothing does, so the speed stays the same without any engine. On Earth the same spacecraft would slow down immediately, because air resistance would act in the opposite direction to movement.", "keywords": ["no air resistance in space", "no force along the direction of travel", "speed stays constant", "no engine needed"], "src": "W|These spacecraft do not have engines, but they are keeping a constant speed."}, {"id": "y7c03-r031", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why a bar graph is the right way to show the orbital speeds of the planets.", "answer": "A bar graph is used when the horizontal axis carries separate named categories rather than a continuous measurement, and the planets are separate objects, not points along a scale. The bars are spaced evenly and not touching, which shows that there are no values in between. A line graph would suggest that a planet could exist at any point between Mercury and Venus, which is not true.", "keywords": ["planets are separate categories", "not a continuous scale", "bars evenly spaced and not touching", "a line would imply values in between"], "src": "L|Explain why a bar graph is used for this information rather than a line graph."}, {"id": "y7c03-r032", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain what a tide is and how it differs from waves on the surface of the sea.", "answer": "The depth is the distance from the surface of the water to the bottom of the ocean, and in some parts of the world that depth changes by several metres during the day. This change in depth of the water is called a tide. Unlike waves, which come and go in seconds at the surface, a tide is a slow change of the whole water level, with high and low tides about six hours apart.", "keywords": ["tide is a change in the depth of the water", "several metres during the day", "slow change of the whole level", "six hours between high and low"], "src": "L|This change in depth of the water is called a tide."}, {"id": "y7c03-r033", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain what the tidal range is and why it differs between the Bay of Fundy and the Mediterranean.", "answer": "The difference in depth of the water between high and low tides is the tidal range. The largest tidal range in the world is 16.3 m in the Bay of Fundy in Canada, while some of the smallest are in the Caribbean and Mediterranean seas. So the same tidal forces act on the whole Earth but the range they produce depends on the local shape of the coast and how the water can pile up there.", "keywords": ["tidal range is the difference between high and low tide", "16.3 m in the Bay of Fundy", "very small in the Mediterranean", "depends on the local coast"], "src": "L|The difference in depth of the water between high and low tides is the tidal range."}, {"id": "y7c03-r034", "type": "short", "topic": "3.4", "source": "opus", "q": "The land itself rises and falls by about 30 cm each day. Explain why this earth tide is much smaller than the ocean tide.", "answer": "Tides are caused by the pull of the Moon's gravity acting on the Earth. As the oceans are made from water, the gravity from the Moon can pull the water more easily than the land, because water can flow and rearrange while rock cannot. The same tidal force therefore produces a movement of several metres in the ocean but only about 30 cm in the solid land.", "keywords": ["same tidal force acts on both", "water can flow and rearrange", "rock cannot move as easily", "30 cm earth tide"], "src": "L|Tides also cause the land to change in height through the day!"}, {"id": "y7c03-r035", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why there are two high tides each day rather than one.", "answer": "The side of the Earth closer to the Moon has a high tide because of the pull of gravity from the Moon, but the side furthest away also has a high tide. The Earth takes 24 hours to spin on its axis, so 12 hours later the side that was closest to the Moon is now furthest away, and it is in a high-tide position again. A place therefore passes through two high tides in each 24-hour spin.", "keywords": ["high tide on the near side", "also on the far side", "Earth spins once in 24 hours", "two high tides per day"], "src": "L|You can see from the drawing that the side furthest away also has a high tide."}, {"id": "y7c03-r036", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why the time between a high tide and the next low tide is about six hours.", "answer": "High tides are about 12 hours apart, because a place passes through two high-tide positions during each 24-hour spin of the Earth. Low tide occurs halfway between them, at the positions a quarter turn away from the Moon. Half of 12 hours is six, so the gap between a high tide and the next low tide is about six hours, which is why the two photographs of the same beach were taken six hours apart.", "keywords": ["12 hours between high tides", "low tide halfway between", "half of 12 is six", "six hours apart"], "src": "L|The time between high and low tide is six hours."}, {"id": "y7c03-r037", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why the Sun causes a weaker tidal force than the Moon, even though it is far more massive.", "answer": "The Sun also produces a tidal force on Earth, but this is weaker as the Sun is further away than the Moon. The strength of gravity decreases as distance increases, and the Sun is so much further away that this outweighs its far greater mass. Tidal effects depend on the difference in pull across the Earth, and that difference falls away with distance faster than the pull itself.", "keywords": ["Sun is much further away", "gravity weakens with distance", "distance outweighs the greater mass", "weaker tidal force"], "src": "L|The Sun also produces a tidal force on Earth, but this is weaker as the Sun is further away than the Moon."}, {"id": "y7c03-r038", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why the largest tidal ranges happen when there is a full moon or a new moon.", "answer": "When the Sun and the Moon are in line with Earth, this produces a larger tidal force, because their two pulls act along the same line and add together instead of partly cancelling. A full moon and a new moon are exactly the times when the Sun, Earth and Moon are lined up. The combined tidal force then raises the high tides higher and lowers the low tides further, giving the greatest tidal range.", "keywords": ["Sun and Moon in line with Earth", "pulls add together", "full moon and new moon are line-ups", "greatest tidal range"], "src": "L|When the Sun and the Moon are in line with Earth, this produces a larger tidal force."}, {"id": "y7c03-r039", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why some harbours can only be used at certain times of the day.", "answer": "The tide changes the depth of the water in the harbour by several metres between high and low tide. If the water in the harbour is not deep enough, boats cannot move safely, because the hull would touch the bottom. Since high tides are about 12 hours apart and low tide comes six hours after each one, a boat's safe window repeats on that same cycle rather than being available all day.", "keywords": ["tide changes the harbour depth", "too shallow at low tide", "boats cannot move safely", "window repeats on the tidal cycle"], "src": "L|If the water in the harbour is not deep enough, boats cannot move safely."}, {"id": "y7c03-r040", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why studying earth tides might help scientists warn people about volcanoes.", "answer": "Tides also cause the land to change in height through the day, and volcano eruptions have been linked with earth tides, as have earthquakes. If the flexing of the land by tidal forces makes an eruption more likely at particular times, then tracking earth tides gives a pattern to compare eruptions against. By studying earth tides, scientists may be able to predict when a volcano will become dangerous.", "keywords": ["earth tides flex the land", "eruptions linked with earth tides", "tides follow a known pattern", "may allow prediction"], "src": "L|Volcano eruptions have been linked with earth tides."}, {"id": "y7c03-r041", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain how tides affect food chains in coastal areas.", "answer": "The tide repeatedly uncovers and covers the shore, and at low tide birds can eat some types of shellfish when they are not covered with water. Some types of fish also move to find food according to tides in coastal areas. So the tide sets when each animal can reach its food, which means the feeding relationships in the food chain follow the tidal cycle rather than being available all the time.", "keywords": ["low tide uncovers shellfish for birds", "fish move with the tides", "tide controls when food is reachable", "food chain follows the cycle"], "src": "L|For example, at low tide birds can eat some types of shellfish when they are not covered with water."}, {"id": "y7c03-r042", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why energy is described as something that must be changed or transferred in order to do something.", "answer": "Energy that stays where it is and stays in the same form makes nothing happen; when energy is stored, the energy is not doing anything. It is the change or the transfer that produces an effect, such as heating a pot or moving a bus. So energy on its own is not an action; it is the capacity for one, and the action appears only when the energy moves or changes form.", "keywords": ["stored energy is not doing anything", "change or transfer produces the effect", "energy is the capacity for action"], "src": "L|Energy is something that must be changed or transferred in order to do something."}, {"id": "y7c03-r043", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why energy needs its own unit, the joule, rather than being measured in newtons.", "answer": "The unit for measuring the amount of energy is called the joule, while the newton measures force. They describe different things: a force is a push or pull acting on an object, while energy is what must be changed or transferred to make something happen. Using one unit for both would suggest they are the same quantity, and you could not then say that walking upstairs and boiling water need comparable amounts of energy.", "keywords": ["joule measures energy", "newton measures force", "different quantities", "comparisons need a common energy unit"], "src": "L|The unit for measuring the amount of energy is called the joule (J)."}, {"id": "y7c03-r044", "type": "short", "topic": "3.5", "source": "opus", "q": "A bus driving uphill is said to have chemical, kinetic, thermal, sound, gravitational potential and elastic energy at once. Explain how this is possible.", "answer": "Each name describes a different store or transfer, and they refer to different parts of the situation: the bus carries fuel, which is chemical; the bus is moving, which is kinetic; the engine is hot, which is thermal; the engine makes noise, which is sound; the bus is going uphill, which is gravitational potential; and the tyres get squeezed, which is elastic. They are not competing labels for one thing, so all can be true together.", "keywords": ["different stores describe different parts", "fuel is chemical", "movement is kinetic", "height is gravitational potential", "all true at once"], "src": "L|gravitational potential – the bus is going uphill"}, {"id": "y7c03-r045", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why uncooked rice and a battery are both described as stores of chemical energy.", "answer": "Both hold energy in a form that stays put until something releases it, and in both cases the energy is held in the substances themselves. You can keep uncooked rice for a long time, and a battery is another example of how chemical energy can be stored, so it is quite easy to store chemical energy. The energy only does something when the rice is eaten or the battery is connected in a circuit.", "keywords": ["energy held in the substances", "stays put until released", "rice and batteries both store it", "easy to store chemical energy"], "src": "L|Coal and crude oil are stores of chemical energy that formed millions of years ago."}, {"id": "y7c03-r046", "type": "short", "topic": "3.5", "source": "opus", "q": "Coal and crude oil formed millions of years ago. Explain what this tells you about chemical energy stores.", "answer": "Coal and crude oil are stores of chemical energy that formed millions of years ago, which shows that some energy stores can last for a very long time. The energy has not leaked away over that time, because chemical energy stays in the substance until a process such as burning releases it. This is what makes fuels useful: they can be moved and kept for years and still release their energy when needed.", "keywords": ["chemical energy can last millions of years", "does not leak away", "released only by a process such as burning", "fuels can be stored and moved"], "src": "L|This shows that some energy stores can last for a very long time."}, {"id": "y7c03-r047", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why kinetic energy is harder to store than chemical or gravitational potential energy.", "answer": "A tennis ball has a store of kinetic energy while it is moving, but the ball will eventually stop, because forces such as air resistance and friction keep transferring that energy away. Chemical energy sits in a substance and gravitational potential energy sits in a raised object, and neither needs the object to keep doing anything. Kinetic energy exists only while the movement lasts, so keeping it means keeping the movement going.", "keywords": ["kinetic energy exists only while moving", "movement is opposed by resistance", "chemical and gravitational stores need no motion", "harder to keep"], "src": "L|Kinetic energy is more difficult than chemical or gravitational potential energy to store."}, {"id": "y7c03-r048", "type": "short", "topic": "3.5", "source": "opus", "q": "Water is pumped up into a tank. Explain what has been stored and why the pump was needed.", "answer": "A pump has been used to lift up the water, and the water then stores gravitational potential energy because of its height. Lifting requires pulling against gravity, so the pump had to transfer energy to the water to raise it, and that energy is now held in the raised position. It can be released later by letting the water fall, which is why storing energy this way is useful.", "keywords": ["pump lifts the water against gravity", "raised water stores gravitational potential energy", "energy can be released by letting it fall"], "src": "L|The water stores gravitational potential energy."}, {"id": "y7c03-r049", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why thermal energy is described as a store that only lasts a short time.", "answer": "Hot objects will eventually cool down, so they lose their store of thermal energy to whatever is around them. Thermal energy moves from hotter places to cooler ones whenever they are in contact, and nothing in an ordinary room stops that happening. A store that leaks away by itself cannot be kept, which is why thermal energy is unlike chemical energy that can sit in coal for millions of years.", "keywords": ["hot objects cool down", "thermal energy spreads to the surroundings", "leaks away by itself", "unlike chemical energy"], "src": "L|Hot objects will eventually cool down (they will lose their store of thermal energy)."}, {"id": "y7c03-r050", "type": "short", "topic": "3.6", "source": "opus", "q": "Describe the sequence of energy changes when wood is burned to heat a cooking pot.", "answer": "Wood is a store of chemical energy. Burning the wood changes the chemical energy to thermal energy, and the thermal energy is then transferred to the pot and the food inside. The important distinction is that burning changes the form of the energy, while heating the pot transfers energy from one place to another without changing its form, so the sequence contains both a change and a transfer.", "keywords": ["wood stores chemical energy", "burning changes it to thermal", "thermal energy transferred to the pot", "change and transfer are different"], "src": "L|Burning the wood changes the chemical energy to thermal energy (heat)."}, {"id": "y7c03-r051", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain the energy changes when a person walks up a flight of stairs.", "answer": "They are changing chemical energy from their food into kinetic energy for movement. The movement is taking the people higher, so kinetic energy is being changed to gravitational potential energy as they rise. The chain runs from a store in the food, through movement, to a store in the raised position of the body, and each step happens because a process, in this case the person walking, is making it happen.", "keywords": ["chemical energy from food", "changed to kinetic for movement", "kinetic changed to gravitational potential", "a process drives each step"], "src": "L|The movement is taking the people higher, so kinetic energy is being changed to gravitational potential energy."}, {"id": "y7c03-r052", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain the sequence of energy changes in a gas-fired power station.", "answer": "The power station uses the chemical energy stored in natural gas. The gas is burned, which changes chemical energy to thermal energy; the thermal energy is then changed to kinetic energy in large generators that spin around; the kinetic energy is then changed to electrical energy; and the electrical energy is transferred through wires into homes and buildings. Each step needs a process, and the last step is a transfer rather than a change.", "keywords": ["chemical in the gas", "burning gives thermal", "thermal to kinetic in the generators", "kinetic to electrical", "transferred through wires"], "src": "L|The kinetic energy is then changed to electrical energy."}, {"id": "y7c03-r053", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why every energy change needs a process or an event.", "answer": "In all these examples, there is a process or event that changes or transfers the energy; for example, burning is a process, and a book falling from a shelf is an event. Energy that is stored is not doing anything, so something has to happen for the change to take place. Naming the process is what turns a list of energy types into an explanation of why the change occurred.", "keywords": ["energy stored does nothing by itself", "a process or event is needed", "burning is a process", "a falling book is an event"], "src": "L|In all these examples, there is a process or event that changes or transfers the energy."}, {"id": "y7c03-r054", "type": "short", "topic": "3.6", "source": "opus", "q": "A book falls from a shelf. Explain the energy change, and say why it is called an event rather than a process.", "answer": "When the book is on the shelf it has stored gravitational potential energy because of its height, and this energy is changed to kinetic energy as the book falls. It is called an event because it happens once, at a particular moment, rather than being something kept going like burning. Either way, something had to happen before the stored energy could change into movement.", "keywords": ["gravitational potential energy on the shelf", "changed to kinetic as it falls", "an event happens once", "a process is kept going"], "src": "L|This energy is changed to kinetic energy as the book falls."}, {"id": "y7c03-r055", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain what makes an energy change useful, and give an example of one that is not.", "answer": "An energy change is useful when the energy is changed in a way that we want, such as electrical energy changed to light in a lamp. Energy changes are not always helpful: typhoons, hurricanes, earthquakes and tsunamis are examples of how energy changes can be very dangerous. So useful is a judgement about our purposes, not a property of the energy itself, which behaves the same way in both cases.", "keywords": ["useful means changed the way we want", "storms and earthquakes are damaging energy changes", "useful is a judgement about purpose"], "src": "L|That means the energy is changed in a way that we want."}, {"id": "y7c03-r056", "type": "short", "topic": "3.6", "source": "opus", "q": "A television converts electrical energy to sound and light. Explain why one input can give two useful outputs.", "answer": "A single store can be changed into more than one form at the same time, because different parts of the device do different jobs: the screen produces light and the speaker produces sound, both drawing on the same electrical supply. Nothing requires an energy change to have only one output. The total energy out, including the thermal energy the set also produces, matches the electrical energy put in.", "keywords": ["one input can give several outputs", "different parts do different jobs", "screen gives light, speaker gives sound", "total out matches total in"], "src": "L|A television converts electrical energy to sound and light."}, {"id": "y7c03-r057", "type": "short", "topic": "3.6", "source": "opus", "q": "Water freezing is an energy change. Explain what happens to the energy.", "answer": "Freezing happens when energy is transferred out of the water to its surroundings, which is why a freezer has to remove heat rather than add anything. As the particles lose energy they move more slowly until they can only vibrate, and they settle into the fixed pattern of a solid. The energy has not vanished; it has been transferred to the surroundings, which become slightly warmer.", "keywords": ["energy transferred out of the water", "particles move more slowly", "settle into a fixed pattern", "surroundings gain the energy"], "src": "L|Make a display to show the energy change when water freezes."}, {"id": "y7c03-r058", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain what is meant by wasted energy.", "answer": "Every time you use energy to make something happen, energy is transferred or changed. Some of the energy transferred or changed is useful, but some of it is wasted, meaning it ends up in forms or places we did not want. The wasted energy has not disappeared and it is not destroyed; it has simply gone somewhere that is of no use to us, which is why it is called wasted rather than lost.", "keywords": ["some energy is useful, some wasted", "wasted energy goes where we did not want", "not destroyed", "no longer useful"], "src": "L|Look at the picture of fuel being added to a motorcycle."}, {"id": "y7c03-r059", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain what dissipated energy means and why it cannot be recovered.", "answer": "Dissipated energy is energy that spreads out where there is no use for it. You cannot gather thermal energy or sound and bring them back into one place to be stored, changed or transferred, because once the energy has spread through the air, the ground and the surrounding objects it is shared among an enormous number of particles. The energy still exists, but it is too thinly spread to be collected and used again.", "keywords": ["dissipated means spread out", "no use for it where it goes", "cannot be gathered back", "still exists but too thinly spread"], "src": "L|Dissipated energy is energy that spreads out where there is no use for it."}, {"id": "y7c03-r060", "type": "short", "topic": "3.7", "source": "opus", "q": "Only about 25% of the chemical energy in a motorcycle's fuel is used for movement. Explain where the rest goes.", "answer": "The motorcycle engine changes chemical energy stored in the fuel into useful kinetic energy to move the motorcycle and rider, but chemical energy from the fuel is also changed into thermal energy and sound energy. The other 75% of the energy is therefore wasted energy that heats the engine and the air and makes noise. This wasted energy is dissipated and cannot be recovered.", "keywords": ["25% becomes useful kinetic energy", "rest becomes thermal and sound", "75% is wasted", "dissipated and cannot be recovered"], "src": "L|In fact, only about 14 or 25% of the chemical energy in the fuel is used for movement."}, {"id": "y7c03-r061", "type": "short", "topic": "3.7", "source": "opus", "q": "Lamp A wastes 85% of its energy and Lamp B wastes 50%, yet both give the same brightness. Explain what this means for the electricity each uses.", "answer": "Both lamps change electrical energy to light energy, but Lamp A only changes about 15% of the electrical energy into light while Lamp B changes about 50%. To produce the same brightness, Lamp A must therefore be supplied with much more electrical energy than Lamp B, and the extra is dissipated as thermal energy. Lamp B does the same job for less electricity, which is why the wasted fraction matters.", "keywords": ["A converts 15% to light", "B converts 50%", "same brightness needs more electricity for A", "the extra is dissipated as thermal energy"], "src": "L|85% of the electrical energy is wasted as thermal energy from this lamp."}, {"id": "y7c03-r062", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why some thermal energy is wasted in every energy change, even in a device designed to produce heat.", "answer": "Every time energy is changed or transferred, some thermal energy is wasted and this wasted thermal energy is dissipated. Even when you want to produce thermal energy some of it is wasted: when water is heated over a fire, thermal energy also heats the rocks, the metal container and the air around it, and some escapes in the steam. Only the part that reaches the water counts as useful, so waste happens even here.", "keywords": ["some thermal energy is always wasted", "heats the container, rocks and air", "some escapes in the steam", "only the part reaching the water is useful"], "src": "L|Every time energy is changed or transferred, there is some thermal energy is wasted."}, {"id": "y7c03-r063", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why no machine can be built that wastes no energy at all.", "answer": "For everything that uses energy change or transfer, some of that energy will always be dissipated. Every moving part rubs, every hot part warms its surroundings and every working device makes some sound, and each of these spreads energy out where there is no use for it. So waste is not a fault in the design that better engineering could remove entirely; it is a feature of every energy change.", "keywords": ["some energy is always dissipated", "rubbing, heating and sound in every device", "waste is not merely a design fault"], "src": "L|For everything that uses energy change or transfer, some of that energy will always be dissipated."}, {"id": "y7c03-r064", "type": "short", "topic": "3.7", "source": "opus", "q": "As you move away from a hot object you feel less heat. Explain why, using the idea of dissipation.", "answer": "Thermal energy from the object spreads out in all directions, so the further away you are the larger the area that same energy has spread across and the smaller the share that reaches you. The temperature will go down as you move further away, and the fall is steep close to the object and gentler further out. This is dissipation seen directly: the energy is not gone, it is simply thinner where you are standing.", "keywords": ["energy spreads out in all directions", "spread over a larger area further away", "smaller share reaches you", "temperature falls with distance"], "src": "L|As you move away from a hot object, you feel less heat from it."}, {"id": "y7c03-r065", "type": "short", "topic": "3.7", "source": "opus", "q": "Hot water in a beaker cools down. Name the energy that leaves and list where it goes.", "answer": "The energy that leaves is thermal energy. It goes into the glass of the beaker and then into the air around it, into the bench the beaker stands on, and into the surroundings by evaporation from the water surface. In every case it spreads out among far more particles than it started in, so it is dissipated: the total energy is unchanged but none of it can be gathered back into the water.", "keywords": ["thermal energy leaves the water", "goes to the beaker, air and bench", "some carried away by evaporation", "dissipated and not recoverable"], "src": "W|List two places that this energy will go to when it leaves the water."}, {"id": "y7c03-r066", "type": "short", "topic": "3.7", "source": "opus", "q": "Diesel engines are more expensive than petrol engines of the same size, yet large trucks use them. Suggest why.", "answer": "A diesel engine transfers a larger share of the energy it uses to useful energy, so less is wasted as thermal and sound energy. Large trucks travel for long periods and carry heavy loads, so the fuel they use over their lifetime is very large, and a small improvement in the useful share saves a great deal of fuel. The extra cost of the engine is paid back by the fuel it does not waste.", "keywords": ["diesel wastes a smaller share", "trucks travel long distances for long periods", "large total fuel use", "fuel saving repays the extra cost"], "src": "W|Suggest why diesel engines are used instead of petrol engines in large trucks.."}, {"id": "y7c03-o001", "type": "short", "topic": "3.1", "source": "opus", "q": "Name the force that pulls a dropped object towards the ground.", "answer": "The force of gravity.", "keywords": ["gravity"], "explain": "Every object with mass causes a force of gravity. The Earth has a huge mass, so its gravity is strong enough to pull objects down.", "src": "L|The force of gravity caused by an object acts towards the centre of the object."}, {"id": "y7c03-o021", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain why scientists cannot simply watch how the Solar System was formed.", "answer": "There were no people alive at the time to observe it happening.", "keywords": ["no people", "observe"], "explain": "Instead, scientists look for evidence that survives today and build models to test their ideas.", "src": "L|When the Solar System formed, there were no people to observe how it was made."}, {"id": "y7c03-o022", "type": "short", "topic": "3.2", "source": "opus", "q": "What does the word 'observe' mean?", "answer": "To watch something happening.", "keywords": ["watch"], "explain": "Observations are one of the main sources of evidence in science.", "src": "L|Observe means to watch something happening."}, {"id": "y7c03-o023", "type": "short", "topic": "3.2", "source": "opus", "q": "What is a nebula?", "answer": "A cloud of dust and gas in space.", "keywords": ["cloud", "dust", "gas"], "explain": "The Orion Nebula is one example, and new stars can be seen forming inside it.", "src": "L|A cloud of dust and gas in space is called a nebula."}, {"id": "y7c03-o026", "type": "short", "topic": "3.2", "source": "opus", "q": "Give one reason why scientists use a computer model to study how the Solar System formed.", "answer": "It is impossible to do the real experiment: forming a star takes millions of years, needs far too much space, and cannot be set up in a laboratory.", "keywords": ["millions of years", "cannot do an experiment"], "explain": "A model lets scientists change the starting conditions and see what result each one produces.", "src": "L|Scientists cannot observe a star or Solar System forming in an experiment."}, {"id": "y7c03-o034", "type": "short", "topic": "3.3", "source": "opus", "q": "Which object has the largest mass in the Solar System?", "answer": "The Sun.", "keywords": ["Sun"], "explain": "The Sun's mass is greater than the mass of all the planets added together, which is why its gravity controls the whole Solar System.", "src": "L|The Sun is the object with the largest mass in the Solar System."}, {"id": "y7c03-o035", "type": "short", "topic": "3.3", "source": "opus", "q": "How many times stronger is the Sun's gravity than the Earth's gravity?", "answer": "27 times stronger.", "keywords": ["27"], "explain": "Earth's gravity is 10 N/kg, so the Sun's is about 270 N/kg.", "src": "L|The Sun’s gravity is 27 times stronger than the Earth’s gravity."}, {"id": "y7c03-o036", "type": "short", "topic": "3.3", "source": "opus", "q": "What does the Sun's gravity do to the planets?", "answer": "It holds all the planets in their orbits.", "keywords": ["holds", "orbit"], "explain": "Without it, each planet would travel off in a straight line into space.", "src": "L|It holds all the planets in their orbits."}, {"id": "y7c03-o050", "type": "short", "topic": "3.4", "source": "opus", "q": "What is a tide?", "answer": "The regular change in the depth of the ocean during the day.", "keywords": ["change", "depth"], "explain": "In some parts of the world the depth changes by several metres between high and low tide.", "src": "L|In some parts of the world, the depth of the ocean changes by several metres during the day."}, {"id": "y7c03-o051", "type": "short", "topic": "3.4", "source": "opus", "q": "What is meant by the depth of the ocean?", "answer": "The distance from the surface of the water to the bottom of the ocean.", "keywords": ["surface", "bottom"], "explain": "It is this distance that rises and falls with the tide.", "src": "L|The depth is the distance from the surface of the water to the bottom of the ocean."}, {"id": "y7c03-o062", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why the time between high tides is about 12 hours.", "answer": "The Earth spins once in 24 hours, so 12 hours after a place is closest to the Moon it is furthest away, and both positions give a high tide.", "keywords": ["24 hours", "12 hours", "furthest"], "explain": "There are two high-tide bulges, and the Earth turns through both of them in one day.", "src": "L|This means that 12 hours later, the side that was closest to the Moon is now furthest away."}, {"id": "y7c03-o069", "type": "short", "topic": "3.5", "source": "opus", "q": "What is energy?", "answer": "Energy is something that must be changed or transferred in order to make something happen.", "keywords": ["changed", "transferred"], "explain": "Nothing at all can happen without an energy change or an energy transfer.", "src": "L|Energy is something that must be changed or transferred in order to do something."}, {"id": "y7c03-o070", "type": "short", "topic": "3.5", "source": "opus", "q": "What kind of energy does a moving object have?", "answer": "Kinetic energy.", "keywords": ["kinetic"], "explain": "Kinetic energy is an energy store: the object has it for as long as it keeps moving.", "src": "L|For example, kinetic energy is the energy in movement."}, {"id": "y7c03-o071", "type": "short", "topic": "3.5", "source": "opus", "q": "Give three examples of things that are stores of chemical energy.", "answer": "Food, batteries and chemical fuels such as wood, oil and coal.", "keywords": ["food", "batteries", "fuel"], "explain": "Chemical energy is the easiest kind of energy to store, and it can be kept for a very long time.", "src": "L|energy stored in food, batteries, chemical fuels such as wood, oil and coal"}, {"id": "y7c03-o072", "type": "short", "topic": "3.5", "source": "opus", "q": "What kind of energy is stored when an object is stretched or squeezed out of shape?", "answer": "Elastic potential energy.", "keywords": ["elastic"], "explain": "A stretched spring, a squeezed tyre and a drawn bow are all elastic potential energy stores.", "src": "L|energy stored when things are stretched or squeezed to change their shape"}, {"id": "y7c03-o073", "type": "short", "topic": "3.5", "source": "opus", "q": "What kind of energy is stored when an object is lifted away from a source of gravity?", "answer": "Gravitational potential energy.", "keywords": ["gravitational potential"], "explain": "Lifting an object against gravity is what puts the energy into the store.", "src": "L|energy stored when an object is lifted away from a source of gravity"}, {"id": "y7c03-o084", "type": "short", "topic": "3.6", "source": "opus", "q": "Complete the sentence: when something happens, energy is ... or ... .", "answer": "Changed or transferred.", "keywords": ["changed", "transferred"], "explain": "While energy is simply stored it is not doing anything. Something only happens when energy changes or is transferred.", "src": "L|In Section 3.5, you learned that energy is something that must be changed or transferred in order to do something."}, {"id": "y7c03-o085", "type": "short", "topic": "3.6", "source": "opus", "q": "Which energy store does the wood in a cooking fire hold?", "answer": "Chemical energy.", "keywords": ["chemical"], "explain": "All fuels, including wood, are stores of chemical energy.", "src": "L|The fuel for the fire is wood. Wood is a store of chemical energy."}, {"id": "y7c03-o086", "type": "short", "topic": "3.6", "source": "opus", "q": "Describe the energy change that happens when wood is burned.", "answer": "Chemical energy is changed to thermal energy.", "keywords": ["chemical", "thermal"], "explain": "Burning is the process that releases the chemical store as heat.", "src": "L|Burning the wood changes the chemical energy to thermal energy (heat)."}, {"id": "y7c03-o087", "type": "short", "topic": "3.6", "source": "opus", "q": "Where does the thermal energy from a cooking fire go?", "answer": "It is transferred to the pot and to the food inside it.", "keywords": ["pot", "food"], "explain": "Some of it also heats the surrounding air and the ground, which is wasted energy.", "src": "L|The thermal energy is then transferred to the pot and the food inside."}, {"id": "y7c03-o088", "type": "short", "topic": "3.6", "source": "opus", "q": "Describe the energy changes that happen when a person walks up a flight of stairs.", "answer": "Chemical energy from their food is changed to kinetic energy for movement, and the kinetic energy is then changed to gravitational potential energy as they go higher.", "keywords": ["chemical", "kinetic", "gravitational potential"], "explain": "The gravitational potential store is what you have gained at the top of the stairs.", "src": "L|They are changing chemical energy from their food into kinetic energy for movement."}, {"id": "y7c03-o096", "type": "short", "topic": "3.7", "source": "opus", "q": "Every time energy is transferred or changed, what happens to it?", "answer": "Some of the energy is useful, but some of it is wasted.", "keywords": ["useful", "wasted"], "explain": "There is no exception: every energy change wastes some energy as thermal energy.", "src": "L|Some of the energy transferred or changed is useful, but some of it is wasted."}, {"id": "y7c03-o097", "type": "short", "topic": "3.7", "source": "opus", "q": "Describe the useful and wasted energy in a motorcycle engine.", "answer": "The chemical energy in the petrol is changed to useful kinetic energy to move the motorcycle. The rest is wasted, mostly as thermal energy and sound.", "keywords": ["chemical", "kinetic", "wasted"], "explain": "Only a fraction of the chemical energy in the fuel actually moves the motorcycle.", "src": "L|The motorcycle engine changes only some of this into kinetic energy. The rest of the energy is wasted."}, {"id": "y7c03-o098", "type": "short", "topic": "3.7", "source": "opus", "q": "Two lamps give out light of the same brightness. Must they use the same amount of energy?", "answer": "No. Two lamps of the same brightness can waste very different quantities of energy.", "keywords": ["no", "different", "waste"], "explain": "Lamp A wastes 85% of the electrical energy as heat; lamp B wastes only 50%.", "src": "L|These two lamps emit the same brightness of light but they waste very different quantities of energy."}, {"id": "qwen-01-01", "type": "mcq", "topic": "3.1", "source": "qwen", "q": "What is the unit used to measure weight?", "explain": "Weight is a force and it is measured in newtons, N.", "src": "L|Weight is a force and it is measured in newtons, N.", "options": ["kilograms (kg)", "newtons (N)", "grams (g)", "metres (m)"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "3.1", "source": "qwen", "q": "Mass is the quantity of matter in an object and it is measured in ____.", "explain": "Mass as the quantity of matter and states it is measured in kilograms, kg.", "src": "L|Mass is the quantity of matter in an object. It is measured in kilograms, kg.", "answer": ["kilograms"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "3.1", "source": "qwen", "q": "In which direction does the force of gravity act on an object near Earth?", "explain": "The force of gravity caused by an object acts towards the centre of the object.", "src": "L|The force of gravity caused by an object acts towards the centre of the object.", "options": ["Away from the centre of the Earth", "Towards the centre of the Earth", "Sideways along the surface", "Upwards into space"], "answer": 1}, {"id": "qwen-01-04", "type": "fill", "topic": "3.1", "source": "qwen", "q": "The force from a surface that pushes up to support an object is called the ____ force.", "explain": "This upward push from a surface as the contact force.", "src": "L|This force from the desk is called the contact force.", "answer": ["contact"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "What is the name given to a cloud of dust and gas in space?", "explain": "A cloud of dust and gas in space is called a nebula.", "src": "L|A cloud of dust and gas in space is called a nebula.", "options": ["nebula", "orbit", "axis", "model"], "answer": 0}, {"id": "qwen-02-02", "type": "fill", "topic": "3.2", "source": "qwen", "q": "Scientists use computers to create a ____ to represent something that is difficult to observe directly.", "explain": "A model is a way of representing something that is difficult to observe directly, so scientists build computer models of things they cannot watch happening.", "src": "L|A model is a way of representing something that is difficult to observe directly.", "answer": ["model"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "Why do scientists use computer models to study the formation of the Solar System?", "explain": "Models are used because it takes millions of years to form a star and planets.", "src": "L|One reason for using a model is that it takes millions of years to form a star and planets", "options": ["It takes millions of years for stars and planets to form", "The Solar System is too far away to see", "Computers are cheaper than telescopes", "Dust and gas cannot be put in a computer"], "answer": 0}, {"id": "qwen-02-04", "type": "fill", "topic": "3.2", "source": "qwen", "q": "As particles of dust and gas stick together, their total mass increases, so the strength of their ____ also increases.", "explain": "As mass increases, the strength of gravity also increases.", "src": "L|As their mass increases, so does the strength of their gravity.", "answer": ["gravity"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "Which planet spins on its axis in the opposite direction to most other planets?", "explain": "Venus and Uranus are exceptions to the general rule of spin direction.", "src": "L|The Sun and all the planets (except Venus and Uranus) spin on their axes", "options": ["Venus", "Mars", "Jupiter", "Saturn"], "answer": 0}, {"id": "qwen-02-06", "type": "fill", "topic": "3.3", "source": "qwen", "q": "A space where there are no particles is called a ____.", "explain": "A vacuum as a space where there are no particles.", "src": "L|A space where there are no particles is a vacuum.", "answer": ["vacuum"]}, {"id": "qwen-02-07", "type": "mcq", "topic": "3.3", "source": "qwen", "q": "What force keeps the planets in their orbits around the Sun?", "explain": "The Sun's gravity holds all the planets in their orbits.", "src": "L|It holds all the planets in their orbits.", "options": ["The Sun's gravity", "Air resistance", "Friction from space dust", "Magnetic force"], "answer": 0}, {"id": "qwen-02-08", "type": "fill", "topic": "3.3", "source": "qwen", "q": "The force of gravity from the Sun always acts towards the ____.", "explain": "The force of gravity from the Sun acts towards the Sun.", "src": "L|The force of gravity from the Sun that acts on a planet always acts towards the Sun.", "answer": ["Sun"]}, {"id": "qwen-02-11", "type": "mcq", "topic": "3.3", "source": "qwen", "q": "Why can spacecraft reach very high speeds in space but not on Earth?", "explain": "Space is a vacuum with no air resistance, allowing objects to reach high speeds.", "src": "L|In space, where there is a vacuum and no air resistance", "options": ["There is no air resistance in a vacuum", "Spacecraft are lighter in space", "Gravity is stronger in space", "The Sun pushes them faster"], "answer": 0}, {"id": "qwen-03-01", "type": "mcq", "topic": "3.4", "source": "qwen", "q": "What is the name given to the pull of gravity that causes tides?", "explain": "The pull from the Moon's gravity is called a tidal force.", "src": "L|The pull from the Moon’s gravity is called a tidal force.", "options": ["tidal range", "tidal force", "high tide", "earth tide"], "answer": 1}, {"id": "qwen-03-02", "type": "fill", "topic": "3.4", "source": "qwen", "q": "The difference in depth of the water between high and low tides is called the ____.", "explain": "Tidal range as the difference in depth between high and low tides.", "src": "L|The difference in depth of the water between high and low tides is the tidal range.", "answer": ["tidal range"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "3.4", "source": "qwen", "q": "Why does the Moon cause a stronger tidal force than the Sun?", "explain": "The Sun's tidal force is weaker because it is further away than the Moon.", "src": "L|this is weaker as the Sun is further away than the Moon", "options": ["The Moon is larger than the Sun.", "The Moon is closer to Earth than the Sun.", "The Sun does not have gravity.", "The Moon spins faster than the Sun."], "answer": 1}, {"id": "qwen-03-04", "type": "fill", "topic": "3.4", "source": "qwen", "q": "High tides are about ____ hours apart.", "explain": "High tides are about 12 hours apart.", "src": "L|High tides are about 12 hours apart.", "answer": ["12"]}, {"id": "qwen-03-08", "type": "fill", "topic": "3.5", "source": "qwen", "q": "The unit for measuring the amount of energy is called the ____.", "explain": "The joule as the unit for measuring energy.", "src": "L|The unit for measuring the amount of energy is called the joule (J).", "answer": ["joule"]}, {"id": "qwen-03-09", "type": "mcq", "topic": "3.5", "source": "qwen", "q": "Which type of energy is stored in food and batteries?", "explain": "The table lists chemical energy as being stored in food and batteries.", "src": "L|energy stored in food, batteries, chemical fuels such as wood, oil and coal", "options": ["kinetic", "chemical", "thermal", "elastic potential"], "answer": 1}, {"id": "qwen-03-11", "type": "mcq", "topic": "3.5", "source": "qwen", "q": "Which of these is an example of a luminous object?", "explain": "Luminous objects give out their own light. The Sun is a source of its own light, unlike the Moon which reflects it.", "src": "L|visible energy from luminous objects (objects that give out their own light)", "options": ["The Sun", "The Moon", "A mirror", "A white wall in sunlight"], "answer": 0}, {"id": "qwen-04-07", "type": "mcq", "topic": "3.6", "source": "qwen", "q": "When wood is burned, chemical energy changes into which type of energy?", "explain": "Burning wood changes chemical energy to thermal energy.", "src": "L|Burning the wood changes the chemical energy to thermal energy", "options": ["electrical", "kinetic", "ther
