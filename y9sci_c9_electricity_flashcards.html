<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chapter 9 — Electricity — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
</style>
</head>

measuring voltage.", "labels": [{"n": 1, "text": "9 V", "alt": [], "x": 43.0, "y": 6.3, "w": 5.9, "h": 6.8}, {"n": 2, "text": "L1", "alt": [], "x": 14.7, "y": 85.2, "w": 3.8, "h": 8.2}, {"n": 3, "text": "L2", "alt": [], "x": 44.0, "y": 85.2, "w": 3.8, "h": 8.2}, {"n": 4, "text": "B1", "alt": [], "x": 73.1, "y": 85.2, "w": 4.2, "h": 8.2}], "src": "L|9 V"}, {"id": "ch09-f10h3", "type": "hotspot", "topic": "9.2", "source": "opus", "image": "img/L_p16_activity_circuit.png", "figure": "L_p16_activity_circuit", "q": "Click on lamp L2.", "caption": "The series circuit used in Activity 9.1.1 for measuring voltage.", "target": {"x": 45.9, "y": 89.3, "r": 7.0}, "explain": "In Activity 9.1.1 the voltmeter is connected across each component in turn - L1, L2 and buzzer B1 - and those three voltages add up to the battery voltage.", "src": "L|L2"}, {"id": "ch09-f11h2", "type": "hotspot", "topic": "9.3", "source": "opus", "image": "img/L_p21_ohm_triangle.png", "figure": "L_p21_ohm_triangle", "q": "Click on the symbol for current in the Ohm's law triangle.", "caption": "The triangle that helps you rearrange Ohm's law.", "target": {"x": 37.2, "y": 74.0, "r": 7.0}, "explain": "I stands for current, measured in amps. The letter I is used because in French current was originally called intensite du courant.", "src": "L|I"}, {"id": "ch09-f11h3", "type": "hotspot", "topic": "9.3", "source": "opus", "image": "img/L_p21_ohm_triangle.png", "figure": "L_p21_ohm_triangle", "q": "Click on the symbol for resistance in the Ohm's law triangle.", "caption": "The triangle that helps you rearrange Ohm's law.", "target": {"x": 58.7, "y": 74.0, "r": 7.0}, "explain": "R is resistance, measured in ohms. The triangle gives V = I x R, R = V / I and I = V / R.", "src": "L|R"}, {"id": "ch09-f12a", "type": "label", "topic": "9.3", "source": "opus", "image": "img/L_p22_ohm_questions.png", "figure": "L_p22_ohm_questions", "q": "State the value printed at position {n}.", "caption": "Two circuits, each containing one resistor.", "labels": [{"n": 1, "text": "2 A", "alt": [], "x": 21.3, "y": 9.3, "w": 9.3, "h": 6.8}, {"n": 2, "text": "6 Ω", "alt": ["6 ohms", "6 ohm"], "x": 64.0, "y": 12.7, "w": 9.9, "h": 6.8}, {"n": 3, "text": "12 V", "alt": [], "x": 62.8, "y": 43.7, "w": 12.6, "h": 6.8}, {"n": 4, "text": "100 Ω", "alt": ["100 ohms", "100 ohm"], "x": 60.3, "y": 72.0, "w": 17.6, "h": 6.8}], "src": "L|2 A"}, {"id": "ch09-f12h2", "type": "hotspot", "topic": "9.3", "source": "opus", "image": "img/L_p22_ohm_questions.png", "figure": "L_p22_ohm_questions", "q": "Click on the resistance value in the upper circuit.", "caption": "Two circuits, each containing one resistor.", "target": {"x": 69.0, "y": 16.1, "r": 7.0}, "explain": "The upper circuit has a 6 ohm resistor carrying 2 A, so the voltage across it is V = I x R = 2 x 6 = 12 V.", "src": "L|6 Ω"}, {"id": "ch09-f12h3", "type": "hotspot", "topic": "9.3", "source": "opus", "image": "img/L_p22_ohm_questions.png", "figure": "L_p22_ohm_questions", "q": "Click on the voltage across the 100 ohm resistor.", "caption": "Two circuits, each containing one resistor.", "target": {"x": 69.1, "y": 47.1, "r": 7.0}, "explain": "The lower circuit has 12 V across a 100 ohm resistor, so the current is I = V / R = 12 / 100 = 0.12 A.", "src": "L|12 V"}, {"id": "ch09-f13h3", "type": "hotspot", "topic": "9.4", "source": "opus", "image": "img/L_p28_potential_divider.png", "figure": "L_p28_potential_divider", "q": "Click on the lamp that runs at half the battery voltage.", "caption": "Two equal resistors share the battery voltage so that a 6 V lamp can run from a 12 V battery.", "target": {"x": 14.5, "y": 90.0, "r": 7.0}, "explain": "Two resistors of equal resistance in series share the 12 V equally, so there is 6 V across each. A 6 V lamp connected in parallel with one of them receives 6 V and works properly.", "src": "L|6 V lamp"}, {"id": "ch09-o001", "type": "short", "topic": "9.1", "source": "opus", "q": "What does it mean to say that components are connected in series?", "answer": "Series means all the components are connected end-to-end, or one after the other.", "keywords": ["end-to-end", "one after the other"], "explain": "A marker looks for: end-to-end, one after the other", "src": "L|Series means all the components are connected end-to-end or one after the other."}, {"id": "ch09-o002", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain why the current is the same all the way around a series circuit.", "answer": "In a series circuit there is only one path for the current to flow, so the same current must pass through every component.", "keywords": ["only one path", "current is the same"], "explain": "A marker looks for: only one path, current is the same", "src": "L|In a series circuit, there is only one path for the current to flow. This means the current is the same all the way around a series circuit."}, {"id": "ch09-o003", "type": "short", "topic": "9.1", "source": "opus", "q": "A lamp and a buzzer are in series with a cell and a switch. What happens when the switch is opened, and why do both components stop at the same time?", "answer": "Both the lamp and the buzzer stop operating. They stop at the same time because opening the switch stops the current flowing in the whole circuit.", "keywords": ["both stop", "at the same time", "current in the whole circuit stops"], "explain": "A marker looks for: both stop, at the same time, current in the whole circuit stops", "src": "L|They both stop operating at the same time because the current in the whole circuit stops flowing when the switch is opened."}, {"id": "ch09-o004", "type": "short", "topic": "9.1", "source": "opus", "q": "What is a parallel circuit, and what are the separate paths called?", "answer": "In a parallel circuit there is more than one path for the current to flow. The paths where the current can flow are called branches.", "keywords": ["more than one path", "branches"], "explain": "A marker looks for: more than one path, branches", "src": "L|In a parallel circuit, there is more than one path for the current to flow. The paths where the current can flow are called branches."}, {"id": "ch09-o005", "type": "short", "topic": "9.1", "source": "opus", "q": "Where does the name 'parallel circuit' come from?", "answer": "It comes from the circuit diagram, because the branches are drawn parallel to each other.", "keywords": ["circuit diagram", "branches", "drawn parallel"], "explain": "A marker looks for: circuit diagram, branches, drawn parallel", "src": "L|The name parallel comes from the circuit diagram because the branches are drawn parallel to each other."}, {"id": "ch09-o006", "type": "short", "topic": "9.1", "source": "opus", "q": "Describe what happens to the current from the cell when it reaches a branch in a parallel circuit with two identical lamps.", "answer": "At the branch the current is divided. Because the two lamps are the same, the current is divided equally between them.", "keywords": ["divided", "equally", "two lamps are the same"], "explain": "A marker looks for: divided, equally, two lamps are the same", "src": "L|At the branch, the current is divided. If the two lamps are the same, the current will be divided equally between them."}, {"id": "ch09-o007", "type": "short", "topic": "9.1", "source": "opus", "q": "What happens to the currents in the branches on the far side of a parallel circuit, where the branches meet again?", "answer": "The currents combine, that is they add together again.", "keywords": ["combines", "adds together"], "explain": "A marker looks for: combines, adds together", "src": "L|When the current comes to the other side where the branches join again, the current combines (adds together) again."}, {"id": "ch09-o008", "type": "short", "topic": "9.1", "source": "opus", "q": "State the rule for the current in a parallel circuit.", "answer": "The current through the cell is equal to the total of the current in all the branches.", "keywords": ["current through the cell", "total", "all the branches"], "explain": "A marker looks for: current through the cell, total, all the branches", "src": "L|the current through the cell is equal to the total of the current in all the branches."}, {"id": "ch09-o009", "type": "short", "topic": "9.1", "source": "opus", "q": "A parallel circuit has ammeter A1 just after the cell, A2 and A3 in the two branches, and A4 just before the cell. How are the four readings related?", "answer": "A1 and A4 are equal, because they are both outside the branches. The readings on A2 and A3 add up to the reading on A1 (and A4).", "keywords": ["A1 and A4 are equal", "A2 and A3 add up to A1"], "explain": "A marker looks for: A1 and A4 are equal, A2 and A3 add up to A1", "src": "L|In this circuit, the readings on ammeters A1 and A4 are equal. The readings on ammeters A2 and A3 will add up to the reading on A1 (and A4)."}, {"id": "ch09-o010", "type": "short", "topic": "9.1", "source": "opus", "q": "Does the parallel-circuit current rule still work if the branches carry different currents?", "answer": "Yes. The rule still works even when the current in the branches is different: the current through the cell is still the total of the branch currents.", "keywords": ["yes", "still works", "different", "total"], "explain": "A marker looks for: yes, still works, different, total", "src": "L|This rule still works even when the current in the branches is different."}, {"id": "ch09-o011", "type": "short", "topic": "9.1", "source": "opus", "q": "A parallel circuit has three branches carrying 1.0 A, 2.0 A and 0.5 A. Calculate the current through the cell.", "answer": "1.0 A + 2.0 A + 0.5 A = 3.5 A.", "keywords": ["3.5 A", "add the branch currents"], "explain": "A marker looks for: 3.5 A, add the branch currents", "src": "L|So, 1.0 A + 2.0 A + 0.5 A = 3.5 A."}, {"id": "ch09-o012", "type": "short", "topic": "9.1", "source": "opus", "q": "The current through the cell is 5.5 A. Two of the three branches carry 3.0 A and 1.5 A. Calculate the current in the third branch, showing your working.", "answer": "The branch currents must add up to 5.5 A. X + 3.0 + 1.5 = 5.5, so X + 4.5 = 5.5 and X = 5.5 - 4.5 = 1.0 A.", "keywords": ["X + 3.0 + 1.5 = 5.5", "1.0 A", "unit"], "explain": "A marker looks for: X + 3.0 + 1.5 = 5.5, 1.0 A, unit", "src": "L|The total current is 5.5 A, so the currents through each of the branches must add up to 5.5 A."}, {"id": "ch09-o013", "type": "short", "topic": "9.1", "source": "opus", "q": "What must you always remember to include when you write down the answer to a current calculation?", "answer": "The unit. A current answer must be given in amps (A).", "keywords": ["the unit", "amps"], "explain": "A marker looks for: the unit, amps", "src": "L|As with all calculations, do not forget the unit with your answer!"}, {"id": "ch09-o014", "type": "short", "topic": "9.1", "source": "opus", "q": "State the main advantage of a parallel circuit over a series circuit.", "answer": "In a parallel circuit the current through one branch can keep flowing even if the current stops flowing in the other branches.", "keywords": ["keep flowing", "other branches", "stops"], "explain": "A marker looks for: keep flowing, other branches, stops", "src": "L|In a parallel circuit, the current through a branch can keep flowing, even if the current stops flowing in the other branches."}, {"id": "ch09-o015", "type": "short", "topic": "9.1", "source": "opus", "q": "Give the two practical consequences of the fact that each branch of a parallel circuit works on its own.", "answer": "Components in the same circuit can be switched on and off independently, and if a component in one branch stops working the other branches are not affected.", "keywords": ["switched on and off independently", "other branches are not affected"], "explain": "A marker looks for: switched on and off independently, other branches are not affected", "src": "L|components in the same circuit can be switched on and off independently"}, {"id": "ch09-o016", "type": "short", "topic": "9.1", "source": "opus", "q": "A parallel circuit has lamp L1 with switch S1 in one branch and lamp L2 with switch S2 in the other. Explain what happens when only S1 is closed.", "answer": "Lamp L1 lights. Lamp L2 is not affected, because L2 is on a different branch and its own switch S2 is still open.", "keywords": ["L1 will light", "L2 not affected", "different branch"], "explain": "A marker looks for: L1 will light, L2 not affected, different branch", "src": "L|When switch S1 is closed, then lamp L1 will light. This will not affect lamp L2 because L2 is on a different branch."}, {"id": "ch09-o017", "type": "short", "topic": "9.1", "source": "opus", "q": "Both lamps in a two-branch parallel circuit are lit, and then lamp L1 stops working. What happens to lamp L2?", "answer": "Lamp L2 is not affected and keeps working, because it is on its own branch with its own path for the current.", "keywords": ["L2 will not be affected", "own branch"], "explain": "A marker looks for: L2 will not be affected, own branch", "src": "L|If both lamps are switched on and lamp L1 stops working, then lamp L2 will not be affected."}, {"id": "ch09-o018", "type": "short", "topic": "9.1", "source": "opus", "q": "Where must a switch be placed if it is to turn every component in a parallel circuit on and off together?", "answer": "Between the cell and the branches, so that all the current from the cell has to pass through it.", "keywords": ["between the cell and the branches"], "explain": "A marker looks for: between the cell and the branches", "src": "L|The components can also be all switched on or off together if the switch is between the cell and the branches."}, {"id": "ch09-o019", "type": "short", "topic": "9.1", "source": "opus", "q": "A parallel circuit has lamps L1, L2 and L3, each with its own switch S1, S2 and S3, and switch S4 between the battery and the branches. What is the job of S4, and what do S1 to S3 do?", "answer": "S4 must be closed before any lamp can light, so it acts as a master switch for the whole circuit. S1, S2 and S3 then control each lamp separately.", "keywords": ["S4 must be closed", "any lamp to light", "control each lamp separately"], "explain": "A marker looks for: S4 must be closed, any lamp to light, control each lamp separately", "src": "L|For any lamp to light in this circuit, switch S4 must be closed. Switches S1, S2 and S3 can then be used to control each lamp separately."}, {"id": "ch09-o020", "type": "short", "topic": "9.1", "source": "opus", "q": "All three lamps in that circuit are lit. What happens when switch S4 is opened?", "answer": "All of the lamps go off, because opening S4 breaks the single path that all of the current has to take from the battery.", "keywords": ["all of the lamps go off"], "explain": "A marker looks for: all of the lamps go off", "src": "L|If all the lamps are on, then opening S4 will cause all of the lamps to go off."}, {"id": "ch09-o021", "type": "short", "topic": "9.1", "source": "opus", "q": "Why are car headlamps connected in parallel?", "answer": "So that they can be switched on and off together, and so that if one headlamp fails the other still works.", "keywords": ["parallel", "switched on and off together"], "explain": "A marker looks for: parallel, switched on and off together", "src": "L|Car headlamps (left) are connected in parallel so they can be switched on and off together."}, {"id": "ch09-o022", "type": "short", "topic": "9.1", "source": "opus", "q": "A string of decorative lamps is wired in parallel. Give the advantage of this over wiring them in series.", "answer": "If one lamp fails, the others will still light, because each lamp is on its own branch. They can also still be switched on and off together.", "keywords": ["if one lamp fails", "the others will still light"], "explain": "A marker looks for: if one lamp fails, the others will still light", "src": "L|The string of lamps (right) are connected in parallel so, if one lamp fails, the others will still light."}, {"id": "ch09-o023", "type": "short", "topic": "9.1", "source": "opus", "q": "Four identical lamps are connected in parallel with a cell. The current through the cell is 2.0 A. Calculate the current through each lamp.", "answer": "The lamps are identical, so the cell current is shared equally: 2.0 A divided by 4 = 0.5 A through each lamp.", "keywords": ["2.0 divided by 4", "0.5 A", "shared equally"], "explain": "A marker looks for: 2.0 divided by 4, 0.5 A, shared equally", "src": "L|The four identical lamps are connected in parallel. When all four lamps are working, the current through the cell is 2.0 A."}, {"id": "ch09-o024", "type": "short", "topic": "9.2", "source": "opus", "q": "What is voltage, what unit is it measured in, and what is the symbol for that unit?", "answer": "Voltage is a measure of the electrical energy in a circuit. It is measured in volts, and the symbol for volts is V.", "keywords": ["electrical energy", "volts", "V"], "explain": "A marker looks for: electrical energy, volts, V", "src": "L|Voltage is a measure of the electrical energy in a circuit. Voltage is measured in units called volts. The symbol for volts is V."}, {"id": "ch09-o025", "type": "short", "topic": "9.2", "source": "opus", "q": "What is a battery, and what voltages do batteries commonly supply?", "answer": "A battery is two or more cells connected in series. Batteries commonly supply 6 V, 9 V or 12 V, while most single cells supply 1.5 V.", "keywords": ["two or more cells", "in series", "6 V, 9 V or 12 V"], "explain": "A marker looks for: two or more cells, in series, 6 V, 9 V or 12 V", "src": "L|Most cells supply 1.5 V. A battery is two or more cells connected in series. Batteries commonly supply 6 V, 9 V or 12 V."}, {"id": "ch09-o026", "type": "short", "topic": "9.2", "source": "opus", "q": "What does 'mains' mean, and what is the mains voltage in most countries?", "answer": "Mains means an electrical supply that comes from a power station or generator. In most countries the mains voltage is between 220 and 240 V, and in some countries it is 110 V.", "keywords": ["power station or generator", "220 and 240 V", "110 V"], "explain": "A marker looks for: power station or generator, 220 and 240 V, 110 V", "src": "L|Mains in this context means an electrical supply that comes from a power station or generator of some kind."}, {"id": "ch09-o027", "type": "short", "topic": "9.2", "source": "opus", "q": "What can the word 'supply' mean when we talk about the source of energy in a circuit?", "answer": "The supply could be a cell, a battery, a power supply or the mains.", "keywords": ["cell", "battery", "power supply", "mains"], "explain": "A marker looks for: cell, battery, power supply, mains", "src": "L|The supply could be a cell, a battery, a power supply or the mains."}, {"id": "ch09-o028", "type": "short", "topic": "9.2", "source": "opus", "q": "Voltage measures the energy supplied by a cell. What else can it measure? Use a lamp as your example.", "answer": "It can also measure the energy changed by a component in a circuit. A lamp changes electrical energy into light and thermal energy, and the energy it changes can be measured in volts.", "keywords": ["energy changed by components", "light and thermal energy"], "explain": "A marker looks for: energy changed by components, light and thermal energy", "src": "L|Voltage can also measure the energy changed by components in a circuit. For example, lamps change electrical energy into light and thermal energy."}, {"id": "ch09-o029", "type": "short", "topic": "9.2", "source": "opus", "q": "What does the voltage rating of a component tell you?", "answer": "It tells you the maximum voltage that can be used across that component.", "keywords": ["maximum voltage", "can be used"], "explain": "A marker looks for: maximum voltage, can be used", "src": "L|The rating tells us the maximum voltage that can be used."}, {"id": "ch09-o030", "type": "short", "topic": "9.2", "source": "opus", "q": "How is an ammeter connected into a circuit, and why?", "answer": "An ammeter is connected in series with the component, because it measures the current flowing through that component and so the current must pass through the meter.", "keywords": ["in series", "current flowing through"], "explain": "A marker looks for: in series, current flowing through", "src": "L|An ammeter measures the current flowing through a component, so the ammeter is connected in series with the component."}, {"id": "ch09-o031", "type": "short", "topic": "9.2", "source": "opus", "q": "How is a voltmeter connected into a circuit, and why?", "answer": "A voltmeter is connected in parallel with the component, because it measures the energy difference either side of that component.", "keywords": ["in parallel", "energy difference either side"], "explain": "A marker looks for: in parallel, energy difference either side", "src": "L|The voltmeter measures the energy difference either side of a component, so the voltmeter is connected in parallel with the component."}, {"id": "ch09-o032", "type": "short", "topic": "9.2", "source": "opus", "q": "Use the idea of conservation of energy to explain why the voltages across the components of a series circuit add up to the supply voltage.", "answer": "Energy is always conserved, so the energy changed by the components must equal the energy supplied by the cell, battery or power supply. Since voltage measures that energy, the component voltages must add up to the supply voltage.", "keywords": ["energy is always conserved", "energy changed equals energy supplied", "add up"], "explain": "A marker looks for: energy is always conserved, energy changed equals energy supplied, add up", "src": "L|Energy is always conserved, so the energy changed by the components in a circuit must be equal to the energy supplied by the cell, battery or power supply."}, {"id": "ch09-o033", "type": "short", "topic": "9.2", "source": "opus", "q": "State the rule for voltages in a series circuit.", "answer": "The voltages across all the components in a series circuit add up to the voltage of the supply.", "keywords": ["add up", "voltage of the supply"], "explain": "A marker looks for: add up, voltage of the supply", "src": "L|The voltages across all the components in a series circuit add up to the voltage of the supply."}, {"id": "ch09-o034", "type": "short", "topic": "9.2", "source": "opus", "q": "Three identical lamps are in series with a 12 V battery. Calculate the voltage across each lamp and explain why they are the same.", "answer": "Each lamp has 4 V across it, because 12 V shared between three lamps gives 12 divided by 3 = 4 V. They are the same because identical lamps change the same quantity of energy.", "keywords": ["4 V", "identical", "same quantity of energy"], "explain": "A marker looks for: 4 V, identical, same quantity of energy", "src": "L|All three lamps are identical. They change the same quantity of energy, so have the same voltage."}, {"id": "ch09-o035", "type": "short", "topic": "9.2", "source": "opus", "q": "A lamp and a buzzer are in series with a 9 V battery. The voltage across the lamp is 6 V. Calculate the voltage across the buzzer and say which component changes more energy.", "answer": "The voltage across the buzzer is 9 - 6 = 3 V. The lamp changes more energy, which is why the voltage across the lamp is higher.", "keywords": ["3 V", "lamp changes more energy", "higher voltage"], "explain": "A marker looks for: 3 V, lamp changes more energy, higher voltage", "src": "L|In this circuit, the lamp is changing more energy than the buzzer, so the voltage across the lamp is higher than the buzzer."}, {"id": "ch09-o036", "type": "short", "topic": "9.2", "source": "opus", "q": "In a series circuit the current is the same everywhere but the voltage is not. Explain the difference.", "answer": "The current is the same because the circuit has no branches, so the current can only flow in one path. The voltage can be different across different components, because components change different amounts of energy.", "keywords": ["no branches", "only one path", "voltage can be different"], "explain": "A marker looks for: no branches, only one path, voltage can be different", "src": "L|The voltage in a series circuit can be different across different components."}, {"id": "ch09-o037", "type": "short", "topic": "9.2", "source": "opus", "q": "What happens to the voltage across each component when more lamps are added in series, and why?", "answer": "Each component gets a smaller share of the voltage, because the supply voltage in a series circuit is shared between all of the components.", "keywords": ["smaller share", "shared between", "components"], "explain": "A marker looks for: smaller share, shared between, components", "src": "L|The voltage from the supply in a series circuit is shared between each of the components."}, {"id": "ch09-o038", "type": "short", "topic": "9.2", "source": "opus", "q": "Two lamps in series with a 12 V battery each have 6 V across them. Six identical lamps are used instead. Calculate the voltage across each one.", "answer": "12 V shared between six lamps gives 12 divided by 6 = 2 V across each lamp.", "keywords": ["12 divided by 6", "2 V"], "explain": "A marker looks for: 12 divided by 6, 2 V", "src": "L|The voltage from the supply in a series circuit is shared between each of the components."}, {"id": "ch09-o039", "type": "short", "topic": "9.2", "source": "opus", "q": "What happens to the current in a series circuit when more components are added, and why?", "answer": "The current decreases, because as components are added it becomes more difficult for the power supply to push the electrons around the circuit.", "keywords": ["decrease the current", "more difficult", "push the electrons"], "explain": "A marker looks for: decrease the current, more difficult, push the electrons", "src": "L|Adding more components in a series circuit will decrease the current."}, {"id": "ch09-o040", "type": "short", "topic": "9.2", "source": "opus", "q": "What happens to the supply voltage when more cells are added in series, and what two effects does that have on the circuit?", "answer": "The supply voltage increases. That increases the current in the circuit and increases the voltage across each component.", "keywords": ["increases the voltage of the supply", "increase the current", "increase the voltage across each component"], "explain": "A marker looks for: increases the voltage of the supply, increase the current, increase the voltage across each component", "src": "L|Adding more cells in a series circuit increases the voltage of the supply."}, {"id": "ch09-o041", "type": "short", "topic": "9.2", "source": "opus", "q": "How many 1.5 V cells are there inside a 12 V battery? Show how you know.", "answer": "Eight cells, because 8 multiplied by 1.5 V = 12 V.", "keywords": ["eight", "8 x 1.5 V = 12 V"], "explain": "A marker looks for: eight, 8 x 1.5 V = 12 V", "src": "L|A 12 V battery contains eight cells each of 1.5 V making 8 × 1.5 V = 12 V."}, {"id": "ch09-o042", "type": "short", "topic": "9.2", "source": "opus", "q": "State the rule for voltage in a parallel circuit.", "answer": "The voltages across each of the branches of a parallel circuit are equal to the voltage of the supply.", "keywords": ["each branch", "equal to the voltage of the supply"], "explain": "A marker looks for: each branch, equal to the voltage of the supply", "src": "L|The voltages across each of the branches of a parallel circuit are equal to the voltage of the supply."}, {"id": "ch09-o043", "type": "short", "topic": "9.2", "source": "opus", "q": "Two lamps are in parallel across a 1.5 V cell. Explain why the voltage across lamp 2 is 1.5 V even though it is further from the cell in the drawing.", "answer": "If you follow the wires from lamp 2 you can reach the terminals of the cell without going through lamp 1. So lamp 2 is also connected directly across the terminals of the cell, and the voltage across it is 1.5 V.", "keywords": ["follow the wires", "without going through lamp 1", "directly across the terminals"], "explain": "A marker looks for: follow the wires, without going through lamp 1, directly across the terminals", "src": "L|If you follow the wires from lamp 2, you can get to the terminals of the cell without going through lamp 1."}, {"id": "ch09-o044", "type": "short", "topic": "9.2", "source": "opus", "q": "A 9 V battery has a lamp in one branch and a buzzer in the other. State the voltage across each, and explain your answer.", "answer": "Both are 9 V. The voltage across the branches of a parallel circuit is the same whether or not the components are the same, and it is equal to the supply voltage.", "keywords": ["9 V", "both", "same whether or not the components are the same"], "explain": "A marker looks for: 9 V, both, same whether or not the components are the same", "src": "L|The lamp and the buzzer are different, but the voltage across the branches is still the same (9 V)."}, {"id": "ch09-o045", "type": "short", "topic": "9.2", "source": "opus", "q": "In a parallel circuit the currents in the branches can be different but the voltages cannot. Explain why.", "answer": "The current can flow in different paths, so the branches can carry different currents. The voltage in all branches is the same because every branch is connected directly across the supply.", "keywords": ["current can flow in different paths", "voltage in all branches is the same"], "explain": "A marker looks for: current can flow in different paths, voltage in all branches is the same", "src": "L|The voltage in all branches of a parallel circuit is the same."}, {"id": "ch09-o046", "type": "short", "topic": "9.2", "source": "opus", "q": "What happens to the current through the cell when more branches are added to a parallel circuit, and why?", "answer": "The current through the cell increases, because more branches give more paths for the current to flow through, which makes it easier for the current to flow.", "keywords": ["current through the cell increases", "more paths", "easier"], "explain": "A marker looks for: current through the cell increases, more paths, easier", "src": "L|Adding more branches to a parallel circuit gives more paths for the current to flow through."}, {"id": "ch09-o047", "type": "short", "topic": "9.2", "source": "opus", "q": "What happens to the current in one branch of a parallel circuit if more components are added to that branch, and why?", "answer": "The current in that branch decreases. The voltage across the branch stays the same, but the extra components make it harder for current to flow in that branch.", "keywords": ["decrease the current in that branch", "voltage stays the same", "harder for current to flow"], "explain": "A marker looks for: decrease the current in that branch, voltage stays the same, harder for current to flow", "src": "L|Adding more components to any one branch of a parallel circuit will decrease the current in that branch."}, {"id": "ch09-o048", "type": "short", "topic": "9.2", "source": "opus", "q": "Give the three effects of adding more cells to a parallel circuit.", "answer": "It increases the voltage across each branch, increases the current through the cell, and increases the current through each branch.", "keywords": ["voltage across each branch", "current through the cell", "current through each branch"], "explain": "A marker looks for: voltage across each branch, current through the cell, current through each branch", "src": "L|Adding cells to a parallel circuit increases the supply voltage so it also:"}, {"id": "ch09-o049", "type": "short", "topic": "9.2", "source": "opus", "q": "Six identical lamps are connected in parallel across a 220 V mains supply. State the voltage across one lamp, and give the reason.", "answer": "220 V. Every branch of a parallel circuit has the full supply voltage across it, so each lamp gets 220 V.", "keywords": ["220 V", "every branch", "full supply voltage"], "explain": "A marker looks for: 220 V, every branch, full supply voltage", "src": "L|Each of the lamps is connected in parallel across a 220 V mains supply, as shown in the diagram."}, {"id": "ch09-o050", "type": "short", "topic": "9.2", "source": "opus", "q": "The mains current supplied to six identical lamps in parallel is 2.4 A. Calculate the current through one lamp, then say what happens to the total current when two more lamps are added in new branches.", "answer": "2.4 A divided by 6 = 0.4 A through each lamp. Adding two more branches gives more paths for the current, so the total current from the supply increases.", "keywords": ["0.4 A", "total current increases", "more branches"], "explain": "A marker looks for: 0.4 A, total current increases, more branches", "src": "L|The current from the mains supply to all six lamps is 2.4 A."}, {"id": "ch09-o051", "type": "short", "topic": "9.2", "source": "opus", "q": "Marcus has lamps rated at 2.0 V and a 12 V battery. Explain why he cannot connect the lamps individually in parallel across the battery.", "answer": "Each branch of a parallel circuit gets the full supply voltage, so every lamp would have 12 V across it. That is far above the 2.0 V rating, so the lamps would be damaged.", "keywords": ["full supply voltage", "12 V across each lamp", "above the rating", "damaged"], "explain": "A marker looks for: full supply voltage, 12 V across each lamp, above the rating, damaged", "src": "L|Marcus has a box containing ten identical lamps rated at 2.0 V. He also has a 12 V battery."}, {"id": "ch09-o052", "type": "short", "topic": "9.2", "source": "opus", "q": "Marcus connects 2.0 V lamps in series with a 12 V battery. Calculate how many lamps will operate properly, showing your working.", "answer": "In series the supply voltage is shared, so the number of lamps is 12 V divided by 2.0 V = 6 lamps.", "keywords": ["12 divided by 2.0", "6 lamps", "shared"], "explain": "A marker looks for: 12 divided by 2.0, 6 lamps, shared", "src": "L|Marcus connects the lamps in series with the 12 V battery."}, {"id": "ch09-o053", "type": "short", "topic": "9.3", "source": "opus", "q": "What is resistance?", "answer": "Resistance is a measure of how easy or difficult it is for electrons to move through a material.", "keywords": ["how easy or difficult", "electrons to move", "material"], "explain": "A marker looks for: how easy or difficult, electrons to move, material", "src": "L|Resistance is a measure of how easy or difficult it is for electrons to move though a material."}, {"id": "ch09-o054", "type": "short", "topic": "9.3", "source": "opus", "q": "Compare the resistance of conductors and insulators, giving one example of each.", "answer": "Conductors, such as copper, have very low resistance. Insulators, such as most plastics, have very high resistance.", "keywords": ["conductors", "copper", "very low", "insulators", "plastics", "very high"], "explain": "A marker looks for: conductors, copper, very low, insulators, plastics, very high", "src": "L|Conductors, such as copper, have very low resistance. Insulators, such as most plastics, have very high resistance."}, {"id": "ch09-o055", "type": "short", "topic": "9.3", "source": "opus", "q": "What is the unit of resistance, and what symbol is used for it?", "answer": "Resistance is measured in ohms. The symbol for ohms is the Greek letter omega.", "keywords": ["ohms", "Greek letter omega"], "explain": "A marker looks for: ohms, Greek letter omega", "src": "L|Resistance is measured in units called ohms."}, {"id": "ch09-o056", "type": "short", "topic": "9.3", "source": "opus", "q": "Why is copper wire used to connect the components of a circuit together?", "answer": "Copper wire is designed to have very low resistance, so the current is affected as little as possible between the components of the circuit.", "keywords": ["very low resistance", "current is affected as little as possible"], "explain": "A marker looks for: very low resistance, current is affected as little as possible", "src": "L|Copper wire is designed to have very low resistance so current is affected as little as possible between the components of a circuit."}, {"id": "ch09-o057", "type": "short", "topic": "9.3", "source": "opus", "q": "What effect does resistance have on the electrons, and therefore on the current?", "answer": "Resistance slows the flow of electrons, so it lowers the current.", "keywords": ["slows the flow of electrons", "lowers current"], "explain": "A marker looks for: slows the flow of electrons, lowers current", "src": "L|Resistance slows the flow of electrons, so lowers current."}, {"id": "ch09-o058", "type": "short", "topic": "9.3", "source": "opus", "q": "What is the filament in a lamp, and what is special about its resistance?", "answer": "The filament is a small wire inside some lamps. It is designed to have a high resistance.", "keywords": ["small wire", "inside some lamps", "high resistance"], "explain": "A marker looks for: small wire, inside some lamps, high resistance", "src": "L|Inside some lamps, there is a small wire called a filament. The filament has a high resistance."}, {"id": "ch09-o059", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why the filament of a lamp gives out light when current flows through it.", "answer": "The filament has a high resistance, so when current flows through it thermal energy is transferred. There is so much thermal energy that the filament glows and emits light.", "keywords": ["thermal energy is transferred", "glows", "emits light"], "explain": "A marker looks for: thermal energy is transferred, glows, emits light", "src": "L|When current flows through the filament, thermal energy is transferred. There is so much thermal energy that the filament glows and emits light."}, {"id": "ch09-o060", "type": "short", "topic": "9.3", "source": "opus", "q": "State the rule linking resistance and current in a circuit.", "answer": "The greater the resistance in a circuit, the smaller the current in the circuit.", "keywords": ["greater the resistance", "smaller the current"], "explain": "A marker looks for: greater the resistance, smaller the current", "src": "L|The greater the resistance in a circuit, the smaller the current in the circuit"}, {"id": "ch09-o061", "type": "short", "topic": "9.3", "source": "opus", "q": "State Ohm's law in words.", "answer": "Voltage = current x resistance.", "keywords": ["voltage", "current", "resistance", "multiplied"], "explain": "A marker looks for: voltage, current, resistance, multiplied", "src": "L|Ohm’s law states that: voltage = current × resistance"}, {"id": "ch09-o062", "type": "short", "topic": "9.3", "source": "opus", "q": "Give the three letter symbols used in Ohm's law and state the unit that goes with each one.", "answer": "V is voltage in volts, I is current in amps, and R is resistance in ohms.", "keywords": ["V voltage volts", "I current amps", "R resistance ohms"], "explain": "A marker looks for: V voltage volts, I current amps, R resistance ohms", "src": "L|V = voltage, in volts I = current, in amps R = resistance, in ohms"}, {"id": "ch09-o063", "type": "short", "topic": "9.3", "source": "opus", "q": "Why is the letter I, and not C, used as the symbol for current?", "answer": "Because in the French language current was originally called intensite du courant, so the letter I was used.", "keywords": ["French", "intensite du courant"], "explain": "A marker looks for: French, intensite du courant", "src": "L|The letter I is used for current because in the French language current was originally called intensité du courant."}, {"id": "ch09-o064", "type": "short", "topic": "9.3", "source": "opus", "q": "Ohm studied the resistance of wires. Does his law apply only to wires?", "answer": "No. The link between voltage, current and resistance applies to many electrical components, not only to wires.", "keywords": ["no", "many electrical components", "not only wires"], "explain": "A marker looks for: no, many electrical components, not only wires", "src": "L|The link between voltage, current and resistance applies to many electrical components and not only to wires."}, {"id": "ch09-o065", "type": "short", "topic": "9.3", "source": "opus", "q": "A current of 2 A flows through a buzzer and the voltage across it is 10 V. Calculate the resistance of the buzzer, showing your working.", "answer": "R = V divided by I = 10 divided by 2 = 5 ohms.", "keywords": ["R = V / I", "10 divided by 2", "5 ohms"], "explain": "A marker looks for: R = V / I, 10 divided by 2, 5 ohms", "src": "L|A current of 2 A flows through a buzzer. The voltage across the buzzer is 10 V."}, {"id": "ch09-o066", "type": "short", "topic": "9.3", "source": "opus", "q": "The voltage across a resistor is 6 V and the current through it is 3 A. Calculate its resistance, giving the unit.", "answer": "R = V divided by I = 6 divided by 3 = 2 ohms.", "keywords": ["6 divided by 3", "2 ohms", "unit"], "explain": "A marker looks for: 6 divided by 3, 2 ohms, unit", "src": "L|Resistor R1. The voltage across R1 is 6 V and the current through R1 is 3 A."}, {"id": "ch09-o067", "type": "short", "topic": "9.3", "source": "opus", "q": "The voltage across a resistor is 9 V and the current through it is 2 A. Calculate its resistance, giving the unit.", "answer": "R = V divided by I = 9 divided by 2 = 4.5 ohms.", "keywords": ["9 divided by 2", "4.5 ohms"], "explain": "A marker looks for: 9 divided by 2, 4.5 ohms", "src": "L|Resistor R2. The voltage across R2 is 9 V and the current through R2 is 2 A."}, {"id": "ch09-o068", "type": "short", "topic": "9.3", "source": "opus", "q": "The voltage across a resistor is 1.5 V and the current through it is 0.5 A. Calculate its resistance, giving the unit.", "answer": "R = V divided by I = 1.5 divided by 0.5 = 3 ohms.", "keywords": ["1.5 divided by 0.5", "3 ohms"], "explain": "A marker looks for: 1.5 divided by 0.5, 3 ohms", "src": "L|Resistor R3. The voltage across R3 is 1.5 V and the current through R3 is 0.5 A."}, {"id": "ch09-o069", "type": "short", "topic": "9.3", "source": "opus", "q": "A current of 2 A flows through a 6 ohm resistor. Calculate the voltage across the resistor, showing your working and giving the unit.", "answer": "V = I x R = 2 x 6 = 12 V.", "keywords": ["V = I x R", "2 x 6", "12 V"], "explain": "A marker looks for: V = I x R, 2 x 6, 12 V", "src": "L|This circuit contains a 6 resistor. The current through the resistor is 2 A."}, {"id": "ch09-o070", "type": "short", "topic": "9.3", "source": "opus", "q": "The voltage across a 100 ohm resistor is 12 V. Calculate the current through it, showing your working and giving the unit.", "answer": "I = V divided by R = 12 divided by 100 = 0.12 A.", "keywords": ["I = V / R", "12 divided by 100", "0.12 A"], "explain": "A marker looks for: I = V / R, 12 divided by 100, 0.12 A", "src": "L|This circuit contains a 100 resistor. The voltage across the resistor is 12 V."}, {"id": "ch09-o071", "type": "short", "topic": "9.3", "source": "opus", "q": "What is a resistor?", "answer": "A resistor is a type of electrical component designed to have a known resistance.", "keywords": ["electrical component", "known resistance"], "explain": "A marker looks for: electrical component, known resistance", "src": "L|A resistor is a type of electrical component designed to have a known resistance."}, {"id": "ch09-o072", "type": "short", "topic": "9.3", "source": "opus", "q": "What are the coloured bands on a resistor for?", "answer": "The colours form a code that shows the resistance value of the resistor in ohms.", "keywords": ["code", "resistance value", "ohms"], "explain": "A marker looks for: code, resistance value, ohms", "src": "L|Many resistors, such as those in the picture, have coloured bands. The colours form a code to show the resistance value in ohms."}, {"id": "ch09-o073", "type": "short", "topic": "9.3", "source": "opus", "q": "When is the letter R written beside a resistor symbol instead of a number?", "answer": "When the value of the resistor is not important, or when you have to calculate the value.", "keywords": ["not important", "calculate the value"], "explain": "A marker looks for: not important, calculate the value", "src": "L|When the value of the resistor is not important, or when you have to calculate the value, the letter R is usually written beside the symbol."}, {"id": "ch09-o074", "type": "short", "topic": "9.4", "source": "opus", "q": "Name the component used to change the resistance in a circuit, and give two everyday uses of it.", "answer": "A variable resistor. It is used in a dimmer switch for a lamp, and in the volume control of a music player.", "keywords": ["variable resistor", "dimmer switch", "volume control"], "explain": "A marker looks for: variable resistor, dimmer switch, volume control", "src": "L|The component that is used to change resistance is called a variable resistor."}, {"id": "ch09-o075", "type": "short", "topic": "9.4", "source": "opus", "q": "How does the circuit symbol for a variable resistor differ from the symbol for a fixed resistor?", "answer": "It is the same as the fixed resistor symbol but with an arrow drawn through it.", "keywords": ["arrow", "through the symbol"], "explain": "A marker looks for: arrow, through the symbol", "src": "L|The circuit symbol for a variable resistor is similar to that for a fixed resistor, but with an arrow through the symbol, like this:"}, {"id": "ch09-o076", "type": "short", "topic": "9.4", "source": "opus", "q": "What is meant by the term 'fixed resistor', and why is the term used?", "answer": "A fixed resistor is an ordinary resistor with a single set resistance. The term is used to avoid confusion with variable resistors.", "keywords": ["set resistance", "avoid confusion", "variable resistors"], "explain": "A marker looks for: set resistance, avoid confusion, variable resistors", "src": "L|The term fixed resistor is sometimes used for the type of resistors you learnt about in Topic 9.3, to avoid confusion with variable resistors."}, {"id": "ch09-o077", "type": "short", "topic": "9.4", "source": "opus", "q": "A variable resistor is in series with a lamp. Explain the full chain of events when its resistance is increased.", "answer": "Increasing the resistance decreases the current in the circuit. A smaller current flowing through the lamp makes the lamp dimmer.", "keywords": ["current decreases", "smaller current", "dimmer"], "explain": "A marker looks for: current decreases, smaller current, dimmer", "src": "L|As the resistance of the variable resistor is increased, the current in the circuit decreases. A smaller current flowing through the lamp makes the lamp dimmer."}, {"id": "ch09-o078", "type": "short", "topic": "9.4", "source": "opus", "q": "A variable resistor is in series with a lamp. Explain the full chain of events when its resistance is decreased.", "answer": "Decreasing the resistance increases the current in the circuit. A larger current flowing through the lamp makes the lamp brighter.", "keywords": ["current increases", "larger current", "brighter"], "explain": "A marker looks for: current increases, larger current, brighter", "src": "L|As the resistance of the variable resistor is increased, the current in the circuit decreases."}, {"id": "ch09-o079", "type": "short", "topic": "9.4", "source": "opus", "q": "What does the word 'volume' mean in audio equipment, and what type of component are the sliding volume controls?", "answer": "Volume means the loudness from loudspeakers or headphones. The sliding controls are variable resistors.", "keywords": ["loudness", "loudspeakers or headphones", "variable resistors"], "explain": "A marker looks for: loudness, loudspeakers or headphones, variable resistors", "src": "L|In audio equipment, the word volume is used to mean loudness from loudspeakers or headphones."}, {"id": "ch09-o080", "type": "short", "topic": "9.4", "source": "opus", "q": "Describe how the switch in a fridge light circuit works as the door is opened and closed.", "answer": "The switch is opened and closed by the movement of the fridge door. When the door is open the switch is closed, so the lamp lights. When the door is closed the switch is open, so the lamp goes out.", "keywords": ["door open switch closed", "door closed switch open", "movement of the door"], "explain": "A marker looks for: door open switch closed, door closed switch open, movement of the door", "src": "L|The switch is opened and closed by the movement of the fridge door. When the door is open, the switch is closed and when the door is closed, the switch is open."}, {"id": "ch09-o081", "type": "short", "topic": "9.4", "source": "opus", "q": "Why are the headlamps of a car connected in parallel?", "answer": "So that they can be switched on and off together, and so that one headlamp still works if the other fails.", "keywords": ["parallel", "switched on and off together"], "explain": "A marker looks for: parallel, switched on and off together", "src": "L|The headlamps are connected in parallel, so they can be switched on and off together."}, {"id": "ch09-o082", "type": "short", "topic": "9.4", "source": "opus", "q": "In the car warning circuit, S1 controls the headlamps and S2 is controlled by the door. Explain why the buzzer only sounds when the door is opened AND the headlamps are on.", "answer": "Current cannot reach switch S2 unless switch S1 for the headlamps is closed. Opening the door closes S2, so the buzzer only sounds when both S1 and S2 are closed.", "keywords": ["cannot flow to S2 unless S1 is closed", "both switches closed", "door open closes S2"], "explain": "A marker looks for: cannot flow to S2 unless S1 is closed, both switches closed, door open closes S2", "src": "L|Current cannot flow to switch S2 unless switch S1 for the headlamps is closed."}, {"id": "ch09-o083", "type": "short", "topic": "9.4", "source": "opus", "q": "Describe how a voltmeter and a switch are arranged so that the voltage of a 12 V battery can be checked when needed.", "answer": "The voltmeter is connected in parallel across the battery, with a switch included in that branch of the parallel circuit, so the reading is only taken when the switch is closed.", "keywords": ["voltmeter in parallel across the battery", "switch in that branch"], "explain": "A marker looks for: voltmeter in parallel across the battery, switch in that branch", "src": "L|A voltmeter is connected in parallel across the battery, and a switch is included in this branch of the parallel circuit."}, {"id": "ch09-o084", "type": "short", "topic": "9.4", "source": "opus", "q": "Name three kinds of equipment that use 12 V batteries which need recharging from time to time.", "answer": "Cars, trucks and some boats.", "keywords": ["cars", "trucks", "boats"], "explain": "A marker looks for: cars, trucks, boats", "src": "L|Equipment that uses 12 V batteries include cars, trucks and some boats."}, {"id": "ch09-o085", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain how two equal resistors let a 6 V lamp be run safely from a 12 V battery.", "answer": "Two resistors of equal resistance in series with the battery share the 12 V equally, so 6 V is across each of them. The 6 V lamp is connected in parallel with one resistor, so it receives 6 V and works properly.", "keywords": ["equal resistance", "shared equally", "6 V across each", "in parallel with one of the resistors"], "explain": "A marker looks for: equal resistance, shared equally, 6 V across each, in parallel with one of the resistors", "src": "L|If two resistors of equal resistance are connected in series with a battery, then the battery voltage will be shared equally across each resistor."}, {"id": "qwen-01-01", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "What is the name of the component used to measure current in a circuit?", "explain": "The text states that an ammeter is the component used to measure current.", "src": "L|An ammeter measures the current flowing through a component", "options": ["Voltmeter", "Ammeter", "Switch", "Cell"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "9.1", "source": "qwen", "q": "In a series circuit, the current is ____ all the way around.", "explain": "The text explains that in a series circuit, the current is the same all the way around.", "src": "L|the current is the same all the way around a series circuit", "answer": ["the same"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "9.1", "source": "qwen", "q": "What happens to the current in a parallel circuit when it reaches a branch?", "explain": "The text states that at the branch, the current is divided.", "src": "L|At the branch, the current is divided", "options": ["It stops flowing", "It is divided between the branches", "It doubles in size", "It changes direction"], "answer": 1}, {"id": "qwen-01-04", "type": "fill", "topic": "9.1", "source": "qwen", "q": "The paths where current can flow in a parallel circuit are called ____.", "explain": "The text defines the paths for current in a parallel circuit as branches.", "src": "L|The paths where the current can flow are called branches", "answer": ["branches"]}, {"id": "qwen-01-05", "type": "mcq", "topic": "9.1", "source": "qwen", "q": "What is the rule for current in a parallel circuit?", "explain": "The text states that the current through the cell is equal to the total of the current in all the branches.", "src": "L|the current through the cell is equal to the total of the current in all the branches", "options": ["The current through the cell equals the current in one branch", "The current through the cell is the total of the currents in all branches", "The current is the same in every branch", "The current through the cell is half the total of the branches"], "answer": 1}, {"id": "qwen-01-06", "type": "fill", "topic": "9.1", "source": "qwen", "q": "If a component in one branch of a parallel circuit stops working, the other branches are not ____.", "explain": "The text lists as an advantage that if a component stops working, other branches are not affected.", "src": "L|if a component in one branch stops working, the other branches are not affected", "answer": ["affected"]}, {"id": "qwen-01-07", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "What is the unit of voltage?", "explain": "The text states that voltage is measured in units called volts.", "src": "L|Voltage is measured in units called volts", "options": ["Amperes (A)", "Volts (V)", "Ohms (Ω)", "Watts (W)"], "answer": 1}, {"id": "qwen-01-08", "type": "fill", "topic": "9.2", "source": "qwen", "q": "A voltmeter is connected ____ with the component it is measuring.", "explain": "The text states that a voltmeter is connected in parallel with the component.", "src": "L|the voltmeter is connected in parallel with the component", "answer": ["in parallel"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "How does an ammeter connect to a component?", "explain": "The text states that an ammeter is connected in series with the component.", "src": "L|the ammeter is connected in series with the component", "options": ["In parallel", "In series", "Across the cell only", "It does not connect to components"], "answer": 1}, {"id": "qwen-01-10", "type": "fill", "topic": "9.2", "source": "qwen", "q": "In a series circuit, the voltages across each component add up to the voltage of the ____.", "explain": "The text states that voltages across components in a series circuit add up to the voltage of the supply.", "src": "L|the voltages across each component in a series circuit must add up to the voltage of the supply", "answer": ["supply"]}, {"id": "qwen-01-11", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "What happens to the current in a series circuit when you add more components?", "explain": "The text states that adding more components in a series circuit will decrease the current.", "src": "L|Adding more components in a series circuit will decrease the current", "options": ["It increases", "It stays the same", "It decreases", "It becomes zero"], "answer": 2}, {"id": "qwen-01-12", "type": "fill", "topic": "9.2", "source": "qwen", "q": "Most cells supply a voltage of ____ V.", "explain": "The text states that most cells supply 1.5 V.", "src": "L|Most cells supply 1.5 V", "answer": ["1.5"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "What is the voltage across each branch of a parallel circuit?", "explain": "The text states that the voltages across each branch are equal to the voltage of the supply.", "src": "L|The voltages across each of the branches of a parallel circuit are equal to the voltage of the supply.", "options": ["It depends on the component in that branch", "It is always 1.5 V", "It is equal to the voltage of the supply", "It is half the voltage of the supply"], "answer": 2}, {"id": "qwen-02-02", "type": "fill", "topic": "9.3", "source": "qwen", "q": "Resistance is measured in units called ____.", "explain": "The text defines the unit of resistance as ohms.", "src": "L|Resistance is measured in units called ohms.", "answer": ["ohms"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "What happens to the current through a cell when more branches are added to a parallel circuit?", "explain": "Adding more branches gives more paths for current, making it easier to flow and increasing the total current.", "src": "L|That means the current though the cell increases.", "options": ["It decreases", "It stays the same", "It increases", "It becomes zero"], "answer": 2}, {"id": "qwen-02-04", "type": "fill", "topic": "9.3", "source": "qwen", "q": "A component designed to have a known resistance is called a ____.", "explain": "The text defines a resistor as an electrical component with known resistance.", "src": "L|A resistor is a type of electrical component designed to have a known resistance.", "answer": ["resistor"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "9.3", "source": "qwen", "q": "Which material has very low resistance?", "explain": "The text identifies copper as a conductor with very low resistance.", "src": "L|Conductors, such as copper, have very low resistance.", "options": ["Plastic", "Copper", "Rubber", "Glass"], "answer": 1}, {"id": "qwen-02-06", "type": "fill", "topic": "9.3", "source": "qwen", "q": "The letter I in Ohm's law represents ____.", "explain": "The text lists I as the symbol for current in amps.", "src": "L|I = current, in amps", "answer": ["current"]}, {"id": "qwen-02-07", "type": "mcq", "topic": "9.3", "source": "qwen", "q": "What is the word equation for Ohm's law?", "explain": "The text explicitly states Ohm's law as voltage equals current times resistance.", "src": "L|Ohm’s law states that: voltage = current × resistance", "options": ["Voltage = Current + Resistance", "Voltage = Current × Resistance", "Current = Voltage × Resistance", "Resistance = Voltage + Current"], "answer": 1}, {"id": "qwen-02-08", "type": "fill", "topic": "9.3", "source": "qwen", "q": "The greater the resistance in a circuit, the ____ the current.", "explain": "The text explains that higher resistance leads to smaller current.", "src": "L|The greater the resistance in a circuit, the smaller the current in the circuit", "answer": ["smaller"]}, {"id": "qwen-02-09", "type": "mcq", "topic": "9.3", "source": "qwen", "q": "Why does a lamp filament glow?", "explain": "The text explains that high resistance in the filament causes thermal energy transfer, making it glow.", "src": "L|When current flows through the filament, thermal energy is transferred.", "options": ["It has very low resistance", "Thermal energy is transferred when current flows through it", "It is made of plastic", "The voltage across it is zero"], "answer": 1}, {"id": "qwen-02-10", "type": "fill", "topic": "9.3", "source": "qwen", "q": "Insulators, such as most plastics, have very ____ resistance.", "explain": "The text contrasts conductors with insulators, noting plastics have high resistance.", "src": "L|Insulators, such as most plastics, have very high resistance.", "answer": ["high"]}, {"id": "qwen-02-11", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "If you add more components to one branch of a parallel circuit, what happens to the current in that specific branch?", "explain": "Adding components to a branch makes it harder for current to flow, decreasing the current in that branch.", "src": "L|Adding more components to any one branch of a parallel circuit will decrease the current in that branch.", "options": ["It increases", "It decreases", "It stays the same", "The voltage changes"], "answer": 1}, {"id": "qwen-02-12", "type": "fill", "topic": "9.3", "source": "qwen", "q": "The symbol for ohms is the Greek letter ____.", "explain": "The text identifies the symbol for ohms as the Greek letter omega.", "src": "L|Ohms have the symbol which is the Greek letter omega.", "answer": ["omega"]}, {"id": "qwen-03-01", "type": "mcq", "topic": "9.4", "source": "qwen", "q": "What is the name of the component used to change resistance in a circuit?", "explain": "The text states that the component used to change resistance is called a variable resistor.", "src": "L|The component that is used to change resistance is called a variable resistor.", "options": ["Fixed resistor", "Variable resistor", "Ammeter", "Voltmeter"], "answer": 1}, {"id": "qwen-03-02", "type": "fill", "topic": "9.4", "source": "qwen", "q": "In audio equipment, the word ____ is used to mean loudness from loudspeakers or headphones.", "explain": "The text explains that in audio equipment, volume refers to loudness.", "src": "L|In audio equipment, the word volume is used to mean loudness", "answer": ["volume"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "9.4", "source": "qwen", "q": "What happens to the current in a circuit when the resistance of a variable resistor is increased?", "explain": "The text states that as resistance increases, the current in the circuit decreases.", "src": "L|As the resistance of the variable resistor is increased, the current in the circuit decreases.", "options": ["It increases", "It decreases", "It stays the same", "It becomes zero"], "answer": 1}, {"id": "qwen-03-04", "type": "fill", "topic": "9.4", "source": "qwen", "q": "A smaller current flowing through a lamp makes the lamp ____.", "explain": "The text explains that a smaller current makes the lamp dimmer.", "src": "L|A smaller current flowing through the lamp makes the lamp dimmer.", "answer": ["dimmer"]}, {"id": "qwen-03-06", "type": "fill", "topic": "9.4", "source": "qwen", "q": "The circuit symbol for a variable resistor has an ____ through the symbol.", "explain": "The text describes the symbol as having an arrow through it.", "src": "L|but with an arrow through the symbol", "answer": ["arrow"]}, {"id": "qwen-03-07", "type": "mcq", "topic": "9.4", "source": "qwen", "q": "How are two resistors of equal resistance connected to share battery voltage equally?", "explain": "The text states that if two resistors are connected in series, the voltage is shared equally.", "src": "L|If two resistors of equal resistance are connected in series with a battery", "options": ["In parallel", "In series", "Across the lamp", "With a switch"], "answer": 1}, {"id": "qwen-03-10", "type": "fill", "topic": "9.4", "source": "qwen", "q": "The term ____ resistor is used for standard resistors to avoid confusion with variable ones.", "explain": "The text mentions the term fixed resistor is used to avoid confusion.", "src": "L|The term fixed resistor is sometimes used for the type of resistors", "answer": ["fixed"]}, {"id": "qwenw-01-06", "type": "fill", "topic": "9.3", "source": "qwen", "q": "Ohm's law is written as V = I ____, where the missing letter stands for resistance.", "explain": "In V = IR, V is the voltage in volts, I is the current in amps and R is the resistance in ohms.", "src": "W|The equation for Ohm’s law is V = IR", "answer": ["R", "r"]}, {"id": "qwenw-01-08", "type": "fill", "topic": "9.1", "source": "qwen", "q": "In a parallel circuit, if one component fails, the other components ____ working.", "explain": "Each branch of a parallel circuit has its own complete path back to the cell, so a break in one branch does not break the others. In a series circuit there is only one path, so one broken component stops everything.", "src": "L|if a component in one branch stops working, the other branches are not affected", "answer": ["continue"]}, {"id": "qwenw-01-09", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "What does the voltage of a battery show?", "explain": "The text asks what voltage shows, with 'energy that the battery can supply' as a correct option.", "src": "W|What does the voltage of a battery show?", "options": ["The current from the battery", "The energy that the battery can supply", "The length and width of the battery", "The resistance inside the battery"], "answer": 1}, {"id": "qwenw-01-11", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "Two identical lamps are connected in series with one cell. How does the voltage across each lamp compare with the voltage of the cell?", "explain": "The voltages across the components in a series circuit add up to the supply voltage. Two identical lamps share the cell voltage equally, so each one gets half of it.", "src": "W|Which equation is correct for identical lamps connected in series?", "options": ["It is equal to the cell voltage", "It is half the cell voltage", "It is double the cell voltage", "It is zero"], "answer": 1}, {"id": "qwenw-01-12", "type": "fill", "topic": "9.3", "source": "qwen", "q": "A resistor with a voltage of 12 V and a current of 4 A has a resistance of ____ ohms.", "explain": "Using the equation resistance = voltage / current, 12 V divided by 4 A equals 3 ohms.", "src": "W|The voltage acro <script>
(function(){
var DATA = JSON.parse(document.getElementById('data').textContent);
var FIGS = DATA.figures || {};
var KEY = 'y9sci-' + DATA.chapter;

/* One question can hold several pins; a card is what the learner actually answers,
   so label questions are expanded into one card per pin before anything else runs. */
var CARDS = [];
DATA.questions.forEach(function(q){
  var pins = q.labels || q.pins;
  if(q.type === 'label' && pins){
    // the same words can label two ends of one arrow, or three arrows of one process;
    // every occurrence stays masked, but only the first becomes a card
    var seenText = {};
    pins.filter(function(p){
      var k = p.text.toLowerCase();
      if(seenText[k]) return false;
      seenText[k] = 1; return true;
    }).forEach(function(p, i){
      CARDS.push({id:q.id+'-'+p.n, type:'label', topic:q.topic, source:q.source,
                  q:q.q.replace('{n}', p.n), image:q.image, pin:p, explain:q.explain, src:q.src});
    });
  } else { CARDS.push(q); }
});

var state = load();
var view = [], idx = 0, shown = false, picked = null, mark = null;
var mode = 'flash';                       // flash | quiz
var filter = {type:'all', topic:'all'};

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

var TYPES = ['all','mcq','fill','short','label','hotspot'];
var TOPICS = ['all'].concat(Object.keys(CARDS.reduce(function(a,c){ a[c.topic]=1; return a; },{})).sort());

function buildFilters(){
  var f = document.getElementById('filters');
  f.innerHTML = '';
  TYPES.forEach(function(t){
    var n = t==='all' ? CARDS.length : CARDS.filter(function(c){return c.type===t;}).length;
    if(!n) return;
    var b = el('span','chip'+(filter.type===t?' on':''), (t==='all'?'All':cap(t))+' '+n);
    b.onclick = function(){ filter.type = t; refresh(); };
    f.appendChild(b);
  });
  var sep = el('span','', '|'); sep.style.color='#c3cad2'; f.appendChild(sep);
  TOPICS.forEach(function(t){
    var b = el('span','chip'+(filter.topic===t?' on':''), t==='all'?'All topics':t);
    b.onclick = function(){ filter.topic = t; refresh(); };
    f.appendChild(b);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function refresh(){
  view = CARDS.filter(function(c){
    return (filter.type==='all'||c.type===filter.type) && (filter.topic==='all'||c.topic===filter.topic);
  });
  idx = 0; buildFilters(); render();
}

function norm(s){
  return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}

function figure(card, opts){
  var f = FIGS[card.image];
  if(!f) return el('div','hint','[figure missing: '+card.image+']');
  var wrap = el('div','fig'+(opts.click?' click':''));
  var img = document.createElement('img'); img.src = f.image; img.alt = '';
  wrap.appendChild(img);
  // every printed label is covered, otherwise the answer is sitting on the diagram
  (f.pins||[]).forEach(function(p){
    var m = el('div','mask');
    m.style.cssText = 'left:'+p.x+'%;top:'+p.y+'%;width:'+p.w+'%;height:'+p.h+'%';
    wrap.appendChild(m);
    if(opts.numberAll || (opts.pin && p.n===opts.pin.n)){
      var d = el('div','pin'+(opts.pin && p.n===opts.pin.n ? '' : ' sm'), String(p.n));
      d.style.cssText += 'left:'+(p.x+p.w/2)+'%;top:'+(p.y+p.h/2)+'%';
      wrap.appendChild(d);
    }
  });
  return wrap;
}

function render(){
  var stage = document.getElementById('stage');
  stage.innerHTML = '';
  document.getElementById('mode').textContent = 'Mode: ' + (mode==='flash'?'Flashcards':'Quiz');
  var done = Object.keys(state).length;
  document.getElementById('pbar').style.width = Math.min(100, 100*done/CARDS.length)+'%';
  var right = 0, wrong = 0;
  Object.keys(state).forEach(function(k){ state[k]==='g' ? right++ : wrong++; });
  document.getElementById('score').textContent = right+' known / '+wrong+' to review';

  if(!view.length){ stage.appendChild(el('div','done','Nothing matches this filter.')); return; }
  if(idx >= view.length){
    var d = el('div','done');
    d.appendChild(el('div','big', right+'/'+CARDS.length));
    d.appendChild(el('h2','','Set finished'));
    d.appendChild(el('p','','Use the filters above to review a type again, or press Reset to start over.'));
    stage.appendChild(d); return;
  }
  document.getElementById('pos').textContent = 'Card '+(idx+1)+' of '+view.length;

  var c = view[idx], card = el('div','card');
  var h = el('p','q');
  h.appendChild(el('span','tag', c.type==='mcq'?'Multiple choice':c.type==='fill'?'Fill the gap':cap(c.type)));
  h.appendChild(document.createTextNode(c.q));
  card.appendChild(h);

  if(c.type==='label'){
    card.appendChild(figure(c, {pin:c.pin, numberAll:true}));
  } else if(c.type==='hotspot'){
    card.appendChild(el('div','hint','Click the correct place on the diagram.'));
    var w = figure(c, {click:true});
    w.onclick = function(ev){
      if(shown) return;
      var r = w.getBoundingClientRect();
      var x = 100*(ev.clientX-r.left)/r.width, y = 100*(ev.clientY-r.top)/r.height;
      var t = c.target;
      picked = {x:x, y:y, ok: Math.hypot(x-t.x, y-t.y) <= t.r};
      shown = true; mark = picked.ok ? 'g' : 'a'; commit(c); render();
    };
    card.appendChild(w);
  }

  if(c.type==='mcq'){
    c.options.forEach(function(o,i){
      var b = el('button','opt');
      b.appendChild(el('b','', 'ABCD'[i]));
      b.appendChild(document.createTextNode(o));
      if(shown){
        if(i===c.answer) b.className='opt right';
        else if(i===picked) b.className='opt wrong';
      } else if(i===picked) b.className='opt pick';
      b.onclick = function(){ if(shown) return; picked=i; shown=true; mark = (i===c.answer)?'g':'a'; commit(c); render(); };
      card.appendChild(b);
    });
  }
  if(c.type==='fill' && !shown){
    var inp = document.createElement('input'); inp.type='text'; inp.placeholder='Type your answer, then press Enter';
    inp.onkeydown = function(e){
      if(e.key!=='Enter') return;
      picked = inp.value; shown = true;
      mark = (c.answer||[]).some(function(a){ return norm(a)===norm(inp.value); }) ? 'g' : 'a';
      commit(c); render();
    };
    card.appendChild(inp);
    setTimeout(function(){ inp.focus(); }, 0);
  }

  if(shown){
    var a = el('div','ans'+(mark==='a'?' miss':''));
    a.appendChild(el('div','lab','Answer'));
    var txt = c.type==='mcq' ? c.options[c.answer]
            : c.type==='fill' ? (c.answer||[]).join(' / ')
            : c.type==='label' ? c.pin.text
            : c.type==='hotspot' ? 'See the marked position on the diagram.'
            : c.answer;
    var b = el('div'); b.appendChild(el('b','', txt)); a.appendChild(b);
    if(c.type==='fill' && picked) a.appendChild(el('div','kw','You typed: '+picked));
    if(c.keywords) a.appendChild(el('div','kw','Must mention: '+c.keywords.join(', ')));
    if(c.explain) a.appendChild(el('div','','' + c.explain));
    if(c.src) a.appendChild(el('div','src','Source: '+c.src.replace(/^[LW]\|/,'')));
    card.appendChild(a);
    if(c.type==='hotspot' && picked){
      var w2 = card.querySelector('.fig');
      var d1 = el('div','dot'); d1.style.cssText='left:'+picked.x+'%;top:'+picked.y+'%';
      var d2 = el('div','dot ok'); d2.style.cssText='left:'+c.target.x+'%;top:'+c.target.y+'%';
      w2.appendChild(d1); w2.appendChild(d2);
    }
  }

  var acts = el('div','acts');
  if(!shown){
    // in Quiz mode an answerable card must actually be attempted; only open-ended
    // types (short, label) keep the reveal button, because nothing can mark them
    var mustTry = mode==='quiz' && (c.type==='mcq'||c.type==='fill'||c.type==='hotspot');
    if(!mustTry){
      var s = el('button','b p','Show answer'); s.onclick = function(){ shown=true; render(); }; acts.appendChild(s);
    } else {
      acts.appendChild(el('div','hint','Answer the card to continue.'));
    }
  } else {
    var g = el('button','b g','Got it'); g.onclick = function(){ mark='g'; commit(c); next(); };
    var r2 = el('button','b r','Review again'); r2.onclick = function(){ mark='a'; commit(c); next(); };
    var n = el('button','b p','Next →'); n.onclick = next;
    acts.appendChild(g); acts.appendChild(r2); acts.appendChild(n);
  }
  card.appendChild(acts);
  stage.appendChild(card);
}

function commit(c){ if(mark){ state[c.id] = mark; save(); } }
function next(){ shown=false; picked=null; mark=null; idx++; render(); }

document.getElementById('mode').onclick = function(){ mode = mode==='flash'?'quiz':'flash'; shown=false; picked=null; render(); };
document.getElementById('shuf').onclick = function(){
  for(var i=view.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=view[i]; view[i]=view[j]; view[j]=t; }
  idx=0; shown=false; picked=null; render();
};
document.getElementById('rst').onclick = function(){ state={}; save(); idx=0; shown=false; picked=null; render(); };
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  var c = view[idx]; if(!c) return;
  if(e.key===' '){ e.preventDefault(); if(!shown){ shown=true; render(); } else next(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='g' && shown){ mark='g'; commit(c); next(); }
  else if(e.key==='a' && shown){ mark='a'; commit(c); next(); }
  else if(!shown && c.type==='mcq' && '1234'.indexOf(e.key)>=0){
    var i = +e.key-1; if(i < c.options.length){ picked=i; shown=true; mark=(i===c.answer)?'g':'a'; commit(c); render(); }
  }
});
refresh();
})();
</script>
</body>
</html>
