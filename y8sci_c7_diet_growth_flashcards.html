:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}

.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>

, {"id": "y8c07-f03h4", "type": "hotspot", "topic": "7.4", "source": "opus", "image": "img/L_p23_arm_muscles.png", "figure": "L_p23_arm_muscles", "q": "Click on the three tendons in the diagram.", "caption": "The muscles that move the bones of the arm at the elbow joint.", "target": {"x": 43.5, "y": 20, "r": 3}, "explain": "The three tendons is labelled on this diagram in the textbook.", "src": "L|three tendons"}, {"id": "y8c07-m001", "type": "mcq", "topic": "7.1", "source": "opus", "q": "Which nutrient does rice contain a lot of?", "options": ["Starch", "Protein", "Fat", "Vitamin C"], "answer": 0, "explain": "Starch is a type of carbohydrate.", "src": "L|The rice contains a lot of starch."}, {"id": "y8c07-m002", "type": "mcq", "topic": "7.1", "source": "opus", "q": "Starch is a type of which nutrient?", "options": ["Carbohydrate", "Protein", "Fat", "Mineral"], "answer": 0, "explain": "Sugars are carbohydrates too.", "src": "L|Starch is a type of carbohydrate."}, {"id": "y8c07-m043", "type": "mcq", "topic": "7.2", "source": "opus", "q": "What is your diet?", "options": ["The food that you eat each day", "The energy you use each day", "The exercise you take each day", "A plan to lose weight"], "answer": 0, "explain": "Everyone has a diet, whether or not it is a healthy one.", "src": "L|Your diet is the food that you eat each day."}, {"id": "y8c07-m044", "type": "mcq", "topic": "7.2", "source": "opus", "q": "What is a balanced diet?", "options": ["A diet that provides all the different kinds of nutrients, and the right amount of energy", "A diet that contains no fat or sugar at all", "A diet that contains only carbohydrate and protein", "A diet that is the same for every person"], "answer": 0, "explain": "Balanced means neither too much nor too little of anything.", "src": "L|A diet that provides all the different kinds of nutrients, and the right amount of energy,"}, {"id": "y8c07-m063", "type": "mcq", "topic": "7.3", "source": "opus", "q": "How did every person on Earth begin their life?", "options": ["As a single cell", "As a ball of cells called an embryo", "As a miniature human being", "As a baby"], "answer": 0, "explain": "That cell divided to produce two cells.", "src": "L|Every person on Earth began their life as a single cell."}, {"id": "y8c07-m064", "type": "mcq", "topic": "7.3", "source": "opus", "q": "What do cells do as growth happens?", "options": ["Each cell gets bigger, then divides again", "Each cell gets smaller and smaller", "Cells join together to make one large cell", "Cells stop dividing once the embryo forms"], "answer": 0, "explain": "Growth is a repeating cycle of dividing and growing.", "src": "L|Each of these cells got bigger, then divided again."}, {"id": "y8c07-m090", "type": "mcq", "topic": "7.4", "source": "opus", "q": "Where is the skeleton of an insect or other arthropod?", "options": ["On the outside of its body", "Inside its body", "Only in its legs", "They have no skeleton"], "answer": 0, "explain": "This is called an exoskeleton.", "src": "L|Insects and other arthropods have a skeleton on the outside of their body."}, {"id": "y8c07-m091", "type": "mcq", "topic": "7.4", "source": "opus", "q": "What is a skeleton on the outside of the body called?", "options": ["An exoskeleton", "An endoskeleton", "A tendon", "A socket"], "answer": 0, "explain": "Your own skeleton is inside your body instead.", "src": "L|This is called an exoskeleton."}, {"id": "y8c07-m124", "type": "mcq", "topic": "7.4", "source": "opus", "q": "What kind of joint is the knee joint?", "options": ["A hinge joint", "A ball-and-socket joint", "A fixed joint", "A sliding joint"], "answer": 0, "explain": "Like the elbow, it moves back and forth in one direction only.", "src": "W|What kind of joint is the knee joint?"}, {"id": "y8c07-m125", "type": "fill", "topic": "7.1", "source": "opus", "q": "Starch is a type of ____.", "answer": ["carbohydrate"], "explain": "Sugars are carbohydrates too.", "src": "L|Starch is a type of carbohydrate."}, {"id": "y8c07-m137", "type": "fill", "topic": "7.2", "source": "opus", "q": "Your ____ is the food that you eat each day.", "answer": ["diet"], "explain": "A balanced diet supplies all the nutrients and the right amount of energy.", "src": "L|Your diet is the food that you eat each day."}, {"id": "y8c07-m145", "type": "fill", "topic": "7.3", "source": "opus", "q": "A little ball of cells produced when a cell divides again and again is called an ____.", "answer": ["embryo"], "explain": "The embryo eventually becomes a baby.", "src": "L|They produce a little ball of cells called an embryo, and eventually a baby."}, {"id": "y8c07-m153", "type": "fill", "topic": "7.4", "source": "opus", "q": "A skeleton on the outside of the body is called an ____.", "answer": ["exoskeleton"], "explain": "Insects and other arthropods have one.", "src": "L|This is called an exoskeleton."}, {"id": "y8c07-r001", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain the difference between the words 'food' and 'nutrient'.", "answer": "A food is something you eat, such as chicken or rice. A nutrient is one of the substances inside that food which the body uses, such as protein, carbohydrate, fat, vitamins, minerals or water. One food usually contains several different nutrients.", "keywords": ["food", "what you eat", "nutrient", "substance", "several"], "src": "L|Explain the difference between the meanings of the words ‘food’ and ‘nutrient’."}, {"id": "y8c07-r002", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why you need to eat carbohydrates.", "answer": "The body breaks starch down into glucose, and glucose is the fuel your cells use for respiration. Respiration releases the energy the cells need, so without carbohydrate there would be no easy supply of fuel for that process.", "keywords": ["starch", "glucose", "respiration", "release energy", "fuel"], "src": "L|You may remember that glucose is the fuel that your cells use for respiration, to release energy."}, {"id": "y8c07-r003", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why a person who has been injured needs plenty of protein.", "answer": "Protein is used to make new cells. Repairing damaged tissue means building new cells to replace the ones that were destroyed, so more protein is needed than usual. Protein is also needed to make haemoglobin and antibodies.", "keywords": ["new cells", "repair", "replace", "haemoglobin", "antibodies"], "src": "L|So you need protein to help the body to grow, or to repair itself if it gets damaged."}, {"id": "y8c07-r004", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why the body can use protein for energy but this is not what protein is for.", "answer": "You get almost all of your energy from carbohydrates and fats, and protein is only used for energy if you run out of those. Protein's real job is making new cells, haemoglobin and antibodies, so using it as fuel means it is no longer available for growth and repair.", "keywords": ["run out", "carbohydrates and fats", "new cells", "not available"], "src": "L|You can also get energy from protein if you run out of carbohydrates and fats."}, {"id": "y8c07-r005", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain the difference between the body's carbohydrate store and its fat store.", "answer": "A small amount of carbohydrate is stored in the cells, especially in the liver and muscles, and it is used up quickly. Fat is stored in special cells underneath the skin and around some organs, and there is much more of it, so it is the long-term store.", "keywords": ["small amount", "liver and muscles", "fat", "under the skin", "long-term"], "src": "L|You store a small amount of carbohydrate in your cells, especially in the liver and muscles."}, {"id": "y8c07-r006", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why animals living in cold places, such as seals, have thick fat stores under the skin.", "answer": "Fat provides heat insulation as well as an energy store. A thick layer under the skin slows the loss of heat from the body to the cold surroundings, so the animal can keep its body temperature up without using so much energy.", "keywords": ["insulation", "slows heat loss", "cold", "body temperature"], "src": "L|Animals that live in cold places, like this seal, have a lot of fat stores underneath their skin, to help to stop them losing heat from their body."}, {"id": "y8c07-r007", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why a person short of vitamin A may not be able to see at night.", "answer": "Vitamin A is needed to help the eyes work well, and it is particularly important for seeing when it is quite dark. Without enough of it the eyes cannot respond to the very small amount of light available at night, even though daytime vision may seem normal.", "keywords": ["vitamin A", "eyes", "dark", "small amount of light"], "src": "L|People who don’t have enough vitamin A in their diet may not be able to see anything at night."}, {"id": "y8c07-r008", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why sailors on long sea voyages in the past often developed scurvy.", "answer": "Scurvy is caused by a lack of vitamin C, which comes mainly from fresh fruit and vegetables. On a long voyage there was no way to keep fresh food, so the sailors ate none for months and their supply of vitamin C ran out.", "keywords": ["vitamin C", "fresh fruit and vegetables", "none on board", "long voyage"], "src": "L|In the past, before anyone knew about vitamin C, sailors on long sea voyages often got scurvy."}, {"id": "y8c07-r009", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why most of your vitamin D does not come from your food.", "answer": "There are not many kinds of food that contain vitamin D. Instead it is made in the skin when sunlight falls on it, so for most people sunlight rather than diet is the main source.", "keywords": ["few foods", "made in the skin", "sunlight", "main source"], "src": "L|Instead, vitamin D is made in the skin when sunlight falls onto it."}, {"id": "y8c07-r010", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why people living far from the equator are more likely to be short of vitamin D.", "answer": "Vitamin D is made in the skin when sunlight falls on it. Far from the equator there is less strong sunshine, especially in winter, and people spend more time indoors and covered up, so their skin makes less vitamin D.", "keywords": ["less sunshine", "skin", "indoors", "covered up"], "src": "L|This is most likely to happen if you live in a country far from the equator, or where there is not much sunshine."}, {"id": "y8c07-r011", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain the link between vitamin D and calcium in building strong bones.", "answer": "Calcium is the mineral that makes bones and teeth strong, but the body cannot absorb it properly from food without vitamin D. So a child could eat plenty of calcium and still have bones that do not grow normally if they are short of vitamin D.", "keywords": ["absorb calcium", "vitamin D", "bones", "not absorbed"], "src": "L|It helps the body to absorb calcium from the food that you eat."}, {"id": "y8c07-r012", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why a shortage of iron in the diet leads to anaemia.", "answer": "Iron is needed to make haemoglobin. Without enough iron the body makes too little haemoglobin, so not enough oxygen can be transported around the body, and this shortage of oxygen is what causes anaemia.", "keywords": ["iron", "haemoglobin", "oxygen", "transported", "anaemia"], "src": "L|If you don’t eat enough iron, you don’t make enough haemoglobin, so not enough oxygen is transported around the body."}, {"id": "y8c07-r013", "type": "short", "topic": "7.1", "source": "opus", "q": "Use your knowledge of respiration to explain why a person with anaemia feels very tired.", "answer": "Anaemia means not enough oxygen is being carried to the cells. Cells need oxygen for respiration to release energy from glucose, so with less oxygen they carry out less respiration and release less energy, which makes the person feel tired.", "keywords": ["not enough oxygen", "respiration", "less energy", "tired"], "src": "L|Use your knowledge about respiration to explain why a person with anaemia does not have much energy."}, {"id": "y8c07-r014", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why water is essential inside your cells.", "answer": "Water in the cells allows all the different chemicals inside them to dissolve. Chemicals can only react together when they are dissolved and able to move, so without water the reactions that keep the cell alive could not happen.", "keywords": ["dissolve", "chemicals", "react together", "cells"], "src": "L|Water in cells allows all the different chemicals inside them to dissolve, so that they can react together."}, {"id": "y8c07-r015", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why water is essential in the blood.", "answer": "Water allows blood to flow easily, so it can be pumped all round the body carrying dissolved substances such as glucose, oxygen and waste. If there is too little water the blood cannot transport these substances properly.", "keywords": ["flow", "transport", "dissolved", "round the body"], "src": "L|Water in blood allows it to fl ow easily, transporting substances all over the body."}, {"id": "y8c07-r016", "type": "short", "topic": "7.1", "source": "opus", "q": "Marcus says Brazil nuts contain more calcium than all their other nutrients put together, and Sofia says it is more fat. Explain how you would use a nutrient table to decide who is right.", "answer": "You read the mass of each nutrient in 100 g of Brazil nuts, add together all the nutrients except the one being tested, and compare. Calcium is a mineral needed only in small amounts, so its mass will be tiny, while fat is present in large amounts, which is why Sofia is right.", "keywords": ["read the table", "add together", "compare", "fat", "calcium small"], "src": "W|Brazil nuts contain more calcium than all the other nutrients put together."}, {"id": "y8c07-r017", "type": "short", "topic": "7.1", "source": "opus", "q": "A child has weak teeth and bones. Explain which nutrients they most need and why.", "answer": "They need calcium, because bones and teeth contain calcium and it is what makes them strong, and vitamin D, because without it the calcium cannot be absorbed from the food. Protein is also needed, since bones contain living cells that have to be built.", "keywords": ["calcium", "vitamin D", "absorb", "protein", "living cells"], "src": "W|Which food would be best for a child who has weak teeth and bones?"}, {"id": "y8c07-r018", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain what is meant by a balanced diet.", "answer": "A balanced diet provides some of all the different kinds of nutrient — carbohydrate, protein, fat, vitamins, minerals and water — and also gives the right amount of energy for that person. Too much or too little energy, or a missing nutrient, means the diet is not balanced.", "keywords": ["all the nutrients", "right amount of energy", "not too much", "not too little"], "src": "L|Your diet should provide you with some of all the different kinds of nutrients."}, {"id": "y8c07-r019", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why some eight-year-old children need more energy than the average for their age.", "answer": "The average hides a lot of variation. A child who is bigger than average, or who is very active and plays a lot of sport, uses more energy each day, so they need to take in more energy in their food to match what they use.", "keywords": ["bigger", "more active", "uses more energy", "average"], "src": "L|Explain why some eight-year-old children might need more energy than this."}, {"id": "y8c07-r020", "type": "short", "topic": "7.2", "source": "opus", "q": "Suggest why a man aged 50 needs less energy in his diet than a boy aged 15.", "answer": "The 15-year-old is still growing, so energy is needed to build new cells as well as for everyday activity, and teenagers are often more physically active. The 50-year-old has stopped growing and may be less active, so he uses less energy each day.", "keywords": ["still growing", "new cells", "more active", "stopped growing"], "src": "L|Suggest why a man aged 50 years needs to take in less energy in his diet than a boy aged 15 years."}, {"id": "y8c07-r021", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why a person with an office job needs less carbohydrate and fat than someone who does heavy physical work.", "answer": "Carbohydrate and fat are the main energy supplies. Someone who sits down for most of the day uses less energy than someone moving around or playing sport, so they need to take in less. Eating the same amount as an active person would mean storing the extra as fat.", "keywords": ["sitting", "uses less energy", "active", "stored as fat"], "src": "L|So they don’t need to eat as much carbohydrate or fat as someone who has a job that involves moving around, or who does a lot of sport."}, {"id": "y8c07-r022", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why a pregnant woman needs extra protein, iron and calcium.", "answer": "She needs plenty of protein to build her growing baby's new cells, extra iron to make haemoglobin for both her own blood and her baby's, and plenty of calcium for building the baby's bones. All three are being used to build a second body as well as maintain her own.", "keywords": ["protein", "new cells", "iron", "haemoglobin", "calcium", "bones"], "src": "L|She also needs lots of iron in her diet, to make haemoglobin in her own blood and her baby’s blood."}, {"id": "y8c07-r023", "type": "short", "topic": "7.2", "source": "opus", "q": "Fibre cannot be digested. Explain why it is still an important part of the diet.", "answer": "Because it is not digested it does not go into the blood or the cells, but it travels all the way through the digestive system. It keeps the digestive system healthy and helps to prevent constipation, when the digestive system slows down and faeces collect inside it.", "keywords": ["not digested", "travels through", "digestive system healthy", "constipation"], "src": "L|This is because, when you eat it, you cannot digest it."}, {"id": "y8c07-r024", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why foods made from plants are good sources of fibre.", "answer": "Plant cell walls are made of cellulose, which humans cannot digest. Foods such as cereal grains, seeds and fresh fruit and vegetables are full of plant cell walls, so they carry a lot of fibre, and they usually supply plenty of vitamins and minerals too.", "keywords": ["cell walls", "cellulose", "cannot digest", "plants"], "src": "L|Remember that plant cell walls are made of cellulose, so foods made from plants are a good source of fi bre."}, {"id": "y8c07-r025", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain what the area of each layer in the food triangle is meant to show.", "answer": "The bigger the area of a kind of food in the triangle, the greater the proportion of your diet it should make up. So the foods in the wide bottom layers should be eaten most often and those in the narrow top should be eaten least.", "keywords": ["bigger area", "greater proportion", "most", "least"], "src": "L|The bigger the area in the triangle, the greater the proportion of your diet that kind of food should make up."}, {"id": "y8c07-r026", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why sweets and fried foods are placed at the top of the food triangle.", "answer": "They are high in sugar and fat, which should make up only a small proportion of the diet. Too much sugar causes tooth decay and raises the risk of diabetes, and too much fat can lead to weight gain and heart disease, so they belong in the narrowest part.", "keywords": ["sugar", "fat", "small proportion", "tooth decay", "heart disease"], "src": "L|a Explain why sweets and fried foods are at the top of the triangle."}, {"id": "y8c07-r027", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why whole-grain bread or brown rice is a better choice than white bread or white rice.", "answer": "The whole grain keeps the outer layers of the seed, which are made of plant cell walls and so supply much more fibre. Fibre keeps the digestive system healthy and helps prevent constipation, and these foods usually contain more vitamins and minerals as well.", "keywords": ["whole grain", "fibre", "digestive system", "vitamins and minerals"], "src": "L|b Explain why it is better to eat whole-grain bread, or brown rice, rather than white bread or rice."}, {"id": "y8c07-r028", "type": "short", "topic": "7.2", "source": "opus", "q": "Suggest how a person who does not eat meat or fish can still get enough protein.", "answer": "They can eat plant foods that are rich in protein, such as beans, lentils, nuts and seeds, and foods made from milk or eggs if they eat those. Eating a variety of these ensures the body gets the protein it needs to make new cells.", "keywords": ["beans", "nuts", "seeds", "milk", "variety"], "src": "L|c Suggest how you can make sure you get enough protein in your diet, if you don’t like eating meat or fi sh."}, {"id": "y8c07-r029", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why a burger, fries and a sweet milky drink should not be eaten too often.", "answer": "This meal is high in fat and sugar and low in fibre, vitamins and minerals. Too much sugar causes tooth decay and increases the risk of diabetes, and too much fat and carbohydrate leads to weight gain, which strains the joints, heart and other organs. Eating it occasionally is fine; eating it often makes the whole diet unbalanced.", "keywords": ["high in fat and sugar", "low in fibre", "tooth decay", "weight gain", "occasionally"], "src": "L|c Explain to him why he should not eat his favourite meal too often."}, {"id": "y8c07-r030", "type": "short", "topic": "7.2", "source": "opus", "q": "A man regularly eats food containing more energy than he uses each day. Explain what happens to the extra energy.", "answer": "The energy that is not used is stored, first as a small amount of carbohydrate in the liver and muscles and then as fat under the skin and around the organs. Over time the fat stores grow, so he puts on weight, which puts a strain on his joints, heart and other organs.", "keywords": ["not used", "stored", "fat", "puts on weight", "strain"], "src": "W|A man regularly eats food containing more energy than he uses up each day."}, {"id": "y8c07-r031", "type": "short", "topic": "7.2", "source": "opus", "q": "Suggest why, on average, an adult woman needs less energy each day than an adult man.", "answer": "On average women have a smaller body mass and a smaller proportion of muscle. A smaller body with less muscle uses less energy both at rest and when active, so less energy is needed in the food each day.", "keywords": ["smaller body", "less muscle", "uses less energy", "on average"], "src": "W|d Suggest why, on average, an adult woman needs less energy each day than an adult man does."}, {"id": "y8c07-r032", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain what happens inside the body, as a person grows, to make it get bigger.", "answer": "The cells divide to make more cells, and each new cell then grows bigger before dividing again. Growth is an increase in the number and size of cells, which is why plenty of protein is needed to build them and enough energy for the dividing.", "keywords": ["cells divide", "more cells", "grow bigger", "protein", "energy"], "src": "L|Explain what happens as a person grows, to make their body get bigger."}, {"id": "y8c07-r033", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain the difference between growth and development.", "answer": "Growth is getting bigger — more cells and larger cells. Development is the change from a simple structure into one that can do more: tissues and organs forming, leg muscles and bones becoming strong enough to walk and run, and the brain developing so the child learns to talk and play.", "keywords": ["growth", "bigger", "development", "new abilities", "tissues and organs"], "src": "L|The change from a single cell to an adult human involves more than just growth."}, {"id": "y8c07-r034", "type": "short", "topic": "7.3", "source": "opus", "q": "Everyone passes through the same stages of development. Explain why the stages have no sharp divisions between them.", "answer": "Each stage blends gradually into the next because the changes happen continuously rather than all at once. The stages are names we give to parts of a smooth process, and each person goes through them at slightly different rates and in slightly different ways.", "keywords": ["blends gradually", "continuous", "names we give", "different rates"], "src": "L|Notice that each stage blends gradually into the next one – there are no sharp divisions between them."}, {"id": "y8c07-r035", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain how regular exercise helps to stop a person storing too much fat.", "answer": "Exercise uses up some of the energy in the food eaten each day. If the energy taken in is used rather than left over, there is less surplus to be stored as fat, so the fat stores do not keep growing.", "keywords": ["uses energy", "less surplus", "not stored", "fat"], "src": "L|This helps to use some of energy in the food you eat each day, stopping you from storing too much as fat."}, {"id": "y8c07-r036", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain two ways, other than weight, in which exercise improves health.", "answer": "It makes the heart and muscles work hard, so they become stronger and able to do more. It also makes many people feel more cheerful and positive about life, so it benefits mental as well as physical health.", "keywords": ["heart", "muscles", "stronger", "cheerful", "mental health"], "src": "L|It also makes the heart and muscles work hard, so that they become strong."}, {"id": "y8c07-r037", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain why smokers find it so difficult to stop smoking.", "answer": "Tobacco contains nicotine, which is addictive. Once the body is used to it, going without makes the person feel unwell and craving, so it is difficult to manage without it even when they know the damage it is doing.", "keywords": ["nicotine", "addictive", "used to it", "difficult to manage"], "src": "L|This means that it is diffi cult to manage without it, once you are used to smoking."}, {"id": "y8c07-r038", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain how nicotine increases a smoker's risk of heart disease.", "answer": "Nicotine damages the blood vessels and makes them get narrower, so it is harder for blood to get through them. The heart has to work harder to push blood through the narrowed vessels, and smokers are more likely than non-smokers to develop heart disease.", "keywords": ["narrower", "blood vessels", "harder to get through", "heart disease"], "src": "L|It makes them get narrower, so it is harder for blood to get through them."}, {"id": "y8c07-r039", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain why carbon monoxide in tobacco smoke leaves a smoker's cells short of energy.", "answer": "Carbon monoxide combines with haemoglobin in the red blood cells and stops it doing its normal job of combining with oxygen. Less oxygen reaches the cells, so they cannot carry out enough respiration and cannot release as much energy from glucose.", "keywords": ["carbon monoxide", "haemoglobin", "less oxygen", "respiration", "less energy"], "src": "L|This stops haemoglobin doing its normal job, which is to combine with oxygen and transport it to all the body cells that need it."}, {"id": "y8c07-r040", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain how damage to the alveoli makes it hard for a smoker to get enough oxygen.", "answer": "Particulates in the smoke make the walls of the alveoli break down, so instead of millions of tiny alveoli the smoker has a few large spaces. That greatly reduces the total surface area available for oxygen to diffuse into the blood, so less oxygen gets through.", "keywords": ["alveoli", "break down", "large spaces", "surface area", "less oxygen"], "src": "L|This makes the walls of the alveoli break down."}, {"id": "y8c07-r041", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain what cancer is and how smoking increases the risk of it.", "answer": "Cancer happens when cells start dividing out of control and spread to other parts of the body. Tobacco smoke contains tar, a mixture of dark sticky substances, and many other harmful chemicals which damage cells, so smoking increases the risk of many kinds of cancer including lung cancer.", "keywords": ["dividing out of control", "spread", "tar", "harmful substances", "risk"], "src": "L|Cancer happens when cells start dividing out of control and spread to other parts of the body."}, {"id": "y8c07-r042", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain why smoking harms people who do not smoke.", "answer": "People near a smoker accidentally breathe in the cigarette smoke, which contains the same nicotine, carbon monoxide, tar and particulates. Those substances do the same damage in their bodies, so the harm is not limited to the smoker.", "keywords": ["breathe in", "same substances", "same damage", "not only the smoker"], "src": "L|It also damages the health of people around them, who accidentally breathe in cigarette smoke."}, {"id": "y8c07-r043", "type": "short", "topic": "7.3", "source": "opus", "q": "Suggest why tobacco companies might have tried to hide the dangers of smoking.", "answer": "They made their money from selling cigarettes. If people understood the harm they would buy fewer, so the companies had a strong financial reason to play down or dispute the evidence — which is exactly why information from them about their own product should be treated as possibly biased.", "keywords": ["money", "sell fewer", "financial reason", "biased"], "src": "L|Why might tobacco companies have tried to hide the dangers?"}, {"id": "y8c07-r044", "type": "short", "topic": "7.3", "source": "opus", "q": "Suggest why it took so long for people to realise that smoking was harmful.", "answer": "The diseases caused by smoking take many years to appear, so the link between the habit and the illness is not obvious. Until the 1960s no research had shown the connection clearly, and the tobacco companies advertised cigarettes as harmless or even good for you.", "keywords": ["many years", "not obvious", "no research", "advertised"], "src": "L|Why did it take so long for people to realise that smoking was harmful?"}, {"id": "y8c07-r045", "type": "short", "topic": "7.3", "source": "opus", "q": "E-cigarettes provide nicotine but are less likely to make the smoker ill. Suggest how they might help more people to give up smoking.", "answer": "The main reason people find it so hard to stop is that nicotine is addictive. An e-cigarette supplies the nicotine without the tar, carbon monoxide and particulates, so the craving is satisfied while the most damaging substances are avoided, and the dose can then be reduced gradually.", "keywords": ["nicotine", "addictive", "without the tar", "reduce gradually"], "src": "W|Using the information from the survey, and your own knowledge of the effects of nicotine, suggest how e-cigarettes might help more people to give up smoking."}, {"id": "y8c07-r046", "type": "short", "topic": "7.3", "source": "opus", "q": "Describe and explain how smoking during pregnancy affects the chance of a baby having a low birthweight.", "answer": "The more cigarettes a mother smokes each day, the greater the percentage of babies born with a low birthweight. Carbon monoxide and nicotine reduce the oxygen and nutrients reaching the baby through the mother's blood, so the baby's cells cannot grow as fast.", "keywords": ["more cigarettes", "greater percentage", "less oxygen", "cannot grow"], "src": "L|Describe how smoking during pregnancy affects the chance of having a baby with a low birthweight."}, {"id": "y8c07-r047", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why both calcium and protein are needed for strong bones.", "answer": "Calcium is the mineral that makes bone hard, so without enough of it the bones may not grow properly. Bones also contain living cells, and protein is needed to build those cells, so both nutrients are required.", "keywords": ["calcium", "hard", "living cells", "protein"], "src": "L|If you do not have enough calcium in your diet, your bones may not grow properly."}, {"id": "y8c07-r048", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why movement of the skeleton can only happen at a joint.", "answer": "Bones themselves are rigid and cannot bend. Movement can only take place where two bones meet one another, so a joint is needed wherever the body has to change shape.", "keywords": ["bones are rigid", "cannot bend", "two bones meet", "joint"], "src": "L|Movement in the skeleton can only take place where two bones meet one another."}, {"id": "y8c07-r049", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain the difference between a hinge joint and a ball-and-socket joint.", "answer": "A hinge joint lets the bones move back and forth in one direction only, like a door opening and closing — the elbow and knee are examples. In a ball-and-socket joint one bone has a ball-shaped end that fits into a cup in the other, which lets the bones move in a complete circle, as at the shoulder and hip.", "keywords": ["hinge", "one direction", "ball and socket", "complete circle", "elbow", "shoulder"], "src": "L|They let the bones move back and forth in one direction, in the same way that a door opens and closes."}, {"id": "y8c07-r050", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain where a muscle gets the energy it needs to contract.", "answer": "Muscle cells release the energy from glucose by respiration, like all other cells. The harder and more often the muscle contracts, the more energy it uses and so the more glucose it needs, which is why an active person must eat plenty of carbohydrate.", "keywords": ["glucose", "respiration", "more contraction", "more glucose"], "src": "L|Like all cells, they get this energy from nutrients, especially glucose."}, {"id": "y8c07-r051", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain how the contraction of a muscle moves a bone.", "answer": "Muscles are attached to bones by tough cords called tendons. When the muscle contracts it gets shorter and pulls on the tendon, and the tendon pulls on the bone, so the bone moves at the joint.", "keywords": ["contracts", "shorter", "tendon", "pulls", "bone"], "src": "L|When the muscle contracts, it pulls on the tendon, which pulls on the bone."}, {"id": "y8c07-r052", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why one muscle on its own cannot both bend and straighten the arm.", "answer": "Muscles can only pull. They generate a force by getting shorter, but they cannot generate a force by getting longer, so the biceps cannot push the arm straight again. A second muscle is needed on the other side of the joint to pull it back.", "keywords": ["can only pull", "shorter", "cannot push", "second muscle"], "src": "L|It’s important to remember that muscles can only pull."}, {"id": "y8c07-r053", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain what is meant by antagonistic muscles, using the biceps and triceps as your example.", "answer": "Antagonistic muscles are two muscles that work as a team at a joint, each pulling the bones in the opposite direction. To bend the arm the biceps contracts and the triceps relaxes; to straighten it the triceps contracts and the biceps relaxes.", "keywords": ["opposite directions", "biceps contracts", "triceps relaxes", "team"], "src": "L|Two muscles that work together like this are called antagonistic muscles."}, {"id": "y8c07-r054", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain what happens between deciding to bend your arm and the arm actually moving.", "answer": "The brain sends an electrical impulse along a neurone to the biceps muscle. The cells in the biceps respond by contracting, the contracting biceps pulls on its tendon, and the radius is pulled upwards, so the arm bends at the elbow.", "keywords": ["brain", "electrical impulse", "neurone", "contract", "tendon", "bends"], "src": "L|When you decide to bend your arm, your brain sends an electrical impulse along a neurone, to your biceps muscle."}, {"id": "y8c07-r055", "type": "short", "topic": "7.4", "source": "opus", "q": "The biceps is fixed to the scapula at one end and the radius at the other. Explain why this arrangement makes the arm bend.", "answer": "Because both ends are firmly fixed, shortening the muscle must pull those two bones closer together. The scapula is held in place by the rest of the skeleton, so it is the radius that moves upwards, and the arm bends at the elbow.", "keywords": ["both ends fixed", "pulled closer", "scapula held", "radius moves"], "src": "L|So when it gets shorter, these bones are pulled closer together."}, {"id": "y8c07-r056", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why two muscles are needed to move a bone in one direction and then back again.", "answer": "A muscle can only produce a force by contracting, that is by getting shorter. It cannot push, so it cannot return the bone to its original position. A second muscle attached on the other side of the joint contracts to pull the bone back, while the first one relaxes.", "keywords": ["only pull", "cannot push", "other side", "pull back", "relaxes"], "src": "L|e Explain why two muscles are needed to move a bone in one direction and then back again."}, {"id": "y8c07-r057", "type": "short", "topic": "7.4", "source": "opus", "q": "In an experiment to measure the force needed to break a drinking straw, explain which variables should be kept the same and why.", "answer": "The length and diameter of the straw, the material it is made from and the way it is supported should all be kept the same, except for the one variable being tested. If more than one thing changes, any difference in the breaking force cannot be linked to the variable you are investigating.", "keywords": ["keep the same", "one variable", "cannot be linked", "fair test"], "src": "W|c Which variables will you try to keep the same?"}, {"id": "y8c07-r058", "type": "short", "topic": "7.4", "source": "opus", "q": "A student wants to test the hypothesis 'long bones break more easily than short bones' using drinking straws. Explain why a straw is a reasonable model and what its limits are.", "answer": "A straw is a hollow tube like a long bone, so its length can be varied while everything else is kept the same, and the breaking force can be measured with a newton meter. The limits are that a straw is made of a single uniform material, whereas real bone is living tissue containing calcium and cells and can repair itself, so the values would not apply directly to a real bone.", "keywords": ["hollow tube", "vary length", "measure force", "living tissue", "not the same material"], "src": "W|Tick (✓) the two hypotheses that could be tested using a method similar to the one shown in the diagram."}, {"id": "y8c07-o001", "type": "short", "topic": "7.1", "source": "opus", "q": "Give two reasons why the body needs protein.", "answer": "Protein is needed to make new cells so the body can grow, and to repair the body if it is damaged. It is also needed to make haemoglobin and antibodies.", "keywords": ["grow", "growth", "repair", "new cells", "haemoglobin", "antibodies"], "explain": "Protein is the nutrient used for building and mending cells, not mainly for energy.", "src": "L|So you need protein to help the body to grow, or to repair itself if it gets damaged."}, {"id": "y8c07-o002", "type": "short", "topic": "7.1", "source": "opus", "q": "What happens to starch after you have eaten it?", "answer": "The body breaks the starch down to make a sugar called glucose.", "keywords": ["broken down", "glucose", "sugar", "digested"], "explain": "Glucose is the fuel that cells use for respiration, so starch is an energy food.", "src": "L|After you have eaten starch, the body breaks it down to make a sugar called glucose."}, {"id": "y8c07-o003", "type": "short", "topic": "7.1", "source": "opus", "q": "What is the difference between a fat and an oil?", "answer": "Fats and oils are very similar, but fats are solid at normal temperatures and oils are liquid.", "keywords": ["fat solid", "oil liquid", "solid", "liquid", "normal temperature"], "explain": "The chemical job of fats and oils is the same; only their state at room temperature differs.", "src": "L|Fats and oils are very similar, but fats are solid at normal temperatures and oils are liquid."}, {"id": "y8c07-o010", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why a person who does not eat enough iron feels very tired.", "answer": "Without enough iron they do not make enough haemoglobin, so not enough oxygen is transported around the body. The cells cannot carry out enough respiration, so they release less energy.", "keywords": ["haemoglobin", "oxygen", "respiration", "energy", "transported"], "explain": "This illness is called anaemia.", "src": "L|If you don’t eat enough iron, you don’t make enough haemoglobin, so not enough oxygen is transported around the body."}, {"id": "y8c07-o016", "type": "short", "topic": "7.2", "source": "opus", "q": "Why does a pregnant woman need extra iron in her diet?", "answer": "She needs iron to make haemoglobin in her own blood and in her baby's blood.", "keywords": ["haemoglobin", "baby", "blood", "iron"], "explain": "She also needs extra protein for the baby's new cells and extra calcium for its bones.", "src": "L|She also needs lots of iron in her diet, to make haemoglobin in her own blood and her baby’s blood."}, {"id": "y8c07-o017", "type": "short", "topic": "7.2", "source": "opus", "q": "Why are foods made from plants good sources of fibre?", "answer": "Plant cell walls are made of cellulose, and fibre is mostly cellulose.", "keywords": ["cell walls", "cellulose", "plant cells"], "explain": "Cereal grains, seeds and fresh fruit and vegetables are all excellent sources of fibre.", "src": "L|Remember that plant cell walls are made of cellulose, so foods made from plants are a good source of fi bre."}, {"id": "y8c07-o018", "type": "short", "topic": "7.2", "source": "opus", "q": "What is constipation, and how does fibre help to prevent it?", "answer": "Constipation is when the digestive system slows down and faeces collect inside it instead of being passed out. Fibre keeps the digestive system working, so it helps to prevent constipation.", "keywords": ["digestive system", "slows down", "faeces", "prevent"], "explain": "Fibre is not digested and does not enter the blood, but it still keeps the gut healthy.", "src": "L|It helps to prevent constipation, when the digestive system slows down and faeces collect inside it, instead of being passed out."}, {"id": "y8c07-o019", "type": "short", "topic": "7.2", "source": "opus", "q": "Give two reasons why you should not eat too much sugar.", "answer": "Too much sugar can make your teeth decay, and it increases the risk of developing an illness called diabetes.", "keywords": ["teeth decay", "tooth decay", "diabetes"], "explain": "Sugar is a carbohydrate, so it also adds energy that may be stored as fat.", "src": "L|Too much sugar (a kind of carbohydrate) can make your teeth decay."}, {"id": "y8c07-o020", "type": "short", "topic": "7.2", "source": "opus", "q": "Why is putting on too much weight bad for the body?", "answer": "Extra weight puts a strain on the joints, the heart and other body organs.", "keywords": ["strain", "joints", "heart", "organs"], "explain": "Eating too much fat, oil or carbohydrate is what causes the weight gain.", "src": "L|This can put a strain on your joints, heart and other body organs."}, {"id": "y8c07-o021", "type": "short", "topic": "7.2", "source": "opus", "q": "What is the risk of eating too many fats that come from animals?", "answer": "It can increase the risk of developing heart disease.", "keywords": ["heart disease", "heart"], "explain": "This is why animal fats and fried foods sit at the top of the food triangle.", "src": "L|Eating too many fats that come from animals can increase the risk of developing heart disease."}, {"id": "y8c07-o022", "type": "short", "topic": "7.3", "source": "opus", "q": "What is an embryo?", "answer": "An embryo is the little ball of cells produced when the first cell divides over and over again, which eventually becomes a baby.", "keywords": ["ball of cells", "cells", "divides", "early stage", "baby"], "explain": "The embryo develops inside the mother's body.", "src": "L|They produce a little ball of cells called an embryo, and eventually a baby."}, {"id": "y8c07-o024", "type": "short", "topic": "7.3", "source": "opus", "q": "Why does a growing child need plenty of protein and energy in the diet?", "answer": "Cells contain a lot of protein, and energy is needed to make cells divide. Growth happens by cells dividing and growing, so both are needed.", "keywords": ["protein", "cells divide", "energy", "growth"], "explain": "A pregnant woman needs extra protein and energy for exactly the same reason.", "src": "L|A pregnant woman and a growing child need plenty of protein in their diet, as well as enough energy to help cells to divide."}, {"id": "y8c07-o025", "type": "short", "topic": "7.3", "source": "opus", "q": "Give two ways in which regular exercise helps to keep a person healthy.", "answer": "Exercise uses up some of the energy in food so that less is stored as fat, and it makes the heart and muscles work hard so that they become strong. It can also make people feel more cheerful.", "keywords": ["uses energy", "less fat", "heart", "muscles", "strong", "cheerful"], "explain": "Exercise works alongside a balanced diet; neither on its own is enough.", "src": "L|It also makes the heart and muscles work hard, so that they become strong."}, {"id": "y8c07-o026", "type": "short", "topic": "7.3", "source": "opus", "q": "How does nicotine increase a smoker's risk of heart disease?", "answer": "Nicotine damages the blood vessels and makes them narrower, so it is harder for blood to get through them.", "keywords": ["blood vessels", "narrower", "harder for blood", "damages"], "explain": "Nicotine is also addictive, which is why smokers find it so hard to stop.", "src": "L|It makes them get narrower, so it is harder for blood to get through them."}, {"id": "y8c07-o027", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain why the cells of a smoker may not release enough energy.", "answer": "Carbon monoxide combines with haemoglobin and stops it carrying oxygen to the body cells. With less oxygen the cells cannot carry out enough respiration, so they release less energy.", "keywords": ["carbon monoxide", "haemoglobin", "oxygen", "respiration", "energy"], "explain": "Carbon monoxide is a poisonous gas found in tobacco smoke.", "src": "L|This stops haemoglobin doing its normal job, which is to combine with oxygen and transport it to all the body cells that need it."}, {"id": "y8c07-o029", "type": "short", "topic": "7.3", "source": "opus", "q": "How do particulates in tobacco smoke make it hard for a smoker to get enough oxygen?", "answer": "The particulates get trapped in the lungs and make the walls of the alveoli break down, so instead of millions of tiny alveoli the smoker has a few large spaces. This gives a much smaller surface area for oxygen to pass into the blood.", "keywords": ["alveoli", "break down", "big spaces", "surface area", "oxygen"], "explain": "Particulates are tiny particles of carbon and other materials.", "src": "L|Instead of having millions of tiny alveoli in the lungs, the smoker has a lot of big spaces."}, {"id": "y8c07-o030", "type": "short", "topic": "7.4", "source": "opus", "q": "What is an exoskeleton, and which animals have one?", "answer": "An exoskeleton is a skeleton on the outside of the body. Insects and other arthropods have one.", "keywords": ["outside", "insects", "arthropods", "exoskeleton"], "explain": "A human skeleton is inside the body, so it is not an exoskeleton.", "src": "L|Insects and other arthropods have a skeleton on the outside of their body."}, {"id": "y8c07-o031", "type": "short", "topic": "7.4", "source": "opus", "q": "What is a joint?", "answer": "A joint is a place where two bones meet one another. Movement in the skeleton can only take place at a joint, because bones cannot bend.", "keywords": ["two bones meet", "movement", "bones cannot bend"], "explain": "Naming the joint is not enough; the definition is about where two bones meet.", "src": "L|Movement in the skeleton can only take place where two bones meet one another."}, {"id": "y8c07-o032", "type": "short", "topic": "7.4", "source": "opus", "q": "Describe how the bones move at a hinge joint.", "answer": "They move back and forth in one direction only, in the same way that a door opens and closes.", "keywords": ["back and forth", "one direction", "door", "hinge"], "explain": "The elbow, the knee and the finger joints are all hinge joints.", "src": "L|They let the bones move back and forth in one direction, in the same way that a door opens and closes."}, {"id": "y8c07-o033", "type": "short", "topic": "7.4", "source": "opus", "q": "Describe the shape of the two bones at a ball-and-socket joint.", "answer": "One bone has an end shaped like a ball, and the other bone has a cup, or socket, that the ball fits into.", "keywords": ["ball", "socket", "cup", "fits into"], "explain": "This shape lets the bones move in a complete circle, as at the shoulder and the hip.", "src": "L|The other bone has a cup, or socket, that the ball fi ts into."}, {"id": "y8c07-o034", "type": "short", "topic": "7.4", "source": "opus", "q": "What is meant by contraction of a muscle?", "answer": "Contraction is when the specialised cells in a muscle make themselves shorter, so the whole muscle gets shorter.", "keywords": ["shorter", "muscle cells", "contract"], "explain": "A muscle can only contract or relax; it cannot make itself longer to push.", "src": "L|These cells are able to make themselves shorter."}, {"id": "y8c07-o036", "type": "short", "topic": "7.4", "source": "opus", "q": "What is a tendon, and what does it do?", "answer": "A tendon is a tough cord that attaches a muscle to a bone. When the muscle contracts it pulls on the tendon, which pulls on the bone and makes it move at a joint.", "keywords": ["tough cord", "attaches", "muscle to bone", "pulls"], "explain": "Tendons are not stretchy, so the whole pull of the muscle is passed on to the bone.", "src": "L|When the muscle contracts, it pulls on the tendon, which pulls on the bone."}, {"id": "y8c07-o039", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why the biceps cannot push the arm straight again.", "answer": "Muscles can only pull. They generate a force by getting shorter, but they cannot generate a force by getting longer, so another muscle, the triceps, is needed to pull the arm straight.", "keywords": ["only pull", "cannot push", "getting longer", "triceps"], "explain": "This is exactly why muscles have to work in antagonistic pairs.", "src": "L|But they cannot generate a force by getting longer."}, {"id": "y8c07-o040", "type": "short", "topic": "7.4", "source": "opus", "q": "What are antagonistic muscles?", "answer": "Two muscles that work together as a pair, so that when one of them contracts it moves the bones at a joint in one direction, and when the other contracts it moves them in the other direction.", "keywords": ["pair", "one contracts", "other relaxes", "opposite direction"], "explain": "The biceps and the triceps at the elbow are the standard example.", "src": "L|Two muscles that work together like this are called antagonistic muscles."}, {"id": "y8c07-w001", "type": "mcq", "topic": "7.1", "source": "opus", "q": "A table gives the nutrients contained in 100 g of each food. How do you work out how much fat there is in 200 g of milk?", "options": ["Read the figure straight from the table, because the table already covers any mass.", "Double the figure in the table, because the table is for 100 g and you have 200 g.", "Halve the figure in the table.", "Add 200 to the figure in the table."], "answer": 1, "explain": "Always check what mass of food a nutrition table refers to before using its numbers.", "src": "W|How much fat is there in 200 g of milk?"}, {"id": "y8c07-w002", "type": "mcq", "topic": "7.1", "source": "opus", "q": "Marcus says brazil nuts contain more calcium than all the other nutrients put together. Sofia says they contain more fat than all the other nutrients put together. Who is right?", "options": ["Marcus, because nuts are a very good source of calcium.", "Sofia, because brazil nuts contain more fat than all the other nutrients put together.", "Both of them, because the two statements can both be true.", "Neither of them, because protein is the largest part of a brazil nut."], "answer": 1, "explain": "Reading the row across the table shows that the fat figure is larger than all the other figures added together.", "src": "W|Who is right – Marcus or Sofia?"}, {"id": "y8c07-w006", "type": "mcq", "topic": "7.2", "source": "opus", "q": "Which two nutrients provide most of the energy for the cells in the body?", "options": ["Carbohydrates and fats provide most of the energy.", "Vitamins and minerals provide most of the energy.", "Fibre and water provide most of the energy.", "Protein and vitamins provide most of the energy."], "answer": 0, "explain": "Protein can be used for energy, but its main job is growth and repair.", "src": "W|Which two nutrients provide most of the energy for the cells in"}, {"id": "y8c07-w011", "type": "mcq", "topic": "7.3", "source": "opus", "q": "On the bar chart, what do the bars actually show?", "options": ["The total number of people who died from each disease.", "The deaths caused by smoking, as a percentage of all deaths from that disease.", "The number of people who smoke in that country.", "The percentage of people who recovered from each disease."], "answer": 1, "explain": "Reading the axis carefully matters: a large percentage does not have to mean a large number of deaths.", "src": "W|The bars show the deaths caused by smoking cigarettes, as a percentage of all deaths from that disease."}, {"id": "y8c07-w028", "type": "fill", "topic": "7.1", "source": "opus", "q": "The nutrient that is needed for growth and for repairing the body is ____.", "answer": ["protein"], "explain": "Meat, fish, eggs, beans and nuts are all good sources of protein.", "src": "W|Draw one line from each nutrient to its function."}, {"id": "y8c07-w030", "type": "fill", "topic": "7.2", "source": "opus", "q": "The bar chart shows the ____ daily energy needs of six different groups of people.", "answer": ["mean", "average"], "explain": "A mean covers a whole group, so an individual person's needs can be higher or lower.", "src": "W|The bar chart shows the mean energy needs of six different groups of people."}, {"id": "y8c07-w032", "type": "fill", "topic": "7.3", "source": "opus", "q": "The bars on the chart show the deaths caused by smoking as a ____ of all deaths from that disease.", "answer": ["percentage", "per cent", "percent"], "explain": "Percentages let you compare diseases fairly even when the total number of deaths is very different.", "src": "W|The bars show the deaths caused by smoking cigarettes, as a percentage of all deaths from that disease."}, {"id": "y8c07-w034", "type": "fill", "topic": "7.4", "source": "opus", "q": "The knee is an example of a ____ joint, which allows movement in one direction only.", "answer": ["hinge"], "explain": "The elbow is another hinge joint; the hip and shoulder are ball-and-socket joints.", "src": "W|What kind of joint is the knee joint?"}, {"id": "qwen-01-01", "type": "mcq", "topic": "7.1", "source": "qwen", "q": "What is the main job of protein in the body?", "explain": "Protein is important for making new cells in the body and to help it grow or repair itself.", "src": "L|Protein is important for making new cells in the body.", "options": ["To give you energy for respiration", "To make new cells and repair damage", "To help your eyes see in the dark", "To keep your blood vessels healthy"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "7.1", "source": "qwen", "q": "Starch is broken down by the body to make a sugar called ____.", "explain": "After eating starch, the body breaks it down to make glucose.", "src": "L|the body breaks it down to make a sugar called glucose", "answer": ["glucose"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "7.1", "source": "qwen", "q": "Which of these is true about fats and oils?", "explain": "Fats are solid at normal temperatures and oils are liquid.", "src": "L|fats are solid at normal temperatures and oils are liquid", "options": ["Fats are liquid at normal temperatures", "Oils are solid at normal temperatures", "Fats are solid and oils are liquid at normal temperatures", "Both fats and oils are gases"], "answer": 2}, {"id": "qwen-02-01", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "What is the main reason fibre is not considered a nutrient?", "explain": "Fibre is not a nutrient because you cannot digest it, so it does not go into the blood or cells.", "src": "L|This is because, when you eat it, you cannot digest it.", "options": ["It does not provide energy", "You cannot digest it", "It is only found in meat", "It is made of protein"], "answer": 1}, {"id": "qwen-02-02", "type": "fill", "topic": "7.2", "source": "qwen", "q": "Fibre is mostly made of a substance called ____.", "explain": "Fibre is mostly cellulose.", "src": "L|Fibre is mostly cellulose.", "answer": ["cellulose"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "Which food group should make up the largest proportion of your diet according to the triangle?", "explain": "The triangle where the biggest area is for rice, bread, pasta and whole grains.", "src": "L|Plenty of rice, bread, pasta – preferably whole grain – for starch and ﬁbre.", "options": ["Sweets and fried foods", "Meat, fish, eggs or dairy", "Rice, bread, pasta and whole grains", "Fresh fruit and vegetables"], "answer": 2}, {"id": "qwen-03-02", "type": "fill", "topic": "7.3", "source": "qwen", "q": "The tiny ball of cells formed after a single cell divides and grows is called an ____.", "explain": "The process where cells produce a little ball of cells called an embryo.", "src": "L|They produce a little ball of cells called an embryo", "answer": ["embryo"]}, {"id": "qwen-04-01", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "What is the name of the skeleton found on the outside of an insect's body?", "explain": "Insects and other arthropods have a skeleton on the outside of their body called an exoskeleton.", "src": "L|Insects and other arthropods have a skeleton on the outside of their body. This is called an exoskeleton.", "options": ["Endoskeleton", "Exoskeleton", "Cartilage frame", "Bone shell"], "answer": 1}, {"id": "qwen-04-02", "type": "fill", "topic": "7.4", "source": "qwen", "q": "Bones are hard and strong because they contain a lot of ____.", "explain": "Bones contain a lot of calcium, which helps them stay hard and strong.", "src": "L|Bones are hard and strong. They contain a lot of calcium.", "answer": ["calcium"]}, {"id": "qwen-04-03", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "What is the name for the place where two bones meet in the skeleton?", "explain": "Movement in the skeleton happens where two bones meet, and these places are called joints.", "src": "L|Movement in the skeleton can only take place where two bones meet one another. These places are called joints.", "options": ["A joint", "A tendon", "A ligament", "A muscle"], "answer": 0}, {"id": "qwen-05-01", "type": "mcq", "topic": "7.3", "source": "qwen", "q": "Which space agency hopes to send people to Mars by the 2030s?", "explain": "The National Aeronautics and Space Administration, NASA, is hoping to send people to Mars by the 2030s.", "src": "L|The National Aeronautics and Space Administration, NASA", "options": ["NASA", "ESA", "CERN", "WHO"], "answer": 0}, {"id": "qwen-05-03", "type": "mcq", "topic": "7.3", "source": "qwen", "q": "What happens to the bones and muscles of astronauts when they are in space for a long time?", "explain": "The bones and muscles of astronauts get smaller and weaker when they are in space for a long time.", "src": "L|bones and muscles of astronauts get smaller", "options": ["They get smaller and weaker", "They grow larger and stronger", "They stay exactly the same size", "They turn into boneless tissue"], "answer": 0}, {"id": "qwenw-01-02", "type": "fill", "topic": "7.1", "source": "qwen", "q": "Vitamin A is needed in the diet to help with ____.", "explain": "The table links vitamin A to the function of helping with night vision.", "src": "W|to help with night vision", "answer": ["night vision"]}, {"id": "qwenw-01-03", "type": "mcq", "topic": "7.1", "source": "qwen", "q": "Which nutrient is the body's long-term energy store, kept in special cells under the skin?", "explain": "Fat and oil are used in respiration to release energy and make an energy store under the skin.", "src": "W|to use in respiration to release energy, and to make an energy store under the skin", "options": ["fat and oil", "carbohydrate", "protein", "vitamin C"], "answer": 0}, {"id": "qwenw-01-06", "type": "fill", "topic": "7.2", "source": "qwen", "q": "If you eat too much food, your body turns the extra nutrients into ____ which is stored below the skin.", "explain": "If you eat too much, the body turns extra nutrients into fat stored below the skin.", "src": "W|Your body turns the extra nutrients into fat", "answer": ["fat"]}, {"id": "qwenw-01-09", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "Which of these foods contains no dietary fibre?", "explain": "The table lists chicken as having 0 grams of dietary fibre.", "src": "W|chicken|0", "options": ["chicken", "apples", "beans", "spinach"], "answer": 0}, {"id": "qwenw-02-08", "type": "fill", "topic": "7.3", "source": "qwen", "q": "Electronic cigarettes provide the smoker with ____ but are less likely to make them ill.", "explain": "E-cigarettes provide the smoker with nicotine.", "src": "W|provide the smoker with nicotine", "answer": ["nicotine"]}, {"id": "qwenw-02-10", "type": "fill", "topic": "7.3", "source": "qwen", "q": "In the China survey, ____ percent of women who had been smokers successfully gave up smoking.", "explain": "3.2% of women who had been smokers successfully gave up.", "src": "W|3.2% of women who had been smokers", "answer": ["3.2"]}, {"id": "qwenw-03-01", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "What is the name of the instrument used to measure force in newtons?", "explain": "Hooking a newton meter to the bench and pulling it.", "src": "W|He hooks a newton meter to the bench.", "options": ["Balance", "Newton meter", "Thermometer", "Ruler"], "answer": 1}, {"id": "qwenw-03-02", "type": "f
