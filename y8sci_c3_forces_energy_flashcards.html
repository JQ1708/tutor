opposite in direction", "They are equal in size and act in the same direction", "They are different in size and opposite in direction", "They are different in size and act in the same direction"], "answer": 0, "explain": "Balance needs both conditions at once: the same size, and opposite directions. Two equal forces pointing the same way would add together, not cancel.", "src": "L|This means the forces are equal in size and opposite in direction."}, {"id": "y8c03-m012", "type": "mcq", "topic": "3.1", "source": "opus", "q": "Sofia is riding her bicycle along a level road at a steady speed. Which two horizontal forces on the bicycle are balanced?", "options": ["The driving force and the force of friction", "The driving force and the weight of the bicycle", "The force of friction and the contact force", "The weight of the bicycle and the force of friction"], "answer": 0, "explain": "Because these two are balanced, there is no change in movement and Sofia carries on at the same speed.", "src": "W|The driving force on the bicycle is balanced with the force of friction on the bicycle."}, {"id": "y8c03-m013", "type": "mcq", "topic": "3.2", "source": "opus", "q": "What is the standard unit for speed used by scientists?", "options": ["Metres per second", "Kilometres per hour", "Miles per hour", "Knots"], "answer": 0, "explain": "Knots, Mach, km/h and mph are all in everyday use, but scientists agree on one standard unit so that results can be compared between countries.", "src": "L|The standard unit for speed is metres per second."}, {"id": "y8c03-m021", "type": "mcq", "topic": "3.2", "source": "opus", "q": "Which of these is the standard unit of distance in science?", "options": ["Metre", "Foot", "Mile", "Kilometre"], "answer": 0, "explain": "The kilometre is convenient for long journeys, but the metre is the standard unit that the unit of speed is built from.", "src": "W|metre foot mile kilometre"}, {"id": "y8c03-m023", "type": "mcq", "topic": "3.3", "source": "opus", "q": "On a distance-time graph, which quantities go on the axes?", "options": ["Distance travelled on the vertical axis and time on the horizontal axis", "Time on the vertical axis and distance travelled on the horizontal axis", "Speed on the vertical axis and time on the horizontal axis", "Distance travelled on both axes"], "answer": 0, "explain": "Getting the axes the right way round matters: with distance up the side, a steeper line means a faster object.", "src": "L|One way to do this is to plot distance travelled on the vertical axis and time on the horizontal axis."}, {"id": "y8c03-m033", "type": "mcq", "topic": "3.3", "source": "opus", "q": "Which of these can be worked out from a distance-time graph?", "options": ["The speed of an object", "The mass of an object", "The weight of an object", "The force on an object"], "answer": 0, "explain": "The graph carries distance and time only, and those two quantities give speed. Mass, weight and force need other measurements.", "src": "W|the force on an object the speed of an object the mass of an object the weight of an object"}, {"id": "y8c03-m034", "type": "mcq", "topic": "3.4", "source": "opus", "q": "What is the name given to an object that turns when a force is applied?", "options": ["A lever", "A pivot", "A moment", "A newton"], "answer": 0, "explain": "A door, a bicycle pedal and your own forearm are all levers; the pivot is the point they turn around.", "src": "L|The object that turns is called a lever."}, {"id": "y8c03-m043", "type": "mcq", "topic": "3.4", "source": "opus", "q": "Why does using a longer spanner make a nut easier to turn?", "options": ["The force acts further from the pivot, so the moment is greater", "The force acts closer to the pivot, so the moment is greater", "A longer spanner is heavier, so the moment is greater", "A longer spanner reduces the moment needed to turn the nut"], "answer": 0, "explain": "The nut still needs the same moment; the longer spanner lets you supply it with a smaller force.", "src": "W|b Explain why using a longer spanner will make the nut easier to turn."}, {"id": "y8c03-m044", "type": "mcq", "topic": "3.5", "source": "opus", "q": "How can you think of pressure?", "options": ["As the pushing effect of a force", "As the turning effect of a force", "As the stretching effect of a force", "As the total size of a force"], "answer": 0, "explain": "The turning effect of a force is its moment. Pressure is about how hard a force pushes on each bit of area.", "src": "L|You can think of pressure as the pushing effect of a force."}, {"id": "y8c03-m052", "type": "mcq", "topic": "3.5", "source": "opus", "q": "Why is touching the thorns on a rose stem more dangerous than touching other parts of the stem?", "options": ["A thorn has a very small area, so it exerts a very large pressure on your skin", "A thorn has a very large area, so it exerts a very large pressure on your skin", "A thorn exerts a much larger force than the rest of the stem", "A thorn has a greater weight than the rest of the stem"], "answer": 0, "explain": "Your hand supplies the same force either way; the thorn concentrates it into a tiny area, and the pressure becomes high enough to pierce skin.", "src": "W|Explain why touching the thorns is more dangerous than touching other parts of the stem."}, {"id": "y8c03-m054", "type": "mcq", "topic": "3.6", "source": "opus", "q": "Water comes out of a low hole in a dam with more force than from a higher hole. Why?", "options": ["Pressure in the water increases with depth", "Pressure in the water decreases with depth", "Pressure in the water is the same at all depths", "Water at the bottom is heavier than water at the top"], "answer": 0, "explain": "Deeper water has more liquid above it, and the weight of that liquid pushes down on the particles below.", "src": "L|This is because pressure in the water increases with depth."}, {"id": "y8c03-m067", "type": "mcq", "topic": "3.7", "source": "opus", "q": "What does diffusion mean?", "options": ["The overall random movement of particles from an area of higher concentration to an area of lower concentration", "The movement of particles from an area of lower concentration to an area of higher concentration", "The movement of all the particles in one fixed direction", "The settling of particles at the bottom of a container"], "answer": 0, "explain": "Nothing pushes the particles along - they move randomly, and there are simply more of them starting in the crowded region.", "src": "L|Diffusion means the overall random movement of particles from an area where they are in higher concentration to an area where they are in lower concentration."}, {"id": "y8c03-m077", "type": "fill", "topic": "3.1", "source": "opus", "q": "Balanced forces are equal in size and ____ in direction.", "answer": ["opposite"], "explain": "Both halves of the definition matter - equal size on its own is not balance.", "src": "L|This means the forces are equal in size and opposite in direction."}, {"id": "y8c03-m083", "type": "fill", "topic": "3.2", "source": "opus", "q": "The standard unit for speed is metres per ____.", "answer": ["second"], "explain": "Written as m/s.", "src": "L|The standard unit for speed is metres per second."}, {"id": "y8c03-m088", "type": "fill", "topic": "3.3", "source": "opus", "q": "A graph with distance on the vertical axis and time on the horizontal axis is called a ____-time graph.", "answer": ["distance"], "explain": "The name tells you which quantity is on which axis.", "src": "L|A graph like this is called a distance–time graph."}, {"id": "y8c03-m093", "type": "fill", "topic": "3.4", "source": "opus", "q": "An object that turns when a force is applied to it is called a ____.", "answer": ["lever"], "explain": "A door, a bicycle pedal and your forearm are all levers.", "src": "L|The object that turns is called a lever."}, {"id": "y8c03-m098", "type": "fill", "topic": "3.5", "source": "opus", "q": "You can think of pressure as the ____ effect of a force.", "answer": ["pushing"], "explain": "The turning effect of a force is its moment instead.", "src": "L|You can think of pressure as the pushing effect of a force."}, {"id": "y8c03-m102", "type": "fill", "topic": "3.6", "source": "opus", "q": "Pressure in a liquid increases with ____.", "answer": ["depth"], "explain": "There is more liquid above you, and its weight pushes down on the particles below.", "src": "L|This is because pressure in the water increases with depth."}, {"id": "y8c03-m107", "type": "fill", "topic": "3.7", "source": "opus", "q": "The movement of the particles of each gas as they spread out is called ____.", "answer": ["diffusion"], "explain": "It happens in liquids as well as in gases.", "src": "L|The movement of the particles of each gas is called diffusion."}, {"id": "y8c03-r001", "type": "short", "topic": "3.1", "source": "opus", "q": "A rock rests on the ground. Explain why it does not move towards the centre of the Earth even though gravity pulls it that way.", "answer": "Gravity does pull the rock downwards with a force equal to its weight, but that is not the only force acting on it. The ground pushes back up on the rock with a contact force that is equal in size and opposite in direction to the weight. The two forces cancel, so the forces on the rock are balanced and its motion does not change, which for a stationary rock means it stays still.", "keywords": ["gravity pulls the rock down with a force equal to its weight", "the ground pushes up with a contact force", "the two are equal in size and opposite in direction", "balanced forces mean the motion does not change"], "src": "L|The rock does not move toward the centre of the Earth because the ground is pushing up on the rock."}, {"id": "y8c03-r002", "type": "short", "topic": "3.1", "source": "opus", "q": "The wind pushes sideways on the rock but the rock does not move sideways. Explain why.", "answer": "The wind pushes sideways on the rock, but where the rock meets the ground there is friction, and friction always acts against the direction in which something would otherwise slide. As long as the friction can match the push from the wind, the two sideways forces are equal in size and opposite in direction, so they are balanced and the rock does not move. Only a wind strong enough to exceed the maximum friction would start it sliding.", "keywords": ["the wind pushes the rock sideways", "friction acts in the opposite direction", "the two sideways forces are equal and opposite", "the rock moves only if the push exceeds the maximum friction"], "src": "L|The pushing force from the wind is balanced by friction between the rock and the ground."}, {"id": "y8c03-r003", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain how you would draw the arrows on a force diagram to show that two forces are balanced.", "answer": "The length of an arrow shows the size of the force and the direction it points shows the direction of the force. So to show two balanced forces you draw the two arrows exactly the same length, because the forces are equal in size, and pointing in opposite directions, because they oppose each other. If one arrow were drawn longer than the other, the diagram would be saying the forces are unbalanced and the object's motion is changing.", "keywords": ["arrow length shows the size of the force", "arrow direction shows the direction of the force", "balanced forces are drawn the same length", "they must point in opposite directions"], "src": "L|So, when you draw a force diagram with balanced forces, make sure the arrows are the same length and point in opposite directions."}, {"id": "y8c03-r004", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain what happens to the rock when a vehicle pushes it with a force larger than friction.", "answer": "While the push is smaller than the maximum friction, the sideways forces balance and nothing happens. Once the vehicle pushes harder than friction can resist, the forces are no longer balanced and there is an overall force acting in the direction of the push. An unbalanced force changes motion, so the rock starts to move that way, and it will keep speeding up for as long as the push stays larger than the friction.", "keywords": ["a push smaller than friction leaves the forces balanced", "a larger push makes them unbalanced", "an unbalanced force changes the motion", "the rock accelerates in the direction of the larger force"], "src": "L|The forces are no longer balanced and the rock will start to move."}, {"id": "y8c03-r005", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain how a parachute slows a falling object down.", "answer": "A parachute has a very large area, so as it falls it has to push a great deal of air out of the way, which produces a large force of air resistance acting upwards. Once that air resistance is larger than the weight of the object, the forces are unbalanced with the overall force acting upwards, and an unbalanced force upwards on something moving downwards slows it down. As it slows, air resistance falls until the forces balance again at a safe steady speed.", "keywords": ["the large area produces a big force of air resistance", "air resistance acts upwards, against the motion", "when it exceeds the weight the overall force acts upwards", "an upward force on a falling object slows it down"], "src": "L|When an object is falling quickly, the parachute causes a force of air resistance that is larger than the weight of the object."}, {"id": "y8c03-r006", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why the hitting force from the racket must be larger than the force from the ball if the ball is to go back the other way.", "answer": "The ball arrives moving towards the racket, so to send it back the other way its direction of motion has to be reversed, and only an unbalanced force can change the direction of a moving object. The ball pushes on the racket and the racket pushes on the ball, so the overall force will only act away from the racket if the hitting force is the larger of the two. If the two forces were equal, the ball would simply stop.", "keywords": ["changing direction needs an unbalanced force", "the ball pushes on the racket and the racket on the ball", "the overall force must act away from the racket", "so the hitting force has to be the larger one"], "src": "L|To make the ball go back in the opposite direction, the hitting force must be larger than the force from the ball."}, {"id": "y8c03-r007", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why a constant unbalanced force is needed to keep a planet moving in a circle.", "answer": "Moving in a circle means the direction of motion is changing at every instant, even if the speed never changes. A change of direction is a change of motion, and any change of motion needs an unbalanced force, so a force must act on the planet all the time it is going round. That force is the gravitational pull of the Sun, which acts towards the Sun and so continually turns the planet's path into a circle.", "keywords": ["moving in a circle means the direction is always changing", "a change of direction is a change of motion", "any change of motion needs an unbalanced force", "the Sun's gravity supplies that force continuously"], "src": "L|A constant unbalanced force is needed to keep an object moving in a circle."}, {"id": "y8c03-r008", "type": "short", "topic": "3.1", "source": "opus", "q": "In a tug of war, suggest two changes that could make the rope move towards team B.", "answer": "The rope moves towards whichever team pulls with the larger force, so team B needs the forces to become unbalanced in its direction. Team B could pull harder, for example by adding more people to the team or by getting better grip with their shoes, so their total force rises above team A's. Alternatively team A could pull with a smaller force, for instance if someone let go. Either change makes the overall force act towards B.", "keywords": ["the rope moves towards the larger force", "team B can add people or improve grip to pull harder", "or team A's force can become smaller", "either way the forces become unbalanced towards B"], "src": "L|Give two changes that could make the rope move towards team B."}, {"id": "y8c03-r009", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain why scientists use standard units of measurement in all countries.", "answer": "Speed is measured in many different units in different countries and different jobs: knots at sea, Mach in aircraft, kilometres per hour in some countries and miles per hour in others. A result given in one of these means nothing to someone who works in another, and converting between them is an extra chance to make a mistake. Agreeing one standard unit, metres per second, lets scientists anywhere compare and combine results directly.", "keywords": ["different countries and jobs use different units", "knots, Mach, kilometres per hour and miles per hour all measure speed", "a result in one unit means little to someone using another", "a standard unit lets results be compared directly"], "src": "L|So, to avoid confusion, scientists use standard units for measurement in all countries."}, {"id": "y8c03-r010", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain what it means to say that a horse runs at a speed of 15 metres per second.", "answer": "Speed is a distance divided by a time, so the unit itself tells you what the number means: metres per second means metres travelled in each second. A speed of 15 metres per second therefore means the horse covers 15 metres in every second it runs. It does not mean the horse ran for 15 seconds or covered 15 metres in total, and if the speed is an average the horse may have been faster at some moments and slower at others.", "keywords": ["speed is a distance divided by a time", "metres per second means metres travelled each second", "so the horse covers 15 metres in every second", "as an average it may have been faster or slower at moments"], "src": "L|For example, a horse running with a speed of 15 metres per second means the horse travels a distance of 15 metres in each second."}, {"id": "y8c03-r011", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain why the term 'average speed' is often used rather than just 'speed'.", "answer": "Dividing the total distance by the total time gives one number for the whole journey, but a real journey is rarely made at one unchanging speed: a car stops at lights, slows for corners and speeds up again. The number calculated is therefore the average over the whole journey, not the speed at any particular moment, and the speedometer reading at any instant may be well above or below it. Saying average speed makes that limitation clear.", "keywords": ["total distance divided by total time gives one number", "a real journey is not made at one unchanging speed", "so the value is an average over the whole journey", "the speed at any moment can be higher or lower"], "src": "L|Note: the term average speed is sometimes used because the speed of an object during a journey is not always constant."}, {"id": "y8c03-r012", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain how you would find the time taken for a journey if you know the speed and the distance.", "answer": "Speed is distance travelled divided by time taken, so the three quantities are linked by one equation and knowing any two gives the third. Rearranging it to make time the subject gives time taken equals distance travelled divided by speed. The units have to match before dividing: a distance in metres with a speed in metres per second gives a time in seconds, while kilometres with kilometres per hour gives hours.", "keywords": ["speed equals distance divided by time", "knowing any two gives the third", "time taken equals distance divided by speed", "the units must match before dividing"], "src": "L|the time taken, if you know the speed and the distance travelled."}, {"id": "y8c03-r013", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why a distance–time graph is more useful than a description in words for showing a journey.", "answer": "A description in words gives only the points the writer chose to mention. A distance-time graph shows the whole journey at once, so you can read off the distance at any time or the time at any distance, including moments nobody described. You can also get values that were never stated, such as the speed on any section from the steepness of the line, and see at a glance where the object stopped or turned back.", "keywords": ["words give only the points the writer chose to mention", "a graph shows the whole journey at once", "any distance or time can be read off it", "the steepness gives speeds that were never stated"], "src": "L|Graphs are more useful than words for describing movement because:"}, {"id": "y8c03-r014", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why constant speed appears on a distance–time graph as a straight, upward sloping line.", "answer": "At constant speed the object covers the same distance in every second, so the distance from the start increases by equal amounts in equal intervals of time. Plotting equal rises against equal steps along the time axis produces points that lie on a straight line, and because the distance keeps growing the line slopes upwards. The steepness of that line stays the same all the way along, which is what constant speed looks like on a graph.", "keywords": ["constant speed means equal distances in equal times", "the distance rises by equal amounts in equal intervals", "these points lie on a straight line", "the steepness stays the same all the way along"], "src": "L|When moving at constant speed, the car travels the same distance in each second."}, {"id": "y8c03-r015", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why a stationary object gives a horizontal line on a distance–time graph.", "answer": "Time keeps passing whatever the object does, so the graph always moves to the right. But while the object is stationary its distance from the start does not change, so there is nothing to make the line rise. The result is a line that goes straight across the page, and the longer the flat section the longer the object stayed still. A stationary object never gives a vertical line, since no time would pass.", "keywords": ["time passes whether or not the object moves", "the distance from the start does not change", "so the line goes across without rising", "the length of the flat section shows how long it stayed still"], "src": "L|The distance of the car from the start position does not change when the object is stationary, but time still passes."}, {"id": "y8c03-r016", "type": "short", "topic": "3.3", "source": "opus", "q": "Two straight sloping lines on the same distance–time graph have different steepness. Explain what that tells you.", "answer": "The steepness of a line on a distance-time graph is the distance covered divided by the time taken, which is the speed. A steeper line therefore means a greater distance was covered in each second, so it shows the faster journey, while the shallower line shows the slower one. Because both lines are straight, each journey was made at a constant speed; the two speeds are simply different.", "keywords": ["steepness is distance divided by time, which is speed", "a steeper line means more distance covered each second", "so the steeper line is the faster journey", "both lines being straight means both speeds were constant"], "src": "L|So, the distance–time graph show this as a steeper straight, upward sloping line."}, {"id": "y8c03-r017", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why the return journey appears as a downward sloping line.", "answer": "The vertical axis shows the distance of the object from its starting point, not the total distance it has travelled. On the way back the object is getting closer to where it began, so that distance gets smaller while time still moves forward, and the line slopes downwards. It reaches the time axis at the moment the object arrives back at the start, and a steeper downward slope means a faster return journey.", "keywords": ["the axis shows distance from the starting point", "on the return that distance gets smaller", "time still moves forward, so the line slopes down", "it meets the time axis when the object is back at the start"], "src": "L|The distance–time graph shows this as a straight, downward sloping line."}, {"id": "y8c03-r018", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why the moment of a force depends on the distance from the pivot as well as the size of the force.", "answer": "A moment is the turning effect of a force, and it is calculated as the force multiplied by the distance from the pivot. That means the same force produces a bigger turning effect the further from the pivot it acts, and a force applied at the pivot itself produces no turning effect at all. Both quantities matter because a small force far out can turn something that a large force close in cannot.", "keywords": ["a moment is the turning effect of a force", "moment equals force times distance from the pivot", "the same force further out gives a greater moment", "a force at the pivot has no turning effect"], "src": "L|the distance between the position where the force acts and the pivot (the greater the distance, the greater the moment)."}, {"id": "y8c03-r019", "type": "short", "topic": "3.4", "source": "opus", "q": "Arun cannot turn a nut with his maximum force. Explain why a longer spanner lets him turn it.", "answer": "The nut turns when the moment applied to it is large enough, and the moment is the force multiplied by the distance from the pivot. Arun cannot increase his force any further, but with a longer spanner his hands are further from the nut, so the same force acts at a greater distance and produces a bigger moment. Once that moment is large enough to overcome the friction holding the nut, the nut turns.", "keywords": ["a nut turns when the moment is large enough", "moment equals force times distance from the pivot", "a longer spanner puts the same force further out", "the bigger moment overcomes the friction holding the nut"], "src": "L|Explain why Arun can make the nut turn if he uses a longer spanner."}, {"id": "y8c03-r020", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain the condition for a seesaw to be balanced.", "answer": "Each person on a seesaw produces a moment about the pivot equal to their weight multiplied by their distance from it, and the two moments act in opposite turning directions. The seesaw balances when those two moments are equal in size, so that neither turning effect wins. This is why a lighter person can balance a heavier one simply by sitting further from the pivot: a smaller force over a longer distance gives the same moment.", "keywords": ["each person's moment is weight times distance from the pivot", "the two moments act in opposite turning directions", "the seesaw balances when the moments are equal", "a lighter person balances a heavier one by sitting further out"], "src": "L|A seesaw will be balanced when the moments on both sides of the pivot are equal and opposite."}, {"id": "y8c03-r021", "type": "short", "topic": "3.4", "source": "opus", "q": "Marcus weighs 600 N and sits 2 m from the pivot. Explain how to find where Arun, who weighs 800 N, must sit to balance the seesaw.", "answer": "First find the moment Marcus produces: 600 N multiplied by 2 m gives 1200 N m. For the seesaw to balance, Arun must produce the same moment of 1200 N m on the other side. Since moment equals force multiplied by distance, his distance is the moment divided by his weight, that is 1200 divided by 800, which gives 1.5 m from the pivot. He sits closer than Marcus because he is heavier.", "keywords": ["Marcus produces 600 times 2, that is 1200 N m", "Arun must produce the same moment to balance", "distance equals moment divided by force", "1200 divided by 800 gives 1.5 m from the pivot"], "src": "L|Answer Marcus will exert a moment of 600 × 2 = 1200Nm For the seesaw to be balanced, the moment on the other side must also be 1200Nm."}, {"id": "y8c03-r022", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why a sharp knife cuts more easily than a blunt one, using the idea of pressure.", "answer": "Pressure is the force divided by the area it acts on, so for a given force the pressure rises as the area falls. A sharp knife has a very thin edge, so its surface in contact with the material is tiny, and the same push from your hand is concentrated into that small area, giving a very high pressure that pushes the material apart. A blunt knife spreads the same force over a much larger area, so the pressure is too low to cut.", "keywords": ["pressure is force divided by area", "a sharp edge has a very small contact area", "the same force concentrated there gives a high pressure", "a blunt edge spreads the force, so the pressure is low"], "src": "L|use a sharper knife (a sharp knife has less surface area in contact with the clay); as the area decreases, the pressure increases."}, {"id": "y8c03-r023", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why some objects are designed with large areas and others with very small areas.", "answer": "Since pressure is force divided by area, the area is what a designer can change once the force is fixed. When the aim is to avoid damage or sinking, a large area is used so the force is spread out and the pressure is small, as in tractor tyres or the wide feet of a camel. When the aim is to cut, pierce or grip, a small area is used so the same force gives a very high pressure, as in a needle or a nail.", "keywords": ["pressure is force divided by area, so area is the design choice", "a large area spreads the force and lowers the pressure", "a small area concentrates it and raises the pressure", "the choice depends on whether the object must avoid damage or pierce"], "src": "L|Some things have large areas to decrease pressure; others have small areas to increase pressure."}, {"id": "y8c03-r024", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain what shape of sole gives shoes that will not sink into snow.", "answer": "A person sinks into snow when the pressure they exert is high enough to push the snow apart. Their weight cannot be changed, so the only way to lower the pressure is to increase the area in contact with the snow. A wide, flat sole, or a snowshoe, spreads the same weight over a much larger area, so the pressure on any part of the snow is small enough that the surface holds and the wearer stays on top.", "keywords": ["sinking happens when the pressure is high enough to push the snow apart", "the weight cannot be changed", "a wide sole spreads that weight over a larger area", "the lower pressure lets the snow surface hold"], "src": "L|i the shoes that will be best for not sinking in snow [1]"}, {"id": "y8c03-r025", "type": "short", "topic": "3.5", "source": "opus", "q": "The point of a nail has an area of 1.5 mm2 and needs a pressure of 50 N/mm2 to enter wood. Explain how to find the force the hammer must supply.", "answer": "Pressure is force divided by area, so rearranging the equation to make force the subject gives force equals pressure multiplied by area. Putting in the numbers, the force is 50 N/mm2 multiplied by 1.5 mm2, which gives 75 N. The units work because the mm2 in the area cancels the mm2 in the pressure, leaving newtons, and this is also why the area of the point must be in the same unit as the pressure.", "keywords": ["pressure equals force divided by area", "rearranged, force equals pressure times area", "50 times 1.5 gives 75 N", "the units must match so that mm squared cancels"], "src": "L|The area of the point at the end of the nail is 1.5mm2."}, {"id": "y8c03-r026", "type": "short", "topic": "3.6", "source": "opus", "q": "Water escapes faster from a low hole in a dam than from a high one. Explain why.", "answer": "The pressure in a liquid increases with depth, because the deeper you go the more water there is above pushing down. The hole near the bottom of the dam is therefore under much greater pressure than the one near the top, and it is that pressure that pushes the water out through the hole. The greater the pressure, the faster the water is forced out, which is why dams are built much thicker at the base.", "keywords": ["pressure in a liquid increases with depth", "a lower hole has more water above it", "so the water there is under greater pressure", "greater pressure forces the water out faster"], "src": "L|This is because pressure in the water increases with depth."}, {"id": "y8c03-r027", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain, in terms of particles, why the pressure in a liquid increases with depth.", "answer": "Every particle in a liquid is pulled down by gravity, so it has weight. The deeper you go, the more liquid there is above that point, so the weight pressing down from above is greater. That weight pushes the particles at that depth together more forcefully, so they push harder on anything they touch, including the walls of the container and any object placed there, and that push is what we measure as pressure.", "keywords": ["every particle in a liquid has weight because of gravity", "deeper down there is more liquid above", "the greater weight above pushes those particles harder", "so they push harder on whatever they touch"], "src": "L|The weight of this liquid, caused by gravity, pushes on the particles of the liquid."}, {"id": "y8c03-r028", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why the pressure at one depth in a liquid is the same in every direction.", "answer": "The particles in a liquid are moving continuously and their directions are random, so at any moment as many are moving upwards or sideways as downwards. Pressure comes from those particles colliding with a surface, and since their motion has no preferred direction, a surface placed at that depth is struck equally hard whichever way it faces. That is why the pressure at a given depth is the same in every direction.", "keywords": ["liquid particles move continuously in random directions", "pressure comes from particles colliding with a surface", "their motion has no preferred direction", "so a surface is struck equally hard whichever way it faces"], "src": "L|As the particles in a liquid are moving randomly in all directions, then the pressure in the liquid is equal in all directions."}, {"id": "y8c03-r029", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain, in terms of particles, why blowing more air into a balloon increases the pressure inside it.", "answer": "Gas pressure is caused by particles colliding with the walls of the container, and each collision exerts a small force. Blowing more air in puts more particles inside the same balloon, so there are more particles available to hit the walls and the number of collisions each second rises. More collisions each second means a greater total force on each area of the wall, and that is what an increase in pressure is.", "keywords": ["gas pressure comes from particles colliding with the walls", "each collision exerts a small force", "more particles means more collisions each second", "more collisions per second means a greater pressure"], "src": "L|Every time a gas particle collides with the wall of the container, the particle exerts a small force on the wall."}, {"id": "y8c03-r030", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why a metal container is crushed when the air is pumped out of it.", "answer": "Normally the air inside the container pushes outwards just as hard as the atmosphere pushes inwards, so the two pressures balance and the walls stay put. Pumping the air out leaves almost no particles inside, so there are almost no collisions on the inner surface and the pressure inside falls close to zero. The atmospheric pressure outside has not changed, so it is now unbalanced and pushes the walls inwards until the container collapses.", "keywords": ["normally the pressures inside and outside balance", "removing the air leaves almost no collisions inside", "the inside pressure falls close to zero", "the unchanged atmospheric pressure outside crushes it"], "src": "L|The container is crushed by the pressure of the air outside the container."}, {"id": "y8c03-r031", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why the pressure inside a football is higher on a hot day than on a cold day.", "answer": "Raising the temperature gives the gas particles inside the ball more energy, so they move faster. Faster particles hit the inside surface harder and they also reach it more often, so both the force of each collision and the number of collisions each second increase. Since pressure is the total force on each unit of area, the pressure inside rises, even though not a single extra particle has been put into the ball.", "keywords": ["a higher temperature makes the gas particles move faster", "faster particles hit the surface harder", "they also collide more often", "so the pressure rises with no extra particles added"], "src": "L|When particles are travelling faster, their collisions exert more force."}, {"id": "y8c03-r032", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why atmospheric pressure decreases as you climb higher.", "answer": "Atmospheric pressure at any point is caused by the air above that point: its weight presses down and its particles collide with everything there. The higher you climb, the less air is left above you to press down, and the air itself is thinner, with fewer particles in each cubic metre to make those collisions. Both effects work the same way, so the pressure falls steadily with height and is very low at the top of a mountain.", "keywords": ["atmospheric pressure is caused by the air above", "higher up there is less air above to press down", "the air is also thinner, with fewer particles per cubic metre", "fewer collisions and less weight both lower the pressure"], "src": "L|the number of particles in of air decreases, so the concentration of gas particles decreases"}, {"id": "y8c03-r033", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain what is meant by diffusion.", "answer": "Diffusion is the overall movement of particles from a region where they are at a higher concentration to a region where they are at a lower concentration. It happens because the particles are already moving about randomly: no particle is aimed anywhere, but where they are crowded together more of them happen to wander outwards than inwards, so over time the substance spreads out until it is evenly mixed.", "keywords": ["diffusion is the overall movement from high to low concentration", "the particles are already moving randomly", "more wander out of a crowded region than into it", "so the substance spreads until evenly mixed"], "src": "L|Diffusion means the overall random movement of particles from an area where they are in higher concentration to an area where they are in lower concentration."}, {"id": "y8c03-r034", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why the movement of particles does not stop when diffusion stops.", "answer": "Diffusion is defined by the overall movement of particles, not by whether they move at all. When the concentrations become equal, just as many particles move each way across any boundary, so there is no longer an overall movement in one direction and diffusion is said to have stopped. The individual particles are still moving about randomly exactly as before, which is why a drop of ink never gathers itself back together.", "keywords": ["diffusion means the overall movement, not all movement", "when concentrations are equal, as many move each way", "so there is no overall movement in one direction", "the individual particles still move randomly"], "src": "L|However, the movement of individual particles does not stop when diﬀusion stops."}, {"id": "y8c03-r035", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why a smell gets stronger as you walk towards the food.", "answer": "The gas particles responsible for the smell start at the food and spread out from there by diffusion, so they are most crowded near the source and thinner the further away you are. As you walk towards the food you are moving into regions of higher concentration, so more of those particles enter your nose in each breath, and the more that reach the nose the stronger the smell seems.", "keywords": ["the smell particles spread out from the food", "they are most concentrated near the source", "walking closer means moving into a higher concentration", "so more particles reach your nose and the smell is stronger"], "src": "L|This is because the concentration of the particles is higher, the closer you get to the source of the particles."}, {"id": "y8c03-r036", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why tea diffuses faster in hot water than in cold water.", "answer": "Diffusion happens because the particles are moving, so anything that makes them move faster makes diffusion faster. Raising the temperature gives both the water particles and the tea particles more energy, so they move more quickly and travel further in each second, and the collisions that knock particles about happen more often. The tea therefore spreads through the whole cup in far less time than it would in cold water.", "keywords": ["diffusion depends on the particles moving", "a higher temperature gives them more energy", "so they move faster and travel further each second", "the tea spreads through the cup in less time"], "src": "L|Higher temperature makes particles move faster, so the particles can spread out faster."}, {"id": "y8c03-r037", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain how the difference in concentration affects how fast diffusion happens.", "answer": "The overall movement in diffusion happens because more particles wander out of the crowded region than wander back into it. The bigger the difference between the two concentrations, the more lopsided that traffic is, so the faster the overall movement and the faster diffusion happens. As the substance spreads, the difference in concentration shrinks, which is why diffusion slows down as it goes on and finally stops when the concentrations are equal.", "keywords": ["overall movement happens because more particles leave the crowded region", "a bigger concentration difference makes that traffic more lopsided", "so a bigger difference means faster diffusion", "diffusion slows as the difference shrinks"], "src": "L|The bigger the difference in the concentrations of the particles, the faster the diffusion."}, {"id": "y8c03-r038", "type": "short", "topic": "3.7", "source": "opus", "q": "Arun says that when the orange colour has stopped spreading, the particles in the liquid have stopped moving. Explain whether he is correct.", "answer": "Arun is not correct. The colour stops spreading because the orange particles have become evenly distributed, so the concentration is the same everywhere and there is no longer any overall movement in one direction. The particles themselves never stop: they go on moving randomly all the time, and just as many cross any boundary one way as the other, which is why the colour stays evenly spread instead of separating out again.", "keywords": ["the colour stops spreading because the concentration is now equal", "there is no longer an overall movement in one direction", "the particles go on moving randomly all the time", "equal movement each way keeps the colour evenly spread"], "src": "L|b Arun says: ‘When the orange colour has stopped spreading, the particles in the liquid have stopped moving.’ Explain whether Arun is correct."}, {"id": "y8c03-r039", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why equal volumes of water were used in all the beakers in the diffusion experiment.", "answer": "The volume of water is a control variable. The ink has to spread through the whole beaker, so with more water it has further to go and would take longer even at the same temperature. If the volumes were different, a longer time could have been caused by the lower temperature or by the larger volume, and there would be no way to tell which, so the conclusion about temperature would not be supported.", "keywords": ["the volume of water is a control variable", "more water means the ink has further to spread", "a difference in time could then have two possible causes", "so the conclusion about temperature would not be supported"], "src": "L|3 Explain why you used equal volumes of water in all the beakers."}, {"id": "y8c03-r040", "type": "short", "topic": "3.7", "source": "opus", "q": "Suggest two improvements to the ink diffusion method that would give better results.", "answer": "Add the same volume of ink each time and in the same way, for example one drop from the same dropper held at the same height, so that the starting amount and the disturbance are the same. Repeat each temperature at least three times and take a mean, so that random differences partly cancel. It also helps to agree in advance a clear rule for deciding when the ink counts as fully spread, so the judgement is the same every time.", "keywords": ["add the same volume of ink in the same way each time", "repeat each temperature and take a mean", "this lets random differences cancel out", "agree a clear rule for when the ink counts as fully spread"], "src": "L|4 Suggest at least two improvements to the method that would give better results."}, {"id": "y8c03-r041", "type": "short", "topic": "3.2", "source": "opus", "q": "One rod is the length of the left feet of 16 people chosen at random. Explain one disadvantage of the rod as a unit of length.", "answer": "A unit has to mean the same thing to everyone who uses it. People's feet are all different lengths, so a rod made from the left feet of sixteen people depends entirely on which sixteen people were chosen: a different group in a different town would produce a rod of a different length. Two people using rods made this way would get different answers for the same object, so measurements could not be compared or checked.", "keywords": ["a unit must mean the same thing to everyone", "people's feet are different lengths", "a different group of sixteen gives a different rod", "so measurements could not be compared or checked"], "src": "L|a Explain one disadvantage with the rod as a unit of length."}, {"id": "y8c03-r2001", "type": "short", "topic": "3.1", "source": "opus", "q": "A bicycle's driving force is balanced with the force of friction. Explain what this tells you about its motion.", "answer": "Balanced forces do not change motion, so the bicycle is not speeding up or slowing down. It is either stationary or travelling at a constant speed in a straight line, and the rider must keep pedalling simply to keep the driving force equal to friction.", "keywords": ["balanced", "no change in motion", "constant speed", "straight line"], "src": "W|The driving force on the bicycle is balanced with the force of friction on the bicycle."}, {"id": "y8c03-r2002", "type": "short", "topic": "3.1", "source": "opus", "q": "Describe the effect on a bird's movement of the four forces acting on it while flying.", "answer": "If the upward force from the wings balances the bird's weight it stays at the same height, and if the forward force balances air resistance it flies at a constant speed. The bird only rises, falls, speeds up or slows down when one of these pairs becomes unbalanced.", "keywords": ["upward balances weight", "same height", "forward balances air resistance", "constant speed", "unbalanced"], "src": "W|a Describe the effect of these forces on the movement of the bird."}, {"id": "y8c03-r2003", "type": "short", "topic": "3.1", "source": "opus", "q": "Describe two changes to the forces that would make a flying bird go slower.", "answer": "Either reduce the forward force produced by the wings, or increase the backward air resistance, for example by spreading the wings and tail wider. Either change leaves a resultant force pointing backwards, which slows the bird down.", "keywords": ["reduce forward force", "increase air resistance", "resultant backwards", "slows down"], "src": "W|c Describe two changes to the forces that would make the bird go slower."}, {"id": "y8c03-r2004", "type": "short", "topic": "3.1", "source": "opus", "q": "A ball on a string swings in a circle. Explain the direction it moves when the string breaks.", "answer": "While the string is intact it pulls the ball towards the pole, and that unbalanced force is what keeps bending the ball's path into a circle. When the string breaks that force disappears, so with no unbalanced force the ball carries straight on in the direction it was moving at that instant.", "keywords": ["string pulls inwards", "unbalanced force", "force disappears", "straight line"], "src": "W|b Draw another arrow on the diagram to show the direction that the tennis ball will move when the string breaks."}, {"id": "y8c03-r2006", "type": "short", "topic": "3.2", "source": "opus", "q": "Arun's journey to school gives one value for speed. Explain why this is an average speed.", "answer": "He would not have travelled at exactly the same speed for the whole journey — he starts from rest, slows at corners and crossings, and speeds up in between. The single value is the total distance divided by the total time, which spreads all that variation evenly and gives an average.", "keywords": ["not constant", "slows and speeds up", "total distance", "total time", "average"], "src": "W|b Explain why your answer to part a is an average speed."}, {"id": "y8c03-r2007", "type": "short", "topic": "3.2", "source": "opus", "q": "A car must cover 50 km in 2 hours. Explain why it must go faster than the average speed for part of the journey.", "answer": "The average of 25 km/h must be made up of the whole journey, but the car starts from rest and has to stop or slow down at junctions, where its speed is below 25 km/h. To make up for that time it must travel above 25 km/h elsewhere, otherwise the total time would be longer than 2 hours.", "keywords": ["starts from rest", "slows at junctions", "below average", "must go above", "make up time"], "src": "W|b Explain why the car must go faster than your answer to part a for some parts of the journey."}, {"id": "y8c03-r2008", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain why the same speed can be written as a number of km/h or a number of m/s.", "answer": "Speed is a distance divided by a time, so its unit depends on which units of distance and time you use. Changing from kilometres and hours to metres and seconds changes the number but not the actual speed, which is why the unit must always be given with the answer.", "keywords": ["distance divided by time", "depends on the units", "number changes", "speed is the same"], "src": "W|Speed can be measured in kilometres per hour, km/h."}, {"id": "y8c03-r2009", "type": "short", "topic": "3.2", "source": "opus", "q": "A spacecraft reached 260 000 km/h. Explain how you would find how far it travels in 2 hours, and why the unit matters.", "answer": "Distance equals speed multiplied by time, so 260 000 × 2 = 520 000 km. It works directly because the speed is in kilometres per hour and the time is in hours; if the time had been in minutes it would have to be converted first, or the answer would be wrong.", "keywords": ["distance equals speed times time", "520 000 km", "units must match", "convert"], "src": "W|Calculate the distance this spacecraft would travel in 2 hours."}, {"id": "y8c03-r2010", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain which of speed, force, mass and weight can be worked out from a distance–time graph.", "answer": "Only the speed. The graph shows how far the object has travelled at each time, and the steepness of the line gives the distance covered per unit of time, which is the speed. Nothing on the graph tells you how heavy the object is or what forces act on it.", "keywords": ["speed", "steepness", "distance per time", "not mass", "not force"], "src": "W|the force on an object the speed of an object the mass of an object the weight of an object"}, {"id": "y8c03-r2011", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain what a sketch graph is and why the axes still have to be labelled.", "answer": "When sketching a graph you only label the axes with quantities; you do not need to scale them or put numbers on them. The labels are still essential because the shape of the line only means something once the reader knows which quantity each axis represents.", "keywords": ["label the quantities", "no numbers", "no scale", "shape is meaningless without labels"], "src": "W|When sketching a graph, you only label the axes with quantities."}, {"id": "y8c03-r2012", "type": "short", "topic": "3.3", "source": "opus", "q": "Sofia walks, stops at a crossing, then continues at a higher speed. Explain how each part appears on a distance–time graph.", "answer": "The first part is a straight sloping line. The stop is a horizontal line, because time passes but the distance does not change. Continuing at a higher speed gives a straight line that is steeper than the first, because more distance is covered in the same time.", "keywords": ["sloping line", "horizontal when stopped", "steeper", "more distance in the same time"], "src": "W|She continues walking at a higher speed than before."}, {"id": "y8c03-r2013", "type": "short", "topic": "3.3", "source": "opus", "q": "Marcus rides to a friend's house and back at the same constant speed. Explain why the two sloping lines on his graph differ.", "answer": "If distance is measured from the park, the outward line slopes upward as the distance from the park increases and the return line slopes downward as it decreases. Both have the same steepness, because he travels at the same constant speed, but in opposite directions.", "keywords": ["upward", "downward", "same steepness", "same speed", "opposite direction"], "src": "W|Marcus rides his bicycle at the same constant speed back again from his friend’s house to the park."}, {"id": "y8c03-r2014", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why a longer spanner makes a tight nut easier to turn.", "answer": "The moment of a force equals the force multiplied by the distance from the pivot. A longer spanner increases that distance, so the same effort from your hand produces a larger moment, and a larger moment is more likely to be enough to turn the nut.", "keywords": ["moment", "force times distance", "longer distance", "larger moment"], "src": "W|b Explain why using a longer spanner will make the nut easier to turn."}, {"id": "y8c03-r2015", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain the condition for a seesaw to balance, and why the heavier person must sit closer to the pivot.", "answer": "The seesaw balances when the moments on both sides are equal. Moment is force times distance from the pivot, so a larger weight needs a smaller distance to give the same moment as a smaller weight further out.", "keywords": ["moments equal", "force times distance", "larger weight", "smaller distance"], "src": "W|The seesaw will balance when the moments on both sides are equal."}, {"id": "y8c03-r2016", "type": "short", "topic": "3.4", "source": "opus", "q": "An engine exerts a moment of 350 Nm at a wheel of radius 0.35 m. Explain how to find the force at the rim and what the answer means.", "answer": "Force equals moment divided by distance, so 350 ÷ 0.35 = 1000 N. That is the force the wheel pushes with at its outside edge, and it shows that a small moment at the centre becomes a large force when the radius is small.", "keywords": ["moment divided by distance", "1000 N", "at the rim", "small radius gives large force"], "src": "W|The engine drives a wheel that has a radius of 0.35 m The pivot of the wheel is at the centre."}, {"id": "y8c03-r2017", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why scientists insist on standard international units when calculating moments.", "answer": "The moment equation only gives the right answer if the force is in newtons and the distance in metres, giving newton metres. If people use their own units the numbers cannot be combined or compared, and results from different places would be meaningless to each other.", "keywords": ["newtons", "metres", "newton metres", "cannot compare", "meaningless"], "src": "W|Some people use units that are not international standard units."}, {"id": "y8c03-r2018", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why touching the thorns on a rose stem is more dangerous than touching the rest of the stem.", "answer": "Pressure is force divided by area. A thorn has a very small area at its point, so even a gentle push produces a very large pressure at that point — large enough to break the skin — while the same push spread over the wide, smooth stem produces a pressure far too small to do any harm.", "keywords": ["small area", "force divided by area", "large pressure", "breaks the skin"], "src": "W|Explain why touching the thorns is more dangerous than touching other parts of the stem."}, {"id": "y8c03-r2019", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why putting a large piece of wood under a wheel stops it sinking into sand.", "answer": "The weight pressing down is unchanged, but the wood spreads that force over a much larger area of sand. Pressure is force divided by area, so a larger area gives a much smaller pressure, and the sand is no longer pushed aside.", "keywords": ["same force", "larger area", "smaller pressure", "does not sink"], "src": "W|Explain why putting a large piece of wood under the wheel can stop the wheel from sinking."}, {"id": "y8c03-r2020", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why the two ends of a drawing pin have such different shapes.", "answer": "The flat end is wide so that the pressure on your thumb is small and does not hurt, and the point is extremely narrow so that the same force produces a very large pressure on the board and pushes into it. One object uses both ends of the pressure equation at once.", "keywords": ["wide end", "small pressure", "thumb", "sharp point", "large pressure", "same force"], "src": "W|Explain the shape of each end of the drawing pin."}, {"id": "y8c03-r2021", "type": "short", "topic": "3.5", "source": "opus", "q": "Some countries measure pressure in pounds per square inch. Explain what this tells you about the unit of pressure in general.", "answer": "Pressure is always a force divided by an area, so its unit is always a unit of force divided by a unit of area — newtons per square metre in science, pounds per square inch elsewhere. The quantity is the same; only the units chosen to express it differ.", "keywords": ["force divided by area", "unit of force per unit of area", "same quantity", "different units"], "src": "W|State the unit of pressure in these other units."}, {"id": "y8c03-r2022", "type": "short", "topic": "3.6", "source": "opus", "q": "Pressure acts on a fish in deep water from three different directions. Explain what this shows.", "answer": "It shows that pressure in a liquid acts equally in all directions at a given depth, not just downwards. The water particles are moving in all directions and collide with every surface of the fish, so the fish is pushed on from above, below and the sides alike.", "keywords": ["all directions", "equally", "same depth", "particles collide", "every surface"], "src": "W|The arrows A, B and C show three directions from which pressure from the water acts on the fi sh."}, {"id": "y8c03-r2023", "type": "short", "topic": "3.6", "source": "opus", "q": "Water comes out of three holes at different heights in a bottle. Explain the conclusion that can be drawn.", "answer": "The water from the lowest hole travels furthest, showing it is pushed out hardest. Since the only difference between the holes is their depth below the surface, the conclusion is that the pressure in a liquid increases with depth.", "keywords": ["lowest travels furthest", "pushed hardest", "only depth differs", "pressure increases with depth"], "src": "W|Describe the conclusion that can be made from this observation."}, {"id": "y8c03-r2024", "type": "short", "topic": "3.6", "source": "opus", "q": "A sealed balloon is cooled. Explain what happens to the pressure inside it.", "answer": "The pressure decreases. Cooling means the air particles have less energy and move more slowly, so they hit the inside of the balloon less often and with less force, and the pressure they produce falls — which is why the balloon also shrinks.", "keywords": ["less energy", "move slower", "hit less often", "less force", "pressure falls"], "src": "W|a State what will happen to the pressure inside the balloon if the temperature decreases."}, {"id": "y8c03-r2025", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why the pressure in a car tyre rises as the tyre warms up while driving.", "answer": "The volume of the tyre barely changes, but the higher temperature gives the air particles inside more energy. They move faster and collide with the tyre wall more often and harder, so the pressure increases even though no more air has been added.", "keywords": ["higher temperature", "more energy", "faster", "more collisions", "pressure increases"], "src": "W|When the car is moving, the temperature of the tyre increases."}, {"id": "y8c03-r2027", "type": "short", "topic": "3.7", "source": "opus", "q": "Blue ink is added to the bottom of a beaker of water. Explain why all the water eventually turns blue.", "answer": "The ink and water particles are all moving randomly. Ink particles move from where there are many of them, at the bottom, to where there are fewer, spreading out through the water by diffusion until they are evenly distributed and the whole beaker looks blue.", "keywords": ["moving randomly", "many to fewer", "diffusion", "evenly spread"], "src": "W|a Explain why the water eventually all turns blue."}, {"id": "y8c03-r2028", "type": "short", "topic": "3.7", "source": "opus", "q": "Explain why the brown bromine gas looks less intense the further it is from the container.", "answer": "The bromine particles spread out from the container by diffusion. Further away there are fewer bromine particles in the same volume of air, so less brown colour is seen — the intensity is a measure of how concentrated the particles are.", "keywords": ["spread out", "fewer particles", "same volume", "less intense"], "src": "W|Explain why the colour of the brown gas becomes less intense as it gets further away from the container."}, {"id": "y8c03-r2029", "type": "short", "topic": "3.7", "source": "opus", "q": "When a green gas has spread through a bottle, explain whether the movement of particles has stopped.", "answer": "It has not. The particles are still moving randomly and still spreading in every direction — what has stopped is any overall change, because as many particles move one way as the other. Diffusion has finished, but movement has not.", "keywords": ["still moving", "randomly", "as many each way", "no overall change"], "src": "W|When the green colour fills the bottle, the movement of particles has stopped."}, {"id": "y8c03-o047", "type": "short", "topic": "3.2", "source": "opus", "q": "Give two examples of non-standard units used to measure speed.", "answer": "Knots (for ships) and Mach (for aeroplanes).", "keywords": ["knots", "Mach"], "explain": "Different industries and countries use different units of speed.", "src": "L|For example, the speed of ships is often measured in knots, whereas aeroplanes often use Mach."}, {"id": "y8c03-o048", "type": "short", "topic": "3.2", "source": "opus", "q": "Why do scientists use standard units for measurement?", "answer": "To avoid confusion, because the same units are then used in all countries.", "keywords": ["avoid confusion", "all countries"], "explain": "Standard units let scientists everywhere compare results directly.", "src": "L|So, to avoid confusion, scientists use standard units for measurement in all countries."}, {"id": "y8c03-o049", "type": "short", "topic": "3.2", "source": "opus", "q": "What is the standard unit for speed?", "answer": "Metres per second.", "keywords": ["metres per second"], "explain": "It is the standard scientific (SI) unit of speed.", "src": "L|The standard unit for speed is metres per second."}, {"id": "y8c03-o089", "type": "short", "topic": "3.3", "source": "opus", "q": "What do scientists use graphs for?", "answer": "To describe how two variables are related.", "keywords": ["two variables", "related"], "explain": "A graph shows the relationship between two measured quantities.", "src": "L|Scientists use graphs to describe how two variables are related."}, {"id": "y8c03-o090", "type": "short", "topic": "3.3", "source": "opus", "q": "Which quantity is plotted on the vertical axis of a distance–time graph?", "answer": "Distance travelled.", "keywords": ["distance"], "explain": "Distance goes up the side; time goes across the bottom.", "src": "L|One way to do this is to plot distance travelled on the vertical axis and time on the horizontal axis."}, {"id": "y8c03-o091", "type": "short", "topic": "3.3", "source": "opus", "q": "Which quantity is plotted on the horizontal axis of a distance–time graph?", "answer": "Time.", "keywords": ["time"], "explain": "Time is always the horizontal axis on this type of graph.", "src": "L|One way to do this is to plot distance travelled on the vertical axis and time on the horizontal axis."}, {"id": "y8c03-o125", "type": "short", "topic": "3.4", "source": "opus", "q": "Give an everyday example of a force causing something to turn.", "answer": "Pushing down on a door handle makes the handle turn.", "keywords": ["door handle", "turn"], "explain": "Any force applied at a distance from a pivot can make an object turn.", "src": "L|When you push down on a door handle, the handle turns."}, {"id": "y8c03-o126", "type": "short", "topic": "3.4", "source": "opus", "q": "What happens when you push down on a bicycle pedal?", "answer": "The pedal turns.", "keywords": ["pedal", "turns"], "explain": "The pedal and crank act as a lever turning about a pivot.", "src": "L|When you push down on the pedal of a bicycle, the pedal turns."}, {"id": "y8c03-o127", "type": "short", "topic": "3.4", "source": "opus", "q": "What name is given to an object that turns when a force is applied to it?", "answer": "A lever.", "keywords": ["lever"], "explain": "Levers turn about a fixed point.", "src": "L|The object that turns is called a lever."}, {"id": "y8c03-o128", "type": "short", "topic": "3.4", "source": "opus", "q": "What is a pivot?", "answer": "The point around which a lever turns.", "keywords": ["point", "lever", "turns"], "explain": "The pivot stays still while the lever turns around it.", "src": "L|The point around which the lever turns is called the pivot."}, {"id": "y8c03-o158", "type": "short", "topic": "3.5", "source": "opus", "q": "Why does a knife cut modelling clay?", "answer": "Because the force pushing down on the clay causes pressure on the clay.", "keywords": ["force", "pressure"], "explain": "The force acts on a very small area under the blade.", "src": "L|The knife works because the force used to push down on the clay causes pressure on the clay."}, {"id": "y8c03-o159", "type": "short", "topic": "3.5", "source": "opus", "q": "What can you think of pressure as?", "answer": "The pushing effect of a force.", "keywords": ["pushing effect", "force"], "explain": "Pressure describes how concentrated a push is.", "src": "L|You can think of pressure as the pushing effect of a force."}, {"id": "y8c03-o160", "type": "short", "topic": "3.5", "source": "opus", "q": "Give one way to increase the pressure when cutting with a knife.", "answer": "Increase the force pushing down on the knife.", "keywords": ["increase", "force"], "explain": "As the force increases, the pressure increases.", "src": "L|increase the force on the knife; as the force increases, the pressure increases"}, {"id": "y8c03-o161", "type": "short", "topic": "3.5", "source": "opus", "q": "Give a second way to increase the pressure when cutting with a knife.", "answer": "Use a sharper knife, because a sharp knife has a smaller surface area in contact with the clay.", "keywords": ["sharper", "smaller", "surface area"], "explain": "As the area decreases, the pressure increases.", "src": "L|use a sharper knife (a sharp knife has less surface area in contact with the clay); as the area decreases, the pressure increases."}, {"id": "y8c03-w020", "type": "mcq", "topic": "3.6", "source": "opus", "q": "What happens to the pressure in a liquid as the depth increases?", "options": ["The pressure increases as the depth increases.", "The pressure decreases as the depth increases.", "The pressure is the same at every depth.", "The pressure becomes zero at the bottom."], "answer": 0, "explain": "There is more liquid above you pressing down, so the pressure is greater deeper down.", "src": "W|State what happens to the pressure in a liquid as depth increases."}, {"id": "y8c03-w024", "type": "mcq", "topic": "3.7", "source": "opus", "q": "What is meant by diffusion?", "options": ["The spreading out of particles from where they are more crowded to where they are less crowded.", "The change of a liquid into a gas at its boiling point.", "The sinking of heavy particles to the bottom of a liquid.", "The breaking of particles into smaller pieces."], "answer": 0, "explain": "Diffusion happens because the particles in gases and liquids are always moving randomly.", "src": "W|Describe what is meant by diffusion."}, {"id": "qwen-01-01", "type": "mcq", "topic": "3.1", "source": "qwen", "q": "What is the name of the force that pulls an object toward the centre of the Earth?", "explain": "The force of gravity pulling an object toward the centre of the Earth is called its weight.", "src": "L|The force of gravity is pulling it toward the centre of the Earth. This force is called its weight.", "options": ["Weight", "Friction", "Contact force", "Air resistance"], "answer": 0}, {"id": "qwen-01-02", "type": "fill", "topic": "3.1", "source": "qwen", "q": "When the ground pushes up on a rock to stop it falling, this force is called the ____ force.", "explain": "The upward push from the ground as the contact force.", "src": "L|the ground is pushing up on the rock. This force is the contact force.", "answer": ["contact"]}, {"id": "qwen-01-10", "type": "fill", "topic": "3.2", "source": "qwen", "q": "The unit used to measure the speed of ships is called ____.", "explain": "Ship speed is often measured in knots.", "src": "L|the speed of ships is often measured in knots", "answer": ["knots"]}, {"id": "qwen-01-11", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "Which unit of speed is often used for aeroplanes?", "explain": "Aeroplanes often use Mach as a unit of speed.", "src": "L|aeroplanes often use Mach", "options": ["Mach", "Knots", "Metres per second", "Newtons"], "answer": 0}, {"id": "qwen-02-09", "type": "mcq", "topic": "3.3", "source": "qwen", "q": "On a distance-time graph, what does a horizontal straight line represent?", "explain": "A horizontal line shows the object is stationary, meaning it is not moving.", "src": "L|The distance–time graph shows a straight line that is horizontal.", "options": ["Constant speed", "Increasing speed", "Stationary or at rest", "Decreasing distance"], "answer": 2}, {"id": "qwen-02-10", "type": "fill", "topic": "3.3", "source": "qwen", "q": "A steeper upward sloping line on a distance-time graph indicates that the object is moving ____ than before.", "explain": "A steeper line means the object moves faster, travelling a greater distance each second.", "src": "L|It moves faster than when it travelled between A and B", "answer": ["faster"]}, {"id": "qwen-04-02", "type": "fill", "topic": "3.4", "source": "qwen", "q": "The object that turns when a force is applied to it is called a ____.", "explain": "The object that turns as a lever.", "src": "L|The object that turns is called a lever.", "answer": ["lever"]}, {"id": "qwen-04-07", "type": "mcq", "topic": "3.5", "source": "qwen", "q": "Why does a camel have large feet?", "explain": "Large feet apply force over a large area, decreasing pressure.", "src": "L|The pressure on the sand is decreased, so the camel will not sink in the sand", "options": ["To decrease pressure on the sand", "To increase speed while running", "To make it harder to see", "To increase the force on the ground"], "answer": 0}, {"id": "qwen-04-08", "type": "fill", "topic": "3.5", "source": "qwen", "q": "Pressure is calculated by dividing force by ____.", "explain": "Pressure is force divided by area.", "src": "L|Pressure is force divided by area", "answer": ["area"]}, {"id": "qwen-05-02", "type": "fill", "topic": "3.6", "source": "qwen", "q": "In a liquid, pressure increases as you go deeper because there is more ____ above your position.", "explain": "As you go deeper, there is more liquid above your position, and its weight pushes on the particles.", "src": "L|As you go deeper in a liquid, there is more liquid above your position.", "answer": ["liquid"]}, {"id": "qwen-05-03", "type": "mcq", "topic": "3.6", "source": "qwen", "q": "What causes pressure in a gas inside a container like a balloon?", "explain": "Particles in a gas move randomly and collide with the walls, exerting force which causes pressure.", "src": "L|Particles in a gas move randomly and collide with the walls of the container causing pressure.", "options": ["Gas particles colliding with the walls of the container", "The weight of the gas pushing down on the bottom", "The temperature of the air outside the balloon", "The elastic nature of the rubber stretching"], "answer": 0}, {"id": "qwen-06-02", "type": "fill", "topic": "3.7", "source": "qwen", "q": "Concentration is defined as the number of particles in a particular ____.", "explain": "Concentration is the number of particles in a particular volume.", "src": "L|Concentration is the number of particles in a particular volume.", "answer": ["volume"]}, {"id": "qwen-07-01", "type": "mcq", "topic": "3.4", "source": "qwen", "q": "In the earliest balances, how was the weight of an unknown object measured?", "explain": "Known weights were added on the other side until the system balanced.", "src": "L|known weights were added on the other side until the system balanced", "options": ["By adding known weights to the other side until it balanced", "By moving a single weight along a ruler", "By comparing the height of two objects", "By using a spring to stretch under the load"], "answer": 0}, {"id": "qwenw-01-03", "type": "mcq", "topic": "3.1", "source": "qwen", "q": "Which of these is a result of unbalanced forces?", "explain": "Unbalanced forces cause changes in motion, such as slowing down. Constant speed or no movement implies balanced forces.", "src": "W|A boat will slow down.", "options": ["A car moving at constant speed", "A boat slowing down", "A book not moving on a desk", "An object staying still"], "answer": 1}, {"id": "qwenw-01-05", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "What does a speed of 60 km/h mean?", "explain": "60 km/h means traveling a distance of 60 km every hour.", "src": "W|It travels a distance of 60 km every hour.", "options": ["Travels 60 m every second", "Travels 60 km every hour", "Travels 60 m every hour", "Travels 60 km every second"], "answer": 1}, {"id": "qwenw-01-08", "type": "fill", "topic": "3.3", "source": "qwen", "q": "In a distance-time graph, a line that shows no change in distance with time represents an object that is ____.", "explain": "Identify the graph showing no change in distance, which corresponds to a stationary object.", "src": "W|Which distance–time graph in part a shows no change in distance with time?", "answer": ["stationary"]}, {"id": "qwenw-02-01", "type": "mcq", "topic": "3.4", "source": "qwen", "q": "What is the name given to the turning effect of a force?", "explain": "Circle the name for the turning effect of a force from the list: minute, moment, rotate, revolve.", "src": "W|What name is given to the turning effect of a force?", "options": ["moment", "minute", "rotate", "revolve"], "answer": 0}, {"id": "qwenw-02-05", "type": "mcq", "topic": "3.6", "source": "qwen", "q": "What happens to the pressure in a liquid as depth increases?", "explain": "The exercise asks to state what happens to pressure in a liquid as depth increases.", "src": "W|State what happens to the pressure in a liquid as depth increases.", "options": ["It decreases", "It stays the same", "It increases", "It becomes zero"], "answer": 2}, {"id": "qwenw-02-10", "type": "fill", "topic": "3.5", "source": "qwen", "q": "A sharp knife is better for cutting bread than a dull one because it has a smaller ____.", "explain": "Explain why a sharp knife is better for cutting bread, implying the role of area in pressure.", "src": "W|Explain why a sharp knife is better for cutting bread than a knife that is not sharp.", "answer": ["area"]}, {"id": "qwenw-03-03", "type": "mcq", "topic": "3.7", "source": "qwen", "q": "Why does blue ink spread through water faster when the water is hotter?", "explain": "Higher temperature gives pa
