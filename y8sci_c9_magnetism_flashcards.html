<html lang="en">
<head>
<meta charset="utf-8">

<title>Chapter 9 — Magnetism — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>

posite directions between the poles means repulsion.", "src": "W|The magnetic field lines between the two poles are in opposite directions ."}, {"id": "y8c09-m031", "type": "mcq", "topic": "9.1", "source": "opus", "q": "Two poles are brought together and the field lines between them point in the same direction. What is the result?", "options": ["The two poles attract", "The two poles repel", "Nothing happens at all", "The field lines cross"], "answer": 0, "explain": "Same direction between the poles means attraction.", "src": "W|The magnetic field lines between the two poles are in the same direction ."}, {"id": "y8c09-m032", "type": "mcq", "topic": "9.2", "source": "opus", "q": "Who, according to the story, first noticed magnetic rock about 4000 years ago?", "options": ["A Greek shepherd called Magnes", "A Chinese sailor called Magnes", "A Roman soldier called Magnes", "An Egyptian farmer called Magnes"], "answer": 0, "explain": "Iron nails in his shoes stuck to one type of rock.", "src": "L|Around 4000 years ago, a Greek shepherd called Magnes was looking after his sheep."}, {"id": "y8c09-m033", "type": "mcq", "topic": "9.2", "source": "opus", "q": "What happened to the iron nails in the shepherd's shoes?", "options": ["They stuck to one particular type of rock", "They rusted away in the field", "They turned into lodestone", "They became too hot to wear"], "answer": 0, "explain": "The rock was lodestone, a naturally occurring magnet.", "src": "L|The story of Magnes says that iron nails in his shoes stuck to one particular type of rock."}, {"id": "y8c09-m059", "type": "mcq", "topic": "9.2", "source": "opus", "q": "Where does the Earth's magnetic field occur?", "options": ["All around the Earth", "Only at the poles", "Only at the equator", "Only at certain times"], "answer": 0, "explain": "The field surrounds the whole planet, like that of a bar magnet.", "src": "W|c The Earth’s magnetic field occurs all around the Earth."}, {"id": "y8c09-m061", "type": "mcq", "topic": "9.3", "source": "opus", "q": "When is a material described as magnetic?", "options": ["When it is attracted to a magnet", "When it conducts electricity", "When it is made of any metal", "When it is heated strongly"], "answer": 0, "explain": "Iron, nickel, cobalt and steel are all magnetic.", "src": "L|A material is described as magnetic if it is attracted to a magnet."}, {"id": "y8c09-m062", "type": "mcq", "topic": "9.3", "source": "opus", "q": "What is steel?", "options": ["A mixture that contains a large proportion of iron", "A pure element found in rock", "A non-magnetic metal", "A mixture of copper and zinc"], "answer": 0, "explain": "That is why steel is magnetic.", "src": "L|Steel is a mixture that contains a large proportion of iron."}, {"id": "y8c09-m088", "type": "mcq", "topic": "9.4", "source": "opus", "q": "What do the three things needed to make an electromagnet also do?", "options": ["They are the factors that will affect the strength of an electromagnet", "They decide the colour of the coil", "They decide how long the cell lasts only", "They have no effect on the strength"], "answer": 0, "explain": "Turns, core and current are the three factors.", "src": "L|These three things are the factors that will affect the strength of an electromagnet."}, {"id": "y8c09-m089", "type": "mcq", "topic": "9.4", "source": "opus", "q": "How does the number of turns affect an electromagnet?", "options": ["The more turns in the coil, the stronger the electromagnet", "The more turns in the coil, the weaker the electromagnet", "The number of turns makes no difference", "More turns reverse the poles"], "answer": 0, "explain": "Each turn adds to the magnetic effect.", "src": "L|The more turns in the coil, the stronger the electromagnet."}, {"id": "y8c09-m104", "type": "mcq", "topic": "9.4", "source": "opus", "q": "As the number of turns on the coil increases, what happens to the number of paperclips lifted?", "options": ["The number of paperclips lifted increases", "The number of paperclips lifted decreases", "The number of paperclips lifted stays the same", "The paperclips fall off straight away"], "answer": 0, "explain": "This means the electromagnet gets stronger.", "src": "W|As the number of turns on the coil increases, the number of paperclips lifted ."}, {"id": "y8c09-m109", "type": "fill", "topic": "9.1", "source": "opus", "q": "Magnetic materials include the metals iron, steel, nickel and ____.", "answer": ["cobalt"], "explain": "These are the metals attracted to a magnet.", "src": "L|Magnetic materials include the metals iron, steel, nickel and cobalt."}, {"id": "y8c09-m119", "type": "fill", "topic": "9.2", "source": "opus", "q": "Lodestone contains a substance later named ____, which is a naturally occurring magnet.", "answer": ["magnetite"], "explain": "It is not made by people.", "src": "L|The rock was called lodestone and contained a substance that was later named magnetite, which is a naturally occurring magnet."}, {"id": "y8c09-m128", "type": "fill", "topic": "9.3", "source": "opus", "q": "Magnetised means turned into a ____.", "answer": ["magnet"], "explain": "Magnetic materials can be magnetised.", "src": "L|Magnetised means turned into a magnet."}, {"id": "y8c09-m136", "type": "fill", "topic": "9.4", "source": "opus", "q": "The more ____ in the coil, the stronger the electromagnet.", "answer": ["turns"], "explain": "Each turn adds to the magnetic effect.", "src": "L|The more turns in the coil, the stronger the electromagnet."}, {"id": "y8c09-r001", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain what is meant by a magnetic field.", "answer": "A magnetic field is the area around a magnet where the effects of the magnet can be detected. It is not something you can see, so it is defined by what happens in it: a magnetic material placed there is attracted, and a compass needle placed there turns.", "keywords": ["area around a magnet", "effects can be detected", "attracted", "compass turns"], "src": "L|A magnetic fi eld is the area around a magnet where the effects of the magnet can be detected."}, {"id": "y8c09-r002", "type": "short", "topic": "9.1", "source": "opus", "q": "A paperclip is attracted to a magnet but stops being attracted as you move it away. Explain why.", "answer": "The paperclip is only attracted while it is inside the magnetic field of the magnet. As you move it further away it leaves the field, and outside the field the effects of the magnet cannot be detected, so there is no force on it.", "keywords": ["inside the field", "further away", "leaves the field", "no force"], "src": "L|As you move the paperclip further away, it stops being attracted."}, {"id": "y8c09-r003", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain why a paperclip is attracted to a magnet but a copper coin is not.", "answer": "Magnets attract magnetic materials, and magnetic materials are the metals iron, steel, nickel and cobalt. Paperclips are made from steel, which is magnetic, but copper is not a magnetic metal, so the coin is not attracted no matter how close it is.", "keywords": ["magnetic materials", "iron", "steel", "nickel", "cobalt", "copper is not"], "src": "L|Magnetic materials include the metals iron, steel, nickel and cobalt."}, {"id": "y8c09-r004", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain how a compass can be used to detect a magnetic field.", "answer": "A compass contains a magnetised needle that is free to turn. When it is placed in a magnetic field the needle turns and points in the direction of the field, so a change in where the needle points shows that a field is present and which way it runs.", "keywords": ["magnetised needle", "free to turn", "points in the direction", "shows the field"], "src": "L|The needle will turn and point in the direction of a magnetic fi eld."}, {"id": "y8c09-r005", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain how you can tell from a field-line diagram where the magnetic field is strongest.", "answer": "The magnetic field is strongest where the lines are closest together. Near the poles the lines are crowded, which is why the field is strongest at the poles, and further out the lines spread apart and the field is weaker.", "keywords": ["lines closest together", "strongest", "poles", "spread apart", "weaker"], "src": "L|The magnetic fi eld is strongest where the lines are closest together."}, {"id": "y8c09-r006", "type": "short", "topic": "9.1", "source": "opus", "q": "Two magnets are drawn with field lines. Explain the two ways you could tell which magnet is stronger.", "answer": "The stronger magnet has field lines that are closer together, showing a stronger field, and the field lines extend further away from the magnet, showing that its effects can be detected at a greater distance.", "keywords": ["closer together", "extend further", "greater distance", "stronger"], "src": "L|If one magnet is stronger than another, the magnetic fi eld of the stronger magnet will be different in two ways."}, {"id": "y8c09-r007", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain why magnetic field lines must never cross or touch each other.", "answer": "A compass placed at any point in the field points in one single direction. If two lines crossed, the field would be pointing in two different directions at the same point, which is impossible, so the lines are drawn so they never meet.", "keywords": ["one direction", "at a point", "two directions impossible", "never cross"], "src": "L|magnetic fi eld lines must not cross each other."}, {"id": "y8c09-r008", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain, in terms of field lines, why two opposite poles attract each other.", "answer": "When opposite poles face each other the magnetic field lines between the two magnets are all pointing in the same direction, so the fields join up smoothly. This means there is a force of attraction and the magnets are pulled together.", "keywords": ["same direction", "join up", "force of attraction", "pulled together"], "src": "L|The magnetic fi eld lines between the two magnets are all pointing in the same direction."}, {"id": "y8c09-r009", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain, in terms of field lines, why two like poles repel each other.", "answer": "When like poles are together, the magnetic field lines in the space directly between the two magnets are all pointing in opposite directions. The fields push against each other instead of joining, so the magnets repel and try to move away from each other.", "keywords": ["opposite directions", "push against", "repel", "move away"], "src": "L|The magnetic fi eld lines in the space directly between these two magnets are all pointing in opposite directions."}, {"id": "y8c09-r010", "type": "short", "topic": "9.1", "source": "opus", "q": "The field of magnet A extends further than the field of magnet B. Explain what this tells you.", "answer": "It tells you that magnet A is the stronger magnet. Its effects can still be detected at distances where magnet B's field has become too weak to detect, which is exactly what a stronger field means.", "keywords": ["A is stronger", "detected further away", "weaker", "field extends"], "src": "L|The magnetic fi eld of magnet A extends further than the magnetic fi eld of magnet B."}, {"id": "y8c09-r011", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain how the pattern of iron filings around a bar magnet shows where the field is strongest.", "answer": "Each iron filing becomes magnetised and lines up along the field, so the filings map out the field lines. Where the filings are packed closest together and pile up thickest — at the poles — the field lines are closest together, so that is where the field is strongest.", "keywords": ["filings line up", "map the field lines", "closest together", "poles", "strongest"], "src": "L|b How can you tell this from the pattern of iron filings?"}, {"id": "y8c09-r012", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain why the iron-filing pattern alone cannot tell you which pole is north and which is south.", "answer": "The filings only line up along the field lines; they do not show the direction of the arrows on the lines. The pattern is the same at both ends, so you need a compass, which points from north to south, to identify the poles.", "keywords": ["pattern is the same", "no direction", "compass needed", "north to south"], "src": "L|2 a Can you tell by looking at the pattern of iron filings, which is the north or south pole?"}, {"id": "y8c09-r013", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain why iron filings must be kept off the magnet itself during this experiment.", "answer": "Filings that land on the magnet are held at the poles where the field is strongest, and they are very difficult to remove. They then come off on other people's hands, and filings on the skin are unpleasant and hard to wash away, so the card and paper keep them separated from the magnet.", "keywords": ["held at the poles", "difficult to remove", "skin", "card keeps them off"], "src": "L|They are very difficult to remove and other people will get the iron filings on their skin."}, {"id": "y8c09-r014", "type": "short", "topic": "9.1", "source": "opus", "q": "In the paperclip-and-ruler experiment the measurement is repeated three times. Explain why.", "answer": "It is hard to judge the exact moment the paperclip starts to move, so a single reading may be too large or too small. Repeating and taking a mean reduces the effect of these random errors and shows up any reading that is clearly anomalous.", "keywords": ["hard to judge", "random error", "mean", "anomalous", "more reliable"], "src": "L|5 Repeat another two times and record all your measurements of d."}, {"id": "y8c09-r015", "type": "short", "topic": "9.1", "source": "opus", "q": "The magnet is turned round so the other pole faces the paperclip. Explain what this tests.", "answer": "It tests whether the two poles of the same magnet are equally strong. If the paperclip is attracted at the same distance d from both ends, the field is equally strong at both poles; a different distance would show that one end has a stronger field.", "keywords": ["both poles", "same distance", "equally strong", "compare"], "src": "L|6 Turn the magnet around so the other pole is facing the paperclip."}, {"id": "y8c09-r016", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain how a floating needle of lodestone became the first compass.", "answer": "Lodestone contains magnetite, a naturally occurring magnet, so the needle is a magnet free to turn. Floating it on water let it turn without friction, and it always came to rest pointing the same way — one end towards the north and the other towards the south — because it lined up with the Earth's magnetic field.", "keywords": ["magnetite", "free to turn", "no friction", "same direction", "Earth's field"], "src": "L|When allowed to fl oat, the needle of lodestone always turned to point in the same direction."}, {"id": "y8c09-r017", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the invention of the compass was so important for travel.", "answer": "It allowed people to navigate in places such as oceans and deserts, where there are no landmarks to steer by, with less chance of getting lost. With a compass you always know what direction you are facing, even out of sight of land and under cloud.", "keywords": ["oceans", "deserts", "no landmarks", "know the direction", "less chance of getting lost"], "src": "L|The invention of the compass was very important because it allowed people to navigate in places such as oceans and deserts, with less chance of getting lost."}, {"id": "y8c09-r018", "type": "short", "topic": "9.2", "source": "opus", "q": "Satellite navigation exists, yet ships and aeroplanes still carry magnetic compasses. Suggest why.", "answer": "Satnav systems do not use the Earth's magnetic field; they depend on electrical power and on signals from satellites. A magnetic compass needs neither, so it still works if the power fails or the signal is lost, which makes it a reliable backup.", "keywords": ["does not need power", "no signal needed", "backup", "if satnav fails"], "src": "L|Even today with satellite navigation (satnav), ships and aeroplanes still use magnetic compasses."}, {"id": "y8c09-r019", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the Earth's geographic north pole is actually a magnetic south pole.", "answer": "Magnetic field lines always point from north to south, and the Earth's field lines point towards the Earth's north pole. A field line arriving at a pole means that pole behaves as a magnetic south, which is also why the north pole of a compass needle is attracted to it.", "keywords": ["field lines point north to south", "towards the north pole", "behaves as magnetic south", "attracts the needle's north"], "src": "L|This means that the north pole of Earth is actually a magnetic south pole!"}, {"id": "y8c09-r020", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain the difference between the geographic north pole and magnetic north.", "answer": "The geographic poles are the parts of the Earth through which the spin axis passes, so they are fixed by the Earth's rotation. Magnetic north is the magnetic pole that is close to the geographic north pole, and it is not in the same place — it is currently in the Arctic Ocean, north of Alaska, and it moves.", "keywords": ["spin axis", "fixed", "magnetic pole nearby", "not the same place", "moves"], "src": "L|The geographic north and south poles are the parts of the Earth through which the spin axis passes."}, {"id": "y8c09-r021", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain what causes the natural light displays seen in the sky near the poles.", "answer": "They are caused by particles coming from the Sun arriving in the stronger parts of the Earth's magnetic field. The field is strongest near the magnetic poles, so the particles are funnelled there, which is why the displays are seen close to the north and south poles and not at the equator.", "keywords": ["particles from the Sun", "stronger parts", "field", "near the poles"], "src": "L|These are caused by particles coming from the Sun arriving into the stronger parts of the Earth’s magnetic field."}, {"id": "y8c09-r022", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the Earth's magnetic field cannot be caused by magnetic rocks, as people once thought.", "answer": "The temperatures deep inside the Earth are so high that rocks there would lose any magnetism that they had. A permanent magnet cannot survive those conditions, so the field must be produced by something else — the movement in the hot, mostly iron core.", "keywords": ["high temperatures", "lose magnetism", "cannot survive", "core"], "src": "L|However, it is now known that the high temperatures deep inside the Earth would cause rocks to lose any magnetism that they had."}, {"id": "y8c09-r023", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain how the liquid outer core accounts for the fact that magnetic north moves.", "answer": "The core is liquid and moving, so whatever produces the field is itself not fixed in place. Because the source moves, the position of the magnetic poles drifts slowly — about 60 km per year — and has occasionally reversed altogether, which a solid permanent magnet could not do.", "keywords": ["liquid", "moving", "source not fixed", "poles drift", "reversed"], "src": "L|The movement in the liquid outer core would explain why the magnetic poles move slowly, and have occasionally reversed."}, {"id": "y8c09-r024", "type": "short", "topic": "9.2", "source": "opus", "q": "Airport runway numbers are based on direction from magnetic north. Explain why the numbers sometimes have to be changed.", "answer": "Magnetic north moves at a speed of about 60 km per year. Over decades this changes the compass direction of a fixed runway enough to alter its number, so the painted numbers must be repainted to stay correct for pilots using compasses.", "keywords": ["magnetic north moves", "60 km per year", "direction changes", "repainted"], "src": "L|The numbers sometimes have to be changed due to movement of magnetic north."}, {"id": "y8c09-r025", "type": "short", "topic": "9.2", "source": "opus", "q": "Magnetic north keeps moving. Explain how its position can still be known accurately.", "answer": "It is measured regularly rather than assumed. Scientists survey the field in many places and update the published position, so navigation charts and compass corrections are revised as the pole drifts.", "keywords": ["measured regularly", "surveyed", "updated", "charts revised"], "src": "L|Explain why the position of magnetic north can still be"}, {"id": "y8c09-r026", "type": "short", "topic": "9.2", "source": "opus", "q": "A bar magnet hangs freely on a string. Explain which pole ends up pointing towards geographic north.", "answer": "The north pole of the magnet points towards geographic north. Opposite poles attract, and the Earth's magnetic pole that lies near geographic north behaves as a magnetic south pole, so it attracts the north pole of the hanging magnet.", "keywords": ["north pole of the magnet", "opposite poles attract", "magnetic south", "geographic north"], "src": "L|Explain which pole of the bar magnet will point to geographic north."}, {"id": "y8c09-r027", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the hanging-magnet experiment must be done away from other magnets or large magnetic objects.", "answer": "The Earth's magnetic field is very weak, so a nearby magnet or a large iron object would produce a stronger field at the magnet and turn it. The magnet would then line up with that object instead of with the Earth, and the result would be wrong.", "keywords": ["Earth's field is weak", "nearby magnet stronger", "lines up with it", "wrong result"], "src": "L|Make sure there are no other magnets or large magnetic objects close by."}, {"id": "y8c09-r028", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the hanging magnet is moved to a different part of the room and the direction recorded again.", "answer": "If it points the same way in both places, the field turning it is the same everywhere in the room, which is what you would expect from the Earth. If it points differently, something local in one position is affecting it, so the second reading is a check on the first.", "keywords": ["same direction", "field is the same everywhere", "local object", "check"], "src": "L|4 Move the equipment to another part of the room."}, {"id": "y8c09-r029", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain how stroking a steel needle with a bar magnet turns it into a magnet.", "answer": "Stroking the needle several times in the same direction with the same pole lines up the magnetism inside the steel. Once it is lined up the needle has its own two poles and behaves as a magnet, and because steel keeps its magnetism it stays magnetised after the magnet is taken away.", "keywords": ["stroke", "same direction", "same pole", "lines up", "steel keeps its magnetism"], "src": "L|Method: Part 2  5 Hold the needle or nail and gently stroke the bar magnet along it several times."}, {"id": "y8c09-r030", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the magnetised needle is floated on a cork disc in a non-magnetic dish.", "answer": "Floating removes almost all friction so the needle is free to turn until it lines up with the Earth's weak magnetic field. The dish must be non-magnetic, otherwise the dish itself would produce a field and the needle would point at the dish instead of north.", "keywords": ["free to turn", "no friction", "weak field", "non-magnetic dish"], "src": "L|Set the needle on the disc and fl oat the disc in the water, in a non-magnetic dish as shown."}, {"id": "y8c09-r031", "type": "short", "topic": "9.2", "source": "opus", "q": "A map shows the Earth's magnetic field strength with lines joining places of equal strength. Explain how such a map is like a field-line diagram.", "answer": "Both use the spacing of lines to show how the field changes: where the lines on the map are packed close together, the field strength changes quickly over a short distance, and the labelled values let you read the strength at any place directly rather than only comparing.", "keywords": ["lines join equal values", "spacing", "changes quickly", "read the strength"], "src": "W|The map shows how the strength of the Earth’s magnetic field varies in different parts of the world."}, {"id": "y8c09-r032", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain the difference between the words 'magnetic' and 'magnetised'.", "answer": "A material is described as magnetic if it is attracted to a magnet — iron, steel, nickel and cobalt are magnetic. A material is magnetised when it has been turned into a magnet itself, so it has its own poles and its own field. All magnetised objects are made from magnetic materials, but a magnetic material is not necessarily magnetised.", "keywords": ["magnetic", "attracted to a magnet", "magnetised", "made into a magnet", "own poles"], "src": "L|Explain the difference between ‘magnetic’ and ‘magnetised’."}, {"id": "y8c09-r033", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain what makes a magnet a permanent magnet.", "answer": "A permanent magnet has a magnetic field that is always there — you cannot switch the field off and on again. It was made by magnetising a magnetic material, and it keeps that magnetism without needing any power supply.", "keywords": ["always there", "cannot switch off", "magnetised", "no power needed"], "src": "L|The magnets you have used are called permanent magnets because they have a magnetic field that is always there."}, {"id": "y8c09-r034", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain how an electromagnet is made and how it works.", "answer": "A wire is wrapped around a magnetic material such as iron: the wrapped wire is the coil and the material in the middle is the core. When current passes through the coil the core becomes magnetised, so the whole thing behaves as a magnet with two poles. When the current is switched off, the core loses most of its magnetism.", "keywords": ["coil", "core", "current", "becomes magnetised", "switched off", "loses magnetism"], "src": "L|When current passes through the coil, the magnetic material becomes magnetised."}, {"id": "y8c09-r035", "type": "short", "topic": "9.3", "source": "opus", "q": "State and explain the main difference between an electromagnet and a permanent magnet.", "answer": "An electromagnet can be switched on and off, because its magnetism only exists while current flows through the coil. A permanent magnet's field is always there and cannot be switched off. This is why electromagnets are used wherever the magnetism has to be controlled.", "keywords": ["switched on and off", "current", "always there", "controlled"], "src": "L|State the main difference between an electromagnet and a permanent magnet."}, {"id": "y8c09-r036", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain two ways of reversing the poles of an electromagnet.", "answer": "You can wrap the coil around in the opposite direction, or reverse the connections to the cell or power supply. Both change the direction the current travels around the core, and it is that direction which decides which end is north.", "keywords": ["wrap the other way", "reverse the cell", "direction of the current", "decides the poles"], "src": "L|You can reverse the poles of an electromagnet in one of two ways."}, {"id": "y8c09-r037", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain how you could use a magnetic compass to find out which end of an electromagnet is the north pole.", "answer": "Bring a compass near one end while the current is on. A compass points along magnetic field lines, and field lines run from north to south, so the compass needle's north end will point towards the south pole of the electromagnet. The end it points away from is the north pole.", "keywords": ["compass", "points along field lines", "north to south", "identify the pole"], "src": "L|A magnetic compass points along magnetic field lines, so will point towards the south pole."}, {"id": "y8c09-r038", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain how a bar magnet could be used instead of a compass to identify the poles of an electromagnet.", "answer": "Bring a known pole of the bar magnet close to one end of the electromagnet. Opposite poles attract and like poles repel, so if the known north pole is repelled, that end of the electromagnet is also north; if it is attracted, that end is south.", "keywords": ["known pole", "attract", "repel", "identify"], "src": "L|Opposite poles attract and like poles repel so, by bringing the bar magnet close to the electromagnet, you can detect which pole is which."}, {"id": "y8c09-r039", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why a fire door is held open by an electromagnet rather than a permanent magnet.", "answer": "The electromagnet is connected to the fire alarm. When the alarm goes off the current is switched off, so the magnet loses its magnetism and releases the door, which closes to stop the fire spreading. A permanent magnet could not be switched off, so the door could never be released automatically.", "keywords": ["connected to the alarm", "current off", "releases", "door closes", "permanent cannot"], "src": "L|When the fire alarm is switched on, the magnet is switched off and the door closes."}, {"id": "y8c09-r040", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain how an electromagnet is used to sort scrap metal.", "answer": "Switched on, the electromagnet attracts iron and steel and lifts them, leaving the non-magnetic metals such as copper, aluminium and zinc behind. The magnetic metals are then moved away and dropped by switching the current off, so the two groups end up in separate places.", "keywords": ["attracts iron and steel", "leaves copper aluminium zinc", "moved", "switched off to drop"], "src": "L|The electromagnet will attract iron and steel, leaving other nonmagnetic metals behind."}, {"id": "y8c09-r041", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain how an electric bell keeps ringing while the switch is held down.", "answer": "When the electromagnet is on, the hammer is pulled onto the bell. That movement breaks the circuit, so the electromagnet switches off and the hammer moves away. The circuit becomes complete again and the hammer is pulled back. This repeats over and over until the power supply is turned off.", "keywords": ["pulled onto the bell", "breaks the circuit", "moves away", "complete again", "repeats"], "src": "L|The circuit becomes complete again and the hammer is pulled back to the bell."}, {"id": "y8c09-r042", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why a toaster uses an electromagnet to hold the handle down.", "answer": "While the current is on, the electromagnet holds the handle down and the toast stays inside. When the timer switches the electromagnet off it loses its magnetism at once and releases the handle, so the toast pops up. Only a magnet that can be switched off can release at a chosen time.", "keywords": ["holds the handle", "current on", "switched off", "releases", "pops up"], "src": "L|When the electromagnet in the toaster switches off, the toast pops up."}, {"id": "y8c09-r043", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why only the plastic coating of the wire should touch the nail when making an electromagnet.", "answer": "The plastic is an insulator, so it keeps the current flowing all the way round each turn of the coil. If bare wire touched the nail or another turn, the current could take a short cut through the metal instead of going round the coil, and the electromagnet would be much weaker or would not work.", "keywords": ["plastic", "insulator", "short cut", "current goes round the coil", "weaker"], "src": "L|Questions  1 Suggest why it is important that only the plastic coating of the wire makes contact with the nail."}, {"id": "y8c09-r044", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why the electromagnet is tested by hanging paperclips on the end of the nail rather than the middle.", "answer": "The whole nail becomes magnetised, and like any magnet its field is strongest at the poles, which are at the ends. Testing at the end therefore gives the biggest and most consistent effect, while the middle is where the field is weakest and few paperclips would be held.", "keywords": ["poles at the ends", "strongest", "middle weakest", "consistent"], "src": "L|Suggest why you test the electromagnet by attaching paperclips to the end of the nail and not the middle of the nail."}, {"id": "y8c09-r045", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why an electromagnet should be switched on only for the shortest possible time.", "answer": "The coil has a very low resistance, so a large current flows and drains the cell quickly. The current also heats the wire, which can become hot enough to be dangerous, so keeping the time short protects both the cell and the person using it.", "keywords": ["drains the cell", "large current", "wire gets hot", "safety"], "src": "L|Only switch on your electromagnet for the shortest possible time, otherwise the cell will not last long."}, {"id": "y8c09-r046", "type": "short", "topic": "9.4", "source": "opus", "q": "State the three factors that affect the strength of an electromagnet and explain the effect of each.", "answer": "The number of turns in the coil — the more turns, the stronger the electromagnet. The current — the greater the current, the stronger the electromagnet. The material of the core — iron and some types of steel make the strongest electromagnets. Each one can be changed independently of the others.", "keywords": ["number of turns", "current", "core material", "stronger"], "src": "L|These three things are the factors that will affect the strength of an electromagnet."}, {"id": "y8c09-r047", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain how you would investigate the effect of current on the strength of an electromagnet fairly.", "answer": "Change only the current, and keep the number of turns on the coil and the core the same throughout. Measure the strength the same way each time, for example by counting how many paperclips the electromagnet can hold, and repeat each reading so a mean can be taken.", "keywords": ["change the current only", "same turns", "same core", "same measurement", "repeat"], "src": "L|Keep the number of turns on the coil and the core the same."}, {"id": "y8c09-r048", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain how you would investigate the effect of the core material fairly.", "answer": "Change only the material in the core, keeping the number of turns on the coil and the current the same. Use cores of the same size and shape, and measure the strength in the same way each time, so any difference in strength can only be due to the material.", "keywords": ["change the core only", "same turns", "same current", "same size", "only the material"], "src": "L|Keep the number of turns on the coil and the current the same."}, {"id": "y8c09-r049", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain what 'soft iron' means and why it is used for electromagnet cores.", "answer": "Soft iron is not soft in the way modelling clay is; it is the term for iron that is easily magnetised and also easily demagnetised. That is exactly what an electromagnet needs: it becomes strongly magnetic the instant the current flows and loses nearly all its magnetism the instant the current stops.", "keywords": ["easily magnetised", "easily demagnetised", "not physically soft", "switches quickly"], "src": "L|Soft iron is the term used for iron that is easily magnetised and also easily demagnetised."}, {"id": "y8c09-r050", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain why a steel core would be a poor choice for an electromagnet that must switch on and off.", "answer": "Steel keeps its magnetism once it has been magnetised, which is why steel is used for permanent magnets. In an electromagnet that would mean the core stayed magnetic after the current was switched off, so the device could not release whatever it was holding.", "keywords": ["steel keeps its magnetism", "permanent magnets", "stays magnetic", "cannot release"], "src": "L|Use a soft iron core in place of a steel core."}, {"id": "y8c09-r051", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain how the strength of an electromagnet can be measured in a school laboratory.", "answer": "The strength can be measured by the force the electromagnet exerts on a magnetic material. The easiest way is to see how many magnetic objects, such as paperclips or steel pins, it can lift and hold — the more it holds, the stronger it is.", "keywords": ["force on a magnetic material", "count", "paperclips", "lift and hold", "stronger"], "src": "L|The strength of an electromagnet can be measured by the force that the electromagnet exerts on a magnetic material."}, {"id": "y8c09-r052", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain why an electromagnet for sorting scrap metal must be much stronger than the one in a toaster.", "answer": "The scrap magnet must lift heavy pieces of iron and steel against gravity, so it needs a large force acting over a distance. The toaster magnet only has to hold a light handle in place against a weak spring, so a much smaller force is enough.", "keywords": ["lift heavy scrap", "large force", "against gravity", "light handle", "small force"], "src": "L|Explain why an electromagnet for sorting scrap metal needs to be stronger than the electromagnet that holds the handle of a toaster down."}, {"id": "y8c09-r053", "type": "short", "topic": "9.4", "source": "opus", "q": "Marcus finds that more turns on the coil lifts more paperclips. Explain what this shows and what he must keep constant.", "answer": "It shows that the electromagnet gets stronger as the number of turns on the coil increases. For this conclusion to be valid he must keep constant the current in the coil, the material in the core, and the size of the paperclips, since any of those would otherwise change the number lifted.", "keywords": ["stronger", "more turns", "current constant", "same core", "same paperclips"], "src": "W|This means the electromagnet gets as the number of turns on the coil increases."}, {"id": "y8c09-r054", "type": "short", "topic": "9.4", "source": "opus", "q": "Marcus thinks one of his results is anomalous. Explain what he should do about it.", "answer": "He should repeat that measurement with the same conditions. If the repeat agrees with the trend, the first reading was a one-off error and can be replaced; if the repeat gives the same odd value, the result is real and he must look for a cause, such as paperclips sticking to each other.", "keywords": ["repeat", "same conditions", "compare with the trend", "look for a cause"], "src": "W|c Suggest what Marcus should do about this anomalous result."}, {"id": "y8c09-r055", "type": "short", "topic": "9.4", "source": "opus", "q": "Arun can use large or small paperclips to measure the strength of an electromagnet. Explain which choice gives better results.", "answer": "Small paperclips are better because each one weighs less, so the number lifted changes by a larger number of clips for the same change in strength, giving finer detail in the results. Whichever he chooses, he must use the same size throughout, since a change in clip size would change the count without the magnet changing at all.", "keywords": ["small clips", "finer detail", "more clips", "same size throughout"], "src": "W|Arun can use large paperclips or small paperclips."}, {"id": "y8c09-r056", "type": "short", "topic": "9.4", "source": "opus", "q": "Sofia can vary the current with an adjustable power supply instead of adding cells. Explain two advantages of the power supply.", "answer": "The power supply lets her set many different values of current, including values between those the cells would give, so she gets more points for her graph. It also keeps its output steady, whereas cells run down as the experiment goes on and would make later readings lower than they should be.", "keywords": ["many values", "in between", "more points", "steady output", "cells run down"], "src": "W|i Describe two advantages in this investigation, of using this power supply, compared to changing the number of cells in the circuit."}, {"id": "y8c09-r057", "type": "short", "topic": "9.4", "source": "opus", "q": "Explain the safety risk Sofia must watch for as the current in her electromagnet gets larger.", "answer": "A larger current heats the wire in the coil more. The wire can become hot enough to burn her fingers or melt its plastic insulation, so she must check whether the coil is becoming hot and switch off immediately if it is.", "keywords": ["larger current", "wire gets hot", "burn", "insulation", "switch off"], "src": "W|ii What safety risk must Sofia be aware of when the current gets larger?"}, {"id": "y8c09-r058", "type": "short", "topic": "9.4", "source": "opus", "q": "An electromagnet is held above an iron block on a digital balance. Explain what happens to the reading when it is switched on.", "answer": "The electromagnet attracts the iron block upwards. That upward pull partly supports the block's weight, so the block presses down on the balance with less force and the reading falls. The larger the current, the stronger the pull and the lower the reading.", "keywords": ["attracts upwards", "supports the weight", "presses down less", "reading falls"], "src": "W|a Explain what will happen to the reading on the digital balance when the electromagnet is switched on."}, {"id": "y8c09-r059", "type": "short", "topic": "9.4", "source": "opus", "q": "A record electromagnet was 4500 times stronger than a school bar magnet and used more electricity than three million lamps. Explain what this tells you about the current needed.", "answer": "Strength increases with current, so making a field thousands of times stronger requires an enormous current. Since the electrical energy used depends on that current, the machine consumes as much electricity as millions of lamps — the energy cost is the price of the field strength.", "keywords": ["strength increases with current", "enormous current", "energy", "cost"], "src": "L|They made an electromagnet 4500 times stronger than a school bar magnet."}, {"id": "y8c09-o002", "type": "short", "topic": "9.1", "source": "opus", "q": "Name four metals that are magnetic materials.", "answer": "Iron, steel, nickel and cobalt.", "keywords": ["iron", "steel", "nickel", "cobalt"], "explain": "Most metals are not magnetic. Only this small group is attracted to a magnet.", "src": "L|Magnetic materials include the metals iron, steel, nickel and cobalt."}, {"id": "y8c09-o003", "type": "short", "topic": "9.1", "source": "opus", "q": "What is meant by the term 'magnetic field'?", "answer": "A magnetic field is the area around a magnet where the effects of the magnet can be detected.", "keywords": ["area", "around a magnet", "effects", "detected"], "explain": "A field is a region of space, not an object. Outside that region the magnet has no effect.", "src": "L|A magnetic fi eld is the area around a magnet where the effects of the magnet can be detected."}, {"id": "y8c09-o005", "type": "short", "topic": "9.1", "source": "opus", "q": "Explain why a paperclip stops being attracted when you move it away from a magnet.", "answer": "The paperclip has moved outside the magnetic field of the magnet, so the magnet has no effect on it.", "keywords": ["outside", "magnetic field", "no effect"], "explain": "The field does not go on for ever. Beyond its edge the paperclip feels no force.", "src": "L|As you move the paperclip further away, it stops being attracted."}, {"id": "y8c09-o006", "type": "short", "topic": "9.1", "source": "opus", "q": "Describe one way of detecting a magnetic field without using a compass.", "answer": "See whether a magnetic object, such as a paperclip, moves because it is attracted.", "keywords": ["magnetic object", "moves", "attracted"], "explain": "If a magnetic object moves on its own, something is pulling it, so a field must be there.", "src": "L|You can see whether a magnetic object moves because of attraction."}, {"id": "y8c09-o014", "type": "short", "topic": "9.1", "source": "opus", "q": "Two magnets are placed with like poles facing each other. Describe the field lines between them and the force produced.", "answer": "The field lines in the space directly between the two magnets point in opposite directions, so the magnets repel and try to move away from each other.", "keywords": ["opposite directions", "repel", "move away"], "explain": "Fields pointing against each other cannot join, so the magnets are pushed apart.", "src": "L|The magnetic fi eld lines in the space directly between these two magnets are all pointing in opposite directions."}, {"id": "y8c09-o020", "type": "short", "topic": "9.2", "source": "opus", "q": "Do satellite navigation systems use the Earth's magnetic field?", "answer": "No. Satellite navigation, or satnav, systems do not use the Earth's magnetic field. Ships and aeroplanes still carry magnetic compasses as well.", "keywords": ["do not", "satnav", "satellite"], "explain": "Satnav works from radio signals, so a magnetic compass is kept as an independent back-up.", "src": "L|Satellite navigation, or satnav, systems do not use the Earth’s magnetic fi eld."}, {"id": "y8c09-o023", "type": "short", "topic": "9.2", "source": "opus", "q": "Explain why the geographic north pole of the Earth is really a magnetic south pole.", "answer": "Magnetic field lines point from north to south, and the Earth's field lines point towards the geographic north pole. So the pole they point into must be a magnetic south pole.", "keywords": ["north to south", "field lines", "magnetic south pole"], "explain": "A compass needle's north end is attracted to it, and opposite poles attract, so it must be a south pole.", "src": "L|This means that the north pole of Earth is actually a magnetic south pole!"}, {"id": "y8c09-o028", "type": "short", "topic": "9.2", "source": "opus", "q": "What is thought to be the origin of the Earth's magnetic field?", "answer": "The Earth's core. Scientists think the heat generated in the core, which is mostly made from iron, causes it to continually create a magnetic field.", "keywords": ["core", "iron", "heat"], "explain": "Iron is magnetic, and a hot, moving iron core can generate a field even though solid rock cannot stay magnetised.", "src": "L|They think the heat generated in the core, which is mostly made from iron, causes it to continually create a magnetic field."}, {"id": "y8c09-o030", "type": "short", "topic": "9.2", "source": "opus", "q": "Why do the numbers painted on airport runways sometimes have to be changed?", "answer": "Airport runways are numbered according to their direction from magnetic north, and magnetic north moves, so the numbers eventually become wrong.", "keywords": ["direction", "magnetic north", "moves"], "explain": "At about 60 km per year the drift is slow, but over decades it changes the runway's compass bearing.", "src": "L|Airport runways are numbered according to their direction from magnetic north."}, {"id": "y8c09-o032", "type": "short", "topic": "9.3", "source": "opus", "q": "Steel is not a pure metal. Why is steel magnetic?", "answer": "Steel is a mixture that contains a large proportion of iron, and iron is magnetic.", "keywords": ["mixture", "large proportion", "iron"], "explain": "The magnetic behaviour comes from the iron in the mixture.", "src": "L|Steel is a mixture that contains a large proportion of iron."}, {"id": "y8c09-o034", "type": "short", "topic": "9.3", "source": "opus", "q": "What is a permanent magnet?", "answer": "A permanent magnet is a magnet that has a magnetic field that is always there. You cannot switch the magnetic field off and on again.", "keywords": ["always there", "cannot switch", "off"], "explain": "This is the key difference from an electromagnet, which is only magnetic while current flows.", "src": "L|The magnets you have used are called permanent magnets because they have a magnetic field that is always there."}, {"id": "y8c09-o035", "type": "short", "topic": "9.3", "source": "opus", "q": "Describe how an electromagnet is made.", "answer": "An electromagnet is made by wrapping a wire around a magnetic material, such as iron, and passing a current through the wire.", "keywords": ["wrapping", "wire", "iron", "current"], "explain": "You need three things: a coil, a magnetic core and a current.", "src": "L|An electromagnet is made by wrapping a wire around a magnetic material, such as iron."}, {"id": "y8c09-o036", "type": "short", "topic": "9.3", "source": "opus", "q": "What are the coil and the core of an electromagnet?", "answer": "The coil is the wire that is wrapped around. The core is the material in the middle of the coil.", "keywords": ["coil", "wire", "core", "middle"], "explain": "Naming the parts correctly matters when you describe how to change an electromagnet's strength.", "src": "L|The material in the middle of the coil is called the core."}, {"id": "y8c09-o043", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain how an electromagnet sorts scrap metal.", "answer": "The electromagnet will attract iron and steel, leaving other non-magnetic metals behind. Switching the magnet off then drops the metal that has been lifted.", "keywords": ["attract", "iron", "steel", "non-magnetic", "switching off"], "explain": "Sorting needs both picking up and letting go, so the magnet has to be switchable.", "src": "L|The electromagnet will attract iron and steel, leaving other nonmagnetic metals behind."}, {"id": "y8c09-o045", "type": "short", "topic": "9.3", "source": "opus", "q": "Explain why the hammer in an electric bell keeps moving instead of staying still.", "answer": "When the electromagnet is on, the hammer is pulled onto the bell. The movement breaks the circuit and the hammer moves away from the bell. The circuit becomes complete again and the hammer is pulled back, and this repeats.", "keywords": ["breaks the circuit", "moves away", "complete again", "repeats"], "explain": "The hammer's own movement switches the electromagnet off, which is what makes it vibrate.", "src": "L|The movement breaks the circuit and the hammer moves away from the bell."}, {"id": "y8c09-o048", "type": "short", "topic": "9.4", "source": "opus", "q": "State the three factors that affect the strength of an electromagnet.", "answer": "The number of turns in the coil, the material of the core, and the current flowing in the coil.", "keywords": ["turns", "coil", "core", "current"], "explain": "These are the same three things that are needed to make an electromagnet in the first place.", "src": "L|These three things are the factors that will affect the strength of an electromagnet."}, {"id": "y8c09-o049", "type": "short", "topic": "9.4", "source": "opus", "q": "What is meant by a 'factor' in an investigation?", "answer": "A factor is another word for a variable that will affect something.", "keywords": ["variable", "affect"], "explain": "In a fair test you change one factor at a time and keep the others the same.", "src": "L|A factor is another word for a variable that will affect something."}, {"id": "y8c09-o050", "type": "short", "topic": "9.4", "source": "opus", "q": "How does the number of turns on the coil affect the strength of an electromagnet?", "answer": "The more turns in the coil, the stronger the electromagnet.", "keywords": ["more turns", "stronger"], "explain": "Each turn adds its own magnetic effect, so the turns build up the field.", "src": "L|The more turns in the coil, the stronger the electromagnet."}, {"id": "y8c09-o051", "type": "short", "topic": "9.4", "source": "opus", "q": "How does the current affect the strength of an electromagnet?", "answer": "The greater the current, the stronger the electromagnet.", "keywords": ["greater current", "stronger"], "explain": "More cells give a bigger current, which gives a bigger field.", "src": "L|The greater the current, the stronger the electromagnet."}, {"id": "y8c09-o053", "type": "short", "topic": "9.4", "source": "opus", "q": "What is meant by 'soft iron'?", "answer": "Soft iron is the term used for iron that is easily magnetised and also easily demagnetised.", "keywords": ["easily magnetised", "easily demagnetised"], "explain": "'Soft' here has nothing to do with how hard the metal feels.", "src": "L|Soft iron is the term used for iron that is easily magnetised and also easily demagnetised."}, {"id": "y8c09-o055", "type": "short", "topic": "9.4", "source": "opus", "q": "Describe the world record electromagnet made in 2019.", "answer": "Scientists made an electromagnet 4500 times stronger than a school bar magnet. It uses more electricity than three million electric lamps.", "keywords": ["4500", "stronger", "electricity", "three million"], "explain": "Very strong electromagnets need enormous currents, which is why they use so much electricity.", "src": "L|They made an electromagnet 4500 times stronger than a school bar magnet."}, {"id": "y8c09-w020", "type": "mcq", "topic": "9.3", "source": "opus", "q": "Elsa has connectors for use in a circuit. What two more things does she need to make an electromagnet?", "options": ["A length of wire to wind into a coil, and a cell or power supply.", "A bar magnet and a compass.", "A plastic rod and some paper.", "A thermometer and a stopwatch."], "answer": 0, "explain": "An electromagnet is a coil of wire with a current flowing through it.", "src": "W|a Write down two more things that Elsa needs to make an electromagnet."}, {"id": "y8c09-w039", "type": "fill", "topic": "9.1", "source": "opus", "q": "The region around a magnet in which a magnetic force can be detected is called a magnetic ____.", "answer": ["field"], "explain": "Field lines drawn close together show where it is strongest.", "src": "W|a Describe what is meant by the term ‘magnetic field’."}, {"id": "y8c09-w041", "type": "fill", "topic": "9.2", "source": "opus", "q": "The two magnetic metals in the Earth's core are iron and ____.", "answer": ["nickel"], "explain": "Movement of this molten metal is what generates the Earth's magnetic field.", "src": "W|b Name the two magnetic metals that make up this part of"}, {"id": "y8c09-w043", "type": "fill", "topic": "9.3", "source": "opus", "q": "An electromagnet is made by wrapping a ____ of wire around a metal core and passing a current through it.", "answer": ["coil"], "explain": "No current means no magnetic field, so an electromagnet can be switched off.", "src": "W|A coil of wire is wrapped around a metal core."}, {"id": "y8c09-w045", "type": "fill", "topic": "9.4", "source": "opus", "q": "A result that does not fit the pattern of the other results is described as ____.", "answer": ["anomalous"], "explain": "The right response is to repeat that measurement, not to rub it out.", "src": "W|b Marcus thinks one of his results is anomalous."}, {"id": "qwen-01-04", "type": "fill", "topic": "9.1", "source": "qwen", "q": "Magnetic field lines have arrows that point from the north pole to the ____ pole.", "explain": "The rules for drawing field lines state that arrows point from N to S.", "src": "L|the magnetic fi eld lines have arrows that point N  S", "answer": ["south"]}, {"id": "qwen-01-05", "type": "mcq", "topic": "9.1", "source": "qwen", "q": "What happens when two north poles of magnets are brought close together?", "explain": "Two north poles repel.", "src": "L|Two north poles repel.", "options": ["They attract", "They repel", "Nothing happens", "They stick together"], "answer": 1}, {"id": "qwen-01-06", "type": "fill", "topic": "9.1", "source": "qwen", "q": "A compass contains a magnetised needle that is free to ____.", "explain": "The compass needle as being free to turn.", "src": "L|A compass contains a magnetised needle that is free to turn.", "answer": ["turn"]}, {"id": "qwen-01-07", "type": "mcq", "topic": "9.1", "source": "qwen", "q": "If the magnetic field lines of one magnet are closer together than another, what does this mean?", "explain": "If one magnet is stronger, all the field lines will be closer together.", "src": "L|All the fi eld lines will be closer together.", "options": ["It is weaker", "It is stronger", "It has no field", "It is a different shape"], "answer": 1}, {"id": "qwen-01-08", "type": "fill", "topic": "9.2", "source": "qwen", "q": "The rock called lodestone contains a substance named ____ which is a naturally occurring magnet.", "explain": "The substance in lodestone as magnetite.", "src": "L|contained a substance that was later named magnetite, which is a naturally occurring magnet", "answer": ["magnetite"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "How were the Chinese able to see that a lodestone needle always points in one particular direction?", "explain": "The needle was floated on water. Floating let it turn almost without friction, so it could line up with the Earth's magnetic field.", "src": "L|could be made to fl oat on water. When allowed to fl oat, the needle of lodestone always turned", "options": ["It was heavy", "It floated on water", "It was made of gold", "It was hot"], "answer": 1}, {"id": "qwen-01-11", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "Why is the Earth's geographic North Pole actually a magnetic South Pole?", "explain": "Since field lines point from north to south, and they point towards the geographic North Pole, it must be a magnetic South Pole.", "src": "L|This means that the north pole of Earth is actually a magnetic south pole!", "options": ["Because it is cold", "Because field lines point towards it", "Because it spins fast", "Because of the sun"], "answer": 1}, {"id": "qwen-02-04", "type": "fill", "topic": "9.3", "source": "qwen", "q": "In an electromagnet, the wire wrapped around the magnetic material is called a ____.", "explain": "The wrapped wire as a coil.", "src": "L|The wire that is wrapped around is a called a coil", "answer": ["coil"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "9.3", "source": "qwen", "q": "What happens to the magnetism of an electromagnet when the current is switched off?", "explain": "When current is switched off, the material loses most of its magnetism.", "src": "L|When the current is switched off, the magnetic material loses most of its magnetism", "options": ["It loses most of its magnetism", "It becomes a permanent magnet", "Its strength doubles", "It changes direction"], "answer": 0}, {"id": "qwen-02-07", "type": "mcq", "topic": "9.3", "source": "qwen", "q": "Which of these metals is NOT magnetic?", "explain": "Iron, nickel, and cobalt as magnetic, but identifies copper as a common non-magnetic metal.", "src": "L|Common non-magnetic metals include copper, aluminium and zinc", "options": ["Copper", "Iron", "Nickel", "Cobalt"], "answer": 0}, {"id": "qwen-03-02", "type": "fill", "topic": "9.4", "source": "qwen", "q": "The main difference between an electromagnet and a permanent magnet is that the strength of an electromagnet can be changed by changing the ____.", "explain": "The current in the coil is a factor affecting strength, and increasing it makes the electromagnet stronger.", "src": "L|The current in the coil. The greater the current, the stronger the electromagnet.", "answer": ["current"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "9.4", "source": "qwen", "q": "What material is used for the core in an electromagnet to make it strongest?", "explain": "Changing the core to soft iron increases strength and that iron makes the strongest electromagnets.", "src": "L|Change the core to soft iron. Keep the number of turns on the coil and the current the same.", "options": ["rubber", "wood", "soft iron", "plastic"], "answer": 2}, {"id": "qwen-03-05", "type": "mcq", "topic": "9.4", "source": "qwen", "q": "How can you increase the strength of an electromagnet by changing the coil?", "explain": "The more turns in the coil, the stronger the electromagnet.", "src": "L|The number of turns in the coil. The more turns in the coil, the stronger the electromagnet.", "options": ["Decrease the number of turns", "Increase the number of turns", "Use a thicker wire only", "Remove the coil"], "answer": 1}, {"id": "qwenw-01-01", "type": "mcq", "topic": "9.3", "source": "qwen", "q": "Which two metals can be magnetised when used as the core of an electromagnet?", "explain": "Steel and iron as the metals that could be magnetised when used in the core.", "src": "W|Which of these metals could be magnetised when used in the core? Tick (✓) two boxes. copper aluminium steel gold iron", "options": ["copper and aluminium", "steel and iron", "gold and copper", "aluminium and gold"], "answer": 1}, {"id": "qwenw-01-02", "type": "fill", "topic": "9.3", "source": "qwen", "q": "A coil of wire is wrapped around a metal core. Current is passed through the wire to make an ____.", "explain": "The section title and context describe making an electromagnet using a coil of wire.", "src": "W|In this exercise, you will think about making an electromagnet.", "answer": ["electromagnet"]}, {"id": "qwenw-01-05", "type": "mcq", "topic": "9.2", "source": "qwen", "q": "Which statement is true about the Earth's magnetic field?", "explain": "The Earth's magnetic field occurs all around the Earth as the true statement.", "src": "W|c The Earth’s magnetic field occurs all around the Earth.", "options": ["It occurs only at the poles", "It occurs all around the Earth", "It occurs only at the equator", "It occurs only at certain times"], "answer": 1}, {"id": "qwenw-01-08", "type": "fill", "topic": "9.4", "source": "qwen", "q": "As the number of turns on the coil increases, the electromagnet gets ____.", "explain": "The results show that more turns lead to more paperclips lifted, meaning the magnet gets stronger.", "src": "W|This means the electromagnet gets as the number of turns on the coil increases.", "answer": ["stronger"]}, {"id": "qwenw-01-09", "type": "mcq", "topic": "9.4", "source": "qwen", "q": "Marcus is investigating how the number of turns on a coil affects the strength of an electromagnet. Which of these must he keep the same?", "explain": "The number of turns is the variable he changes and the number of paperclips lifted is what he measures. The current must stay the same, or a change in strength could have been caused by the current instead of the turns.", "src": "W|Which of these should Marcus keep constant during his investigation. Tick (✓) all that are correct.", "options": ["The current in the coil", "The number of turns in the coil", "The number of paperclips lifted", "The strength of the electromagnet"], "answer": 0}, {"id": "qwenw-01-10", "type": "fill", "topic": "9.2", "source": "qwen", "q": "A steel needle can be magnetised by using a ____.", "explain": "Describe how a steel needle can be magnetised by using a bar magnet.", "src": "W|Describe how a steel needle can be magnetised by using a bar magnet.", "answer": ["bar magnet"]}], "figures": {"img/L_p02_magnet_paperclip.png": {"caption": "The paperc
