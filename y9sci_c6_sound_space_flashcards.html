<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 6 — Sound and space — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
</style>
</head>

atus", "q": "Name the part of the apparatus labelled {n}.", "caption": "The apparatus used to investigate how the mass on a vibrating rule changes the frequency of the vibrations.", "labels": [{"n": 1, "text": "length", "alt": [], "x": 44.6, "y": 13.2, "w": 5.2, "h": 10.2}, {"n": 2, "text": "blocks of wood", "alt": ["wooden blocks", "block of wood"], "x": 16.1, "y": 56.4, "w": 12.1, "h": 10.2}, {"n": 3, "text": "mass taped to the end of the metre rule", "alt": ["mass taped to the end of the rule", "mass", "masses taped to the end"], "x": 74.8, "y": 56.4, "w": 11.3, "h": 30.5}, {"n": 4, "text": "G-clamp", "alt": ["G clamp", "clamp", "screw clamp"], "x": 16.1, "y": 73.3, "w": 6.8, "h": 10.2}], "src": "L|length"}, {"id": "ch06-f011", "type": "hotspot", "topic": "6.1", "source": "opus", "image": "img/L_p08_ruler_apparatus.png", "figure": "L_p08_ruler_apparatus", "q": "Click on the blocks of wood.", "caption": "The apparatus used to investigate how the mass on a vibrating rule changes the frequency of the vibrations.", "target": {"x": 22.2, "y": 61.5, "r": 7.0}, "explain": "The blocks of wood hold the metre rule flat against the bench so that only the free length beyond them vibrates.", "src": "L|blocks of wood"}, {"id": "ch06-f012", "type": "hotspot", "topic": "6.1", "source": "opus", "image": "img/L_p08_ruler_apparatus.png", "figure": "L_p08_ruler_apparatus", "q": "Click on the mass taped to the end of the metre rule.", "caption": "The apparatus used to investigate how the mass on a vibrating rule changes the frequency of the vibrations.", "target": {"x": 80.5, "y": 71.7, "r": 7.0}, "explain": "The mass is the independent variable in this investigation. Adding more mass makes the rule vibrate more slowly, so the frequency falls and the pitch drops.", "src": "L|mass taped to the end of the metre rule"}, {"id": "ch06-f013", "type": "label", "topic": "6.2", "source": "opus", "image": "img/L_p15_waves_cancel.png", "figure": "L_p15_waves_cancel", "q": "Name the part labelle "ring of debris"], "x": 53.0, "y": 76.6, "w": 15.6, "h": 6.9}, {"n": 5, "text": "rocks and dust come together to form the Moon", "alt": ["rocks and dust form the Moon", "the rocks and dust join to form the Moon"], "x": 76.7, "y": 76.6, "w": 19.5, "h": 14.3}], "src": "L|Theia"}, {"id": "ch06-f019", "type": "hotspot", "topic": "6.3", "source": "opus", "image": "img/L_p22_moon_collision.png", "figure": "L_p22_moon_collision", "q": "Click on Theia.", "caption": "The collision theory for the formation of the Moon.", "target": {"x": 9.2, "y": 50.5, "r": 7.0}, "explain": "Theia is the name scientists gave to the newly formed planet, about the size of Mars, that collided with the newly formed Earth.", "src": "L|Theia"}, {"id": "ch06-f020", "type": "hotspot", "topic": "6.3", "source": "opus", "image": "img/L_p22_moon_collision.png", "figure": "L_p22_moon_collision", "q": "Click on the ring of rocks and dust.", "caption": "The collision theory for the formation of the Moon.", "target": {"x": 60.8, "y": 80.0, "r": 7.0}, "explain": "The impact broke rock and dust away from both planets. That material settled into a ring around the Earth before gravity pulled it together into the Moon.", "src": "L|ring of rocks and dust"}, {"id": "ch06-f021", "type": "label", "topic": "6.5", "source": "opus", "image": "img/L_p29_convection_plates.png", "figure": "L_p29_convection_plates", "q": "Name the part of the Earth labelled {n}.", "caption": "Convection currents in the mantle, driven by heat from the core, move the tectonic plates above them.", "labels": [{"n": 1, "text": "tectonic plates", "alt": ["plates", "tectonic plate"], "x": 69.7, "y": 6.9, "w": 20.0, "h": 7.0}, {"n": 2, "text": "convection current", "alt": ["convection currents"], "x": 21.2, "y": 41.0, "w": 15.2, "h": 14.4}, {"n": 3, "text": "convection current", "alt": ["convection currents"], "x": 49.4, "y": 41.0, "w": 15.2, "h": 14.4}, {"n": 4, "text": "mantle", "alt": [], "x": 83.0, "y": 61.9, "w": 9.6, "h": 7.0}, {"n": 5, "text": "outer core", "alt": ["the outer core"], "x": 83.0, "y": 75.6, "w": 7.4, "h": 14.4}], "src": "L|tectonic plates"}, {"id": "ch06-f022", "type": "hotspot", "topic": "6.5", "source": "opus", "image": "img/L_p29_convection_plates.png", "figure": "L_p29_convection_plates", "q": "Click on a convection current in the mantle.", "caption": "Convection currents in the mantle, driven by heat from the core, move the tectonic plates above them.", "target": {"x": 28.8, "y": 48.2, "r": 7.0}, "explain": "Mantle heated by the core expands, becomes less dense and rises; near the crust it cools and sinks again. That circulation is a convection current, and it drags the plates above it along.", "src": "L|convection current"}, {"id": "ch06-f023", "type": "hotspot", "topic": "6.5", "source": "opus", "image": "img/L_p29_convection_plates.png", "figure": "L_p29_convection_plates", "q": "Click on the mantle.", "caption": "Convection currents in the mantle, driven by heat from the core, move the tectonic plates above them.", "target": {"x": 87.8, "y": 65.4, "r": 7.0}, "explain": "The mantle is the thick fluid layer between the core and the crust. It flows far more slowly than water, which is why the plates move only 0.6 to 10 cm per year.", "src": "L|mantle"}, {"id": "ch06-f024", "type": "hotspot", "topic": "6.5", "source": "opus", "image": "img/L_p30_plate_map.png", "figure": "L_p30_plate_map", "q": "Click on the African Plate.", "caption": "The major tectonic plates of the Earth's surface.", "target": {"x": 53.1, "y": 50.1, "r": 7.0}, "explain": "The African Plate carries the continent of Africa. Its western edge and the eastern edge of the South American Plate are the coastlines that fit together in the jigsaw.", "src": "L|African Plate"}, {"id": "ch06-f025", "type": "label", "topic": "6.5", "source": "opus", "image": "img/L_p30_continents_jigsaw.png", "figure": "L_p30_continents_jigsaw", "q": "Name the continent labelled {n} on the jigsaw fit.", "caption": "The continents fit together like a jigsaw puzzle, which is evidence that they were once joined.", "labels": [{"n": 1, "text": "Eurasia", "alt": [], "x": 52.0, "y": 13.4, "w": 10.9, "h": 4.7}, {"n": 2, "text": "North America", "alt": ["N America"], "x": 8.2, "y": 32.8, "w": 12.3, "h": 9.4}, {"n": 3, "text": "Africa", "alt": [], "x": 41.0, "y": 55.2, "w": 8.7, "h": 4.7}, {"n": 4, "text": "South America", "alt": ["S America"], "x": 11.4, "y": 55.9, "w": 12.3, "h": 9.4}, {"n": 5, "text": "India", "alt": [], "x": 60.7, "y": 65.4, "w": 7.8, "h": 4.7}, {"n": 6, "text": "Australia", "alt": [], "x": 66.1, "y": 76.5, "w": 13.5, "h": 4.7}, {"n": 7, "text": "Antarctica", "alt": [], "x": 44.2, "y": 78.0, "w": 15.5, "h": 4.7}], "src": "L|Eurasia"}, {"type": "short", "topic": "6.1", "q": "Loudness depends on two variables. State both.", "answer": "How much the object is vibrating (the range of each vibration), and how far away the vibrating object is.", "keywords": ["range of vibration", "distance", "how far away"], "explain": "Turning a speaker up changes the first one; walking away from it changes the second.", "src": "L|how much the object is vibrating – the greater the range of each vibration, the louder the sound", "id": "ch06-o001", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Explain why a sound gets quieter as you move further away from the object making it.", "answer": "Because of energy dissipation: the energy of the wave spreads out and is transferred to the surroundings, so less reaches your ear.", "keywords": ["energy dissipation", "spreads out", "quieter"], "explain": "The source has not changed at all - only the energy arriving at your ear has.", "src": "L|Sounds get quieter when the distance from the vibrating object increases because of energy dissipation.", "id": "ch06-o002", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Define the amplitude of a sound wave.", "answer": "The maximum distance that particles move, either forward or backward, from their normal position in a sound wave.", "keywords": ["maximum distance", "particles move", "forward", "backward"], "explain": "Note the word maximum - amplitude is not the whole forward-and-back journey, only half of it.", "src": "L|The maximum distance that particles move, either forward or backward in a sound wave, is called the amplitude.", "id": "ch06-o003", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Describe the two ways you can measure the amplitude from a graph of a sound wave.", "answer": "From zero up to the peak (the highest point), or from zero down to the trough (the lowest point). Both give the same value for the same wave.", "keywords": ["zero", "peak", "trough", "same"], "explain": "Measuring from the trough all the way up to the peak would give you twice the amplitude, which is a common mistake.", "src": "L|The amplitude is the distance from zero to the top, or peak, of the graph.", "id": "ch06-o004", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "What are the peak and the trough of a wave graph?", "answer": "The peak is the highest point of the graph and the trough is the lowest point.", "keywords": ["peak", "highest", "trough", "lowest"], "explain": "Peaks and troughs matter again in 6.2, where a peak meeting a trough is what makes two waves cancel.", "src": "L|The peak is the highest point of the graph and the trough is the lowest point.", "id": "ch06-o005", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "State the link between the amplitude of a sound wave and the loudness of the sound.", "answer": "As the amplitude increases, the loudness of the sound increases.", "keywords": ["amplitude", "increases", "loudness"], "explain": "Amplitude is the measurement on the graph; loudness is what your ear reports. They rise together.", "src": "L|as the amplitude of a sound wave increases, the loudness of the sound increases", "id": "ch06-o006", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "What is an oscilloscope, and how does it detect a sound?", "answer": "A piece of equipment that displays graphs of sound waves. It uses a microphone to detect the sound, then produces a graph of it on a screen.", "keywords": ["displays graphs", "microphone", "screen"], "explain": "The microphone is essential - the oscilloscope itself cannot hear anything.", "src": "L|An oscilloscope uses a microphone to detect the sound and then produces a graph of the sound on a screen.", "id": "ch06-o007", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Define the pitch of a sound.", "answer": "How high or low the sound appears on a musical scale.", "keywords": ["high", "low", "musical scale"], "explain": "Pitch and loudness are independent: a sound can be high and quiet, or low and loud.", "src": "L|The pitch of a sound is how high or low the sound appears on a musical scale.", "id": "ch06-o008", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "When you shorten the vibrating part of a ruler, the pitch changes. Explain why.", "answer": "Shortening it makes the ruler vibrate faster, and the faster the vibrations the higher the pitch.", "keywords": ["faster", "vibrations", "higher pitch", "shorter"], "explain": "The same rule explains a guitar: pressing a string against a fret shortens it and raises the note.", "src": "L|The faster the vibrations, the higher the pitch of the sound.", "id": "ch06-o009", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Define the frequency of a sound wave, and give its unit.", "answer": "The number of vibrations in each second. It is measured in hertz (Hz).", "keywords": ["number of vibrations", "each second", "hertz", "Hz"], "explain": "Per means in each, so 500 Hz means 500 vibrations happen every second.", "src": "L|The number of vibrations in each second is called frequency.", "id": "ch06-o010", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "State the link between the frequency of a sound wave and its pitch.", "answer": "As the frequency of a sound wave increases, the pitch of the sound also increases.", "keywords": ["frequency", "increases", "pitch"], "explain": "Amplitude controls loudness; frequency controls pitch. Keep the two pairs apart.", "src": "L|As the frequency of a sound wave increases, the pitch of the sound also increases.", "id": "ch06-o011", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "On a graph with time on the horizontal axis, how would you recognise a wave of higher frequency?", "answer": "It would show more complete waves in the same time.", "keywords": ["more waves", "same time", "horizontal axis", "time"], "explain": "This only works because the horizontal axis is time. Squeezing more waves into the same width means each vibration took less time.", "src": "L|The horizontal axis of this graph is time, so a wave with a higher frequency will have more waves in the same time.", "id": "ch06-o012", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Two oscilloscope traces show a higher pitch sound and a lower pitch sound, and their amplitudes are the same. What does that tell you about the two sounds?", "answer": "They are equally loud, because loudness depends on amplitude and the amplitudes are equal.", "keywords": ["same amplitude", "equally loud", "loudness"], "explain": "Changing the pitch of a note does not automatically change how loud it is.", "src": "L|You will also notice from the waves of higher and lower pitch, that their amplitudes are the same.", "id": "ch06-o013", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "On a gayageum, the bridges can be moved along the strings. Explain the effect this has on the note.", "answer": "Moving a bridge changes the length of string that vibrates, and the shorter the string the higher the pitch.", "keywords": ["length", "shorter", "higher pitch", "vibrates"], "explain": "Any instrument with movable stops works this way - the player is really changing the vibrating length.", "src": "L|The pegs, called bridges, can be moved to change the length of each string that vibrates. The shorter the string, the higher the pitch.", "id": "ch06-o014", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "In the ruler investigation, how is the frequency of the vibration defined?", "answer": "The number of times the ruler moves from one position back to the same position in 1 second.", "keywords": ["number of times", "same position", "1 second"], "explain": "One complete vibration is out and back again, not just out. Counting halves would double your answer.", "src": "L|The frequency of the vibration is the number of times the ruler moves from one position back to the same position in 1 second.", "id": "ch06-o015", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "In the ruler investigation, state the independent variable and one control variable.", "answer": "Independent variable: the mass taped to the end of the rule. Control variable: the length of rule that is free to vibrate.", "keywords": ["mass", "independent", "length", "control"], "explain": "Length has to be controlled precisely because it also changes frequency - if it varied, you could not say the mass caused the change.", "src": "L|In this investigation, you will keep the length the same and change the mass.", "id": "ch06-o016", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "A piano pedal makes a note quieter without changing its pitch. Suggest what it does to the amplitude and to the frequency of the string vibration.", "answer": "It decreases the amplitude of the vibration; the frequency is unchanged.", "keywords": ["decreases", "amplitude", "frequency", "unchanged"], "explain": "This is the amplitude-loudness and frequency-pitch pairing used in reverse: quieter but same note means amplitude only.", "src": "L|pedals decreases the loudness of the note without changing the pitch", "id": "ch06-o017", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "Explain why counting the vibrations of a loaded metre rule for 10 seconds and dividing by 10 is better than counting for 1 second.", "answer": "Counting over 10 seconds gives a larger count, so a miscount of one vibration causes a much smaller percentage error in the frequency.", "keywords": ["10 seconds", "larger count", "error", "more accurate"], "explain": "It is the same reasoning as timing 10 swings of a pendulum rather than one.", "src": "L|This gives the frequency in Hz, which is the number of vibrations in 1 second.", "id": "ch06-o018", "source": "opus"}, {"type": "short", "topic": "6.1", "q": "A guitar has six strings of equal length but different masses. Suggest how the mass of a string affects the note it produces.", "answer": "A string with more mass vibrates more slowly, so it has a lower frequency and produces a lower pitch note.", "keywords": ["more mass", "slower", "lower frequency", "lower pitch"], "explain": "The strings are the same length, so mass is the only variable left to explain the six different notes.", "src": "L|The strings have different masses.", "id": "ch06-o019", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Why are water waves used as an analogy for sound waves, even though the particles do not move in the same way?", "answer": "Because the analogy still helps to explain how waves behave, and water waves are easy to see whereas sound waves are not.", "keywords": ["analogy", "helps explain", "behave", "easy to see"], "explain": "An analogy does not have to be right about everything - only about the part you are using it for.", "src": "L|Particles in water waves do not move in the same way as particles in a sound wave, but the analogy helps explain how waves behave.", "id": "ch06-o020", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Define interference.", "answer": "The effect that is produced when waves meet each other.", "keywords": ["effect", "waves meet"], "explain": "Interference is the general word; reinforcing and cancelling are its two results.", "src": "L|The effect that is produced when the waves meet each other is called interference.", "id": "ch06-o021", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Can a sound wave interfere with a water wave? Explain your answer.", "answer": "No. Interference can only happen when the waves are of the same type, so sound can interfere with sound but not with water waves.", "keywords": ["no", "same type", "sound", "water"], "explain": "Two waves have to be the same kind of disturbance before their amplitudes can be added together.", "src": "L|Interference can only happen when the waves are of the same type.", "id": "ch06-o022", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Under what conditions is interference easiest to detect?", "answer": "When the waves have the same frequency and the same amplitude.", "keywords": ["same frequency", "same amplitude"], "explain": "This is also why the two nails in the water tray are fixed to one piece of wood - it forces both waves to match.", "src": "L|Interference is easiest to detect when the waves have the same frequency and the same amplitude.", "id": "ch06-o023", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Name the two effects that interference can produce.", "answer": "The waves can reinforce each other, or the waves can cancel each other.", "keywords": ["reinforce", "cancel"], "explain": "Both happen in the same pattern at the same time, just at different places.", "src": "L|Interference can produce two effects: the waves can reinforce or the waves can cancel each other.", "id": "ch06-o024", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Describe how two sound waves must meet in order to reinforce.", "answer": "They must meet with the peaks together and the troughs together.", "keywords": ["peaks together", "troughs together"], "explain": "Peaks lining up means both waves are pushing the particles the same way at the same moment.", "src": "L|Waves will reinforce, when they meet with the peaks together and with the troughs together.", "id": "ch06-o025", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "When two waves reinforce, what happens to the amplitude and what happens to the frequency?", "answer": "The amplitudes of the two waves are added together, so the amplitude increases. The frequency does not change.", "keywords": ["amplitudes", "added together", "frequency", "does not change"], "explain": "Because only the amplitude changed, the sound gets louder but stays the same note.", "src": "L|the amplitudes of the two waves that interfere are added together", "id": "ch06-o026", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "At a concert with a loudspeaker on each side of the stage, some people hear certain pitches louder than usual. Explain why.", "answer": "Sound waves from the two loudspeakers meet at those positions with their peaks together, so they reinforce and the amplitude is larger.", "keywords": ["two loudspeakers", "meet", "reinforce", "larger amplitude"], "explain": "Move a few steps sideways and the effect changes, because the distance from each speaker changes.", "src": "L|This can be caused by the sound waves from the two loudspeakers meeting and reinforcing.", "id": "ch06-o027", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "In the diagram of the sound from two loudspeakers, what do the curved lines represent, and what happens where two of them cross?", "answer": "The curved lines represent peaks of amplitude in the sound waves. Where two lines cross, the waves reinforce and a listener there hears a louder sound.", "keywords": ["peaks", "cross", "reinforce", "louder"], "explain": "The diagram only draws the peaks. Troughs also meet and reinforce, but they are hard to show.", "src": "L|The curved lines in the diagram represent peaks of amplitude in the sound waves. Where two of these lines cross, the waves will reinforce.", "id": "ch06-o028", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Explain why it is very unlikely that anyone in a concert audience hears complete silence.", "answer": "Sound waves reflect off objects and off people in the audience, adding many more waves to the pattern, so it is very unlikely that only two identical waves meet to cancel.", "keywords": ["reflect", "objects", "people", "many more waves"], "explain": "Complete cancellation needs exactly two matched waves and nothing else - a real room never provides that.", "src": "L|This is because the sound waves will be reflected off objects, including off people in the audience.", "id": "ch06-o029", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Describe how two sound waves must meet in order to cancel.", "answer": "They must meet with the peaks of one wave together with the troughs of the other, and the waves must have equal amplitude.", "keywords": ["peaks", "troughs", "together", "equal amplitude"], "explain": "Compare with reinforcing, where peaks meet peaks. One word changes, and the result flips from loudest to silent.", "src": "L|Waves will cancel when they meet with the peaks and troughs together.", "id": "ch06-o030", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "What does the word cancel mean when it is used about waves? Use a number example.", "answer": "It means adding together to make zero, for example 2 + (-2) = 0, where a peak of +2 meets a trough of -2.", "keywords": ["adding together", "zero", "peak", "trough"], "explain": "A trough is a negative amplitude, which is why adding it to an equal peak leaves nothing.", "src": "L|When you add a positive number to a negative number of equal size, you get zero; for example, 2 + (−2) = 0.", "id": "ch06-o031", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "State the two conditions that must be met for two sound waves to cancel completely.", "answer": "Their frequencies must be the same and their amplitudes must be the same.", "keywords": ["frequencies", "same", "amplitudes"], "explain": "If the amplitudes differ, the larger wave is only partly cancelled and a quieter sound remains.", "src": "L|For two sound waves to cancel completely, their frequencies must be the same and their amplitudes must be the same.", "id": "ch06-o032", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Explain how noise cancelling headphones work.", "answer": "A small microphone picks up the sound from the surroundings. The headphones analyse it, then create a sound wave of the same amplitude and frequency but out of phase with it, so the two waves cancel.", "keywords": ["microphone", "same amplitude", "frequency", "out of phase", "cancel"], "explain": "Out of phase means the new wave's peaks arrive where the original wave's troughs are.", "src": "L|The headphones pick up the sound from the surroundings, then analyse the sound wave and create another sound wave", "id": "ch06-o033", "source": "opus"}, {"type": "short", "topic": "6.2", "q": "Two sound waves have equal frequencies of 600 Hz and one has an amplitude of 0.25 mm. State the amplitude the other wave needs in order to cancel it, and the amplitude after they cancel.", "answer": "The other wave must also have an amplitude of 0.25 mm. After cancelling, the amplitude is zero.", "keywords": ["0.25 mm", "zero"], "explain": "Equal amplitudes are required, and the answer after cancelling is always zero - which means no sound.", "src": "L|Two sound waves have equal frequencies of 600 Hz. The amplitude of one of the waves is 0.25 mm.", "id": "ch06-o034", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "What did scientists in the early twentieth century think about how the Moon formed?", "answer": "That the Moon was formed by splitting away from the Earth, soon after the Earth was formed.", "keywords": ["splitting away", "Earth", "soon after"], "explain": "This is the theory the collision theory replaced, not a wrong idea nobody ever held.", "src": "L|scientists thought that the Moon was formed by splitting away from the Earth, soon after the Earth was formed", "id": "ch06-o035", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "The splitting theory predicted that the Moon would still be moving away from Earth. What do accurate measurements show?", "answer": "That the Moon is still moving away from Earth, at a rate of about 4 cm each year.", "keywords": ["moving away", "4 cm", "each year"], "explain": "The measurement matched the prediction, but a single matching prediction is not enough to confirm a theory.", "src": "L|the Moon is still moving away from Earth – at a rate of about 4 cm each year.", "id": "ch06-o036", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "In what year was the collision theory first suggested, and what is its other name?", "answer": "It was suggested in 1974, and is more commonly called the giant impact hypothesis.", "keywords": ["1974", "giant impact hypothesis"], "explain": "Searching for either name will find the same body of evidence.", "src": "L|In 1974, it was suggested that the Moon was formed in a different way. This is called the collision theory.", "id": "ch06-o037", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Why do scientists currently prefer the collision theory to other theories of the Moon's formation?", "answer": "Because there is more evidence that supports the collision theory than any other current theory.", "keywords": ["more evidence", "supports", "than any other"], "explain": "Preferring a theory is about the weight of evidence, not about proof - the contradicting evidence has not gone away.", "src": "L|There is more evidence that supports the collision theory than any other current theory.", "id": "ch06-o038", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Describe the object that the collision theory says struck the Earth.", "answer": "A newly formed planet, about the same size as Mars, which scientists have called Theia.", "keywords": ["newly formed planet", "size of Mars", "Theia"], "explain": "Theia was a planet, not an asteroid - the size is what makes the theory able to produce something as large as the Moon.", "src": "L|Scientists have called the colliding planet Theia.", "id": "ch06-o039", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "According to the collision theory, how were the Earth and the Moon formed after the impact?", "answer": "The Earth was formed from the two planets joined together, and the Moon was formed when the rocks and dust broken off by the collision were pulled together by gravity.", "keywords": ["two planets joined", "rocks and dust", "pulled together", "gravity"], "explain": "Both bodies come out of the same collision, which is why the theory predicts their rocks should match.", "src": "L|The Moon was formed when the rocks and dust was pulled together by gravity.", "id": "ch06-o040", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Give two pieces of evidence that support the collision theory, based on the Moon itself.", "answer": "The Moon is less dense than the Earth, and samples of Moon rock show that its surface was once molten.", "keywords": ["less dense", "molten", "surface"], "explain": "Lower density fits material thrown off the outer layers, which contain less iron than the Earth's core.", "src": "L|The Moon is less dense than the Earth. Samples of rock from the Moon show that its surface was once molten.", "id": "ch06-o041", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Give two further pieces of evidence supporting the collision theory, one about the Moon's core and one from outside the Solar System.", "answer": "The Moon has a small iron core, similar to the Earth's, and there is evidence outside the Solar System of similar collisions causing rings of rock and dust.", "keywords": ["small iron core", "outside the Solar System", "rings of rock and dust"], "explain": "Seeing the same process happening elsewhere shows the theory is not inventing a one-off event.", "src": "L|The Moon has a small iron core, similar to the Earth. There is evidence outside the Solar System of similar collisions causing rings of rock and dust.", "id": "ch06-o042", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "State one piece of evidence about the Earth's surface that contradicts the collision theory.", "answer": "The surface of the Earth does not appear ever to have been molten, yet a collision that formed the Moon would have melted it.", "keywords": ["surface", "never molten", "would have melted"], "explain": "The theory has an answer - the surface later solidified - but the direct evidence for melting is missing.", "src": "L|The surface of the Earth does not appear to ever have been molten.", "id": "ch06-o043", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Explain why Venus having no moon is treated as evidence against the collision theory.", "answer": "Collisions in the early years of the Solar System would have been common, so scientists would have expected Venus to have gained a moon in the same way.", "keywords": ["Venus", "no moon", "common", "expected"], "explain": "If a process was common, it should have left more than one example.", "src": "L|Venus has no moon. Collisions in the early years of the Solar System would have been common", "id": "ch06-o044", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Explain why the composition of the Moon's rocks is treated as evidence against the collision theory.", "answer": "If the Moon formed mainly from Theia, its rocks would be expected to resemble Theia's rather than Earth's. In fact the composition of the Moon is more similar to Earth.", "keywords": ["Theia", "expected", "more similar to Earth"], "explain": "The same fact appears on both sides of the table: matching rocks support a shared origin but conflict with the Moon coming mostly from Theia.", "src": "L|The composition of rocks on the Moon would be expected to be more similar to rocks on Theia than rocks on Earth.", "id": "ch06-o045", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Phobos and Deimos were captured asteroids. Suggest how their rock composition compares with the rock of Mars, and how it would differ if they had formed by a collision with Mars.", "answer": "As captured asteroids their composition would be different from the rock of Mars. If they had formed in a collision with Mars, their composition would be similar to Mars.", "keywords": ["different", "captured", "similar", "collision"], "explain": "This is exactly the reasoning used on the Earth-Moon pair, applied to a second planet as a test.", "src": "L|Scientists have evidence that Phobos and Deimos are asteroids that were captured by the gravity of Mars", "id": "ch06-o046", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "Collisions between planet-sized objects were common soon after the Solar System formed. Suggest why they are no longer common.", "answer": "Most of the loose planet-sized objects have already collided and joined together into the planets, so far fewer are left to collide, and those that remain are spread out in stable orbits.", "keywords": ["already collided", "joined together", "fewer left", "stable orbits"], "explain": "The process removes its own raw material, so it must slow down over time.", "src": "L|Models of the formation of the Solar System show that collisions between planet-size objects would have been common soon after the Solar System formed.", "id": "ch06-o047", "source": "opus"}, {"type": "short", "topic": "6.3", "q": "When is the word moon written with a capital M, and when with a small m?", "answer": "With a capital, Moon means the large natural object that orbits the Earth. With a small letter, moon means any natural object orbiting another planet.", "keywords": ["capital", "orbits the Earth", "small letter", "any natural object"], "explain": "So Mars has two moons, but only the Earth has the Moon.", "src": "L|When used with a capital, as in Moon, the word refers to the large natural object that orbits the Earth", "id": "ch06-o048", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "What is a nebula?", "answer": "A cloud of dust and gas in space.", "keywords": ["cloud", "dust", "gas", "space"], "explain": "Nebulae is the plural; one of them is a nebula.", "src": "L|Nebulae are clouds of dust and gas in space.", "id": "ch06-o049", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Name the two gases that nebulae are mostly made of, and say which is more plentiful.", "answer": "Mostly hydrogen, with a smaller quantity of helium.", "keywords": ["hydrogen", "helium", "smaller quantity"], "explain": "These are the same two gases that make up a star, which is what a stellar nursery goes on to build.", "src": "L|The gases found in nebulae are mostly hydrogen and a smaller quantity of helium.", "id": "ch06-o050", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "A nebula the same size as the Earth would have a mass of only a few kilograms. Explain what this tells you about a nebula.", "answer": "That the particles of gas and dust in a nebula are very far apart, so its density is extremely low.", "keywords": ["particles", "very far apart", "low density"], "explain": "A nebula looks solid in a photograph only because you are looking through an enormous depth of it.", "src": "L|A nebula the same size as the Earth would have a mass of only a few kilograms!", "id": "ch06-o051", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "How large are most nebulae compared with the Solar System?", "answer": "Most nebulae are very large - many are more than 10 000 times bigger than the Solar System.", "keywords": ["10 000 times", "bigger", "Solar System"], "explain": "This is why a nebula can hold enough material to make many stars at once.", "src": "L|Many nebulae are more then 10 000 times bigger than the Solar System!", "id": "ch06-o052", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Describe one way in which a nebula can form.", "answer": "Some nebulae form when giant stars reach the end of their life and explode, sending dust and gas over a wide area of space.", "keywords": ["giant stars", "end of their life", "explode", "dust and gas"], "explain": "Star material is recycled: an exploding star supplies the cloud that later builds new stars.", "src": "L|Some nebulae form when giant stars reach the end of their life.", "id": "ch06-o053", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Name the nebula most easily seen from the northern hemisphere and the one most easily seen from the southern hemisphere.", "answer": "The Orion nebula from the northern hemisphere, and the Tarantula nebula from the southern hemisphere. Both can be seen without a telescope.", "keywords": ["Orion", "northern", "Tarantula", "southern"], "explain": "The northern hemisphere is the part of the Earth north of the equator; the southern hemisphere is the part south of it.", "src": "L|If you live in the southern hemisphere, the easiest nebula to see is the Tarantula nebula", "id": "ch06-o054", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "What is a stellar nursery?", "answer": "An area in space where stars are formed.", "keywords": ["area in space", "stars", "formed"], "explain": "Stellar means to do with stars, and a nursery is a place where young things are cared for.", "src": "L|A stellar nursery is an area in space where stars are formed.", "id": "ch06-o055", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Do all nebulae act as stellar nurseries?", "answer": "No - only some types of nebulae act as stellar nurseries.", "keywords": ["no", "some types", "only"], "explain": "A nebula needs enough material collapsing under gravity before any star can begin to form.", "src": "L|Some types of nebulae act as stellar nurseries.", "id": "ch06-o056", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Outline the process by which a new star forms in a stellar nursery.", "answer": "Dust and gas start to collapse together under gravity. As more mass collects, the inward force of gravity increases, so the pressure inside increases. The high pressure causes heat, and the heat makes atoms react, so the new star gives out heat and light.", "keywords": ["collapse", "gravity", "mass", "pressure", "heat", "react", "light"], "explain": "Each step causes the next: more mass, more gravity, more pressure, more heat.", "src": "L|In a stellar nursery, the dust and gas can start to collapse together under the force of gravity.", "id": "ch06-o057", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Explain how high pressure inside a forming star leads to it giving out light.", "answer": "The high pressure causes heat, and the heat can cause atoms to react with each other, which makes the new star give out heat and light.", "keywords": ["pressure", "heat", "atoms react", "heat and light"], "explain": "The star does not shine because it is squashed; it shines because the squashing gets it hot enough for reactions to start.", "src": "L|The high pressure causes heat. The heat can cause atoms to react with each other, causing the new star to give out heat and light.", "id": "ch06-o058", "source": "opus"}, {"type": "short", "topic": "6.4", "q": "Young stars in a stellar nursery are harder to see than older stars the same distance away. Suggest two reasons why.", "answer": "Some young stars are only about half the mass of the Sun and have not yet reached their full brightness, and the dust and gas of the cloud around them blocks some of their light.", "keywords": ["half the mass", "not yet full brightness", "dust and gas", "blocks"], "explain": "The photographs show the cloud lit up by the stars, which is a sign of how much material lies in the way.", "src": "L|Some of these stars are only half the mass of the Sun and have not yet reached their full brightness.", "id": "ch06-o059", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Describe the outer layers of the Earth.", "answer": "The outer layers are the solid, rocky crust, which rests on the more fluid mantle.", "keywords": ["solid", "rocky crust", "fluid mantle"], "explain": "The crust is not floating on liquid rock - the mantle is a very thick fluid that flows extremely slowly.", "src": "L|the outer layers of the Earth are the solid, rocky crust which rests on the more fluid mantle.", "id": "ch06-o060", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Where does the heat of the Earth's inner core come from?", "answer": "From thermal energy left over from the formation of the Earth, from friction inside the Earth, and from the type of reactions that happen in the rocks.", "keywords": ["left over", "formation", "friction", "reactions"], "explain": "None of it comes from the Sun, which is why the inside of the Earth stays hot day and night.", "src": "L|thermal energy left over from the formation of the Earth, friction inside the Earth and the type of reactions that happen in the rocks", "id": "ch06-o061", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Describe how a convection current happens in the Earth's mantle.", "answer": "The inner part of the mantle is heated by the core. The heated fluid expands and becomes less dense than the fluid around it, so it rises towards the crust. There it cools and sinks again, producing a convection current.", "keywords": ["heated", "expands", "less dense", "rises", "cools", "sinks"], "explain": "It is the same expand-rise-cool-sink cycle as convection in water or air, only far slower.", "src": "L|This hotter, less dense fluid in the mantle rises towards the crust, cools and sinks again, resulting in a convection current.", "id": "ch06-o062", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Explain why convection currents in the mantle move very slowly.", "answer": "Because the mantle is a very thick fluid and does not flow easily like water.", "keywords": ["thick fluid", "does not flow easily", "slowly"], "explain": "Thick here means high viscosity, not deep - it resists flowing.", "src": "L|The mantle is a very thick fluid and does not flow easily like water, so the convection currents move very slowly.", "id": "ch06-o063", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Explain how convection currents cause tectonic plates to move.", "answer": "As the convection currents move across underneath the crust, they drag the tectonic plates that make up the crust along with them.", "keywords": ["convection currents", "underneath", "crust", "pulled along"], "explain": "The plates are passengers - they do not move themselves.", "src": "L|As the convection currents in the mantle move across underneath the crust, the tectonic plates that make up the crust are pulled along.", "id": "ch06-o064", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "How fast do tectonic plates move?", "answer": "Slowly, varying between 0.6 and 10 cm per year.", "keywords": ["0.6", "10 cm", "per year"], "explain": "Over 140 million years even 3 cm a year adds up to thousands of kilometres, which is how Africa and South America separated.", "src": "L|the movement of the tectonic plates is also slow, varying between 0.6 and 10 cm per year.", "id": "ch06-o065", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "The continents look as though they could fit together like a jigsaw. Explain how this is evidence for tectonic plates.", "answer": "It supports the hypothesis that there was once one large continent that separated. The separate parts became tectonic plates, driven apart by convection currents in the mantle.", "keywords": ["one large continent", "separated", "tectonic plates", "convection currents"], "explain": "The fit is between the continental coasts, not the present-day shorelines drawn on a school map.", "src": "L|Scientists say that this continental jigsaw appearance is evidence for tectonic plates.", "id": "ch06-o066", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "What is the fossil record, and what is a fossil?", "answer": "The fossil record is the collection of thousands of fossils that give us information about the time before humans were on Earth. Fossils are the remains of dead animals and plants that have turned to stone over millions of years.", "keywords": ["collection", "before humans", "remains", "turned to stone"], "explain": "It is a record in the same sense as a written record - evidence left behind that can be read afterwards.", "src": "L|The fossil record is the name given to the collection of thousands of fossils that provide us with information about the time before humans were on Earth.", "id": "ch06-o067", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Explain how Mesosaurus fossils provide evidence for tectonic plate movement.", "answer": "Mesosaurus fossils are found in the parts of Africa and South America that fit together in the jigsaw. Mesosaurus lived at the coast and in shallow water and could not have crossed the 5000 km Atlantic Ocean, so those lands must once have been joined.", "keywords": ["Africa", "South America", "fit together", "shallow water", "could not have crossed"], "explain": "The argument depends on the animal's habitat: a deep-ocean swimmer would prove nothing.", "src": "L|It is not likely that they would have crossed the 5000 km wide Atlantic Ocean that now separates these continents.", "id": "ch06-o068", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Explain how fossils of the plant Glossopteris provide evidence for tectonic plates.", "answer": "300 million-year-old Glossopteris fossils are found in Antarctica, India, Australia, Africa and South America, which gives evidence that these continents were once joined.", "keywords": ["Glossopteris", "Antarctica", "India", "Australia", "once joined"], "explain": "A plant on five now-separate continents is far easier to explain by moving land than by seeds crossing oceans.", "src": "L|300 million-year-old fossils of the plant Glossopteris have been found in Antarctica, India, Australia, Africa and South America.", "id": "ch06-o069", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "How often have the Earth's magnetic poles swapped positions?", "answer": "Almost 200 times in the last 100 million years - around 780 000 years ago a compass needle would have pointed south.", "keywords": ["200 times", "100 million years", "780 000", "south"], "explain": "Reversals are what make the alignment of magnetic crystals useful as a record.", "src": "L|Scientists now know that the Earth’s magnetic poles have swapped positions almost 200 times in the last 100 million years.", "id": "ch06-o070", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Explain how magnetic crystals in rock record the direction of the Earth's magnetic field.", "answer": "Magnetic crystals in molten rock line up to point north like a compass needle. When the rock solidifies the crystals are locked in place, so their alignment shows the field direction at the time the rock became solid.", "keywords": ["molten", "line up", "compass needle", "solidifies", "alignment"], "explain": "Alignment means to line up in a particular way - it is the recorded direction, not the magnetism itself.", "src": "L|Magnetic crystals in molten rocks will line up to point north in the same way as a compass needle.", "id": "ch06-o071", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "What happens at mid-oceanic ridges?", "answer": "Magma comes up from the mantle and solidifies to form new rock, and this action pushes the continents away from each other.", "keywords": ["magma", "mantle", "solidifying", "new rocks", "pushes"], "explain": "New crust is being made here, which is why the rock at the ridge itself is the youngest.", "src": "L|In these locations, called mid-oceanic ridges, magma is coming up from the mantle and solidifying to form new rocks.", "id": "ch06-o072", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Rock further from a mid-oceanic ridge contains magnetic crystals with the opposite alignment. What does this show?", "answer": "That those rocks are much older - they solidified when the Earth's magnetic field pointed the other way, and have since been pushed away from the ridge.", "keywords": ["much older", "opposite alignment", "pushed away"], "explain": "The sea floor works like a tape recording: stripes of alternating alignment spreading out from the ridge.", "src": "L|Rocks further away from these ridges contain magnetic crystals with the opposite alignment. This suggests that these rocks are much older.", "id": "ch06-o073", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Where do most earthquakes and volcanoes occur, and why is this evidence for tectonic plates?", "answer": "Most recorded volcanoes and earthquakes occur close to tectonic plate boundaries. That is what the moving-plate hypothesis predicts, since it is at the boundaries that plates meet and grind past each other.", "keywords": ["close to", "plate boundaries", "predicts", "meet"], "explain": "Careful wording matters: most, not all. Some earthquakes and volcanoes do occur away from boundaries.", "src": "L|Most of the volcanoes and earthquakes that have been recorded occur close to the tectonic plate boundaries", "id": "ch06-o074", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "Africa and South America are now about 5000 km apart and separated about 140 million years ago. Calculate the average speed of separation in cm per year.", "answer": "5000 km = 500 000 000 cm. 500 000 000 / 140 000 000 = about 3.6 cm per year.", "keywords": ["500 000 000", "140 000 000", "3.6 cm per year"], "explain": "The answer lands inside the 0.6 to 10 cm per year range measured for plates today, which is a useful check.", "src": "L|The distance between the coasts of Africa and South America is currently about 5000 km.", "id": "ch06-o075", "source": "opus"}, {"type": "short", "topic": "6.5", "q": "What is Pangaea, and when do scientists think it existed?", "answer": "Pangaea is the name given to the single large continent that many scientists think once existed on Earth, between 335 and 175 million years ago. It started to break apart around 175 million years ago.", "keywords": ["Pangaea", "one large continent", "335", "175 million"], "explain": "Pangaea is the name attached to the jigsaw hypothesis, which the fossil and magnetic evidence both support.", "src": "L|They have called this continent Pangaea and they think that it existed between 335 and 175 million years ago.", "id": "ch06-o076", "source": "opus"}, {"source": "nblm", "topic": "6.1", "src": "L|The number of vibrations in each second is called frequency.", "explain": "Frequency specifically measures how many complete vibrations happen in one second.", "type": "mcq", "q": "What does the frequency of a sound wave measure?", "options": ["The total distance that particles move forward and backward.", "The total volume or loudness of the sound wave.", "The number of vibrations in each second.", "The direction the sound is travelling in."], "answer": 2, "id": "ch06-n001", "hold": false}, {"source": "nblm", "topic": "6.1", "src": "L|The faster the vibrations, the higher the pitch of the sound.", "explain": "Pitch is directly related to the speed of the vibrations, which determines the frequency.", "type": "mcq", "q": "How does the vibration of an object affect the pitch of the sound it makes?", "options": ["The larger the amplitude of vibrations, the higher the pitch.", "The faster the vibrations, the higher the pitch of the sound.", "The slower the vibrations, the higher the pitch of the sound.", "The longer the vibrating object, the higher the pitch."], "answer": 1, "id": "ch06-n002", "hold": false}, {"source": "nblm", "topic": "6.1", "src": "L|the greater the range of each vibration, the louder the sound", "explain": "Loudness depends on the amplitude, meaning how far the particles move from their resting position during each vibration.", "type": "mcq", "q": "What physical change in a sound wave causes the sound to be louder?", "options": ["The vibrating object moves backward and forward more times per second.", "The sound wave travels faster through the air to reach your ear.", "The object is vibrating with a greater range for each vibration.", "The sound wave has a higher frequency and a higher pitch."], "answer": 2, "id": "ch06-n003", "hold": false}, {"source": "nblm", "topic": "6.2", "src": "L|the headphones create a sound wave that will cancel with the sound wave from the surroundings", "explain": "Headphones use wave interference to produce a new sound wave that exactly cancels the incoming wave of background noise.", "type": "mcq", "q": "How do noise-cancelling headphones work to remove background noise?", "options": ["They create a thick physical barrier that blocks all air particles from vibrating.", "They absorb the sound waves into a thick sponge material inside the ear cups.", "They create a sound wave that will cancel with the sound wave from the surroundings.", "They produce a high-pitch sound that distracts your ears from hearing other things."], "answer": 2, "id": "ch06-n006", "hold": false}, {"source": "nblm", "topic": "6.3", "src": "L|The Moon has a small iron core, similar to the Earth.", "explain": "The similarity in core structure and rock composition between the Earth and Moon supports the idea that they were formed from the same collision event.", "type": "mcq", "q": "Which of these facts is used as evidence to support the collision theory for the Moon's formation?", "options": ["The Moon has a very large inner core compared to the Earth.", "The surface of the Earth does not appear ever to have been molten.", "The Moon has a small iron core, similar to the Earth.", "Venus has no moon, which proves the Solar System had no early collisions."], "answer": 2, "id": "ch06-n009", "hold": false}, {"source": "nblm", "topic": "6.4", "src": "L|Nebulae are clouds of dust and gas in space.", "explain": "Nebulae are vast, low-density regions of space filled primarily with gas and dust particles.", "type": "mcq", "q": "What are nebulae made of?", "options": ["Solid rocks and ice particles orbiting a planet.", "Clouds of dust and gas in space.", "Clusters of millions of old stars packed tightly together.", "Giant empty vacuums in space where there are no particles at all."], "answer": 1, "id": "ch06-n010", "hold": false}, {"source": "nblm", "topic": "6.5", "src": "W|The alignment of magnetic materials in rocks varies with the age of the rock.", "explain": "Symmetrical patterns of magnetic alignment on either side of the ridge show that new rock is continually forming and pushing the older rock apart over millions of years.", "type": "mcq", "q": "What evidence from rocks found at the mid-ocean ridges supports the movement of tectonic plates?", "options": ["The rocks at the ridges are completely free of any magnetic materials.", "The rocks at the ridges are much older than rocks found on the continents.", "The alignment of magnetic materials in rocks varies with the age of the rock.", "The rocks are perfectly flat and show no signs of volcanic activity."], "answer": 2, "id": "ch06-n015", "hold": false}, {"source": "nblm", "topic": "6.1", "src": "L|The number of vibrations in each second is called frequency.", "explain": "The book says: The number of vibrations in each second is called frequency.", "type": "fill", "q": "The number of vibrations in each second is called ____.", "answer": ["frequency"], "id": "ch06-n016", "hold": false}, {"source": "nblm", "topic": "6.1", "src": "L|The faster the vibrations, the higher the pitch of the sound.", "explain": "The book says: The faster the vibrations, the higher the pitch of the sound.", "type": "fill", "q": "The faster the vibrations, the higher the ____ of the sound.", "answer": ["pitch"], "id": "ch06-n017", "hold": false}, {"source": "nblm", "topic": "6.3", "src": "L|The Moon has a small iron core, similar to the Earth.", "explain": "The book says: The Moon has a small iron core, similar to the Earth.", "type": "fill", "q": "The Moon has a small iron ____, similar to the Earth.", "answer": ["core"], "id": "ch06-n021", "hold": false}, {"source": "nblm", "topic": "6.4", "src": "L|The gases found in nebulae are mostly hydrogen and a smaller quantity of helium.", "explain": "The book says: The gases found in nebulae are mostly hydrogen and a smaller quantity of helium.", "type": "fill", "q": "The gases found in nebulae are mostly hydrogen and a smaller quantity of ____.", "answer": ["helium"], "id": "ch06-n023", "hold": false}, {"source": "nblm", "topic": "6.5", "src": "L|They have called this continent Pangaea and they think that it existed between 335 and 175 million years ago.", "explain": "The book says: They have called this continent Pangaea and they think that it existed between 335 and 175 million years ago.", "type": "fill", "q": "They have called this continent ____ and they think that it existed between 335 and 175 million years ago.", "answer": ["Pangaea", "Pangea"], "id": "ch06-n025", "hold": false}, {"source": "nblm", "topic": "6.2", "src": "L|Move the pipe up or down in the water so the length of pipe above the water changes.", "explain": "A marker looks for: move the pipe, length changes", "type": "short", "q": "In the investigation of sound waves reinforcing over a plastic pipe, suggest what must be done to the pipe to find the loudest sound.", "answer": "You must carefully move the pipe up or down in the water so that the length of the pipe above the water changes until it reinforces the sound.", "keywords": ["move the pipe", "length changes"], "id": "ch06-n038", "hold": false}, {"source": "nblm", "topic": "6.4", "src": "W|block the light from stars that are behind them, so they appear almost black", "explain": "A marker looks for: emit own energy, block the light", "type": "short", "q": "Explain the difference between an emission nebula and a dark nebula.", "answer": "Emission nebulae emit their own energy and appear bright, while dark nebulae block the light from stars behind them and appear almost black.", "keywords": ["emit own energy", "block the light"], "id": "ch06-n045", "hold": false}, {"source": "nblm", "topic": "6.1", "src": "L|The maximum distance that particles move, either forward or backward in a sound wave, is called the amplitude.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'The amplitude of a sound wave is the total distance a particle moves forward and backward combined.' Explain what is wrong with this.", "answer": "Amplitude is only the maximum distance particles move either forward or backward from their normal resting position.", "keywords": ["amplitude", "maximum", "distance", "particles"], "id": "ch06-n076", "hold": false}, {"source": "nblm", "topic": "6.1", "src": "L|Sounds get quieter when the distance from the vibrating object increases because of energy dissipation.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'A sound gets quieter over a long distance because the frequency of the wave slows down.' Explain what is wrong with this.", "answer": "Sounds get quieter over a distance because the energy of the wave is lost to the surroundings.", "keywords": ["sounds", "quieter", "distance", "energy"], "id": "ch06-n078", "hold": false}, {"source": "nblm", "topic": "6.2", "src": "L|when two sound waves reinforce, the sound becomes louder.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'When two sound waves reinforce each other, the new wave travels twice as fast.' Explain what is wrong with this.", "answer": "When two sound waves reinforce each other, the resulting sound wave simply becomes louder.", "keywords": ["sound", "waves", "reinforce", "wave"], "id": "ch06-n081", "hold": false}, {"source": "nblm", "topic": "6.4", "src": "L|A nebula the same size as the Earth would have a mass of only a few kilograms!", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Because they are so huge and clearly visible, the gas in nebulae must be very dense and heavy.' Explain what is wrong with this.", "answer": "The particles in a nebula are actually very far apart, meaning a nebula the size of Earth would barely weigh anything.", "keywords": ["nebula", "size", "earth", "particles"], "id": "ch06-n090", "hold": false}, {"source": "nblm", "topic": "6.4", "src": "L|Some types of nebulae act as stellar nurseries.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Every single nebula in the universe acts as a stellar nursery where new stars are actively born.' Explain what is wrong with this.", "answer": "Only some specific types of nebulae have the correct gravity and pressure conditions to act as stellar nurseries.", "keywords": ["some", "types", "nebulae", "stellar"], "id": "ch06-n092", "hold": false}, {"source": "nblm", "topic": "6.5", "src": "L|Most of the volcanoes and earthquakes that have been recorded occur close to the tectonic plate boundaries", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Earthquakes and volcanoes happen completely randomly across all areas of the Earth's surface.' Explain what is wrong with this.", "answer": "The vast majority of earthquakes and volcanoes occur specifically at or close to tectonic plate boundaries where movement occurs.", "keywords": ["earthquakes", "volcanoes", "occur", "close"], "id": "ch06-n098", "hold": false}, {"id": "qwenw-01-01", "type": "mcq", "topic": "6.2", "source": "qwen", "q": "What happens to the loudness of a sound when it is reinforced?", "explain": "Reinforcement of sound waves increases the amplitude, which makes the sound louder.", "src": "W|the sound becomes louder", "options": ["It becomes louder", "It becomes quieter", "The pitch gets higher", "The pitch gets lower"], "answer": 0}, {"id": "qwenw-01-04", "type": "fill", "topic": "6.2", "source": "qwen", "q": "When two identical sound waves meet and reinforce, the resulting wave has double the ____.", "explain": "Reinforcement adds the amplitudes of the waves together.", "src": "W|The resulting wave, C, has double the amplitude", "answer": ["amplitude"]}, {"id": "qwenw-01-07", "type": "mcq", "topic": "6.3", "source": "qwen", "q": "According to the collision theory, what size was the object that hit Earth to form the Moon?", "explain": "The text describes the impacting object as being the same size as Mars.", "src": "W|object the same size as Mars", "options": ["The same size as Mars", "The same size as the Moon", "Half the size of Earth", "Twice the size of Mars"], "answer": 0}, {"id": "qwenw-01-08", "type": "fill", "topic": "6.1", "source": "qwen", "q": "When a sound wave travels through air, it causes the particles in the air to ____.", "explain": "Sound waves are vibrations that move through particles in a medium like air.", "src": "W|The sound wave makes the particles in air move", "answer": ["vibrate"]}, {"id": "qwenw-02-01", "type": "mcq", "topic": "6.3", "source": "qwen", "q": "According to the collision theory, what was the object that collided with Earth called?", "explain": "The text states, 'the object that collided with Earth was called Theia.'", "src": "W|the object that collided with Earth was called Theia", "options": ["Theia", "Mars", "Orion", "Pleiades"], "answer": 0}, {"id": "qwenw-02-02", "type": "fill", "topic": "6.3", "source": "qwen", "q": "In the collision theory, if the object Theia collided with Earth, particles from Theia would be found in ____.", "explain": "The text asks which object would contain particles from Theia, implying both bodies are involved in the formation process described.", "src": "W|which object would contain particles from Theia", "answer": ["both the Earth and the Moon"]}, {"id": "qwenw-02-03", "type": "mcq", "topic": "6.3", "source": "qwen", "q": "What does the fission theory suggest about the origin of the Earth and Moon?", "explain": "The text says the fission theory suggests 'the Earth and Moon were once the same object' that then split.", "src": "W|the Earth and Moon were once the same object", "options": ["They were once one object that split into two", "The Moon was captured by Earth's gravity", "A comet hit the Earth and formed the Moon", "The Moon was formed from dust in a nebula"], "answer": 0}, {"id": "qwenw-02-04", "type": "fill", "topic": "6.3", "source": "qwen", "q": "The capture theory suggests that the Moon was formed separately and then remained in ____ around the Earth.", "explain": "The text states that under the capture theory, 'the object then remained in orbit around the Earth.'", "src": "W|the object then remained in orbit around the Earth", "answer": ["orbit"]}, {"id": "qwenw-02-05", "type": "mcq", "topic": "6.4", "source": "qwen", "q": "Which statement is true about all nebulae?", "explain": "The text lists 'all nebulae contain dust and gas' as a true statement in the exercise.", "src": "W|all nebulae contain dust and gas", "options": ["They contain dust and gas", "They are all bigger than the Milky Way", "They all act as stellar nurseries", "They are all the same shape"], "answer": 0}, {"id": "qwenw-02-06", "type": "fill", "topic": "6.4", "source": "qwen", "q": "The Orion Nebula is an example of a ____ nebula.", "explain": "The table lists the Orion Nebula as an example of an emission nebula.", "src": "W|emission nebula|Orion Nebula", "answer": ["emission"]}, {"id": "qwenw-02-07", "type": "mcq", "topic": "6.4", "source": "qwen", "q": "Why do dark nebulae appear almost black?", "explain": "The text states that dark nebulae 'block the light from stars that are behind them, so they appear almost black.'", "src": "W|block the light from stars that are behind them", "options": ["They block the light from stars behind them", "They emit very little energy", "They reflect light from nearby stars", "They are made of hot gas"], "answer": 0}, {"id": "qwenw-02-08", "type": "fill", "topic": "6.4", "source": "qwen", "q": "The Crab Nebula is an example of a ____ remnant.", "explain": "The table identifies the Crab Nebula as an example of a supernova remnant.", "src": "W|supernova remnant|Crab Nebula", "answer": ["supernova"]}, {"id": "qwenw-02-10", "type": "fill", "topic": "6.5", "source": "qwen", "q": "Convection currents inside the Earth cause the movement of ____.", "explain": "The text asks to describe how convection currents cause the movement of tectonic plates.", "src": "W|how these convection currents cause the movement of tectonic plates", "answer": ["tectonic plates"]}, {"id": "qwenw-02-11", "type": "mcq", "topic": "6.5", "source": "qwen", "q": "What evidence supports the idea that continents have moved?", "explain": "The text lists 'the same types of fossils have been found in different continents' as evidence for tectonic plates.", "src": "W|the same types of fossils have been found in different continents", "options": ["Similar fossils found on different continents", "The number of moons each planet has", "The temperature of the Sun", "The shape of nebulae"], "answer": 0}, {"id": "qwenw-02-12", "type": "fill", "topic": "6.5", "source": "qwen", "q": "Alfred Wegener was the first person to suggest that Earth's continents were slowly ____.", "explain": "The text states that Alfred Wegener suggested 'that the Earth’s continents were slowly moving.'", "src": "W|suggest that the Earth’s continents were slowly moving", "answer": ["moving"]}, {"id": "qwen-01-04", "type": "fill", "topic": "6.1", "source": "qwen", "q": "The highest point on a graph of a sound wave is called the ____.", "explain": "The peak is defined as the highest point of the graph.", "src": "L|peak, of the graph", "answer": ["peak"], "hold": false}, {"id": "qwen-01-05", "type": "mcq", "topic": "6.1", "source": "qwen", "q": "What unit is used to measure frequency?", "explain": "Frequency is measured in a unit called hertz or Hz.", "src": "L|measured in a unit called hertz", "options": ["hertz (Hz)", "metres (m)", "seconds (s)", "decibels (dB)"], "answer": 0, "hold": false}, {"id": "qwen-01-06", "type": "fill", "topic": "6.1", "source": "qwen", "q": "A piece of equipment that displays graphs of sound waves is called an ____.", "explain": "An oscilloscope displays graphs of sound waves on a screen.", "src": "L|called an oscilloscope", "answer": ["oscilloscope"], "hold": false}, {"id": "qwen-01-08", "type": "fill", "topic": "6.1", "source": "qwen", "q": "The lowest point on a graph of a sound wave is called the ____.", "explain": "The trough is defined as the lowest point of the graph.", "src": "L|trough, of the graph", "answer": ["trough"], "hold": false}, {"id": "qwen-02-03", "type": "mcq", "topic": "6.2", "source": "qwen", "q": "What is the result when two sound waves cancel completely?", "explain": "The text says that when sound waves interfere to cancel, the amplitude becomes zero and the result is no sound.", "src": "L|When sound waves interfere to cancel, the amplitude of the sound wave becomes zero, the result is no sound.", "options": ["A louder sound", "No sound", "A higher pitch", "A lower pitch"], "answer": 1, "hold": false}, {"id": "qwen-02-07", "type": "mcq", "topic": "6.3", "source": "qwen", "q": "According to the collision theory, what formed the Moon?", "explain": "The text states that the Moon was formed when rocks and dust were pulled together by gravity.", "src": "L|The Moon was formed when the rocks and dust was pulled together by gravity.", "options": ["A piece of Earth that split off", "Rocks and dust pulled together by gravity", "Gas from the Sun", "Ice from space"], "answer": 1, "hold": false}, {"id": "qwen-02-08", "type": "fill", "topic": "6.3", "source": "qwen", "q": "Accurate measurements have shown that the Moon is still moving away from Earth at a rate of about ____ cm each year.", "explain": "The text mentions the rate of the Moon moving away is about 4 cm each year.", "src": "L|the Moon is still moving away from Earth – at a rate of about 4 cm each year.", "answer": ["4"], "hold": false}, {"id": "qwen-02-09", "type": "mcq", "topic": "6.3", "source": "qwen", "q": "Which piece of evidence supports the collision theory?", "explain": "The table lists 'The composition of rocks on the Earth and the Moon are the same' as evidence supporting the theory.", "src": "L|The composition of rocks on the Earth and the Moon are the same.", "options": ["The Moon is denser than Earth", "The surface of Earth was never molten", "Venus has no moon", "The composition of rocks on the Earth and Moon are the same"], "answer": 3, "hold": false}, {"id": "qwen-02-10", "type": "fill", "topic": "6.2", "source": "qwen", "q": "Noise cancelling headphones work by creating a sound wave that is ____ with the original wave.", "explain": "The text explains that headphones create a wave out of phase with the original to cancel it.", "src": "L|create another sound wave with the same amplitude and frequency, but out of phase with the original wave", "answer": ["out of phase"], "hold": false}, {"id": "qwen-02-11", "type": "mcq", "topic": "6.2", "source": "qwen", "q": "Why is it unlikely that sound waves in a concert hall will completely cancel?", "explain": "The text states that reflected sound waves add to the pattern, making complete cancellation unlikely.", "src": "L|These reflected sound waves would add many more waves to the pattern in the diagram, making it very unlikely that only two identical waves will be present to", "options": ["The speakers are too far apart", "Sound waves reflect off objects and people, adding more waves", "The frequency changes too quickly", "The amplitude is always different"], "answer": 1, "hold": false}, {"id": "qwen-03-03", "type": "mcq", "topic": "6.4", "source": "qwen", "q": "What force causes dust and gas in a stellar nursery to collapse together?", "explain": "The text explains that in a stellar nursery, dust and gas start to collapse together under the force of gravity.", "src": "L|dust and gas can start to collapse together under the force of gravity", "options": ["Gravity", "Magnetism", "Friction", "Pressure"], "answer": 0, "hold": false}, {"id": "qwen-03-06", "type": "fill", "topic": "6.5", "source": "qwen", "q": "The outer layers of the Earth are made up of solid, rocky ____.", "explain": "The text recalls that the outer layers of the Earth are the solid, rocky crust.", "src": "L|outer layers of the Earth are the solid, rocky crust", "answer": ["crust"], "hold": false}, {"id": "qwen-03-09", "type": "mcq", "topic": "6.5", "source": "qwen", "q": "Why is the Mesosaurus fossil evidence for tectonic plates?", "explain": "The text says Mesosaurus fossils were found in parts of Africa and South America that fit together, suggesting the continents were once joined.", "src": "L|Fossils of an extinct reptile called Mesosaurus have been found in the parts of Africa and South America", "options": ["It was found in Africa and South America", "It lived on land only", "It is a plant fossil", "It was found in Antarctica"], "answer": 0, "hold": false}, {"id": "qwen-03-10", "type": "fill", "topic": "6.5", "source": "qwen", "q": "The direction that magnetic crystals in rocks point is called ____.", "explain": "The text states that the direction that the crystals are pointing is called alignment.", "src": "L|The direction that the crystals are pointing is called alignment", "answer": ["alignment"], "hold": false}], "figures": {"img/L_p02_sound_wave_cone.png": {"caption": "A loudspeaker cone pushes the ai
