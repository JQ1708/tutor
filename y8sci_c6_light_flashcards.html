<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 6 — Light — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>
</head>

<header>
 <div class="hrow">
  <h1>Chapter 6 — Light — Flashcards</h1>
  <span class="chip" id="mode">Mode: Flashcards</span>

</main>

s away from the normal.", "src": "W|When light passes into a medium where it slows down, the light bends the normal."}, {"id": "y8c06-m029", "type": "mcq", "topic": "6.3", "source": "opus", "q": "In which year did Newton show that white light could be split into different colours?", "options": ["1666", "1801", "1905", "1500"], "answer": 0, "explain": "Newton is best known for his work on forces, but he made many other discoveries.", "src": "L|In the year 1666, Newton showed that white light could be split into different colours."}, {"id": "y8c06-m042", "type": "mcq", "topic": "6.4", "source": "opus", "q": "How many colours of light can all other colours be made from?", "options": ["Three", "Seven", "Two", "Six"], "answer": 0, "explain": "These three are called the primary colours of light.", "src": "L|However, there are three colours of light from which all other colours of light can be made."}, {"id": "y8c06-m059", "type": "mcq", "topic": "6.4", "source": "opus", "q": "Which three colours are the primary colours of light?", "options": ["Red, green and blue", "Red, yellow and blue", "Cyan, magenta and yellow", "Red, white and blue"], "answer": 0, "explain": "These are different from the primary colours used in paints.", "src": "W|The primary colours of light are red, green and blue."}, {"id": "y8c06-m060", "type": "mcq", "topic": "6.5", "source": "opus", "q": "Where does the word 'galaxy' come from?", "options": ["A Greek word for 'milky'", "A Latin word for 'star'", "An Arabic word for 'cloud'", "A Greek word for 'spiral'"], "answer": 0, "explain": "That is also why our own galaxy is called the Milky Way.", "src": "L|The word ‘galaxy’ comes from a Greek word for ‘milky’."}, {"id": "y8c06-m072", "type": "mcq", "topic": "6.6", "source": "opus", "q": "What is an asteroid?", "options": ["An object made from rock that orbits the Sun", "A ball of hot gas that gives out light", "A moon that orbits a planet", "A cloud of dust between the galaxies"], "answer": 0, "explain": "Asteroids range in size up to 975 km across.", "src": "L|Asteroids are objects made from rock that orbits the Sun."}, {"id": "y8c06-m088", "type": "fill", "topic": "6.1", "source": "opus", "q": "The line drawn perpendicular to the mirror in a ray diagram is called the ____.", "answer": ["normal"], "explain": "Angles of incidence and reflection are both measured from it.", "src": "L|The line perpendicular to the mirror is called the normal."}, {"id": "y8c06-m093", "type": "fill", "topic": "6.2", "source": "opus", "q": "The material that light passes through is called a ____.", "answer": ["medium"], "explain": "Air, glass and water are all examples.", "src": "L|The material that light passes through is called a medium."}, {"id": "y8c06-m098", "type": "fill", "topic": "6.3", "source": "opus", "q": "The range of colours that can be seen in white light is called a ____.", "answer": ["spectrum"], "explain": "The colours merge into one another rather than being separate.", "src": "L|The range of colours that can be seen in white light is called a spectrum."}, {"id": "y8c06-m103", "type": "fill", "topic": "6.4", "source": "opus", "q": "The three colours of light from which all other colours can be made are called the ____ colours.", "answer": ["primary"], "explain": "They are red, green and blue.", "src": "L|These are called the primary colours."}, {"id": "y8c06-m109", "type": "fill", "topic": "6.5", "source": "opus", "q": "The Milky Way is a ____ galaxy.", "answer": ["spiral"], "explain": "The other two shapes are elliptical and irregular.", "src": "L|The Milky Way is a spiral galaxy."}, {"id": "y8c06-m114", "type": "fill", "topic": "6.6", "source": "opus", "q": "____ are objects made from rock that orbit the Sun.", "answer": ["Asteroids"], "explain": "They range in size up to 975 km across.", "src": "L|Asteroids are objects made from rock that orbits the Sun."}, {"id": "y8c06-r001", "type": "short", "topic": "6.1", "source": "opus", "q": "Explain why the angle of incidence is measured from the normal and not from the mirror surface.", "answer": "The normal is a line perpendicular to the mirror at the point where the ray strikes it, and it is defined the same way for every surface. Measuring from the normal means the same rule works for curved surfaces and for refraction as well, and it is what makes the law of reflection come out as a simple equality.", "keywords": ["normal", "perpendicular", "same rule", "law of reflection"], "src": "L|Measure this angle from a line perpendicular to the mirror and not from the mirror itself."}, {"id": "y8c06-r002", "type": "short", "topic": "6.1", "source": "opus", "q": "State the law of reflection and explain why it is called a law rather than a theory.", "answer": "The law of reflection says that the angle of reflection is equal to the angle of incidence. In physics a law is something that always applies — it has been tested many times and no exception has been found — whereas a theory is an explanation of why something happens.", "keywords": ["angle of reflection", "equal", "angle of incidence", "always applies"], "src": "L|Which is that the angle of refl ection is equal to the angle of incidence."}, {"id": "y8c06-r003", "type": "short", "topic": "6.1", "source": "opus", "q": "Explain how a driver can use a mirror to see a cyclist who is not in front of the car.", "answer": "Light from the Sun is reflected off the cyclist and travels to the mirror as the incident ray. It reflects off the mirror with the angle of reflection equal to the angle of incidence, and the reflected ray travels to the driver's eye, so the driver sees the cyclist even though the light did not come straight from them.", "keywords": ["reflected from the cyclist", "mirror", "angle of reflection", "driver's eye"], "src": "L|The driver of the car can see the cyclist by using this mirror."}, {"id": "y8c06-r004", "type": "short", "topic": "6.1", "source": "opus", "q": "Explain why your reflection in a spoon looks different from your reflection in a plane mirror.", "answer": "A plane mirror is flat, so all the normals point the same way and the reflected rays keep their arrangement. A spoon is curved, so the normal points in a different direction at each point on the surface, and the reflected rays are spread out or brought together, which distorts the image.", "keywords": ["flat", "curved", "normal", "different direction", "distorted"], "src": "L|To see what refl ection looks like from a surface that is not plane, you can look at your own refl ection from a spoon."}, {"id": "y8c06-r005", "type": "short", "topic": "6.1", "source": "opus", "q": "Explain why an arrowhead should always be drawn on a light ray in a ray diagram.", "answer": "The arrowhead shows which way the light is travelling. Without it the diagram cannot tell you which ray is the incident ray arriving at the surface and which is the reflected ray leaving it, so the angles could be labelled the wrong way round.", "keywords": ["direction", "incident", "reflected", "which way"], "src": "L|When drawing light rays, always use a ruler and put an arrowhead on the ray to show its direction."}, {"id": "y8c06-r006", "type": "short", "topic": "6.1", "source": "opus", "q": "A moving ball bouncing off a wall is used as an analogy for reflection of light. Explain why this analogy is useful and where it breaks down.", "answer": "It is useful because the ball bounces off at the same angle it arrived at, just as the angle of reflection equals the angle of incidence. It breaks down because the ball is a solid object that touches the wall and loses energy, whereas light is not a material object and is not slowed by reflecting.", "keywords": ["bounces", "same angle", "solid object", "loses energy", "light is not"], "src": "W|Which of these movements of the ball is an analogy for refl ection of light?"}, {"id": "y8c06-r007", "type": "short", "topic": "6.2", "source": "opus", "q": "Explain why the background seen through a glass of water appears distorted.", "answer": "Light from the background passes from air into the glass and the water and then back out into the air. At each boundary it changes speed and so changes direction. The rays reaching your eye no longer come from the direction the object really is in, so the image looks bent out of shape.", "keywords": ["refraction", "changes speed", "changes direction", "boundary", "distorted"], "src": "L|The background appears distorted because of refraction."}, {"id": "y8c06-r008", "type": "short", "topic": "6.2", "source": "opus", "q": "Define refraction and explain what causes it.", "answer": "Refraction is the change in direction of light when it passes from one medium to another, caused by a change in speed. Light travels more slowly in glass or water than in air, and one side of the ray slows down before the other, which swings the ray round into a new direction.", "keywords": ["change in direction", "one medium to another", "change in speed", "one side first"], "src": "L|Refraction of light is defined as the change in direction of light on passing from one medium to another because of change in speed."}, {"id": "y8c06-r009", "type": "short", "topic": "6.2", "source": "opus", "q": "Explain how a person on roller skates moving onto a soft surface at an angle is an analogy for refraction.", "answer": "One skate reaches the soft surface first and slows down while the other is still moving quickly on the hard surface. The difference in speed between the two sides turns the skater. In the same way, one side of a light ray enters the glass and slows first, which turns the ray.", "keywords": ["one skate first", "slows", "difference in speed", "turns"], "src": "L|You will change direction because one roller skate is moving slower than the other."}, {"id": "y8c06-r010", "type": "short", "topic": "6.2", "source": "opus", "q": "Explain why light bends towards the normal when it passes from air into glass.", "answer": "Light travels more slowly in glass than in air. The side of the ray that enters the glass first is slowed first, so the ray swings round towards the normal, and the angle of refraction is smaller than the angle of incidence.", "keywords": ["slows down", "towards the normal", "angle of refraction smaller"], "src": "L|The light passing from air into glass or water is bent towards the normal."}, {"id": "y8c06-r011", "type": "short", "topic": "6.2", "source": "opus", "q": "Explain why light bends away from the normal when it passes from glass into air.", "answer": "Light travels faster in air than in glass, so the ray speeds up as it leaves. The side that reaches the air first speeds up first, so the ray swings away from the normal and the angle of refraction is greater than the angle of incidence.", "keywords": ["speeds up", "away from the normal", "angle of refraction greater"], "src": "L|We say that the light passing from glass or water into air is bent away from the normal."}, {"id": "y8c06-r012", "type": "short", "topic": "6.2", "source": "opus", "q": "In the glass block experiment you are told to include an angle of incidence of zero. Explain what happens to the ray in that case and why it is worth testing.", "answer": "At an angle of incidence of zero the ray travels along the normal, so both sides of the ray reach the glass at the same moment and slow down together. There is nothing to turn the ray, so it passes straight through without bending. It is worth testing because it shows that it is the angle, not the change of medium alone, that produces the bending.", "keywords": ["zero", "along the normal", "both sides together", "no bending"], "src": "L|Make sure to include an angle of incidence of zero."}, {"id": "y8c06-r013", "type": "short", "topic": "6.2", "source": "opus", "q": "Explain why it is hard to see clearly through a window covered in raindrops.", "answer": "Each individual drop is a curved piece of water with its own surfaces, so each one refracts the light passing through it in a different direction. The light arriving at your eye comes from many directions at once and no clear image is formed.", "keywords": ["each drop", "refracts", "different direction", "no clear image"], "src": "L|Each individual drop of water on the window refracts light in a different direction, making it very difficult to see."}, {"id": "y8c06-r014", "type": "short", "topic": "6.2", "source": "opus", "q": "Explain why using windscreen wipers makes it easier to see through a wet windscreen.", "answer": "The wipers remove the separate drops and leave a flat film of water or clear glass. All the light is then refracted in the same direction at the same flat surface, so the image is not broken up and you can see clearly.", "keywords": ["removes the drops", "flat", "same direction", "see clearly"], "src": "L|It is then easier to see clearly as all the refraction from the glass is in the same direction."}, {"id": "y8c06-r015", "type": "short", "topic": "6.2", "source": "opus", "q": "Two transparent substances are listed with the speed of light in each. Explain how you would decide between which pair there would be the most refraction.", "answer": "The amount of bending depends on how much the speed changes at the boundary. The greatest refraction happens between the two substances whose speeds of light are the furthest apart, and there would be no refraction at all between two substances in which light travels at the same speed.", "keywords": ["speed changes", "furthest apart", "greatest", "same speed", "no refraction"], "src": "W|b Between which two substances would there be most refraction?"}, {"id": "y8c06-r016", "type": "short", "topic": "6.3", "source": "opus", "q": "Explain why dispersion happens when white light passes through a prism.", "answer": "White light is made of several colours, and each colour is refracted through a slightly different angle. Because they are bent by different amounts they leave the prism travelling in slightly different directions, so they spread out and can be seen separately.", "keywords": ["different colours", "refracted", "different angle", "spread out"], "src": "L|Dispersion happens because light is refracted."}, {"id": "y8c06-r017", "type": "short", "topic": "6.3", "source": "opus", "q": "Violet light is refracted through the largest angle and red through the smallest. Explain what this tells you about the speed of each colour in the glass.", "answer": "The more a colour is bent, the more its speed changed on entering the glass. Violet is bent the most, so violet light is slowed the most and travels most slowly in the glass, while red is bent least and travels fastest in the glass.", "keywords": ["bent the most", "slowed the most", "violet slowest", "red fastest"], "src": "L|Violet light is refracted through the largest angle and red light is refracted through the smallest angle."}, {"id": "y8c06-r018", "type": "short", "topic": "6.3", "source": "opus", "q": "Explain why the colours in a spectrum are not separated by gaps.", "answer": "The amount of refraction changes gradually as you go through the colours rather than jumping from one to the next. Each colour therefore merges into the one beside it, so the spectrum is a continuous band rather than seven separate stripes.", "keywords": ["gradually", "merge", "continuous", "no gaps"], "src": "L|In the spectrum, the colours are not separate but they merge from one to another."}, {"id": "y8c06-r019", "type": "short", "topic": "6.3", "source": "opus", "q": "Newton is said to have seen five or six colours but most people now say seven. Explain how the same spectrum can be described differently.", "answer": "The colours merge into each other, so where one ends and the next begins is a judgement, not a measurement. Different observers draw the boundaries in different places, which is why some people see indigo and violet as one colour and count six.", "keywords": ["merge", "judgement", "boundaries", "different observers"], "src": "L|Some people think Newton originally saw five or six colours, but most people now agree that there are seven."}, {"id": "y8c06-r020", "type": "short", "topic": "6.3", "source": "opus", "q": "Explain the three conditions needed to see a rainbow.", "answer": "The Sun must be shining to provide bright light. There must be rain or small drops of water in the air to cause the dispersion. The Sun must be behind you, because the light is reflected inside the drops and comes back towards you rather than carrying on away from you.", "keywords": ["Sun shining", "drops of water", "Sun behind you", "reflected inside"], "src": "L|the Sun must be shining, to provide bright light"}, {"id": "y8c06-r021", "type": "short", "topic": "6.3", "source": "opus", "q": "Explain the part played by reflection, as well as refraction, in forming a rainbow.", "answer": "Light is refracted as it enters each drop and the colours begin to separate. The light is then reflected from the inside of the back of the drop, which sends it back towards the observer, and it is refracted again on leaving. Without the reflection the colours would carry on away from you and you would not see them.", "keywords": ["refracted entering", "reflected inside", "back towards", "refracted leaving"], "src": "L|The light is also refl ected from inside the drops of water."}, {"id": "y8c06-r022", "type": "short", "topic": "6.3", "source": "opus", "q": "Explain why a hosepipe on a sunny day can make a rainbow.", "answer": "The hosepipe produces small drops of water in the air, which do the same job as raindrops. With the Sun shining and behind the camera, light is dispersed and reflected inside those drops, so the colours are seen exactly as in a natural rainbow.", "keywords": ["drops of water", "same as rain", "Sun behind", "dispersed"], "src": "L|The drops of water from the hosepipe in Figure 6.3.4 are making a rainbow."}, {"id": "y8c06-r023", "type": "short", "topic": "6.3", "source": "opus", "q": "Explain the safety instruction not to put your eye closer than about half a metre to the prism.", "answer": "Close to the prism the light has not spread out, so all the energy is concentrated in a small bright beam. Looking into it could damage the retina of your eye, so you keep back to let the light spread and dim before it reaches you.", "keywords": ["concentrated", "very bright", "damage", "keep back"], "src": "L|Safety Do not put your eye closer to the prism than about metre."}, {"id": "y8c06-r024", "type": "short", "topic": "6.3", "source": "opus", "q": "A prism made of plastic separates white light into colours. Explain how you can tell from the ray diagram how the speeds of the different colours in the plastic compare.", "answer": "The colour bent through the largest angle changed speed the most on entering the plastic, so it travels most slowly inside it. The colour bent least changed speed least and travels fastest inside it. Reading off the order of the colours in the diagram therefore gives the order of their speeds.", "keywords": ["bent most", "slowest", "bent least", "fastest", "order"], "src": "W|Use information in the ray diagram to explain how the speeds of the different colours of light compare when passing through this plastic."}, {"id": "y8c06-r025", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain what is meant by the primary colours of light.", "answer": "They are red, green and blue: the three colours that cannot be made by mixing any other colours of light, and from which all other colours of light can be made by adding them in different proportions.", "keywords": ["red green blue", "cannot be made", "all others", "adding"], "src": "L|The primary colours cannot be made by mixing any other colours of light."}, {"id": "y8c06-r026", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain why the primary colours of light are different from the primary colours of paint.", "answer": "Light adds: when beams overlap, the colours reaching your eye are added together and the result is brighter. Paint subtracts: each pigment absorbs some colours from the white light falling on it, so mixing paints removes more colours and the result is darker. Since the two processes work in opposite directions, they need different primaries.", "keywords": ["adding", "subtracting", "absorb", "brighter", "darker"], "src": "L|The colours in light mix differently from the colours in paint."}, {"id": "y8c06-r027", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain how a screen can show orange when it only has red, green and blue sources.", "answer": "Orange is made by adding red and green light, but with the red brighter than the green. By changing the brightness of each primary colour independently, the screen can produce all the different shades, so only three sources are needed.", "keywords": ["red and green", "brightness", "brighter", "different shades"], "src": "L|For example, orange is made by adding red and green, but with the red brighter than the green."}, {"id": "y8c06-r028", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain how a coloured filter works.", "answer": "A filter is a transparent piece of coloured glass or plastic that only lets light of its own colour through. It absorbs the other colours in the white light falling on it, so the light that is transmitted is only the colour of the filter.", "keywords": ["transmits", "its own colour", "absorbs", "other colours"], "src": "L|If a transparent piece of coloured glass or plastic is placed in front of a white light, then only light of that colour will be transmitted (get through)."}, {"id": "y8c06-r029", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain why a filter is described as subtracting light.", "answer": "White light is made of seven colours. A red filter absorbs six of them and transmits only red, so six colours have been taken away from what arrived. Nothing is added, so the process is subtraction and the transmitted light is always dimmer than the light going in.", "keywords": ["seven colours", "absorbs six", "taken away", "dimmer"], "src": "L|White light has had six colours subtracted to leave only red."}, {"id": "y8c06-r030", "type": "short", "topic": "6.4", "source": "opus", "q": "Traffic lights use three identical white lamps. Explain how they show three different colours.", "answer": "Each lamp has a different coloured filter in front of it — red, yellow or green. Each filter absorbs the colours that are different from its own and transmits only one, so three identical lamps produce three different colours.", "keywords": ["identical lamps", "coloured filter", "absorbs", "transmits one"], "src": "L|The traffic lights use three identical white lamps."}, {"id": "y8c06-r031", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain why no light gets through when green light shines on a red filter.", "answer": "A red filter transmits only red light and absorbs all the other colours, and green is one of the colours it absorbs. As the light arriving is entirely green, all of it is absorbed and nothing is left to come through.", "keywords": ["only red", "absorbs", "green absorbed", "no light"], "src": "L|If this green light then shines on a red filter then no light will get through."}, {"id": "y8c06-r032", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain why a flower looks yellow in white light.", "answer": "White light containing all seven colours falls on the flower. The flower reflects only the yellow light and absorbs the other six colours, so the only light reaching your eye from it is yellow.", "keywords": ["reflects yellow", "absorbs the others", "reaches your eye"], "src": "L|The fl ower looks yellow because it refl ects only yellow light."}, {"id": "y8c06-r033", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain, in terms of reflection and absorption, why one object looks white and another looks black.", "answer": "A white object reflects all the colours in white light equally, so all of them reach your eye together and you see white. A black object absorbs all the colours and reflects none, so almost no light reaches your eye from it.", "keywords": ["reflects all", "equally", "absorbs all", "reflects none"], "src": "L|A black object absorbs all the colours in white light and does not refl ect any."}, {"id": "y8c06-r034", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain why a red cube appears black when it is seen in green light.", "answer": "A red object reflects only red light and absorbs every other colour. In green light there is no red light for it to reflect, so it absorbs the green and reflects nothing, and with no light coming from it the cube looks black.", "keywords": ["only reflects red", "no red present", "absorbs green", "reflects nothing"], "src": "L|The red cube appears black when seen in green light."}, {"id": "y8c06-r035", "type": "short", "topic": "6.4", "source": "opus", "q": "Explain why light from the Sun appears white.", "answer": "The Sun gives out all the colours of the spectrum at once and at roughly equal brightness. When all of them enter your eye together they are added and the result is seen as white, which is why the Sun's light can be split into a full rainbow.", "keywords": ["all the colours", "at once", "added", "white"], "src": "W|Explain why the light from the Sun appears to be white."}, {"id": "y8c06-r036", "type": "short", "topic": "6.4", "source": "opus", "q": "Suggest why scientists do not consider black to be a colour.", "answer": "Black is what you see when no light is reaching your eye from an object, because every colour has been absorbed. It is the absence of light rather than a particular kind of light, so there is no black in the spectrum.", "keywords": ["no light", "absorbed", "absence", "not in the spectrum"], "src": "W|a Suggest why scientists do not consider black to be a colour."}, {"id": "y8c06-r038", "type": "short", "topic": "6.5", "source": "opus", "q": "Explain why the Milky Way appears as a band of light across the night sky.", "answer": "Our galaxy is a spiral, and we live inside one of its arms. Looking along the plane of the disc we see a huge number of stars stacked behind one another, which merge into a bright band, while looking out of the disc in other directions we see far fewer stars.", "keywords": ["spiral", "we are inside", "along the arm", "many stars", "band"], "src": "L|Because we live in a spiral galaxy, we can only see one ‘arm’ of the spiral, which is that band across the sky."}, {"id": "y8c06-r039", "type": "short", "topic": "6.5", "source": "opus", "q": "Explain why most of the stars we see at night belong to our own galaxy.", "answer": "Other galaxies are enormously further away than the stars in the Milky Way. Light from their individual stars is far too faint to be picked out separately from Earth, so the points of light we can see are nearly all nearby stars in our own galaxy.", "keywords": ["other galaxies", "much further", "too faint", "own galaxy"], "src": "L|In fact, most of the stars we see at night are in our own galaxy."}, {"id": "y8c06-r040", "type": "short", "topic": "6.5", "source": "opus", "q": "Explain what holds a galaxy together.", "answer": "Gravity. A galaxy contains stellar dust, gas, stars and solar systems, and every part of it attracts every other part. Because a galaxy is so large and has such an enormous total mass, the gravitational force is very strong even though the individual dust particles are tiny.", "keywords": ["gravity", "very large mass", "attracts", "strong"], "src": "L|Galaxies are made from stellar dust, gas, stars and solar systems held together by gravity."}, {"id": "y8c06-r041", "type": "short", "topic": "6.5", "source": "opus", "q": "Explain how scientists estimated the number of galaxies in the universe.", "answer": "They counted the galaxies in one part of space, then multiplied that number up to cover the whole universe. This assumes the part they counted is typical, so the answer is an estimate rather than an exact count.", "keywords": ["counted", "one part", "multiplied up", "estimate"], "src": "L|The scientists then multiplied this number up to estimate the number of galaxies in the universe."}, {"id": "y8c06-r042", "type": "short", "topic": "6.5", "source": "opus", "q": "Explain two reasons why the estimated number of galaxies may not be accurate.", "answer": "The part of space they counted may contain more or fewer galaxies than the rest of the universe, so scaling it up would give too high or too low an answer. They may also not know the total volume of the universe accurately, so the factor they multiply by may itself be wrong.", "keywords": ["not typical", "more or fewer", "total volume", "not known accurately"], "src": "L|There could actually be more or fewer galaxies in the part of space that the scientists counted compared with the rest of the universe."}, {"id": "y8c06-r043", "type": "short", "topic": "6.5", "source": "opus", "q": "Explain how estimating the number of grains of sand in a container is an analogy for estimating the number of stars in a galaxy.", "answer": "In both cases there are far too many to count individually. You count a small quantity carefully, find how much of the whole that represents, and multiply up. The accuracy of the answer depends on whether the small sample really is typical of the whole.", "keywords": ["too many to count", "count a small amount", "multiply up", "typical"], "src": "L|There are too many to count them all, so this activity is an analogy for how scientists estimate numbers of stars."}, {"id": "y8c06-r044", "type": "short", "topic": "6.5", "source": "opus", "q": "Particles of stellar dust can have a mass as small as 0.000 000 000 000 001 g. Suggest how clouds of such dust can still produce strong gravitational forces.", "answer": "Gravity depends on the total mass, and a cloud contains an unimaginably large number of these particles spread over an enormous volume. Adding up all those tiny masses gives a very large total, so the force it produces is strong.", "keywords": ["total mass", "enormous number", "add up", "large total"], "src": "W|Suggest how clouds of stellar dust can produce strong forces of gravity in galaxies."}, {"id": "y8c06-r045", "type": "short", "topic": "6.5", "source": "opus", "q": "Black holes are solid objects, not holes. Suggest two reasons why they appear black.", "answer": "They give out no light of their own, so there is nothing to see from them directly. Their gravity is so strong that any light falling on them is pulled in and not reflected back out, so no light reaches us from that direction at all.", "keywords": ["no light of their own", "gravity", "light pulled in", "not reflected"], "src": "W|Suggest two reasons why black holes appear black."}, {"id": "y8c06-r046", "type": "short", "topic": "6.5", "source": "opus", "q": "Most galaxies are moving further apart. Predict two ways this will change how other galaxies are seen from Earth in the future.", "answer": "They will appear smaller, because they are further away. They will also appear fainter, because the light spreads out more over the greater distance, so fewer of them will be visible at all.", "keywords": ["further away", "smaller", "fainter", "fewer visible"], "src": "W|Predict two ways this will affect how other galaxies will be seen from Earth in the future."}, {"id": "y8c06-r047", "type": "short", "topic": "6.6", "source": "opus", "q": "Explain why most asteroids are not regular in shape.", "answer": "They are lumps of rock that were never large enough for their own gravity to pull them into a sphere. Just like rocks on Earth, their shape is whatever the breaking and collisions left behind, which is why scientists describe them as potato-shaped.", "keywords": ["lumps of rock", "gravity too weak", "not a sphere", "potato"], "src": "L|Most asteroids are not regular shapes, just as rocks on Earth are not regular shapes."}, {"id": "y8c06-r048", "type": "short", "topic": "6.6", "source": "opus", "q": "Ceres was first thought to be a planet. Explain why the term 'asteroid' was introduced instead.", "answer": "Ceres looked much smaller than the planets already known. Rather than call such a small body a planet, scientists introduced a new term for objects of that size that orbit the Sun, and Ceres became the largest of them.", "keywords": ["much smaller", "new term", "orbits the Sun", "largest"], "src": "L|As Ceres looked much smaller than a planet, the term asteroid was introduced."}, {"id": "y8c06-r049", "type": "short", "topic": "6.6", "source": "opus", "q": "Explain why Ceres is described as an unusual asteroid.", "answer": "Unlike other asteroids it is round, with a diameter of 975 km, and it has a core, a mantle and a crust like some planets. Scientists think it would have become a planet if it had continued to grow while the Solar System was forming.", "keywords": ["round", "core mantle crust", "like a planet", "largest"], "src": "L|Scientists think that Ceres would have become a planet if it had continued to grow during the formation of the Solar System."}, {"id": "y8c06-r050", "type": "short", "topic": "6.6", "source": "opus", "q": "Itokawa appears to be made of separate lumps of rock. Explain why they are not pressed together into a single solid body.", "answer": "The asteroid is a relatively small object, so its total mass is small and the force of gravity holding the lumps together is weak. There is not enough force to crush them into one solid piece, which is also why tidal forces from a passing planet can change its shape.", "keywords": ["small", "weak gravity", "not enough force", "tidal forces"], "src": "L|The force of gravity holding the lumps of rock together is weak because the asteroid is a relatively small object."}, {"id": "y8c06-r051", "type": "short", "topic": "6.6", "source": "opus", "q": "Some asteroids are small and spin quickly. Explain how this tells scientists they are made of a single piece of rock.", "answer": "In such a small object the force of gravity is too weak to hold separate pieces together, and spinning quickly would throw loose pieces off. Since the asteroid stays intact, it must be one solid piece of rock rather than a pile of rubble.", "keywords": ["gravity too weak", "spin quickly", "thrown off", "single piece"], "src": "L|Scientists know this because these asteroids are small and spin quickly."}, {"id": "y8c06-r052", "type": "short", "topic": "6.6", "source": "opus", "q": "Explain how studying samples collected from Itokawa gives evidence about how the Solar System formed.", "answer": "The samples are made of rock that has not been changed by weather, water or life as rock on Earth has been. They appear to come from small planets or moons broken up by impacts, so they preserve material from the time the Solar System was forming and can be analysed directly.", "keywords": ["samples", "unchanged", "impacts", "preserve", "evidence"], "src": "L|Study of the samples has given scientists more evidence about how the Solar System formed."}, {"id": "y8c06-r053", "type": "short", "topic": "6.6", "source": "opus", "q": "Explain why many small asteroids that hit the Earth never reach the surface.", "answer": "They are less than a few metres across, and as they travel through the atmosphere friction heats them so strongly that they break apart before they get down to the ground. Only larger objects survive the journey through the atmosphere.", "keywords": ["small", "atmosphere", "break apart", "never reach the surface"], "src": "L|These smaller asteroids were less than diameter and broke apart in the atmosphere, so never reached the Earth’s surface."}, {"id": "y8c06-r054", "type": "short", "topic": "6.6", "source": "opus", "q": "Explain the two reasons why asteroids sometimes collide with the Earth.", "answer": "Many asteroids follow orbits that pass relatively close to the Earth, so they come near enough to be affected by it. The Earth also exerts a strong force of gravity on passing objects, which can pull an asteroid out of its path and onto a collision course.", "keywords": ["orbits pass close", "gravity", "pulled", "collision"], "src": "L|There are two reasons why asteroids impact with Earth."}, {"id": "y8c06-r055", "type": "short", "topic": "6.6", "source": "opus", "q": "All the planets have names but most asteroids do not. Suggest one reason for this.", "answer": "There are vastly more asteroids than planets and most of them are very small, so many have only been detected and not studied. Names are given to the ones that have been observed in enough detail, which is a small fraction of the total.", "keywords": ["far more", "very small", "not studied", "small fraction"], "src": "W|Suggest one reason why not all asteroids have names."}, {"id": "y8c06-r056", "type": "short", "topic": "6.6", "source": "opus", "q": "The total mass of all the asteroids in the belt is less than that of any planet. Explain how this supports the idea that asteroids are rocks left over from the formation of the Solar System.", "answer": "There is not enough material in the whole belt to have made a planet, so it cannot be the remains of a planet that broke apart. It fits much better with material that never managed to gather into a planet in the first place and was left over.", "keywords": ["not enough material", "never formed", "left over", "not a broken planet"], "src": "W|Explain how this can be evidence that asteroids are rocks left over from the formation of the solar system."}, {"id": "y8c06-r057", "type": "short", "topic": "6.6", "source": "opus", "q": "One website claims a building made by aliens can be seen on the asteroid Eros; a university website says it is light reflecting off a crater. Discuss which is more reliable.", "answer": "The university website is more reliable. It is written by scientists who study these images, it gives an explanation based on something already known to happen, and its work can be checked by others. The alien website is independent with no stated expertise, and it makes an extraordinary claim without extraordinary evidence, so it should not be accepted without support.", "keywords": ["university", "scientists", "checked", "explanation", "no evidence"], "src": "W|Discuss the reliability of the information in these two websites."}, {"id": "y8c06-o001", "type": "short", "topic": "6.1", "source": "opus", "q": "What name is given to a flat mirror?", "answer": "A plane mirror.", "keywords": ["plane"], "explain": "'Plane' means flat.", "src": "L|Most of the mirrors you use are plane mirrors."}, {"id": "y8c06-o002", "type": "short", "topic": "6.1", "source": "opus", "q": "What happens to your reflection when you look at a surface that is not plane, such as a spoon?", "answer": "It is distorted.", "keywords": ["distorted"], "explain": "Only a flat surface gives an undistorted reflection.", "src": "L|The refl ection is distorted."}, {"id": "y8c06-o003", "type": "short", "topic": "6.1", "source": "opus", "q": "What are the straight lines that light travels in called?", "answer": "Rays.", "keywords": ["rays"], "explain": "Rays are drawn with a ruler and an arrowhead.", "src": "L|Remember that light travels in straight lines called rays."}, {"id": "y8c06-o004", "type": "short", "topic": "6.1", "source": "opus", "q": "What two things should you always do when you draw a light ray?", "answer": "Use a ruler, and put an arrowhead on the ray to show its direction.", "keywords": ["ruler", "arrowhead"], "explain": "The arrowhead shows which way the light is going.", "src": "L|When drawing light rays, always use a ruler and put an arrowhead on the ray to show its direction."}, {"id": "y8c06-o005", "type": "short", "topic": "6.1", "source": "opus", "q": "What is the ray of light arriving at a mirror called?", "answer": "The incident ray.", "keywords": ["incident ray"], "explain": "An incident ray is the ray coming onto a surface.", "src": "L|A light ray arriving at a mirror is called an incident ray."}, {"id": "y8c06-o006", "type": "short", "topic": "6.1", "source": "opus", "q": "What is the name of the line drawn perpendicular to a mirror?", "answer": "The normal.", "keywords": ["normal"], "explain": "The normal is usually drawn as a dashed line.", "src": "L|The line perpendicular to the mirror is called the normal."}, {"id": "y8c06-o014", "type": "short", "topic": "6.2", "source": "opus", "q": "What is the name for a material that light passes through?", "answer": "A medium.", "keywords": ["medium"], "explain": "Air, glass and water are all media for light.", "src": "L|The material that light passes through is called a medium."}, {"id": "y8c06-o016", "type": "short", "topic": "6.2", "source": "opus", "q": "What happens to the speed of light when it passes from air into water or glass?", "answer": "It travels more slowly.", "keywords": ["slowly", "slower"], "explain": "This change of speed is what causes refraction.", "src": "L|When light passes from air into water or glass, the light travels more slowly."}, {"id": "y8c06-o017", "type": "short", "topic": "6.2", "source": "opus", "q": "Define refraction of light.", "answer": "The change in direction of light on passing from one medium to another because of a change in speed.", "keywords": ["change in direction", "change in speed"], "explain": "Both parts of the definition are needed.", "src": "L|Refraction of light is defined as the change in direction of light on passing from one medium to another because of change in speed."}, {"id": "y8c06-o030", "type": "short", "topic": "6.3", "source": "opus", "q": "What shape of glass block did Newton use to split light into its colours?", "answer": "A block in the shape of a triangle.", "keywords": ["triangle"], "explain": "We now call this a triangular prism.", "src": "L|Newton is using a glass block in the shape of a triangle to split the light into its colours."}, {"id": "y8c06-o031", "type": "short", "topic": "6.3", "source": "opus", "q": "What is the range of colours seen in white light called?", "answer": "A spectrum.", "keywords": ["spectrum"], "explain": "The colours merge into one another.", "src": "L|The range of colours that can be seen in white light is called a spectrum."}, {"id": "y8c06-o032", "type": "short", "topic": "6.3", "source": "opus", "q": "Are the colours in a spectrum separate from each other?", "answer": "No - they merge from one to another.", "keywords": ["merge"], "explain": "There are no sharp boundaries between them.", "src": "L|In the spectrum, the colours are not separate but they merge from one to another."}, {"id": "y8c06-o065", "type": "short", "topic": "6.5", "source": "opus", "q": "Why do we see the Milky Way as a band of light across the sky?", "answer": "Because the Milky Way is a flat spiral galaxy and we are inside its disc. Looking along the disc we see a huge number of stars stacked up behind one another, which merge into a band.", "keywords": ["arm", "spiral"], "explain": "We are looking along the disc from inside it.", "src": "L|Because we live in a spiral galaxy, we can only see one ‘arm’ of the spiral, which is that band across the sky."}, {"id": "y8c06-o066", "type": "short", "topic": "6.5", "source": "opus", "q": "About how many stars are there in the Milky Way?", "answer": "Hundreds of billions. Modern estimates are around 100-400 billion stars, including our Sun. (Older books print 250 million, which is far too low.)", "keywords": ["250 000 000", "stars", "Milky Way"], "explain": "The number can only be estimated.", "src": "L|There are an estimated 250000000 stars in the Milky Way including our Sun."}, {"id": "y8c06-o067", "type": "short", "topic": "6.5", "source": "opus", "q": "Where are most of the stars we see at night?", "answer": "In our own galaxy.", "keywords": ["own galaxy"], "explain": "Other galaxies are far too distant to see individual stars.", "src": "L|In fact, most of the stars we see at night are in our own galaxy."}, {"id": "y8c06-o077", "type": "short", "topic": "6.6", "source": "opus", "q": "What is the largest size that asteroids reach?", "answer": "Up to 975 km across.", "keywords": ["975"], "explain": "That is the diameter of Ceres.", "src": "L|Asteroids range in size up to 975km across."}, {"id": "y8c06-w001", "type": "mcq", "topic": "6.1", "source": "opus", "q": "Which of these means the same as 'plane mirror'?", "options": ["A mirror with a perfectly flat, smooth surface.", "A mirror that makes things look larger.", "A mirror that is curved inwards.", "A mirror used only on aeroplanes."], "answer": 0, "explain": "'Plane' here means flat, not anything to do with aircraft.", "src": "W|Which of these means the same as ‘plane mirror’?"}, {"id": "y8c06-w015", "type": "mcq", "topic": "6.3", "source": "opus", "q": "Which word describes the range of colours in a rainbow?", "options": ["spectrum", "section", "vacuum", "reflection"], "answer": 0, "explain": "A spectrum is the band of colours produced when white light is split up.", "src": "W|spectrum section vacuum reflection"}, {"id": "y8c06-w035", "type": "mcq", "topic": "6.5", "source": "opus", "q": "What is the name of the galaxy where we live?", "options": ["The Milky Way galaxy.", "The Solar System.", "The Andromeda galaxy.", "The Universe."], "answer": 0, "explain": "Our Solar System is one very small part of the Milky Way galaxy.", "src": "W|a Name the galaxy where we live."}, {"id": "y8c06-w045", "type": "mcq", "topic": "6.6", "source": "opus", "q": "Which statement describes asteroids?", "options": ["All asteroids are larger than planets.", "They are made from rock and have irregular shapes.", "All asteroids orbit the Earth.", "Asteroids are made of gas and are perfectly round."], "answer": 1, "explain": "Asteroids are lumps of rock, too small for their own gravity to pull them into a sphere.", "src": "W|Asteroids have irregular shapes."}, {"id": "qwen-01-01", "type": "mcq", "topic": "6.1", "source": "qwen", "q": "What is the name of the line that is perpendicular to the mirror surface where the light ray hits?", "explain": "The line perpendicular to the mirror is called the normal.", "src": "L|The line perpendicular to the mirror is called the normal.", "options": ["Normal", "Incident ray", "Reflected ray", "Boundary"], "answer": 0}, {"id": "qwen-01-02", "type": "fill", "topic": "6.1", "source": "qwen", "q": "A light ray arriving at a mirror is called an ____ ray.", "explain": "The incident ray as the one arriving at the mirror.", "src": "L|A light ray arriving at a mirror is called an incident ray.", "answer": ["incident"]}, {"id": "qwen-01-12", "type": "fill", "topic": "6.2", "source": "qwen", "q": "When light passes from air into glass or water, it is ____ at the boundary.", "explain": "The topic title and description indicate light is refracted at the boundary.", "src": "L|describe how light is refracted at the boundary between air and glass or air and water", "answer": ["refracted"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "6.2", "source": "qwen", "q": "What is the name for the material that light passes through?", "explain": "The material light passes through is called a medium.", "src": "L|The material that light passes through is called a medium.", "options": ["medium", "lens", "prism", "spectrum"], "answer": 0}, {"id": "qwen-02-07", "type": "mcq", "topic": "6.3", "source": "qwen", "q": "What is the name for the range of colours seen in white light?", "explain": "The range of colours in white light is called a spectrum.", "src": "L|The range of colours that can be seen in white light is called a spectrum.", "options": ["spectrum", "prism", "dispersion", "reflection"], "answer": 0}, {"id": "qwen-02-08", "type": "fill", "topic": "6.3", "source": "qwen", "q": "Dispersion means splitting light into different ____.", "explain": "Dispersion as splitting light into different colours.", "src": "L|Dispersion means splitting light into different colours.", "answer": ["colours"]}, {"id": "qwen-03-02", "type": "fill", "topic": "6.4", "source": "qwen", "q": "When red light and green light are added together, they produce the colour ____.", "explain": "Red + green = yellow as one of the effects of adding primary colours.", "src": "L|red + green = yellow", "answer": ["yellow"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "6.4", "source": "qwen", "q": "What colour is produced when red light and blue light are added together?", "explain": "Red + blue = magenta.", "src": "L|red + blue = magenta", "options": ["Magenta", "Cyan", "Yellow", "White"], "answer": 0}, {"id": "qwen-04-02", "type": "fill", "topic": "6.5", "source": "qwen", "q": "The word 'galaxy' comes from a Greek word for ____.", "explain": "The origin of the word galaxy.", "src": "L|The word ‘galaxy’ comes from a Greek word for ‘milky’.", "answer": ["milky"]}, {"id": "qwen-04-03", "type": "mcq", "topic": "6.5", "source": "qwen", "q": "What shape is the Milky Way galaxy?", "explain": "The Milky Way as a spiral galaxy.", "src": "L|The Milky Way is a spiral galaxy.", "options": ["Elliptical", "Irregular", "Spiral", "Round"], "answer": 2}, {"id": "qwen-04-07", "type": "mcq", "topic": "6.6", "source": "qwen", "q": "What are asteroids made from?", "explain": "Asteroids as objects made from rock.", "src": "L|Asteroids are objects made from rock that orbits the Sun.", "options": ["Ice and gas", "Rock", "Metal only", "Plasma"], "answer": 1}, {"id": "qwen-04-08", "type": "fill", "topic": "6.6", "source": "qwen", "q": "Most asteroids in the Solar System orbit between Mars and ____.", "explain": "Most asteroids orbit between Mars and Jupiter.", "src": "L|Most of the asteroids in the Solar System orbit the Sun between the orbits of Mars and Jupiter.", "answer": ["Jupiter"]}, {"id": "qwenw-01-01", "type": "mcq", "topic": "6.1", "source": "qwen", "q": "What is another name for a plane mirror?", "explain": "A plane mirror is a flat mirror. Here plane means flat, and has nothing to do with aircraft.", "src": "W|Which of these means the same as ‘plane mirror’?", "options": ["curved mirror", "flat mirror", "magnifying mirror", "bathroom mirror"], "answer": 1}, {"id": "qwenw-01-04", "type": "mcq", "topic": "6.2", "source": "qwen", "q": "What is the name for any transparent object that light can pass through?", "explain": "A medium as any transparent object that light can pass through.", "src": "W|What name is given to any transparent object that light can pass through?", "options": ["medium", "regular", "normal", "average"], "answer": 0}, {"id": "qwenw-01-07", "type": "fill", "topic": "6.3", "source": "qwen", "q": "The range of colours in a rainbow is called a ____.", "explain": "Which word describes the range of colours in a rainbow, with 'spectrum' being the correct option.", "src": "W|Which of these describes the range of colours in a rainbow?", "answer": ["spectrum"]}, {"id": "qwenw-01-09", "type": "fill", "topic": "6.4", "source": "qwen", "q": "The primary colours of light are red, green and ____.", "explain": "The primary colours of light as red, green and blue.", "src": "W|The primary colours of light are red, green and blue.", "answer": ["blue"]}, {"id": "qwenw-01-12", "type": "mcq", "topic": "6.5", "source": "qwen", "q": "Which of these describes the number of stars in our galaxy?", "explain": "Options for the number of stars, and 'more than 1 000 000' is the correct scientific fact for our galaxy.", "src": "W|b Which of these describes the number of stars in our galaxy?", "options": ["fewer than 100", "between 100 and 1000", "between 1000 and 1 000 000", "more than 1 000 000"], "answer": 3}, {"id": "qwenw-02-01", "type": "mcq", "topic": "6.6", "source": "qwen", "q": "Where is the asteroid belt located?", "explain": "The location options, and standard scientific knowledge confirms it is between Mars and Jupiter.", "src": "W|Between the orbits of Mars and Jupiter.", "options": ["Between the orbits of Venus and Earth", "Between the orbits of Mars an
