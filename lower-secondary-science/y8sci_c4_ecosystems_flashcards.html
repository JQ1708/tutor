:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>

": "opus", "q": "What is an ecosystem?", "options": ["A network of interactions between all the living organisms and the non-living things around them", "The place where one organism naturally lives", "All the animals that eat the same kind of food", "The non-living parts of an environment only"], "answer": 0, "explain": "An ecosystem is bigger than any one species and includes light, temperature, soil, water and air as well as the organisms.", "src": "L|An ecosystem is a network of interactions between all the living organisms and the non-living things around them."}, {"id": "y8c04-m002", "type": "mcq", "topic": "4.1", "source": "opus", "q": "What is a habitat?", "options": ["The place where an organism naturally lives", "A network of interactions between organisms", "The food that an organism eats", "The study of ecosystems"], "answer": 0, "explain": "One ecosystem contains many habitats: open desert, the inside of a cactus stem, a burrow under the soil.", "src": "L|The place where an organism naturally lives is called its habitat."}, {"id": "y8c04-m011", "type": "mcq", "topic": "4.1", "source": "opus", "q": "A saguaro cactus has no leaves. Which part does it use to make food by photosynthesis?", "options": ["Its green stems", "Its roots", "Its spines", "Its flowers"], "answer": 0, "explain": "Leaves would lose water by evaporation, so the cactus does the job with a stem that also stores water.", "src": "W|Instead, the cactus uses its green stems to make food by photosynthesis."}, {"id": "y8c04-m012", "type": "mcq", "topic": "4.1", "source": "opus", "q": "Why can saguaro cacti not grow where the temperature falls below 0 degrees Celsius?", "options": ["Their cells are killed if they freeze", "Their roots cannot absorb frozen rain", "Their spines fall off in the cold", "They cannot flower in the cold"], "answer": 0, "explain": "This is why saguaros are found in the desert but not on the cold mountains nearby.", "src": "W|Their cells are killed if they freeze."}, {"id": "y8c04-m013", "type": "mcq", "topic": "4.2", "source": "opus", "q": "What is unusual about where mangroves can grow?", "options": ["They are trees that can grow with their roots in sea water", "They are trees that grow with no roots at all", "They are trees that grow only in fresh water", "They are trees that grow only on dry sand"], "answer": 0, "explain": "Most trees cannot tolerate salt water, so mangroves have a coastal habitat almost to themselves.", "src": "L|Mangroves are trees that can grow with their roots in sea water."}, {"id": "y8c04-m014", "type": "mcq", "topic": "4.2", "source": "opus", "q": "Why do young fish live among the mangrove roots?", "options": ["They are safe from larger fish that might eat them", "The water there is much warmer", "There is more light among the roots", "The roots are their only food"], "answer": 0, "explain": "The tangle of roots is too narrow for big predators to follow them into.", "src": "L|Young fi sh live among the mangrove roots, safe from larger fi sh that might eat them."}, {"id": "y8c04-m021", "type": "mcq", "topic": "4.2", "source": "opus", "q": "At a deep-sea hydrothermal vent, which organisms are the producers in the food chain?", "options": ["Tiny bacteria", "Green plants", "Giant tube worms", "Shrimps"], "answer": 0, "explain": "There is no light in the deep ocean, so the producers cannot be plants.", "src": "W|Instead of plants, tiny bacteria are the producers in the food chain."}, {"id": "y8c04-m022", "type": "mcq", "topic": "4.2", "source": "opus", "q": "Where do the producers at a hydrothermal vent get their energy from?", "options": ["From the chemicals dissolved in the hot water", "From sunlight reaching the sea bed", "From the heat of the sea water alone", "From eating zooplankton"], "answer": 0, "explain": "This is the key difference from every food chain you have met before, where the energy comes from light.", "src": "W|Instead of using energy from light to make food, they use energy in the chemicals dissolved in the hot water."}, {"id": "y8c04-m024", "type": "mcq", "topic": "4.3", "source": "opus", "q": "What was true about New Zealand before humans arrived?", "options": ["There were no predatory mammals there", "There were no birds there", "There were no plants there", "There were no insects there"], "answer": 0, "explain": "New Zealand had been separated from other land for about 66 million years, so its species developed on their own.", "src": "L|Before humans arrived in New Zealand, there were no predatory mammals there."}, {"id": "y8c04-m025", "type": "mcq", "topic": "4.3", "source": "opus", "q": "Why were the eggs and young of New Zealand's ground-nesting birds safe before humans arrived?", "options": ["There were no predators to eat their eggs", "The eggs were hidden high in trees", "The adult birds could fly away with them", "The eggs had very thick shells"], "answer": 0, "explain": "With no danger on the ground, several species even lost the ability to fly.", "src": "L|There were no predators to eat their eggs, so the eggs and young birds were safe."}, {"id": "y8c04-m033", "type": "mcq", "topic": "4.3", "source": "opus", "q": "Water hyacinth forms such a thick covering on a lake that native plants and fish die. Why?", "options": ["Light and oxygen cannot reach the water below", "The plants poison the water with a toxin", "The plants eat the fish directly", "The water becomes too cold for fish"], "answer": 0, "explain": "Producers below the surface cannot photosynthesise without light, and animals cannot respire without oxygen.", "src": "W|They make such a thick covering that light and oxygen cannot reach the water below."}, {"id": "y8c04-m037", "type": "mcq", "topic": "4.4", "source": "opus", "q": "DDT does not break down in the environment. What word describes a chemical like this?", "options": ["Persistent", "Soluble", "Nutritious", "Temporary"], "answer": 0, "explain": "Because it never breaks down, DDT sprayed decades ago can still be found in living things today.", "src": "L|It is a persistent chemical."}, {"id": "y8c04-m038", "type": "mcq", "topic": "4.4", "source": "opus", "q": "Why does DDT stay in the environment for many years?", "options": ["It is not broken down by decomposers", "It is washed away by rain each year", "It is absorbed and destroyed by plants", "It evaporates within a few days"], "answer": 0, "explain": "Decomposers break down most substances that get into soil and water, but not this one.", "src": "L|It is not broken down by decomposers."}, {"id": "y8c04-m048", "type": "mcq", "topic": "4.4", "source": "opus", "q": "Why may the concentration of microplastics in a seal's body be greater than in a fish's body?", "options": ["The seal takes in the microplastics from all the fish it eats, and they cannot be broken down", "The seal drinks more sea water than the fish", "Microplastics are made inside the seal's body", "The seal lives in colder water than the fish"], "answer": 0, "explain": "Microplastics behave exactly like DDT in a food chain: they cannot be broken down, so they build up and magnify.", "src": "W|Explain why the concentration of microplastics in a seal’s body may be greater than the concentration in a fish’s body."}, {"id": "y8c04-m049", "type": "fill", "topic": "4.1", "source": "opus", "q": "An ecosystem is a network of ____ between all the living organisms and the non-living things around them.", "answer": ["interactions"], "explain": "The interactions matter as much as the list of species.", "src": "L|An ecosystem is a network of interactions between all the living organisms and the non-living things around them."}, {"id": "y8c04-m054", "type": "fill", "topic": "4.1", "source": "opus", "q": "There are sharp ____ on the cactus stems, which protect them from being eaten by animals.", "answer": ["spines"], "explain": "The same structure that protects the cactus also protects birds that nest in it.", "src": "W|There are sharp spines on the cactus stems, which protect them from being eaten by animals."}, {"id": "y8c04-m055", "type": "fill", "topic": "4.2", "source": "opus", "q": "Mangroves are trees that can grow with their roots in ____ water.", "answer": ["sea"], "explain": "Almost no other tree can tolerate salt water.", "src": "L|Mangroves are trees that can grow with their roots in sea water."}, {"id": "y8c04-m057", "type": "fill", "topic": "4.2", "source": "opus", "q": "At a hydrothermal vent, tiny ____ are the producers in the food chain instead of plants.", "answer": ["bacteria"], "explain": "No light reaches the deep sea bed, so the producers cannot photosynthesise.", "src": "W|Instead of plants, tiny bacteria are the producers in the food chain."}, {"id": "y8c04-m060", "type": "fill", "topic": "4.3", "source": "opus", "q": "People in New Zealand are trying to ____ stoats, which means to completely get rid of them.", "answer": ["eradicate"], "explain": "In practice the best that can be done is to control their numbers.", "src": "L|People in New Zealand are now trying to eradicate (completely get rid of) stoats, but this is very diffi cult to do."}, {"id": "y8c04-m063", "type": "fill", "topic": "4.3", "source": "opus", "q": "Water hyacinth makes such a thick covering that light and ____ cannot reach the water below.", "answer": ["oxygen"], "explain": "Without either, the native plants and fish below cannot survive.", "src": "W|They make such a thick covering that light and oxygen cannot reach the water below."}, {"id": "y8c04-m065", "type": "fill", "topic": "4.4", "source": "opus", "q": "A chemical that does not break down, such as DDT, is described as a ____ chemical.", "answer": ["persistent"], "explain": "It stays in the environment for many years.", "src": "L|It is a persistent chemical."}, {"id": "y8c04-r001", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain why the plants of the Sonoran Desert must be adapted to survive with very little water.", "answer": "Deserts get very little rainfall, so there is hardly any water in the soil for most of the year. An organism with no adaptation for saving or storing water would dry out and die, so only species with such adaptations survive there.", "keywords": ["little rainfall", "adaptations", "survive", "water"], "src": "L|Deserts do not get much rainfall, so the organisms that live there must have adaptations that help them to survive with little water."}, {"id": "y8c04-r002", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain the advantage to a saguaro cactus of having roots that spread out widely just under the soil surface.", "answer": "Rain in a desert is rare and soaks only the top of the soil before it evaporates. Wide, shallow roots cover a large area of that thin wet layer, so the cactus can absorb a lot of water quickly in the short time it is available.", "keywords": ["wide", "shallow", "absorb", "large area", "rain"], "src": "L|Their roots spread out widely just underneath the soil, ready to absorb any rain that falls."}, {"id": "y8c04-r003", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain how nesting in a teddy bear cholla protects a cactus wren's eggs and young.", "answer": "The cholla is so spiky that very few other animals will go near it. Predators that would eat the eggs or the chicks cannot reach the nest, so more of the young survive.", "keywords": ["spiky", "predators", "cannot reach", "protected"], "src": "L|Teddy bear chollas are so spiky that very few other animals will get close to them."}, {"id": "y8c04-r004", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain why many desert animals rest in the shade or burrow into the soil during the hot day.", "answer": "The air temperature in the open is very high during the day. Shade and soil are cooler, so hiding there stops the animal overheating and losing too much water by evaporation.", "keywords": ["cooler", "overheating", "water loss", "shade", "burrow"], "src": "L|During the hot days, lizards, tortoises and other animals rest in the shade of the plants, or burrow into the soil where it is cooler."}, {"id": "y8c04-r005", "type": "short", "topic": "4.1", "source": "opus", "q": "Kangaroo rats come out to feed at night. Suggest two advantages of being active at night in a desert.", "answer": "It is much cooler at night, so the rat loses less water and does not overheat. Many daytime predators are not hunting then, although rattlesnakes and coyotes still are, so the risk of being eaten is lower than in daylight.", "keywords": ["cooler", "less water", "predators", "night", "nocturnal"], "src": "L|At night, when the temperature falls, kangaroo rats come out to feed, wary of their predators such as rattlesnakes and coyotes."}, {"id": "y8c04-r006", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain how insects feeding on nectar benefit the desert plants.", "answer": "While the insect feeds it picks up pollen and carries it to another flower. This pollinates the plants, so they can reproduce and make seeds. Both organisms gain, so it is an interaction that benefits each of them.", "keywords": ["pollen", "pollinate", "reproduce", "nectar"], "src": "L|Insects feed on the nectar and pollen in the fl owers, helping the plants to reproduce by pollinating them."}, {"id": "y8c04-r007", "type": "short", "topic": "4.1", "source": "opus", "q": "Ants collect seeds and store them in their nests. Explain how this can still lead to new plants growing.", "answer": "The ants do not eat every seed they store. Some are left uneaten in the nest, and months or years later those seeds germinate and grow into new plants.", "keywords": ["uneaten", "germinate", "new plants", "store"], "src": "L|Seeds fall to the ground and are collected by ants, to take into their nests to provide a food store."}, {"id": "y8c04-r008", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain how being nocturnal helps some desert animals to avoid overheating or drying out.", "answer": "The temperature is often very high during the day but much lower at night. An animal that is active only at night is never exposed to the highest temperatures, so it does not overheat and loses less water by evaporation.", "keywords": ["temperature", "night", "overheat", "drying out"], "src": "L|Some animals are nocturnal, which helps them to avoid overheating or drying out."}, {"id": "y8c04-r009", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain why the air is an important non-living part of the desert ecosystem.", "answer": "The air supplies carbon dioxide, which the plants need for photosynthesis to make food, and oxygen, which all the organisms need for respiration to release energy.", "keywords": ["carbon dioxide", "photosynthesis", "oxygen", "respiration"], "src": "L|Air: The desert air provides carbon dioxide for the plants to use in photosynthesis, and oxygen for all the organisms to use in respiration."}, {"id": "y8c04-r010", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain how kangaroo rats affect the non-living part of their environment.", "answer": "Their droppings break down and become part of the soil, adding minerals to it. The gases they take in and give out also change the composition of the air, so the organisms change the environment as well as being affected by it.", "keywords": ["droppings", "soil", "gases", "air", "affect"], "src": "L|For example, droppings from the kangaroo rats become part of the soil."}, {"id": "y8c04-r011", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain why a food web on its own is not a full description of an ecosystem.", "answer": "An ecosystem is the whole network of interactions between all the organisms and the non-living things around them. A food web shows only the feeding interactions, and leaves out things such as nesting sites, pollination, roots holding the soil, and the effects of light, temperature and water.", "keywords": ["network", "interactions", "non-living", "feeding only"], "src": "L|An ecosystem is a network of interactions between all the living organisms and the non-living things around them."}, {"id": "y8c04-r012", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain how plant roots help to protect the desert soil.", "answer": "The roots hold the soil particles together. When heavy rain falls the soil is not washed away, so the minerals and the habitat for soil organisms stay in place.", "keywords": ["roots", "hold", "soil", "washed away"], "src": "L|Plant roots help to hold the soil together, so that it does not wash away when it rains."}, {"id": "y8c04-r013", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain why a desert food web could not exist without the producers.", "answer": "Producers are the only organisms that make their own food, using energy from sunlight. Every other organism in the web gets its energy by eating plants or by eating animals that ate plants, so with no producers there would be no energy entering the web at all.", "keywords": ["producers", "make their own food", "energy", "sunlight"], "src": "L|Explain why the food web could not exist without the producers."}, {"id": "y8c04-r014", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain what the arrows in a food web represent, and why they point the way they do.", "answer": "Each arrow shows the transfer of energy and nutrients from the organism being eaten to the organism that eats it. The arrow points in the direction the energy travels, so it points towards the consumer, not towards the food.", "keywords": ["energy", "transfer", "eaten", "direction"], "src": "L|What do the arrows in the food web represent?"}, {"id": "y8c04-r015", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain the difference between an ecosystem and a habitat.", "answer": "A habitat is the place where a particular organism naturally lives, such as the inside of a saguaro flower for a sap beetle. An ecosystem is much larger: it is the whole network of interactions between all the organisms in an area and the non-living things around them, and it contains many different habitats.", "keywords": ["habitat", "place", "ecosystem", "network", "interactions"], "src": "L|Explain the difference between an ecosystem and habitat."}, {"id": "y8c04-r016", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain how mangrove roots help young fish to survive.", "answer": "The tangle of roots is too narrow and cluttered for larger fish to swim through. Young fish can shelter among them, so they are safe from the predators that would otherwise eat them.", "keywords": ["roots", "shelter", "safe", "larger fish", "predators"], "src": "L|Young fi sh live among the mangrove roots, safe from larger fi sh that might eat them."}, {"id": "y8c04-r017", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain the role of bacteria in the mangrove ecosystem.", "answer": "Bacteria decompose the mangrove leaves that fall onto the mud. This breaks the dead material down so that prawns and crabs can feed on it, and returns minerals to the mud for the trees to use again.", "keywords": ["decompose", "bacteria", "dead leaves", "minerals"], "src": "L|As the mangrove leaves fall onto the mud, they are decomposed by bacteria."}, {"id": "y8c04-r018", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain how tiny algae can grow on the underside of Arctic sea ice.", "answer": "Enough light passes through the ice to reach them, so they can photosynthesise. They are the producers of that ecosystem, even though they are living under the ice.", "keywords": ["light", "through the ice", "photosynthesise", "producers"], "src": "L|Enough light passes through the ice to allow tiny algae (single-celled plants) to grow on the underside of the ice fl oes."}, {"id": "y8c04-r019", "type": "short", "topic": "4.2", "source": "opus", "q": "Suggest why being a good swimmer is an important adaptation for a polar bear.", "answer": "The sea ice is broken into floes with water between them. A bear that can swim well can move from one floe to another to reach new hunting grounds, so it can keep finding seals as the ice shifts.", "keywords": ["swim", "ice floe", "hunting", "seals"], "src": "L|Polar bears are good swimmers, and can move from one ice fl oe to another."}, {"id": "y8c04-r020", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain why the water in a rice paddy heats up quickly during the day and cools quickly at night.", "answer": "The water is very shallow, so there is only a small mass of water to be warmed or cooled. A small amount of water needs much less energy to change its temperature than a deep body of water, so it changes temperature quickly in both directions.", "keywords": ["shallow", "small mass", "temperature", "quickly"], "src": "L|Because the water is shallow, it heats up quickly during the day, and cools down quickly at night."}, {"id": "y8c04-r021", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain how adding fertiliser to a paddy field affects the animals that live there.", "answer": "The fertiliser makes not only the rice but also the algae grow faster. The algae are producers, so more of them means more food for the animals that eat them, and the numbers of those animals can increase.", "keywords": ["fertiliser", "algae", "producers", "more food"], "src": "L|Farmers often add fertiliser to the paddy fi elds, making not only the rice but also the algae grow faster, providing more food for the animals."}, {"id": "y8c04-r022", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain why plants cannot live at a hydrothermal vent.", "answer": "Vents are in the deep ocean where no sunlight reaches. Plants need light for photosynthesis to make their food, so without light they cannot survive there.", "keywords": ["deep ocean", "no light", "photosynthesis", "cannot"], "src": "W|In the deep ocean, below the surface, scientists found places where hot water rushes out from the sea bed into the water."}, {"id": "y8c04-r023", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain how the producers at a hydrothermal vent obtain their energy, and why this is unusual.", "answer": "The bacteria use energy in the chemicals dissolved in the hot water instead of energy from light. Almost every other food chain on Earth starts with a producer that uses sunlight, so this is a food chain that does not depend on the Sun at all.", "keywords": ["bacteria", "chemicals", "instead of light", "energy"], "src": "W|Instead of using energy from light to make food, they use energy in the chemicals dissolved in the hot water."}, {"id": "y8c04-r024", "type": "short", "topic": "4.2", "source": "opus", "q": "Explain how the giant tube worms and the bacteria that live inside them both benefit.", "answer": "The worm provides a habitat for the bacteria, a safe place to live with a supply of the chemicals they need. In return the worm uses some of the food that the bacteria make, so each organism gains from the interaction.", "keywords": ["habitat", "food", "both benefit", "bacteria"], "src": "W|The worms provide a habitat for the bacteria, and use some of the food that the bacteria make."}, {"id": "y8c04-r025", "type": "short", "topic": "4.2", "source": "opus", "q": "Ecologists compared coral reefs with mangroves on the shore and reefs without. Explain what this comparison was designed to find out.", "answer": "It tests whether the presence of mangroves affects the numbers of fish on the nearby reef. The reefs without mangroves act as the comparison, so any difference in fish mass can be linked to the mangroves rather than to the reef itself.", "keywords": ["compare", "mangroves", "numbers of fish", "control"], "src": "W|Ecologists wanted to find out whether the presence of mangroves affected the numbers of fish in nearby coral reef ecosystems."}, {"id": "y8c04-r026", "type": "short", "topic": "4.2", "source": "opus", "q": "Suggest why coral reefs near mangroves may have a greater mass of fish than reefs with no mangroves.", "answer": "Baby fish spend their early lives among the mangrove roots, safe from larger fish that would eat them. More of them survive to adulthood and then move out onto the reef, so the reef next to mangroves has more and larger fish.", "keywords": ["baby fish", "roots", "safe", "survive", "reef"], "src": "W|Baby fish often spend their early lives amongst the mangrove roots, safe from predators such as larger fish."}, {"id": "y8c04-r027", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain why the species that developed in New Zealand are different from those elsewhere on Earth.", "answer": "New Zealand became separated from all other land about 66 million years ago. After that, organisms could not move between New Zealand and other places, so the species there changed on their own and became different from species anywhere else.", "keywords": ["separated", "66 million", "isolated", "different"], "src": "L|Because of this separation, the species that developed in New Zealand were different from those elsewhere on Earth."}, {"id": "y8c04-r028", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain why so many New Zealand birds nest on the ground and some cannot fly.", "answer": "Before humans arrived there were no predatory mammals in New Zealand, so eggs and young birds on the ground were safe and there was no advantage in being able to fly away. Birds without those costly abilities survived just as well, so ground nesting and flightlessness became common.", "keywords": ["no predators", "safe", "ground", "cannot fly"], "src": "L|There were no predators to eat their eggs, so the eggs and young birds were safe."}, {"id": "y8c04-r029", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain why the arrival of rats was so damaging to New Zealand's native birds.", "answer": "The rats eat birds' eggs and defenceless young birds. The native birds had evolved with no predatory mammals, so they had no adaptations or behaviour to protect their nests, and huge numbers of eggs and chicks were lost.", "keywords": ["rats", "eggs", "young birds", "no defences"], "src": "L|The rats eat birds’ eggs and defenceless young birds."}, {"id": "y8c04-r030", "type": "short", "topic": "4.3", "source": "opus", "q": "People brought stoats to New Zealand to control rabbits. Explain why this was not a good solution.", "answer": "The stoats did not stay with the rabbits. They are fierce hunters that breed rapidly, so they spread all over New Zealand and killed native birds as well, making species such as the laughing owl and the New Zealand thrush extinct.", "keywords": ["stoats", "spread", "breed rapidly", "native birds", "extinct"], "src": "L|So people brought stoats from Europe to control the rabbits."}, {"id": "y8c04-r031", "type": "short", "topic": "4.3", "source": "opus", "q": "Suggest why it is very difficult to eradicate an introduced species once it has settled into a new place.", "answer": "It has usually spread over a very large area and breeds rapidly, so any survivors quickly build the numbers back up. There are also few predators or diseases in the new place to keep it under control, and any method used to kill it may harm native species too.", "keywords": ["spread", "breed rapidly", "few predators", "survivors"], "src": "L|Suggest why it is very difficult to eradicate an introduced species, once it has settled into a new place."}, {"id": "y8c04-r032", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain how buffelgrass could harm the native plants of the Sonoran Desert.", "answer": "Buffelgrass takes water and nutrients from the soil. In a desert both are already in short supply, so there is less left for the native plants, and slow-growing species such as the saguaro cactus may not survive.", "keywords": ["water", "nutrients", "soil", "compete", "native"], "src": "L|It takes water and nutrients from the soil."}, {"id": "y8c04-r033", "type": "short", "topic": "4.3", "source": "opus", "q": "Buffelgrass could reduce the number of saguaro cacti. Suggest how this would affect other desert species.", "answer": "Many animals depend on the cactus: woodpeckers make nest holes in the stems, elf owls use the old holes, hawks nest where the arms branch, bats feed on the nectar and many animals eat the fruits. Fewer cacti means fewer nest sites and less food, so the numbers of all those species would fall.", "keywords": ["nest holes", "food", "fruits", "numbers fall", "depend"], "src": "L|Suggest how buffelgrass could affect some of the native species in the desert."}, {"id": "y8c04-r034", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain how beavers change the habitat they live in.", "answer": "They cut down trees with their sharp teeth and use them to build dams. The dams slow the river water and form deep, wide pools, so fast shallow river is replaced by still deep water and the trees along the bank are lost.", "keywords": ["dams", "slow", "pools", "cut down trees"], "src": "W|The dams slow down the river water and form deep, wide pools."}, {"id": "y8c04-r035", "type": "short", "topic": "4.3", "source": "opus", "q": "Some people suggest introducing brown bears to control the beavers in Tierra del Fuego. Suggest why this might not be a good idea.", "answer": "The bear would itself be an introduced species with no predators there. It may not eat only beavers, and could attack native animals or livestock, so the plan risks repeating exactly the problem it is meant to solve.", "keywords": ["introduced species", "no predators", "eat native", "repeat the problem"], "src": "W|Some people have suggested introducing brown bears to Tierra del Fuego, to control the beavers."}, {"id": "y8c04-r036", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain why water hyacinths are not an invasive species in South America.", "answer": "South America is where they live naturally, and several herbivores there feed on them. Being eaten keeps the numbers down, so the plants never multiply enough to take over the water.", "keywords": ["native", "herbivores", "feed on them", "numbers controlled"], "src": "W|Explain why water hyacinths are not an invasive species in South America."}, {"id": "y8c04-r037", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain why a thick covering of water hyacinth kills the organisms living in the water below.", "answer": "The covering stops light and oxygen reaching the water underneath. Without light the water plants and algae cannot photosynthesise, and without oxygen the animals cannot respire, so the organisms below die.", "keywords": ["light", "oxygen", "photosynthesise", "respire"], "src": "W|They make such a thick covering that light and oxygen cannot reach the water below."}, {"id": "y8c04-r038", "type": "short", "topic": "4.3", "source": "opus", "q": "Explain how water hyacinth causes problems for the fishing communities on Lake Victoria.", "answer": "There is so much of the plant that the fishing boats cannot move through it, and the nets fill with water hyacinth instead of fish. People who depend on fishing lose both their food and their income.", "keywords": ["boats", "cannot move", "nets", "not fish"], "src": "W|On Lake Victoria, in Tanzania and Uganda, there is so much water hyacinth that the fishing boats cannot move through it."}, {"id": "y8c04-r039", "type": "short", "topic": "4.3", "source": "opus", "q": "Suggest why cane toad numbers have increased rapidly in Australia while staying fairly constant in South America.", "answer": "In South America they have many predators that keep the numbers under control. In Australia the predators that eat cane toads often die, so almost nothing kills the toads and their numbers rise quickly.", "keywords": ["predators", "control", "Australia", "die", "increase"], "src": "W|Suggest why the numbers of cane toads have increased rapidly in Australia, whereas in their native South America the numbers stay fairly constant."}, {"id": "y8c04-r040", "type": "short", "topic": "4.3", "source": "opus", "q": "Scientists feed northern quolls small sausages of cane toad meat that make them vomit. Explain how this is meant to save the quolls.", "answer": "The sausage is small enough to make the quoll sick without killing it. The scientists hope the quoll will learn to connect the taste of cane toad with feeling ill and avoid eating them, so it will not take a fatal dose from a real toad.", "keywords": ["sick", "not kill", "learn", "avoid"], "src": "W|They are making little sausages of cane toad meat and feeding them to the quolls."}, {"id": "y8c04-r041", "type": "short", "topic": "4.3", "source": "opus", "q": "When planning an experiment to test whether trained quolls survive better, name the variables the scientists should change, measure and keep the same.", "answer": "They should change whether the quoll has been fed the toad sausages or not. They should measure how many quolls in each group are still alive after a set time, or how many eat a cane toad. They should keep the same the area the quolls are released into, the number and age of quolls in each group, and the length of the study.", "keywords": ["change", "measure", "keep the same", "variables"], "src": "W|Remember to think about variables that the scientists should change, measure or keep the same."}, {"id": "y8c04-r042", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why DDT was thought to be safe when it was first used.", "answer": "It was used to kill insects that spread diseases such as malaria and typhus, and insects that eat crops, and it worked very well. No one had tested what it did to other animals, so no one thought it could harm organisms other than insects.", "keywords": ["insects", "disease", "no one thought", "other organisms"], "src": "L|No one thought that DDT could harm organisms other than insects."}, {"id": "y8c04-r043", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why Rachel Carson's book Silent Spring was important.", "answer": "She described how DDT was killing not only mosquitoes but also birds. The book made many people realise that insecticides can be very harmful to the environment, which changed public opinion and led scientists to investigate how the harm happens.", "keywords": ["Silent Spring", "birds", "harmful", "environment"], "src": "L|She described how DDT was killing not only mosquitoes, but also birds."}, {"id": "y8c04-r044", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why the fact that DDT stays in the environment for many years makes it so harmful.", "answer": "Because it does not break down, every amount ever sprayed is still present and keeps building up. It can also be blown long distances in the air, so it reaches organisms far from where it was used, and once it is inside an animal it stays there for the animal's whole life.", "keywords": ["does not break down", "builds up", "long distances", "whole life"], "src": "L|It stays in the environment for many years."}, {"id": "y8c04-r045", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain what bioaccumulation means, using DDT as your example.", "answer": "Bioaccumulation is the build-up of a substance inside the body of a single organism over its lifetime. DDT never breaks down, so every bit an animal takes in stays in its body, and the longer it lives and the more it takes in, the more DDT it has.", "keywords": ["build-up", "one organism", "lifetime", "never breaks down"], "src": "L|When DDT gets into an animal’s body, it stays there for the whole life of the organism – it never breaks down."}, {"id": "y8c04-r046", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why the concentration of DDT increases as you go up a food chain.", "answer": "Each shrimp eats a large quantity of algae and keeps all the DDT from every one of them. A fish then eats many shrimps and keeps all of that DDT, and a cormorant eats many fish. At each step the DDT from a large mass of food is concentrated into a much smaller mass of predator, so the concentration rises along the chain.", "keywords": ["all the DDT", "many", "concentrated", "up the chain"], "src": "L|This means that the concentration of DDT in an animal’s body increases as you go up the food chain."}, {"id": "y8c04-r047", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why a cormorant has a much higher concentration of DDT in its body than a minnow.", "answer": "The cormorant is further up the food chain. It eats many fish over its life, and each of those fish had already accumulated the DDT from many shrimps, which had accumulated it from many protoctists. All of that DDT ends up in the cormorant and none of it breaks down.", "keywords": ["further up", "eats many", "accumulated", "none breaks down"], "src": "L|Explain, in your own words, why the concentration in the cormorant is greater than in a minnow."}, {"id": "y8c04-r048", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain how DDT in a female bird's body can stop her eggs hatching.", "answer": "DDT makes the shells of the eggs very thin and easy to break. The eggs crack or are crushed before the chicks are ready, so they do not hatch, and the number of young birds falls.", "keywords": ["thin shells", "break", "do not hatch", "fewer young"], "src": "L|For example, it makes the shells of birds’ eggs very thin and easy to break."}, {"id": "y8c04-r049", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why some microplastics end up in the mud at the bottom of the sea.", "answer": "Some microplastics are denser than sea water, so instead of floating they slowly sink and settle on the sea bed, where they become part of the mud.", "keywords": ["denser", "sink", "sea bed", "mud"], "src": "W|Explain why some microplastics end up in the mud at the bottom of the sea."}, {"id": "y8c04-r050", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why fish that filter zooplankton out of sea water may end up with microplastics in their bodies.", "answer": "Microplastics float in the water at the same size as the zooplankton. The fish sucks in sea water and filters out everything of that size, so it takes in the plastic particles accidentally along with its food.", "keywords": ["filter", "float", "accidentally", "with their food"], "src": "W|Explain why these fish may end up with microplastics in their bodies."}, {"id": "y8c04-r051", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why the concentration of microplastics in a seal's body may be greater than in a fish's body.", "answer": "Microplastics cannot be broken down by living things, so they stay in the body. A seal eats many fish over its life and keeps the microplastics from every one of them, so the plastic from a large mass of fish is concentrated in one seal.", "keywords": ["cannot be broken down", "eats many fish", "concentrated", "stays"], "src": "W|Explain why the concentration of microplastics in a seal’s body may be greater than the concentration in a fish’s body."}, {"id": "y8c04-r052", "type": "short", "topic": "4.4", "source": "opus", "q": "The farmers think the chemical company's information may be biased. Explain why.", "answer": "The company makes money from selling the spray, so it gains if the farmers believe it is safe and effective. Information from someone with something to gain may leave out unfavourable results, so it should be checked against an independent source.", "keywords": ["makes money", "something to gain", "leave out", "independent"], "src": "W|The farmers are concerned that the information from the chemical company may be biased."}, {"id": "y8c04-r053", "type": "short", "topic": "4.4", "source": "opus", "q": "The predators being sold are said to eat only one species of insect. Suggest what problems could arise if they in fact eat other insects too.", "answer": "They would reduce the numbers of harmless insects as well, including pollinators and the prey of other animals. That would disturb the local food webs, and the predators themselves could become an invasive species with no natural control.", "keywords": ["other insects", "pollinators", "food webs", "invasive"], "src": "W|If the predators of these insect pests do eat other insects what problems could this cause?"}, {"id": "y8c04-r054", "type": "short", "topic": "4.4", "source": "opus", "q": "Suggest why animals higher up the food chain are at more risk from a chemical insect spray.", "answer": "The spray does not break down quickly, so it stays in the bodies of the insects that take it in. Each predator eats many of those insects and keeps all the chemical, so the concentration is higher at every step and the animals at the top receive the largest dose.", "keywords": ["does not break down", "eats many", "concentration", "highest", "top"], "src": "W|Suggest why the animals higher up the food chain are at more risk of being affected by this chemical spray."}, {"id": "y8c04-r055", "type": "short", "topic": "4.4", "source": "opus", "q": "The government agriculture department also gives the farmers advice. Explain whether the farmers can be sure this advice is unbiased.", "answer": "They cannot be certain. A government department has no product to sell, so it has less reason to be biased than the chemical company, but it may still have its own policies or interests. The safest approach is to compare advice from several independent sources, such as the university developing the resistant maize.", "keywords": ["cannot be certain", "no product to sell", "less reason", "compare sources"], "src": "W|Can the farmers be sure that the advice is unbiased?"}, {"id": "y8c04-o001", "type": "short", "topic": "4.1", "source": "opus", "q": "Why is it difficult for animals and plants to live in a desert?", "answer": "Deserts get very little rainfall, so organisms must survive with very little water.", "keywords": ["little rainfall", "water"], "explain": "Water is needed to keep cells alive, so a shortage of water is the main problem in a desert.", "src": "L|Deserts are not easy places for animals and plants to live."}, {"id": "y8c04-o002", "type": "short", "topic": "4.1", "source": "opus", "q": "What must desert organisms have in order to survive with little water?", "answer": "Adaptations that help them to survive with little water.", "keywords": ["adaptations"], "explain": "An adaptation is a feature that helps an organism to survive in its habitat.", "src": "L|Deserts do not get much rainfall, so the organisms that live there must have adaptations that help them to survive with little water."}, {"id": "y8c04-o003", "type": "short", "topic": "4.1", "source": "opus", "q": "In which country is the Sonoran Desert that you studied?", "answer": "The USA - it is in Arizona.", "keywords": ["USA", "Arizona"], "explain": "The Sonoran Desert stretches across Arizona in the USA and into Mexico.", "src": "L|The photograph shows the Sonoran Desert in Arizona, in the USA."}, {"id": "y8c04-o004", "type": "short", "topic": "4.1", "source": "opus", "q": "Name the tall cacti that grow in the Sonoran Desert.", "answer": "Saguaro cacti.", "keywords": ["saguaro"], "explain": "Saguaro cacti are the tall, branching cacti in the photographs of the Sonoran Desert.", "src": "L|The tall plants in the photograph are saguaro cacti."}, {"id": "y8c04-o037", "type": "short", "topic": "4.1", "source": "opus", "q": "Sofia says an ecosystem is more than just a place. Is she right? Explain.", "answer": "Yes. An ecosystem is the network of interactions between all the living organisms and the non-living things around them, not simply the place itself.", "keywords": ["network", "interactions", "not just a place"], "explain": "The place is where it happens; the ecosystem is what happens there.", "src": "L|An ecosystem is a network of interactions between all the living organisms and the non-living things around them."}, {"id": "y8c04-o055", "type": "short", "topic": "4.1", "source": "opus", "q": "Explain the difference between a habitat and an ecosystem.", "answer": "A habitat is the place where an organism naturally lives. An ecosystem is the network of interactions between all the organisms and the non-living things around them.", "keywords": ["place", "network", "interactions"], "explain": "One ecosystem contains many different habitats.", "src": "L|The place where an organism naturally lives is called its habitat."}, {"id": "y8c04-o058", "type": "short", "topic": "4.1", "source": "opus", "q": "Give two ways in which the saguaro cactus is adapted to live in the desert.", "answer": "Its roots spread out widely just below the surface so it can capture a lot of water when it rains, and it has no leaves, so less water evaporates.", "keywords": ["roots spread out", "no leaves", "water"], "explain": "Both adaptations are about getting and keeping water.", "src": "W|Their roots spread out widely, just below the soil surface."}, {"id": "y8c04-o069", "type": "short", "topic": "4.2", "source": "opus", "q": "Name three ecosystems other than the desert that you have studied.", "answer": "Mangrove forests, sea ice in the Arctic Ocean, and a rice paddy.", "keywords": ["mangrove", "sea ice", "rice paddy"], "explain": "Ecosystems can be hot or cold, natural or farmed.", "src": "L|Here are three more examples of ecosystems: mangrove forests, sea ice in the Arctic Ocean, and a rice paddy."}, {"id": "y8c04-o070", "type": "short", "topic": "4.2", "source": "opus", "q": "What is unusual about where mangrove trees grow?", "answer": "They can grow with their roots in sea water.", "keywords": ["roots", "sea water"], "explain": "Most plants are killed by the salt in sea water.", "src": "L|Mangroves are trees that can grow with their roots in sea water."}, {"id": "y8c04-o071", "type": "short", "topic": "4.2", "source": "opus", "q": "Where in the world are mangrove forests found?", "answer": "Along the coasts of many tropical countries.", "keywords": ["coasts", "tropical"], "explain": "Mangroves need warm water all year round.", "src": "L|They form forests along the coasts of many tropical countries"}, {"id": "y8c04-o073", "type": "short", "topic": "4.2", "source": "opus", "q": "What do mud skippers do when the tide is out?", "answer": "They climb out onto the mud and feed on whatever they can find.", "keywords": ["climb out", "mud", "feed"], "explain": "A mud skipper can stay out of water for a while, unlike most fish.", "src": "L|Mud skippers climb out onto the mud when the tide is out, feeding on whatever they can find."}, {"id": "y8c04-o074", "type": "short", "topic": "4.2", "source": "opus", "q": "What happens to the mangrove leaves that fall onto the mud?", "answer": "They are decomposed by bacteria.", "keywords": ["decomposed", "bacteria"], "explain": "Decomposers break down dead material and release nutrients.", "src": "L|As the mangrove leaves fall onto the mud, they are decomposed by bacteria."}, {"id": "y8c04-o075", "type": "short", "topic": "4.2", "source": "opus", "q": "Which animals eat the partly decomposed mangrove leaves?", "answer": "Prawns and crabs.", "keywords": ["prawns", "crabs"], "explain": "Dead material can be the base of a food chain as well as living plants.", "src": "L|Prawns and crabs eat the partly decomposed leaves."}, {"id": "y8c04-o076", "type": "short", "topic": "4.2", "source": "opus", "q": "What do crab-eating macaques feed on in a mangrove forest?", "answer": "Crabs, which they catch on the tree roots and mud.", "keywords": ["crabs", "roots", "mud"], "explain": "Macaques are monkeys that climb through the mangrove trees.", "src": "L|Crab-eating macaques, a type of monkey, climb through the trees and catch crabs on the tree roots and mud."}, {"id": "y8c04-o077", "type": "short", "topic": "4.2", "source": "opus", "q": "Why does some of the sea water in the Arctic Ocean freeze in winter?", "answer": "Because it gets so cold there.", "keywords": ["so cold", "freezes"], "explain": "The frozen surface layer is called sea ice.", "src": "L|During the winter in the Arctic Ocean, it is so cold that some of the sea water freezes."}, {"id": "y8c04-o078", "type": "short", "topic": "4.2", "source": "opus", "q": "Why do seals have to come to the surface of the Arctic Ocean?", "answer": "To breathe air.", "keywords": ["breathe air"], "explain": "Seals are mammals, so they have lungs and cannot get oxygen from water.", "src": "L|Seals hunt for fish in the water, but have to come to the surface to breathe air."}, {"id": "y8c04-o079", "type": "short", "topic": "4.2", "source": "opus", "q": "What do polar bears look for when they patrol the sea ice?", "answer": "Seals to kill and eat.", "keywords": ["seals"], "explain": "Seals coming up to breathe are easier to catch at holes in the ice.", "src": "L|Polar bears patrol the ice, looking for seals to kill and eat."}, {"id": "y8c04-o129", "type": "short", "topic": "4.3", "source": "opus", "q": "When a new species arrives in an ecosystem, what two things do ecologists need to work out?", "answer": "How the new species fits into the network of interactions, and how this affects the species already there.", "keywords": ["fits into", "network", "affects"], "explain": "A new species joins an already complete web of interactions.", "src": "L|How does the new species fit into the network of interactions?"}, {"id": "y8c04-o130", "type": "short", "topic": "4.3", "source": "opus", "q": "How long ago did New Zealand become separated from other areas of land?", "answer": "About 66 million years ago.", "keywords": ["66 million years"], "explain": "Long separation allowed very different species to develop there.", "src": "L|New Zealand became separated from all the other areas of land in the world about 66 million years ago."}, {"id": "y8c04-o160", "type": "short", "topic": "4.3", "source": "opus", "q": "Why are stoats a problem in New Zealand but not in Europe?", "answer": "In Europe there are predators, diseases and competitors that keep their numbers down, and the prey species have adaptations to escape them. In New Zealand these controls are missing.", "keywords": ["predators", "numbers", "adaptations"], "explain": "A species is usually harmless in the ecosystem it evolved in.", "src": "L|Stoats normally live in Europe."}, {"id": "y8c04-o165", "type": "short", "topic": "4.3", "source": "opus", "q": "What has happened to the beavers in Tierra del Fuego since 1946?", "answer": "No beavers are used for fur now, but they still live there, their numbers have increased, and their dams have caused a lot of damage to local ecosystems.", "keywords": ["numbers increased", "dams", "damage"], "explain": "Once released, an introduced species does not go away when people stop wanting it.", "src": "W|Their dams have caused a lot of damage to local ecosystems."}, {"id": "y8c04-o167", "type": "short", "topic": "4.3", "source": "opus", "q": "Suggest why introducing brown bears to Tierra del Fuego might be a bad idea.", "answer": "The bears would themselves be an introduced species, and they might eat native animals or cause other damage rather than only controlling the beavers.", "keywords": ["introduced species", "native animals", "damage"], "explain": "This is exactly the mistake that was made with stoats in New Zealand.", "src": "W|Some people have suggested introducing brown bears to Tierra del Fuego, to control the beavers."}, {"id": "y8c04-o179", "type": "short", "topic": "4.3", "source": "opus", "q": "How are scientists trying to save the northern quoll?", "answer": "They feed quolls little sausages of cane toad meat, which make the quolls vomit but do not kill them, so the quolls learn to avoid cane toads.", "keywords": ["sausages", "vomit", "learn to avoid"], "explain": "The quolls learn that cane toads make them ill before they eat a lethal dose.", "src": "W|They are making little sausages of cane toad meat and feeding them to the quolls."}, {"id": "y8c04-o184", "type": "short", "topic": "4.4", "source": "opus", "q": "What is an insecticide?", "answer": "A chemical that kills insects.", "keywords": ["kills insects"], "explain": "DDT is an example of an insecticide.", "src": "L|This means that it kills insects."}, {"id": "y8c04-o185", "type": "short", "topic": "4.4", "source": "opus", "q": "When was DDT first produced?", "answer": "In the 1940s.", "keywords": ["1940s"], "explain": "It was widely used for about twenty years before the problems were understood.", "src": "L|DDT was first produced in the 1940s."}, {"id": "y8c04-o186", "type": "short", "topic": "4.4", "source": "opus", "q": "What was DDT originally used for?", "answer": "To kill insects that transmit diseases, and insects that eat crops.", "keywords": ["transmit diseases", "eat crops"], "explain": "It saved many lives by killing disease-carrying insects.", "src": "L|It was used to kill insects that transmit diseases."}, {"id": "y8c04-o187", "type": "short", "topic": "4.4", "source": "opus", "q": "Which two diseases were controlled by killing insects with DDT?", "answer": "Malaria, transmitted by mosquitoes, and typhus, transmitted by fleas.", "keywords": ["malaria", "mosquitoes", "typhus", "fleas"], "explain": "Controlling the insect controls the disease it carries.", "src": "L|It was especially useful for killing mosquitoes that transmit malaria, and fleas that transmit a disease called typhus."}, {"id": "y8c04-o209", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain the difference between bioaccumulation and biomagnification.", "answer": "Bioaccumulation is the build-up of a substance inside one organism during its lifetime. Biomagnification is the increase in concentration from one level of a food chain to the next.", "keywords": ["one organism", "food chain", "concentration"], "explain": "Bioaccumulation happens within an organism; biomagnification happens along a chain.", "src": "L|People often get confused between bioaccumulation and biomagnification."}, {"id": "y8c04-o222", "type": "short", "topic": "4.4", "source": "opus", "q": "Where do microplastics come from?", "answer": "From big pieces of thrown-away plastic that slowly break apart, and from healthcare and beauty products such as toothpastes and face creams.", "keywords": ["break apart", "toothpastes", "face creams"], "explain": "They enter the sea from litter and from drains.", "src": "W|Some microplastics come from big pieces of plastic that people have thrown away, and that slowly break apart."}, {"id": "y8c04-o227", "type": "short", "topic": "4.4", "source": "opus", "q": "Explain why the concentration of microplastics in a seal may be greater than in a fish.", "answer": "The seal eats many fish over its lifetime and keeps all the microplastics from all of them, so the concentration increases up the food chain.", "keywords": ["eats many fish", "increases", "food chain"], "explain": "This is biomagnification.", "src": "W|Explain why the concentration of microplastics in a seal's body may be greater than the concentration in a fish's body."}, {"id": "y8c04-w038", "type": "fill", "topic": "4.4", "source": "opus", "q": "Microplastics cannot be broken down by living things, so they build up inside one animal's body over its lifetime. This build-up is called ____.", "answer": ["bioaccumulation"], "explain": "Bioaccumulation is the build-up of a substance inside a single organism during its life. The rise in concentration from one level of a food chain to the next is biomagnification.", "src": "W|They show bioaccumulation."}, {"id": "qwen-01-01", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "What is the main reason organisms in a desert need special adaptations?", "explain": "Deserts do not get much rainfall, so organisms must have adaptations to survive with little water.", "src": "L|Deserts do not get much rainfall, so the organisms that live there must have adaptations", "options": ["To find enough food", "Because there is little water", "To avoid all predators", "The soil is too rocky"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "4.1", "source": "qwen", "q": "Saguaro cacti grow very slowly and their roots spread out widely just underneath the soil to absorb ____.", "explain": "Saguaro cacti roots are ready to absorb any rain that falls.", "src": "L|ready to absorb any rain that falls", "answer": ["rain"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "Which bird makes holes in cacti to create its nest?", "explain": "Gila woodpeckers make holes in the cacti to make their nests.", "src": "L|Gila woodpeckers make holes in the cacti, to make their nests", "options": ["Cactus wren", "Gila woodpecker", "Red-tailed hawk", "Barn owl"], "answer": 1}, {"id": "qwen-02-04", "type": "fill", "topic": "4.2", "source": "qwen", "q": "Mangroves are trees that can grow with their roots in ____.", "explain": "Mangroves as trees that grow with roots in sea water.", "src": "L|Mangroves are trees that can grow with their roots in sea water.", "answer": ["sea water"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "What do young fish use mangrove roots for?", "explain": "Young fish live among mangrove roots to stay safe from larger fish.", "src": "L|Young fi sh live among the mangrove roots, safe from larger fi sh", "options": ["To hide from larger fish", "To find food", "To build nests", "To breathe air"], "answer": 0}, {"id": "qwen-02-07", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "Why does the water in rice paddies heat up quickly during the day?", "explain": "Because the water is shallow, it heats up quickly.", "src": "L|Because the water is shallow, it heats up quickly during the day", "options": ["Because it is shallow", "Because it is deep", "Because of the fertiliser", "Because of the birds"], "answer": 0}, {"id": "qwen-05-01", "type": "mcq", "topic": "4.3", "source": "qwen", "q": "Why were many native birds in New Zealand unable to protect their eggs before humans arrived?", "explain": "Before humans arrived, there were no predatory mammals in New Zealand, so the eggs and young birds were safe.", "src": "L|There were no predators to eat their eggs, so the eggs and young birds were safe.", "options": ["They did not have feathers", "There were no predatory mammals to eat the eggs", "The birds lived in trees only", "The eggs were too small for predators"], "answer": 1}, {"id": "qwen-05-02", "type": "fill", "topic": "4.3", "source": "qwen", "q": "Rats stowed away on boats and now eat birds' eggs and ____ young birds.", "explain": "Rats eat birds' eggs and defenceless young birds.", "src": "L|The rats eat birds’ eggs and defenceless young birds.", "answer": ["defenceless"]}, {"id": "qwen-05-05", "type": "mcq", "topic": "4.3", "source": "qwen", "q": "What is the main reason scientists think 53 native bird species in New Zealand became extinct?", "explain": "While hunting played a part, the extinctions were mostly because of introduced invasive species.", "src": "L|but mostly because of introduced invasive species.", "options": ["People hunted them for sport", "Introduced invasive species caused the extinctions", "The climate changed too quickly", "They ran out of food sources"], "answer": 1}, {"id": "qwen-05-06", "type": "fill", "topic": "4.4", "source": "qwen", "q": "DDT is a ____ chemical, which means it does not break down and stays in the environment for many years.", "explain": "DDT as a persistent chemical that does not break down.", "src": "L|It is a persistent chemical. It stays in the environment for many years.", "answer": ["persistent"]}, {"id": "qwen-05-07", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "How does DDT affect the eggs of birds like the ibis?", "explain": "DDT is toxic and makes the shells of birds' eggs very thin.", "src": "L|it makes the shells of birds’ eggs very thin and easy to break.", "options": ["It makes them change colour", "It makes the shells very thin and easy to break", "It prevents the eggs from being laid", "It makes the eggs taste bad"], "answer": 1}, {"id": "qwen-06-01", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "What is the name of the process where DDT builds up in an organism's body over its lifetime?", "explain": "The DDT in all algae a shrimp eats accumulates in its body, and this process is called bioaccumulation.", "src": "L|This process is called bioaccumulation.", "options": ["Biomagnification", "Bioaccumulation", "Photosynthesis", "Decomposition"], "answer": 1}, {"id": "qwenw-01-01", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "Why do saguaro cacti not have leaves?", "explain": "Saguaro cacti do not have leaves because water would evaporate from them, causing the plant to dry out.", "src": "W|They do not have leaves, because water would evaporate from them.", "options": ["To reduce water loss through evaporation", "Because they do not need to make food", "To protect them from freezing temperatures", "So that birds can build nests in the stems"], "answer": 0}, {"id": "qwenw-01-02", "type": "fill", "topic": "4.1", "source": "qwen", "q": "Saguaro cacti use their green stems to make food by the process of ____.", "explain": "Instead of leaves, the cactus uses its green stems to make food by photosynthesis.", "src": "W|Instead, the cactus uses its green stems to make food by photosynthesis.", "answer": ["photosynthesis"]}, {"id": "qwenw-01-04", "type": "fill", "topic": "4.2", "source": "qwen", "q": "In the tropical rainforest, fungi on the forest floor are known as ____.", "explain": "Fungi that break down dead leaves and waste as decomposers.", "src": "W|On the forest floor, fungi break down dead leaves and waste from the animals. These fungi are .", "answer": ["decomposers"]}, {"id": "qwenw-01-07", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "Where do bacteria at hydrothermal vents get their energy from?", "explain": "Bacteria use energy in the chemicals dissolved in the hot water to make food, instead of using light.", "src": "W|Instead of using energy from light to make food, they use energy in the chemicals dissolved in the hot water.", "options": ["Chemicals dissolved in the hot water", "Sunlight shining through the ocean", "Eating giant tube worms", "Decomposing dead fish"], "answer": 0}, {"id": "qwenw-01-10", "type": "fill", "topic": "4.3", "source": "qwen", "q": "Beavers use their sharp teeth to cut down trees to build ____.", "explain": "Beavers use their sharp teeth to cut down trees to build their dams.", "src": "W|Beavers use their sharp teeth to cut down trees to build their dams.", "answer": ["dams"]}, {"id": "qwenw-01-11", "type": "mcq", "topic": "4.3", "source": "qwen", "q": "Why are water hyacinths not an invasive species in South America?", "explain": "In South America, several herbivores feed on water hyacinth, helping to stop the number of plants increasing too much.", "src": "W|The herbivores help to stop the number of water hyacinth plants increasing too much.", "options": ["Herbivores feed on them and control their numbers", "They do not grow in fresh water there", "The temperature is too cold for them to survive", "They are eaten by all the local fish"], "answer": 0}, {"id": "qwenw-02-04", "type": "fill", "topic": "4.4", "source": "qwen", "q": "Farmers need to check if the advice they receive is ____.", "explain": "If farmers can be sure the advice is unbiased, implying they need to check for this.", "src": "W|Can the farmers be sure that the advice is unbiased", "answer": ["unbiased"]}, {"id": "qwenw-02-06", "type": "fill", "topic": "4.4", "source": "qwen", "q": "The university is developing a new strain of ____ that resists insect pests.", "explain": "The development of a new strain of maize.", "src": "W|developing a new strain of maize", "answer": ["maize"]}], "figures": {"img/L_p05_foo
