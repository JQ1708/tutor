.7, "w": 10.8, "h": 4.5}, {"n": 5, "text": "urethra", "alt": [], "x": 65.2, "y": 75.4, "w": 10.2, "h": 4.5}], "src": "L|artery bringing blood to the kidneys"}, {"id": "ch04-f04h1", "type": "hotspot", "topic": "4.3", "source": "opus", "image": "img/L_p16_excretory.png", "figure": "L_p16_excretory", "q": "Click on the label of the tube that carries urine from a kidney down to the bladder.", "caption": "The human excretory system.", "target": {"x": 69.4, "y": 60.4, "r": 7.0}, "explain": "There are two of these, one from each kidney. Do not confuse the ureter with the urethra, which is the single tube leading out of the body.", "src": "L|ureter"}, {"id": "ch04-f04h2", "type": "hotspot", "topic": "4.3", "source": "opus", "image": "img/L_p16_excretory.png", "figure": "L_p16_excretory", "q": "Click on the label of the organ that stores urine until it is released.", "caption": "The human excretory system.", "target": {"x": 70.6, "y": 69.0, "r": 7.0}, "explain": "Urine trickles in from the ureters all the time. The bladder stretches to store it, so it does not have to leave the body continuously.", "src": "L|bladder"}, {"id": "ch04-f04h3", "type": "hotspot", "topic": "4.3", "source": "opus", "image": "img/L_p16_excretory.png", "figure": "L_p16_excretory", "q": "Click on the label of the single tube that carries urine out of the body.", "caption": "The human excretory system.", "target": {"x": 70.3, "y": 77.7, "r": 7.0}, "explain": "The urethra runs from the bladder to the outside. The ureters run from the kidneys to the bladder, so read the two words carefully.", "src": "L|urethra"}, {"id": "ch04-f04h4", "type": "hotspot", "topic": "4.3", "source": "opus", "image": "img/L_p16_excretory.png", "figure": "L_p16_excretory", "q": "Click on the blood vessel that brings blood to the kidneys.", "caption": "The human excretory system.", "target": {"x": 79.5, "y": 27.2, "r": 7.0}, "explain": "Blood arrives through this artery still carrying urea and excess water; the kidney filters them out before the blood leaves.", "src": "L|artery bringing blood to the kidneys"}, {"id": "ch04-f04h5", "type": "hotspot", "topic": "4.3", "source": "opus", "image": "img/L_p16_excretory.png", "figure": "L_p16_excretory", "q": "Click on the blood vessel that carries blood away from the kidneys.", "caption": "The human excretory system.", "target": {"x": 80.8, "y": 40.6, "r": 7.0}, "explain": "Blood leaving through this vein has had its urea and excess water removed, so it is now clean of those wastes.", "src": "L|vein taking blood away from the kidneys"}, {"id": "ch04-f05h1", "type": "hotspot", "topic": "4.2", "source": "opus", "image": "img/W_p08_bagged.png", "figure": "W_p08_bagged", "q": "Sofia kept plant A at 4 degrees Celsius, plant B at 20 degrees Celsius and plant C at 30 degrees Celsius. Click on the label of the plant that lost the least mass over the eight days.", "caption": "Three identical plants, each sealed inside a plastic bag and kept at a different temperature.", "target": {"x": 15.4, "y": 17.9, "r": 7.0}, "explain": "The coldest plant transpires most slowly, so plant A at 4 degrees Celsius loses the least water and the least mass.", "src": "W|Plant A kept at 4 °C"}, {"id": "ch04-f05h2", "type": "hotspot", "topic": "4.2", "source": "opus", "image": "img/W_p08_bagged.png", "figure": "W_p08_bagged", "q": "Sofia kept plant A at 4 degrees Celsius, plant B at 20 degrees Celsius and plant C at 30 degrees Celsius. Click on the label of the plant whose leaves transpired fastest.", "caption": "Three identical plants, each sealed inside a plastic bag and kept at a different temperature.", "target": {"x": 84.1, "y": 17.9, "r": 7.0}, "explain": "Higher temperature gives the water particles more energy, so plant C at 30 degrees Celsius evaporates and loses water fastest.", "src": "W|Plant C kept at 30 °C"}, {"type": "fill", "topic": "4.1", "q": "The spaces between the soil particles are filled with ____ and ____.", "answer": ["air", "water"], "explain": "The water in those spaces is what the root takes up, and mineral ions are already dissolved in it.", "src": "L|There are spaces between them, which are filled with air and water.", "id": "ch04-o003", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Explain how the shape of a root hair cell helps it to do its job.", "answer": "The cell has a long extension growing out into the soil. This gives it a really big surface area, so water and mineral ions can be absorbed into the plant faster.", "keywords": ["long extension", "surface area", "absorb", "faster"], "explain": "A bigger surface means more room for absorption, so uptake is faster.", "src": "L|Root hair cells provide a really big surface through which water and mineral ions can be absorbed into the plant.", "id": "ch04-o004", "source": "opus"}, {"type": "mcq", "topic": "4.1", "q": "How much of a plant cell does one root hair make up?", "options": ["It is a whole cell on its own.", "It is part of a single cell.", "It is made of many cells joined together.", "It is a group of dead cells."], "answer": 1, "explain": "A root hair is an outgrowth of one cell, not a separate cell and not a tissue.", "src": "L|Each root hair is part of a single cell.", "id": "ch04-o005", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Water moves from the soil into the cytoplasm of a root hair cell. Name, in order, the two structures it passes through on the way.", "answer": "It passes through the cell wall first, then the cell membrane, and then it is in the cytoplasm.", "keywords": ["cell wall", "cell membrane", "cytoplasm"], "explain": "The wall is on the outside, the membrane lies just inside it, and the cytoplasm is inside that.", "src": "L|It passes through the cell wall and the cell membrane of the cell, and into the cytoplasm.", "id": "ch04-o006", "source": "opus"}, {"type": "fill", "topic": "4.1", "q": "Nitrate ions are needed to make ____, and magnesium ions are needed to make ____.", "answer": ["proteins", "chlorophyll"], "explain": "Both are mineral ions taken from the soil, but the plant builds a different substance with each.", "src": "L|Mineral ions including nitrate ions and magnesium ionsare dissolved in the water between the soil particles", "id": "ch04-o007", "source": "opus"}, {"type": "mcq", "topic": "4.1", "q": "Which two things fill the spaces between the particles of soil?", "options": ["air and water", "oil and water", "air and salt", "water only"], "answer": 0, "explain": "The water held in those spaces is what the root hairs absorb, and mineral ions are already dissolved in it.", "src": "L|There are spaces between them, which are filled with air and water.", "id": "ch04-o008", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Explain how mineral ions get from the soil into a root hair cell.", "answer": "The mineral ions are dissolved in the water in the spaces between the soil particles, and they move into the root hair cell along with that water.", "keywords": ["dissolved", "along with the water", "move in"], "explain": "The plant does not have to collect the ions separately; they travel in the water it is already absorbing.", "src": "L|are dissolved in the water between the soil particles, and they move into the root hair cell along with the water", "id": "ch04-o009", "source": "opus"}, {"type": "mcq", "topic": "4.1", "q": "Which statement about xylem vessels is correct?", "options": ["They are living cells full of cytoplasm.", "They are dead cells with an empty space inside.", "They each have a large nucleus.", "They are single cells that never join up."], "answer": 1, "explain": "Everything inside a xylem vessel disappears as it forms, leaving a hollow tube.", "src": "L|All that is left is their cell walls, with an empty space inside.", "id": "ch04-o011", "source": "opus"}, {"type": "fill", "topic": "4.1", "q": "In a xylem vessel the end walls have completely ____, so many vessels stack on top of one another to make long, empty ____.", "answer": ["disappeared", "tubes"], "explain": "Without end walls there is nothing to stop the water flowing from one vessel into the next.", "src": "L|Their end walls have completely disappeared, too.", "id": "ch04-o012", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Explain why the structure of xylem vessels makes them good at carrying water.", "answer": "They are empty tubes, so there is nothing inside to get in the way of the water, and because their end walls have disappeared the stacked vessels form one continuous tube that runs all the way from the roots to the highest parts of the plant.", "keywords": ["empty", "no end walls", "continuous", "roots to the top"], "explain": "A continuous hollow pipe offers the least resistance to flow.", "src": "L|Many xylem vessels stack on top of one another, making long, empty tubes that reach all the way from the roots, up to the highest parts of the plant.", "id": "ch04-o013", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "What is the wood in a tree trunk made of, and what does it do?", "answer": "The wood is made up of xylem vessels. They carry water from the roots all the way to the top of the tree.", "keywords": ["xylem vessels", "carry water", "top of the tree"], "explain": "Wood is not just support tissue; it is the tree's plumbing.", "src": "L|The wood in a tree trunk is made up of xylem vessels. They carry water from the roots all the way to the top of the tree.", "id": "ch04-o014", "source": "opus"}, {"type": "fill", "topic": "4.1", "q": "The actual diameter of a xylem vessel is only about ____ mm.", "answer": ["0.05"], "explain": "That is far too small to see without a microscope, although the sizes do vary.", "src": "L|The actual diameter of a xylem vessel is only about 0.05 mm", "id": "ch04-o015", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Describe where the xylem is found when you look at a root that has been cut across.", "answer": "The xylem tissue is in the centre of the root, in a cross-shaped area. The root hairs are on the outside of the root.", "keywords": ["centre", "cross-shaped", "root hairs outside"], "explain": "Water is absorbed at the outside and travels inwards to reach the transport tissue at the middle.", "src": "L|cross-shaped area where xylem tissue is found", "id": "ch04-o016", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Describe the whole path taken by a water molecule from the soil to a leaf at the top of a tree.", "answer": "The water moves from the soil into a root hair cell, then from the outside of the root towards the inside, into the xylem vessels in the centre of the root. The xylem vessels then carry it up through the root and stem to the leaves.", "keywords": ["root hair", "across the root", "xylem vessels", "up"], "explain": "Absorbed at the surface, handed to the transport tissue at the centre, then lifted.", "src": "L|it moves from the outside of the root towards the inside. It goes into the xylem vessels in the centre of the root", "id": "ch04-o017", "source": "opus"}, {"type": "mcq", "topic": "4.1", "q": "A celery stalk is stood in blue dye. When the stalk is cut across, blue spots appear. Which kind of cell is found where the blue spots are?", "options": ["palisade cells", "root hair cells", "xylem cells", "red blood cells"], "answer": 2, "explain": "The dye travelled up inside the water transport tissue, so the spots mark the xylem.", "src": "L|Which kind of cells do you think are found in the places where you can see blue spots?", "id": "ch04-o018", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "In the celery experiment, explain why it is important that the cut end of the stalk is clean and not blocked or damaged.", "answer": "The dye can only travel up the stalk if the open ends of the xylem vessels are clear. If the cut end is blocked or crushed, the vessels are closed off and little or no dye will move up.", "keywords": ["xylem", "blocked", "dye cannot travel"], "explain": "The experiment depends on an unobstructed path into the xylem tubes.", "src": "L|making sure that the cut end is clean and is not blocked or damaged", "id": "ch04-o019", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "Predict what happens to the speed at which water moves up a stalk when the temperature increases, and explain why.", "answer": "The water moves up faster, because higher temperatures give more kinetic energy to the particles.", "keywords": ["faster", "kinetic energy", "particles"], "explain": "Warmer particles move more quickly, and evaporation from the leaves is faster too.", "src": "W|Plants lose more water from their leaves when the temperature increases.", "id": "ch04-o022", "source": "opus"}, {"type": "short", "topic": "4.1", "q": "A student plans to test how temperature affects the speed at which dye moves up a celery stalk. State the independent variable, the dependent variable, and two variables that must be kept the same.", "answer": "The independent variable is the temperature. The dependent variable is the rate at which the coloured water moves up the stalk, found by measuring a distance and a time. Variables to keep the same include the depth of coloured water, the size of the stalk and the light intensity.", "keywords": ["temperature", "rate", "distance and time", "same"], "explain": "Only one variable may change if the comparison is going to mean anything.", "src": "L|which variable you will change (your independent variable)", "id": "ch04-o023", "source": "opus"}, {"type": "mcq", "topic": "4.1", "q": "What is the job of the root cap?", "options": ["It absorbs most of the water.", "It protects the tip of the root as it grows through the soil.", "It stores starch for the winter.", "It carries water up to the leaves."], "answer": 1, "explain": "The tip is the growing point, and soil is abrasive, so it needs a shield.", "src": "L|root cap that protects the tip of the root as it grows through the soil", "id": "ch04-o025", "source": "opus"}, {"type": "fill", "topic": "4.1", "q": "Root hairs grow out of the ____ of roots, and they absorb water from the ____.", "answer": ["surface", "soil"], "explain": "Growing outwards puts them in direct contact with the water held between the soil particles.", "src": "L|special cells called root hairs grow out of the surface of roots", "id": "ch04-o026", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Describe what happens to water after it arrives at a leaf in the xylem vessels.", "answer": "It moves out of the xylem vessels into the leaf cells. Cells with chloroplasts use a little of it for photosynthesis, but most of it soaks into the cellulose cell wall, evaporates to water vapour, diffuses into the air spaces between the cells and then diffuses out through the stomata.", "keywords": ["leaf cells", "cell wall", "evaporates", "air spaces", "stomata"], "explain": "Follow the water in order: out of the vessel, into the wall, into the air, out of the hole.", "src": "L|The liquid water in the cell soaks into the cellulose cell wall, and then changes to water vapour - it evaporates.", "id": "ch04-o028", "source": "opus"}, {"type": "fill", "topic": "4.2", "q": "Inside a leaf, liquid water soaks into the cellulose ____ ____ and then ____ to become water vapour.", "answer": ["cell", "wall", "evaporates"], "explain": "The change of state happens in the wall, not in the air space.", "src": "L|The liquid water in the cell soaks into the cellulose cell wall, and then changes to water vapour", "id": "ch04-o029", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Name the exact place inside a leaf where liquid water changes into water vapour.", "answer": "In the cellulose cell wall of a leaf cell.", "keywords": ["cellulose cell wall", "leaf cell"], "explain": "The vapour only reaches the air space after it has evaporated in the wall.", "src": "L|The liquid water in the cell soaks into the cellulose cell wall, and then changes to water vapour - it evaporates.", "id": "ch04-o030", "source": "opus"}, {"type": "mcq", "topic": "4.2", "q": "What are the stomata?", "options": ["Tiny holes in the underside of the leaf.", "The tubes that carry water up the stem.", "The cells that hold the chloroplasts.", "The waxy layer on top of the leaf."], "answer": 0, "explain": "They are the openings that connect the air spaces inside the leaf to the air outside.", "src": "L|These air spaces connect with the air outside the leaf through tiny holes in the underside of the leaf - the stomata.", "id": "ch04-o031", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Water vapour is in the air spaces inside a leaf. Explain how it gets out into the air outside.", "answer": "The air spaces connect with the air outside the leaf through the stomata, tiny holes in the underside, and the water vapour diffuses out through these holes.", "keywords": ["air spaces", "stomata", "diffuses out"], "explain": "Diffusion moves the vapour from where it is concentrated inside to where there is less of it outside.", "src": "L|The water vapour can diffuse through these holes and into the air.", "id": "ch04-o033", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Give the four reasons why a plant needs water.", "answer": "Support, because cells full of water are firm and hold the plant up; transport, because water carries dissolved mineral salts through the xylem; cooling, because evaporating water takes heat away; and photosynthesis, because water is one of the reactants.", "keywords": ["support", "transport", "cooling", "photosynthesis"], "explain": "Two of these are physical jobs and two are chemical ones.", "src": "L|Water for support", "id": "ch04-o034", "source": "opus"}, {"type": "fill", "topic": "4.2", "q": "A plant cell that has plenty of water is strong and ____. When all the cells in a plant are like this, they press on one another and make the whole plant firm and well ____.", "answer": ["firm", "supported"], "explain": "Plants have no skeleton, so this pressure is how a soft-stemmed plant stands up.", "src": "L|A plant cell that has plenty of water is strong and firm.", "id": "ch04-o036", "source": "opus"}, {"type": "mcq", "topic": "4.2", "q": "A plant has not been watered for several days and has collapsed. What word describes it?", "options": ["wilted", "excreted", "transpired", "irregular"], "answer": 0, "explain": "Wilting is the visible result of cells losing the water that keeps them firm.", "src": "L|We say that it has wilted.", "id": "ch04-o037", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Explain how water is used for transport inside a plant.", "answer": "As water moves through the xylem vessels it carries dissolved mineral salts with it, and this is how the mineral salts are transported from the roots to all the other parts of the plant.", "keywords": ["xylem", "dissolved mineral salts", "roots to all parts"], "explain": "The mineral ions never move on their own; they ride in the water stream.", "src": "L|As water moves through the xylem vessels, it carries dissolved mineral salts .", "id": "ch04-o038", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Explain why a plant that cannot get water also cannot photosynthesise.", "answer": "Water is one of the reactants in photosynthesis. In photosynthesis plants change water and carbon dioxide to glucose and oxygen, so without water there is nothing for the carbon dioxide to react with.", "keywords": ["reactant", "carbon dioxide", "glucose", "oxygen"], "explain": "A reaction stops if one of its raw materials runs out.", "src": "L|Water is one of the reactants in photosynthesis. In photosynthesis, plants change water and carbon dioxide to glucose and oxygen.", "id": "ch04-o040", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Suggest two ways a desert plant may be adapted to get as much water as possible from the soil, and two ways it may reduce the water it loses.", "answer": "To get water it may have very deep roots to reach water far below the surface, or very wide-spreading roots to catch rain over a large area. To lose less it may have small leaves, which have a smaller surface area, and a thick layer of wax on the leaves to reduce transpiration.", "keywords": ["deep roots", "wide-spreading", "small leaves", "thick wax"], "explain": "Deserts force the plant to attack the problem from both ends: take more in, let less out.", "src": "L|reduce the amount of water that they lose through transpiration?", "id": "ch04-o041", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "In the experiment with two potted plants, one is completely covered by a bag and the other has only its pot and soil covered. State the independent variable.", "answer": "Whether the leaves of the plant were exposed to the air or not.", "keywords": ["leaves", "exposed to the air"], "explain": "Everything else was matched, so this is the one thing being tested.", "src": "L|Take the second plant, and cover the pot and soil, but not the leaves of the plant, with a plastic bag.", "id": "ch04-o042", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "In the two potted plants experiment, explain why the plant with uncovered leaves lost mass much faster. Use the word transpiration in your answer.", "answer": "Water vapour was lost from the leaves of the uncovered plant by transpiration and escaped into the air, so the pot and plant became lighter. The water vapour lost from the other plant was trapped inside the bag and could not escape, so the mass of that whole pot and bag barely changed.", "keywords": ["transpiration", "water vapour", "trapped", "could not escape"], "explain": "The bagged plant still transpires; the water simply has nowhere to go.", "src": "L|two big, transparent polythene bags", "id": "ch04-o044", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Drops of water appear on the inside of the bag that covers a plant. Explain how they got there.", "answer": "Water travelled up the plant in the xylem, evaporated from the cell walls inside the leaves and diffused out through the stomata as water vapour. Trapped inside the bag, the vapour condensed back to liquid water on the cool inside surface of the bag.", "keywords": ["evaporated", "stomata", "water vapour", "condensed"], "explain": "Transpiration puts the vapour in the bag; condensation turns it back into drops.", "src": "W|Explain why she covered the pot and soil of each plant with a plastic bag.", "id": "ch04-o045", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Eight leaves are hung up to dry. Some have petroleum jelly on the top surface, some on the bottom, some on both and some have none. Put the treatments in order, starting with the one that loses the most water.", "answer": "Most water is lost by the leaf with no petroleum jelly, then the leaf with jelly on the upper surface only, then the leaf with jelly on the lower surface only, and least of all by the leaf with jelly on both surfaces.", "keywords": ["no jelly", "upper surface", "lower surface", "both"], "explain": "Blocking the surface that carries the stomata makes far more difference than blocking the waxy top.", "src": "L|Leaves A and B : no petroleum jelly", "id": "ch04-o046", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Explain why putting petroleum jelly on the lower surface of a leaf conserves far more water than putting it on the upper surface.", "answer": "The upper surface has few or no stomata, so blocking it changes little. The underside has the stomata, through which water vapour diffuses out from the air spaces, so blocking the underside closes the main escape route.", "keywords": ["few or no stomata", "underside", "stomata", "diffuse out"], "explain": "You only slow a leak by blocking the hole the water actually leaves through.", "src": "L|These air spaces connect with the air outside the leaf through tiny holes in the underside of the leaf", "id": "ch04-o047", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Two leaves were given exactly the same treatment but did not lose exactly the same mass. Suggest why.", "answer": "The two leaves probably had different masses to start with and contained different quantities of water, and one may have been hanging in a slightly draughtier place than the other.", "keywords": ["different starting mass", "different water", "draughtier"], "explain": "No two leaves are identical, and the conditions along a washing line are not identical either.", "src": "L|9 Did the two leaves that had the same treatment both lose exactly the same mass? If not, suggest why.", "id": "ch04-o049", "source": "opus"}, {"type": "fill", "topic": "4.2", "q": "In liquid water the particles are randomly arranged but touching. In water as a gas the particles are ____ apart and are ____ touching at all.", "answer": ["far", "not"], "explain": "Evaporation is exactly this change: the particles move faster and spread out.", "src": "L|But water can also be a solid and a gas.", "id": "ch04-o050", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Sofia investigated how temperature affects water loss from plants. Explain why she covered the pot and soil of each plant with a plastic bag.", "answer": "So that any water lost could only have come from the plants themselves, and not by evaporation from the soil. Without the bag she could not tell which of the two had caused the mass to fall.", "keywords": ["only from the plants", "not from the soil", "evaporation"], "explain": "Sealing the soil removes the second possible source of water loss.", "src": "W|Explain why she covered the pot and soil of each plant with a plastic bag.", "id": "ch04-o051", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Sofia recorded the mass of one plant and its pot as 893, 873, 856, 837, 861, 792, 779 and 761 grams over eight days. Identify the anomalous result and explain how you know.", "answer": "The value of 861 g on day 5 is anomalous. The mass had been falling steadily as water was lost, and it cannot rise again, because the plant only loses water during the experiment.", "keywords": ["861", "anomalous", "mass only falls"], "explain": "An anomaly is a reading that breaks a pattern the rest of the data has established.", "src": "W|Sofia decided that one of her results was anomalous.", "id": "ch04-o052", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "A plant and pot had a mass of 893 g on day 1 and 761 g on day 8. Calculate the mean loss of mass per day, showing your working.", "answer": "Loss of mass = 893 minus 761 = 132 g. There are seven days between day 1 and day 8, so the mean loss per day = 132 divided by 7 = 19 g per day.", "keywords": ["132", "divided by 7", "19"], "explain": "Count the intervals, not the readings: eight readings give seven days of change.", "src": "W|Plant B: 893, 873, 856, 837, 861, 792, 779, 761", "id": "ch04-o053", "source": "opus"}, {"type": "short", "topic": "4.2", "q": "Three identical plants were kept at 4, 20 and 30 degrees Celsius. The one at 30 degrees lost the most mass and the one at 4 degrees the least. Explain this result.", "answer": "The higher the temperature, the more energy the water particles have, so water evaporates faster from the cell walls inside the leaves and transpiration is faster. Faster transpiration means more water vapour lost and a greater fall in mass.", "keywords": ["more energy", "evaporates faster", "transpiration", "more mass lost"], "explain": "The result supports the hypothesis that plants lose more water when the temperature increases.", "src": "W|Plants lose more water from their leaves when the temperature increases.", "id": "ch04-o054", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "What does excretion mean?", "answer": "Excretion means getting rid of waste materials. It only applies to waste substances that organisms make in their cells, plus any substances they have too much of that have been part of their body.", "keywords": ["getting rid", "waste", "made in cells", "too much"], "explain": "The key restriction is that the substance must have been part of the body.", "src": "L|Excretion means getting rid of waste materials.", "id": "ch04-o055", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Name the three things that humans excrete, and say where each comes from.", "answer": "Carbon dioxide, which body cells make in respiration; urea, a waste substance made in liver cells; and excess water that is not needed by the body.", "keywords": ["carbon dioxide", "respiration", "urea", "liver", "excess water"], "explain": "Two are waste products of reactions and one is simply a surplus.", "src": "L|carbon dioxide, which body cells make in respiration", "id": "ch04-o057", "source": "opus"}, {"type": "mcq", "topic": "4.3", "q": "In which organ is urea made?", "options": ["the kidney", "the liver", "the bladder", "the lung"], "answer": 1, "explain": "The kidney removes urea from the blood, but the liver is where it is made.", "src": "L|urea, a waste substance that is made in liver cells", "id": "ch04-o058", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Explain how excess protein in the diet leads to urea being made.", "answer": "Proteins in food are broken down to smaller molecules in the digestive system, and these go into the blood, which transports them to the liver. If there is more protein than the body needs, the liver changes the smaller molecules into urea.", "keywords": ["broken down", "blood", "liver", "more than we need", "urea"], "explain": "Protein cannot be stored, so the surplus is converted to something that can be got rid of.", "src": "L|If we have more protein than we need, the liver changes the smaller molecules into urea.", "id": "ch04-o059", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Explain why urea must be removed from the body quickly.", "answer": "Urea is a poisonous substance. If it builds up in the body it makes a person ill, so as soon as it is made in a liver cell it is taken away from the liver in the blood and removed by the kidneys.", "keywords": ["poisonous", "builds up", "ill", "kidneys"], "explain": "It is not just useless waste; it actively harms the body.", "src": "L|Urea is a poisonous substance. If it builds up in the body, it makes a person ill.", "id": "ch04-o060", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Describe what the kidneys do to the blood that flows through them.", "answer": "The kidneys filter the blood. They remove all of the urea from it and they also remove excess water from it.", "keywords": ["filter", "all of the urea", "excess water"], "explain": "Note the difference: all the urea, but only the excess water.", "src": "L|the kidneys filter the blood. They remove all of the urea from it. The kidneys also remove excess water from the blood.", "id": "ch04-o061", "source": "opus"}, {"type": "fill", "topic": "4.3", "q": "The solution made of ____ dissolved in ____ is called urine.", "answer": ["urea", "water"], "explain": "Urea is the waste substance and urine is the liquid that carries it out.", "src": "L|The solution made of urea dissolved in water is called urine.", "id": "ch04-o062", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Describe the path taken by urine from the kidney to the outside of the body, naming each part.", "answer": "The urine made in each kidney flows down a tube called a ureter, which carries it to the bladder. The bladder stores it for a while. The urine then flows out of the bladder to the outside through another tube, the urethra.", "keywords": ["ureter", "bladder", "urethra"], "explain": "Two tubes with one storage bag between them: kidney, ureter, bladder, urethra.", "src": "L|The urine made in each kidney flows down a tube called a ureter. This carries it to the bladder, which can store it for a while.", "id": "ch04-o063", "source": "opus"}, {"type": "mcq", "topic": "4.3", "q": "Which organ filters the blood?", "options": ["the bladder", "the kidney", "the ureter", "the urethra"], "answer": 1, "explain": "The bladder only stores urine; the two tubes only carry it.", "src": "L|This organ filters the blood.", "id": "ch04-o064", "source": "opus"}, {"type": "fill", "topic": "4.3", "q": "The word renal means ____ ____ ____ ____.", "answer": ["to", "do", "with", "kidneys"], "explain": "That is why the excretory system is also called the renal system.", "src": "L|'Renal' means 'to do with kidneys'.", "id": "ch04-o065", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "What is another name for the excretory system, and why is it given that name?", "answer": "The renal system. It is named after the kidneys, because renal means to do with kidneys and the kidneys are the organs that do the filtering.", "keywords": ["renal system", "kidneys"], "explain": "Naming a system after its key organ is common in biology.", "src": "L|This system is also known as the renal system.", "id": "ch04-o066", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Describe how carbon dioxide is excreted from the body.", "answer": "Carbon dioxide made by body cells in respiration diffuses into the blood and is carried to the lungs. There it diffuses from the blood capillaries into the alveoli, and it is removed from the body in expired air.", "keywords": ["diffuses into the blood", "lungs", "alveoli", "expired air"], "explain": "Excretion is not only about the kidneys; the lungs excrete too.", "src": "L|Carbon dioxide is a waste substance that humans excrete. How is carbon dioxide excreted from the body?", "id": "ch04-o067", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Suggest why plants do not produce urea that they have to excrete.", "answer": "Plants make their own proteins, using carbohydrates that they have made in photosynthesis and nitrates that they absorb from the soil. They make only as much as they need, so they are unlikely to have excess protein to break down into urea.", "keywords": ["make their own proteins", "photosynthesis", "nitrates", "no excess"], "explain": "Urea comes from surplus protein, and a plant never eats more protein than it needs.", "src": "L|Humans excrete urea, which is made from excess proteins in the body. Suggest why plants do not produce urea that they have to excrete.", "id": "ch04-o068", "source": "opus"}, {"type": "mcq", "topic": "4.3", "q": "Which of these is NOT excretion?", "options": ["breathing out carbon dioxide", "passing urine containing urea", "losing excess water in urine", "getting rid of faeces"], "answer": 3, "explain": "The material in faeces has never been inside the body, only inside the gut.", "src": "L|does not count as excretion. It has never been part of the body.", "id": "ch04-o069", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Explain why food inside the digestive system is not really inside the body.", "answer": "The digestive system is a long tube from the mouth to the anus, and food travelling through it has never crossed into the body. Only things that move out of the digestive system into a person's blood or body cells are really part of their body.", "keywords": ["long tube", "never part of the body", "into the blood or cells"], "explain": "Crossing the gut wall is the boundary that counts.", "src": "L|Only things that move out of the digestive system, and into the person's blood or their body cells, are really part of their body.", "id": "ch04-o070", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "Give two reasons why humans need water that are also true for plants, and one reason that is true only for humans.", "answer": "Both humans and plants need water for transport and for cooling. Humans also need water for getting rid of waste materials in urine, which plants do not do.", "keywords": ["transport", "cooling", "urine", "waste"], "explain": "Plants have no urine, so excretion in water is a purely animal use.", "src": "L|Can you think of any reasons that humans need water, which are not the same as plants?", "id": "ch04-o071", "source": "opus"}, {"type": "fill", "topic": "4.3", "q": "Blood is brought to the kidneys in an ____ and taken away from the kidneys in a ____.", "answer": ["artery", "vein"], "explain": "All the blood in the body passes through the kidneys again and again to be cleaned.", "src": "L|artery bringing blood to the kidneys", "id": "ch04-o073", "source": "opus"}, {"type": "short", "topic": "4.3", "q": "A person eats far more protein than they need for several weeks. Explain what their body does with the excess.", "answer": "The proteins are broken down to smaller molecules in the digestive system and carried in the blood to the liver. Because there is more than the body needs, the liver changes them into urea, which the blood carries to the kidneys, where it is filtered out and leaves the body dissolved in urine.", "keywords": ["liver", "urea", "kidneys", "urine"], "explain": "Excess protein cannot be stored, so the body converts it and excretes it.", "src": "L|The urea is removed from the blood by the kidneys in the excretory system.", "id": "ch04-o074", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "What is a fetus?", "answer": "A fetus is a baby before it is born. For the first nine months of its life a new human being grows inside its mother, and during that time it is called a fetus.", "keywords": ["baby before it is born", "nine months", "inside its mother"], "explain": "The word fetal is the adjective that goes with it.", "src": "L|A fetus is a baby before it is born.", "id": "ch04-o075", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "List three substances that move from the mother's blood into her fetus's blood.", "answer": "Oxygen, and nutrients such as glucose, water, vitamins and minerals.", "keywords": ["oxygen", "glucose", "nutrients"], "explain": "The fetus cannot eat or breathe, so everything must arrive dissolved in blood.", "src": "L|List three substances that move from the mother's blood into her fetus's blood.", "id": "ch04-o077", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "List two substances that the fetus excretes, which are removed by the mother's blood.", "answer": "Carbon dioxide and urea.", "keywords": ["carbon dioxide", "urea"], "explain": "These are exactly the two waste substances an adult body excretes as well.", "src": "L|List two substances that the fetus excretes, which are removed by the mother's blood.", "id": "ch04-o078", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Explain why a pregnant woman needs to eat more protein than usual.", "answer": "Protein is needed to help the fetus produce new cells and grow. The mother also needs protein to keep her own muscles strong, and she needs extra protein to make extra haemoglobin, because her blood has to transport oxygen for the fetus as well as for herself.", "keywords": ["new cells", "grow", "extra haemoglobin", "oxygen"], "explain": "Two demands at once: the fetus's whole body, and the mother's larger blood supply.", "src": "L|Protein is needed to help the fetus to produce new cells and grow", "id": "ch04-o079", "source": "opus"}, {"type": "mcq", "topic": "4.4", "q": "Which mineral does a pregnant woman need more of in order to make extra haemoglobin?", "options": ["calcium", "iron", "magnesium", "nitrate"], "answer": 1, "explain": "Calcium is for bones and teeth; iron is the mineral built into haemoglobin.", "src": "L|Iron is needed to make haemoglobin, so the mother needs to eat plenty of foods containing iron.", "id": "ch04-o080", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Explain why a pregnant woman needs plenty of calcium.", "answer": "Calcium is essential for helping the baby to grow strong bones, and for keeping the mother's own bones and teeth in good health.", "keywords": ["strong bones", "mother's bones and teeth"], "explain": "Without enough in the diet the fetus takes what it needs and the mother's own bones suffer.", "src": "L|Calcium is essential for helping the baby to grow strong bones, and to keep the mother's bones and teeth in good health.", "id": "ch04-o081", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Explain why a pregnant woman needs carbohydrate, and why she should not eat too much of it.", "answer": "Carbohydrate supplies energy. Glucose is a carbohydrate, and cells get their energy by combining glucose with oxygen in respiration, which both the mother and the fetus need to do. But if she eats too much, the extra could be changed to fat and make her put on too much weight, which is not healthy.", "keywords": ["energy", "glucose", "respiration", "changed to fat", "weight"], "explain": "Enough energy for two, but a surplus is stored rather than used.", "src": "L|But she should not eat too much, or the extra could be changed to fat and make her put on too much weight, which is not healthy.", "id": "ch04-o082", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Explain why a pregnant woman needs plenty of vitamins A, C and D.", "answer": "Vitamin A gives good vision for the mother and the fetus, and lets their white blood cells fight pathogens. Vitamin C gives strong skin and blood vessels for both. Vitamin D gives strong bones and teeth for both.", "keywords": ["vision", "white blood cells", "skin and blood vessels", "bones and teeth"], "explain": "Each vitamin has to cover the mother and the fetus at the same time.", "src": "L|You learnt about vitamins A, C and D in Stage 8. Explain why a pregnant mother needs plenty of each of these vitamins in her diet.", "id": "ch04-o083", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Name one food that is a good source of each of protein, iron and calcium.", "answer": "Protein: meat, fish, pulses, milk or other dairy products. Iron: meat, dark green vegetables, fish and shellfish, nuts and seeds. Calcium: dairy products, nuts and seeds.", "keywords": ["fish", "dark green vegetables", "dairy"], "explain": "Some foods, such as fish, appear in more than one list.", "src": "L|Suggest some foods that a pregnant woman could eat, which would supply her with plenty of protein, carbohydrate, iron, calcium and vitamins A, C and D.", "id": "ch04-o084", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "What does it mean to say a pregnant woman should eat a balanced diet, and why does she need slightly more than usual?", "answer": "A balanced diet means eating some of all the different nutrients that are needed to stay healthy. She needs a little more than usual because some of the nutrients she eats are passed to the growing fetus.", "keywords": ["all the different nutrients", "a little more", "passed to the fetus"], "explain": "It is a small increase in quantity but no change in the range of foods.", "src": "L|She needs to eat a little bit more than usual, because some of the nutrients that she eats are passed to the growing fetus.", "id": "ch04-o085", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Name the three harmful substances in tobacco smoke mentioned in this topic.", "answer": "Carbon monoxide, nicotine and tar.", "keywords": ["carbon monoxide", "nicotine", "tar"], "explain": "Two of these cross into the fetus's blood when a pregnant woman smokes.", "src": "L|Tobacco smoke contains carbon monoxide, nicotine and tar.", "id": "ch04-o086", "source": "opus"}, {"type": "fill", "topic": "4.4", "q": "A ____ is something that is taken into the body, and that affects the way the ____ works.", "answer": ["drug", "body"], "explain": "This definition covers helpful medicines as well as harmful drugs.", "src": "L|A drug is something that is taken into the body, and that affects the way the body works.", "id": "ch04-o090", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Explain what a medicinal drug is and give two examples.", "answer": "A medicinal drug is a drug that is good for health. Antibiotics kill bacteria in the body and are used to cure the infections that bacteria cause. Some painkillers, such as aspirin, are also medicinal drugs.", "keywords": ["good for health", "antibiotics", "bacteria", "aspirin"], "explain": "Without them many more people would die or suffer pain from illnesses we can now cure.", "src": "L|Antibiotics are drugs that kill bacteria in the body. They are used to cure the infections caused by bacteria.", "id": "ch04-o091", "source": "opus"}, {"type": "mcq", "topic": "4.4", "q": "What do antibiotics do?", "options": ["They kill bacteria in the body.", "They reduce pain in the muscles.", "They increase the amount of oxygen in the blood.", "They break down excess protein into urea."], "answer": 0, "explain": "They cure infections that bacteria cause; painkillers such as aspirin do a different job.", "src": "L|Antibiotics are drugs that kill bacteria in the body.", "id": "ch04-o092", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "A pregnant woman regularly takes a drug prescribed for her own health. What should she do, and what should she not do?", "answer": "She should check with her doctor or a pharmacist to see whether it is safe for her to keep on taking it. She should not stop taking it without checking first.", "keywords": ["check with a doctor", "pharmacist", "not stop without checking"], "explain": "Stopping a needed medicine on her own could be as harmful as continuing an unsafe one.", "src": "L|she should check with her doctor or a pharmacist to see if it is safe for her to keep on taking it. She should not stop taking it without checking first.", "id": "ch04-o093", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "Explain why a drug taken by a pregnant woman is a problem for her fetus.", "answer": "Most drugs that a pregnant woman takes will go into her fetus's blood, so the fetus is taking the drug too. Any drug that is not needed can cause harm, and these drugs can be even more harmful to a fetus than to an adult person.", "keywords": ["go into the fetus's blood", "the fetus is taking the drug", "more harmful"], "explain": "The fetus is much smaller and is still developing, so the same drug does more damage.", "src": "L|Most drugs that a pregnant woman takes will go into her fetus's blood. So the fetus is taking the drug, too.", "id": "ch04-o094", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "State what the recommendations say about alcohol, illegal drugs and caffeine during pregnancy.", "answer": "She should avoid alcohol. She should never take illegal drugs at all, and it is especially important to avoid them during pregnancy. There is not much evidence that caffeine harms a developing fetus, but most doctors recommend that a pregnant woman should not drink a lot of coffee or cola.", "keywords": ["avoid alcohol", "never illegal drugs", "not much evidence", "not a lot of coffee"], "explain": "Notice that the advice about caffeine is more cautious in tone, because the evidence is weaker.", "src": "L|She should avoid alcohol.", "id": "ch04-o095", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "The advice about caffeine is worded differently from the advice about smoking. Explain what this tells you about the evidence behind each.", "answer": "The advice on smoking is definite because there is strong evidence that carbon monoxide and nicotine reach the fetus and harm it. There is not much evidence that caffeine harms a developing fetus, so doctors only recommend not drinking a lot of coffee or cola rather than banning it.", "keywords": ["strong evidence", "not much evidence", "recommend rather than ban"], "explain": "Scientific advice is as strong or as cautious as the evidence supporting it.", "src": "L|There is not much evidence that caffeine - a drug in coffee and cola drinks - harms a developing fetus.", "id": "ch04-o096", "source": "opus"}, {"type": "fill", "topic": "4.4", "q": "For the first ____ months of its life a new human being grows inside its mother, and during this time it is called a ____.", "answer": ["nine", "fetus"], "explain": "The adjective for anything to do with a fetus is fetal.", "src": "L|For the first nine months of its life, a new human being grows inside its mother.", "id": "ch04-o099", "source": "opus"}, {"type": "short", "topic": "4.4", "q": "A pregnant woman takes iron pills. Explain why a doctor might have suggested this.", "answer": "Iron is needed to make haemoglobin, and a pregnant woman needs more haemoglobin because her blood has to carry oxygen for her fetus as well as for herself. If she cannot get enough iron in her diet, iron pills can help make up the difference.", "keywords": ["haemoglobin", "oxygen for the fetus", "cannot get enough in her diet"], "explain": "The pills are a supplement to the diet, not a replacement for it.", "src": "L|Sometimes, it can help if the mother takes iron pills during pregnancy, if she cannot get enough in her diet.", "id": "ch04-o100", "source": "opus"}, {"source": "nblm", "topic": "4.2", "src": "L|When water evaporates, it takes heat away with it. So when water evaporates from the cell wall", "explain": "Cooling matters most where the plant is at greatest risk of overheating, and a plant cannot move into the shade. In a hot place transpiration is the main way it keeps its cells from getting too hot.", "type": "short", "q": "Suggest why the evaporation of water from a leaf cell is especially important for plants that live in very hot places.", "answer": "When water evaporates from the cell wall, it takes thermal energy away with it, which helps to cool the cell down.", "keywords": ["takes heat away", "cools the cell"], "id": "ch04-n041"}, {"source": "nblm", "topic": "4.4", "src": "L|They look for correlations between smoking and fetal health.", "explain": "A correlation means two things change together, across a large enough group that chance is unlikely to explain it. It is weaker evidence than an experiment, which is why the strength of the advice depends on how much data there is.", "type": "short", "q": "When evaluating data about the links between fetal health and the mother's habits, suggest how scientists establish a link when they cannot conduct direct experiments.", "answer": "Scientists collect information from as many people as possible and look for correlations between the habits of the mother and the health of the fetus.", "keywords": ["collect information", "look for correlations"], "id": "ch04-n055"}, {"source": "nblm", "topic": "4.1", "src": "L|There are spaces between them, which are filled with air and water.", "explain": "Soil particles are irregular in shape, so they cannot pack together perfectly. The gaps that leaves behind hold the air and water that roots depend on, which is why hard compacted soil is bad for plants.", "type": "short", "q": "A student says: 'Roots absorb water from solid rock or tightly packed soil with no gaps.' Explain what is wrong with this.", "answer": "Soil is made of irregularly shaped particles with gaps that contain the air and water roots need.", "keywords": ["water", "soil", "made", "irregularly"], "id": "ch04-n070"}, {"source": "nblm", "topic": "4.1", "src": "L|Each root hair is part of a single cell.", "explain": "Each root hair is one cell that has grown a long thin extension outwards. That extension is what gives the root its enormous surface area for absorbing water and mineral salts.", "type": "short", "q": "A student says: 'Root hairs are multicellular structures similar to the hairs on a human head.' Explain what is wrong with this.", "answer": "A root hair is actually just an extension of a single plant cell.", "keywords": ["root", "hair", "single", "cell"], "id": "ch04-n071"}, {"source": "nblm", "topic": "4.1", "src": "L|They are dead cells – all of their contents, such as cytoplasm and a nucleus, have disappeared.", "explain": "A xylem vessel starts as living cells, but the contents and the end walls break down and disappear. What is left is an open tube, and water flows through it far more easily than it could through living cytoplasm.", "type": "short", "q": "A student says: 'The xylem vessels that carry water are living cells filled with cytoplasm.' Explain what is wrong with this.", "answer": "Xylem vessels are dead, empty tube-like cells that have lost all their contents.", "keywords": ["dead", "cells", "contents", "xylem"], "id": "ch04-n072"}, {"source": "nblm", "topic": "4.2", "src": "L|The loss of water vapour from leaves is called transpiration.", "explain": "Water becomes a gas inside the leaf, on the wet cellulose cell walls, and only then escapes through the stomata. Nothing liquid leaves the leaf, so transpiration is nothing like sweating.", "type": "short", "q": "A student says: 'Transpiration is when plants sweat out droplets of liquid water from their leaves.' Explain what is wrong with this.", "answer": "Transpiration is specifically the loss of water as a gas, or water vapour.", "keywords": ["transpiration", "loss", "water", "vapour"], "id": "ch04-n074"}, {"source": "nblm", "topic": "4.2", "src": "L|Most transpiration happens from the underside of a leaf, not the top.", "explain": "The stomata are the holes water vapour escapes through, and they are on the underside. The upper surface is covered by a waxy layer instead, which is why the top loses very little.", "type": "short", "q": "A student says: 'Leaves lose most of their water from the top surface that faces the hot sun.' Explain what is wrong with this.", "answer": "Because the top is protected, the vast majority of water vapour is lost from the bottom of the leaf.", "keywords": ["leaf", "protected", "vast", "majority"], "id": "ch04-n075"}, {"source": "nblm", "topic": "4.2", "src": "L|When a plant cell doesn’t contain enough water, it becomes soft and floppy.", "explain": "A wilted plant has cells that are soft and floppy because they are short of water, so they can no longer press against each other to hold the plant up. Water it and it stands up again, which a dead plant could not do.", "type": "short", "q": "A student says: 'When a plant wilts, it means its cells have died completely.' Explain what is wrong with this.", "answer": "Wilting simply means the plant's cells lack water and have temporarily lost their firmness.", "keywords": ["plant", "water", "wilting", "simply"], "id": "ch04-n078"}, {"source": "nblm", "topic": "4.2", "src": "L|A plant cell that has plenty of water is strong and firm.", "explain": "Water has four jobs in a plant: support, transport, cooling and photosynthesis. Photosynthesis is only one of them, which is why a plant short of water wilts long before it starves.", "type": "short", "q": "A student says: 'Plants only need to absorb water to use it as an ingredient for photosynthesis.' Explain what is wrong with this.", "answer": "Water is also crucial for providing physical support to keep the plant's cells firm and upright.", "keywords": ["water", "plant", "firm", "crucial"], "id": "ch04-n079"}, {"source": "nblm", "topic": "4.2", "src": "L|When water evaporates, it takes heat away with it.", "explain": "Changing from liquid to gas takes energy, and the escaping particles take that thermal energy with them. The cell is left with less energy than before, so it cools.", "type": "short", "q": "A student says: 'Evaporation of water from a leaf makes the plant hotter.' Explain what is wrong with this.", "answer": "As water turns into a gas and escapes, it actually removes thermal energy and cools the plant.", "keywords": ["water", "turns", "escapes", "actually"], "id": "ch04-n080"}, {"source": "nblm", "topic": "4.3", "src": "L|This means that the waste from the digestive system, which animals (including humans) get rid of as faeces, does not count as excretion.", "explain": "Excretion means getting rid of waste that the body's own cells made. Food in the digestive tube has passed straight through without ever entering a cell, so removing it is elimination, not excretion.", "type": "short", "q": "A student says: 'Getting rid of solid faeces from the digestive system is a form of excretion.' Explain what is wrong with this.", "answer": "Faeces are not considered excretion because the food passing through the digestive tube was never inside the body's cells.", "keywords": ["faeces", "excretion", "digestive", "considered"], "id": "ch04-n081"}, {"source": "nblm", "topic": "4.3", "src": "L|If we have more protein than we need, the liver changes the smaller molecules into urea.", "explain": "The liver makes urea, from the excess protein molecules brought to it in the blood. The kidneys come later in the story: they filter that urea back out of the blood.", "type": "short", "q": "A student says: 'The poisonous waste substance urea is created by the kidneys.' Explain what is wrong with this.", "answer": "Urea is actually manufactured in the liver when the body breaks down excess proteins.", "keywords": ["urea", "liver", "actually", "manufactured"], "id": "ch04-n083"}, {"source": "nblm", "topic": "4.3", "src": "L|The solution made of urea dissolved in water is called urine.", "explain": "Urea is the single poisonous waste substance the liver makes. Urine is the liquid the kidneys produce by dissolving that urea in the excess water they have removed.", "type": "short", "q": "A student says: 'Urea and urine are the exact same thing.' Explain what is wrong with this.", "answer": "Urine is a liquid mixture made by dissolving the waste product urea into excess water.", "keywords": ["urine", "made", "urea", "water"], "id": "ch04-n085"}, {"source": "nblm", "topic": "4.3", "src": "L|The urine made in each kidney flows down a tube called a ureter.", "explain": "There are two ureters, one from each kidney, and they both run down to the bladder. There is only one urethra, and it runs from the bladder out of the body.", "type": "short", "q": "A student says: 'The urethra is the tube that carries urine from the kidneys down to the bladder.' Explain what is wrong with this.", "answer": "The ureter carries urine to the bladder, while the urethra carries it from the bladder to the outside world.", "keywords": ["ureter", "urine", "carries", "bladder"], "id": "ch04-n086"}, {"source": "nblm", "topic": "4.4", "src": "L|The two blood systems come very close together, but do not touch.", "explain": "The two blood systems come very close but stay separate, so nothing has to be blood-compatible. Substances cross between them by diffusion, moving from where they are more concentrated to where they are less.", "type": "short", "q": "A student says: 'The mother's blood flows directly into the fetus's veins to feed it.' Explain what is wrong with this.", "answer": "The blood systems of the mother and the fetus get very close to each other but never actually mix.", "keywords": ["blood", "systems", "close", "mother"], "id": "ch04-n088"}, {"source": "nblm", "topic": "4.4", "src": "L|The substances that the fetus needs, diffuse from the mother’s blood to the fetus’s blood.", "explain": "A fetus does not eat. Every nutrient it needs is already dissolved in the mother's blood and diffuses across into the fetus's blood, which is why what the mother eats and drinks reaches it so directly.", "type": "short", "q": "A student says: 'A fetus swallows food directly from its mother's stomach.' Explain what is wrong with this.", "answer": "Essential nutrients cross over from the mother to the fetus entirely through the process of diffusion.", "keywords": ["mother", "fetus", "essential", "nutrients"], "id": "ch04-n089"}, {"source": "nblm", "topic": "4.4", "src": "L|Carbon monoxide in the blood reduces the amount of oxygen that haemoglobin can transport.", "explain": "The fetus does not use its lungs at all before birth. Carbon monoxide crosses into its blood and takes up space on the haemoglobin, so less oxygen is carried and its cells cannot respire as much.", "type": "short", "q": "A student says: 'Carbon monoxide from smoking physically blocks the baby's lungs from breathing.' Explain what is wrong with this.", "answer": "Carbon monoxide works by entering the blood and reducing the amount of oxygen the red blood cells can carry.", "keywords": ["carbon", "monoxide", "blood", "amount"], "id": "ch04-n091"}, {"source": "nblm", "topic": "4.4", "src": "L|Babies born to mothers who smoked during pregnancy tend to be smaller", "explain": "Babies born to mothers who smoked during pregnancy are much more likely to be low birthweight, under 2500 g. That is one of the clearest measurable effects scientists have found.", "type": "short", "q": "A student says: 'Smoking during pregnancy does not affect the physical size of the baby.' Explain what is wrong with this.", "answer": "Mothers who smoke during pregnancy are at a significantly higher risk of having smaller, low-birthweight babies.", "keywords": ["mothers", "smoke", "during", "pregnancy"], "id": "ch04-n092"}, {"source": "nblm", "topic": "4.4", "src": "L|Nicotine is an addictive drug. It can damage blood vessels", "explain": "Nicotine is the drug that makes smoking addictive, and it also damages blood vessels. It diffuses across into the fetus's blood just like any other drug the mother takes.", "type": "short", "q": "A student says: 'Nicotine is just a harmless flavouring chemical found in cigarettes.' Explain what is wrong with this.", "answer": "Nicotine is a powerful, addictive drug that can cause direct damage to blood vessels.", "keywords": ["nicotine", "addictive", "drug", "damage"], "id": "ch04-n093"}, {"source": "nblm", "topic": "4.4", "src": "L|we cannot ask some women to smoke during pregnancy, and others not to smoke", "explain": "Asking some pregnant women to smoke would be unethical, so that experiment can never be done. Instead scientists gather data from as many people as possible and look for correlations.", "type": "short", "q": "A student says: 'Scientists do experiments where they force pregnant women to smoke to prove it harms the fetus.' Explain what is wrong with this.", "answer": "Because experiments would be unethical, scientists must instead collect data to look for correlations between smoking and fetal health.", "keywords": ["experiments", "unethical", "scientists", "instead"], "id": "ch04-n094"}, {"id": "qwen-01-01", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "What is the main function of root hair cells?", "explain": "The text states that root hair cells provide a big surface through which water and mineral ions can be absorbed into the plant.", "src": "L|Root hair cells provide a really big surface through which water and mineral ions can be absorbed", "options": ["To make food for the plant", "To absorb water and mineral ions from the soil", "To transport water up to the leaves", "To protect the tip of the root"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "4.1", "source": "qwen", "q": "Water moves into the root hair cell by passing through the cell wall and the ____.", "explain": "The text describes the path of water entering the cell, mentioning it passes through the cell wall and the cell membrane.", "src": "L|It passes through the cell wall and the cell membrane of the cell", "answer": ["cell membrane"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "Which ions are dissolved in the water between the soil particles?", "explain": "The text specifically lists nitrate ions and magnesium ions as the mineral ions that move into the root hair cell.", "src": "L|Mineral ions including nitrate ions and magnesium ions are dissolved in the water", "options": ["Oxygen and carbon dioxide", "Nitrate and magnesium ions", "Calcium and iron ions", "Sodium and potassium ions"], "answer": 1}, {"id": "qwen-01-05", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "What is the state of xylem vessels?", "explain": "The text explains that xylem vessels are dead cells where contents like cytoplasm and nucleus have disappeared, leaving empty tubes.", "src": "L|They are dead cells – all of their contents, such as cytoplasm and a nucleus, have disappeared", "options": ["They are living cells with a nucleus", "They are dead cells with empty spaces inside", "They are filled with cytoplasm and cell sap", "They are only found in the leaves"], "answer": 1}, {"id": "qwen-01-06", "type": "fill", "topic": "4.1", "source": "qwen", "q": "The wood in a tree trunk is made up of ____ vessels.", "explain": "The text explicitly states that the wood in a tree trunk is composed of xylem vessels.", "src": "L|The wood in a tree trunk is made up of xylem vessels", "answer": ["xylem"]}, {"id": "qwen-01-07", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "Where do the air spaces in a leaf connect to the outside air?", "explain": "The text describes how air spaces connect with outside air through tiny holes in the underside of the leaf called stomata.", "src": "L|These air spaces connect with the air outside the leaf through tiny holes in the underside of the leaf – the stomata", "options": ["Through the upper epidermis", "Through tiny holes called stomata on the underside of the leaf", "Through the xylem vessels in the stem", "Through the root hairs"], "answer": 1}, {"id": "qwen-01-08", "type": "fill", "topic": "4.2", "source": "qwen", "q": "The loss of water vapour from leaves is called ____.", "explain": "The text defines the process of water vapour loss from leaves as transpiration.", "src": "L|The loss of water vapour from leaves is called transpiration", "answer": ["transpiration"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "What happens to liquid water in leaf cells before it becomes vapour?", "explain": "The text explains that liquid water soaks into the cellulose cell wall and then changes to water vapour by evaporating.", "src": "L|The liquid water in the cell soaks into the cellulose cell wall, and then changes to water vapour", "options": ["It freezes into ice", "It soaks into the cellulose cell wall and evaporates", "It is used entirely for photosynthesis", "It moves back down into the roots"], "answer": 1}, {"id": "qwen-01-12", "type": "fill", "topic": "4.1", "source": "qwen", "q": "Xylem vessels are long, tube-like cells that have no ____ or cytoplasm.", "explain": "The text states that xylem vessels are dead cells and their contents, such as cytoplasm and a nucleus, have disappeared.", "src": "L|all of their contents, such as cytoplasm and a nucleus, have disappeared", "answer": ["nucleus"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "4.3", "source": "qwen", "q": "What is the other name for the human excretory system?", "explain": "The text states that the excretory system is also known as the renal system, and 'renal' means to do with kidneys.", "src": "L|This system is also known as the renal system.", "options": ["The renal system", "The digestive system", "The circulatory system", "The respiratory system"], "answer": 0}, {"id": "qwen-02-02", "type": "fill", "topic": "4.3", "source": "qwen", "q": "The waste substance made in liver cells from excess protein is called ____.", "explain": "The text explains that if we have more protein than we need, the liver changes smaller molecules into urea.", "src": "L|the liver changes the smaller molecules into urea", "answer": ["urea"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "4.3", "source": "qwen", "q": "Which tube carries urine from the kidneys to the bladder?", "explain": "According to the text, urine made in each kidney flows down a tube called a ureter to the bladder.", "src": "L|The urine made in each kidney flows down a tube called a ureter.", "options": ["The ureter", "The urethra", "The vein", "The artery"], "answer": 0}, {"id": "qwen-02-04", "type": "fill", "topic": "4.3", "source": "qwen", "q": "The solution made of urea dissolved in excess water is called ____.", "explain": "The text defines urine as the solution made of urea dissolved in water.", "src": "L|The solution made of urea dissolved in water is called urine.", "answer": ["urine"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "Why does a plant wilt when it has not been watered for several days?", "explain": "The text states that when a plant cell doesn't contain enough water, it becomes soft and floppy, causing the plant to collapse or wilt.", "src": "L|When a plant cell doesn’t contain enough water, it becomes soft and floppy.", "options": ["Its cells become soft and floppy", "Its roots stop absorbing minerals", "Its leaves turn yellow", "Its xylem vessels block up"], "answer": 0}, {"id": "qwen-02-07", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "How do substances move from the mother's blood to the fetus's blood?", "explain": "The text states that substances the fetus needs diffuse from the mother's blood to the fetus's blood.", "src": "L|The substances that the fetus needs, diffuse from the mother’s blood to the fetus’s blood.", "options": ["They diffuse across", "They are pumped by the heart", "The blood systems mix together", "They travel through the ureter"], "answer": 0}, {"id": "qwen-02-08", "type": "fill", "topic": "4.4", "source": "qwen", "q": "A baby before it is born is called a ____.", "explain": "The text defines a fetus as a baby before it is born.", "src": "L|A fetus is a baby before it is born.", "answer": ["fetus"]}, {"id": "qwen-02-09", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "The fetus needs protein to make new cells and grow. The mother needs extra protein for a second reason of her own. What is it?", "explain": "The text says the mother needs extra protein to make extra haemoglobin because her blood has to transport oxygen to the fetus as well as for herself.", "src": "L|she needs extra protein to make extra haemoglobin", "options": ["To make extra haemoglobin", "To produce more fat", "To increase her body temperature", "To make extra urea"], "answer": 0}, {"id": "qwen-02-10", "type": "fill", "topic": "4.4", "source": "qwen", "q": "The gas in tobacco smoke that reduces the amount of oxygen haemoglobin can transport is ____.", "explain": "The text states that carbon monoxide in the blood reduces the amount of oxygen that haemoglobin can transport.", "src": "L|Carbon monoxide in the blood reduces the amount of oxygen that haemoglobin can transport.", "answer": ["carbon monoxide"]}, {"id": "qwen-02-11", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "Which mineral is essential for helping the baby grow strong bones?", "explain": "The text states that calcium is essential for helping the baby to grow strong bones.", "src": "L|Calcium is essential for helping the baby to grow strong bones", "options": ["Calcium", "Iron", "Sodium", "Potassium"], "answer": 0}, {"id": "qwen-03-01", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "What is the definition of a drug?", "explain": "The text states: 'A drug is something that is taken into the body, and that affects the way the body works.'", "src": "L|A drug is something that is taken into the body, and that affects the way the body works.", "options": ["A substance that affects how the body works", "A liquid used to clean wounds", "A type of vitamin found in fruit", "A gas released by plants"], "answer": 0}, {"id": "qwen-03-02", "type": "fill", "topic": "4.4", "source": "qwen", "q": "Antibiotics are drugs that kill ____ in the body.", "explain": "The text says: 'Antibiotics are drugs that kill bacteria in the body.'", "src": "L|Antibiotics are drugs that kill bacteria in the body.", "answer": ["bacteria"]}, {"id": "qwen-03-11", "type": "mcq", "topic": "4.4", "source": "qwen", "q": "Why is it difficult to do experiments on how smoking affects fetal health?", "explain": "The text explains: 'we cannot ask some women to smoke during pregnancy, and others not to smoke, and then compare the health of their babies.'", "src": "L|we cannot ask some women to smoke during pregnancy, and others not to smoke", "options": ["Because babies cannot speak", "Because we cannot ask some women to smoke and others not to for comparison", "Because cigarettes are too expensive", "Because doctors do not allow it"], "answer": 1}, {"id": "qwenw-01-07", "type": "mcq", "topic": "4.1", "source": "qwen", "q": "Why did the scientists measure water uptake per gram of wheat plant instead of total volume?", "explain": "Measuring per gram allows for a fair comparison between plants that may have different masses.", "src": "W|Suggest why the scientists measured the volume of water taken up per gram", "options": ["To compare plants of different sizes fairly", "Because the scale was broken", "To save time on calculations", "Because water is measured in grams"], "answer": 0}, {"id": "qwenw-04-01", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "In an experiment to measure the water lost from the leaves of a plant, Sofia covered the pot and the soil of each plant with a plastic bag. Why did she do this?", "explain": "Covering the pot and soil prevents water loss through evaporation, ensuring that any mass change is due to transpiration from the leaves.", "src": "W|Explain why she covered the pot and soil of each plant with a plastic bag.", "options": ["To stop water evaporating from the soil", "To keep insects away from the plants", "To make sure the plants got enough light", "To stop the soil from getting too hot"], "answer": 0}, {"id": "qwenw-04-11", "type": "mcq", "topic": "4.2", "source": "qwen", "q": "A student plots her results and one point lies a long way off the pattern made by the others. What should she do with this anomalous result when she draws the line?", "explain": "The text asks to circle the anomalous result and implies it should be treated differently in the graph.", "src": "W|Draw a circle around the anomalous result in your results table.", "options": ["Ignore it", "Circle it and exclude it from the trend line", "Double its value", "Change it
