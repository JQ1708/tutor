<script>
(function(){
var DATA = JSON.parse(document.getElementById('data').textContent);
var FIGS = DATA.figures || {};
var KEY = 'y9sci-' + DATA.chapter;

/* One question can hold several pins; a card is what the learner actually answers,
   so label questions are expanded into one card per pin before anything else runs. */
var CARDS = [];
DATA.questions.forEach(function(q){
  var pins = q.labels || q.pins;
  if(q.type === 'label' && pins){
    // the same words can label two ends of one arrow, or three arrows of one process;
    // every occurrence stays masked, but only the first becomes a card
    var seenText = {};
    pins.filter(function(p){
      var k = p.text.toLowerCase();
      if(seenText[k]) return false;
      seenText[k] = 1; return true;
    }).forEach(function(p, i){
      CARDS.push({id:q.id+'-'+p.n, type:'label', topic:q.topic, source:q.source,
                  q:q.q.replace('{n}', p.n), image:q.image, pin:p, explain:q.explain, src:q.src});
    });
  } else { CARDS.push(q); }
});

var state = load();
var view = [], idx = 0, shown = false, picked = null, mark = null;
var mode = 'flash';                       // flash | quiz
var filter = {type:'all', topic:'all'};

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

var TYPES = ['all','mcq','fill','short','label','hotspot'];
var TOPICS = ['all'].concat(Object.keys(CARDS.reduce(function(a,c){ a[c.topic]=1; return a; },{})).sort());

function buildFilters(){
  var f = document.getElementById('filters');
  f.innerHTML = '';
  TYPES.forEach(function(t){
    var n = t==='all' ? CARDS.length : CARDS.filter(function(c){return c.type===t;}).length;
    if(!n) return;
    var b = el('span','chip'+(filter.type===t?' on':''), (t==='all'?'All':cap(t))+' '+n);
    b.onclick = function(){ filter.type = t; refresh(); };
    f.appendChild(b);
  });
  var sep = el('span','', '|'); sep.style.color='#c3cad2'; f.appendChild(sep);
  TOPICS.forEach(function(t){
    var b = el('span','chip'+(filter.topic===t?' on':''), t==='all'?'All topics':t);
    b.onclick = function(){ filter.topic = t; refresh(); };
    f.appendChild(b);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function refresh(){
  view = CARDS.filter(function(c){
    return (filter.type==='all'||c.type===filter.type) && (filter.topic==='all'||c.topic===filter.topic);
  });
  idx = 0; buildFilters(); render();
}

function norm(s){
  return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}

function figure(card, opts){
  var f = FIGS[card.image];
  if(!f) return el('div','hint','[figure missing: '+card.image+']');
  var wrap = el('div','fig'+(opts.click?' click':''));
  var img = document.createElement('img'); img.src = f.image; img.alt = '';
  wrap.appendChild(img);
  // every printed label is covered, otherwise the answer is sitting on the diagram
  (f.pins||[]).forEach(function(p){
    var m = el('div','mask');
    m.style.cssText = 'left:'+p.x+'%;top:'+p.y+'%;width:'+p.w+'%;height:'+p.h+'%';
    wrap.appendChild(m);
    if(opts.numberAll || (opts.pin && p.n===opts.pin.n)){
      var d = el('div','pin'+(opts.pin && p.n===opts.pin.n ? '' : ' sm'), String(p.n));
      d.style.cssText += 'left:'+(p.x+p.w/2)+'%;top:'+(p.y+p.h/2)+'%';
      wrap.appendChild(d);
    }
  });
  return wrap;
}

function render(){
  var stage = document.getElementById('stage');
  stage.innerHTML = '';
  document.getElementById('mode').textContent = 'Mode: ' + (mode==='flash'?'Flashcards':'Quiz');
  var done = Object.keys(state).length;
  document.getElementById('pbar').style.width = Math.min(100, 100*done/CARDS.length)+'%';
  var right = 0, wrong = 0;
  Object.keys(state).forEach(function(k){ state[k]==='g' ? right++ : wrong++; });
  document.getElementById('score').textContent = right+' known / '+wrong+' to review';

  if(!view.length){ stage.appendChild(el('div','done','Nothing matches this filter.')); return; }
  if(idx >= view.length){
    var d = el('div','done');
    d.appendChild(el('div','big', right+'/'+CARDS.length));
    d.appendChild(el('h2','','Set finished'));
    d.appendChild(el('p','','Use the filters above to review a type again, or press Reset to start over.'));
    stage.appendChild(d); return;
  }
  document.getElementById('pos').textContent = 'Card '+(idx+1)+' of '+view.length;

  var c = view[idx], card = el('div','card');
  var h = el('p','q');
  h.appendChild(el('span','tag', c.type==='mcq'?'Multiple choice':c.type==='fill'?'Fill the gap':cap(c.type)));
  h.appendChild(document.createTextNode(c.q));
  card.appendChild(h);

  if(c.type==='label'){
    card.appendChild(figure(c, {pin:c.pin, numberAll:true}));
  } else if(c.type==='hotspot'){
    card.appendChild(el('div','hint','Click the correct place on the diagram.'));
    var w = figure(c, {click:true});
    w.onclick = function(ev){
      if(shown) return;
      var r = w.getBoundingClientRect();
      var x = 100*(ev.clientX-r.left)/r.width, y = 100*(ev.clientY-r.top)/r.height;
      var t = c.target;
      picked = {x:x, y:y, ok: Math.hypot(x-t.x, y-t.y) <= t.r};
      shown = true; mark = picked.ok ? 'g' : 'a'; commit(c); render();
    };
    card.appendChild(w);
  }

  if(c.type==='mcq'){
    c.options.forEach(function(o,i){
      var b = el('button','opt');
      b.appendChild(el('b','', 'ABCD'[i]));
      b.appendChild(document.createTextNode(o));
      if(shown){
        if(i===c.answer) b.className='opt right';
        else if(i===picked) b.className='opt wrong';
      } else if(i===picked) b.className='opt pick';
      b.onclick = function(){ if(shown) return; picked=i; shown=true; mark = (i===c.answer)?'g':'a'; commit(c); render(); };
      card.appendChild(b);
    });
  }
  if(c.type==='fill' && !shown){
    var inp = document.createElement('input'); inp.type='text'; inp.placeholder='Type your answer, then press Enter';
    inp.onkeydown = function(e){
      if(e.key!=='Enter') return;
      picked = inp.value; shown = true;
      mark = (c.answer||[]).some(function(a){ return norm(a)===norm(inp.value); }) ? 'g' : 'a';
      commit(c); render();
    };
    card.appendChild(inp);
    setTimeout(function(){ inp.focus(); }, 0);
  }

  if(shown){
    var a = el('div','ans'+(mark==='a'?' miss':''));
    a.appendChild(el('div','lab','Answer'));
    var txt = c.type==='mcq' ? c.options[c.answer]
            : c.type==='fill' ? (c.answer||[]).join(' / ')
            : c.type==='label' ? c.pin.text
            : c.type==='hotspot' ? 'See the marked position on the diagram.'
            : c.answer;
    var b = el('div'); b.appendChild(el('b','', txt)); a.appendChild(b);
    if(c.type==='fill' && picked) a.appendChild(el('div','kw','You typed: '+picked));
    if(c.keywords) a.appendChild(el('div','kw','Must mention: '+c.keywords.join(', ')));
    if(c.explain) a.appendChild(el('div','','' + c.explain));
    if(c.src) a.appendChild(el('div','src','Source: '+c.src.replace(/^[LW]\|/,'')));
    card.appendChild(a);
    if(c.type==='hotspot' && picked){
      var w2 = card.querySelector('.fig');
      var d1 = el('div','dot'); d1.style.cssText='left:'+picked.x+'%;top:'+picked.y+'%';
      var d2 = el('div','dot ok'); d2.style.cssText='left:'+c.target.x+'%;top:'+c.target.y+'%';
      w2.appendChild(d1); w2.appendChild(d2);
    }
  }

  var acts = el('div','acts');
  if(!shown){
    // in Quiz mode an answerable card must actually be attempted; only open-ended
    // types (short, label) keep the reveal button, because nothing can mark them
    var mustTry = mode==='quiz' && (c.type==='mcq'||c.type==='fill'||c.type==='hotspot');
    if(!mustTry){
      var s = el('button','b p','Show answer'); s.onclick = function(){ shown=true; render(); }; acts.appendChild(s);
    } else {
      acts.appendChild(el('div','hint','Answer the card to continue.'));
    }
  } else {
    var g = el('button','b g','Got it'); g.onclick = function(){ mark='g'; commit(c); next(); };
    var r2 = el('button','b r','Review again'); r2.onclick = function(){ mark='a'; commit(c); next(); };
    var n = el('button','b p','Next →'); n.onclick = next;
    acts.appendChild(g); acts.appendChild(r2); acts.appendChild(n);
  }
  card.appendChild(acts);
  stage.appendChild(card);
}

function commit(c){ if(mark){ state[c.id] = mark; save(); } }
function next(){ shown=false; picked=null; mark=null; idx++; render(); }

document.getElementById('mode').onclick = function(){ mode = mode==='flash'?'quiz':'flash'; shown=false; picked=null; render(); };
document.getElementById('shuf').onclick = function(){
  for(var i=view.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=view[i]; view[i]=view[j]; view[j]=t; }
  idx=0; shown=false; picked=null; render();
};
document.getElementById('rst').onclick = function(){ state={}; save(); idx=0; shown=false; picked=null; render(); };
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  var c = view[idx]; if(!c) return;
  if(e.key===' '){ e.preventDefault(); if(!shown){ shown=true; render(); } else next(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='g' && shown){ mark='g'; commit(c); next(); }
  else if(e.key==='a' && shown){ mark='a'; commit(c); next(); }
  else if(!shown && c.type==='mcq' && '1234'.indexOf(e.key)>=0){
    var i = +e.key-1; if(i < c.options.length){ picked=i; shown=true; mark=(i===c.answer)?'g':'a'; commit(c); render(); }
  }
});
refresh();
})();
</script>
</body>
</html>
