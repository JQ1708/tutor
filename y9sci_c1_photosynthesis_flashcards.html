<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>

 "x": 73.6, "y": 57.9, "w": 13.3, "h": 3.2}, {"n": 6, "text": "chloroplast containing chlorophyll", "alt": ["chloroplast"], "x": 73.6, "y": 68.6, "w": 20.0, "h": 9.8}], "src": "L|cell wall"}, {"id": "ch01-f02h1", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p09_cell.png", "figure": "L_p09_cell", "q": "Click on the label of the tough outer layer that gives the plant cell its shape.", "caption": "A plant cell. Photosynthesis takes place inside the chloroplasts.", "target": {"x": 80.4, "y": 13.4, "r": 7.0}, "explain": "The cell wall is outside the cell surface membrane. It is strong and holds the cell in shape. Animal cells do not have one.", "src": "L|cell wall"}, {"id": "ch01-f02h2", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p09_cell.png", "figure": "L_p09_cell", "q": "Click on the label of the thin layer, just inside the outer wall, that controls what enters and leaves the cell.", "caption": "A plant cell. Photosynthesis takes place inside the chloroplasts.", "target": {"x": 83.5, "y": 25.8, "r": 7.0}, "explain": "The cell surface membrane is the real boundary of the living cell. In the starch test a leaf is boiled first, because iodine solution cannot pass through this membrane until it has been broken.", "src": "L|cell surface membrane"}, {"id": "ch01-f02h3", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p09_cell.png", "figure": "L_p09_cell", "q": "Click on the label of the jelly-like material in which most of the chemical reactions of the cell take place.", "caption": "A plant cell. Photosynthesis takes place inside the chloroplasts.", "target": {"x": 82.4, "y": 38.1, "r": 7.0}, "explain": "The cytoplasm fills the cell around the vacuole, and the chloroplasts sit in it.", "src": "L|cytoplasm"}, {"id": "ch01-f02h4", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p09_cell.png", "figure": "L_p09_cell", "q": "Click on the label of the large fluid-filled space that helps to keep the cell firm.", "caption": "A plant cell. Photosynthesis takes place inside the chloroplasts.", "target": {"x": 80.2, "y": 48.8, "r": 7.0}, "explain": "The vacuole holds cell sap. When it is full it presses the cytoplasm out against the cell wall, which keeps the plant firm.", "src": "L|vacuole"}, {"id": "ch01-f02h5", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p09_cell.png", "figure": "L_p09_cell", "q": "Click on the label of the part that controls the cell.", "caption": "A plant cell. Photosynthesis takes place inside the chloroplasts.", "target": {"x": 80.2, "y": 59.5, "r": 7.0}, "explain": "The nucleus controls what the cell does and holds the cell's genetic material.", "src": "L|nucleus"}, {"id": "ch01-f02h6", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p09_cell.png", "figure": "L_p09_cell", "q": "Click on the label of the part in which photosynthesis takes place.", "caption": "A plant cell. Photosynthesis takes place inside the chloroplasts.", "target": {"x": 83.6, "y": 73.5, "r": 7.0}, "explain": "Chloroplasts contain the green pigment chlorophyll, which captures the energy in sunlight. Photosynthesis happens inside them, and the starch a plant makes is stored there too.", "src": "L|chloroplast containing chlorophyll"}, {"id": "ch01-f03a", "type": "label", "topic": "1.2", "source": "opus", "image": "img/L_p12_leaf.png", "figure": "L_p12_leaf", "q": "This is a cross-section through a leaf, seen under a microscope. Name the layer or part labelled {n}.", "caption": "A cross-section through a leaf, seen under a microscope.", "labels": [{"n": 1, "text": "waxy layer", "alt": [], "x": 28.2, "y": 5.7, "w": 11.5, "h": 4.5}, {"n": 2, "text": "upper epidermis", "alt": [], "x": 62.3, "y": 5.7, "w": 17.8, "h": 4.5}, {"n": 3, "text": "palisade layer", "alt": [], "x": 81.4, "y": 27.7, "w": 14.9, "h": 4.5}, {"n": 4, "text": "spongy layer", "alt": [], "x": 81.4, "y": 57.4, "w": 13.8, "h": 4.5}, {"n": 5, "text": "vein", tomata are tiny holes in the lower epidermis. Carbon dioxide diffuses in through them and oxygen and water vapour diffuse out.", "src": "L|lower epidermis"}, {"id": "ch01-f03h5", "type": "hotspot", "topic": "1.2", "source": "opus", "image": "img/L_p12_leaf.png", "figure": "L_p12_leaf", "q": "Click on the label of the part that carries water to the cells of the leaf.", "caption": "A cross-section through a leaf, seen under a microscope.", "target": {"x": 5.4, "y": 66.8, "r": 7.0}, "explain": "Veins carry water up from the roots to the leaf cells, and carry the carbohydrate made in the leaf away to the rest of the plant.", "src": "L|vein"}, {"id": "ch01-f04a", "type": "label", "topic": "1.3", "source": "opus", "image": "img/L_p22_tubes.png", "figure": "L_p22_tubes", "q": "These are the tubes used in the hydrogencarbonate indicator investigation. Name the part labelled {n}.", "caption": "Tubes A to F in the hydrogencarbonate indicator investigation.", "labels": [{"n": 1, "text": "small animals", "alt": [], "x": 42.5, "y": 16.6, "w": 6.0, "h": 11.9}, {"n": 2, "text": "perforated metal platform", "alt": ["metal platform", "platform"], "x": 2.9, "y": 19.9, "w": 13.2, "h": 11.9}, {"n": 3, "text": "hydrogencarbonate indicator", "alt": ["hydrogencarbonate indicator solution"], "x": 2.9, "y": 35.4, "w": 15.5, "h": 11.9}, {"n": 4, "text": "water plant", "alt": [], "x": 9.4, "y": 52.1, "w": 8.9, "h": 5.8}], "src": "L|small animals"}, {"id": "ch01-f04h1", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p22_tubes.png", "figure": "L_p22_tubes", "q": "Click on the label of the living things in these tubes that respire but cannot photosynthesise.", "caption": "Tubes A to F in the hydrogencarbonate indicator investigation.", "target": {"x": 45.5, "y": 22.6, "r": 7.0}, "explain": "The small animals respire all the time and give out carbon dioxide, but they cannot take any back in, so a tube with animals alone gains carbon dioxide.", "src": "L|small animals"}, {"id": "ch01-f04h2", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p22_tubes.png", "figure": "L_p22_tubes", "q": "Click on the label of the part that holds the animals above the liquid, and which is put into every tube including the ones with no animals.", "caption": "Tubes A to F in the hydrogencarbonate indicator investigation.", "target": {"x": 9.5, "y": 25.8, "r": 7.0}, "explain": "Every tube gets a platform so that the tubes are identical apart from the one thing being tested. If only some had a platform, the platform itself could explain a difference in the results.", "src": "L|perforated metal platform"}, {"id": "ch01-f04h3", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p22_tubes.png", "figure": "L_p22_tubes", "q": "Click on the label of the solution that changes colour according to the concentration of carbon dioxide.", "caption": "Tubes A to F in the hydrogencarbonate indicator investigation.", "target": {"x": 10.7, "y": 41.4, "r": 7.0}, "explain": "Hydrogencarbonate indicator is red at the normal concentration of carbon dioxide, turns yellow when there is more, and turns purple when there is less.", "src": "L|hydrogencarbonate indicator"}, {"id": "ch01-f05a", "type": "label", "topic": "1.3", "source": "opus", "image": "img/L_p24_carbon.png", "figure": "L_p24_carbon", "q": "This diagram shows the carbon cycle. Name the process or the store of carbon labelled {n}.", "caption": "The complete carbon cycle.", "labels": [{"n": 1, "text": "carbon dioxide in the air", "alt": ["carbon dioxide"], "x": 45.3, "y": 7.6, "w": 10.6, "h": 7.2}, {"n": 2, "text": "combustion", "alt": [], "x": 9.4, "y": 11.7, "w": 8.5, "h": 3.5}, {"n": 3, "text": "photosynthesis", "alt": [], "x": 18.7, "y": 22.0, "w": 10.8, "h": 3.5}, {"n": 4, "text": "respiration", "alt": [], "x": 45.6, "y": 22.0, "w": 7.6, "h": 3.5}, {"n": 5, "text": "feeding", "alt": [], "x": 47.2, "y": 42.4, "w": 5.4, "h": 3.5}, {"n": 6, "text": "carbohydrates in plants", "alt": ["carbohydrates in the plant"], "x": 23.9, "y": 43.2, "w": 10.1, "h": 7.2}, {"n": 7, "text": "carbohydrates in animals", "alt": ["carbohydrates in the animal"], "x": 67.3, "y": 43.2, "w": 10.1, "h": 7.2}, {"n": 8, "text": "fossil fuels", "alt": [], "x": 16.2, "y": 72.1, "w": 7.3, "h": 3.5}, {"n": 9, "text": "carbohydrates in decomposers", "alt": ["carbohydrates in the decomposers"], "x": 44.9, "y": 78.7, "w": 11.3, "h": 7.2}], "src": "L|carbon dioxide in the air"}, {"id": "ch01-f05h1", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p24_carbon.png", "figure": "L_p24_carbon", "q": "Click on the label of the store of carbon that every arrow in this cycle either takes from or returns to.", "caption": "The complete carbon cycle.", "target": {"x": 50.6, "y": 11.2, "r": 7.0}, "explain": "Carbon dioxide in the air is the shared pool. Photosynthesis is the only arrow taking carbon out of it; respiration and combustion put carbon back in.", "src": "L|carbon dioxide in the air"}, {"id": "ch01-f05h2", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p24_carbon.png", "figure": "L_p24_carbon", "q": "Click on the label of the process that returns carbon locked in fossil fuels to the air.", "caption": "The complete carbon cycle.", "target": {"x": 13.7, "y": 13.4, "r": 7.0}, "explain": "Combustion is burning. The carbon in coal, oil and gas was taken out of the air by photosynthesis hundreds of millions of years ago, and burning releases it again in a few hundred years.", "src": "L|combustion"}, {"id": "ch01-f05h3", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p24_carbon.png", "figure": "L_p24_carbon", "q": "Click on the label of the only process in this cycle that removes carbon dioxide from the air.", "caption": "The complete carbon cycle.", "target": {"x": 24.1, "y": 23.8, "r": 7.0}, "explain": "Photosynthesis takes carbon dioxide from the air and builds it into carbohydrates. Every other arrow in the cycle moves carbon along or returns it to the air.", "src": "L|photosynthesis"}, {"id": "ch01-f05h4", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p24_carbon.png", "figure": "L_p24_carbon", "q": "Click on the label of the store of carbon that is made directly by photosynthesis.", "caption": "The complete carbon cycle.", "target": {"x": 28.9, "y": 46.8, "r": 7.0}, "explain": "Plants build the carbon dioxide they take in into carbohydrates. All of the carbon in animals, decomposers and fossil fuels passed through a plant first.", "src": "L|carbohydrates in plants"}, {"id": "ch01-f05h5", "type": "hotspot", "topic": "1.3", "source": "opus", "image": "img/L_p24_carbon.png", "figure": "L_p24_carbon", "q": "Click on the label of the store of carbon inside the organisms that break down dead bodies and waste.", "caption": "The complete carbon cycle.", "target": {"x": 50.5, "y": 82.3, "r": 7.0}, "explain": "Decomposers get their carbon from dead plants and animals and from waste. As they respire they return carbon dioxide to the air.", "src": "L|carbohydrates in decomposers"}, {"id": "ch01-f06a", "type": "label", "topic": "1.4", "source": "opus", "image": "img/L_p34_expand.png", "figure": "L_p34_expand", "q": "This apparatus is used to show what happens to water when it is heated. Name the part labelled {n}.", "caption": "Apparatus for showing that water expands when it is heated.", "labels": [{"n": 1, "text": "glass tubing", "alt": [], "x": 8.5, "y": 21.0, "w": 20.8, "h": 3.5}, {"n": 2, "text": "thermometer", "alt": [], "x": 6.4, "y": 40.2, "w": 22.8, "h": 3.5}, {"n": 3, "text": "meniscus", "alt": [], "x": 72.9, "y": 50.4, "w": 16.0, "h": 3.5}], "src": "L|glass tubing"}, {"id": "ch01-f06h2", "type": "hotspot", "topic": "1.4", "source": "opus", "image": "img/L_p34_expand.png", "figure": "L_p34_expand", "q": "Click on the label of the instrument that measures the temperature of the water.", "caption": "Apparatus for showing that water expands when it is heated.", "target": {"x": 17.8, "y": 42.0, "r": 7.0}, "explain": "The thermometer shows how much the water has been heated, so the rise in level can be matched to a rise in temperature.", "src": "L|thermometer"}, {"id": "ch01-f06h3", "type": "hotspot", "topic": "1.4", "source": "opus", "image": "img/L_p34_expand.png", "figure": "L_p34_expand", "q": "Click on the label of the curved top surface of the water, whose position you read to see whether the water has expanded.", "caption": "Apparatus for showing that water expands when it is heated.", "target": {"x": 80.9, "y": 52.1, "r": 7.0}, "explain": "As the water warms it expands, so it takes up more room and the meniscus rises up the glass tubing. This is one of the two reasons sea level is rising.", "src": "L|meniscus"}, {"id": "ch01-o001", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why it was best to use a water plant in the experiment to collect the gas produced in photosynthesis.", "answer": "A water plant releases the gas as bubbles under the water, so the gas rises into the funnel and can be collected in the test tube instead of escaping into the air.", "keywords": ["bubbles", "collect", "under water"], "explain": "The book chooses a water plant only because the gas is easy to trap.", "src": "L|This makes it easy to collect the gas that it releases."}, {"id": "ch01-o002", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why it was important to leave the gas-collecting apparatus where it would get plenty of sunlight.", "answer": "Light provides the energy for photosynthesis. Without enough light the plant would photosynthesise very slowly and hardly any oxygen would be collected.", "keywords": ["light", "energy", "photosynthesis"], "explain": "Light is one of the three things a plant needs to photosynthesise.", "src": "L|energy, which they get from sunlight"}, {"id": "ch01-o003", "type": "short", "topic": "1.1", "source": "opus", "q": "A glowing splint is put into the gas collected from a water plant and it relights. What does this tell you about the gas, and why is that the expected result?", "answer": "The gas contains a lot of oxygen. Oxygen is a product of photosynthesis, so a plant in the light releases oxygen.", "keywords": ["oxygen", "relight", "product"], "explain": "A glowing splint relighting is the standard test for oxygen.", "src": "L|If the gas contains a lot of oxygen, the splint will relight."}, {"id": "ch01-o004", "type": "short", "topic": "1.1", "source": "opus", "q": "In the light intensity experiment, the lamp is moved further from the test tube each time. Describe what happens to the number of bubbles per minute, and explain why.", "answer": "The number of bubbles per minute falls. Moving the lamp further away lowers the light intensity, so less energy reaches the chlorophyll and the rate of photosynthesis decreases.", "keywords": ["decreases", "light intensity", "rate"], "explain": "Distance controls light intensity, and light intensity controls the rate.", "src": "L|As the light intensity increases, the rate of photosynthesis"}, {"id": "ch01-o005", "type": "short", "topic": "1.1", "source": "opus", "q": "In the light intensity experiment the bubble count is repeated three times at each distance. Explain why.", "answer": "Repeating and taking a mean reduces the effect of random variation, so the result for each distance is more reliable and any anomalous count can be spotted.", "keywords": ["mean", "reliable", "repeat"], "explain": "Repeats plus a mean are how the book handles random variation.", "src": "L|Calculate the mean number of bubbles for each distance of the lamp"}, {"id": "ch01-o006", "type": "mcq", "topic": "1.1", "source": "opus", "q": "Which pair are the reactants in photosynthesis?", "options": ["Glucose and oxygen", "Water and carbon dioxide", "Water and oxygen", "Glucose and carbon dioxide"], "answer": 1, "explain": "Reactants are on the left of the equation: water + carbon dioxide.", "src": "L|water + carbon dioxide -> glucose + oxygen"}, {"id": "ch01-o007", "type": "mcq", "topic": "1.1", "source": "opus", "q": "Where does a plant get the carbon dioxide it uses in photosynthesis?", "options": ["From the soil", "From the air", "From the water in its cells", "From the sunlight"], "answer": 1, "explain": "Water comes from the soil; carbon dioxide comes from the air.", "src": "L|carbon dioxide, which they get from the air"}, {"id": "ch01-o008", "type": "fill", "topic": "1.1", "source": "opus", "q": "The energy in sunlight is captured by a green pigment called ____.", "answer": ["chlorophyll"], "explain": "Chlorophyll is the pigment that absorbs light energy.", "src": "L|captured by a green pigment, called chlorophyll"}, {"id": "ch01-o009", "type": "fill", "topic": "1.1", "source": "opus", "q": "About ____ % of the air around us is oxygen.", "answer": ["20", "twenty"], "explain": "The book gives about 20% oxygen in the air.", "src": "L|About 20% of the air around us is oxygen."}, {"id": "ch01-o010", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain how a lizard that eats grasshoppers relies on photosynthesis for its energy.", "answer": "Grass photosynthesises and stores energy from sunlight in carbohydrates. The grasshopper eats the grass and gains some of that energy, and the lizard gains some again when it eats the grasshopper.", "keywords": ["food chain", "energy", "carbohydrates"], "explain": "Energy passes along the food chain from the plant that captured it.", "src": "L|All the energy in all the food in the world comes from plants."}, {"id": "ch01-o011", "type": "short", "topic": "1.1", "source": "opus", "q": "Scientists think there was almost no oxygen in the Earth's early atmosphere. Explain what changed this.", "answer": "Oxygen began to collect in the air when bacteria started to photosynthesise, because oxygen is released as a waste product of photosynthesis.", "keywords": ["bacteria", "photosynthesise", "oxygen"], "explain": "Photosynthesis by early bacteria built up the oxygen in the atmosphere.", "src": "L|oxygen first began to collect in the air when bacteria first began to photosynthesise"}, {"id": "ch01-o012", "type": "mcq", "topic": "1.2", "source": "opus", "q": "In which part of a plant cell does photosynthesis take place?", "options": ["The nucleus", "The vacuole", "The chloroplasts", "The cell wall"], "answer": 2, "explain": "Chlorophyll is kept inside chloroplasts, so that is where photosynthesis happens.", "src": "L|Chlorophyll is kept inside chloroplasts, inside plant cells."}, {"id": "ch01-o013", "type": "fill", "topic": "1.2", "source": "opus", "q": "Plants store extra carbohydrate as ____ inside the chloroplasts in their cells.", "answer": ["starch"], "explain": "Starch is the storage carbohydrate, which is why the iodine test works.", "src": "L|Plants store carbohydrates as starch."}, {"id": "ch01-o014", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why a leaf must be boiled in water before it is tested for starch.", "answer": "Iodine solution cannot pass through cell membranes. Boiling breaks the membranes apart so the iodine can reach the starch inside the cells.", "keywords": ["membrane", "break", "iodine"], "explain": "The boiling step is about letting iodine reach the starch, not about killing the leaf.", "src": "L|Boiling the leaf breaks the cell membranes apart."}, {"id": "ch01-o015", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why the green colour is removed from a leaf with hot ethanol before iodine solution is added.", "answer": "The green chlorophyll would hide the colour change. With the green removed, the blue-black colour where starch is present can be seen clearly.", "keywords": ["green", "colour change", "see"], "explain": "It is a practical step so that the result is visible.", "src": "L|You should see the green colour dissolve out of the leaf into the ethanol."}, {"id": "ch01-o016", "type": "short", "topic": "1.2", "source": "opus", "q": "Why must the burner be turned off before the ethanol is used in the starch test?", "answer": "Ethanol is very flammable, so an open flame could set light to it.", "keywords": ["ethanol", "flammable", "flame"], "explain": "This is the key safety point of the practical.", "src": "L|Ethanol is very flammable (it catches light easily)."}, {"id": "ch01-o017", "type": "short", "topic": "1.2", "source": "opus", "q": "A variegated leaf has green parts and white parts. Predict which parts will go blue-black with iodine solution, and explain your prediction.", "answer": "Only the green parts go blue-black. Only they contain chlorophyll, so only they can photosynthesise and make the starch that iodine detects.", "keywords": ["green", "chlorophyll", "starch"], "explain": "No chlorophyll means no photosynthesis, so no starch is stored there.", "src": "W|The green parts of the leaf will contain starch, but the white parts will not."}, {"id": "ch01-o018", "type": "mcq", "topic": "1.2", "source": "opus", "q": "Which layer of a leaf carries out most of the photosynthesis?", "options": ["The upper epidermis", "The palisade layer", "The spongy layer", "The lower epidermis"], "answer": 1, "explain": "The palisade cells are packed with chloroplasts near the top of the leaf.", "src": "L|The palisade layer contains cells that do most of the photosynthesis."}, {"id": "ch01-o019", "type": "short", "topic": "1.2", "source": "opus", "q": "Use your knowledge of diffusion to explain how carbon dioxide gets into a leaf.", "answer": "Cells inside the leaf use up carbon dioxide, so its concentration inside is lower than in the air outside. Carbon dioxide therefore diffuses from the higher concentration in the air, through the stomata, into the air spaces in the leaf.", "keywords": ["diffuses", "concentration", "stomata"], "explain": "Using up the gas keeps the concentration gradient going.", "src": "L|These holes let carbon dioxide from the air get into the leaf."}, {"id": "ch01-o020", "type": "fill", "topic": "1.2", "source": "opus", "q": "Tiny holes in the lower epidermis that let gases diffuse in and out of a leaf are called ____.", "answer": ["stomata", "stoma"], "explain": "Stomata is the plural; one hole is a stoma.", "src": "L|These holes are called stomata (singular: stoma)."}, {"id": "ch01-o021", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why a plant that is short of magnesium has yellow leaves and grows badly.", "answer": "Magnesium is needed to make chlorophyll. Without enough of it the plant makes little chlorophyll, so its leaves look yellow and it cannot absorb enough light energy to photosynthesise properly.", "keywords": ["magnesium", "chlorophyll", "photosynthesise"], "explain": "Yellow leaves are the visible sign of missing chlorophyll.", "src": "L|Magnesium is needed to make the green pigment, chlorophyll."}, {"id": "ch01-o022", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why a plant needs nitrate from the soil.", "answer": "Nitrate contains nitrogen, which the plant needs to convert carbohydrates into proteins. Proteins are needed to make new cells so the plant can grow, and nitrogen is also used to make chlorophyll.", "keywords": ["nitrogen", "protein", "growth"], "explain": "Nitrate is the nitrogen source for making protein.", "src": "L|These are needed so that the plant can convert carbohydrates to proteins."}, {"id": "ch01-o023", "type": "short", "topic": "1.2", "source": "opus", "q": "Suggest why it is hard, even for an expert, to tell apart a plant short of magnesium and a plant short of nitrate.", "answer": "Both minerals are needed to make chlorophyll, so a shortage of either gives pale or yellow leaves and a small, poorly grown plant. The symptoms look almost the same.", "keywords": ["chlorophyll", "yellow", "similar"], "explain": "Nitrogen is used for chlorophyll as well as protein, so the two deficiencies overlap.", "src": "L|Nitrogen is also needed to make chlorophyll."}, {"id": "ch01-o024", "type": "short", "topic": "1.2", "source": "opus", "q": "Compare how plants obtain protein with how animals obtain protein.", "answer": "Plants make their own protein from carbohydrates made in photosynthesis plus nitrate taken from the soil. Animals cannot do this, so they must eat plants or other animals to get protein.", "keywords": ["plants make", "nitrate", "animals eat"], "explain": "Only plants can build protein starting from a mineral.", "src": "L|so that the plant can convert carbohydrates to proteins"}, {"id": "ch01-o025", "type": "fill", "topic": "1.2", "source": "opus", "q": "The quantity of a crop that a farmer harvests is called the ____.", "answer": ["yield"], "explain": "Yield is the amount harvested, which fertiliser is meant to increase.", "src": "L|Yield is the quantity of crop that the farmer harvests."}, {"id": "ch01-o026", "type": "short", "topic": "1.2", "source": "opus", "q": "Sofia adds different numbers of fertiliser grains to five dishes of duckweed. Name her independent variable and give three variables she must keep the same.", "answer": "The independent variable is the quantity of fertiliser. She must keep the same the number of duckweed plants, the volume of water, the light intensity and the temperature.", "keywords": ["quantity of fertiliser", "volume of water", "light"], "explain": "Only the fertiliser may change; everything else that could affect growth is controlled.", "src": "W|Which variable does Sofia change in her experiment?"}, {"id": "ch01-o027", "type": "short", "topic": "1.2", "source": "opus", "q": "In Sofia's duckweed experiment, dish E had the most fertiliser and ended with no plants. Explain what this shows.", "answer": "Extra nitrate helps duckweed grow, but too much fertiliser harms the plants and stops them growing altogether.", "keywords": ["too much", "stops", "growing"], "explain": "The result at the highest dose is what limits her conclusion.", "src": "W|But too much nitrate fertiliser stops them growing."}, {"id": "ch01-o028", "type": "short", "topic": "1.2", "source": "opus", "q": "Sofia adds different numbers of fertiliser grains to five dishes of duckweed and counts the plants after two weeks. Suggest one way she could improve this experiment, and explain why it would help.", "answer": "She should use three sets of dishes for each quantity of fertiliser. Repeating and taking a mean makes the results more reliable and lets her spot anomalous dishes.", "keywords": ["three sets", "repeat", "reliable"], "explain": "Repeats are the standard improvement when each condition was tested only once.", "src": "W|Use three sets of dishes for each quantity of fertiliser."}, {"id": "ch01-o029", "type": "short", "topic": "1.2", "source": "opus", "q": "In the floating disc experiment, explain why bubbles of gas form on the underside of the leaf disc.", "answer": "The stomata are mostly in the lower epidermis, so the oxygen made in photosynthesis leaves the disc through the underside and collects there as bubbles.", "keywords": ["stomata", "lower", "oxygen"], "explain": "Gas leaves where the holes are.", "src": "W|Little bubbles appear on the underside of the leaf disc."}, {"id": "ch01-o030", "type": "short", "topic": "1.2", "source": "opus", "q": "Leaf discs rise in about 12 seconds in bright light but about 70 seconds in dim light. Write a conclusion and explain it.", "answer": "Leaf discs rise faster in brighter light, so photosynthesis is faster in brighter light. More light means more oxygen is made per second, so the bubbles that make the disc float form more quickly.", "keywords": ["faster", "brighter", "oxygen"], "explain": "Time to float is an indirect measure of the rate of oxygen production.", "src": "W|Sofia and Zara record the time taken for the leaf disc to float to the surface"}, {"id": "ch01-o031", "type": "mcq", "topic": "1.3", "source": "opus", "q": "Which of these is the word equation for respiration?", "options": ["water + carbon dioxide -> glucose + oxygen", "glucose + oxygen -> carbon dioxide + water", "carbon dioxide + oxygen -> glucose + water", "glucose + water -> carbon dioxide + oxygen"], "answer": 1, "explain": "Respiration is the reverse of photosynthesis: glucose and oxygen in, carbon dioxide and water out.", "src": "L|glucose + oxygen -> carbon dioxide + water"}, {"id": "ch01-o032", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why plants give out carbon dioxide at night but not usually during the day.", "answer": "Plants respire all the time, which releases carbon dioxide. In daylight they also photosynthesise, and photosynthesis uses carbon dioxide faster than respiration makes it, so overall they take it in. At night they cannot photosynthesise, so only respiration happens and carbon dioxide is released.", "keywords": ["respire", "photosynthesise", "night"], "explain": "It is the balance of the two processes that decides the net direction.", "src": "L|At night, when they cannot photosynthesise, they give out carbon dioxide"}, {"id": "ch01-o033", "type": "short", "topic": "1.3", "source": "opus", "q": "In the hydrogencarbonate indicator investigation, predict the colour in a tube holding a water plant in the light, and explain your prediction.", "answer": "It turns purple. In the light the plant photosynthesises faster than it respires, so it removes carbon dioxide from the solution and the indicator shows no carbon dioxide.", "keywords": ["purple", "photosynthesis", "used up"], "explain": "Purple means no carbon dioxide left.", "src": "L|purple when there is no carbon dioxide"}, {"id": "ch01-o034", "type": "short", "topic": "1.3", "source": "opus", "q": "In the hydrogencarbonate indicator investigation, why was a small platform put into every tube, even the tubes with no animals?", "answer": "So that all six tubes were identical apart from what was being tested. If only some tubes had platforms, the platform itself could be the reason for a difference in the results.", "keywords": ["same", "control", "fair"], "explain": "It is a control variable, not a piece of apparatus the animals needed in every tube.", "src": "L|The platforms will stop the animals from falling into the liquid."}, {"id": "ch01-o035", "type": "mcq", "topic": "1.3", "source": "opus", "q": "Hydrogencarbonate indicator turns yellow in a tube. What does this show?", "options": ["There is no carbon dioxide", "There is a low concentration of carbon dioxide", "There is a higher concentration of carbon dioxide", "There is no oxygen"], "answer": 2, "explain": "Purple means none, red means low, yellow means higher.", "src": "L|yellow when there is a higher concentration of carbon dioxide"}, {"id": "ch01-o036", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain how the bodies of dead organisms become fossil fuels.", "answer": "They fall into places with no oxygen, such as a peat bog or the deep ocean, so decomposers cannot respire and break them down. Sediment buries the remains, and high pressure and heat gradually change them into coal, oil or natural gas.", "keywords": ["no oxygen", "buried", "pressure"], "explain": "The key condition is the lack of oxygen that stops decomposition.", "src": "L|High pressure and heat change their remains into fossil fuels"}, {"id": "ch01-o037", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why fossil fuels are described as non-renewable resources.", "answer": "They took hundreds of millions of years to form from dead organisms, but we are burning them within a few hundred years. They are being used far faster than they can be replaced.", "keywords": ["millions of years", "replaced", "faster"], "explain": "Non-renewable is about the rate of formation compared with the rate of use.", "src": "L|Most of the fossil fuels that we use on Earth today were formed hundreds of millions of years ago."}, {"id": "ch01-o038", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain the difference between a fossil and a fossil fuel.", "answer": "A fossil is the remains or traces of an organism that have turned to rock, and you can still see the organism's shape. Fossil fuels do not look like organisms at all, and oil and gas are not even rocks. They are only called fossil because they formed long ago and were buried.", "keywords": ["shape", "rock", "buried"], "explain": "The name is about age and burial, not about preserving a shape.", "src": "L|A fossil is the remains of an organism, or traces of it"}, {"id": "ch01-o039", "type": "fill", "topic": "1.3", "source": "opus", "q": "When we burn a fossil fuel, the carbon in it combines with oxygen from the air and forms carbon dioxide. This process is called ____.", "answer": ["combustion", "burning"], "explain": "Combustion is the arrow that returns fossil carbon to the air.", "src": "L|the carbon in it combines with oxygen from the air and forms carbon dioxide. This is called combustion."}, {"id": "ch01-o040", "type": "short", "topic": "1.3", "source": "opus", "q": "In a food chain, the arrows show energy passing between organisms. Explain whether they also show carbon atoms passing along.", "answer": "Yes. The energy is stored in carbohydrates, fats and proteins, and all of these compounds contain carbon atoms. So when one organism eats another, carbon atoms move along the arrow with the energy.", "keywords": ["carbon atoms", "compounds", "feeding"], "explain": "Energy and carbon travel together because the energy is held in carbon compounds.", "src": "L|Carbohydrates, proteins and fats are all compounds that contain carbon."}, {"id": "ch01-o041", "type": "short", "topic": "1.3", "source": "opus", "q": "Describe two differences between a carbon cycle drawn before humans existed and the one drawn today.", "answer": "There would be almost no combustion of fossil fuels, so no large arrow returning fossil carbon to the air. The amount of carbon dioxide in the atmosphere would stay roughly steady instead of rising, because the carbon removed by photosynthesis and fossil fuel formation would balance the carbon returned by respiration.", "keywords": ["combustion", "fossil fuels", "balance"], "explain": "Human combustion is the arrow that unbalances the cycle.", "src": "L|We can add the formation and combustion of fossil fuels to the flow diagram."}, {"id": "ch01-o042", "type": "mcq", "topic": "1.4", "source": "opus", "q": "Which two gases are named in the topic as greenhouse gases?", "options": ["Oxygen and nitrogen", "Carbon dioxide and methane", "Carbon dioxide and oxygen", "Methane and nitrogen"], "answer": 1, "explain": "Both trap heat energy in the atmosphere.", "src": "L|Carbon dioxide and methane are 'greenhouse gases'."}, {"id": "ch01-o043", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why the Earth would be a frozen place with no carbon dioxide in the atmosphere at all.", "answer": "Carbon dioxide is a greenhouse gas that traps heat energy near the surface. With none at all, that heat would escape to space and the Earth would be too cold to support life.", "keywords": ["greenhouse", "traps heat", "cold"], "explain": "The greenhouse effect itself is not the problem; having too much of it is.", "src": "L|the Earth would be a frozen place, unable to support life"}, {"id": "ch01-o044", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain how burning fossil fuels increases the carbon dioxide concentration of the atmosphere.", "answer": "Carbon taken out of the air by photosynthesis long ago was locked into fossil fuels and stayed buried for millions of years. Extracting and burning them releases that carbon back into the air as carbon dioxide, much faster than it can be removed again.", "keywords": ["buried", "released", "carbon dioxide"], "explain": "Combustion short-circuits a store that took millions of years to fill.", "src": "L|we release the carbon in them back into the air, in the form of carbon dioxide"}, {"id": "ch01-o045", "type": "short", "topic": "1.4", "source": "opus", "q": "Describe what is meant by 'snowball Earth' and say why some scientists prefer to call it 'slushball Earth'.", "answer": "About 650 million years ago the whole Earth appears to have been covered with ice and snow. Some scientists say slushball because they are not certain everything was completely frozen; slush is melting ice.", "keywords": ["covered", "ice", "not certain"], "explain": "The two names reflect genuine scientific uncertainty.", "src": "L|because they are not sure whether everything was completely frozen"}, {"id": "ch01-o046", "type": "short", "topic": "1.4", "source": "opus", "q": "Outline three ways an asteroid collision would make it difficult for plants and animals to survive.", "answer": "Dust in the air blocked sunlight, so plants could not photosynthesise and died. Animals then had less food, so food chains were disrupted. Less heat from the Sun reached the surface, so the Earth became much colder.", "keywords": ["dust", "photosynthesise", "colder"], "explain": "The chain runs from dust, to failed photosynthesis, to starvation and cold.", "src": "L|The dust in the air meant that less light reached the Earth's surface."}, {"id": "ch01-o047", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain what is meant by a mass extinction, using the asteroid collision as an example.", "answer": "A mass extinction is when a very large proportion of the species alive at the time die out over a short period. Up to 75% of all species on Earth are thought to have become extinct because of that asteroid collision.", "keywords": ["large proportion", "species", "die out"], "explain": "The scale is what makes it a mass extinction rather than ordinary extinction.", "src": "L|Up to 75% of all the species on Earth that were alive at that time"}, {"id": "ch01-o048", "type": "mcq", "topic": "1.4", "source": "opus", "q": "What is the correct name for a meteoroid that has entered the Earth's atmosphere but has not reached the ground?", "options": ["An asteroid", "A meteor", "A meteorite", "A comet"], "answer": 1, "explain": "Meteoroid in space, meteor in the atmosphere, meteorite on the ground.", "src": "L|When meteoroids enter Earth's atmosphere they are called meteors."}, {"id": "ch01-o049", "type": "fill", "topic": "1.4", "source": "opus", "q": "The parts of meteoroids that do collide with Earth are called ____.", "answer": ["meteorites", "meteorite"], "explain": "About 500 of them reach the Earth's surface each year.", "src": "L|The parts of meteoroids that do collide with Earth are called meteorites."}, {"id": "ch01-o050", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why an asteroid passing further from Earth may be a greater risk than one passing closer.", "answer": "Scientists judge risk from both the closest approach and the mass or diameter of the object. A much more massive asteroid would cause far more damage if it did hit, so it can be the greater risk even though it passes further away.", "keywords": ["mass", "diameter", "damage"], "explain": "Risk combines how likely an impact is with how bad it would be.", "src": "L|An asteroid passing further from Earth may be a greater risk than one passing closer if its mass is greater."}, {"id": "ch01-o051", "type": "short", "topic": "1.4", "source": "opus", "q": "Give two reasons why sea level is rising, and say which one the conical flask experiment demonstrates.", "answer": "Water expands as it is heated, so warmer sea water takes up more space, and melting ice caps and glaciers on land add extra water to the oceans. The conical flask experiment demonstrates the expansion of water when it is heated.", "keywords": ["expands", "melting", "glaciers"], "explain": "The flask has no ice in it, so it can only show thermal expansion.", "src": "L|Water expands as it is heated, so if the sea temperature increases, sea level rises."}, {"id": "ch01-o052", "type": "short", "topic": "1.4", "source": "opus", "q": "Sea level is rising at about 3 mm per year. Calculate the rise expected by the end of this century and show your working.", "answer": "3 mm per year multiplied by about 100 years gives about 300 mm, which is 30 cm.", "keywords": ["300", "mm", "100 years"], "explain": "A rate multiplied by a time gives the total change.", "src": "L|Sea level has been rising at a rate of about 3 mm per year."}, {"id": "ch01-o053", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why scientists cannot say for certain that a single storm such as cyclone Idai was caused by climate change.", "answer": "Storms like this have always happened, and the number of big storms varies a lot from year to year. So one storm on its own is not evidence; only a change in the long-term pattern would be.", "keywords": ["variation", "always happened", "pattern"], "explain": "Climate is a long-term pattern, so it cannot be read from one event.", "src": "L|It is difficult to be certain, because there has always been a lot of variation each year"}, {"id": "ch01-o054", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why less predictable rainfall makes life difficult for farmers.", "answer": "Farmers choose crops and decide when to sow and harvest based on the usual pattern of rainfall. If the rains come late, fail completely, or fall too heavily and cause flooding, the harvest can be lost.", "keywords": ["sow", "harvest", "pattern"], "explain": "Farming depends on the climate being predictable, not just on it being warm or wet.", "src": "L|Knowing this helps people to choose the best crops to grow"}, {"id": "ch01-o055", "type": "mcq", "topic": "1.1", "source": "opus", "q": "Arun collects 18.3 cm3 of gas next to a window, 7.2 cm3 in a shady corner and almost none in a dark cupboard. What conclusion can he make?", "options": ["Plants need chlorophyll for photosynthesis", "Plants photosynthesise faster when they have more light", "Plants use water for photosynthesis", "Water plants photosynthesise more slowly than land plants"], "answer": 1, "explain": "The only variable he changed was the amount of light, so only a conclusion about light is supported.", "src": "W|Plants photosynthesise faster when they have more light."}, {"id": "ch01-o056", "type": "short", "topic": "1.1", "source": "opus", "q": "Marcus shines red, blue, green and colourless light on pondweed and counts bubbles. Name his independent and dependent variables and give three variables he should control.", "answer": "The independent variable is the colour of the light. The dependent variable is the number of bubbles produced in one minute. He should keep the same the type and mass of pondweed, the temperature, the distance and brightness of the lamp, and the volume of water.", "keywords": ["colour of light", "number of bubbles", "temperature"], "explain": "Naming the variables correctly is worth marks on its own in Checkpoint papers.", "src": "W|What was the variable that Marcus changed in his experiment?"}, {"id": "ch01-o057", "type": "short", "topic": "1.1", "source": "opus", "q": "Marcus records these bubble counts: red 10, 12, 11; blue 8, 12, 10; green 4, 5, 6; colourless 11, 13, 12. Write a conclusion from his results.", "answer": "The plant photosynthesises fastest in colourless light and slowest in green light. Red and blue light give a faster rate than green, so green light is absorbed least well by the plant.", "keywords": ["green", "slowest", "colourless"], "explain": "Green light is reflected by chlorophyll, which is why the leaf looks green and why green light works worst.", "src": "W|red - 10, 12, 11 blue - 8, 12, 10 green - 4, 5, 6 colourless - 11, 13, 12"}, {"source": "nblm", "topic": "1.1", "src": "L|All the energy in all the food in the world comes from plants.", "explain": "Plants capture sunlight during photosynthesis, and this energy is passed along food chains to all other organisms.", "type": "mcq", "q": "Where does all the energy in the food in the world originally come from?", "options": ["From animals eating other plants", "From nutrients found deep in the soil", "From the heat of the Earth's core", "From sunlight captured by plants"], "answer": 3, "id": "ch01-n010"}, {"source": "nblm", "topic": "1.2", "src": "L|Farmers add fertiliser to their fields because it makes the crops grow larger and produce a higher yield.", "explain": "Fertilisers provide missing minerals that plants need to reach their full growth potential.", "type": "mcq", "q": "Why do farmers add fertiliser to their fields?", "options": ["To increase the amount of carbon dioxide in the soil.", "To make crops grow larger and produce a higher yield.", "To stop plants from making too much starch.", "To kill weeds and pests that eat crops."], "answer": 1, "id": "ch01-n018"}, {"source": "nblm", "topic": "1.2", "src": "L|A stoma (plural: stomata) is a tiny hole in the lower epidermis.", "explain": "Stomata are pores mostly located in the lower epidermis of the leaf.", "type": "mcq", "q": "Where are the stomata most commonly found on a leaf?", "options": ["On the upper surface", "On the lower surface", "Inside the veins", "In the waxy layer"], "answer": 1, "id": "ch01-n022"}, {"source": "nblm", "topic": "1.3", "src": "L|We are animals, so we get all of these carbon-containing nutrients when we eat plants or other animals.", "explain": "Animals are consumers and get all their nutrients, including carbon compounds, from their food.", "type": "mcq", "q": "How do animals obtain the carbon-containing compounds they need?", "options": ["By absorbing carbon dioxide through their skin.", "By breathing in carbon dioxide from the air.", "By eating plants or other animals.", "By producing them during respiration."], "answer": 2, "id": "ch01-n025"}, {"source": "nblm", "topic": "1.3", "src": "L|When you breathe out, carbon dioxide that was produced in your cells, by respiration, goes into the air", "explain": "Respiration breaks down glucose to release energy, producing carbon dioxide as a waste product.", "type": "mcq", "q": "Which process returns carbon dioxide to the air from all living organisms?", "options": ["Photosynthesis", "Feeding", "Respiration", "Fossilisation"], "answer": 2, "id": "ch01-n026"}, {"source": "nblm", "topic": "1.3", "src": "L|In the light, plants photosynthesise faster than they respire.", "explain": "In the light, plants use up carbon dioxide for photosynthesis faster than they produce it by respiration.", "type": "mcq", "q": "If a water plant and maggots are kept together in a sealed tube in the light, what will happen to the carbon dioxide concentration?", "options": ["It will increase because both respire and photosynthesis stops.", "It will decrease or stay low because the plant photosynthesises faster than they respire.", "It will increase because photosynthesis produces carbon dioxide.", "It will not change because maggots do not respire."], "answer": 1, "id": "ch01-n028"}, {"source": "nblm", "topic": "1.4", "src": "L|Carbon dioxide is a greenhouse gas, which traps heat energy in the atmosphere and keeps the Earth warm.", "explain": "Greenhouse gases act like a blanket, trapping heat near the Earth's surface.", "type": "mcq", "q": "Why is carbon dioxide called a greenhouse gas?", "options": ["It helps plants grow rapidly in greenhouses.", "It traps heat energy in the atmosphere and keeps the Earth warm.", "It reflects all sunlight away from the Earth.", "It is a green gas that makes up the atmosphere."], "answer": 1, "id": "ch01-n033"}, {"source": "nblm", "topic": "1.1", "src": "L|photosynthesis means ‘making with light’", "explain": "The book says: photosynthesis means ‘making with light’", "type": "fill", "q": "The word photosynthesis means ‘making with ____’.", "answer": ["light"], "id": "ch01-n041"}, {"source": "nblm", "topic": "1.2", "src": "L|A vein carries water to the cells in the leaf.", "explain": "The book says: A vein carries water to the cells in the leaf.", "type": "fill", "q": "Inside a leaf, a ____ carries water to the cells.", "answer": ["vein", "veins"], "id": "ch01-n052"}, {"source": "nblm", "topic": "1.2", "src": "L|Magnesium is needed to make the green pigment, chlorophyll.", "explain": "The book says: Magnesium is needed to make the green pigment, chlorophyll.", "type": "fill", "q": "Plants need the mineral ____ to make the green pigment chlorophyll.", "answer": ["magnesium"], "id": "ch01-n054"}, {"source": "nblm", "topic": "1.3", "src": "L|it is another form of the element carbon, called graphite.", "explain": "The book says: it is another form of the element carbon, called graphite.", "type": "fill", "q": "The 'lead' in a pencil is actually a form of the element carbon called ____.", "answer": ["graphite"], "id": "ch01-n057"}, {"source": "nblm", "topic": "1.3", "src": "L|Decomposers get their carbon when they break down waste products from plants and animals.", "explain": "The book says: Decomposers get their carbon when they break down waste products from plants and animals.", "type": "fill", "q": "____ get their carbon when they break down waste products from plants and animals.", "answer": ["Decomposers"], "id": "ch01-n059"}, {"source": "nblm", "topic": "1.1", "src": "L|move the lamp a little bit further away from the test tube. Measure the new distance.", "explain": "A marker looks for: distance, lamp, further away", "type": "short", "q": "In the experiment investigating how light intensity affects the rate of photosynthesis, describe how to change the independent variable.", "answer": "You change the amount of light by moving the lamp a little bit further away from the test tube and measuring the new distance.", "keywords": ["distance", "lamp", "further away"], "id": "ch01-n072"}, {"source": "nblm", "topic": "1.3", "src": "L|yellow when there is a higher concentration of carbon dioxide", "explain": "A marker looks for: yellow, higher concentration, carbon dioxide", "type": "short", "q": "Predict the colour of the hydrogencarbonate indicator in a sealed tube containing only maggots after 30 minutes.", "answer": "The indicator will turn yellow because the maggots respire and release a higher concentration of carbon dioxide into the tube.", "keywords": ["yellow", "higher concentration", "carbon dioxide"], "id": "ch01-n076"}, {"source": "nblm", "topic": "1.2", "src": "L|You could measure how much the duckweed grows by counting the number of leaves.", "explain": "A marker looks for: counting, number of leaves, plants", "type": "short", "q": "A student investigates how adding different amounts of nitrate fertiliser affects duckweed growth. Describe what the student should measure to record the dependent variable.", "answer": "The student should measure how much the duckweed grows by counting the number of leaves or the number of plants at the end of the experiment.", "keywords": ["counting", "number of leaves", "plants"], "id": "ch01-n077"}, {"source": "nblm", "topic": "1.1", "src": "L|oxygen first began to collect in the air when bacteria first began to photosynthesise.", "explain": "A marker looks for: oxygen, respiration, bacteria", "type": "short", "q": "Suggest why animals would not be able to survive if bacteria had not begun to photosynthesise billions of years ago.", "answer": "Animals need oxygen for respiration, and the Earth's atmosphere had almost no oxygen until bacteria first began to release it as a waste product of photosynthesis.", "keywords": ["oxygen", "respiration", "bacteria"], "id": "ch01-n079"}, {"source": "nblm", "topic": "1.3", "src": "L|As they break down waste products from plants and animals, they release carbon dioxide into the air.", "explain": "A marker looks for: break down, waste, respire, release", "type": "short", "q": "Explain how decomposers return carbon dioxide to the air.", "answer": "As decomposers break down waste products and dead bodies from plants and animals, they respire and release carbon dioxide as a waste product.", "keywords": ["break down", "waste", "respire", "release"], "id": "ch01-n082"}, {"source": "nblm", "topic": "1.2", "src": "L|A stoma (plural: stomata) is a tiny hole in the lower epidermis.", "explain": "A marker looks for: stomata, lower epidermis, diffuse", "type": "short", "q": "Suggest why the bubbles of gas produced by a fresh leaf submerged in warm water mostly come from the lower surface.", "answer": "The lower epidermis of a leaf contains the majority of the tiny holes called stomata, which allow gases to easily diffuse out.", "keywords": ["stomata", "lower epidermis", "diffuse"], "id": "ch01-n088"}, {"source": "nblm", "topic": "1.4", "src": "W|Thinking about plants and photosynthesis, suggest why the line wiggles up and down each year.", "explain": "A marker looks for: photosynthesise, summer, winter, carbon dioxide", "type": "short", "q": "Measurements of the carbon dioxide concentration in the northern hemisphere rise and fall in a regular cycle every year. Suggest why.", "answer": "Plants photosynthesise much faster during the summer when there is more light, taking in more carbon dioxide from the air, and photosynthesise less in the winter.", "keywords": ["photosynthesise", "summer", "winter", "carbon dioxide"], "id": "ch01-n090"}, {"source": "nblm", "topic": "1.2", "src": "L|When animals eat food, they get some of the energy that was captured by plants.", "explain": "A marker looks for: energy, passed along, food chain, plants", "type": "short", "q": "Explain how a lizard relies on photosynthesis to provide it with energy, even though it only eats insects like grasshoppers.", "answer": "Grasshoppers get their energy by eating plants, which capture energy from sunlight through photosynthesis, and this chemical energy is passed along the food chain to the lizard.", "keywords": ["energy", "passed along", "food chain", "plants"], "id": "ch01-n078"}, {"source": "nblm", "topic": "1.2", "src": "L|These are needed so that the plant can convert carbohydrates to proteins.", "explain": "A marker looks for: nitrogen, convert carbohydrates, proteins", "type": "short", "q": "Explain why plants need to absorb nitrate from the soil to grow well.", "answer": "Nitrate contains nitrogen atoms, which are needed so the plant can convert carbohydrates into the proteins that are essential for making new cells.", "keywords": ["nitrogen", "convert carbohydrates", "proteins"], "id": "ch01-n081"}, {"source": "nblm", "topic": "1.3", "src": "L|we get all of these carbon-containing nutrients when we eat plants or other animals.", "explain": "A marker looks for: consuming, nutrients, compounds, carbon", "type": "short", "q": "Suggest why the arrows in a food chain representing energy passing from one organism to the next also show how carbon atoms pass along.", "answer": "Animals get their energy by consuming carbohydrates, fats, and proteins from other organisms, and all of these nutrients are compounds that contain carbon atoms.", "keywords": ["consuming", "nutrients", "compounds", "carbon"], "id": "ch01-n083"}, {"source": "nblm", "topic": "1.4", "src": "L|The parts of meteoroids that do collide with Earth are called meteorites.", "explain": "A marker looks for: space, collide, Earth's surface", "type": "short", "q": "Describe the difference between a meteoroid and a meteorite.", "answer": "Meteoroids are objects traveling in space, while meteorites are the parts of meteoroids that do not burn up and actually collide with the Earth's surface.", "keywords": ["space", "collide", "Earth's surface"], "id": "ch01-n084"}, {"source": "nblm", "topic": "1.3", "src": "L|Changing dead organisms to fossil fuels takes a very long time.", "explain": "A marker looks for: millions of years, form, long time", "type": "short", "q": "Explain why fossil fuels are considered non-renewable resources.", "answer": "Fossil fuels take hundreds of millions of years to form from the remains of buried dead organisms, so they cannot be replaced quickly once we burn them.", "keywords": ["millions of years", "form", "long time"], "id": "ch01-n089"}, {"id": "qwen-01-01", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What are the two products made during photosynthesis?", "explain": "The text states that two new substances are made in the reaction: glucose and oxygen.", "src": "L|These are glucose and oxygen.", "options": ["Glucose and oxygen", "Carbon dioxide and water", "Starch and light", "Chlorophyll and glucose"], "answer": 0}, {"id": "qwen-01-05", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What is the word equation for photosynthesis?", "explain": "The text provides the specific word equation for photosynthesis.", "src": "L|water + carbon dioxide → glucose + oxygen", "options": ["Glucose + oxygen → water + carbon dioxide", "Water + carbon dioxide → glucose + oxygen", "Light + chlorophyll → water + carbon dioxide", "Starch + oxygen → glucose + light"], "answer": 1}, {"id": "qwen-01-08", "type": "fill", "topic": "1.2", "source": "qwen", "q": "The part of the plant cell where photosynthesis happens is called a ____.", "explain": "The text states that photosynthesis happens inside chloroplasts.", "src": "L|photosynthesis happens inside chloroplasts", "answer": ["chloroplast"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What happens to a glowing splint if it is placed in the gas produced by photosynthesis?", "explain": "The text says if the gas contains oxygen, the splint will relight.", "src": "L|the splint will relight", "options": ["It goes out", "It relights", "It turns blue", "It burns brighter immediately"], "answer": 1}, {"id": "qwen-01-10", "type": "fill", "topic": "1.2", "source": "qwen", "q": "The layer of cells in a leaf that does most of the photosynthesis is the ____ layer.", "explain": "The text identifies the palisade layer as doing most of the photosynthesis.", "src": "L|palisade layer contains cells that do most", "answer": ["palisade"]}, {"id": "qwen-01-11", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What is the main source of energy for photosynthesis?", "explain": "The text states plants get energy from sunlight.", "src": "L|energy, which they get from sunlight", "options": ["Soil nutrients", "Sunlight", "Water from roots", "Air pressure"], "answer": 1}, {"id": "qwen-01-12", "type": "fill", "topic": "1.2", "source": "qwen", "q": "A waxy layer on the leaf surface stops the cells from ____ out.", "explain": "The text states the waxy layer stops leaf cells from drying out.", "src": "L|stops the leaf cells from drying out", "answer": ["drying"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "What is the main reason a plant with low magnesium levels cannot grow well?", "explain": "The text states that without magnesium, plants have little chlorophyll to absorb energy from sunlight, so they cannot photosynthesise as much as they should.", "src": "L|It cannot grow well, because it does not have much chlorophyll to absorb energy from sunlight", "options": ["It cannot make enough chlorophyll to absorb sunlight", "It lacks nitrogen for making proteins", "Its roots cannot take in water from the soil", "The leaves become too heavy to support"], "answer": 0}, {"id": "qwen-02-02", "type": "fill", "topic": "1.2", "source": "qwen", "q": "Plants need nitrate to convert carbohydrates into ____, which are essential for making new cells.", "explain": "The text explains that nitrogen atoms in nitrate are needed so the plant can convert carbohydrates to proteins for new cell growth.", "src": "L|These are needed so that the plant can convert carbohydrates to proteins", "answer": ["proteins"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "How do farmers use GPS technology when adding fertiliser to a field?", "explain": "The text says farmers can use GPS to see where they are and control how much fertiliser is added in each part of the field.", "src": "L|The farmer can easily control how much fertiliser is added in each part of the field", "options": ["To measure the temperature of the soil", "To control how much fertiliser is added in each part of the field", "To predict the weather for the next week", "To count the number of crops in the field"], "answer": 1}, {"id": "qwen-02-04", "type": "fill", "topic": "1.3", "source": "qwen", "q": "Organisms cannot use carbon in the form of an element; they can only use it when it is part of a ____.", "explain": "The text states that organisms cannot use carbon as an element but can only use it when it is part of a compound.", "src": "L|They can only use it when it is part of a compound", "answer": ["compound"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "Which of the following is a compound that contains carbon atoms and is made by plants during photosynthesis?", "explain": "The text explains that plants take carbon dioxide from the air and use it in photosynthesis to make carbohydrates.", "src": "L|Plants take carbon dioxide from the air and use it in photosynthesis to make carbohydrates", "options": ["Oxygen", "Water", "Carbohydrates", "Nitrogen"], "answer": 2}, {"id": "qwen-02-06", "type": "fill", "topic": "1.3", "source": "qwen", "q": "When we burn a fossil fuel, the carbon in it combines with oxygen to form ____, a process called combustion.", "explain": "The text states that when we burn a fossil fuel, the carbon combines with oxygen from the air and forms carbon dioxide.", "src": "L|the carbon in it combines with oxygen from the air and forms carbon dioxide", "answer": ["carbon dioxide"]}, {"id": "qwen-02-07", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "Why do decomposers not break down organisms quickly in places like peat bogs or deep oceans?", "explain": "The text explains that in places with no oxygen, decomposers cannot respire, so the bodies get buried instead of being broken down quickly.", "src": "L|In these places, the decomposers cannot respire, because there is not enough oxygen for them", "options": ["The temperature is too high", "There is not enough oxygen for them to respire", "The pressure is too low", "The light levels are too bright"], "answer": 1}, {"id": "qwen-02-08", "type": "fill", "topic": "1.3", "source": "qwen", "q": "Fossil fuels are formed from the remains of dead organisms that were buried and changed by high ____ and heat.", "explain": "The text states that high pressure and heat change the remains of buried organisms into fossil fuels.", "src": "L|High pressure and heat change their remains into fossil fuels", "answer": ["pressure"]}, {"id": "qwen-02-09", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "What is the difference between a fossil and a fossil fuel?", "explain": "The text clarifies that a fossil is the remains or traces of an organism turned to rock, whereas fossil fuels do not look like organisms and are formed from buried remains.", "src": "L|A fossil is the remains of an organism, or traces of it (such as its burrows) that have turned to rock", "options": ["Fossils are made of carbon, but fossil fuels are not", "A fossil is the remains or traces of an organism turned to rock, while fossil fuels do not keep the shape of the organism", "Fossil fuels are found only in the ocean, while fossils are found on land", "Fossils form quickly, but fossil fuels take millions of years to form"], "answer": 1}, {"id": "qwen-02-10", "type": "fill", "topic": "1.3", "source": "qwen", "q": "In the carbon cycle, plants take in ____ from the air during photosynthesis.", "explain": "The text states that plants take carbon dioxide from the air and use it in photosynthesis.", "src": "L|Plants take carbon dioxide from the air and use it in photosynthesis", "answer": ["carbon dioxide"]}, {"id": "qwen-02-11", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "A plant respires all the time, but at night it cannot photosynthesise. What happens to the carbon dioxide the plant produces at night?", "explain": "Plants respire all the time, day and night. In daylight photosynthesis uses carbon dioxide up faster than respiration makes it, so the plant takes carbon dioxide in. At night photosynthesis stops, so the carbon dioxide made by respiration is given out into the air, just as it is from us.", "src": "L|At night, when they cannot photosynthesise, they give out carbon dioxide, just as we do", "options": ["It is used up again straight away in photosynthesis", "It is given out into the air, because respiration continues but photosynthesis has stopped", "It is stored in the roots until the morning", "It is turned into oxygen inside the leaf"], "answer": 1}, {"id": "qwen-03-01", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "What happens to the Earth if there is no carbon dioxide in the atmosphere?", "explain": "The text states that without any carbon dioxide, the Earth would be a frozen place unable to support life.", "src": "L|Without any carbon dioxide in the atmosphere at all, the Earth would be a frozen place", "options": ["It becomes a frozen place", "It becomes too hot to live on", "The oceans evaporate completely", "Plants grow faster"], "answer": 0}, {"id": "qwen-03-02", "type": "fill", "topic": "1.4", "source": "qwen", "q": "Carbon dioxide and methane are known as ____ gases.", "explain": "The text explicitly identifies carbon dioxide and methane as greenhouse gases.", "src": "L|Carbon dioxide and methane are ‘greenhouse gases’", "answer": ["greenhouse"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "What is the name given to the period when the whole Earth was covered in ice?", "explain": "Scientists call the time when the whole Earth was covered with ice and snow 'snowball Earth'.", "src": "L|Scientists call this ‘snowball Earth’", "options": ["Ice Age", "Snowball Earth", "Slushball Period", "Frozen Era"], "answer": 1}, {"id": "qwen-03-04", "type": "fill", "topic": "1.4", "source": "qwen", "q": "The asteroid collision that killed the dinosaurs caused a mass ____.", "explain": "The text states that the asteroid caused a mass extinction of species.", "src": "L|The asteroid caused a mass extinction", "answer": ["extinction"]}, {"id": "qwen-03-05", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "What are objects in space called when they enter Earth's atmosphere?", "explain": "When meteoroids enter Earth's atmosphere, they are called meteors.", "src": "L|When meteoroids enter Earth’s atmosphere they are called meteors", "options": ["Meteorites", "Asteroids", "Meteors", "Comets"], "answer": 2}, {"id": "qwen-03-06", "type": "fill", "topic": "1.4", "source": "qwen", "q": "The parts of meteoroids that actually collide with Earth are called ____.", "explain": "The text defines meteorites as the parts of meteoroids that do collide with Earth.", "src": "L|The parts of meteoroids that do collide with Earth are called meteorites", "answer": ["meteorites"]}, {"id": "qwen-03-07", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "Why are mean temperatures on Earth increasing now?", "explain": "The text links rising mean temperatures to an increase in carbon dioxide concentration.", "src": "L|This is caused by an increase in carbon dioxide concentration", "options": ["Because the Sun is getting hotter", "Because of an increase in carbon dioxide concentration", "Because ice caps are growing larger", "Because of more volcanic eruptions"], "answer": 1}, {"id": "qwen-03-08", "type": "fill", "topic": "1.4", "source": "qwen", "q": "Higher temperatures increase the chance of extreme weather events like hurricanes and ____.", "explain": "The text lists hurricanes and typhoons as examples of extreme weather events.", "src": "L|such as hurricanes and typhoons", "answer": ["typhoons", "typhoon", "cyclones", "cyclone", "tropical storms", "tropical storm", "storms"]}, {"id": "qwen-03-10", "type": "fill", "topic": "1.4", "source": "qwen", "q": "Scientists estimate that more than 600 million people are at risk from ____ caused by sea level rise.", "explain": "The text states that people are at risk from flooding caused by sea level rise.", "src": "L|at risk from flooding caused by sea level rise", "answer": ["flooding"]}, {"id": "qwen-03-11", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "In the model of a warming ocean, which change would raise the level of the 'ocean'?", "explain": "Melting ice in the sea does not raise levels, but melting ice on land adds new water to the ocean.", "src": "L|melting ice in the sea • melting ice on the land", "options": ["Melting ice in the sea", "Melting ice on the land", "Decreasing water temperature", "Removing the lamp"], "answer": 1}, {"id": "qwen-04-06", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "Why did the farmer decide 60 kg of fertiliser was enough?", "explain": "The text notes fertiliser is expensive and the graph shows yield plateaus after 60 kg.", "src": "L|Remember that fertiliser is expensive", "options": ["Because it is the cheapest amount", "Because yield increases significantly after 60 kg", "Because adding more does not increase yield much and it is expensive", "Because the wheat dies if you add too little"], "answer": 2}, {"id": "qwen-04-08", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "Which of the following is a predicted impact of climate change mentioned in the text?", "explain": "The text lists sea level rising as a predicted impact.", "src": "L|Sea level will rise", "options": ["Sea level will rise", "The poles will get colder", "There will be less sunlight", "Asteroids will hit Earth more often"], "answer": 0}, {"id": "qwen-04-09", "type": "fill", "topic": "1.4", "source": "qwen", "q": "Scientists believe asteroid collisions have caused mass ____.", "explain": "The text states asteroids have caused mass extinctions.", "src": "L|this has caused mass extinctions", "answer": ["extinctions"]}, {"id": "qwen-04-10", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "Coal appears in the carbon cycle as a store of carbon. What does that store represent?", "explain": "Coal is a type of fossil fuel containing carbon.", "src": "L|carbon in fossil fuels", "options": ["Carbon in fossil fuels", "Carbon compounds in plants", "Carbon dioxide in the air", "Carbon compounds in animals"], "answer": 0}, {"id": "qwen-w-03", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What conclusion can Arun make from his results?", "explain": "Apparatus A (most light) had the most gas, and C (no light) had the least.", "src": "W|Plants photosynthesise faster when they have more light.", "options": ["Plants need chlorophyll for photosynthesis.", "Plants photosynthesise faster when they have more light.", "Plants use water for photosynthesis.", "Aquatic plants photosynthesise slower than land plants."], "answer": 1}, {"id": "qwen-w-04", "type": "fill", "topic": "1.1", "source": "qwen", "q": "Marcus used different pieces of cellophane to change the ____ of light in his experiment.", "explain": "The text mentions red, blue, green, and colourless cellophane.", "src": "W|red cellophane", "answer": ["colour"]}, {"id": "qwen-w-07", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "Which variable did Sofia change in her duckweed experiment?", "explain": "She added different numbers of grains to each dish.", "src": "W|quantity of fertiliser", "options": ["Number of duckweed plants", "Volume of water", "Quantity of fertiliser", "Light intensity"], "answer": 2}, {"id": "qwen-w-09", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "What colour does iodine solution turn when it reacts with starch?", "explain": "The text states that some parts of the leaf went blue-black.", "src": "W|some went blue-black", "options": ["Orange-brown", "Blue-black", "Green", "Yellow"], "answer": 1}, {"id": "qwen-w-10", "type": "fill", "topic": "1.2", "source": "qwen", "q": "In the floating discs experiment, the gas produced by photosynthesis that makes the leaf disc float is ____.", "explain": "Photosynthesis produces
