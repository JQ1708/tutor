<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chapter 5 — Properties of materials — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>

y7c05-f10h1", "type": "hotspot", "topic": "5.6", "source": "opus", "image": "img/L_p33_indicator_strips.png", "figure": "L_p33_indicator_strips", "caption": "Strips of paper soaked in universal indicator solution, then dipped into different liquids.", "q": "Click on the strip that was dipped into the most acidic liquid.", "target": {"x": 13.0, "y": 54.0, "r": 7}, "explain": "Universal indicator turns red at the acid end of the pH scale, around pH 1, so the red strip came from the most acidic liquid.", "src": "L|These strips of paper were soaked in universal indicator solution and then dried."}, {"id": "y7c05-f10h2", "type": "hotspot", "topic": "5.6", "source": "opus", "image": "img/L_p33_indicator_strips.png", "figure": "L_p33_indicator_strips", "caption": "Strips of paper soaked in universal indicator solution, then dipped into different liquids.", "q": "Click on the strip that was dipped into the most alkaline liquid.", "target": {"x": 86.0, "y": 54.0, "r": 7}, "explain": "Universal indicator turns purple at the alkaline end of the pH scale, around pH 13, so the purple strip came from the most alkaline liquid.", "src": "L|These strips of paper were soaked in universal indicator solution and then dried."}, {"id": "y7c05-o001", "type": "short", "topic": "5.1", "source": "opus", "q": "What are materials?", "answer": "The substances from which objects are made.", "keywords": ["substances", "objects", "made"], "explain": "Wood, glass, plastic, copper and steel are all materials. Chemists sort them into metals and non-metals.", "src": "L|Materials are the substances from which objects are made."}, {"id": "y7c05-o002", "type": "short", "topic": "5.1", "source": "opus", "q": "Why is iron used to build bridges?", "answer": "Because it is strong.", "keywords": ["strong"], "explain": "A bridge has to hold huge weights without breaking, so strength is the property that matters most.", "src": "L|Iron is used for bridges because it is strong."}, {"id": "y7c05-o003", "type": "short", "topic": "5.1", "source": "opus", "q": "What does it mean to say metals are strong and tough?", "answer": "They do not shatter when dropped, they do not crack easily, and they can hold large weights without breaking.", "keywords": ["shatter", "crack", "weights"], "explain": "Toughness is about not breaking when you hit or drop it; strength is about carrying a load.", "src": "L|They do not shatter when dropped and they do not crack easily."}, {"id": "y7c05-o004", "type": "short", "topic": "5.1", "source": "opus", "q": "When are metals shiny?", "answer": "When they are freshly cut or polished.", "keywords": ["freshly", "cut", "polished"], "explain": "The surface of most metals goes dull after a while, so shininess is only a fair test on a fresh surface.", "src": "L|Metals are shiny when they are freshly cut or polished."}, {"id": "y7c05-o005", "type": "short", "topic": "5.1", "source": "opus", "q": "What does malleable mean?", "answer": "It means the material can be hammered or beaten into shape.", "keywords": ["hammered", "beaten", "shape"], "explain": "Malleable comes from the Latin for hammer. Metals are malleable; solid non-metals shatter instead.", "src": "L|Metals are malleable, which means they can be hammered into shape."}, {"id": "y7c05-o006", "type": "short", "topic": "5.1", "source": "opus", "q": "What does ductile mean?", "answer": "It means the material can be drawn out into wires.", "keywords": ["drawn", "wires"], "explain": "Copper is very ductile, which is why it is used for electrical wiring.", "src": "L|Metals are ductile, which means that they can be drawn out into wires."}, {"id": "y7c05-o007", "type": "short", "topic": "5.1", "source": "opus", "q": "What word describes a material that makes a ringing sound like a bell when it is hit?", "answer": "Sonorous.", "keywords": ["sonorous"], "explain": "Cymbals and bells are made of metal alloys because metals are sonorous.", "src": "L|Metals make a ringing sound like a bell when they are hit; the word for this is sonorous."}, {"id": "y7c05-o008", "type": "short", "topic": "5.1", "source": "opus", "q": "Which metal is liquid at room temperature?", "answer": "Mercury.", "keywords": ["mercury"], "explain": "Every other metal is a solid at room temperature. Mercury melts at about -39 degrees C.", "src": "L|Mercury is the only metal that is liquid at room temperature."}, {"id": "y7c05-o009", "type": "short", "topic": "5.1", "source": "opus", "q": "What can you say about the melting points and boiling points of most metals?", "answer": "They are high - most metals do not melt easily.", "keywords": ["high", "melting", "boiling"], "explain": "This is why metals are used for cooking pans and for parts that get hot.", "src": "L|They have high melting points and high boiling points."}, {"id": "y7c05-o010", "type": "short", "topic": "5.1", "source": "opus", "q": "Why does a metal feel cold when you touch it?", "answer": "Because it is a good conductor of heat, so it conducts heat energy away from your hand.", "keywords": ["conductor", "heat", "away", "hand"], "explain": "The metal is not actually colder than the air around it. Your hand cools down, and that feels cold.", "src": "L|When you touch them they conduct heat energy away from the hand so they feel cold."}, {"id": "y7c05-o011", "type": "short", "topic": "5.1", "source": "opus", "q": "Why is steel useful for cooking pans?", "answer": "Because it conducts heat well.", "keywords": ["conducts", "heat"], "explain": "Heat from the flame passes quickly through the base of the pan and into the food.", "src": "L|Steel conducts heat well, which is useful for cooking pans."}, {"id": "y7c05-o030", "type": "short", "topic": "5.2", "source": "opus", "q": "Give two differences between the appearance of metals and non-metals.", "answer": "Metals are shiny but non-metals are dull; metals do not shatter but solid non-metals are brittle.", "keywords": ["shiny", "dull", "brittle"], "explain": "Always name the feature of both when you are asked for a difference.", "src": "L|Metals and non-metals have different properties."}, {"id": "y7c05-o031", "type": "short", "topic": "5.2", "source": "opus", "q": "A material is dull, brittle and does not conduct electricity. Is it a metal or a non-metal?", "answer": "A non-metal.", "keywords": ["non-metal"], "explain": "All three properties point the same way, which is why the conclusion is safe.", "src": "L|2 A material is dull, brittle and does not conduct electricity."}, {"id": "y7c05-o032", "type": "short", "topic": "5.2", "source": "opus", "q": "Write down two things a metal can do better than a non-metal.", "answer": "Conduct electrical energy and conduct heat energy.", "keywords": ["conduct", "electricity", "heat"], "explain": "Metals also do things non-metals cannot do at all, such as being drawn into wires.", "src": "L|4 Write down two things that a metal can do better than a non-metal."}, {"id": "y7c05-o033", "type": "short", "topic": "5.2", "source": "opus", "q": "What unusual property does mercury have for a metal?", "answer": "It is a liquid at room temperature.", "keywords": ["liquid", "room temperature"], "explain": "Every other metal is solid at room temperature, so mercury is the exception that you have to remember.", "src": "L|Mercury is the only metal that is liquid at room temperature."}, {"id": "y7c05-o034", "type": "short", "topic": "5.2", "source": "opus", "q": "Describe how you would test whether a material conducts electricity.", "answer": "Connect a cell, a lamp and wires in a circuit with a gap, and put the material in the gap using crocodile clips. If the lamp lights, the material conducts.", "keywords": ["circuit", "lamp", "lights", "conducts"], "explain": "Check the lamp works first by touching the clips together with nothing between them.", "src": "L|Does it conduct electricity?"}, {"id": "y7c05-o035", "type": "short", "topic": "5.2", "source": "opus", "q": "Why must you make good contact between the crocodile clips and the test material?", "answer": "Because a poor contact stops the current flowing, so a conductor could look like an insulator.", "keywords": ["contact", "current", "wrong result"], "explain": "A dirty or loose clip is the most common reason a test gives the wrong answer.", "src": "L|When you carry out the test make sure you have good contact between the crocodile clips and your test material."}, {"id": "y7c05-o036", "type": "short", "topic": "5.2", "source": "opus", "q": "Why should you check the lamp works before you start testing materials?", "answer": "So that you know a lamp that does not light is telling you about the material, not about a broken lamp.", "keywords": ["check", "lamp", "working"], "explain": "You test the lamp by connecting the two crocodile clips together with no material between them.", "src": "L|Before you start, check that the lamp is working by connecting the crocodile clips together with no test materials."}, {"id": "y7c05-o037", "type": "short", "topic": "5.2", "source": "opus", "q": "Name three questions you could ask to decide whether a material is a metal.", "answer": "Is it shiny or dull? Does it ring when hit? Does it conduct electricity? (Also: is it brittle, can you bend it, does it feel cold?)", "keywords": ["shiny", "ring", "conduct"], "explain": "Use several tests, because almost every single property has an exception somewhere.", "src": "L|What does the material look like?"}, {"id": "y7c05-o038", "type": "short", "topic": "5.2", "source": "opus", "q": "What does it mean to distinguish between metals and non-metals?", "answer": "It means to identify which is which.", "keywords": ["identify"], "explain": "Distinguish is the exam word for telling two things apart using evidence.", "src": "L|I can distinguish between metals and non-metals."}, {"id": "y7c05-o039", "type": "short", "topic": "5.2", "source": "opus", "q": "Substance A is a shiny liquid that conducts electricity and is toxic. Is it a metal or a non-metal, and what is it?", "answer": "A metal - it is mercury.", "keywords": ["metal", "mercury"], "explain": "It conducts electricity and is shiny, which are metal properties, and it is the only liquid metal.", "src": "W|Substance A: This is a shiny liquid."}, {"id": "y7c05-o040", "type": "short", "topic": "5.2", "source": "opus", "q": "Substance C is a transparent gas needed for respiration and does not conduct electricity. What is it?", "answer": "Oxygen, a non-metal.", "keywords": ["oxygen", "non-metal"], "explain": "A gas at room temperature that does not conduct electricity is almost certainly a non-metal.", "src": "W|It is essential for respiration in most living things."}, {"id": "y7c05-o045", "type": "short", "topic": "5.3", "source": "opus", "q": "What is an alloy?", "answer": "A mixture of metals.", "keywords": ["mixture", "metals"], "explain": "The atoms mix but do not bond together, which is why an alloy is a mixture and not a compound.", "src": "L|The properties of the alloys are different from the metals they contain."}, {"id": "y7c05-o046", "type": "short", "topic": "5.3", "source": "opus", "q": "How is an alloy made?", "answer": "By mixing different metals together and melting them.", "keywords": ["mixing", "melting"], "explain": "Once the molten metals cool, their atoms are mixed together in the solid.", "src": "L|The properties of the alloys are different from the metals they contain."}, {"id": "y7c05-o047", "type": "short", "topic": "5.3", "source": "opus", "q": "Why is an alloy a mixture rather than a compound?", "answer": "Because the atoms of the different metals mix but do not bond together.", "keywords": ["mix", "do not bond"], "explain": "In a compound the atoms are chemically joined and the substance has a fixed formula.", "src": "L|The properties of the alloys are different from the metals they contain."}, {"id": "y7c05-o048", "type": "short", "topic": "5.3", "source": "opus", "q": "What two metals is bronze made from?", "answer": "Copper and tin.", "keywords": ["copper", "tin"], "explain": "Bronze is harder than either copper or tin on their own.", "src": "L|Bronze is an alloy made by mixing copper and tin."}, {"id": "y7c05-o049", "type": "short", "topic": "5.3", "source": "opus", "q": "How does the hardness of bronze compare with copper and tin?", "answer": "Bronze is harder than either copper or tin.", "keywords": ["harder"], "explain": "This is the whole point of making an alloy: the mixture beats both of its ingredients.", "src": "L|Bronze is harder than either copper or tin."}, {"id": "y7c05-o050", "type": "short", "topic": "5.3", "source": "opus", "q": "What two elements is steel made from?", "answer": "Iron and carbon.", "keywords": ["iron", "carbon"], "explain": "Steel is an unusual alloy because carbon is a non-metal.", "src": "L|Steel is a mixture of iron and carbon."}, {"id": "y7c05-o051", "type": "short", "topic": "5.3", "source": "opus", "q": "Why is steel an unusual alloy?", "answer": "Because one of the elements in the mixture, carbon, is not a metal.", "keywords": ["carbon", "not a metal"], "explain": "Most alloys are mixtures of metals only.", "src": "L|Steel is an alloy, but an unusual one because one of the elements in the mixture is not a metal."}, {"id": "y7c05-o052", "type": "short", "topic": "5.3", "source": "opus", "q": "Why is pure iron not very useful on its own?", "answer": "Because it is not hard enough.", "keywords": ["not hard enough"], "explain": "Mixing it with carbon to form steel makes it much harder.", "src": "L|Pure iron is not hard enough to be very useful but when it is mixed with other elements to form steel it is much harder."}, {"id": "y7c05-o053", "type": "short", "topic": "5.3", "source": "opus", "q": "What is added to steel to stop it rusting, and what is this steel used for?", "answer": "Chromium and nickel are added. This stainless steel is used for cutlery.", "keywords": ["chromium", "nickel", "cutlery"], "explain": "Cutlery is washed constantly, so a steel that rusts would be useless.", "src": "L|Sometimes, chromium and nickel are also added to steel."}, {"id": "y7c05-o054", "type": "short", "topic": "5.3", "source": "opus", "q": "How are the atoms arranged in a pure metal?", "answer": "They are all the same size and arranged in regular rows.", "keywords": ["same size", "regular rows"], "explain": "Because the rows are regular, the layers can slide over one another easily.", "src": "L|In a pure metal, the atoms are all the same size and arranged in regular rows."}, {"id": "y7c05-o055", "type": "short", "topic": "5.3", "source": "opus", "q": "What happens to the layers of atoms in a pure metal when a force is applied?", "answer": "They slide over one another easily.", "keywords": ["slide", "layers"], "explain": "That sliding is what makes a metal malleable when hammered and ductile when stretched.", "src": "L|The layers can slide over one another easily."}, {"id": "y7c05-o083", "type": "short", "topic": "5.4", "source": "opus", "q": "What is a mixture?", "answer": "Different substances that are together but not combined together chemically.", "keywords": ["not combined", "chemically"], "explain": "Because they are not chemically joined, each substance keeps its own properties - and that is how you separate them.", "src": "L|Mixtures contain different substances that are not combined together chemically."}, {"id": "y7c05-o084", "type": "short", "topic": "5.4", "source": "opus", "q": "How can a mixture of iron filings and sulfur be separated?", "answer": "With a magnet, because iron is magnetic and sulfur is not.", "keywords": ["magnet", "iron", "magnetic"], "explain": "You always separate a mixture by finding a property in which the substances differ.", "src": "L|You separated the iron and sulfur in your mixture by using a magnet."}, {"id": "y7c05-o085", "type": "short", "topic": "5.4", "source": "opus", "q": "What is the general rule for separating any mixture?", "answer": "Use a difference in the properties of the substances in it.", "keywords": ["difference", "properties"], "explain": "Magnetism, solubility, boiling point and particle size are the differences used most often.", "src": "L|You used the difference in the properties of iron and sulfur to separate them."}, {"id": "y7c05-o086", "type": "short", "topic": "5.4", "source": "opus", "q": "How can copper sulfate be separated from water?", "answer": "Leave the mixture in a warm room in an evaporating dish. The water evaporates and the copper sulfate is left behind.", "keywords": ["evaporates", "left behind"], "explain": "Copper sulfate does not evaporate, so only the water leaves.", "src": "L|If it is left in a warm room, the water evaporates and leaves the copper sulfate behind in the dish."}, {"id": "y7c05-o087", "type": "short", "topic": "5.4", "source": "opus", "q": "What piece of apparatus is used to separate a mixture of two liquids?", "answer": "A condenser.", "keywords": ["condenser"], "explain": "The mixture is boiled and the vapour is cooled back to a liquid in the condenser.", "src": "L|A mixture of food dye and water can be separated by using a piece of apparatus called a condenser."}, {"id": "y7c05-o088", "type": "short", "topic": "5.4", "source": "opus", "q": "What is steam?", "answer": "Water in the gas state, formed by boiling water.", "keywords": ["gas", "boiling"], "explain": "The book is careful here: water vapour formed by boiling is called steam.", "src": "L|Water that is in the gas state is called steam when it has been formed by boiling the water."}, {"id": "y7c05-o089", "type": "short", "topic": "5.4", "source": "opus", "q": "What makes the steam turn back into liquid water in a condenser?", "answer": "Cold water circulating around the outside of the condenser cools the gas down.", "keywords": ["cold water", "cools", "condense"], "explain": "The steam loses energy to the cold water in the outer tube, so it condenses.", "src": "L|The cold water that is circulating around the outside of the condenser cools the gas down."}, {"id": "y7c05-o090", "type": "short", "topic": "5.4", "source": "opus", "q": "Where does the separated water collect?", "answer": "In the beaker at the end of the condenser.", "keywords": ["beaker"], "explain": "It runs out of the bottom end of the condenser as pure water.", "src": "L|The liquid water collects in the beaker."}, {"id": "y7c05-o091", "type": "short", "topic": "5.4", "source": "opus", "q": "What happens to the food dye while the water is being distilled?", "answer": "It stays behind in the heated container.", "keywords": ["remains", "heated container", "flask"], "explain": "The dye has a much higher boiling point, so it does not turn into a gas.", "src": "L|The food dye remains in the heated container."}, {"id": "y7c05-o092", "type": "short", "topic": "5.4", "source": "opus", "q": "Which difference in properties is used to separate food dye from water?", "answer": "They have different boiling points.", "keywords": ["different boiling points"], "explain": "Water boils at 100 degrees C; the food dye does not boil at that temperature.", "src": "L|The food dye and water have different properties that allow you to separate them – they have different boiling points."}, {"id": "y7c05-o104", "type": "short", "topic": "5.5", "source": "opus", "q": "What do foods that contain acid taste like?", "answer": "They have a sour, sharp, tangy taste.", "keywords": ["sour", "sharp", "tangy"], "explain": "Never taste a laboratory chemical to find out whether it is an acid.", "src": "L|These foods have a sour, sharp tangy taste."}, {"id": "y7c05-o105", "type": "short", "topic": "5.5", "source": "opus", "q": "Which acid do lemons and limes contain?", "answer": "Citric acid.", "keywords": ["citric acid"], "explain": "Citric acid is a weak acid, which is why the fruit is safe to eat.", "src": "L|They contain citric acid."}, {"id": "y7c05-o106", "type": "short", "topic": "5.5", "source": "opus", "q": "Name the three common laboratory acids.", "answer": "Hydrochloric acid, sulfuric acid and nitric acid.", "keywords": ["hydrochloric", "sulfuric", "nitric"], "explain": "All three are corrosive when concentrated, so their bottles carry hazard labels.", "src": "L|Common acids in the laboratory are hydrochloric acid, sulfuric acid and nitric acid."}, {"id": "y7c05-o107", "type": "short", "topic": "5.5", "source": "opus", "q": "What does corrosive mean?", "answer": "It means the substance can dissolve your skin and clothing and cause chemical burns.", "keywords": ["dissolve", "skin", "chemical burns"], "explain": "Both strong acids and strong alkalis are corrosive.", "src": "L|If strong acid gets onto your skin, it will dissolve the skin."}, {"id": "y7c05-o108", "type": "short", "topic": "5.5", "source": "opus", "q": "What happens if a strong acid gets on your skin?", "answer": "It dissolves the skin and you get a chemical burn.", "keywords": ["dissolves", "chemical burn"], "explain": "Wash it off immediately with plenty of water and tell your teacher.", "src": "L|If strong acid gets onto your skin, it will dissolve the skin."}, {"id": "y7c05-o109", "type": "short", "topic": "5.5", "source": "opus", "q": "How can an acid be made less dangerous?", "answer": "By diluting it with water.", "keywords": ["diluted", "water"], "explain": "Diluting spreads the acid through much more water, so it is far less concentrated.", "src": "L|Acids can be diluted with water."}, {"id": "y7c05-o110", "type": "short", "topic": "5.5", "source": "opus", "q": "Are dilute acids completely safe?", "answer": "No. They are still harmful and can irritate your skin and eyes.", "keywords": ["no", "harmful", "irritate"], "explain": "That is why dilute acid bottles still carry hazard warning labels.", "src": "L|Dilute acids are still harmful, they can irritate your skin and eyes."}, {"id": "y7c05-o111", "type": "short", "topic": "5.5", "source": "opus", "q": "What should you do if you spill acid?", "answer": "Wash the area with lots of water, which dilutes the acid.", "keywords": ["wash", "water", "dilutes"], "explain": "The same advice works for a spill on the bench or on your skin.", "src": "L|If you spill acid, wash the area with lots of water."}, {"id": "y7c05-o112", "type": "short", "topic": "5.5", "source": "opus", "q": "Why must you always wear eye protection when using acids?", "answer": "Because acid in the eyes causes serious damage.", "keywords": ["eye protection", "eyes"], "explain": "Eyes cannot be washed clean as easily as skin, so protection comes first.", "src": "L|Always use eye protection when using acids."}, {"id": "y7c05-o113", "type": "short", "topic": "5.5", "source": "opus", "q": "What is sodium hydroxide?", "answer": "A strong alkali - a compound of sodium, hydrogen and oxygen.", "keywords": ["strong alkali", "sodium", "hydrogen", "oxygen"], "explain": "It is found in many cleaning products, and it is corrosive.", "src": "L|Many cleaning products contain alkalis such as sodium hydroxide, which is a compound of sodium, hydrogen and oxygen."}, {"id": "y7c05-o125", "type": "short", "topic": "5.6", "source": "opus", "q": "What does an indicator do?", "answer": "It turns one colour in an acid and a different colour in an alkali.", "keywords": ["one colour", "acid", "different colour", "alkali"], "explain": "That colour change is how you tell three identical-looking liquids apart.", "src": "L|An indicator turns one colour in an acid and a different colour in an alkali."}, {"id": "y7c05-o126", "type": "short", "topic": "5.6", "source": "opus", "q": "What colour is red cabbage indicator in an acid?", "answer": "Red.", "keywords": ["red"], "explain": "Red cabbage juice is red in acids, blue in water and yellow in alkalis.", "src": "L|Red cabbage indicator turns acids red in acids, blue in water and yellow in alkalis.."}, {"id": "y7c05-o127", "type": "short", "topic": "5.6", "source": "opus", "q": "What colour is red cabbage indicator in an alkali?", "answer": "Yellow.", "keywords": ["yellow"], "explain": "In neutral water it is blue, so the three colours tell you all three types apart.", "src": "L|Red cabbage indicator turns acids red in acids, blue in water and yellow in alkalis.."}, {"id": "y7c05-o128", "type": "short", "topic": "5.6", "source": "opus", "q": "Name three plants that indicators can be made from.", "answer": "Red cabbage, blackcurrant and beetroot.", "keywords": ["red cabbage", "blackcurrant", "beetroot"], "explain": "Indicators come from brightly coloured berries, flowers and other plant parts.", "src": "L|Indicators can be made from the brightly coloured berries, flowers and other parts of plants."}, {"id": "y7c05-o129", "type": "short", "topic": "5.6", "source": "opus", "q": "How do you make an indicator from plant material?", "answer": "Cut up the plant material, crush it in a pestle and mortar, add a little ethanol, crush again, then transfer the coloured liquid to a test tube with a pipette.", "keywords": ["crush", "pestle", "ethanol", "pipette"], "explain": "Ethanol is flammable, so this is done well away from any flame.", "src": "L|Indicators can be made from the brightly coloured berries, flowers and other parts of plants."}, {"id": "y7c05-o130", "type": "short", "topic": "5.6", "source": "opus", "q": "What is litmus?", "answer": "A very common indicator, which is a dye.", "keywords": ["indicator", "dye"], "explain": "You usually use litmus paper rather than litmus solution.", "src": "L|Litmus is a very common indicator."}, {"id": "y7c05-o131", "type": "short", "topic": "5.6", "source": "opus", "q": "How is litmus paper made?", "answer": "By soaking absorbent paper in litmus solution.", "keywords": ["soaking", "absorbent paper", "solution"], "explain": "The dried paper is easier to use and store than the solution.", "src": "L|You usually use litmus paper, which is made by soaking absorbent paper in litmus solution."}, {"id": "y7c05-o132", "type": "short", "topic": "5.6", "source": "opus", "q": "What colour does litmus turn in an acid?", "answer": "Red.", "keywords": ["red"], "explain": "Blue in alkalis, purple in neutral substances.", "src": "L|Litmus turns red in acids."}, {"id": "y7c05-o133", "type": "short", "topic": "5.6", "source": "opus", "q": "What colour does litmus turn in an alkali?", "answer": "Blue.", "keywords": ["blue"], "explain": "Sodium hydroxide and calcium hydroxide both turn litmus blue.", "src": "L|Litmus turns blue in alkalis."}, {"id": "y7c05-o134", "type": "short", "topic": "5.6", "source": "opus", "q": "What colour does litmus turn in a neutral substance?", "answer": "Purple.", "keywords": ["purple"], "explain": "Water turns litmus purple, which shows that water is neutral.", "src": "L|Litmus turns purple when it is in a neutral substance."}, {"source": "nblm", "topic": "5.2", "src": "L|Many are gases at room temperature.", "explain": "Unlike metals which are solid, a large number of non-metals exist naturally as gases in the environment.", "type": "mcq", "q": "Which of the following statements is true for most non-metals but not for metals?", "options": ["They have a shiny surface.", "They are solid at room temperature.", "Many are gases at room temperature.", "They conduct heat energy well."], "answer": 2, "id": "y7c05-n005"}, {"source": "nblm", "topic": "5.3", "src": "L|They don’t use pure iron because it is not strong enough.", "explain": "Pure iron is relatively soft, so it is mixed with carbon to make a stronger, more useful alloy called steel for construction.", "type": "mcq", "q": "Why do people use steel to build bridges instead of pure iron?", "options": ["Pure iron is too brittle and snaps easily.", "Pure iron is an insulator and cannot conduct electricity.", "Pure iron is not strong enough to be useful.", "Pure iron is too light and would blow away."], "answer": 2, "id": "y7c05-n010"}, {"source": "nblm", "topic": "5.6", "src": "L|How acidic or alkaline a substance is.", "explain": "The pH scale uses numbers and colours from a universal indicator to determine the strength of an acid or an alkali.", "type": "mcq", "q": "What does the pH scale measure?", "options": ["How much heat energy a metal can conduct.", "How fast a mixture can be separated by a condenser.", "How acidic or alkaline a substance is.", "How much carbon is mixed into an iron alloy."], "answer": 2, "id": "y7c05-n015"}, {"source": "nblm", "topic": "5.3", "src": "L|a different sized atom disrupts the regular pattern", "explain": "The book says: a different sized atom disrupts the regular pattern", "type": "fill", "q": "In an alloy, a different sized atom ____ the regular pattern so the atoms cannot slip past one another easily.", "answer": ["disrupts"], "id": "y7c05-n021"}, {"source": "nblm", "topic": "5.5", "src": "L|Lemons and limes taste sour. They contain citric acid.", "explain": "The book says: Lemons and limes taste sour. They contain citric acid.", "type": "fill", "q": "Lemons and limes taste sour because they contain ____ acid.", "answer": ["citric"], "id": "y7c05-n023"}, {"source": "nblm", "topic": "5.5", "src": "L|It is red in acid. It is blue in alkali.", "explain": "The book says: It is red in acid. It is blue in alkali.", "type": "fill", "q": "Litmus is a dye made from a living organism that is red in acid and ____ in alkali.", "answer": ["blue"], "id": "y7c05-n024"}, {"source": "nblm", "topic": "5.2", "src": "L|a selection of materials to test, electrical wires, a lamp, a cell (battery), crocodile clips", "explain": "A marker looks for: circuit, lamp, cell, crocodile clips", "type": "short", "q": "In an experiment to test if a material conducts electricity, describe the apparatus you would set up.", "answer": "You would set up an electrical circuit using wires, a lamp, a cell or battery, and crocodile clips to connect to the test material.", "keywords": ["circuit", "lamp", "cell", "crocodile clips"], "id": "y7c05-n033"}, {"source": "nblm", "topic": "5.2", "src": "L|Before you start, check that the lamp is working by connecting the crocodile clips together", "explain": "A marker looks for: check, lamp, working", "type": "short", "q": "In a conductivity experiment, suggest why you must connect the crocodile clips together without any test materials before starting.", "answer": "You connect the clips together to test your circuit and check that the lamp is working properly before you test the unknown materials.", "keywords": ["check", "lamp", "working"], "id": "y7c05-n034"}, {"source": "nblm", "topic": "5.2", "src": "L|make sure you have good contact between the crocodile clips and your test material.", "explain": "A marker looks for: good contact, crocodile clips, test material", "type": "short", "q": "Explain why it is important to ensure good contact between the crocodile clips and the test material during an electrical conductivity investigation.", "answer": "Good contact is necessary so that the electrical current can flow completely through the material to light the lamp if the material is a conductor.", "keywords": ["good contact", "crocodile clips", "test material"], "id": "y7c05-n035"}, {"source": "nblm", "topic": "5.3", "src": "L|They don’t use pure iron because it is not strong enough.", "explain": "A marker looks for: pure iron, not strong enough, structures", "type": "short", "q": "Suggest why builders and engineers use an alloy called steel instead of pure iron to build bridges and car bodies.", "answer": "They use steel because pure iron on its own is relatively soft and not strong enough to form heavy, safe structures.", "keywords": ["pure iron", "not strong enough", "structures"], "id": "y7c05-n038"}, {"source": "nblm", "topic": "5.3", "src": "L|a different sized atom disrupts the regular pattern", "explain": "A marker looks for: different sized, disrupt, regular pattern", "type": "short", "q": "Predict what happens to the regular pattern of pure metal atoms when carbon atoms are added to make a mixture.", "answer": "The differently sized carbon atoms will disrupt the regular rows and pattern of the metal atoms, making the structure more rigid.", "keywords": ["different sized", "disrupt", "regular pattern"], "id": "y7c05-n039"}, {"source": "nblm", "topic": "5.5", "src": "W|replacing the bottle stopper as soon as you have finished using the bottle", "explain": "A marker looks for: replacing, bottle stopper, finished", "type": "short", "q": "In an investigation using strong liquid chemicals, suggest why it is important to replace the bottle stopper as soon as you have finished using the bottle.", "answer": "You must replace the stopper immediately to prevent dangerous spills and stop harmful or irritating chemical fumes from escaping into the laboratory.", "keywords": ["replacing", "bottle stopper", "finished"], "id": "y7c05-n043"}, {"source": "nblm", "topic": "5.5", "src": "L|These foods have a sour, sharp tangy taste.", "explain": "A marker looks for: sour, sharp, tangy, taste", "type": "short", "q": "Describe the taste of foods that naturally contain weak acids, such as lemons and limes.", "answer": "Foods containing weak acids usually have a very distinct sour, sharp, and tangy taste.", "keywords": ["sour", "sharp", "tangy", "taste"], "id": "y7c05-n044"}, {"source": "nblm", "topic": "5.5", "src": "W|wearing safety glasses standing up to work", "explain": "A marker looks for: safety glasses, stand up", "type": "short", "q": "Describe two important safety precautions you should take when standing at a bench handling liquid acids and alkalis.", "answer": "You should always wear safety glasses to protect your eyes from splashes and remain standing up to work so you can move away quickly if a spill happens.", "keywords": ["safety glasses", "stand up"], "id": "y7c05-n047"}, {"source": "nblm", "topic": "5.6", "src": "L|An indicator turns one colour in an acid and a different colour in an alkali.", "explain": "A marker looks for: turns one colour, acid, different colour, alkali", "type": "short", "q": "Explain what an indicator does when it is added to an unknown solution.", "answer": "An indicator is a special substance that changes into one colour in an acid and a totally different colour in an alkali to help you identify the solution.", "keywords": ["turns one colour", "acid", "different colour", "alkali"], "id": "y7c05-n048"}, {"source": "nblm", "topic": "5.6", "src": "L|Litmus is a dye made from a living organism. It is red in acid.", "explain": "A marker looks for: red, acid", "type": "short", "q": "Describe the colour change you would observe if you added litmus indicator to hydrochloric acid.", "answer": "The litmus indicator would turn red because hydrochloric acid is an acidic substance.", "keywords": ["red", "acid"], "id": "y7c05-n049"}, {"source": "nblm", "topic": "5.6", "src": "L|How acidic or alkaline a substance is.", "explain": "A marker looks for: how acidic, alkaline, substance", "type": "short", "q": "Explain what the pH scale measures in chemistry.", "answer": "The pH scale is a numbered system used to measure exactly how acidic or alkaline a substance is.", "keywords": ["how acidic", "alkaline", "substance"], "id": "y7c05-n053"}, {"source": "nblm", "topic": "5.1", "src": "L|Mercury is the only metal that is liquid at room temperature.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'All metals are solid at room temperature.' Explain what is wrong with this.", "answer": "While most metals are solid, mercury is a unique metal because it is a liquid at room temperature.", "keywords": ["mercury", "metal", "liquid", "room"], "id": "y7c05-n056"}, {"source": "nblm", "topic": "5.2", "src": "L|Many are gases at room temperature.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'All non-metals are solids.' Explain what is wrong with this.", "answer": "A large number of non-metal elements naturally exist as gases in the environment at room temperature.", "keywords": ["gases", "room", "temperature", "large"], "id": "y7c05-n057"}, {"source": "nblm", "topic": "5.1", "src": "L|Some metals are magnetic. Iron, steel, nickel and cobalt are magnetic.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'All metals are magnetic and will stick to a magnet.' Explain what is wrong with this.", "answer": "Only a few specific metals, such as iron, steel, nickel, and cobalt, are actually magnetic.", "keywords": ["metals", "iron", "steel", "nickel"], "id": "y7c05-n058"}, {"source": "nblm", "topic": "5.1", "src": "L|bottles and cups also make a ‘ringing’ sound when they are hit, but they are not made of metal.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Any object that rings when tapped must be made of metal.' Explain what is wrong with this.", "answer": "Non-metal objects like glass bottles and cups can also make a ringing sound when hit.", "keywords": ["bottles", "cups", "make", "ringing"], "id": "y7c05-n059"}, {"source": "nblm", "topic": "5.1", "src": "L|the surface of most metals will become dull after a while", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Metals will naturally stay perfectly shiny forever.' Explain what is wrong with this.", "answer": "The surface of most metals will slowly lose their shine and become dull over time.", "keywords": ["surface", "metals", "become", "dull"], "id": "y7c05-n060"}, {"source": "nblm", "topic": "5.1", "src": "L|them they conduct heat energy away from the hand so they feel cold.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Metals feel cold to the touch because they generate cold energy.' Explain what is wrong with this.", "answer": "Metals feel cold because they are excellent conductors that rapidly transfer heat energy away from your hand.", "keywords": ["feel", "cold", "heat", "energy"], "id": "y7c05-n063"}, {"source": "nblm", "topic": "5.1", "src": "L|big lumps of metal are hard to test for flexibility", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'It is easy to see how flexible a metal is just by testing any large piece of it.' Explain what is wrong with this.", "answer": "Flexibility is very difficult to test if you are using large, thick lumps of metal.", "keywords": ["flexibility", "test", "lumps", "metal"], "id": "y7c05-n064"}, {"source": "nblm", "topic": "5.3", "src": "L|The atoms of the different metals mix but do not bond together.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'An alloy is a chemical compound formed when different metals bond together.' Explain what is wrong with this.", "answer": "An alloy is simply a physical mixture where the atoms of different metals are mixed but do not chemically bond.", "keywords": ["atoms", "metals", "bond", "alloy"], "id": "y7c05-n065"}, {"source": "nblm", "topic": "5.3", "src": "L|The properties of the alloys are different from the metals they contain.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Alloys have the exact same physical properties as the pure metals used to make them.' Explain what is wrong with this.", "answer": "Mixing metals together creates an alloy with brand new properties that differ from the original pure metals.", "keywords": ["metals", "alloy", "properties", "differ"], "id": "y7c05-n066"}, {"source": "nblm", "topic": "5.6", "src": "L|They don’t use pure iron because it is not strong enough.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Builders use pure iron to build strong structures like bridges and car bodies.' Explain what is wrong with this.", "answer": "Pure iron is actually too soft and weak to be useful for large structures, so an alloy called steel is used instead.", "keywords": ["pure", "iron", "actually", "soft"], "id": "y7c05-n067"}, {"source": "nblm", "topic": "5.4", "src": "L|Mixtures contain different substances that are not combined together chemically.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'The substances in a mixture join together chemically to form something new.' Explain what is wrong with this.", "answer": "A mixture contains different substances that are simply mixed up and not combined together chemically.", "keywords": ["mixture", "substances", "combined", "together"], "id": "y7c05-n070"}, {"source": "nblm", "topic": "5.4", "src": "L|You separated the iron and sulfur in your mixture by using a magnet.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Once iron and sulfur are mixed together into a powder, they cannot be separated.' Explain what is wrong with this.", "answer": "Because they are just a mixture, you can easily separate the iron from the sulfur using a magnet.", "keywords": ["mixture", "separate", "iron", "sulfur"], "id": "y7c05-n071"}, {"source": "nblm", "topic": "5.5", "src": "L|Some foods contain acid. These foods have a sour, sharp tangy taste.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'All acids are incredibly dangerous chemicals that will severely burn you.' Explain what is wrong with this.", "answer": "Some weak acids are entirely safe and are found naturally in foods like lemons and limes, giving them a sour taste.", "keywords": ["some", "foods", "sour", "taste"], "id": "y7c05-n074"}, {"source": "nblm", "topic": "5.5", "src": "W|placing bottle stoppers upside down on the bench", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Bottle stoppers for chemical liquids should be placed upright on the laboratory bench.' Explain what is wrong with this.", "answer": "Bottle stoppers must be placed upside down on the bench to prevent contamination and accidents.", "keywords": ["bottle", "stoppers", "upside", "down"], "id": "y7c05-n076"}, {"source": "nblm", "topic": "5.6", "src": "L|Litmus is a dye made from a living organism. It is red in acid. It is blue in alkali.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Litmus indicator turns yellow when placed in an acid.' Explain what is wrong with this.", "answer": "Litmus is a biological dye that turns red in an acid and blue in an alkali.", "keywords": ["litmus", "acid", "blue", "alkali"], "id": "y7c05-n079"}, {"id": "qwen-01-01", "type": "mcq", "topic": "5.1", "source": "qwen", "q": "What does it mean for a metal to be malleable?", "explain": "The text states that metals are malleable, which means they can be hammered into shape.", "src": "L|Metals are malleable, which means they can be hammered into shape.", "options": ["It can be drawn out into wires", "It can be hammered into shape", "It makes a ringing sound when hit", "It is shiny and smooth"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "5.1", "source": "qwen", "q": "Metals that can be drawn out into wires are described as ____.", "explain": "The text defines ductility as the ability to be drawn out into wires.", "src": "L|Metals are ductile, which means that they can be drawn out into wires.", "answer": ["ductile"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "5.1", "source": "qwen", "q": "Which metal is the only one that is liquid at room temperature?", "explain": "The text explicitly identifies mercury as the only liquid metal at room temperature.", "src": "L|Mercury is the only metal that is liquid at room temperature.", "options": ["Iron", "Copper", "Mercury", "Gold"], "answer": 2}, {"id": "qwen-01-04", "type": "fill", "topic": "5.1", "source": "qwen", "q": "When metals are hit, they make a ringing sound. This property is called ____.", "explain": "The text defines the ringing sound made by metals as sonorous.", "src": "L|the word for this is sonorous", "answer": ["sonorous"]}, {"id": "qwen-01-05", "type": "mcq", "topic": "5.1", "source": "qwen", "q": "Why do metals feel cold when you touch them?", "explain": "The text explains that metals feel cold because they conduct heat energy away from the hand.", "src": "L|they conduct heat energy away from the hand so they feel cold", "options": ["They are actually very cold", "They conduct heat energy away from your hand", "They reflect light from the sun", "They are made of ice"], "answer": 1}, {"id": "qwen-01-06", "type": "fill", "topic": "5.1", "source": "qwen", "q": "Iron, steel, nickel and cobalt are examples of metals that are ____.", "explain": "The text lists these four metals as being magnetic.", "src": "L|Iron, steel, nickel and cobalt are magnetic.", "answer": ["magnetic"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "5.3", "source": "qwen", "q": "Which two metals are mixed to make bronze?", "explain": "Bronze is described as an alloy made by mixing copper and tin.", "src": "L|Bronze is an alloy made by mixing copper and tin.", "options": ["Copper and tin", "Iron and carbon", "Chromium and nickel", "Gold and silver"], "answer": 0}, {"id": "qwen-02-04", "type": "fill", "topic": "5.3", "source": "qwen", "q": "Bronze is ____ than either copper or tin.", "explain": "The text states that bronze is harder than the individual metals it contains.", "src": "L|Bronze is harder than either copper or tin.", "answer": ["harder"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "5.3", "source": "qwen", "q": "Which non-metal is mixed with iron to make steel?", "explain": "Steel is described as a mixture of iron and carbon.", "src": "L|Steel is a mixture of iron and carbon.", "options": ["Carbon", "Oxygen", "Sulfur", "Nitrogen"], "answer": 0}, {"id": "qwen-02-06", "type": "fill", "topic": "5.3", "source": "qwen", "q": "Pure iron is not ____ enough to be very useful on its own.", "explain": "The text notes that pure iron lacks the hardness needed for many uses.", "src": "L|Pure iron is not hard enough to be very useful", "answer": ["hard"]}, {"id": "qwen-02-07", "type": "mcq", "topic": "5.3", "source": "qwen", "q": "What happens when the atoms of different metals are mixed to form an alloy?", "explain": "The text specifies that the atoms of different metals mix but do not bond together.", "src": "L|The atoms of the different metals mix but do not bond together.", "options": ["They bond together", "They mix but do not bond", "They separate completely", "They turn into a gas"], "answer": 1}, {"id": "qwen-02-08", "type": "fill", "topic": "5.3", "source": "qwen", "q": "In a pure metal, the atoms are arranged in regular ____.", "explain": "The text describes the structure of pure metals as having atoms in regular rows.", "src": "L|In a pure metal, the atoms are all the same size and arranged in regular rows.", "answer": ["rows"]}, {"id": "qwen-03-10", "type": "fill", "topic": "5.4", "source": "qwen", "q": "Mixtures contain different substances that are not combined together ____.", "explain": "The text defines mixtures as substances not combined chemically.", "src": "L|Mixtures contain different substances that are not combined together chemically.", "answer": ["chemically"]}, {"id": "qwen-03-11", "type": "mcq", "topic": "5.4", "source": "qwen", "q": "How is a mixture of iron filings and sulfur separated?", "explain": "The text states that a magnet is used because iron is magnetic and sulfur is not.", "src": "L|You separated the iron and sulfur in your mixture by using a magnet.", "options": ["By heating it until it melts", "Using a magnet to attract the iron", "Filtering it through paper", "Boiling off the sulfur"], "answer": 1}, {"id": "qwen-03-12", "type": "fill", "topic": "5.4", "source": "qwen", "q": "In the separation of food dye and water, the gas travels into a ____ to cool down.", "explain": "The text describes the apparatus used to cool the gas as a condenser.", "src": "L|The gas travels along the tube into the condenser.", "answer": ["condenser"]}, {"id": "qwen-04-01", "type": "mcq", "topic": "5.4", "source": "qwen", "q": "What piece of equipment is used to hold the filter paper during the separation process?", "explain": "The text states to place the filter paper in a filter funnel.", "src": "L|Prepare a filter paper and place it in a filter funnel.", "options": ["Conical flask", "Filter funnel", "Evaporating basin", "Beaker"], "answer": 1}, {"id": "qwen-04-03", "type": "mcq", "topic": "5.4", "source": "qwen", "q": "Why should you add the mixture to the funnel slowly?", "explain": "The text warns to add it slowly so the mixture does not go down the outside of the filter paper.", "src": "L|Take care to add it slowly so that the mixture does not go down the outside of the filter paper.", "options": ["To make it filter faster", "So the mixture does not go down the outside of the paper", "To keep the sand from dissolving", "To prevent the water from evaporating"], "answer": 1}, {"id": "qwen-04-05", "type": "mcq", "topic": "5.4", "source": "qwen", "q": "Where should the filter paper be left after filtering is complete?", "explain": "Step 3 instructs to leave the filter paper in a warm place to dry.", "src": "L|leave the filter paper in a warm place to dry.", "options": ["In a cold place", "In the conical flask", "In a warm place to dry", "Under running water"], "answer": 2}, {"id": "qwen-06-01", "type": "mcq", "topic": "5.5", "source": "qwen", "q": "What is the taste of lemons and limes?", "explain": "The text states that lemons and limes taste sour and have a sharp tangy taste.", "src": "L|Lemons and limes taste sour.", "options": ["Sweet", "Sour, sharp tangy", "Bitter", "Salty"], "answer": 1}, {"id": "qwen-06-02", "type": "fill", "topic": "5.5", "source": "qwen", "q": "Citric acid is found in lemons and limes. It is described as a ____ acid.", "explain": "The text explicitly identifies citric acid as a weak acid.", "src": "L|This is a weak acid.", "answer": ["weak"]}, {"id": "qwen-06-03", "type": "mcq", "topic": "5.5", "source": "qwen", "q": "Which of the following is a common acid found in the laboratory?", "explain": "The text lists hydrochloric acid, sulfuric acid and nitric acid as common laboratory acids.", "src": "L|Common acids in the laboratory are hydrochloric acid, sulfuric acid and nitric acid.", "options": ["Sodium hydroxide", "Hydrochloric acid", "Calcium hydroxide", "Potassium hydroxide"], "answer": 1}, {"id": "qwen-06-04", "type": "fill", "topic": "5.5", "source": "qwen", "q": "If strong acid gets onto your skin, it will ____ the skin.", "explain": "The text explains that strong acid dissolves skin, causing a chemical burn.", "src": "L|If strong acid gets onto your skin, it will dissolve the skin.", "answer": ["dissolve"]}, {"id": "qwen-06-07", "type": "mcq", "topic": "5.5", "source": "qwen", "q": "How do acids and alkalis behave when mixed together?", "explain": "The text states that acids and alkalis are chemical opposites that cancel each other out.", "src": "L|They cancel each other out when they are mixed together.", "options": ["They explode", "They cancel each other out", "They form a solid precipitate only", "They become more acidic"], "answer": 1}, {"id": "qwen-06-09", "type": "mcq", "topic": "5.5", "source": "qwen", "q": "What does a 'Corrosive' hazard symbol mean?", "explain": "The table defines corrosive as a substance that destroys living tissue and causes burns.", "src": "L|A substance that can destroy living tissue.", "options": ["A substance that can explode", "A substance that can destroy living tissue", "A substance that is flammable", "A substance that is toxic"], "answer": 1}, {"id": "qwen-07-01", "type": "mcq", "topic": "5.6", "source": "qwen", "q": "What colour does red cabbage indicator turn in an alkali?", "explain": "The text states that red cabbage indicator turns yellow in alkalis.", "src": "L|Red cabbage indicator turns acids red in acids, blue in water and yellow in alkalis.", "options": ["red", "blue", "yellow", "purple"], "answer": 2}, {"id": "qwen-07-03", "type": "mcq", "topic": "5.6", "source": "qwen", "q": "Which of the following is a neutral substance?", "explain": "The text identifies water as neutral because it is neither an acid nor an alkali.", "src": "L|Water is neutral. This means water is neither an acid nor an alkali.", "options": ["hydrochloric acid", "sodium hydroxide", "water", "lemon juice"], "answer": 2}, {"id": "qwen-07-05", "type": "mcq", "topic": "5.6", "source": "qwen", "q": "What colour does universal indicator turn in a strongly alkaline substance?", "explain": "The table shows that universal indicator turns purple in strongly alkaline substances.", "src": "L|strongly alkaline|purple", "options": ["red", "green", "blue", "purple"], "answer": 3}, {"id": "qwen-07-07", "type": "mcq", "topic": "5.6", "source": "qwen", "q": "What is the pH of a neutral solution?", "explain": "The text explicitly states that the pH of a neutral solution is 7.", "src": "L|neutral pH = 7", "options": ["1", "4", "7", "13"], "answer": 2}, {"id": "qwen-08-01", "type": "mcq", "topic": "5.6", "source": "qwen", "q": "Why do people use steel instead of pure iron for making car bodies and bridges?", "explain": "The text states that pure iron is used for structures but it is not strong enough, so an alloy called steel is used instead.", "src": "L|They don’t use pure iron because it is not strong enough.", "options": ["Pure iron is too expensive to buy", "Pure iron is not strong enough", "Steel is lighter than pure iron", "Pure iron melts at a lower temperature"], "answer": 1}, {"id": "qwenw-01-07", "type": "mcq", "topic": "5.2", "source": "qwen", "q": "Which statement about metals is true?", "explain": "The text asks to mark true or false, and 'Solid non-metals are brittle' is a standard property listed in the context of comparing metals and non-metals.", "src": "W|b Solid non-metals are brittle.", "options": ["All metals are magnetic", "Solid non-metals are brittle", "All metals are solids", "Non-metals conduct electricity well"], "answer": 1}, {"id": "qwenw-01-08", "type": "fill", "topic": "5.2", "source": "qwen", "q": "Substance A is a shiny liquid that conducts electricity, so it is a ____.", "explain": "Substance A conducts electricity and is shiny, which are properties of metals.", "src": "W|It conducts electricity. It is toxic.", "answer": ["metal"]}], "figures": {"img/L_p03_magnet_nails.png": {"caption": "Some metals are magnetic.", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAD4AVUDAREAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAEEAwUCBgf/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAHaeeMjAAGADAACgACAACiABAAAAAIBAAgoEMxpiDcuAYAMBgABY1EAlACkhKAACAAEAgEACrkBDNGahMsQxgADABgAAMQAFEIYhAATuuX1Dn63C6eJdvlF5oKQhABozUJkGADAYAMAGAAIAGcgEFIc7Lh9znj9pNqR6yppOfXp/MHb5gIQCGaE1CuXAAwGAwAAAYAACAAEObOX2Fw+6p25uc3p83M7fLVxoc/fp+f7PM1Z6/yh0+aVyAhmhNQmRWgMAGAwGAAAAAhiGTc+2H5/03OPSGfvw5Pf403fh0XLuSE6RuP29Tj9tPP37fxqsBCGaM1BZBjAYAAwAAGAhgMRqXfr730Lvwfl/RYGd4fX49nT52u4WzJQCwseyX5/1lXPpZ7vxLvBBSA0JqEyDohjAAGADAAA6trutDM9he+86c2ZtnzeXy+Ww80xloAAl54fdr8/6BXD9v4mzXIjmgI0GoSA0YDAAGA6IeryooVXp6Rv1+d6Sx08Frn4KSVnGpOfVjAQBOx5/wBBxy+vxLD7/Gm+j830iFSHGhdQkJGMBhQEMDqmufdOXjWrSu7+nZ3v5147WPnDEaTZnKQyAAApy+suH6DnPflnM7fL79H57QcWiFShmg1CQRq0BgA6IKRzd0OnWrdbCyqmveW+LmMGXduZWeHaACGGfW+H6Lnn71LH158X0fDl9PmabkxICACe1CRjGCMKYoB1zLn3dOumk11LnTMFJmty2e3Odd1Z49ycyBYvqdduef2/K+b7NcmR1+VA7fH2L5ZTLAQrCACe3CZYxiRgMKBhFrdt7RNXMmbs8pFUXd8kzW6V6zxrS5Nx09i7yNOF+Z8fqeMvjl68Ws49oAIQWA
