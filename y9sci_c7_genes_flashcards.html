<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
</style>

 "The resistant one can now multiply and form a population of resistant bacteria just like itself.", "alt": [], "x": 71.5, "y": 65.9, "w": 25.4, "h": 22.1}], "src": "L|In a population of bacteria, not every one is alike. By chance, one may have a gene that makes it resistant to an antibiotic."}, {"id": "ch07-f07h1", "type": "hotspot", "topic": "7.4", "source": "opus", "image": "img/L_p21_antibiotic_resistance.png", "figure": "L_p21_antibiotic_resistance", "q": "Click on the caption for the stage that describes variation already present in the population.", "caption": "How a population of bacteria becomes resistant to an antibiotic.", "target": {"x": 13.6, "y": 80.7, "r": 7.0}, "explain": "Natural selection can only act on variation that is already there. By chance, one bacterium in the population has a gene that makes it resistant to the antibiotic.", "src": "L|In a population of bacteria, not every one is alike. By chance, one may have a gene that makes it resistant to an antibiotic."}, {"id": "ch07-f07h2", "type": "hotspot", "topic": "7.4", "source": "opus", "image": "img/L_p21_antibiotic_resistance.png", "figure": "L_p21_antibiotic_resistance", "q": "Click on the caption for the stage in which the antibiotic decides which bacteria survive.", "caption": "How a population of bacteria becomes resistant to an antibiotic.", "target": {"x": 48.9, "y": 73.2, "r": 7.0}, "explain": "The antibiotic kills the bacteria that are not resistant, so only the resistant one is left alive.", "src": "L|Antibiotic is added, which kills the bacteria that are not resistant."}, {"id": "ch07-f07h3", "type": "hotspot", "topic": "7.4", "source": "opus", "image": "img/L_p21_antibiotic_resistance.png", "figure": "L_p21_antibiotic_resistance", "q": "Click on the caption for the stage in which the gene for resistance becomes common.", "caption": "How a population of bacteria becomes resistant to an antibiotic.", "target": {"x": 84.2, "y": 77.0, "r": 7.0}, "explain": "The surviving resistant bacterium multiplies, and every offspring inherits the gene for resistance, so a whole population of resistant bacteria is formed.", "src": "L|The resistant one can now multiply and form a population of resistant bacteria just like itself."}, {"id": "ch07-o001", "type": "short", "topic": "7.1", "source": "opus", "q": "State where in a cell the chromosomes are found.", "answer": "In the nucleus.", "keywords": ["nucleus"], "explain": "A marker looks for: nucleus", "src": "L|The nucleus of every cell contains threads called chromosomes."}, {"id": "ch07-o002", "type": "short", "topic": "7.1", "source": "opus", "q": "Name the chemical substance that chromosomes are made of.", "answer": "DNA.", "keywords": ["DNA"], "explain": "A marker looks for: DNA", "src": "L|Chromosomes are made of a chemical substance called DNA."}, {"id": "ch07-o003", "type": "short", "topic": "7.1", "source": "opus", "q": "State how many chromosomes there are in a human cell.", "answer": "46.", "keywords": ["46"], "explain": "A marker looks for: 46", "src": "L|Human cells have 46 chromosomes."}, {"id": "ch07-o004", "type": "short", "topic": "7.1", "source": "opus", "q": "State the number of chromosomes in a fruit fly cell and in a mango tree cell.", "answer": "A fruit fly cell has eight chromosomes and a mango tree cell has 40.", "keywords": ["eight", "40"], "explain": "A marker looks for: eight, 40", "src": "L|Fruit fly cells have eight chromosomes. Mango trees have 40 chromosomes."}, {"id": "ch07-o005", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain what a gene is.", "answer": "A gene is a part of a chromosome that helps to control a particular characteristic of the organism.", "keywords": ["part of a chromosome", "controls a characteristic"], "explain": "A marker looks for: part of a chromosome, controls a characteristic", "src": "L|Each gene helps to control a particular characteristic in the organism."}, {"id": "ch07-o006", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain how scientists decide which chromosome in a human cell is called chromosome 1.", "answer": "Chromosomes are numbered according to their length. The longest one is chromosome 1, the next longest chromosome 2, and so on.", "keywords": ["length", "longest"], "explain": "A marker looks for: length, longest", "src": "L|In a human cell, the longest chromosome is chromosome 1, the next longest is chromosome 2, and so on."}, {"id": "ch07-o007", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why each chromosome in a photograph of a dividing cell looks like a cross shape.", "answer": "Just before a cell divides, each chromosome makes a copy of itself, and the two copies stay joined together part way along their length.", "keywords": ["copy of itself", "joined together"], "explain": "A marker looks for: copy of itself, joined together", "src": "L|each chromosome makes a copy of itself. The two copies stay joined together part way along their length."}, {"id": "ch07-o008", "type": "short", "topic": "7.1", "source": "opus", "q": "Chromosome 1 carries about 2000 genes but chromosome 15 carries only about 600. Suggest why.", "answer": "Chromosome 15 is a much shorter chromosome than chromosome 1, so there is room for fewer genes along it.", "keywords": ["shorter", "fewer genes"], "explain": "A marker looks for: shorter, fewer genes", "src": "L|Chromosome 15 is a much shorter chromosome, and it has about 600 different genes."}, {"id": "ch07-o009", "type": "short", "topic": "7.1", "source": "opus", "q": "State the name given to the twisted ladder shape of a DNA molecule.", "answer": "A double helix.", "keywords": ["double helix"], "explain": "A marker looks for: double helix", "src": "L|This shape is called a double helix."}, {"id": "ch07-o010", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why the twists in a DNA molecule cannot be seen with a microscope.", "answer": "DNA molecules are much too small to see.", "keywords": ["too small"], "explain": "A marker looks for: too small", "src": "L|We cannot see these twists when we use microscopes to look at chromosomes, because DNA molecules are much too small to see."}, {"id": "ch07-o011", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain the difference between a chromosome and a gene.", "answer": "A chromosome is a long thread of DNA. A gene is a part of that chromosome that helps to control one characteristic, and each chromosome is made up of hundreds of genes.", "keywords": ["part of a chromosome", "hundreds of genes"], "explain": "A marker looks for: part of a chromosome, hundreds of genes", "src": "L|Each chromosome is made up of hundreds of different genes."}, {"id": "ch07-o012", "type": "short", "topic": "7.1", "source": "opus", "q": "Red blood cells have no nucleus. Explain whether they contain any chromosomes.", "answer": "No. Chromosomes are found inside the nucleus, so a cell with no nucleus contains no chromosomes.", "keywords": ["no", "nucleus"], "explain": "A marker looks for: no, nucleus", "src": "L|The nucleus of every cell contains threads called chromosomes."}, {"id": "ch07-o013", "type": "short", "topic": "7.1", "source": "opus", "q": "Explain why the chromosomes of a fruit fly are easier to see than the chromosomes of most other organisms.", "answer": "Fruit flies have especially thick chromosomes, called giant chromosomes.", "keywords": ["thick", "giant chromosomes"], "explain": "A marker looks for: thick, giant chromosomes", "src": "L|Fruit flies have especially thick chromosomes, called giant chromosomes, which are much easier to see than most chromosomes."}, {"id": "ch07-o014", "type": "short", "topic": "7.1", "source": "opus", "q": "State what the DNA in a cell determines.", "answer": "It determines what the cell does. It contains a complete set of instructions to make a functioning cell, and a whole organism.", "keywords": ["what the cell does", "instructions"], "explain": "A marker looks for: what the cell does, instructions", "src": "L|The DNA in a cell determines what the cell does. It contains a complete set of instructions to make a functioning cell, and a whole organism."}, {"id": "ch07-o015", "type": "short", "topic": "7.2", "source": "opus", "q": "State what a gamete is.", "answer": "A sex cell - in humans, a sperm cell or an egg cell.", "keywords": ["sex cell"], "explain": "A marker looks for: sex cell", "src": "L|Sperm cells and egg cells are specialised cells known as gametes."}, {"id": "ch07-o016", "type": "short", "topic": "7.2", "source": "opus", "q": "Name the male gamete and the female gamete in humans.", "answer": "The male gamete is the sperm cell and the female gamete is the egg cell.", "keywords": ["sperm cell", "egg cell"], "explain": "A marker looks for: sperm cell, egg cell", "src": "L|A sperm cell is a male gamete, and an egg cell is a female gamete."}, {"id": "ch07-o017", "type": "short", "topic": "7.2", "source": "opus", "q": "Describe the function of the tail of a sperm cell.", "answer": "It produces swimming movements, so the sperm cell can swim to the egg cell.", "keywords": ["swim"], "explain": "A marker looks for: swim", "src": "L|They are very active, using their tails to swim vigorously."}, {"id": "ch07-o018", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why an egg cell is much bigger than a sperm cell.", "answer": "The egg cell contains food reserves in its cytoplasm.", "keywords": ["food reserves"], "explain": "A marker looks for: food reserves", "src": "L|They need to be larger than sperm cells because they contain food reserves."}, {"id": "ch07-o019", "type": "short", "topic": "7.2", "source": "opus", "q": "Describe one difference in the way a sperm cell and an egg cell move.", "answer": "A sperm cell swims using its tail, but an egg cell cannot move by itself.", "keywords": ["cannot move"], "explain": "A marker looks for: cannot move", "src": "L|Another difference from sperm cells is that egg cells cannot move by themselves."}, {"id": "ch07-o020", "type": "short", "topic": "7.2", "source": "opus", "q": "State how many chromosomes there are in a human gamete.", "answer": "23 - one set.", "keywords": ["23", "one set"], "explain": "A marker looks for: 23, one set", "src": "L|But gametes have only one set of chromosomes."}, {"id": "ch07-o021", "type": "short", "topic": "7.2", "source": "opus", "q": "Define fertilisation.", "answer": "The joining of a sperm cell with an egg cell.", "keywords": ["joining", "sperm cell", "egg cell"], "explain": "A marker looks for: joining, sperm cell, egg cell", "src": "L|The joining of a sperm cell with an egg cell is called fertilisation."}, {"id": "ch07-o022", "type": "short", "topic": "7.2", "source": "opus", "q": "Each human gamete has only 23 chromosomes. Explain why the cell made at fertilisation has 46.", "answer": "The sperm cell brings one set of 23 chromosomes and the egg cell brings another set of 23, so the new cell has two sets, which is 46.", "keywords": ["two sets", "23 from each gamete"], "explain": "A marker looks for: two sets, 23 from each gamete", "src": "L|This means that, when a sperm cell joins with an egg cell, the new cell that is produced has two sets. It will have 46 chromosomes."}, {"id": "ch07-o023", "type": "short", "topic": "7.2", "source": "opus", "q": "Name the cell that is formed when the nucleus of a sperm cell and the nucleus of an egg cell join together.", "answer": "A zygote.", "keywords": ["zygote"], "explain": "A marker looks for: zygote", "src": "L|The new cell that is formed when the nucleus of the sperm cell and the egg cell join together is called a zygote."}, {"id": "ch07-o024", "type": "short", "topic": "7.2", "source": "opus", "q": "Describe what happens to the zygote over the days, weeks and years after fertilisation.", "answer": "It divides over and over again, eventually producing all of the millions of cells in a human body.", "keywords": ["divides over and over again", "millions of cells"], "explain": "A marker looks for: divides over and over again, millions of cells", "src": "L|this single cell divides over and over again, eventually producing all of the millions of cells in a human body."}, {"id": "ch07-o025", "type": "short", "topic": "7.2", "source": "opus", "q": "State the sex chromosomes present in the cells of a female and in the cells of a male.", "answer": "A female has two X chromosomes, XX. A male has one X and one Y chromosome, XY.", "keywords": ["XX", "XY"], "explain": "A marker looks for: XX, XY", "src": "L|A person with two X chromosomes, XX, is female."}, {"id": "ch07-o026", "type": "short", "topic": "7.2", "source": "opus", "q": "Compare the size of a Y chromosome with the size of an X chromosome.", "answer": "The Y chromosome is much smaller than the X chromosome.", "keywords": ["smaller"], "explain": "A marker looks for: smaller", "src": "L|A Y chromosome is much smaller than an X chromosome."}, {"id": "ch07-o027", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why every egg cell contains an X chromosome.", "answer": "A woman's cells contain two X chromosomes, and a gamete receives only one of each kind of chromosome, so every egg cell carries an X.", "keywords": ["one of each kind", "X chromosome"], "explain": "A marker looks for: one of each kind, X chromosome", "src": "L|All egg cells contain one X chromosome."}, {"id": "ch07-o028", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why approximately equal numbers of boys and girls are born each year.", "answer": "Half of all sperm cells carry an X chromosome and half carry a Y, so the chance of making an XX zygote and the chance of making an XY zygote are about equal.", "keywords": ["half X and half Y", "chance is equal"], "explain": "A marker looks for: half X and half Y, chance is equal", "src": "L|The chance of either of these events happening is about equal. This is why approximately equal numbers of boys and girls are born."}, {"id": "ch07-o029", "type": "short", "topic": "7.2", "source": "opus", "q": "Explain why the sex of a baby is determined by its father and not by its mother.", "answer": "Every egg cell carries an X chromosome, but a sperm cell can carry either an X or a Y, so it is the sperm cell that decides whether the zygote is XX or XY.", "keywords": ["sperm cell", "X or Y"], "explain": "A marker looks for: sperm cell, X or Y", "src": "L|But sperm cells can have either one X chromosome or one Y chromosome."}, {"id": "ch07-o030", "type": "short", "topic": "7.2", "source": "opus", "q": "Define inheritance.", "answer": "Passing on DNA, as chromosomes containing genes, from parents to offspring.", "keywords": ["passing on DNA", "parents to offspring"], "explain": "A marker looks for: passing on DNA, parents to offspring", "src": "L|Inheritance means passing on DNA (as chromosomes containing genes) from parents to offspring."}, {"id": "ch07-o031", "type": "short", "topic": "7.3", "source": "opus", "q": "Goats of one species differ from one another in size, coat colour and horns. State two features that all of them share.", "answer": "For example, they all have four legs and two ears.", "keywords": ["four legs", "two ears"], "explain": "A marker looks for: four legs, two ears", "src": "L|But individual organisms that belong to the same species also have differences between them."}, {"id": "ch07-o032", "type": "short", "topic": "7.3", "source": "opus", "q": "Zara counted 5 red, 2 pink, 3 orange, 9 yellow and 3 cream kidney vetch plants. Calculate how many plants she found altogether.", "answer": "5 + 2 + 3 + 9 + 3 = 22 plants.", "keywords": ["22"], "explain": "A marker looks for: 22", "src": "L|She counted the number of plants with each colour of flower."}, {"id": "ch07-o033", "type": "short", "topic": "7.3", "source": "opus", "q": "Zara found 5 red, 2 pink, 3 orange, 9 yellow and 3 cream flowered plants. State the most common flower colour.", "answer": "Yellow.", "keywords": ["yellow"], "explain": "A marker looks for: yellow", "src": "L|A species of plant called kidney vetch has flowers that can have any one of five different colours."}, {"id": "ch07-o034", "type": "short", "topic": "7.3", "source": "opus", "q": "Describe how you use a tally row when you are recording how many of each kind you find.", "answer": "Put one stroke in the tally row for each individual you find, then add up all the strokes at the end and write the total in the number row.", "keywords": ["one stroke each", "add up the strokes"], "explain": "A marker looks for: one stroke each, add up the strokes", "src": "L|For each plant that she found, she put a stroke, | , in the Tally row."}, {"id": "ch07-o035", "type": "short", "topic": "7.3", "source": "opus", "q": "The bars of a flower colour bar chart have gaps between them, but the bars of a wrist circumference frequency diagram touch. Explain why.", "answer": "Flower colours are separate categories, so the bars are drawn apart. Wrist circumferences are ranges of numbers that follow on from each other, so the bars touch.", "keywords": ["separate categories", "ranges of numbers"], "explain": "A marker looks for: separate categories, ranges of numbers", "src": "L|The bars in your frequency diagram should touch one another."}, {"id": "ch07-o036", "type": "short", "topic": "7.3", "source": "opus", "q": "State what is meant by genetic differences.", "answer": "Differences in the DNA of organisms within a species.", "keywords": ["DNA", "within a species"], "explain": "A marker looks for: DNA, within a species", "src": "L|Differences in the DNA of organisms within a species are called genetic differences."}, {"id": "ch07-o037", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain why some goats have long horns, some short horns and some no horns at all.", "answer": "There are several versions of the genes that affect the development of horns, and each version is made of slightly different DNA.", "keywords": ["several versions", "slightly different DNA"], "explain": "A marker looks for: several versions, slightly different DNA", "src": "L|There are several versions of these genes, each made of slightly different DNA."}, {"id": "ch07-o038", "type": "short", "topic": "7.3", "source": "opus", "q": "One goat eats more than another and grows fatter. Explain whether this variation is caused by its genes.", "answer": "No. The extra food increases its body mass, so this variation is caused by the environment and not by its genes.", "keywords": ["environment", "not caused by its genes"], "explain": "A marker looks for: environment, not caused by its genes", "src": "L|one goat might eat more than another, so it would grow fatter and have a greater body mass. This is not caused by its genes."}, {"id": "ch07-o039", "type": "short", "topic": "7.3", "source": "opus", "q": "Give one human feature that is determined by genes alone, and one that is affected by both genes and the environment.", "answer": "Eye colour is determined by genes alone. Height is affected by genes and also by the environment, such as diet while growing.", "keywords": ["eye colour", "height"], "explain": "A marker looks for: eye colour, height", "src": "L|Not all variation within a species is caused by differences in DNA."}, {"id": "ch07-o040", "type": "short", "topic": "7.3", "source": "opus", "q": "Describe how you calculate the mean number of leaflets on a set of leaves.", "answer": "Add up all of the numbers of leaflets and divide by the number of leaves.", "keywords": ["add up", "divide"], "explain": "A marker looks for: add up, divide", "src": "L|You can find it by adding up all of the numbers of leaflets, and dividing by the number of leaves."}, {"id": "ch07-o041", "type": "short", "topic": "7.3", "source": "opus", "q": "Explain why the members of one family look alike but are not identical.", "answer": "Some of their DNA is the same, which produces the similarities, but everyone in the family has a slightly different combination of DNA from everyone else.", "keywords": ["some DNA is the same", "different combination"], "explain": "A marker looks for: some DNA is the same, different combination", "src": "L|But everyone in the family has a slightly different combination of DNA from everyone else."}, {"id": "ch07-o042", "type": "short", "topic": "7.4", "source": "opus", "q": "State what natural selection acts on in a population.", "answer": "The variation that already exists among the individual organisms of the species.", "keywords": ["variation"], "explain": "A marker looks for: variation", "src": "L|In every species, there is variation among individual organisms."}, {"id": "ch07-o043", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain what is meant by an advantageous feature.", "answer": "A feature that makes an individual more likely to survive than individuals without it, and therefore more likely to reproduce.", "keywords": ["more likely to survive", "more likely to reproduce"], "explain": "A marker looks for: more likely to survive, more likely to reproduce", "src": "L|Some individuals have features that make it more likely that they will survive than individuals that do not have these features."}, {"id": "ch07-o044", "type": "short", "topic": "7.4", "source": "opus", "q": "Describe what happens over many generations to the genes that produce advantageous features.", "answer": "They get a little bit more common each generation, while the genes that are not so useful get a little bit less common.", "keywords": ["more common", "less common"], "explain": "A marker looks for: more common, less common", "src": "L|the genes that produce these advantageous features get a little bit more common, and the genes that are not so useful get a little bit less common."}, {"id": "ch07-o045", "type": "short", "topic": "7.4", "source": "opus", "q": "In the imaginary story about the long-necked herbivores, explain why most of the short-necked animals died.", "answer": "In the years when the rains did not come the animals ran short of food, and once the lower leaves had been eaten only the long-necked animals could reach food, so the short-necked ones starved.", "keywords": ["only long necks could reach food", "starvation"], "explain": "A marker looks for: only long necks could reach food, starvation", "src": "L|When all the lower leaves had been eaten, only the longnecked animals could get food."}, {"id": "ch07-o046", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why the story about how giraffes came to have long necks is described as imaginary.", "answer": "We do not know that this is what actually happened, and we can never really know.", "keywords": ["do not know", "never really know"], "explain": "A marker looks for: do not know, never really know", "src": "L|We do not know if this is what happened, and we can never really know."}, {"id": "ch07-o047", "type": "short", "topic": "7.4", "source": "opus", "q": "State what antibiotics are used for.", "answer": "They are medicinal drugs taken to cure diseases caused by bacteria.", "keywords": ["cure", "bacteria"], "explain": "A marker looks for: cure, bacteria", "src": "L|Antibiotics are medicinal drugs that we can take to cure diseases caused by bacteria."}, {"id": "ch07-o048", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain what we mean when we say that bacteria have become resistant to an antibiotic.", "answer": "It means the bacteria are not killed by that antibiotic, so it no longer works against them.", "keywords": ["not killed", "antibiotic does not work"], "explain": "A marker looks for: not killed, antibiotic does not work", "src": "L|But doctors are finding that some antibiotics do not work anymore. Bacteria have become resistant to them."}, {"id": "ch07-o049", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain how a whole population of resistant bacteria can grow from a single bacterium.", "answer": "The one resistant bacterium is not killed by the antibiotic, so it survives and multiplies, and every offspring inherits the gene for resistance.", "keywords": ["multiply", "offspring inherit the gene"], "explain": "A marker looks for: multiply, offspring inherit the gene", "src": "L|The resistant one can now multiply and form a population of resistant bacteria just like itself."}, {"id": "ch07-o050", "type": "short", "topic": "7.4", "source": "opus", "q": "Suggest why doctors advise that antibiotics should be saved for serious illnesses.", "answer": "Every time an antibiotic is used it gives an advantage to the bacteria that are resistant to it, so the gene for resistance becomes more common. Using antibiotics less often slows this down and keeps them working for when they are really needed.", "keywords": ["advantage to resistant bacteria", "keeps the antibiotic working"], "explain": "A marker looks for: advantage to resistant bacteria, keeps the antibiotic working", "src": "L|Doctors advise that we should not use antibiotics unless we really need them."}, {"id": "ch07-o051", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain how pale peppered moths are camouflaged.", "answer": "Their pale colour matches lichen-covered tree bark, so birds resting-hunting on the trunks cannot see them easily.", "keywords": ["lichen-covered bark", "birds cannot see them"], "explain": "A marker looks for: lichen-covered bark, birds cannot see them", "src": "L|The pale colour of peppered moths camouflages them perfectly against lichen-covered tree bark."}, {"id": "ch07-o052", "type": "short", "topic": "7.4", "source": "opus", "q": "Describe what happened to the tree trunks near English cities during the Industrial Revolution, and give the cause.", "answer": "Many factories burnt coal and polluted the air with smoke. The smoke killed the lichens and made the tree trunks dark.", "keywords": ["smoke from burning coal", "killed lichens"], "explain": "A marker looks for: smoke from burning coal, killed lichens", "src": "L|The smoke killed lichens and made the tree trunks dark."}, {"id": "ch07-o053", "type": "short", "topic": "7.4", "source": "opus", "q": "Explain why dark peppered moths became more common than pale ones by 1900.", "answer": "On the darkened trunks the pale moths were no longer camouflaged and were more likely to be eaten by birds, so the dark moths were more likely to survive and reproduce, and passed their genes for dark colour on to their offspring.", "keywords": ["pale moths not camouflaged", "dark moths survive and reproduce"], "explain": "A marker looks for: pale moths not camouflaged, dark moths survive and reproduce", "src": "L|The dark moths were more likely to survive and reproduce than the pale moths."}, {"id": "ch07-o054", "type": "short", "topic": "7.4", "source": "opus", "q": "State what most peppered moths in England are like today, and explain why.", "answer": "Most are the pale variety again, because pollution is much less, so lichens grow on the tree trunks again and the pale moths are camouflaged.", "keywords": ["pale variety", "less pollution and lichens grow again"], "explain": "A marker looks for: pale variety, less pollution and lichens grow again", "src": "L|Today, pollution in England is much less. Lichens grow on tree trunks again. Today, most peppered moths are the pale variety."}, {"source": "nblm", "topic": "7.1", "src": "L|The nucleus of every cell contains threads called chromosomes.", "explain": "Chromosomes are specifically found within the nucleus, which acts as the control centre of the cell.", "type": "mcq", "q": "Where are chromosomes located inside a plant or animal cell?", "options": ["Floating freely in the cell's cytoplasm.", "Inside the cell membrane as a protective layer.", "Inside the nucleus of the cell.", "Throughout the entire cell structure."], "answer": 2, "id": "ch07-n001"}, {"source": "nblm", "topic": "7.1", "src": "L|Chromosomes are made of a chemical substance called DNA.", "explain": "Chromosomes consist of enormously long molecules of DNA, meaning genes are also made of DNA.", "type": "mcq", "q": "What chemical substance are chromosomes and genes made of?", "options": ["DNA", "Protein", "Cytoplasm", "Glucose"], "answer": 0, "id": "ch07-n003"}, {"source": "nblm", "topic": "7.2", "src": "L|in humans, contain 23 chromosomes", "explain": "Gametes contain only one set of 23 chromosomes, so they can fuse to make a zygote with 46.", "type": "mcq", "q": "How many chromosomes does a human sperm cell or egg cell contain?", "options": ["46 chromosomes, exactly the same as all other human cells.", "23 chromosomes, which is half the number found in normal body cells.", "Millions of chromosomes, because it has to carry all the information for a baby.", "No chromosomes, because the DNA is made after fertilisation happens."], "answer": 1, "id": "ch07-n005"}, {"source": "nblm", "topic": "7.2", "src": "L|All eggs contain an X chromosome.", "explain": "Because women are XX, they can only pass on an X chromosome to their egg cells.", "type": "mcq", "q": "Which sex chromosomes are found in human egg cells?", "options": ["Half of all eggs contain an X, and half contain a Y.", "All eggs contain both an X and a Y chromosome together.", "All eggs contain an X chromosome.", "Eggs do not contain any sex chromosomes until a sperm enters."], "answer": 2, "id": "ch07-n007"}, {"source": "nblm", "topic": "7.2", "src": "L|If a sperm cell containing a Y chromosome fertilises an egg, the zygote has chromosomes XY.", "explain": "A male zygote needs a Y chromosome, which can only come from the sperm cell, combining with the mother's X chromosome.", "type": "mcq", "q": "What combination of chromosomes results in a zygote developing into a boy?", "options": ["An X chromosome from the mother and an X chromosome from the father.", "An X chromosome from the mother and a Y chromosome from the father.", "A Y chromosome from the mother and an X chromosome from the father.", "A Y chromosome from the mother and a Y chromosome from the father."], "answer": 1, "id": "ch07-n008"}, {"source": "nblm", "topic": "7.3", "src": "L|The differences between individuals belonging to the same species are called variation.", "explain": "Even though individuals belong to the same species, they have differences such as height or coat colour, known as variation.", "type": "mcq", "q": "What does the term variation mean in biology?", "options": ["The differences between individuals belonging to the same species.", "The similarities that make organisms belong to the same species.", "The changes an organism makes to survive a predator attack.", "The differences between completely different species, like lions and tigers."], "answer": 0, "id": "ch07-n009"}, {"source": "nblm", "topic": "7.3", "src": "L|When a sperm cell and egg cell fuse together at fertilisation, the zygote that is produced has a new combination of DNA.", "explain": "Different sperm and egg cells carry different versions of genes, creating a unique combination of DNA at fertilisation.", "type": "mcq", "q": "Why do brothers and sisters show genetic differences even though they have the same parents?", "options": ["Because the environment causes their DNA to mutate as they grow up.", "Because the mother passes DNA to girls and the father passes DNA to boys.", "Because at fertilisation, the zygote gets a new, slightly different combination of DNA.", "Because they inherit completely different genes that do not come from their parents."], "answer": 2, "id": "ch07-n010"}, {"source": "nblm", "topic": "7.4", "src": "L|In every species, there is variation among individual organisms.", "explain": "For natural selection to favor some organisms over others, there must first be variation, some of which is caused by different genes.", "type": "mcq", "q": "According to the theory of natural selection, what must be present in a species for selection to happen?", "options": ["The animals must learn new behaviors to survive.", "There must be no genetic differences between the individuals.", "There must be variation among individual organisms.", "All individuals must have exactly the same environment."], "answer": 2, "id": "ch07-n012"}, {"source": "nblm", "topic": "7.4", "src": "L|The individuals with these advantageous features are therefore more likely to reproduce, and pass on the genes", "explain": "Having an advantageous feature makes an organism more likely to live long enough to reproduce and pass on the genes for that feature.", "type": "mcq", "q": "What happens to individuals that possess an advantageous feature in their environment?", "options": ["They change their genes so they can pass them on.", "They are more likely to survive and reproduce, passing on those genes to offspring.", "They prevent other individuals from reproducing.", "They live forever and do not need to reproduce."], "answer": 1, "id": "ch07-n013"}, {"source": "nblm", "topic": "7.4", "src": "L|The dark moths were more likely to survive and reproduce than the pale moths.", "explain": "Industrial pollution killed pale lichens and darkened tree trunks, meaning dark moths were hidden from birds while pale ones were eaten.", "type": "mcq", "q": "Why did dark peppered moths become more common than pale moths in England during the late nineteenth century?", "options": ["The pale moths decided to change their colour to match the dark tree trunks.", "The pale moths were killed directly by the soot from the factories.", "The dark moths were better camouflaged on the soot-covered trees, so more survived to reproduce.", "The pale moths moved to a different country where there was less pollution."], "answer": 2, "id": "ch07-n015"}, {"source": "nblm", "topic": "7.1", "src": "L|The nucleus of every cell contains threads called chromosomes.", "explain": "The book says: The nucleus of every cell contains threads called chromosomes.", "type": "fill", "q": "The nucleus of every cell contains threads called ____.", "answer": ["chromosomes"], "id": "ch07-n016"}, {"source": "nblm", "topic": "7.1", "src": "L|Chromosomes are made of a chemical substance called DNA.", "explain": "The book says: Chromosomes are made of a chemical substance called DNA.", "type": "fill", "q": "Chromosomes are made of a chemical substance called ____.", "answer": ["DNA"], "id": "ch07-n017"}, {"source": "nblm", "topic": "7.1", "src": "L|A DNA molecule has a shape like a twisted ladder. This shape is called a double helix.", "explain": "The book says: A DNA molecule has a shape like a twisted ladder. This shape is called a double helix.", "type": "fill", "q": "A DNA molecule has a shape like a twisted ladder. This shape is called a double ____.", "answer": ["helix"], "id": "ch07-n018"}, {"source": "nblm", "topic": "7.2", "src": "L|Inheritance means passing on DNA (as chromosomes containing genes) from parents to offspring.", "explain": "The book says: Inheritance means passing on DNA (as chromosomes containing genes) from parents to offspring.", "type": "fill", "q": "____ means passing on DNA (as chromosomes containing genes) from parents to offspring.", "answer": ["Inheritance"], "id": "ch07-n021"}, {"source": "nblm", "topic": "7.3", "src": "L|The differences between individuals belonging to the same species are called variation.", "explain": "The book says: The differences between individuals belonging to the same species are called variation.", "type": "fill", "q": "The differences between individuals belonging to the same species are called ____.", "answer": ["variation"], "id": "ch07-n022"}, {"source": "nblm", "topic": "7.3", "src": "L|Differences in the DNA of organisms within a species are called genetic differences.", "explain": "The book says: Differences in the DNA of organisms within a species are called genetic differences.", "type": "fill", "q": "Differences in the DNA of organisms within a species are called ____ differences.", "answer": ["genetic"], "id": "ch07-n023"}, {"source": "nblm", "topic": "7.1", "src": "L|A DNA molecule has a shape like a twisted ladder. This shape is called a double helix.", "explain": "A marker looks for: twisted ladder, double helix", "type": "short", "q": "Describe the shape of a DNA molecule.", "answer": "A DNA molecule has a shape like a twisted ladder, which is called a double helix.", "keywords": ["twisted ladder", "double helix"], "id": "ch07-n027"}, {"source": "nblm", "topic": "7.1", "src": "L|there are different versions of these genes, so one person could have a chromosome 15 with eye colour genes that give them blue eyes", "explain": "A marker looks for: different versions, slightly different DNA", "type": "short", "q": "Explain why two sisters might have different eye colours even though the genes for eye colour are on the same chromosome.", "answer": "They can have different eye colours because there are different versions of these genes, each made of slightly different DNA.", "keywords": ["different versions", "slightly different DNA"], "id": "ch07-n030"}, {"source": "nblm", "topic": "7.1", "src": "L|Remember that there are two chromosomes of each type.", "explain": "A marker looks for: two chromosomes, of each type", "type": "short", "q": "In the investigation making models of chromosomes in a cell, suggest why you must make two sets of chromosomes for your chosen animal species.", "answer": "You must make two sets because there are two chromosomes of each type in the cells of an animal.", "keywords": ["two chromosomes", "of each type"], "id": "ch07-n031"}, {"source": "nblm", "topic": "7.2", "src": "L|All eggs contain an X chromosome. Half of all sperm cells contain an X chromosome, and half contain a Y chromosome.", "explain": "A marker looks for: egg cells, all contain an X, sperm cells, half contain", "type": "short", "q": "In the investigation modelling sex inheritance using pots and pieces of string, explain why 30 X chromosomes are put in one pot, but 15 X and 15 Y are put in the other.", "answer": "The first pot represents egg cells which all contain an X chromosome, while the second pot represents sperm cells where half contain an X and half contain a Y chromosome.", "keywords": ["egg cells", "all contain an X", "sperm cells", "half contain"], "id": "ch07-n037"}, {"source": "nblm", "topic": "7.2", "src": "L|One person puts their hand into the first pot – without looking – and takes out a piece of string", "explain": "A marker looks for: without looking, chance", "type": "short", "q": "In the investigation modelling sex inheritance, suggest why the person must take the pieces of string out of the pots without looking.", "answer": "They must pick without looking to ensure that the combination of chromosomes is completely random, just like the chances of fertilisation.", "keywords": ["without looking", "chance"], "id": "ch07-n038"}, {"source": "nblm", "topic": "7.3", "src": "L|The differences between individuals belonging to the same species are called variation.", "explain": "A marker looks for: differences between individuals, same species", "type": "short", "q": "Describe what is meant by the scientific term variation.", "answer": "Variation refers to the differences between individuals that belong to the same species.", "keywords": ["differences between individuals", "same species"], "id": "ch07-n039"}, {"source": "nblm", "topic": "7.3", "src": "L|When a sperm cell and egg cell fuse together at fertilisation, the zygote that is produced has a new combination of DNA.", "explain": "A marker looks for: different versions of genes, fuse together, new combination", "type": "short", "q": "Explain how a new combination of DNA is produced in an offspring that makes it slightly different from its parents.", "answer": "Different sperm and egg cells contain different versions of genes, and when they fuse together at fertilisation, the resulting zygote has a unique new combination of DNA.", "keywords": ["different versions of genes", "fuse together", "new combination"], "id": "ch07-n040"}, {"source": "nblm", "topic": "7.3", "src": "L|one goat might eat more than another, so it would grow fatter and have a greater body mass.", "explain": "A marker looks for: environment, how much food, grow fatter", "type": "short", "q": "Suggest why the body mass of an animal is not caused by its genes alone.", "answer": "Body mass is also affected by the animal's environment, such as how much food it eats, which can cause it to grow fatter.", "keywords": ["environment", "how much food", "grow fatter"], "id": "ch07-n041"}, {"source": "nblm", "topic": "7.3", "src": "L|they do not fit into definite categories, so you will have to determine the categories yourself.", "explain": "A marker looks for: do not fit into definite categories, same range", "type": "short", "q": "In the investigation measuring human wrist circumference, explain why the measurements must be grouped into different categories.", "answer": "The data collected are continuous and do not fit into definite categories automatically, so you must group the measurements into categories with the same range to draw a frequency diagram.", "keywords": ["do not fit into definite categories", "same range"], "id": "ch07-n043"}, {"source": "nblm", "topic": "7.3", "src": "L|add up all the tally strokes and complete the last column in the table.", "explain": "A marker looks for: add up, tally strokes, complete the last column", "type": "short", "q": "When recording results in a tally chart for an investigation of variation, describe what you must do to complete the last column for the number of people.", "answer": "You must add up all the tally strokes you recorded for each category and write the total number in the last column.", "keywords": ["add up", "tally strokes", "complete the last column"], "id": "ch07-n044"}, {"source": "nblm", "topic": "7.3", "src": "L|The median is the middle value for the number of leaflets.", "explain": "A marker looks for: middle value, most common value", "type": "short", "q": "Describe the difference between the median and the mode when analysing results.", "answer": "The median is the middle value in a set of data, while the mode is the most common value that appears.", "keywords": ["middle value", "most common value"], "id": "ch07-n047"}, {"source": "nblm", "topic": "7.4", "src": "W|how many green caterpillars and how many yellow caterpillars Marcus picks up", "explain": "A marker looks for: how many green caterpillars, how many yellow caterpillars", "type": "short", "q": "In the investigation using green and yellow pasta to model camouflaged caterpillars on grass, describe what observations the students should make to test their idea.", "answer": "The students should observe and record how many green caterpillars and how many yellow caterpillars the person picks up.", "keywords": ["how many green caterpillars", "how many yellow caterpillars"], "id": "ch07-n052"}, {"source": "nblm", "topic": "7.4", "src": "W|Repeat the experiment five times with the same caterpillars, using five different students to collect them.", "explain": "A marker looks for: repeat the experiment, five different students", "type": "short", "q": "In the camouflaged caterpillars experiment, suggest how the students could improve their method to make their conclusion more reliable.", "answer": "They should repeat the experiment five times using five different students to collect the caterpillars.", "keywords": ["repeat the experiment", "five different students"], "id": "ch07-n053"}, {"source": "nblm", "topic": "7.1", "src": "L|Chromosomes also need to be coloured using special stains, in order to be able to see them.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'You can see the structure of chromosomes with a microscope without preparing them in any special way.' Explain what is wrong with this.", "answer": "Chromosomes must be coloured with specific chemical dyes to make them visible under a microscope.", "keywords": ["chromosomes", "coloured", "specific", "chemical"], "id": "ch07-n075"}, {"source": "nblm", "topic": "7.1", "src": "L|We cannot see these twists when we use microscopes to look at chromosomes, because DNA molecules are much too small to see.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'The twisted ladder shape of DNA can be seen when viewing chromosomes under a light microscope.' Explain what is wrong with this.", "answer": "The double helix structure of DNA is far too incredibly small to be seen using standard microscopes.", "keywords": ["small", "microscopes", "double", "helix"], "id": "ch07-n078"}, {"source": "nblm", "topic": "7.1", "src": "L|Different species of organism have different numbers of chromosomes in the nuclei of their cells.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'All organisms, such as humans, fruit flies and mango trees, have the same number of chromosomes.' Explain what is wrong with this.", "answer": "Different species of organisms have entirely different specific numbers of chromosomes in their cells.", "keywords": ["species", "numbers", "chromosomes", "cells"], "id": "ch07-n079"}, {"source": "nblm", "topic": "7.1", "src": "L|Remember that there are two chromosomes of each type.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Animal cells only contain one single copy of each type of chromosome.' Explain what is wrong with this.", "answer": "Ordinary plant and animal cells contain two complete sets, meaning there are two chromosomes of each type.", "keywords": ["chromosomes", "type", "ordinary", "plant"], "id": "ch07-n080"}, {"source": "nblm", "topic": "7.2", "src": "L|But gametes have only one set of chromosomes.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Sperm cells and egg cells contain the standard 46 chromosomes found in other human cells.' Explain what is wrong with this.", "answer": "Gametes only contain 23 chromosomes, which is one single set, so they can fuse to make a total of 46.", "keywords": ["gametes", "chromosomes", "contain", "single"], "id": "ch07-n082"}, {"source": "nblm", "topic": "7.2", "src": "L|Egg cells are much bigger than sperm cells, but they are still very small.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Egg cells and sperm cells are identical in physical size.' Explain what is wrong with this.", "answer": "Egg cells are significantly larger than sperm cells because they must hold important food reserves in their cytoplasm.", "keywords": ["cells", "sperm", "significantly", "larger"], "id": "ch07-n084"}, {"source": "nblm", "topic": "7.2", "src": "L|All eggs contain an X chromosome.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Human egg cells can carry either an X chromosome or a Y chromosome.' Explain what is wrong with this.", "answer": "Every single human egg cell contains exactly one X chromosome and never a Y chromosome.", "keywords": ["chromosome", "every", "single", "human"], "id": "ch07-n086"}, {"source": "nblm", "topic": "7.2", "src": "L|A baby’s sex is determined because a baby inherits X or Y chromosomes from its parents.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'The sex of a baby is a purely random event and not related to the inheritance of chromosomes.' Explain what is wrong with this.", "answer": "A baby's sex is determined specifically by the combination of X and Y sex chromosomes it inherits from its parents.", "keywords": ["baby", "determined", "chromosomes", "inherits"], "id": "ch07-n087"}, {"source": "nblm", "topic": "7.3", "src": "L|But individual organisms that belong to the same species also have differences between them.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Organisms that belong to the exact same species are completely identical to each other.' Explain what is wrong with this.", "answer": "Even within the very same species, individual organisms naturally show differences known as variation.", "keywords": ["species", "individual", "organisms", "differences"], "id": "ch07-n088"}, {"source": "nblm", "topic": "7.3", "src": "L|When a sperm cell and egg cell fuse together at fertilisation, the zygote that is produced has a new combination of DNA.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Brothers and sisters inherit the exact same combination of DNA since they share the same parents.' Explain what is wrong with this.", "answer": "When gametes fuse during fertilisation, they create a completely unique new combination of DNA that differs between siblings.", "keywords": ["fuse", "fertilisation", "combination", "gametes"], "id": "ch07-n089"}, {"source": "nblm", "topic": "7.3", "src": "L|Not all variation within a species is caused by differences in DNA.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'All variation between individuals of a species is caused entirely by genetic differences in their DNA.' Explain what is wrong with this.", "answer": "An organism's environment, such as its diet or lifestyle, also significantly affects its features and causes variation.", "keywords": ["variation", "organism", "environment", "diet"], "id": "ch07-n090"}, {"source": "nblm", "topic": "7.3", "src": "L|This is because they do not fit into definite categories, so you will have to determine the categories yourself.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Measurements of continuous variation, like human wrist circumference, naturally fall into pre-existing clear categories.' Explain what is wrong with this.", "answer": "Continuous data does not fit into definite categories automatically, so you must define the category ranges yourself before plotting them.", "keywords": ["definite", "categories", "yourself", "continuous"], "id": "ch07-n092"}, {"source": "nblm", "topic": "7.4", "src": "W|More parent lizards with blue tails survive, so they are the ones that reproduce. They pass on their genes for blue tails to their offspring.", "explain": "This is a common misconception; the book corrects it directly.", "type": "short", "q": "A student says: 'Animals intentionally change their own physical features, like their tail colour, in order to avoid predators.' Explain what is wrong with this.", "answer": "Animals do not change their features intentionally; instead, those that happen to have advantageous genes survive and pass them on.", "keywords": ["genes", "survive", "pass", "animals"], "id": "ch07-n093"}, {"id": "qwen-01-01", "type": "mcq", "topic": "7.1", "source": "qwen", "q": "When are chromosomes visible under a light microscope?", "explain": "The text states that chromosomes only become visible with a light microscope when a cell is dividing.", "src": "L|chromosomes only become visible with a light microscope when a cell is dividing", "options": ["Only when the cell is dividing", "At all times in every cell", "Only in red blood cells", "Only when the cell is dead"], "answer": 0}, {"id": "qwen-01-02", "type": "fill", "topic": "7.1", "source": "qwen", "q": "Chromosomes need to be coloured using special ____ in order to be seen.", "explain": "The text says chromosomes need special stains to be visible.", "src": "L|Chromosomes also need to be coloured using special stains", "answer": ["stains"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "7.1", "source": "qwen", "q": "How many chromosomes are in a human cell?", "explain": "The text explicitly states that human cells have 46 chromosomes.", "src": "L|Human cells have 46 chromosomes", "options": ["46", "23", "8", "40"], "answer": 0}, {"id": "qwen-01-04", "type": "fill", "topic": "7.1", "source": "qwen", "q": "Each chromosome is made up of hundreds of different ____.", "explain": "The text defines chromosomes as being made of genes.", "src": "L|Each chromosome is made up of hundreds of different genes", "answer": ["genes"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "What is the name of the new cell formed when a sperm and egg join?", "explain": "The text states the new cell formed is called a zygote.", "src": "L|is called a zygote", "options": ["Zygote", "Gamete", "Nucleus", "Chromosome"], "answer": 0}, {"id": "qwen-01-10", "type": "fill", "topic": "7.2", "source": "qwen", "q": "A person with two X chromosomes is ____.", "explain": "The text states that a person with two X chromosomes is female.", "src": "L|A person with two X chromosomes, XX, is female", "answer": ["female"]}, {"id": "qwen-01-11", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "Which sex chromosome is much smaller than the X chromosome?", "explain": "The text states that a Y chromosome is much smaller than an X chromosome.", "src": "L|A Y chromosome is much smaller than an X chromosome", "options": ["Y chromosome", "X chromosome", "Chromosome 1", "Chromosome 2"], "answer": 0}, {"id": "qwen-02-03", "type": "mcq", "topic": "7.3", "source": "qwen", "q": "Which factor can cause a goat to have a greater body mass?", "explain": "The text explains that if one goat eats more than another, it grows fatter and has greater body mass, which is not caused by genes.", "src": "L|one goat might eat more than another, so it would grow fatter and have a greater body mass", "options": ["Its genes only", "Eating more food", "The colour of its coat", "The shape of its horns"], "answer": 1}, {"id": "qwen-02-04", "type": "fill", "topic": "7.3", "source": "qwen", "q": "A sperm cell and an egg cell each contain chromosomes made of many ____.", "explain": "The text states that sperm and egg cells contain chromosomes, which are made of many genes.", "src": "L|A sperm cell and an egg cell each contain chromosomes, made of many genes", "answer": ["genes"]}, {"id": "qwen-02-06", "type": "fill", "topic": "7.4", "source": "qwen", "q": "In the story about the long-necked herbivores of Africa, the long-necked animals survived because they could still reach ____ when the lower leaves had been eaten.", "explain": "The text states that only long-necked animals could get food after the lower leaves were eaten.", "src": "L|only the longnecked animals could get food", "answer": ["food"]}, {"id": "qwen-02-08", "type": "fill", "topic": "7.4", "source": "qwen", "q": "The process where advantageous features become more common over generations is called natural ____.", "explain": "The text defines this process of passing on advantageous genes as natural selection.", "src": "L|This process is called natural selection", "answer": ["selection"]}, {"id": "qwen-02-09", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "How do bacteria become resistant to antibiotics?", "explain": "The text explains that resistant bacteria survive and multiply, making the resistance gene more common.", "src": "L|The resistant one can now multiply and form a population of resistant bacteria", "options": ["They eat the antibiotic and get stronger", "A gene for resistance becomes more common in the population", "The antibiotic changes their DNA directly", "They hide from the medicine in the soil"], "answer": 1}, {"id": "qwen-02-12", "type": "fill", "topic": "7.3", "source": "qwen", "q": "In a frequency diagram, the bars should ____ one another.", "explain": "The instructions for drawing a frequency diagram state that the bars should touch one another.", "src": "L|The bars in your frequency diagram should touch one another", "answer": ["touch"]}, {"id": "qwen-03-02", "type": "fill", "topic": "7.4", "source": "qwen", "q": "Dark moths passed on their genes for dark colour to their ____, which helped the trait become more common.", "explain": "The text explains that dark moths passed on their genes to their offspring.", "src": "L|They passed on their genes for their dark colour to their offspring.", "answer": ["offspring"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "Which variety of peppered moth is the most common in England today, and why?", "explain": "The text says pollution is less, lichens grow again, and most moths are now the pale variety.", "src": "L|Today, most peppered moths are the pale variety.", "options": ["Most are now dark because pollution is still high", "Most are now pale because lichens grow on tree trunks again", "Both dark and pale moths have disappeared", "Only dark moths survive in England now"], "answer": 1}, {"id": "qwen-03-07", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "In most human cells, how many copies of each chromosome thread are there?", "explain": "The text states there are two copies of each thread in most cells.", "src": "L|In most cells, there are .................. copies of each thread.", "options": ["One", "Two", "Four", "Twenty-three"], "answer": 1}, {"id": "qwenw-01-02", "type": "fill", "topic": "7.2", "source": "qwen", "q": "Egg cells and sperm cells are specialised cells called ____.", "explain": "The text defines egg and sperm cells as gametes.", "src": "W|Egg cells and sperm cells are specialised cells called", "answer": ["gametes"]}, {"id": "qwenw-01-04", "type": "fill", "topic": "7.2", "source": "qwen", "q": "A sperm cell can join with an egg cell in a process called ____.", "explain": "The text names the joining process as fertilisation.", "src": "W|A sperm cell can join with an egg cell in a process called", "answer": ["fertilisation"]}, {"id": "qwenw-01-06", "type": "fill", "topic": "7.2", "source": "qwen", "q": "The nucleus of a sperm cell contains ____ chromosomes.", "explain": "The text specifies the number of chromosomes in a sperm nucleus.", "src": "W|nucleus, containing 23 chromosomes", "answer": ["23"]}, {"id": "qwenw-01-07", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "Which structure in an egg cell contains food reserves?", "explain": "The diagram label for the egg cell indicates the cytoplasm contains food reserves.", "src": "W|cytoplasm, containing food reserves", "options": ["cytoplasm", "nucleus", "tail", "membrane"], "answer": 0}, {"id": "qwenw-01-11", "type": "mcq", "topic": "7.2", "source": "qwen", "q": "What part of a sperm cell produces swimming movements?", "explain": "The diagram label for the sperm cell states the tail produces swimming movements.", "src": "W|tail, which produces swimming movements", "options": ["tail", "nucleus", "cytoplasm", "membrane"], "answer": 0}, {"id": "qwenw-02-01", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "What happens to a lizard's tail when it is attacked by a predator?", "explain": "The text states that when attacked, the tail falls off and squirms violently to attract attention.", "src": "W|the lizard’s tail falls off. The tail squirms violently", "options": ["It falls off and squirms to attract the predator", "It hardens to protect the body", "It changes colour to match the ground", "It grows longer to fight back"], "answer": 0}, {"id": "qwenw-02-02", "type": "fill", "topic": "7.4", "source": "qwen", "q": "While the predator is attacking the tail, the lizard runs off and hides. It then grows a new ____.", "explain": "The text says the lizard hides and then grows a new tail.", "src": "W|the lizard runs off and hides. It grows a new tail", "answer": ["tail"]}, {"id": "qwenw-02-04", "type": "fill", "topic": "7.4", "source": "qwen", "q": "The part of a lizard's cell that contains its genes is the ____.", "explain": "Genes are located in the nucleus of the cell.", "src": "W|Which part of the lizard’s cells contains genes?", "answer": ["nucleus"]}, {"id": "qwenw-02-06", "type": "fill", "topic": "7.4", "source": "qwen", "q": "In a grassy area, green caterpillars are less likely to be found by predators than ____ caterpillars.", "explain": "The text compares green and yellow caterpillars in a grassy area.", "src": "W|green caterpillars are less likely to be found by a predator than yellow", "answer": ["yellow"]}, {"id": "qwenw-02-07", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "Sofia and Zara spread 50 green and 50 yellow pasta 'caterpillars' over a grassy area, then ask Marcus to pick up the first 20 he can find. What should they measure to test their idea?", "explain": "To test if one colour is harder to find, they need to count how many of each are found.", "src": "W|how many green caterpillars and how many yellow caterpillars Marcus picks up", "options": ["How many green and yellow caterpillars Marcus picks up", "The time taken for Marcus to find 20 caterpillars", "Which hand Marcus uses to pick them up", "The weight of the pasta pieces"], "answer": 0}, {"id": "qwenw-02-09", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "On an island where snakes are the main predator, lizards with blue tails survive better than lizards with brown tails. Why are more lizards born with blue tails in the next generation?", "explain": "Natural selection means those who survive (blue-tailed) pass on their genes.", "src": "W|More parent lizards with blue tails survive, so they are the ones that reproduce", "options": ["More parent lizards with blue tails survive and reproduce", "Lizards change their tail colour to avoid snakes", "Lizards learn that blue tails are safer", "Snakes eat only brown-tailed lizards' eggs"], "answer": 0}, {"id": "qwenw-02-10", "type": "fill", "topic": "7.4", "source": "qwen", "q": "Woolly mammoths had very long, thick hair which ____ them in cold climates.", "explain": "The text states the hair insulated them in cold climates.", "src": "W|which insulated them in the cold climates in which they lived", "answer": ["insulated"]}, {"id": "qwenw-02-11", "type": "mcq", "topic": "7.4", "source": "qwen", "q": "What did scientists think woolly mammoths used their huge tusks for?", "explain": "The text suggests they used tusks to clear snow to find plants underneath.", "src": "W|used their tusks to clear away snow, to find plants underneath", "options": ["To clear away snow to find plants", "To fight other mammoths for territory", "To dig holes in the ground to sleep", "To break branches off trees"], "answer": 0}], "figures": {"img/L_p02_plant_cell_chromosomes.png": {"caption": "A plant cell that is just beginning to divide. A special stain has coloured the chromosomes dark red.", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCADxAjoDAREAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAIDAQQFBgf/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIDBAUG/9oADAMBAAIQAxAAAAH6oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAanJfT5tBKJlWcTMZiNowFZRbBOJhMZMxIlExmJ1nExCyys4MkZrmJEZYlKJlCu0TqGFZiEZnMCcwnExs3fR57NqgAAAAAAAAAAAAcHw+nheJ1V2i2lrs7wtWyJzFqbxC1MxJM4lFpRGTMTbScxEZnFk1cVvr6xOsRmMSlCdbQsjKUTC0SrXMRYiUIwjNrKoWSrNlZqu9J9f5e534gAAAAAAAAAAAAcHxOnheF1YmZRN+doy1tqZhfkytmGV8InERmYWiylpRArvC+OK6TpeMxlOYWUmu8AmNpsoyYJzVEYqymMxiULRGZspacR6L6/zdz0MQAAAAAAAAAAAAOD4nVwPD6sStra3NOt9PozKzraUQMxaFqzraMxiVlbVXRtSyCsYXjMZVLRmJ1mys12WV0lDhd2W9jTappKsTztdS0JpdS1dlOiFqzreUPT/AFvmbnfiAAAAAAAAAAAABwfE6vPeL1ShmE62upbV2iE5STKsyi0ZjExVaLa2rtE62siZTTNJjN4TSFpym2kxVupbzHqxq6Ye38Ps816dOB6FPY+O2Kzmk6+lLaRsZWtraE1haYWrOt42n1X1XmbvfiAAAAAAAAAAAABwPE6uH4fWWlWpecRbS2ptnOIzFi2ECu9sxXKZRCyq1Z0tiWEzrWyuglESrPA9GeL25ex8jq8H7fn9nj09L528JrlOYjS35t7n22sLVaRhFdxaUPU/V+bu9+IAwDRNguBkwco6wAAAAAAOD4nVwvE68E63zFoWzspNd4zFo2jATKJhNKtJkmSisovKItrfCsokEWV0o0psZa/P/oObu8e/C6+P2HldO1jMqziaUa     }).forEach(function(p, i){
      CARDS.push({id:q.id+'-'+p.n, type:'label', topic:q.topic, source:q.source,
                  q:q.q.replace('{n}', p.n), image:q.image, pin:p, explain:q.explain, src:q.src});
    });
  } else { CARDS.push(q); }
});

var state = load();
var view = [], idx = 0, shown = false, picked = null, mark = null;
var mode = 'flash';                       // flash | quiz
var filter = {type:'all', topic:'all'};

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

var TYPES = ['all','mcq','fill','short','label','hotspot'];
var TOPICS = ['all'].concat(Object.keys(CARDS.reduce(function(a,c){ a[c.topic]=1; return a; },{})).sort());

function buildFilters(){
  var f = document.getElementById('filters');
  f.innerHTML = '';
  TYPES.forEach(function(t){
    var n = t==='all' ? CARDS.length : CARDS.filter(function(c){return c.type===t;}).length;
    if(!n) return;
    var b = el('span','chip'+(filter.type===t?' on':''), (t==='all'?'All':cap(t))+' '+n);
    b.onclick = function(){ filter.type = t; refresh(); };
    f.appendChild(b);
  });
  var sep = el('span','', '|'); sep.style.color='#c3cad2'; f.appendChild(sep);
  TOPICS.forEach(function(t){
    var b = el('span','chip'+(filter.topic===t?' on':''), t==='all'?'All topics':t);
    b.onclick = function(){ filter.topic = t; refresh(); };
    f.appendChild(b);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function refresh(){
  view = CARDS.filter(function(c){
    return (filter.type==='all'||c.type===filter.type) && (filter.topic==='all'||c.topic===filter.topic);
  });
  idx = 0; buildFilters(); render();
}

function norm(s){
  return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}

function figure(card, opts){
  var f = FIGS[card.image];
  if(!f) return el('div','hint','[figure missing: '+card.image+']');
  var wrap = el('div','fig'+(opts.click?' click':''));
  var img = document.createElement('img'); img.src = f.image; img.alt = '';
  wrap.appendChild(img);
  // every printed label is covered, otherwise the answer is sitting on the diagram
  (f.pins||[]).forEach(function(p){
    var m = el('div','mask');
    m.style.cssText = 'left:'+p.x+'%;top:'+p.y+'%;width:'+p.w+'%;height:'+p.h+'%';
    wrap.appendChild(m);
    if(opts.numberAll || (opts.pin && p.n===opts.pin.n)){
      var d = el('div','pin'+(opts.pin && p.n===opts.pin.n ? '' : ' sm'), String(p.n));
      d.style.cssText += 'left:'+(p.x+p.w/2)+'%;top:'+(p.y+p.h/2)+'%';
      wrap.appendChild(d);
    }
  });
  return wrap;
}

function render(){
  var stage = document.getElementById('stage');
  stage.innerHTML = '';
  document.getElementById('mode').textContent = 'Mode: ' + (mode==='flash'?'Flashcards':'Quiz');
  var done = Object.keys(state).length;
  document.getElementById('pbar').style.width = Math.min(100, 100*done/CARDS.length)+'%';
  var right = 0, wrong = 0;
  Object.keys(state).forEach(function(k){ state[k]==='g' ? right++ : wrong++; });
  document.getElementById('score').textContent = right+' known / '+wrong+' to review';

  if(!view.length){ stage.appendChild(el('div','done','Nothing matches this filter.')); return; }
  if(idx >= view.length){
    var d = el('div','done');
    d.appendChild(el('div','big', right+'/'+CARDS.length));
    d.appendChild(el('h2','','Set finished'));
    d.appendChild(el('p','','Use the filters above to review a type again, or press Reset to start over.'));
    stage.appendChild(d); return;
  }
  document.getElementById('pos').textContent = 'Card '+(idx+1)+' of '+view.length;

  var c = view[idx], card = el('div','card');
  var h = el('p','q');
  h.appendChild(el('span','tag', c.type==='mcq'?'Multiple choice':c.type==='fill'?'Fill the gap':cap(c.type)));
  h.appendChild(document.createTextNode(c.q));
  card.appendChild(h);

  if(c.type==='label'){
    card.appendChild(figure(c, {pin:c.pin, numberAll:true}));
  } else if(c.type==='hotspot'){
    card.appendChild(el('div','hint','Click the correct place on the diagram.'));
    var w = figure(c, {click:true});
    w.onclick = function(ev){
      if(shown) return;
      var r = w.getBoundingClientRect();
      var x = 100*(ev.clientX-r.left)/r.width, y = 100*(ev.clientY-r.top)/r.height;
      var t = c.target;
      picked = {x:x, y:y, ok: Math.hypot(x-t.x, y-t.y) <= t.r};
      shown = true; mark = picked.ok ? 'g' : 'a'; commit(c); render();
    };
    card.appendChild(w);
  }

  if(c.type==='mcq'){
    c.options.forEach(function(o,i){
      var b = el('button','opt');
      b.appendChild(el('b','', 'ABCD'[i]));
      b.appendChild(document.createTextNode(o));
      if(shown){
        if(i===c.answer) b.className='opt right';
        else if(i===picked) b.className='opt wrong';
      } else if(i===picked) b.className='opt pick';
      b.onclick = function(){ if(shown) return; picked=i; shown=true; mark = (i===c.answer)?'g':'a'; commit(c); render(); };
      card.appendChild(b);
    });
  }
  if(c.type==='fill' && !shown){
    var inp = document.createElement('input'); inp.type='text'; inp.placeholder='Type your answer, then press Enter';
    inp.onkeydown = function(e){
      if(e.key!=='Enter') return;
      picked = inp.value; shown = true;
      mark = (c.answer||[]).some(function(a){ return norm(a)===norm(inp.value); }) ? 'g' : 'a';
      commit(c); render();
    };
    card.appendChild(inp);
    setTimeout(function(){ inp.focus(); }, 0);
  }

  if(shown){
    var a = el('div','ans'+(mark==='a'?' miss':''));
    a.appendChild(el('div','lab','Answer'));
    var txt = c.type==='mcq' ? c.options[c.answer]
            : c.type==='fill' ? (c.answer||[]).join(' / ')
            : c.type==='label' ? c.pin.text
            : c.type==='hotspot' ? 'See the marked position on the diagram.'
            : c.answer;
    var b = el('div'); b.appendChild(el('b','', txt)); a.appendChild(b);
    if(c.type==='fill' && picked) a.appendChild(el('div','kw','You typed: '+picked));
    if(c.keywords) a.appendChild(el('div','kw','Must mention: '+c.keywords.join(', ')));
    if(c.explain) a.appendChild(el('div','','' + c.explain));
    if(c.src) a.appendChild(el('div','src','Source: '+c.src.replace(/^[LW]\|/,'')));
    card.appendChild(a);
    if(c.type==='hotspot' && picked){
      var w2 = card.querySelector('.fig');
      var d1 = el('div','dot'); d1.style.cssText='left:'+picked.x+'%;top:'+picked.y+'%';
      var d2 = el('div','dot ok'); d2.style.cssText='left:'+c.target.x+'%;top:'+c.target.y+'%';
      w2.appendChild(d1); w2.appendChild(d2);
    }
  }

  var acts = el('div','acts');
  if(!shown){
    // in Quiz mode an answerable card must actually be attempted; only open-ended
    // types (short, label) keep the reveal button, because nothing can mark them
    var mustTry = mode==='quiz' && (c.type==='mcq'||c.type==='fill'||c.type==='hotspot');
    if(!mustTry){
      var s = el('button','b p','Show answer'); s.onclick = function(){ shown=true; render(); }; acts.appendChild(s);
    } else {
      acts.appendChild(el('div','hint','Answer the card to continue.'));
    }
  } else {
    var g = el('button','b g','Got it'); g.onclick = function(){ mark='g'; commit(c); next(); };
    var r2 = el('button','b r','Review again'); r2.onclick = function(){ mark='a'; commit(c); next(); };
    var n = el('button','b p','Next →'); n.onclick = next;
    acts.appendChild(g); acts.appendChild(r2); acts.appendChild(n);
  }
  card.appendChild(acts);
  stage.appendChild(card);
}

function commit(c){ if(mark){ state[c.id] = mark; save(); } }
function next(){ shown=false; picked=null; mark=null; idx++; render(); }

document.getElementById('mode').onclick = function(){ mode = mode==='flash'?'quiz':'flash'; shown=false; picked=null; render(); };
document.getElementById('shuf').onclick = function(){
  for(var i=view.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=view[i]; view[i]=view[j]; view[j]=t; }
  idx=0; shown=false; picked=null; render();
};
document.getElementById('rst').onclick = function(){ state={}; save(); idx=0; shown=false; picked=null; render(); };
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  var c = view[idx]; if(!c) return;
  if(e.key===' '){ e.preventDefault(); if(!shown){ shown=true; render(); } else next(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='g' && shown){ mark='g'; commit(c); next(); }
  else if(e.key==='a' && shown){ mark='a'; commit(c); next(); }
  else if(!shown && c.type==='mcq' && '1234'.indexOf(e.key)>=0){
    var i = +e.key-1; if(i < c.options.length){ picked=i; shown=true; mark=(i===c.answer)?'g':'a'; commit(c); render(); }
  }
});
refresh();
})();
</script>
</body>
</html>
