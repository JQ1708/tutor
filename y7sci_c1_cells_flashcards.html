], "x": 6.1, "y": 43.5, "w": 24.5, "h": 5.2}, {"n": 4, "text": "cytoplasm", "alt": [], "x": 14.7, "y": 56.6, "w": 17.1, "h": 5.2}, {"n": 5, "text": "nucleus", "alt": [], "x": 20.0, "y": 71.9, "w": 12.7, "h": 5.2}], "src": "W|trigger"}, {"id": "y7c01-f10h1", "type": "hotspot", "topic": "1.4", "source": "opus", "image": "img/W_p14_sting_cell.png", "figure": "W_p14_sting_cell", "q": "Click on the label of the part that shoots out and wraps around the prey.", "caption": "A sting cell from a hydra, before it fires.", "target": {"x": 21.2, "y": 34.1, "r": 7.0}, "explain": "The coiled thread is stored inside the cell and shoots out when the trigger is touched.", "src": "W|coiled thread"}, {"id": "y7c01-f10h2", "type": "hotspot", "topic": "1.4", "source": "opus", "image": "img/W_p14_sting_cell.png", "figure": "W_p14_sting_cell", "q": "Click on the label of the part that the prey animal touches to fire the cell.", "caption": "A sting cell from a hydra, before it fires.", "target": {"x": 27.4, "y": 14.3, "r": 7.0}, "explain": "When a prey animal touches the trigger, the thread shoots out.", "src": "W|trigger"}, {"id": "y7c01-f10h3", "type": "hotspot", "topic": "1.4", "source": "opus", "image": "img/W_p14_sting_cell.png", "figure": "W_p14_sting_cell", "q": "Click on the label of the part that controls the activities of this cell.", "caption": "A sting cell from a hydra, before it fires.", "target": {"x": 26.4, "y": 74.5, "r": 7.0}, "explain": "The nucleus controls the activities of the cell, in a sting cell just as in any other animal cell.", "src": "W|nucleus"}, {"id": "y7c01-r001", "type": "short", "topic": "1.1", "source": "opus", "q": "Cells were only described after the microscope was invented in the 1600s, even though people had been studying plants and animals for thousands of years. Explain why.", "answer": "Cells are far too small for the naked eye to resolve, so no amount of careful looking without a lens could ever reveal them. A microscope magnifies the view, making the cells look much bigger than they really are, and only then do the tiny 'boxes' become visible. So the limit was never the observers' effort or care, it was the resolving power of the eye, and it took a new instrument to remove that limit.", "keywords": ["too small", "cannot see with eyes alone", "microscope magnifies", "new instrument"], "explain": "Links the definition of a cell to the limits of human sight, and explains why technology, not effort, was the bottleneck.", "src": "L|Cells are so small that you cannot see them with your eyes alone."}, {"id": "y7c01-r002", "type": "short", "topic": "1.1", "source": "opus", "q": "A plant cell and an animal cell are both placed in the same watery solution. The plant cell keeps its shape but the animal cell does not. Explain this difference.", "answer": "Every plant cell has a cell wall, and the wall is strong and stiff, so it holds the plant cell in shape no matter what the cell contents do. An animal cell has only a cell membrane, which is very thin and flexible, like the skin of a soap bubble, so it cannot resist being pushed out of shape. The difference in behaviour therefore comes from the presence of a rigid outer layer, not from the membrane.", "keywords": ["cell wall", "strong and stiff", "holds the cell in shape", "animal cell has no wall", "membrane is flexible"], "explain": "Forces the student to attribute a whole-cell property to one specific structure.", "src": "L|cell wall Every plant cell has a cell wall."}, {"id": "y7c01-r003", "type": "short", "topic": "1.1", "source": "opus", "q": "Cellulose is a substance humans cannot digest. Suggest why a plant still builds its cell walls out of it.", "answer": "The job of a plant cell wall is to be strong and stiff so that it holds the cell in shape, and cellulose is a substance that does exactly that. Being hard to break down is an advantage for the plant, not a problem, because a wall that dissolved or was digested easily would stop supporting the cell. Whether humans can digest it is irrelevant to the plant; the property that matters is mechanical strength.", "keywords": ["cellulose", "strong and stiff", "supports the cell", "hard to break down is an advantage"], "explain": "Separates a property that matters to the organism from one that matters to us.", "src": "L|Plant cell walls are made of a substance called cellulose."}, {"id": "y7c01-r004", "type": "short", "topic": "1.1", "source": "opus", "q": "The sap vacuole is described as a space, yet it is one of the most obvious parts of a plant cell under a microscope. Explain why it is so easy to see.", "answer": "The sap vacuole is a large, fluid-filled space inside a plant cell, and it is large enough to take up much of the cell's volume, pushing the other contents to the edges. Because it is filled with cell sap, a solution of sugars and other substances dissolved in water, rather than with jelly-like cytoplasm, it looks clear and different from everything around it. Size plus contrast is what makes it stand out.", "keywords": ["large", "fluid-filled space", "cell sap", "takes up much of the cell", "clear"], "explain": "Explains visibility under a microscope in terms of size and contrast rather than just naming the part.", "src": "L|sap vacuole This is a large, ﬂuid-ﬁlled space inside a plant cell."}, {"id": "y7c01-r005", "type": "short", "topic": "1.1", "source": "opus", "q": "A student says the cell wall is what decides which substances enter a plant cell. Explain why this is wrong.", "answer": "The structure that controls what goes in and out of the cell is the cell membrane, not the cell wall. The wall's job is mechanical: it is strong and stiff and holds the cell in shape. The membrane lies along the inner edge of the cell wall, so it sits between the wall and the cytoplasm and is the last barrier anything must cross. A wall that also selected substances would leave the membrane with nothing to do.", "keywords": ["cell membrane controls what goes in and out", "cell wall gives shape", "membrane inside the wall"], "explain": "A common confusion; the answer separates the mechanical role from the control role.", "src": "L|The cell membrane controls what goes in and out of the cell."}, {"id": "y7c01-r006", "type": "short", "topic": "1.1", "source": "opus", "q": "Cells from a potato growing underground contain no chloroplasts, while cells from a potato plant's leaves contain many. Explain why.", "answer": "Plant cells that are in the sunlight often contain chloroplasts, because the chloroplast is where plants make their food and that process needs light. Leaf cells are in the sunlight, so chloroplasts are useful there. Cells in a potato growing underground never receive light, so chloroplasts in them would be of no use, and the plant does not build structures where they cannot work.", "keywords": ["chloroplasts", "in the sunlight", "where plants make their food", "underground has no light"], "explain": "Applies the light requirement to a case the book does not state directly.", "src": "L|chloroplast Plant cells that are in the sunlight often contain chloroplasts."}, {"id": "y7c01-r007", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why chloroplasts look green, and why this colour is not just decoration.", "answer": "Chloroplasts look green because they contain a green substance called chlorophyll. The chlorophyll is not there for its colour; it is the substance that lets the chloroplast do its job, which is where the plant makes its food. So the green colour is a visible clue that the working substance is present, which is why a cell packed with chloroplasts is also a cell that can make food.", "keywords": ["chlorophyll", "green substance", "inside chloroplasts", "makes food"], "explain": "Turns an observation into evidence about function.", "src": "L|Chloroplasts look green because they contain a green substance called chlorophyll."}, {"id": "y7c01-r008", "type": "short", "topic": "1.1", "source": "opus", "q": "The cytoplasm is described as being like clear jelly. Explain why a cell would die if its cytoplasm were removed, even with the nucleus left intact.", "answer": "Chemical reactions happen inside the cytoplasm, and these reactions keep the cell alive. The nucleus controls the activities of the cell, but controlling an activity is not the same as carrying it out. Remove the cytoplasm and there is nowhere for the life-sustaining reactions to take place, so the instructions from the nucleus would have nothing to act on and the cell could not stay alive.", "keywords": ["chemical reactions happen in the cytoplasm", "keep the cell alive", "nucleus only controls"], "explain": "Distinguishes control from the place where work is actually done.", "src": "L|Chemical reactions happen inside the cytoplasm."}, {"id": "y7c01-r009", "type": "short", "topic": "1.1", "source": "opus", "q": "A muscle cell that is working hard contains far more mitochondria than a cell that is not. Suggest why.", "answer": "Inside mitochondria, energy is released from food. A cell that is working hard needs more energy released every second than a cell that is not, so it needs more of the structures that do that job. Having many mitochondria therefore means the cell can release energy faster, which is exactly what a hard-working cell requires; the number of mitochondria matches the cell's energy demand.", "keywords": ["mitochondria", "energy released from food", "more energy needed", "more mitochondria"], "explain": "Extends a named function into a quantitative prediction.", "src": "L|Inside mitochondria, energy is released from food."}, {"id": "y7c01-r010", "type": "short", "topic": "1.1", "source": "opus", "q": "Some cells lose their nucleus as they mature and can no longer divide or repair themselves. Explain why losing the nucleus has this effect.", "answer": "The nucleus controls the activities of the cell, so it is the part that issues the instructions for what the cell does. Once the nucleus is gone, those instructions are no longer available, so activities that need new instructions, such as dividing or rebuilding damaged parts, cannot be started. The cell may keep working for a while on what is already inside it, but it cannot direct any new activity.", "keywords": ["nucleus controls the activities", "no instructions", "cannot divide or repair"], "explain": "Reasons from control function to a consequence the book does not state.", "src": "L|The nucleus controls the activities of the cell."}, {"id": "y7c01-r011", "type": "short", "topic": "1.1", "source": "opus", "q": "Both the cell wall and the cell membrane surround a plant cell. Explain why a plant cell needs both rather than just one of them.", "answer": "They do different jobs, so one cannot replace the other. The cell wall is strong and stiff and holds the plant cell in shape, but a stiff wall cannot select what passes through it. The cell membrane is very thin and flexible and controls what goes in and out of the cell, but something that thin cannot hold a shape. The plant needs support and control at the same time, so it needs both layers.", "keywords": ["wall is strong and stiff", "membrane controls what goes in and out", "different jobs", "both needed"], "explain": "Argues from the incompatibility of the two jobs rather than just listing differences.", "src": "L|Describe four differences between a cell wall and a cell membrane."}, {"id": "y7c01-r012", "type": "short", "topic": "1.1", "source": "opus", "q": "In the onion slide method a drop of water is put on the slide before the onion is added. Suggest why the water is needed.", "answer": "The drop of water holds the thin layer of onion flat and spread out so that light can pass through it evenly, and it stops the layer drying out and curling while it is being handled. It also lets the cover slip be lowered gently without trapping the specimen against dry glass. Without the water the layer would fold, and folded tissue is several cells thick, so nothing would be in focus at once.", "keywords": ["water", "keeps the layer flat", "stops it drying", "light passes through", "avoids folds"], "explain": "Explains a practical step in terms of what the microscope needs.", "src": "L|2 Use a dropper pipette to put a small drop of water into the middle of a clean microscope slide."}, {"id": "y7c01-r013", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why the onion layer used on a slide must be peeled as thinly as possible.", "answer": "A microscope image is formed by light passing through the specimen, so the specimen has to be thin enough for light to get through. If several layers of cells are stacked on top of each other, the light is blocked and the cells at different depths cannot all be in focus at the same time. Peeling off just the thin layer from the inside of the onion gives a specimen about one cell thick, which is why the view is clear.", "keywords": ["thin", "light passes through", "one cell thick", "otherwise cells overlap", "cannot focus"], "explain": "Ties a practical instruction to how a light microscope actually works.", "src": "L|3 Very carefully, peel the thin layer from the inside of your piece of onion."}, {"id": "y7c01-r014", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why air bubbles under a cover slip are a problem when looking at onion cells.", "answer": "An air bubble is round and bends light very strongly, so it appears as a thick black-edged circle that hides whatever is underneath it. It can also be mistaken for a cell, because it has a dark outline and a clear middle. Either way it costs you part of the view, so the cover slip is lowered gently to push the air out ahead of it rather than trapping it.", "keywords": ["air bubble", "hides the cells", "mistaken for a cell", "lower the cover slip gently"], "explain": "Gives both reasons a bubble matters: it blocks and it misleads.", "src": "L|Try not to get air bubbles under the cover slip."}, {"id": "y7c01-r015", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why the smallest objective lens is turned into place before the slide is even looked at.", "answer": "The smallest, lowest-power lens gives the widest view, so it is the easiest one for finding where the specimen actually is on the slide. It also sits furthest from the slide, so there is no risk of driving the lens into the glass while focusing. Starting at low power therefore solves two problems at once: locating the specimen, and protecting the lens and slide.", "keywords": ["low power first", "widest view", "easier to find the specimen", "lens further from slide", "avoids damage"], "explain": "Two independent reasons, both derived from the geometry of the microscope.", "src": "L|6 Turn the objective lenses on the microscope until the smallest one is over the hole in the stage."}, {"id": "y7c01-r016", "type": "short", "topic": "1.1", "source": "opus", "q": "A student looks at onion cells and says the cells in the picture are about 2 cm across. Explain what is wrong with this statement.", "answer": "The microscope magnifies the view of the cells, so that they look much bigger than they really are. What the student has measured is the size of the image, not the size of the cell. Cells are so small that you cannot see them with your eyes alone, so a real width of 2 cm is impossible. To get the true size you would have to allow for how many times the microscope has magnified the view.", "keywords": ["microscope magnifies", "image is not the real size", "cells are too small to see", "must allow for magnification"], "explain": "Separates the image from the object, the core idea behind magnification.", "src": "L|The microscope magnifies the view of the cells, so that they look much bigger than they really are."}, {"id": "y7c01-r017", "type": "short", "topic": "1.2", "source": "opus", "q": "Animal cells and plant cells share three structures. Explain why it makes sense that these particular three are the shared ones.", "answer": "The shared structures are the cell membrane, cytoplasm and a nucleus, and each does a job that every living cell needs. The membrane controls what goes in and out of the cell, the cytoplasm is where the chemical reactions that keep the cell alive happen, and the nucleus controls the activities of the cell. Structures like the cell wall and chloroplasts relate to jobs only plants do, so only plants have them.", "keywords": ["cell membrane", "cytoplasm", "nucleus", "every cell needs these jobs", "wall and chloroplasts are plant jobs"], "explain": "Explains a pattern instead of memorising a list.", "src": "L|They have a cell membrane, cytoplasm and a nucleus."}, {"id": "y7c01-r018", "type": "short", "topic": "1.2", "source": "opus", "q": "One estimate of the number of cells in a human body is about 100 trillion, and no one knows the exact figure. Suggest why an exact count is impossible.", "answer": "Cells are so small that you cannot see them with your eyes alone, so they can only be counted through a microscope, a tiny sample at a time. A body contains so many that counting them one by one would never finish, and cells are also being made and lost all the time, so the true number changes while you count. Any figure can therefore only be an estimate scaled up from a sample.", "keywords": ["too small to see", "far too many to count", "cells made and lost all the time", "estimate from a sample"], "explain": "Uses the properties of cells to explain a limit on measurement.", "src": "L|One estimate is about 100 trillion."}, {"id": "y7c01-r019", "type": "short", "topic": "1.2", "source": "opus", "q": "Cheek cells are stained with methylene blue before being viewed. Explain why staining is necessary.", "answer": "Cheek cells are almost colourless and very thin, so light passes straight through them and they show almost no contrast against the glass slide. Methylene blue is a dye that will stain the cells blue, making them easier to see, because the stained parts now absorb light while the background does not. The microscope has not changed; what has changed is how much of the light the specimen takes out.", "keywords": ["cells are colourless", "little contrast", "dye stains them blue", "easier to see"], "explain": "Explains staining in terms of contrast, not just 'to see them better'.", "src": "L|Methylene blue is a dye that will stain the cells blue, making them easier to see."}, {"id": "y7c01-r020", "type": "short", "topic": "1.2", "source": "opus", "q": "After rubbing the cotton bud on the slide, you cannot see anything. Explain why this does not mean the transfer failed.", "answer": "You will not be able to see the cells yet, because they are so small. The cells scraped loose from the inside of the cheek are individually invisible to the naked eye, so an apparently empty slide is exactly what a successful transfer looks like. Only after staining and viewing under a microscope can you tell whether cells are there, so judging the step by eye at this point tells you nothing.", "keywords": ["cells are too small to see", "empty-looking slide is expected", "check under the microscope"], "explain": "Teaches that absence of evidence at the wrong magnification is not evidence of absence.", "src": "L|You will not be able to see the cells yet, because they are so small."}, {"id": "y7c01-r021", "type": "short", "topic": "1.2", "source": "opus", "q": "When focusing, you turn the knob while looking from the side rather than through the eyepiece. Explain why.", "answer": "Looking from the side lets you see how much space is left between the lens and the slide. If you watched through the eyepiece instead you could not judge that gap, and you might drive the lens down into the slide, cracking the cover slip or the lens. So the side view is a safety step: it lets you bring the lens close without touching, and you then focus upwards, away from the glass.", "keywords": ["look from the side", "see the gap", "avoid hitting the slide", "protects lens and cover slip"], "explain": "Explains a procedure by the failure it prevents.", "src": "L|7 Looking from the side, turn the focussing knob until the lens is close to the slide."}, {"id": "y7c01-r022", "type": "short", "topic": "1.2", "source": "opus", "q": "When deciding whether a photograph shows a plant cell or an animal cell, which single feature is most useful, and why?", "answer": "The most useful feature is the cell wall, because every plant cell has a cell wall and animal cells have none. A wall shows up as a straight, thick, clearly outlined edge, so cells packed in a regular box-like pattern are plant cells. Chloroplasts are also a giveaway, but they are only present in plant cells that are in the sunlight, so their absence proves nothing, while the wall is always there.", "keywords": ["cell wall", "all plant cells have one", "animal cells have none", "chloroplasts can be absent"], "explain": "Chooses between two candidate features by asking which one can be absent.", "src": "L|What is the most important feature to look for?"}, {"id": "y7c01-r023", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why it is not always possible to tell from a picture whether a cell is a plant cell or an animal cell.", "answer": "A picture only shows the features that happen to be visible in that view. A plant cell from underground has no chloroplasts, so the green clue is missing, and if the cell has been cut or squashed the wall may not show a clear straight edge. The three structures both kinds share, cell membrane, cytoplasm and nucleus, look much the same in either, so a view that shows only those is genuinely ambiguous.", "keywords": ["only shows what is visible", "chloroplasts can be absent", "wall may not be clear", "shared structures look alike"], "explain": "Asks for the limits of an identification method, not just the method.", "src": "L|Do you think that you can always decide whether a picture shows an animal cell or a plant cell?"}, {"id": "y7c01-r024", "type": "short", "topic": "1.2", "source": "opus", "q": "A model of a plant cell is to be turned into a model of an animal cell. Explain what must be removed and why.", "answer": "The cell wall, the chloroplasts and the large sap vacuole must go, because those are the parts an animal cell does not have. The wall is removed because animal cells are held in shape only by a thin, flexible membrane; the chloroplasts because animals do not make their own food; and the large sap vacuole because it belongs to the plant cell's water-filled interior. What stays is the membrane, cytoplasm and nucleus.", "keywords": ["remove cell wall", "remove chloroplasts", "remove large sap vacuole", "keep membrane cytoplasm nucleus"], "explain": "Converts a list of differences into a justified set of edits.", "src": "L|What would you change to make it into a model of an animal cell?"}, {"id": "y7c01-r025", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain what is meant by the statement that your body is made of cells, given that you can see none of them.", "answer": "All living organisms are made of cells, and that includes you: every part of your body is built from cells even though cells are so small that you cannot see them with your eyes alone. What you see is the effect of enormous numbers of them grouped together, in the same way that you see a wall rather than the individual bricks. The cells are there; they are simply below the resolving power of your eye.", "keywords": ["all organisms are made of cells", "too small to see", "huge numbers grouped together"], "explain": "Reconciles a claim with everyday experience that seems to contradict it.", "src": "L|You are an animal, and your body is made of cells."}, {"id": "y7c01-r026", "type": "short", "topic": "1.2", "source": "opus", "q": "Both a mouse and an oak tree are made of cells. Explain why being made of cells does not make them the same kind of organism.", "answer": "Being made of cells is something all living organisms share, so it cannot be what separates one kind from another. The differences lie in which structures the cells contain: plant cells have a cell wall, a large sap vacuole and often chloroplasts, while animal cells have none of these. So the shared fact places both in the living world, and the contents of the cells place them in different parts of it.", "keywords": ["all organisms are made of cells", "shared feature cannot distinguish", "plant cells have wall and chloroplasts"], "explain": "Trains the idea that a universal property carries no discriminating information.", "src": "L|All animals are made of cells."}, {"id": "y7c01-r027", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why the cotton bud is rubbed only very gently along the inside of the cheek.", "answer": "The aim is to collect some loose cells that are already coming away from the surface, not to injure the lining. Rubbing hard would damage the tissue and could make it bleed, and it would also collect clumps of cells stuck together rather than the separate single cells that are easiest to see. A gentle rub gives a thin scatter of individual cells, which is what the microscope needs.", "keywords": ["collect loose cells", "avoid damaging the lining", "separate cells not clumps"], "explain": "Gives both the safety reason and the scientific reason for the same instruction.", "src": "L|1 Very gently rub the cotton bud along the inside of your cheek."}, {"id": "y7c01-r028", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain what scientists mean when they say a cell is specialised.", "answer": "A specialised cell has a structure that helps it to do its function really well, where its function is the job that it does or the role that it plays. The word does not just mean 'different'; it means the differences are matched to the job. The cell is adapted to carry out its function, so if you know the structure you can often work out the job, and if you know the job you can predict the structure.", "keywords": ["structure suits the function", "function is the job it does", "adapted", "structure predicts function"], "explain": "Defines the key idea so that later questions can be reasoned rather than recalled.", "src": "L|This means that it has a structure that helps it to do its function really well."}, {"id": "y7c01-r029", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain how the small size of a red blood cell helps it do its job.", "answer": "Red blood cells are smaller than most other cells in the body, and this allows them to get through tiny blood capillaries. Because they can pass through the narrowest vessels, they can deliver oxygen to every part of the body, including tissues that only the smallest capillaries reach. A larger cell would jam in those vessels, so the parts of the body served by them would receive no oxygen.", "keywords": ["smaller than most cells", "fit through tiny capillaries", "deliver oxygen everywhere"], "explain": "Links a physical dimension to a delivery problem.", "src": "L|This allows them to get through tiny blood capillaries, so they can deliver oxygen to every part of the body."}, {"id": "y7c01-r030", "type": "short", "topic": "1.3", "source": "opus", "q": "A red blood cell has no nucleus. Explain how this is an advantage rather than a defect.", "answer": "Losing the nucleus leaves more space for haemoglobin, the red pigment in the cytoplasm that carries oxygen around the body. Because the cell's only job is to carry oxygen, the space is better spent on the substance that does the carrying than on the structure that controls the cell's activities. The cell gives up the ability to direct new activity, and in exchange it carries more oxygen per cell.", "keywords": ["no nucleus", "more space for haemoglobin", "carries more oxygen", "trade-off"], "explain": "Presents a structural feature as a trade-off, which is how adaptation actually works.", "src": "L|This leaves more space for haemoglobin."}, {"id": "y7c01-r031", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why red blood cells are red, and why that colour is useful evidence.", "answer": "The cytoplasm contains a red pigment called haemoglobin, and it is the haemoglobin that carries oxygen around the body. So the colour comes from the very substance that does the cell's job. That makes the colour useful evidence: a cell that is packed with red pigment is a cell equipped to carry oxygen, which is why blood as a whole looks red.", "keywords": ["haemoglobin", "red pigment in the cytoplasm", "carries oxygen", "colour shows the working substance"], "explain": "Same reasoning pattern as chlorophyll in 1.1, applied to an animal cell.", "src": "L|The cytoplasm contains a red pigment (colour) called haemoglobin."}, {"id": "y7c01-r032", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why a neurone needs a very long axon.", "answer": "Neurones carry electrical signals from one part of the body to another, for example from the brain to a muscle, so the cell has to physically reach between those two places. The axon is a very long strand of cytoplasm, and electrical signals can travel along this very quickly, so one cell can span the distance without the signal being handed on repeatedly. Length is therefore the adaptation that makes long-distance messaging possible.", "keywords": ["axon is a long strand of cytoplasm", "carries signals between distant parts", "signals travel quickly"], "explain": "Connects shape to the distance the job requires.", "src": "L|The axon is a very long strand of cytoplasm."}, {"id": "y7c01-r033", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why dendrites are short and branching while the axon is long and single.", "answer": "The two ends of the cell do different jobs. Dendrites are short strands of cytoplasm that collect electrical signals from other nearby nerve cells, so they need to reach many neighbours a short distance away, which favours many short branches. The axon has to carry the signal to a distant part of the body, so it favours one long strand. Each shape fits the distance and the number of connections its job involves.", "keywords": ["dendrites collect from nearby cells", "many short branches", "axon carries far", "one long strand"], "explain": "Contrasts two parts of one cell, so the student must reason rather than recall.", "src": "L|Dendrites are short strands of cytoplasm that collect electrical signals from other nearby nerve cells."}, {"id": "y7c01-r034", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why an organism made only of neurones could not survive.", "answer": "Neurones carry electrical signals and help the different parts of the body communicate with each other, but communication is useless if there is nothing to communicate with. Signals from the brain to muscles only matter if muscle cells exist to move, and the whole body still needs cells to carry oxygen, absorb water or make food. Each kind of cell has a particular function, so a body needs many kinds working together.", "keywords": ["neurones only carry signals", "need other cells to act on", "each kind of cell has its own function"], "explain": "Tests whether the student understands specialisation as division of labour.", "src": "L|They help all the different parts of the body to communicate with each other."}, {"id": "y7c01-r035", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain how mucus and cilia work as a pair in the tubes leading to the lungs.", "answer": "Neither part would work alone. Cells in the lining make a sticky substance called mucus, and when you breathe in the mucus traps dust and bacteria in the air, to stop them going into your lungs. But trapped dirt still has to leave, so the ciliated cells sweep the mucus up to the back of your mouth and you swallow it. Mucus does the catching and cilia do the removing; together they clean the air.", "keywords": ["mucus traps dust and bacteria", "cilia sweep the mucus up", "swallowed", "two jobs together"], "explain": "Requires combining two facts into a mechanism.", "src": "L|When you breathe in, the mucus traps dust and bacteria in the air, to stop them going into your lungs."}, {"id": "y7c01-r036", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why the cilia are on one edge of the cell only, rather than all over it.", "answer": "Ciliated cells have tiny threads along one edge, and that edge is the one facing the inside of the tube, where the mucus lies. Cilia on the other sides would be pressed against neighbouring cells and against the tissue underneath, where there is nothing to sweep, so they would do no work. Putting them only on the exposed surface means every cilium is in contact with the mucus it has to move.", "keywords": ["threads along one edge", "faces the inside of the tube", "only that surface touches the mucus"], "explain": "Explains placement, not just presence, of a structure.", "src": "L|Ciliated cells have tiny threads along one edge, like microscopic hairs."}, {"id": "y7c01-r037", "type": "short", "topic": "1.3", "source": "opus", "q": "Smoking damages the cilia in the airways. Predict the consequence and explain your reasoning.", "answer": "The cilia sweep the mucus up to the back of your mouth so that it can be swallowed. If they are damaged, the mucus is still made but it can no longer be moved, so it collects in the tubes leading from the mouth to the lungs along with the dust and bacteria it has trapped. That means more coughing to shift it, and more of the trapped bacteria staying in the airways instead of being removed.", "keywords": ["cilia cannot sweep", "mucus builds up", "trapped dust and bacteria stay", "coughing"], "explain": "A prediction question: the student must run the mechanism forward with one part broken.", "src": "L|One place in the body that contains ciliated cells is the lining of the tubes leading from your mouth to your lungs."}, {"id": "y7c01-r038", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain how the shape of a root hair cell helps it absorb water.", "answer": "Each root hair cell has a long, thin extension that allows water to move easily from the soil into the cell. The extension pushes out between the soil particles, so it reaches water the rest of the root could not touch, and it gives the cell a much larger surface in contact with the soil than a plain round cell would have. More contact with the soil water means faster absorption.", "keywords": ["long thin extension", "reaches between soil particles", "large surface in contact with soil", "absorbs water faster"], "explain": "Turns 'long and thin' into two separate mechanical advantages.", "src": "L|Each cell has a long, thin extension that allows water to move easily from the soil into the cell."}, {"id": "y7c01-r039", "type": "short", "topic": "1.3", "source": "opus", "q": "Suggest why root hair cells contain no chloroplasts.", "answer": "Chloroplasts are where plants make their food, and that needs light, which is why plant cells that are in the sunlight often contain chloroplasts. Root hair cells are on the outside of plant roots, buried in the soil, where no light reaches them. Chloroplasts there could never work, so the space and materials are better used for the cell's real job, which is to absorb water from the soil.", "keywords": ["chloroplasts need light", "roots are in the soil", "no light", "job is to absorb water"], "explain": "The book asks this; the answer given here shows the full chain rather than one clause.", "src": "L|Suggest why root hair cells do not contain chloroplasts."}, {"id": "y7c01-r040", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why palisade cells contain a lot of chloroplasts while other leaf cells contain fewer.", "answer": "Palisade cells are found in the leaves of plants and their function is to make food by photosynthesis. The chlorophyll inside the chloroplasts absorbs energy from sunlight, which is used to help the plant make food, so the more chloroplasts a cell has the more light energy it can capture. Palisade cells sit near the top of the leaf where the light is strongest, so packing them with chloroplasts uses that light rather than wasting it.", "keywords": ["function is photosynthesis", "chlorophyll absorbs light energy", "more chloroplasts capture more light", "near the top of the leaf"], "explain": "Explains a quantitative difference between two cells of the same organ.", "src": "L|They have a lot of chloroplasts containing chlorophyll."}, {"id": "y7c01-r041", "type": "short", "topic": "1.3", "source": "opus", "q": "Red blood cells, neurones and ciliated cells look nothing alike. Explain how you can still tell that all three are animal cells.", "answer": "None of them has a cell wall, a large sap vacuole or chloroplasts, and those are the structures that mark a cell as a plant cell. What they do share is the cell membrane and cytoplasm that all cells have. So the identification does not depend on their shapes at all; it depends on which plant-only structures are absent, and all three are missing the same ones.", "keywords": ["no cell wall", "no chloroplasts", "no large sap vacuole", "absence of plant structures"], "explain": "Identification by absence, which is harder than identification by presence.", "src": "L|How can you tell that all of these three cells are animal cells, not plant cells?"}, {"id": "y7c01-r042", "type": "short", "topic": "1.3", "source": "opus", "q": "Red blood cells, neurones and ciliated cells all do different jobs. Explain why they nonetheless have some parts in common.", "answer": "They are all still cells, and some jobs have to be done inside every living cell no matter what its speciality is. All cells have a cell membrane to control what goes in and out, and all cells have cytoplasm, where the chemical reactions that keep the cell alive happen. Specialisation adds features on top of these basics; it does not replace them, because the basic needs of staying alive do not go away.", "keywords": ["all cells have a membrane", "all cells have cytoplasm", "basic needs remain", "specialisation adds features"], "explain": "Explains why shared structures survive specialisation.", "src": "L|List two things that red blood cells, neurones and ciliated cells have in common."}, {"id": "y7c01-r043", "type": "short", "topic": "1.3", "source": "opus", "q": "Water travelling from the soil into a root hair cell's sap vacuole must pass several parts in order. List them and explain why that order is fixed.", "answer": "The water crosses the cell wall, then the cell membrane, then the cytoplasm, and finally enters the sap vacuole. The order is fixed by where the parts lie: the wall is the outermost layer, the cell membrane lies along the inner edge of the cell wall, the cytoplasm fills the space inside the membrane, and the sap vacuole is the space inside that. Nothing can reach an inner layer without crossing the ones outside it.", "keywords": ["cell wall", "cell membrane", "cytoplasm", "sap vacuole", "order set by position"], "explain": "Requires the student to use the positions of structures, not just their names.", "src": "L|List these parts, in order."}, {"id": "y7c01-r044", "type": "short", "topic": "1.3", "source": "opus", "q": "A student writes that a palisade cell 'is adapted for its function'. Explain why this sentence earns no marks on its own.", "answer": "Saying a cell is adapted repeats the question instead of answering it. An explanation has to name the structure, say what the structure does, and then link that to the job: a palisade cell has a lot of chloroplasts, the chlorophyll in them absorbs energy from sunlight, and that energy is used to help the plant make food. Only when those three steps are present has the adaptation actually been explained.", "keywords": ["must name the structure", "say what it does", "link to the function", "naming is not explaining"], "explain": "Teaches what an explanation of adaptation has to contain.", "src": "W|d Explain how this cell is adapted for its function."}, {"id": "y7c01-r045", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why comparing two specialised cells in a table makes their adaptations easier to see than describing them one after the other.", "answer": "A table puts the same feature for both cells side by side, so a difference in that one feature stands out immediately instead of having to be held in memory across two paragraphs. Because each row is one feature, it also forces you to ask the same question of both cells, which stops you describing one in detail and the other briefly. The comparison then points straight at which differences relate to the different functions.", "keywords": ["same feature side by side", "differences stand out", "same question asked of both", "links differences to function"], "explain": "A working-scientifically question about why a table is the right format.", "src": "W|b In your own words, explain how the structure of each cell is adapted for its function."}, {"id": "y7c01-r046", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why a group of cells has to be both similar and working together before it counts as a tissue.", "answer": "A tissue is a group of similar cells, which all work together to carry out a particular function. Both parts matter. Cells that are similar but doing unrelated jobs are not achieving anything as a group, and cells that work together but are of many different kinds form an organ, not a tissue. It is the combination of one cell type and one shared function that defines the level.", "keywords": ["group of similar cells", "work together", "one particular function", "many kinds would be an organ"], "explain": "Tests a definition by examining what happens if each half is dropped.", "src": "L|A group of similar cells, which all work together to carry out a particular function, is called a tissue."}, {"id": "y7c01-r047", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain the difference between a tissue and an organ, using the leaf as an example.", "answer": "A tissue is a group of similar cells all doing one function, while each organ is made up of several different kinds of tissue, working together. A leaf is a plant organ, and contains several different kinds of tissue, such as the palisade cells that make food and the surface layers that cover it. So the leaf is one level up: it is a combination of tissues, each of which is itself a combination of similar cells.", "keywords": ["tissue is similar cells", "organ contains several tissues", "leaf is an organ", "palisade tissue inside it"], "explain": "Anchors an abstract hierarchy to a concrete example.", "src": "L|Each organ is made up of several different kinds of tissue, working together."}, {"id": "y7c01-r048", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why the heart on its own is not called an organ system.", "answer": "An organ system is a set of organs that all work together to carry out the same function, so it needs more than one organ. The heart is a single organ, made of several kinds of tissue working together, but it cannot move blood around the body by itself; it needs blood vessels as well. Heart and blood vessels together form the organ system, and the heart alone is one component of it.", "keywords": ["organ system is a set of organs", "heart is one organ", "needs blood vessels too", "together they form the system"], "explain": "Forces a careful reading of 'set of organs'.", "src": "L|A set of organs that all work together to carry out the same function is called an organ system."}, {"id": "y7c01-r049", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why ciliated epithelium is called a tissue rather than an organ.", "answer": "Ciliated epithelium is the tissue that lines the tubes leading down to our lungs, and it is made of one kind of cell, the ciliated cell, all doing the same job. An organ is made up of several different kinds of tissue, working together, and this lining is not; it is a single layer of similar cells. So it sits at the tissue level, while the lung it helps protect sits at the organ level.", "keywords": ["one kind of cell", "same job", "organ needs several tissues", "lining is a single layer"], "explain": "Applies the definition to a borderline-sounding case.", "src": "L|This is a diagram of ciliated epithelium – the tissue that lines the tubes leading down to our lungs."}, {"id": "y7c01-r050", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why it matters that the cilia all wave together, like grass in the wind, rather than independently.", "answer": "The job is to sweep the mucus up to the back of the mouth, and moving something in one direction requires the pushes to act the same way at the same time. If neighbouring cilia beat in random directions their pushes would cancel and the mucus would stay where it is. Waving together turns millions of tiny movements into one steady flow, which is why the tissue as a whole can shift the mucus.", "keywords": ["all wave together", "pushes act in one direction", "random beating would cancel", "steady flow of mucus"], "explain": "Shows why a tissue can do something a single cell cannot.", "src": "L|The cilia all wave together, like grass in the wind."}, {"id": "y7c01-r051", "type": "short", "topic": "1.4", "source": "opus", "q": "The onion epidermis is a tissue. Explain what its cells must have in common for it to be called one.", "answer": "The onion epidermis covers the surface of the layers inside the onion, and that covering job is done by cells of one kind, arranged in a single layer. Because a tissue is a group of similar cells which all work together to carry out a particular function, the cells have to be alike and have to share the same job. Here both are true: similar box-shaped cells, all forming the covering.", "keywords": ["similar cells", "same function", "covers the surface", "single layer"], "explain": "Checks the definition against a plant example, not just an animal one.", "src": "L|It is called an onion epidermis."}, {"id": "y7c01-r052", "type": "short", "topic": "1.4", "source": "opus", "q": "The word 'tissue' has an everyday meaning and a scientific meaning. Explain why using the everyday meaning in a science answer causes problems.", "answer": "In everyday speech a tissue is a piece of soft paper, which has nothing to do with living things. In science a tissue is a group of similar cells which all work together to carry out a particular function. If the two are confused, a sentence like 'the lungs contain tissue' can be read as if something has been put inside the lungs rather than describing what they are built from, and the whole hierarchy of cell, tissue, organ stops making sense.", "keywords": ["everyday meaning is paper", "scientific meaning is a group of similar cells", "confusion breaks the hierarchy"], "explain": "A vocabulary question that is really about precision of language.", "src": "L|The word ‘tissue’ has an everyday meaning and a different scientific meaning."}, {"id": "y7c01-r053", "type": "short", "topic": "1.4", "source": "opus", "q": "The brain is called an organ even though neurones are its best-known cells. Explain why.", "answer": "Each organ is made up of several different kinds of tissue, working together, and your brain contains neurones and also several other kinds of cell. If the brain were nothing but neurones it would be a tissue. Because it combines several tissues into one structure with one overall job, it qualifies as an organ; the famous cell type is only part of what is in there.", "keywords": ["brain contains neurones and other cells", "several tissues", "organ not tissue"], "explain": "Corrects the common shortcut 'brain = nerve cells'.", "src": "L|For example, your brain contains neurones, and also several other kinds of cell."}, {"id": "y7c01-r054", "type": "short", "topic": "1.4", "source": "opus", "q": "A plant root contains root hair cells and also several other kinds of cell. Explain why this makes the root an organ.", "answer": "An organ is made up of several different kinds of tissue, working together, and that is exactly what the root is: root hair cells absorbing water from the soil, plus other kinds of cell doing other jobs such as carrying that water upwards and anchoring the plant. Because more than one kind of tissue is present and they contribute to one overall job, the root sits at the organ level rather than the tissue level.", "keywords": ["several different kinds of cell", "several tissues", "one overall job", "organ"], "explain": "Same reasoning as the brain, transferred to a plant.", "src": "L|A plant root contains root hair cells, and also several other kinds of cell."}, {"id": "y7c01-r055", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why organs working together is a useful arrangement, using a named example.", "answer": "A set of organs that all work together to carry out the same function is called an organ system, and the arrangement lets a job be split into parts that different structures are built for. In the circulatory system the heart pushes the blood and the blood vessels carry it to every part of the body; neither could do the whole job alone. Splitting the work means each organ can be specialised for its part of it.", "keywords": ["organ system", "job split between organs", "heart pushes, vessels carry", "each organ specialised"], "explain": "Extends the specialisation argument from cells up to organs.", "src": "L|Organs also work together."}, {"id": "y7c01-r056", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why cells of the same kind are usually grouped together rather than scattered through the body.", "answer": "Most cells are specialised to carry out a particular activity, and cells of the same kind do the same job, so grouping them means all that work happens in one place where it is needed. Grouping also lets them act together, as the cilia do when they all wave in the same direction, producing an effect no single cell could produce. Scattering them would waste both the specialisation and the teamwork.", "keywords": ["specialised cells", "same job in one place", "act together", "effect one cell cannot produce"], "explain": "Explains the reason behind the existence of tissues.", "src": "L|Usually, many cells of the same kind are grouped together."}, {"id": "y7c01-r057", "type": "short", "topic": "1.4", "source": "opus", "q": "Hydra's body is made of only two layers of cells. Suggest why it has no organ systems even though it digests food.", "answer": "An organ system is a set of organs working together, and an organ is made up of several different kinds of tissue. The body of Hydra is made up of two layers of cells, which is not enough to build several distinct tissues into separate organs and then group those organs together. Digestion still happens, in a cavity the mouth opens into, but it is carried out by the cell layers directly rather than by a chain of organs.", "keywords": ["two layers of cells", "not enough tissues for organs", "digestion in a cavity", "no organ system"], "explain": "Applies the hierarchy to an organism that stops partway up it.", "src": "W|Hydra is a tiny animal that lives in freshwater ponds."}, {"id": "y7c01-r058", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain how a sting cell is adapted to catch prey.", "answer": "The sting cell contains tiny coiled threads, and the coil stores the thread in a small space ready to be released. When a prey animal touches the trigger on the sting cell, the thread shoots out and wraps around the prey, so the cell responds only when prey is actually in contact rather than firing at random. Some of these threads may have poisonous chemicals on them, which kill the prey, so the animal is held and stopped.", "keywords": ["coiled thread stored ready", "trigger fires only on contact", "thread wraps around prey", "poison kills it"], "explain": "Three features, each tied to a step of the catching process.", "src": "W|When a prey animal touches the trigger on the sting cell, the thread shoots out and wraps around the prey."}, {"id": "y7c01-r059", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain how you can tell from a diagram that a sting cell is an animal cell and not a plant cell.", "answer": "The test is which plant-only structures are missing. A sting cell has no cell wall, so its outline is irregular rather than a straight stiff box; it has no chloroplasts, and it has no large sap vacuole filling most of its middle. It still has the cell membrane, cytoplasm and nucleus that all cells have, so those tell you nothing, and it is the absent structures that settle the question.", "keywords": ["no cell wall", "no chloroplasts", "no large sap vacuole", "shared structures prove nothing"], "explain": "Reuses the absence-based identification skill on an unfamiliar cell.", "src": "W|Explain how you can tell from the diagram that the sting cell is an animal cell and not a plant cell."}, {"id": "y7c01-r060", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why an organism is placed above organ systems in the sequence cell, tissue, organ, organ system, organism.", "answer": "Each level is built from several units of the level below it, and an organism may contain many different organ systems, organs and tissues. So the organism is the whole living thing that all the systems belong to, and it sits at the top because nothing in the body contains it. Reading the sequence downwards takes you from the whole animal or plant to the single cells it is built from.", "keywords": ["each level built from the one below", "organism contains many systems", "top of the hierarchy"], "explain": "Makes the hierarchy a rule rather than a list to memorise.", "src": "L|It may contain many different organ systems, organs and tissues."}, {"id": "y7c01-r061", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why both a daisy and a dog are called organisms, despite being so different.", "answer": "Living things, including animals and plants, are called organisms, so the word describes the whole living individual rather than any particular kind of body. Both a daisy and a dog are built from cells, grouped into tissues, then organs, then organ systems, so both reach the top of the same hierarchy. The differences lie in which cells, tissues and organs they contain, not in whether they are organisms.", "keywords": ["organism means a whole living thing", "both built from cells", "same hierarchy", "differences are in the parts"], "explain": "Reinforces that the hierarchy is general, not species-specific.", "src": "L|Living things, including animals and plants, are called organisms."}, {"id": "y7c01-o002", "type": "short", "topic": "1.1", "source": "opus", "q": "Why do you need a microscope to study cells?", "answer": "Cells are so small that you cannot see them with your eyes alone. A microscope magnifies the view so that the cells look much bigger than they really are.", "keywords": ["too small", "eyes alone", "magnifies"], "explain": "Your answer needs to include: too small to see with your eyes alone, the microscope magnifies the view.", "src": "L|Cells are so small that you cannot see them with your eyes alone."}, {"id": "y7c01-o009", "type": "short", "topic": "1.1", "source": "opus", "q": "Give three differences between a cell wall and a cell membrane.", "answer": "Any three of: the wall is on the outside and the membrane is further in; the wall is made of cellulose and the membrane is not; the wall is strong and stiff while the membrane is thin and flexible; the wall holds the cell in shape while the membrane controls what goes in and out.", "keywords": ["cellulose", "flexible", "holds the cell in shape", "controls what goes in and out"], "explain": "Your answer needs to include three of: made of cellulose; the membrane is thin and flexible; the wall holds the cell in shape; the membrane controls what enters and leaves.", "src": "L|The cell membrane is very thin and flexible."}, {"id": "y7c01-o019", "type": "short", "topic": "1.1", "source": "opus", "q": "When you look at onion cells under a microscope, why is the onion layer peeled from the inside of the onion instead of cut thickly?", "answer": "The layer has to be thin enough for light to pass through it. Light from the mirror shines up through the specimen, so a thick piece would just look dark.", "keywords": ["thin", "light", "through"], "explain": "Your answer needs to include: it must be thin so light can pass through it.", "src": "L|Very carefully, peel the thin layer from the inside of your piece of onion."}, {"id": "y7c01-o021", "type": "short", "topic": "1.2", "source": "opus", "q": "In which three ways is an animal cell similar to a plant cell?", "answer": "Both have a cell membrane, cytoplasm and a nucleus.", "keywords": ["cell membrane", "cytoplasm", "nucleus"], "explain": "Your answer needs to include: cell membrane, cytoplasm, nucleus.", "src": "L|Animal cells are similar to plant cells in several ways. They have a cell membrane, cytoplasm and a nucleus."}, {"id": "y7c01-o022", "type": "short", "topic": "1.2", "source": "opus", "q": "Name three parts that a plant cell has but an animal cell does not.", "answer": "A cell wall, a large sap vacuole and chloroplasts.", "keywords": ["cell wall", "sap vacuole", "chloroplast"], "explain": "Your answer needs to include: cell wall, sap vacuole, chloroplasts.", "src": "L|Every plant cell has a cell wall."}, {"id": "y7c01-o023", "type": "short", "topic": "1.2", "source": "opus", "q": "You are shown a photograph of some cells taken through a microscope. What is the most useful feature to look for to decide whether they are plant cells or animal cells?", "answer": "Look for a cell wall. Cells with a cell wall have a regular, straight-sided shape and are plant cells; animal cells have no wall and look irregular.", "keywords": ["cell wall", "regular shape", "irregular"], "explain": "Your answer needs to include: the cell wall, and the regular shape it gives the cell.", "src": "L|Every plant cell has a cell wall."}, {"id": "y7c01-o024", "type": "short", "topic": "1.2", "source": "opus", "q": "What is a stain, and why is methylene blue used when looking at cheek cells?", "answer": "A stain is a dye that colours the cells. Methylene blue stains the cells blue and makes them much easier to see, because cheek cells are almost colourless.", "keywords": ["dye", "stain", "easier to see"], "explain": "Your answer needs to include: a dye that colours the cells and makes them easier to see.", "src": "L|Methylene blue is a dye that will stain the cells blue, making them easier to see."}, {"id": "y7c01-o025", "type": "short", "topic": "1.2", "source": "opus", "q": "Where do you get the cells from when you make a slide of your own animal cells?", "answer": "You gently rub a cotton bud along the inside of your cheek, which collects some loose cells.", "keywords": ["cotton bud", "inside of your cheek"], "explain": "Your answer needs to include: rub a cotton bud on the inside of the cheek.", "src": "L|Very gently rub the cotton bud along the inside of your cheek. This will collect some loose cells."}, {"id": "y7c01-o026", "type": "short", "topic": "1.2", "source": "opus", "q": "Before you look down the eyepiece, you turn the focussing knob while watching the microscope from the side. Why is it done in that order?", "answer": "So that you can see how close the lens is to the slide and stop before it touches it. Looking from the side is the only way to judge that distance safely.", "keywords": ["see how close", "not touch", "slide"], "explain": "Your answer needs to include: so the lens does not hit the slide.", "src": "L|Looking from the side, turn the focussing knob until the lens is close to the slide."}, {"id": "y7c01-o027", "type": "short", "topic": "1.2", "source": "opus", "q": "After you have found the cells with the smallest lens, how do you get a more magnified view?", "answer": "Turn the lenses until a larger objective lens is over the stage, then look down the eyepiece again.", "keywords": ["larger", "lens"], "explain": "Your answer needs to include: turn a larger objective lens over the stage.", "src": "L|Turn the lenses until a larger one is over the stage."}, {"id": "y7c01-o028", "type": "short", "topic": "1.2", "source": "opus", "q": "Roughly how many cells is a human body thought to contain?", "answer": "About 100 trillion.", "keywords": ["100 trillion"], "explain": "Your answer needs to include: about 100 trillion.", "src": "L|One estimate is about 100 trillion."}, {"id": "y7c01-o037", "type": "short", "topic": "1.3", "source": "opus", "q": "What is the axon of a neurone, and how does its shape help the cell?", "answer": "The axon is a very long strand of cytoplasm. Electrical signals can travel along it very quickly, so they can travel a long way in a short time.", "keywords": ["long strand of cytoplasm", "quickly"], "explain": "Your answer needs to include: a very long strand of cytoplasm that signals travel along quickly.", "src": "L|The axon is a very long strand of cytoplasm. Electrical signals can travel along this very quickly."}, {"id": "y7c01-o060", "type": "short", "topic": "1.4", "source": "opus", "q": "What is ciliated epithelium, and what is its function?", "answer": "It is the tissue that lines the tubes leading down to our lungs. The cilia all wave together and sweep mucus, with dust and bacteria trapped in it, away from the lungs.", "keywords": ["tissue", "lines the tubes", "lungs", "mucus"], "explain": "Your answer needs to include: the tissue lining the tubes to the lungs; it sweeps mucus away.", "src": "L|This is a diagram of ciliated epithelium - the tissue that lines the tubes leading down to our lungs."}, {"id": "y7c01-o061", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why a leaf is called an organ and not a tissue.", "answer": "A leaf contains several different kinds of tissue working together, such as the upper epidermis, the palisade layer, the spongy layer and the lower epidermis. A tissue is only one kind of cell.", "keywords": ["several different kinds of tissue", "organ"], "explain": "Your answer needs to include: it contains several different tissues working together.", "src": "L|A leaf is a plant organ, and contains several different kinds of tissue."}, {"id": "y7c01-o069", "type": "short", "topic": "1.4", "source": "opus", "q": "How does a Hydra catch its food?", "answer": "It has tentacles that it uses to catch even smaller animals, which it pushes into its mouth. Sting cells on the tentacles fire threads that wrap around the prey.", "keywords": ["tentacles", "mouth", "sting cells"], "explain": "Your answer needs to include: tentacles catch smaller animals and push them into the mouth.", "src": "W|It has tentacles that it uses to catch even smaller animals, which it pushes into its mouth."}, {"id": "qwen-01-01", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What is the cell wall made of?", "explain": "Plant cell walls are made of a substance called cellulose.", "src": "L|Plant cell walls are made of a substance called cellulose.", "options": ["cellulose", "chlorophyll", "cytoplasm", "sap"], "answer": 0}, {"id": "qwen-01-02", "type": "fill", "topic": "1.1", "source": "qwen", "q": "The liquid inside the sap vacuole is called ____.", "explain": "The solution of sugars and other substances dissolved in water inside the vacuole is called cell sap.", "src": "L|The solution is called cell sap.", "answer": ["cell sap"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "Which part of the plant cell controls what goes in and out?", "explain": "The cell membrane is described as controlling what goes in and out of the cell.", "src": "L|The cell membrane controls what goes in and out of the cell.", "options": ["cell membrane", "nucleus", "chloroplast", "mitochondrion"], "answer": 0}, {"id": "qwen-01-04", "type": "fill", "topic": "1.1", "source": "qwen", "q": "Chloroplasts look green because they contain a substance called ____.", "explain": "Chloroplasts contain a green substance called chlorophyll, which makes them look green.", "src": "L|Chloroplasts look green because they contain a green substance called chlorophyll.", "answer": ["chlorophyll"]}, {"id": "qwen-01-05", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "Where do chemical reactions happen to keep the cell alive?", "explain": "Chemical reactions happen inside the cytoplasm to keep the cell alive.", "src": "L|Chemical reactions happen inside the cytoplasm.", "options": ["cytoplasm", "nucleus", "cell wall", "vacuole"], "answer": 0}, {"id": "qwen-01-06", "type": "fill", "topic": "1.1", "source": "qwen", "q": "Energy is released from food inside the ____.", "explain": "Inside mitochondria, energy is released from food.", "src": "L|Inside mitochondria, energy is released from food.", "answer": ["mitochondrion"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "Which part of a plant cell holds the cell in shape?", "explain": "Every plant cell has a cell wall, and it is the wall that holds the cell in shape.", "src": "L|It holds the plant cell in shape.", "options": ["cell wall", "cell membrane", "cytoplasm", "sap vacuole"], "answer": 0}, {"id": "qwen-04-01", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "What is the estimated number of cells in a person?", "explain": "One estimate is about 100 trillion cells in a person.", "src": "L|One estimate is about 100 trillion.", "options": ["100 trillion", "100 million", "100 billion", "100 thousand"], "answer": 0}, {"id": "qwen-04-02", "type": "fill", "topic": "1.2", "source": "qwen", "q": "Animal cells have a cell membrane, cytoplasm and a ____.", "explain": "The nucleus as one of the parts animal cells have, similar to plant cells.", "src": "L|They have a cell membrane, cytoplasm and a nucleus.", "answer": ["nucleus"]}, {"id": "qwen-04-04", "type": "fill", "topic": "1.2", "source": "qwen", "q": "You are an animal, and your body is made of ____.", "explain": "Your body is made of cells.", "src": "L|You are an animal, and your body is made of cells.", "answer": ["cells"]}, {"id": "qwen-04-12", "type": "fill", "topic": "1.2", "source": "qwen", "q": "The liquid inside the cell where organelles are suspended is called ____.", "explain": "Cytoplasm is listed as a common part of both plant and animal cells.", "src": "L|They have a cell membrane, cytoplasm and a nucleus.", "answer": ["cytoplasm"]}, {"id": "qwen-05-01", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "What is the purpose of using methylene blue in this experiment?", "explain": "Methylene blue is a dye that stains the cells blue, making them easier to see.", "src": "L|Methylene blue is a dye that will stain the cells blue, making them easier to see.", "options": ["To kill the cells", "To stain the cells so they are easier to see", "To clean the microscope slide", "To make the cells grow larger"], "answer": 1}, {"id": "qwen-05-03", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "Why can you not see the cells immediately after rubbing them onto the slide?", "explain": "You cannot see them yet because they are so small.", "src": "L|You will not be able to see the cells yet, because they are so small.", "options": ["Because they are dead", "Because they are too small to see with the naked eye", "Because the slide is dirty", "Because you need a cover slip first"], "answer": 1}, {"id": "qwen-05-05", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "Which part of the microscope do you turn to bring the lens close to the slide?", "explain": "Step 7 says to turn the focussing knob until the lens is close to the slide.", "src": "L|turn the focussing knob until the lens is close to the slide", "options": ["The stage", "The focussing knob", "The objective lens", "The dropper pipette"], "answer": 1}, {"id": "qwen-07-01", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "What is the function of a cell?", "explain": "The function of a cell is the job that it does, or the role that it plays.", "src": "L|The function of a cell is the job that it does", "options": ["The job that it does", "The shape of its nucleus", "The colour of its cytoplasm", "The size of its membrane"], "answer": 0}, {"id": "qwen-07-02", "type": "fill", "topic": "1.3", "source": "qwen", "q": "Red blood cells contain a red pigment called ____ that carries oxygen.", "explain": "The cytoplasm contains a red pigment (colour) called haemoglobin. This carries oxygen around the body.", "src": "L|contains a red pigment (colour) called haemoglobin", "answer": ["haemoglobin"]}, {"id": "qwen-07-03", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "Why do red blood cells have no nucleus?", "explain": "The cell has no nucleus. This leaves more space for haemoglobin.", "src": "L|This leaves more space for haemoglobin", "options": ["To make them smaller", "To leave more space for haemoglobin", "To help them move faster", "To protect the DNA"], "answer": 1}, {"id": "qwen-07-04", "type": "fill", "topic": "1.3", "source": "qwen", "q": "The very long strand of cytoplasm in a neurone is called the ____.", "explain": "The axon is a very long strand of cytoplasm.", "src": "L|The axon is a very long strand of cytoplasm", "answer": ["axon"]}, {"id": "qwen-07-05", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "What do cilia sweep up to the back of your mouth?", "explain": "The cilia sweep the mucus up to the back of your mouth and you swallow it.", "src": "L|The cilia sweep the mucus up to the back of your mouth", "options": ["Oxygen", "Mucus", "Blood cells", "Nutrients"], "answer": 1}, {"id": "qwen-07-06", "type": "fill", "topic": "1.3", "source": "qwen", "q": "Root hair cells are found on the outside of plant ____.", "explain": "Root hair cells are found on the outside of plant roots.", "src": "L|found on the outside of plant roots", "answer": ["roots"]}, {"id": "qwen-07-07", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "What is the function of a root hair cell?", "explain": "Their function is to absorb (soak up) water from the soil.", "src": "L|function is to absorb (soak up) water from the soil", "options": ["To make food by photosynthesis", "To absorb water from the soil", "To carry electrical signals", "To trap dust and bacteria"], "answer": 1}, {"id": "qwen-07-09", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "What is a group of similar cells that work together called?", "explain": "A group of similar cells, which all work together to carry out a particular function, is called a tissue.", "src": "L|is called a tissue", "options": ["An organ", "A tissue", "An organism", "A system"], "answer": 1}, {"id": "qwen-07-10", "type": "fill", "topic": "1.4", "source": "qwen", "q": "A set of organs that work together to carry out the same function is called an ____ system.", "explain": "A set of organs that all work together to carry out the same function is called an organ system.", "src": "L|is called an organ system", "answer": ["organ"]}, {"id": "qwen-07-12", "type": "fill", "topic": "1.4", "source": "qwen", "q": "Living things, including animals and plants, are called ____.", "explain": "Living things, including animals and plants, are called organisms.", "src": "L|are called organisms", "answer": ["organisms"]}, {"id": "qwen-08-02", "type": "fill", "topic": "1.4", "source": "qwen", "q": "The stomach is an example of an ____.", "explain": "The stomach as an example of an organ.", "src": "L|The stomach is an example of an", "answer": ["organ"]}, {"id": "qwen-08-04", "type": "fill", "topic": "1.4", "source": "qwen", "q": "In a complex organism, similar cells are grouped together to form a ____.", "explain": "The grouping of similar cells as a tissue.", "src": "L|similar cells are grouped together to form a", "answer": ["tissue"]}, {"id": "qwenw-01-02", "type": "fill", "topic": "1.1", "source": "qwen", "q": "The part of the plant cell that contains sap is called the ____.", "explain": "The word list for labelling plant cells includes 'sap vacuole'.", "src": "W|nucleus sap vacuole chloroplast", "answer": ["sap vacuole"]}, {"id": "qwenw-01-03", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What should you do to improve a drawing of a plant cell?", "explain": "To 'Make sure each label line touches the structure it is labelling'.", "src": "W|Makesureeachlabellinetouches thestructureitislabelling", "options": ["Shade the structures", "Colour the diagram", "Ensure label lines touch the structure", "Make the shapes large"], "answer": 2}, {"id": "qwenw-01-04", "type": "fill", "topic": "1.1", "source": "qwen", "q": "When drawing a biological diagram, you should not ____ or colour your drawing.", "explain": "Do not shade or colour your drawing.", "src": "W|Donotshadeorcolouryourdrawing.", "answer": ["shade"]}, {"id": "qwenw-01-05", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "Which part of the microscope is used to look through?", "explain": "The word list for labelling the microscope includes 'eyepiece'.", "src": "W|stage eyepiece mirror high-power objective lens", "options": ["stage", "eyepiece", "mirror", "coarse focusing knob"], "answer": 1}, {"id": "qwenw-01-06", "type": "fill", "topic": "1.2", "source": "qwen", "q": "The part of the microscope that holds the slide is called the ____.", "explain": "The word list for labelling the microscope includes 'stage'.", "src": "W|stage eyepiece mirror high-power objective lens", "answer": ["stage"]}, {"id": "qwenw-01-07", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "Red blood cells contain a substance called ____ which helps them carry oxygen.", "explain": "Red blood cells contain a substance called haemoglobin, which joins to oxygen in the lungs and releases it again where the body needs it.", "src": "W|Red blood cells contain a substance called", "options": ["cytoplasm", "haemoglobin", "food", "capillaries"], "answer": 1}, {"id": "qwenw-01-08", "type": "fill", "topic": "1.3", "source": "qwen", "q": "Red blood cells are small so they can squeeze through tiny blood vessels called ____.", "explain": "They help them 'squeeze through the small blood vessels called capillaries'.", "src": "W|small blood vessels called", "answer": ["capillaries"]}, {"id": "qwenw-01-10", "type": "fill", "topic": "1.4", "source": "qwen", "q": "The system in the human body that includes the heart and blood vessels is the ____ system.", "explain": "The circulatory system is made up of the heart and the blood vessels, and it carries blood around the body.", "src": "W|respiratory system nervous system circulatory system", "answer": ["circulatory"]}, {"id": "qwenw-01-11", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "Which of the following is an organ system in the human body?", "explain": "The nervous system is an organ system. A chloroplast, a sap vacuole and a mitochondrion are parts inside a single cell, not organ systems.", "src": "W|respiratory system nervous system circulatory system", "options": ["nervous system", "chloroplast", "sap vacuole", "mitochondrion"], "answer": 0}, {"id": "qwenw-01-12", "type": "fill", "topic": "1.2", "source": "qwen", "q": "The part of the microscope with a low-power objective lens is used for initial viewing, while the ____ focusing knob makes small adjustments.", "explain": "The word list includes 'fine focusing knob' which is distinct from the coarse one.", "src": "W|coarse focusing knob fine focusing knob", "answer": ["fine"]}, {"id": "qwenw-02-02", "type": "fill", "topic": "1.4", "source": "qwen", "q":
