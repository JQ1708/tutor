<title>Chapter 3 — Forces and energy — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>

ures how hot the water has become.", "caption": "Apparatus for measuring heat and temperature: an immersion heater warms water in a polystyrene cup.", "target": {"x": 88.4, "y": 38.1, "r": 7.0}, "explain": "Temperature and energy are not the same thing. The thermometer measures temperature; the Joulemeter measures the energy transferred.", "src": "L|thermometer"}, {"id": "ch03-f03a", "type": "label", "topic": "3.3", "source": "opus", "image": "img/L_p24_lamp.png", "figure": "L_p24_lamp", "q": "This is the energy diagram for an electric lamp. Name the energy labelled {n}.", "caption": "The energy diagram for an electric lamp: 100 J in, 10 J of light plus 90 J of thermal energy out.", "labels": [{"n": 1, "text": "light energy", "alt": [], "x": 73.3, "y": 10.1, "w": 16.9, "h": 9.9}, {"n": 2, "text": "electrical energy", "alt": [], "x": 8.6, "y": 33.3, "w": 23.1, "h": 9.9}, {"n": 3, "text": "thermal energy", "alt": [], "x": 73.3, "y": 62.3, "w": 21.5, "h": 9.9}], "src": "L|light energy"}, {"id": "ch03-f03h1", "type": "hotspot", "topic": "3.3", "source": "opus", "image": "img/L_p24_lamp.png", "figure": "L_p24_lamp", "q": "Click on the label of the energy that goes into the lamp.", "caption": "The energy diagram for an electric lamp: 100 J in, 10 J of light plus 90 J of thermal energy out.", "target": {"x": 20.1, "y": 38.2, "r": 7.0}, "explain": "100 J of electrical energy goes in. Only 10 J comes out as light, so the lamp is 10% efficient; the other 90 J is transferred as thermal energy.", "src": "L|electrical energy"}, {"id": "ch03-f03h2", "type": "hotspot", "topic": "3.3", "source": "opus", "image": "img/L_p24_lamp.png", "figure": "L_p24_lamp", "q": "Click on the label of the wasted energy output of this lamp.", "caption": "The energy diagram for an electric lamp: 100 J in, 10 J of light plus 90 J of thermal energy out.", "target": {"x": 84.0, "y": 67.2, "r": 7.0}, "explain": "90 J of the 100 J supplied is transferred to the surroundings as thermal energy. It has not been destroyed, but it has spread out so thinly that it can no longer be used.", "src": "L|thermal energy"}, {"id": "ch03-f04a", "type": "label", "topic": "3.3", "source": "opus", "image": "img/L_p24_carengine.png", "figure": "L_p24_carengine", "q": "This is the energy diagram for a car engine. Write down the label at position {n}.", "caption": "The energy diagram for a car engine, with the input and outputs written as percentages.", "labels": [{"n": 1, "text": "25% kinetic energy", "alt": ["kinetic energy"], "x": 71.2, "y": 12.4, "w": 16.3, "h": 17.4}, {"n": 2, "text": "100% chemical energy in fuel", "alt": ["chemical energy in fuel"], "x": 8.1, "y": 22.8, "w": 18.5, "h": 26.4}, {"n": 3, "text": "35% thermal and sound energy", "alt": ["thermal and sound energy"], "x": 71.2, "y": 37.2, "w": 23.8, "h": 17.4}, {"n": 4, "text": "40% chemical energy in exhaust gas", "alt": ["chemical energy in exhaust gas"], "x": 71.2, "y": 62.0, "w": 19.4, "h": 26.4}], "src": "L|25% kinetic energy"}, {"id": "ch03-f04h1", "type": "hotspot", "topic": "3.3", "source": "opus", "image": "img/L_p24_carengine.png", "figure": "L_p24_carengine", "q": "Click on the label of the useful energy output of a car engine.", "caption": "The energy diagram for a car engine, with the input and outputs written as percentages.", "target": {"x": 79.4, "y": 21.1, "r": 7.0}, "explain": "Only 25% of the chemical energy in the fuel becomes the kinetic energy that moves the car. Everything else is wasted.", "src": "L|25% kinetic energy"}, {"id": "ch03-f04h2", "type": "hotspot", "topic": "3.3", "source": "opus", "image": "img/L_p24_carengine.png", "figure": "L_p24_carengine", "q": "Click on the label of the largest single energy output of this engine.", "caption": "The energy diagram for a car engine, with the input and outputs written as percentages.", "target": {"x": 80.9, "y": 75.2, "r": 7.0}, "explain": "40% of the input leaves in the exhaust gas as chemical energy, which is more than the 35% wasted as thermal and sound energy and more than the 25% that is useful.", "src": "L|40% chemical energy in exhaust gas"}, {"id": "ch03-f05a", "type": "label", "topic": "3.3", "source": "opus", "image": "img/L_p27_pendulum.png", "figure": "L_p27_pendulum", "q": "Two bottles of water hang from the same supporting string. Name the part labelled {n}.", "caption": "Two bottles of water hung from a supporting string, for watching energy pass from one to the other.", "labels": [{"n": 1, "text": "string", "alt": [], "x": 84.4, "y": 36.8, "w": 7.7, "h": 5.1}, {"n": 2, "text": "strong support", "alt": [], "x": 84.4, "y": 67.3, "w": 10.6, "h": 10.5}, {"n": 3, "text": "plastic bottles full of water", "alt": ["plastic bottles", "bottles"], "x": 36.7, "y": 84.5, "w": 18.7, "h": 10.5}], "src": "L|string"}, {"id": "ch03-f05h1", "type": "hotspot", "topic": "3.3", "source": "opus", "image": "img/L_p27_pendulum.png", "figure": "L_p27_pendulum", "q": "Click on the label of the part that has to hold the whole weight of both bottles.", "caption": "Two bottles of water hung from a supporting string, for watching energy pass from one to the other.", "target": {"x": 89.7, "y": 72.5, "r": 7.0}, "explain": "The string is tied to a strong support so that the bottles can swing freely. Energy is passed along that string from one bottle to the other.", "src": "L|strong support"}, {"id": "ch03-f05h2", "type": "hotspot", "topic": "3.3", "source": "opus", "image": "img/L_p27_pendulum.png", "figure": "L_p27_pendulum", "q": "Click on the label of the objects that swing and pass energy from one to the other.", "caption": "Two bottles of water hung from a supporting string, for watching energy pass from one to the other.", "target": {"x": 46.1, "y": 89.8, "r": 7.0}, "explain": "When one bottle is set swinging, energy travels along the string, so the second bottle starts to swing while the first one slows down.", "src": "L|plastic bottles full of water"}, {"id": "ch03-f06a", "type": "label", "topic": "3.4", "source": "opus", "image": "img/L_p32_engine.png", "figure": "L_p32_engine", "q": "Water carries thermal energy away from a car engine. Name the part labelled {n}.", "caption": "Water carries thermal energy away from a car engine block and dissipates it at the radiator.", "labels": [{"n": 1, "text": "engine block", "alt": [], "x": 15.9, "y": 7.3, "w": 17.8, "h": 5.3}, {"n": 2, "text": "top hose", "alt": [], "x": 57.7, "y": 7.3, "w": 12.1, "h": 5.3}, {"n": 3, "text": "radiator", "alt": [], "x": 84.0, "y": 7.3, "w": 10.9, "h": 5.3}, {"n": 4, "text": "bottom hose", "alt": [], "x": 74.3, "y": 87.5, "w": 17.8, "h": 5.3}], "src": "L|engine block"}, {"id": "ch03-f06h1", "type": "hotspot", "topic": "3.4", "source": "opus", "image": "img/L_p32_engine.png", "figure": "L_p32_engine", "q": "Click on the label of the part where the thermal energy is produced.", "caption": "Water carries thermal energy away from a car engine block and dissipates it at the radiator.", "target": {"x": 24.8, "y": 9.9, "r": 7.0}, "explain": "Burning fuel makes the engine block hot. Water is pumped through it to carry that thermal energy away, otherwise the engine would overheat.", "src": "L|engine block"}, {"id": "ch03-f06h2", "type": "hotspot", "topic": "3.4", "source": "opus", "image": "img/L_p32_engine.png", "figure": "L_p32_engine", "q": "Click on the label of the part where the thermal energy is dissipated into the air.", "caption": "Water carries thermal energy away from a car engine block and dissipates it at the radiator.", "target": {"x": 89.5, "y": 9.9, "r": 7.0}, "explain": "The radiator has a very large surface area and air is driven past it, so the water flowing through cools down before it returns to the engine.", "src": "L|radiator"}, {"id": "ch03-f07a", "type": "label", "topic": "3.5", "source": "opus", "image": "img/L_p38_room.png", "figure": "L_p38_room", "q": "A convection current carries thermal energy from a heater around a room. Write down the label at position {n}.", "caption": "A convection current carries thermal energy from the heater around the whole room.", "labels": [{"n": 1, "text": "warm air cools as thermal energy is transferred to parts of the room", "alt": [], "x": 28.9, "y": 10.0, "w": 43.9, "h": 11.8}, {"n": 2, "text": "cooler air falls as it becomes more dense", "alt": [], "x": 57.6, "y": 38.5, "w": 18.6, "h": 17.9}, {"n": 3, "text": "warm air rises as it becomes less dense", "alt": [], "x": 5.5, "y": 39.1, "w": 18.6, "h": 17.9}, {"n": 4, "text": "cooler air moves to take the place of the air that is rising", "alt": [], "x": 28.9, "y": 71.7, "w": 36.8, "h": 11.8}, {"n": 5, "text": "heater", "alt": [], "x": 8.6, "y": 73.0, "w": 8.5, "h": 5.7}], "src": "L|warm air cools as thermal energy is transferred to parts of the room"}, {"id": "ch03-f07h1", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p38_room.png", "figure": "L_p38_room", "q": "Click on the label that explains why the air directly above the heater moves upwards.", "caption": "A convection current carries thermal energy from the heater around the whole room.", "target": {"x": 14.8, "y": 48.0, "r": 7.0}, "explain": "Heating air makes it expand, so the same mass fills a larger volume and its density falls. Less dense air floats upwards through the denser air around it.", "src": "L|warm air rises as it becomes less dense"}, {"id": "ch03-f07h2", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p38_room.png", "figure": "L_p38_room", "q": "Click on the label that explains why the air on the far side of the room moves downwards.", "caption": "A convection current carries thermal energy from the heater around the whole room.", "target": {"x": 66.9, "y": 47.5, "r": 7.0}, "explain": "As the air transfers its thermal energy to the room it cools and contracts, so it becomes denser and sinks. That is what completes the convection current.", "src": "L|cooler air falls as it becomes more dense"}, {"id": "ch03-f08a", "type": "label", "topic": "3.5", "source": "opus", "image": "img/L_p39_pan.png", "figure": "L_p39_pan", "q": "A pan of water is heated only at the bottom. Write down the label at position {n}.", "caption": "The pan is heated only at the bottom, but a convection current heats all of the water.", "labels": [{"n": 1, "text": "hot, less dense water rises", "alt": [], "x": 64.1, "y": 41.4, "w": 22.3, "h": 14.4}, {"n": 2, "text": "cooler water is more dense and sinks", "alt": [], "x": 64.1, "y": 62.4, "w": 30.5, "h": 14.4}], "src": "L|hot, less dense water rises"}, {"id": "ch03-f08h1", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p39_pan.png", "figure": "L_p39_pan", "q": "Click on the label that says what the water directly above the flame does.", "caption": "The pan is heated only at the bottom, but a convection current heats all of the water.", "target": {"x": 75.2, "y": 48.6, "r": 7.0}, "explain": "The water at the bottom is heated first. It expands, becomes less dense and rises, carrying thermal energy up with it.", "src": "L|hot, less dense water rises"}, {"id": "ch03-f09a", "type": "label", "topic": "3.5", "source": "opus", "image": "img/L_p40_flask.png", "figure": "L_p40_flask", "q": "This is a section through a vacuum flask. Name the part labelled {n}.", "caption": "Inside a vacuum flask: the vacuum stops conduction and the silvered wall reflects radiation back.", "labels": [{"n": 1, "text": "lid", "alt": [], "x": 54.5, "y": 9.7, "w": 6.0, "h": 7.4}, {"n": 2, "text": "outer case", "alt": [], "x": 54.5, "y": 22.5, "w": 25.1, "h": 7.4}, {"n": 3, "text": "double-walled glass vessel", "alt": ["glass vessel", "double walled glass vessel"], "x": 54.5, "y": 35.8, "w": 36.6, "h": 15.2}, {"n": 4, "text": "vacuum", "alt": [], "x": 54.5, "y": 63.0, "w": 19.5, "h": 7.4}, {"n": 5, "text": "silvered wall", "alt": ["silver wall", "silvered surface"], "x": 54.5, "y": 74.3, "w": 29.9, "h": 7.4}], "src": "L|lid"}, {"id": "ch03-f09h1", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p40_flask.png", "figure": "L_p40_flask", "q": "Click on the label of the empty gap that stops conduction and convection.", "caption": "Inside a vacuum flask: the vacuum stops conduction and the silvered wall reflects radiation back.", "target": {"x": 64.2, "y": 66.7, "r": 7.0}, "explain": "There are almost no particles in a vacuum, so there is nothing to pass energy on by conduction and nothing that can flow to carry it by convection.", "src": "L|vacuum"}, {"id": "ch03-f10a", "type": "label", "topic": "3.5", "source": "opus", "image": "img/L_p41_tank.png", "figure": "L_p41_tank", "q": "This is a hot water tank with an electric heater near the bottom. Name the part labelled {n}.", "caption": "A hot water tank: the heater sits at the bottom so convection carries warm water to the top.", "labels": [{"n": 1, "text": "hot water out", "alt": [], "x": 0.2, "y": 6.6, "w": 25.3, "h": 7.8}, {"n": 2, "text": "electric heater", "alt": ["heater", "immersion heater"], "x": 75.8, "y": 75.3, "w": 14.6, "h": 16.1}, {"n": 3, "text": "cold water in", "alt": [], "x": 0.2, "y": 79.6, "w": 24.0, "h": 7.8}], "src": "L|hot water out"}, {"id": "ch03-f10h1", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p41_tank.png", "figure": "L_p41_tank", "q": "Click on the label of the pipe that takes the hottest water away, at the top of the tank.", "caption": "A hot water tank: the heater sits at the bottom so convection carries warm water to the top.", "target": {"x": 12.8, "y": 10.5, "r": 7.0}, "explain": "The heater is near the bottom, so the water it warms rises by convection and the hottest water collects at the top. That is why the outlet is placed there.", "src": "L|hot water out"}, {"id": "ch03-f11a", "type": "label", "topic": "3.5", "source": "opus", "image": "img/L_p43_ink.png", "figure": "L_p43_ink", "q": "Coloured ink has been dropped into one side of a beaker of water that is being heated. Name the substance labelled {n}.", "caption": "Coloured ink dropped at one side of a heated beaker traces out the convection current.", "labels": [{"n": 1, "text": "coloured ink", "alt": [], "x": 67.3, "y": 43.6, "w": 25.5, "h": 8.1}], "src": "L|coloured ink"}, {"id": "ch03-f11h1", "type": "hotspot", "topic": "3.5", "source": "opus", "image": "img/L_p43_ink.png", "figure": "L_p43_ink", "q": "Click on the label of the substance added so that the movement of the water can be seen.", "caption": "Coloured ink dropped at one side of a heated beaker traces out the convection current.", "target": {"x": 80.0, "y": 47.6, "r": 7.0}, "explain": "Water is transparent, so a convection current in it is invisible. The ink is carried along by the moving water and traces out the path the water takes.", "src": "L|coloured ink"}, {"id": "ch03-f12a", "type": "label", "topic": "3.6", "source": "opus", "image": "img/L_p47_evaporation.png", "figure": "L_p47_evaporation", "q": "This diagram shows particles at the surface of a liquid. Write down the label at position {n}.", "caption": "Only the highest-energy particles escape from the surface, which is why evaporation cools the liquid left behind.", "labels": [{"n": 1, "text": "Highest energy particles can escape from the liquid.", "alt": ["highest energy particles"], "x": 11.4, "y": 9.2, "w": 73.9, "h": 20.9}, {"n": 2, "text": "Medium energy particles can escape from the liquid but get pulled back into the liquid.", "alt": ["medium energy particles"], "x": 11.4, "y": 38.5, "w": 77.3, "h": 28.1}, {"n": 3, "text": "Lowest energy particles remain in the liquid.", "alt": ["lowest energy particles"], "x": 11.4, "y": 77.0, "w": 73.3, "h": 13.8}], "src": "L|Highest energy particles can escape from the liquid."}, {"id": "ch03-f12h1", "type": "hotspot", "topic": "3.6", "source": "opus", "image": "img/L_p47_evaporation.png", "figure": "L_p47_evaporation", "q": "Click on the label that describes the particles that leave the liquid altogether.", "caption": "Only the highest-energy particles escape from the surface, which is why evaporation cools the liquid left behind.", "target": {"x": 48.4, "y": 19.6, "r": 7.0}, "explain": "Only particles with enough energy to break free of the attraction of the others can escape. Because the fastest particles are the ones that leave, the average energy of those left behind falls, so the liquid cools.", "src": "L|Highest energy particles can escape from the liquid."}, {"id": "ch03-f12h2", "type": "hotspot", "topic": "3.6", "source": "opus", "image": "img/L_p47_evaporation.png", "figure": "L_p47_evaporation", "q": "Click on the label that describes the particles that stay in the liquid.", "caption": "Only the highest-energy particles escape from the surface, which is why evaporation cools the liquid left behind.", "target": {"x": 48.0, "y": 83.9, "r": 7.0}, "explain": "Slow particles do not have enough energy to overcome the attractive forces at the surface, so they cannot escape and stay in the liquid.", "src": "L|Lowest energy particles remain in the liquid."}, {"id": "ch03-o001", "type": "short", "topic": "3.1", "source": "opus", "q": "Marcus says that metal is always heavier than polystyrene. Explain why this statement is not always true.", "answer": "A very large block of polystyrene can have a larger mass than a small piece of metal, because mass depends on volume as well as material. What is always true is that the same volume of iron has a larger mass than the same volume of polystyrene.", "keywords": ["same volume", "larger mass", "polystyrene"], "explain": "Density compares equal volumes; 'heavier' compares whatever sizes happen to be in front of you.", "src": "L|A very large block of polystyrene may have a larger mass than a small piece of metal."}, {"id": "ch03-o002", "type": "fill", "topic": "3.1", "source": "opus", "q": "A container that has a space filled with air inside it is described as ____, and the word ____ is used as its opposite.", "answer": ["hollow", "solid"], "explain": "Hollow means there is an air space inside; solid here means there is none.", "src": "L|The containers are also hollow, which means they have a space filled with air inside them."}, {"id": "ch03-o003", "type": "short", "topic": "3.1", "source": "opus", "q": "State what the word regular means when it is used to describe a block of material, and explain how you find the volume of such a block.", "answer": "Regular means that the faces of the object meet at right angles to each other. You measure the lengths of the sides and multiply them together.", "keywords": ["right angles", "multiply", "sides"], "explain": "A regular block is a box, so length x width x height gives the volume.", "src": "L|regular means that the faces of the object meet at right angles to each other"}, {"id": "ch03-o004", "type": "short", "topic": "3.1", "source": "opus", "q": "A block of wood measures 10 mm by 6 mm by 4 mm. Calculate its volume and state the unit.", "answer": "10 x 6 x 4 = 240 mm3. The unit is mm3 because the lengths of the sides are given in millimetres.", "keywords": ["240", "mm3"], "explain": "Multiply the three side lengths; the unit follows the unit of the sides.", "src": "L|10 × 6 × 4 = 240 mm3 The unit is mm3 because the lengths of the sides are in millimetres."}, {"id": "ch03-o005", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why the volume of an irregular object cannot be found by measuring its sides, and describe the method that is used instead.", "answer": "Irregular means the sides or angles of the shape are not equal, so there is no set of side lengths to multiply. Instead the displacement method is used: the object is placed into a measuring cylinder of water and the increase in the volume of the water is the volume of the object.", "keywords": ["not equal", "displacement", "increase in volume"], "explain": "No right angles means no multiplication, so the object is measured by how much water it pushes aside.", "src": "L|The object is placed into a measuring cylinder of water. The increase in volume of the water is the volume of the object."}, {"id": "ch03-o006", "type": "short", "topic": "3.1", "source": "opus", "q": "A rock is lowered into a measuring cylinder containing 40 cm3 of water. The water level rises to the 56 cm3 mark. Calculate the volume of the rock and explain your working.", "answer": "The volume of the rock is 56 - 40 = 16 cm3, because the increase in the volume of the water is equal to the volume of the object placed in it.", "keywords": ["16", "cm3", "increase"], "explain": "Displacement: final reading minus starting reading.", "src": "L|The water rises to the 56 cm3 mark. So, the volume of the rock is: 56 − 40 = 16 cm3."}, {"id": "ch03-o007", "type": "fill", "topic": "3.1", "source": "opus", "q": "Density means mass per unit ____, and is calculated using the equation density = mass divided by ____.", "answer": ["volume", "volume"], "explain": "Both blanks are volume: density is how much mass is packed into each unit of volume.", "src": "L|Density means mass per unit volume."}, {"id": "ch03-o008", "type": "short", "topic": "3.1", "source": "opus", "q": "A block of iron measuring 1 cm x 1 cm x 1 cm has a mass of 7.9 g. Calculate its density and give the unit.", "answer": "The volume is 1 x 1 x 1 = 1 cm3, so density = 7.9 / 1 = 7.9 g/cm3. The unit is g/cm3 because the mass is in grams and the volume is in cm3.", "keywords": ["7.9", "g/cm3"], "explain": "Density = mass / volume, and the unit of density is the unit of mass divided by the unit of volume.", "src": "L|if mass is in g and volume is in cm3 then density will be in g/cm3"}, {"id": "ch03-o009", "type": "short", "topic": "3.1", "source": "opus", "q": "Copper has a density of 8.96 g/cm3. Calculate the mass of a piece of copper with a volume of 20 cm3.", "answer": "mass = density x volume = 8.96 x 20 = 179.2 g.", "keywords": ["179.2", "g", "density × volume"], "explain": "Rearranging density = mass / volume gives mass = density x volume.", "src": "L|Copper has a density of 8.96 g/cm3."}, {"id": "ch03-o010", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain, using particles, why gases have lower densities than liquids or solids.", "answer": "The particles in a gas are far apart, so a given volume of gas contains far fewer particles and therefore has a much smaller mass than the same volume of a liquid or solid.", "keywords": ["far apart", "fewer particles", "volume"], "explain": "Spacing of the particles sets how much mass fits into each unit of volume.", "src": "L|Gases have lower densities than liquids or solids because the particles in a gas are far apart."}, {"id": "ch03-o011", "type": "fill", "topic": "3.1", "source": "opus", "q": "As particles in a material get packed closer together, the density of the material ____. So the materials with the highest densities are all ____.", "answer": ["increases", "solids"], "explain": "Closer packing means more mass in the same volume.", "src": "L|As particles in a material get packed closer together, the density of the material increases."}, {"id": "ch03-o012", "type": "short", "topic": "3.1", "source": "opus", "q": "Osmium has atomic number 76 and iron has atomic number 26. Use this information to compare their densities and state the general pattern for the elements.", "answer": "Osmium is more dense than iron. For the elements, the density usually increases as the atomic number increases.", "keywords": ["osmium", "more dense", "atomic number"], "explain": "Density generally rises with atomic number across the elements.", "src": "L|Osmium has atomic number 76 and is more dense than iron, which has atomic number 26."}, {"id": "ch03-o013", "type": "mcq", "topic": "3.1", "source": "opus", "q": "An object has a density of 1.2 g/cm3. Water has a density of 1.0 g/cm3. What will happen when the object is placed in water?", "options": ["It will float, because it is less dense than water", "It will sink, because it is more dense than water", "It will float, because it is more dense than water", "It will stay exactly halfway down, because the densities are close"], "answer": 1, "explain": "If something is more dense than water it sinks; 1.2 g/cm3 is greater than 1.0 g/cm3.", "src": "L|If something is more dense than water, it will sink in water."}, {"id": "ch03-o014", "type": "short", "topic": "3.1", "source": "opus", "q": "Swimming pool floats are made from polystyrene, or are hollow with only air inside. Explain why both designs work.", "answer": "Both designs give the float a very low density. Polystyrene has a very low density itself, and making an object hollow gives it a large volume for a small mass, so its density is much less than the density of water and it floats.", "keywords": ["low density", "air", "less dense than water"], "explain": "Anything less dense than water floats, and both tricks lower the density.", "src": "L|Some objects, such as floats that are used in swimming pools, are designed to have a very low density."}, {"id": "ch03-o015", "type": "short", "topic": "3.1", "source": "opus", "q": "Steel has a density of 8-9 g/cm3, which is much greater than the density of water. Explain how a ship built from steel can float.", "answer": "Ships are not solid blocks of steel. There are large spaces inside ships that contain only air, so the ship has a very large volume. The average density, which is the mass of all the materials in the ship including the air divided by the total volume, is less than the density of water.", "keywords": ["large spaces", "air", "average density", "less than"], "explain": "It is the average density of the whole ship, not the density of steel, that decides whether it floats.", "src": "L|The average density is the mass of all the materials in the ship, including the air, divided by the total volume of the ship."}, {"id": "ch03-o016", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why loading a ship with too much cargo can make it sink.", "answer": "Cargo, passengers and fuel all add mass to a ship, which increases its density. If the density of the ship becomes higher than the density of water, the ship will no longer float.", "keywords": ["add mass", "increases its density", "higher than"], "explain": "The volume of the hull stays the same, so extra mass pushes the average density past that of water.", "src": "L|Cargo, passengers and fuel all add mass to a ship, which increases its density."}, {"id": "ch03-o017", "type": "short", "topic": "3.1", "source": "opus", "q": "Three liquids are poured carefully into the same container and form separate layers. Explain how you can work out which liquid has the highest density.", "answer": "When liquids are added together carefully, the less dense liquids float on the more dense liquids, so the layers arrange themselves in order of density. The liquid in the bottom layer has the highest density and the liquid in the top layer has the lowest.", "keywords": ["less dense", "float", "bottom", "highest density"], "explain": "The stacking order of the layers is a direct reading of the order of densities.", "src": "L|When liquids are added together carefully, the less dense liquids will float on the more dense liquids."}, {"id": "ch03-o018", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why oil spilled from a ship is washed up on beaches rather than sinking to the sea bed.", "answer": "Crude oil is less dense than water, so when it spills out of ships the oil floats on the water. Waves then push the floating oil onto the beach. Oil spilling from ships is a major source of water pollution.", "keywords": ["less dense", "floats", "pollution"], "explain": "Lower density keeps the oil at the surface where waves can carry it ashore.", "src": "L|Crude oil is less dense than water. So, when crude oil spills out of ships, the oil floats on the water."}, {"id": "ch03-o019", "type": "short", "topic": "3.1", "source": "opus", "q": "Carbon dioxide has a density of 0.002 g/cm3 and a fizzy drink has a density close to 1.0 g/cm3. Explain why the bubbles rise to the top of the drink.", "answer": "The gas in the bubbles is far less dense than the liquid around it, and less dense substances float in more dense substances, so the bubbles rise to the surface.", "keywords": ["less dense", "float", "rise"], "explain": "The density difference between gas and liquid is enormous, so the bubbles rise quickly.", "src": "L|This difference in density explains why the bubbles of gas in a fizzy drink rise to the top."}, {"id": "ch03-o020", "type": "short", "topic": "3.1", "source": "opus", "q": "Hydrogen is less dense than helium, yet party balloons are filled with helium and not hydrogen. Explain why.", "answer": "Hydrogen forms an explosive mixture with air, so it would be dangerous to use in balloons. Helium is almost as light but does not react in this way.", "keywords": ["explosive mixture", "air", "dangerous"], "explain": "Safety, not density, is the reason helium is chosen.", "src": "L|Hydrogen gas is even less dense than helium, but is not used to fill balloons because hydrogen forms an explosive mixture with air."}, {"id": "ch03-o021", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain, in terms of particles, why a gas can be compressed but a solid cannot, and state what happens to the density of the gas when it is compressed.", "answer": "Solids are very difficult to compress because their particles are already in contact, while gases are easy to compress because their particles are far apart. When a gas is compressed the same number of particles is in a smaller volume, so the density of the gas increases.", "keywords": ["already in contact", "far apart", "smaller volume", "increases"], "explain": "Compression changes the volume but not the number of particles, so the density must change.", "src": "L|When a gas is compressed, the same number of particles is in a smaller volume, so the density of the gas increases."}, {"id": "ch03-o022", "type": "short", "topic": "3.1", "source": "opus", "q": "Explain why a hot air balloon rises through the air.", "answer": "Heat causes a gas to expand, so the hot air inside the balloon has the same mass in a larger volume and is less dense than the colder air outside. A less dense substance floats in a more dense substance, so the balloon rises.", "keywords": ["expand", "less dense", "colder air outside"], "explain": "Heating lowers the density of the trapped air below that of the surrounding air.", "src": "L|the hot air inside the balloon is less dense than the colder air outside"}, {"id": "ch03-o023", "type": "short", "topic": "3.2", "source": "opus", "q": "State the unit in which thermal energy is measured, and describe what happens to the particles in an object when its thermal energy increases.", "answer": "Thermal energy is measured in joules. When the thermal energy of an object increases, the particles in the object start to vibrate faster, so the energy of the particles increases.", "keywords": ["joules", "vibrate faster"], "explain": "More thermal energy means faster particle vibration.", "src": "L|When the thermal energy of an object increases, the particles in the object start to vibrate faster."}, {"id": "ch03-o024", "type": "fill", "topic": "3.2", "source": "opus", "q": "Heat is the ____ thermal energy of the vibrating particles in an object, while temperature is the ____ energy of the particles.", "answer": ["total", "average"], "explain": "Total versus average is the whole difference between heat and temperature.", "src": "L|Heat is the total thermal energy of the vibrating particles in an object."}, {"id": "ch03-o025", "type": "short", "topic": "3.2", "source": "opus", "q": "Two glasses hold the same volume of water, but one is at a higher temperature than the other. Compare the heat of the two glasses of water and explain your answer.", "answer": "The water at the higher temperature has the greater heat. The number of particles in both glasses is the same, but the particles in the hotter water are moving faster, so the total thermal energy of all the particles is larger.", "keywords": ["higher temperature", "same number", "moving faster", "total"], "explain": "Same particle count, more energy each, so more heat in total.", "src": "L|The water at the higher temperature contains particles that are moving faster."}, {"id": "ch03-o026", "type": "short", "topic": "3.2", "source": "opus", "q": "Two glasses of water are at the same temperature, but one contains a much larger volume of water. Compare the heat of the two, and explain your answer.", "answer": "The larger volume of water has the greater heat. It contains more particles, and although the average energy of each particle is the same, the total thermal energy of all the particles is greater.", "keywords": ["larger volume", "more particles", "total", "greater"], "explain": "Same energy per particle, more particles, so more heat in total.", "src": "L|That means the larger volume of water has greater total thermal energy (heat) than the smaller volume, even when their temperatures are the same."}, {"id": "ch03-o027", "type": "short", "topic": "3.2", "source": "opus", "q": "State the two things that the temperature of an object tells you.", "answer": "It tells you the direction that thermal energy will be transferred, and the average energy of the particles in the object.", "keywords": ["direction", "average energy"], "explain": "Temperature is both a direction indicator and an average of particle energy.", "src": "L|the direction that thermal energy will be transferred"}, {"id": "ch03-o028", "type": "short", "topic": "3.2", "source": "opus", "q": "Ice cream at -20 degrees Celsius is taken out into a room at 24 degrees Celsius. State the direction in which thermal energy is transferred, and explain how the size of the temperature difference affects the transfer.", "answer": "Thermal energy is transferred from the air to the ice cream, because thermal energy is transferred from areas of higher temperature to areas of lower temperature. The temperature difference is 44 degrees, and the larger the temperature difference between two objects, the faster the thermal energy transfer.", "keywords": ["from the air", "higher to lower", "larger", "faster"], "explain": "Direction is set by which is hotter; rate is set by how big the gap is.", "src": "L|The larger a temperature difference between two objects, the faster the thermal energy transfer."}, {"id": "ch03-o029", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain why temperature, rather than heat, is a useful way of comparing objects of different sizes made from different materials.", "answer": "Temperature tells us the average energy of the particles, so it does not depend on how many particles there are. That lets you compare, for example, 100 particles of soup with 100 particles of water even though the objects differ in size and material.", "keywords": ["average energy", "does not depend", "number of particles"], "explain": "An average strips out the effect of sample size, which a total cannot do.", "src": "L|Temperature tells us the average energy of the particles."}, {"id": "ch03-o030", "type": "short", "topic": "3.2", "source": "opus", "q": "A sparkler burns at about 1000 degrees Celsius, but a spark landing on your hand does not cause serious burns. Explain why.", "answer": "The mass of the spark is very small, so it contains very few particles and its total thermal energy, or heat, is very small. The temperature difference between the spark and the air is very large, so thermal energy is transferred from the spark to the air quickly, and by the time the spark reaches your skin both its temperature and its heat have decreased significantly.", "keywords": ["very small", "few particles", "heat", "transferred quickly"], "explain": "High temperature with almost no heat, and it loses even that on the way down.", "src": "L|the mass of the spark is very small and the temperature difference between the air and the spark is very large"}, {"id": "ch03-o031", "type": "short", "topic": "3.2", "source": "opus", "q": "Zara says that if object X has a higher temperature than object Y, then X must always have more heat than Y. Explain whether she is correct.", "answer": "She is not correct. Temperature is the average energy of the particles while heat is the total thermal energy of all the particles, so an object at a high temperature with very few particles, such as a spark, can have less heat than a much larger cooler object.", "keywords": ["not correct", "average", "total", "number of particles"], "explain": "A small very hot thing can hold less energy in total than a large warm thing.", "src": "L|Heat is the total thermal energy of the vibrating particles in an object."}, {"id": "ch03-o032", "type": "short", "topic": "3.2", "source": "opus", "q": "Explain what Kelvin predicted about the lowest possible temperature, and state the value of absolute zero.", "answer": "As the temperature of an object decreases the particles move more slowly, and Kelvin predicted that particles would eventually stop moving if the temperature were low enough, and that this would be the lowest possible temperature. This temperature is called absolute zero and is -273 degrees Celsius.", "keywords": ["stop moving", "lowest possible", "absolute zero", "273"], "explain": "Absolute zero is where particle motion would cease.", "src": "L|As the temperature of an object decreases, the particles move more slowly."}, {"id": "ch03-o033", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain the difference between what people usually mean by conserving energy and what a scientist means by saying that energy is conserved.", "answer": "People often talk about conserving energy when they mean using less energy, such as switching off a lamp. In physics, saying that energy is conserved means that the total quantity of energy stays the same, whether the energy is stored, changed, transferred or dissipated.", "keywords": ["using less", "total quantity", "stays the same"], "explain": "The everyday meaning is about saving energy; the physics meaning is about the total never changing.", "src": "L|When we say that energy is conserved, we mean that the total quantity of energy stays the same."}, {"id": "ch03-o034", "type": "short", "topic": "3.3", "source": "opus", "q": "An electric lamp is supplied with 100 J of electrical energy. 10 J is changed to light energy. State how much is changed to thermal energy, name the useful and wasted outputs, and explain how this shows energy is conserved.", "answer": "90 J is changed to thermal energy. The light energy is useful and the thermal energy is wasted. The total energy input of 100 J is the same as the total energy output of 10 J + 90 J = 100 J, so energy is conserved.", "keywords": ["90", "useful", "wasted", "input equals output"], "explain": "Outputs add back up to the input, which is what conservation means.", "src": "L|every time 100 J of electrical energy is supplied to the lamp, 10 J of this is changed to light energy and 90 J is changed to thermal energy"}, {"id": "ch03-o035", "type": "fill", "topic": "3.3", "source": "opus", "q": "In an energy diagram, the electrical energy supplied is called the energy ____ and the light and thermal energy together are called the energy ____.", "answer": ["input", "output"], "explain": "What goes in is the input; everything that comes out is the output.", "src": "L|The electrical energy is called the energy input and the light and thermal energy together are called the energy output."}, {"id": "ch03-o036", "type": "short", "topic": "3.3", "source": "opus", "q": "In physics, what is meant by a system? Give one example.", "answer": "A system is something that has been chosen to study, especially in terms of energy changes. An electric lamp or a car engine is an example of a system.", "keywords": ["chosen to study", "energy changes"], "explain": "A system is simply the part of the world you have drawn a boundary around.", "src": "L|a system is something that has been chosen to study, especially in terms of energy changes"}, {"id": "ch03-o037", "type": "short", "topic": "3.3", "source": "opus", "q": "Explain why the total energy output of a system can never be greater than the total energy input.", "answer": "Energy cannot be created. Created means to make something, or to bring something into existence, so no system can produce energy that was not supplied to it.", "keywords": ["cannot be created", "input"], "explain": "There is no source for the extra energy, so the output cannot exceed the input.", "src": "L|The total energy output can never be greater than the total energy input in any type of system."}, {"id": "ch03-o038", "type": "short", "topic": "3.3", "source": "opus", "q": "Wasted thermal energy from a lamp is said to be dissipated. Explain what dissipated means, and explain why this does not break the law of conservation of energy.", "answer": "Dissipated means the energy spreads out into the surroundings and becomes less useful. The energy is not destroyed, only spread out, so the total quantity of energy is still the same and the law of conservation of energy still holds.", "keywords": ["spreads out", "less useful", "not destroyed"], "explain": "Dissipation changes how useful energy is, not how much of it there is.", "src": "L|Dissipated means this energy spreads out into the surroundings and becomes less useful."}, {"id": "ch03-o039", "type": "mcq", "topic": "3.3", "source": "opus", "q": "Which of these is the law of conservation of energy?", "options": ["Energy can be created but not destroyed", "Energy can be destroyed but not created", "Energy cannot be created or destroyed, only changed from one form to another", "Energy is used up when it is transferred"], "answer": 2, "explain": "Energy only changes form; the total never changes.", "src": "L|The law of conservation of energy states that energy cannot be created or destroyed, only changed from one form to another."}, {"id": "ch03-o040", "type": "short", "topic": "3.3", "source": "opus", "q": "An electric motor is supplied with 1000 J of electrical energy and produces 500 J of kinetic energy. Calculate the thermal energy produced and explain your working.", "answer": "1000 - 500 = 500 J of thermal energy. The total energy output must equal the total energy input, so any input energy that does not become kinetic energy must appear as thermal energy.", "keywords": ["500", "input", "output", "equal"], "explain": "Conservation of energy turns the diagram into a subtraction.", "src": "L|The total energy output can never be greater than the total energy input in any type of system."}, {"id": "ch03-o041", "type": "short", "topic": "3.3", "source": "opus", "q": "In a wood fire, 70% of the chemical energy in the wood is changed to thermal energy and the rest is changed to light and waste chemicals. Calculate the percentage changed to light and waste chemicals.", "answer": "100% - 70% = 30% is changed to light and waste chemicals.", "keywords": ["30", "100"], "explain": "Percentages of the output must add up to the 100% supplied.", "src": "L|In a wood fire, 70% of the chemical energy in wood is changed to thermal energy."}, {"id": "ch03-o042", "type": "fill", "topic": "3.4", "source": "opus", "q": "Thermal energy always moves from ____ places to ____ places.", "answer": ["hotter", "colder"], "explain": "Hotter means at a higher temperature and colder means at a lower temperature.", "src": "L|Thermal energy always moves from hotter places to colder places. Colder means at a lower temperature."}, {"id": "ch03-o043", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why you feel heat in your hands when you hold a hot drink, and state the condition that must be met for this to happen.", "answer": "Thermal energy moves from the drink, through the container and into your hands. This will only happen if the drink is hotter than your hands, because thermal energy always moves from hotter places to colder places.", "keywords": ["hotter than", "moves", "hands"], "explain": "You feel warmth only when energy is arriving, which needs the drink to be at the higher temperature.", "src": "L|When you put your hands around a hot drink, you can feel heat in your hands. This will only happen if the drink is hotter than your hands."}, {"id": "ch03-o044", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why food placed in a refrigerator becomes colder.", "answer": "The food is hotter than the inside of the refrigerator, so thermal energy transfers out of the food into the colder surroundings, and the food becomes colder.", "keywords": ["transfers out", "colder", "thermal energy"], "explain": "The refrigerator does not add cold; it takes thermal energy away.", "src": "L|When you put food into a refrigerator, thermal energy transfers out of the food, and the food becomes colder."}, {"id": "ch03-o045", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain the purpose of the water inside a car engine.", "answer": "There is water inside a car engine to remove thermal energy from the metal engine parts. This stops the engine overheating.", "keywords": ["remove thermal energy", "metal engine parts", "overheating"], "explain": "The water is cooler than the metal, so thermal energy transfers into it and is carried away.", "src": "L|There is water inside a car engine to remove thermal energy from the metal engine parts."}, {"id": "ch03-o046", "type": "short", "topic": "3.4", "source": "opus", "q": "Sofia says that when she holds a piece of ice, cold moves from the ice into her hand. Explain why she is wrong and describe what really happens.", "answer": "Cold is not a type of energy; cold means there is less thermal energy. When you hold the ice, thermal energy transfers away from your hand and into the ice, and you feel cold because thermal energy has been transferred away from your hand.", "keywords": ["cold is not", "less thermal energy", "away from your hand"], "explain": "Only thermal energy moves, and it always moves from the hotter hand to the colder ice.", "src": "L|Cold is not a type of energy. Cold means there is less thermal energy."}, {"id": "ch03-o047", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain why holding ice for too long can damage your skin.", "answer": "Thermal energy keeps transferring from your hand into the ice, and your skin needs the correct quantity of thermal energy to function, so losing too much thermal energy damages it.", "keywords": ["thermal energy", "correct quantity", "function"], "explain": "Skin cells only work within a narrow range of thermal energy.", "src": "L|You can damage your skin by holding ice for too long, as your skin needs the correct quantity of thermal energy to function."}, {"id": "ch03-o048", "type": "short", "topic": "3.4", "source": "opus", "q": "Explain what happens in terms of thermal energy when a window is opened in a hot room on a colder day.", "answer": "Thermal energy from the hotter inside moves to the colder outside, because thermal energy always moves from hotter places to colder places, so the room cools down.", "keywords": ["hotter inside", "colder outside", "moves"], "explain": "The window simply opens a route for thermal energy to leave.", "src": "L|When it is colder outside and you open a window, the inside cools down."}, {"id": "ch03-o049", "type": "short", "topic": "3.4", "source": "opus", "q": "State what is meant by dissipation, and describe what determines how fast thermal energy is dissipated.", "answer": "Dissipation is used to describe energy that spreads out and becomes less useful. The rate, or speed, of thermal energy transfer increases when the temperature difference between the hot place and the cold place increases.", "keywords": ["spreads out", "less useful", "temperature difference", "increases"], "explain": "A bigger temperature gap drives a faster transfer.", "src": "L|The rate, or speed, of thermal energy transfer increases when the temperature difference between the hot place and the cold place increases."}, {"id": "ch03-o050", "type": "short", "topic": "3.4", "source": "opus", "q": "Marcus says that dissipated thermal energy has disappeared. Explain whether he is correct.", "answer": "He is not correct. Energy is always conserved, so the thermal energy has not disappeared or been destroyed; it has just spread out and moved to a colder place, where it is less useful.", "keywords": ["not correct", "conserved", "spread out", "colder place"], "explain": "Dissipated energy is still there, just too spread out to be useful.", "src": "L|the thermal energy has not disappeared or been destroyed, it has just spread out and moved to a colder place"}, {"id": "ch03-o051", "type": "short", "topic": "3.5", "source": "opus", "q": "Describe what happens to the particles in a solid when it is heated, and explain why the solid expands. Use the word vigorously in your answer.", "answer": "In solids, the particles move by vibrating around fixed positions, and this vibration gets faster when the solid is heated. As the particles vibrate more vigorously they take up more space, so the solid expands. Vigorously means with more energy, more speed and more force.", "keywords": ["vibrating", "fixed positions", "more space", "expands"], "explain": "Faster vibration needs more room, so the whole solid grows.", "src": "L|As the particles vibrate more vigorously, they take up more space. Vigorously means with more energy, more speed and more force."}, {"id": "ch03-o052", "type": "short", "topic": "3.5", "source": "opus", "q": "Describe how the particles in a gas move, and explain what changes when the gas is heated.", "answer": "In gases, the particles are far apart and move in straight lines until they collide with another particle or the walls of the container. When the gas is heated the particles move faster and collide with more force and more frequently, and they take up more space, so the gas expands.", "keywords": ["far apart", "straight lines", "collide", "expands"], "explain": "Heating speeds the particles up, so collisions are harder and more frequent.", "src": "L|In gases, the particles are far apart and move in straight lines until they collide with another particle or the walls of the container."}, {"id": "ch03-o053", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain how thermal energy is transferred through a solid by conduction.", "answer": "When particles are vibrating they push against the particles beside them. The faster and more vigorous the vibration, the greater the push, and this causes the particles beside them to vibrate more vigorously as well, passing the thermal energy along the solid.", "keywords": ["push", "beside them", "vibrate more vigorously"], "explain": "Conduction is a chain of pushes between neighbouring particles.", "src": "L|When particles are vibrating, they will push against the particles beside them."}, {"id": "ch03-o054", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why conduction works best in solids.", "answer": "Conduction works best in solids because the particles are close together and can only move by vibrating, so vibrations are passed on easily from one particle to the next.", "keywords": ["close together", "only", "vibrating"], "explain": "Close packing plus fixed positions is the ideal arrangement for passing vibrations on.", "src": "L|Conduction of thermal energy works best in solids where the particles are close together and can only move by vibrating."}, {"id": "ch03-o055", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why metals are better conductors of thermal energy than fabrics such as wool and cotton.", "answer": "Metals are the best conductors of heat because of the way their particles are arranged, and the electrons that are free to move in a metal help to pass along the vibrations. Fabrics such as wool and cotton, and plastics, are poor conductors, and poor conductors of thermal energy are good thermal insulators.", "keywords": ["free to move", "electrons", "poor conductors", "insulators"], "explain": "Free electrons give metals a second, faster route for the energy.", "src": "L|The electrons that are free to move in a metal help to pass along the vibrations."}, {"id": "ch03-o056", "type": "short", "topic": "3.5", "source": "opus", "q": "A cooking pan is made from metal but its handle is made from plastic and the spoon from wood. Explain these choices.", "answer": "Metal is a good conductor of thermal energy, which helps the food to heat faster. Plastic and wood are good thermal insulators, so the handle and the spoon stay comfortable to touch instead of conducting thermal energy to the hand.", "keywords": ["good conductor", "insulator", "comfortable to touch"], "explain": "You want fast conduction into the food and slow conduction into your hand.", "src": "L|The handle is made from plastic because plastic is a good thermal insulator. That makes the handle comfortable to touch."}, {"id": "ch03-o057", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why conduction cannot happen in a vacuum.", "answer": "There are no particles to vibrate in a vacuum, and conduction depends on vibrating particles pushing against their neighbours, so conduction cannot happen there.", "keywords": ["no particles", "vibrate", "vacuum"], "explain": "No particles means no mechanism for conduction.", "src": "L|Conduction cannot happen in a vacuum as there are no particles to vibrate in a vacuum."}, {"id": "ch03-o058", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain, using the density equation, why a heated part of a liquid or gas rises.", "answer": "When a liquid or gas is heated the particles take up more space, so the volume increases. The number of particles does not change, so the mass stays the same. Since density is mass divided by volume, the density decreases, and less dense substances float in more dense substances, so the heated part floats upwards.", "keywords": ["volume increases", "mass stays the same", "density decreases", "float"], "explain": "Volume up with mass unchanged is exactly a fall in density.", "src": "L|The number of particles does not change, so the mass of the liquid or gas does not change."}, {"id": "ch03-o059", "type": "short", "topic": "3.5", "source": "opus", "q": "Describe how a convection current forms when a liquid is heated from the bottom, and explain what it achieves.", "answer": "The part of the liquid at the bottom becomes less dense and starts to float up through the colder, more dense parts, which is convection. Colder, more dense parts then sink down to occupy the space, get heated in turn and rise. This movement is called a convection current, and it causes all of the liquid to eventually become heated.", "keywords": ["less dense", "float up", "sink down", "all of the liquid"], "explain": "The circulation keeps bringing cold material to the heat source until everything is warmed.", "src": "L|This movement around the heated liquid or gas is called a convection current."}, {"id": "ch03-o060", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why convection can happen in liquids and gases but not in solids or in a vacuum.", "answer": "Convection can happen in liquids and gases because the particles are free to move. It cannot happen in a solid because the particles are not free to move and can only vibrate about fixed positions, and it cannot happen in a vacuum because there are no particles to move.", "keywords": ["free to move", "fixed positions", "no particles"], "explain": "Convection needs particles that can travel, not just vibrate.", "src": "L|Convection cannot happen in a solid because the particles are not free to move."}, {"id": "ch03-o061", "type": "short", "topic": "3.5", "source": "opus", "q": "There is a vacuum between the Sun and the Earth. Explain how thermal energy from the Sun still reaches us, and state how long it takes.", "answer": "Conduction and convection cannot transfer thermal energy through a vacuum, so the energy is transferred by radiation. Radiation is a type of wave that we cannot see and does not need particles, so it can pass through a vacuum. The thermal energy from the Sun takes about nine minutes to reach Earth.", "keywords": ["radiation", "wave", "does not need particles", "nine minutes"], "explain": "Radiation is the only one of the three that works without particles.", "src": "L|Radiation can pass through a vacuum because radiation does not need particles."}, {"id": "ch03-o062", "type": "fill", "topic": "3.5", "source": "opus", "q": "All objects give out thermal energy through radiation. The ____ the object, the more radiation it will emit, and cooler objects ____ thermal energy by radiation from hotter ones.", "answer": ["hotter", "absorb"], "explain": "Emission rises with temperature; the cooler body is the net absorber.", "src": "L|All objects give out thermal energy through radiation. The hotter the object, the more radiation it will emit."}, {"id": "ch03-o063", "type": "short", "topic": "3.5", "source": "opus", "q": "Describe the surfaces that are the best emitters and absorbers of radiation, and those that are the worst.", "answer": "The best emitters and absorbers of radiation are dull, are black, and have a large surface area. The worst emitters and absorbers are shiny, are white or silver, and have a small surface area. Shiny, white or silver surfaces reflect radiation away.", "keywords": ["dull", "black", "large surface area", "shiny", "reflect"], "explain": "Dull black with a big area both absorbs and emits best; shiny pale surfaces reflect.", "src": "L|Shiny, white or silver surfaces reflect radiation away."}, {"id": "ch03-o064", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why the radiator in a car engine is painted black and has many thin metal fins attached to it.", "answer": "The radiator is designed to radiate thermal energy away. Black surfaces are the best emitters of radiation, and the thin metal fins give the radiator a large surface area, which also increases the radiation emitted.", "keywords": ["black", "best emitter", "large surface area"], "explain": "Both features are chosen to maximise the radiation given out.", "src": "L|The radiator in a car engine is designed to radiate thermal energy, so it is black"}, {"id": "ch03-o065", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why buildings in many hot countries are painted white, and why penguins have black feathers on their backs.", "answer": "White surfaces reflect radiation away and are poor absorbers, so buildings painted white absorb less thermal energy from radiation and stay cooler. Black surfaces are the best absorbers, so penguins have black feathers on their backs to absorb as much thermal energy from radiation as possible.", "keywords": ["white", "reflect", "absorb less", "black", "absorb"], "explain": "The same rule read in both directions: black absorbs, white reflects.", "src": "L|Buildings in many hot countries are painted white so they absorb less thermal energy from radiation."}, {"id": "ch03-o066", "type": "short", "topic": "3.5", "source": "opus", "q": "A room heater has hot water flowing through the inside. Describe how all three ways of transferring thermal energy are involved in heating the room.", "answer": "Thermal energy from the hot water is transferred to the metal of the heater by conduction, and from the metal to the air also by conduction. The warm air expands and rises, which heats the air above by convection. The metal surface of the heater also emits thermal energy by radiation.", "keywords": ["conduction", "convection", "radiation", "rises"], "explain": "Most real objects use a combination of conduction, convection and radiation.", "src": "L|Most objects gain or lose thermal energy by a combination of conduction, convection and radiation."}, {"id": "ch03-o067", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain how the vacuum and the silver surface inside a vacuum flask each slow down the transfer of thermal energy.", "answer": "The vacuum surrounding the bottle prevents conduction of thermal energy from the drink to the outside, because there are no particles to pass on vibrations. The silver surface of the bottle reflects thermal energy in the form of radiation back into the hot drink.", "keywords": ["vacuum", "prevents conduction", "silver", "reflects", "radiation"], "explain": "One feature blocks conduction, the other blocks radiation.", "src": "L|The vacuum surrounding the bottle prevents conduction of thermal energy from the drink to the outside."}, {"id": "ch03-o068", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain how double glazed windows and foam-filled cavity walls reduce thermal energy transfer out of a building.", "answer": "Double glazed windows have two layers of glass separated by a thin layer of argon gas, and argon is a poor conductor of heat. The cavity in the wall is filled with foam, which is a poor conductor and also fills the space to prevent convection currents from forming inside the wall.", "keywords": ["argon", "poor conductor", "foam", "prevent convection"], "explain": "Both designs attack conduction, and the foam blocks convection as well.", "src": "L|The foam is a poor conductor and also fills the space to prevent convection currents from forming inside the wall."}, {"id": "ch03-o069", "type": "short", "topic": "3.5", "source": "opus", "q": "Explain why covering car windows with silver material stops the inside of a parked car becoming too hot.", "answer": "Silver surfaces are poor absorbers and reflect radiation away, so the silver material reflects radiation from the Sun away from the inside of the car instead of letting it be absorbed.", "keywords": ["silver", "reflect", "radiation", "Sun"], "explain": "Reflecting the radiation stops it ever being absorbed inside the car.", "src": "L|Car windows can be covered with silver material to reflect radiation from the Sun away from the inside of the car"}, {"id": "ch03-o070", "type": "mcq", "topic": "3.5", "source": "opus", "q": "Which two ways of transferring thermal energy cannot occur in a vacuum?", "options": ["Conduction and radiation", "Convection and radiation", "Conduction and convection", "Radiation only"], "answer": 2, "explain": "Conduction and convection both need particles; radiation does not.", "src": "L|Convection cannot happen in a vacuum as there are no particles to move."}, {"id": "ch03-o071", "type": "short", "topic": "3.6", "source": "opus", "q": "State what evaporation is, and explain how it can happen at 22 degrees Celsius when the boiling point of water is 100 degrees Celsius.", "answer": "Evaporation is the change of state from liquid to gas. The particles in a liquid move at random speeds, and some of them are moving fast enough to have sufficient energy to escape from the surface and become particles of a gas, even though the liquid as a whole is far below its boiling point.", "keywords": ["change of state", "liquid to gas", "escape", "surface"], "explain": "Evaporation only needs the fastest particles at the surface to have enough energy, not the whole liquid.", "src": "L|Some of these particles have enough energy to escape from the surface of the liquid and become particles of a gas."}, {"id": "ch03-o072", "type": "fill", "topic": "3.6", "source": "opus", "q": "The particles in a liquid move in random directions at random speeds. The word random means ____.", "answer": ["unpredictable"], "explain": "Random describes both the direction and the speed of the particles.", "src": "L|The word random means unpredictable."}, {"id": "ch03-o073", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why evaporation causes cooling. Use the idea of average particle energy in your answer.", "answer": "Temperature is a measure of the average energy of the particles. When the particles with the highest energy escape from the liquid, this lowers the average energy of the particles that remain, so the temperature of the liquid falls and evaporation causes cooling.", "keywords": ["highest energy", "escape", "average energy", "lower"], "explain": "Removing the most energetic particles pulls the average down.", "src": "L|When the particles with the highest energy escape from the water, this will lower the average energy of the particles that remain."}, {"id": "ch03-o074", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why you feel cold when you get out of a swimming pool.", "answer": "The water on your skin evaporates. The particles with the highest energy escape, and the energy provided to change the state of the water from liquid to gas comes from your skin, so your skin loses thermal energy and cools.", "keywords": ["evaporates", "energy", "comes from your skin", "loses"], "explain": "The change of state is paid for with thermal energy taken from your skin.", "src": "L|the energy provided to change the state of the water from liquid to gas comes from your skin"}, {"id": "ch03-o075", "type": "short", "topic": "3.6", "source": "opus", "q": "Many people think that the liquid on the skin alone causes cooling. Explain the correct sequence by which sweat cools the skin.", "answer": "Since the sweat was produced in the skin, it starts at the same temperature as the skin. When the sweat evaporates, its temperature drops. Thermal energy from the skin is then transferred to the cooler sweat, and this continues to lower the skin temperature.", "keywords": ["same temperature", "evaporates", "temperature drops", "transferred"], "explain": "Sweat has to evaporate first; only then is it cooler than the skin and able to take energy from it.", "src": "L|since the sweat was produced in the skin, it is at the same temperature as the skin"}, {"id": "ch03-o076", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain why very humid conditions can be dangerous for someone working hard in the heat.", "answer": "In very humid conditions sweat may not be able to evaporate, so the cooling effect of evaporation is lost. Without this cooling effect the body temperature can increase, which can be dangerous.", "keywords": ["humid", "cannot evaporate", "body temperature", "increase"], "explain": "No evaporation means no route for the body to lose the thermal energy it produces.", "src": "L|In very humid conditions, sweat may not be able to evaporate."}, {"id": "ch03-o077", "type": "short", "topic": "3.6", "source": "opus", "q": "A water cooler is made from porous clay. Explain what porous means and how the cooler works.", "answer": "Porous means that water can slowly soak through the clay. Some water soaks through to the outside of the cooler and evaporates into the surrounding air, and this evaporation cools the water still inside the cooler.", "keywords": ["soak through", "evaporates", "cooling"], "explain": "The clay lets a little water reach the outside, where evaporation removes thermal energy.", "src": "L|The water cooler is made from porous clay. The word porous means that water can slowly soak through the clay."}, {"id": "ch03-o078", "type": "short", "topic": "3.6", "source": "opus", "q": "Explain how an air cooler containing a sponge soaked in water cools the air blown through it.", "answer": "A fan blows warm air from the room through the wet sponge. The warm air provides the thermal energy needed to evaporate the water, so the thermal energy of the air decreases and the air is cooled.", "keywords": ["warm air", "provides", "evaporate", "decreases"], "explain": "The air pays for the evaporation with its own thermal energy.", "src": "L|The warm air provides the thermal energy to evaporate the water, and so the thermal energy of the air decreases, cooling the air."}, {"id": "ch03-o079", "type": "short", "topic": "3.6", "source": "opus", "q": "Equal volumes of perfume and water at the same temperature are put on the skin. Explain why the perfume feels colder.", "answer": "Perfumes have weaker forces between the particles, so perfume evaporates faster than water. Faster evaporation removes thermal energy from the skin faster, so the perfume feels colder.", "keywords": ["weaker forces", "evaporates faster", "removes thermal energy"], "explain": "Weaker forces between particles let more of them escape per second.", "src": "L|Perfume evaporates faster than water, so removes thermal energy faster."}, {"id": "ch03-o080", "type": "short", "topic": "3.6", "source": "opus", "q": "Equal volumes of liquid soap and water at the same temperature are put on the skin. Predict which will feel colder and explain why.", "answer": "The water will feel colder. Liquid soap has stronger forces between the particles and evaporates much more slowly than water, so water removes thermal energy from the skin faster.", "keywords": ["water", "stronger forces", "more slowly", "faster"], "explain": "Stronger forces between particles make it harder for them to escape, so cooling is slower.", "src": "L|Liquid soap evaporates much more slowly than water."}, {"id": "ch03-o081", "type": "mcq", "topic": "3.6", "source": "opus", "q": "Hot water at 80 degrees Celsius is left in an open beaker in a room at 20 degrees Celsius. Which change of state takes place at the surface of the water?", "options": ["Freezing", "Condensation", "Evaporation", "Boiling"], "answer": 2, "explain": "Particles with the highest energy escape from the surface as a gas, well below the boiling point.", "src": "L|Evaporation is the change of state from liquid to gas."}, {"id": "ch03-o082", "type": "mcq", "topic": "3.2", "source": "opus", "q": "Two blocks of copper are both at 25 degrees Celsius. Block A has a mass of 10 g and block B has a mass of 80 g. Which statement is correct?", "options": ["A and B have the same temperature and the same heat", "A and B have the same temperature, but B has more heat", "B has a higher temperature and more heat than A", "A has more heat because it heats up faster"], "answer": 1, "explain": "Equal temperatures mean equal average particle energy, but B has more particles so a greater total.", "src": "L|That means the larger volume of water has greater total thermal energy (heat) than the smaller volume, even when their temperatures are the same."}, {"id": "ch03-o083", "type": "fill", "topic": "3.3", "source": "opus", "q": "Energy is always ____, meaning that energy cannot be ____ or ____.", "answer": ["conserved", "created", "destroyed"], "explain": "This is the law of conservation of energy in the words used in the check-your-progress questions.", "src": "L|The law of conservation of energy states that energy cannot be created or destroyed, only changed from one form to another."}, {"id": "ch03-o084", "type": "short", "topic": "3.2", "source": "opus", "q": "A small metal ball at 200 degrees Celsius is dropped into water at 4 degrees Celsius. Describe what happens to the temperature of the ball and of the water, and state what is true once they stop changing.", "answer": "Thermal energy is transferred from the hotter ball to the colder water, so the temperature of the ball falls and the temperature of the water rises. The transfer is fastest at the start when the temperature difference is largest. Once the temperatures stop changing, the temperature of the ball and the temperature of the water are the same.", "keywords": ["ball falls", "water rises", "same"], "explain": "Transfer continues until there is no temperature difference left to drive it.", "src": "L|Thermal energy is transferred from areas of higher temperature to areas of lower temperature."}, {"id": "ch03-o085", "type": "fill", "topic": "3.5", "source": "opus", "q": "When a solid is heated the particles take up more space, so the solid ____. This word means to increase in ____.", "answer": ["expands", "size"], "explain": "Expansion is the direct result of particles needing more room as they vibrate faster.", "src": "L|That means solids expand when heated. Expand means to increase in size."}, {"id": "qwen-01-01", "type": "mcq", "topic": "3.1", "source": "qwen", "q": "What is the scientific definition of density?", "explain": "Density means mass per unit volume.", "src": "L|Density means mass per unit volume.", "options": ["mass per unit volume", "volume per unit mass", "weight per unit area", "force per unit time"], "answer": 0}, {"id": "qwen-01-02", "type": "fill", "topic": "3.1", "source": "qwen", "q": "To find the volume of an irregular object, you place it in water and measure the increase in water level. This method is called the ____ method.", "explain": "Using the displacement method for irregular shapes.", "src": "L|we work out the volume using the displacement method", "answer": ["displacement"]}, {"id": "qwen-02-01", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "What is the unit used to measure heat?", "explain": "Thermal energy, which is heat, is measured in joules.", "src": "L|Thermal energy is measured in joules.", "options": ["Joules", "Degrees Celsius", "Newtons", "Cubic metres"], "answer": 0}, {"id": "qwen-02-02", "type": "fill", "topic": "3.2", "source": "qwen", "q": "Heat is defined as the ____ thermal energy of the vibrating particles in an object.", "explain": "Heat as the total thermal energy of the particles.", "src": "L|Heat is the total thermal energy of the vibrating particles in an object.", "answer": ["total"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "3.2", "source": "qwen", "q": "What does temperature tell us about the particles in an object?", "explain": "Temperature gives information about the average energy of the particles, while heat is the total energy.", "src": "L|Temperature tells us the average energy of the particles.", "options": ["The total energy of all particles", "The average energy of the parti
