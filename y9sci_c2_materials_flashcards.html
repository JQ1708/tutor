<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 2 — Properties of materials — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
</style>
</head>
<body>
<header>
 <div class="hrow">
  <h1>Chapter 2 — Properties of materials — Flashcards</h1>
  <span class="chip" id="mode">Mode: Flashcards</span>
  <span class="chip" id="shuf">Shuffle</span>
  <span class="chip" id="rst">Reset</span>
 </div>

</main>

n this diagram in the textbook.", "src": "L|weak intermolecular forces"}, {"id": "ch02-f10h2", "type": "hotspot", "topic": "2.4", "source": "opus", "image": "img/L_p24_co2.png", "figure": "L_p24_co2", "q": "Click on the strong covalent bonds between the carbon and oxygen atoms inside the molecules in the diagram.", "caption": "Carbon dioxide: strong covalent bonds inside each molecule, weak forces between them.", "target": {"x": 73.3, "y": 79.1, "r": 7.0}, "explain": "The strong covalent bonds between the carbon and oxygen atoms inside the molecules is labelled on this diagram in the textbook.", "src": "L|strong covalent bonds between the carbon and oxygen atoms inside the molecules"}, {"id": "ch02-f11a", "type": "label", "topic": "2.4", "source": "opus", "image": "img/L_p26_graphite.png", "figure": "L_p26_graphite", "q": "Name the part labelled {n} in the diagram.", "caption": "Graphite: strong bonds inside each layer, weak bonds between the layers.", "labels": [{"n": 1, "text": "weak bond between layers", "alt": ["weak bonds between layers", "weak intermolecular forces"], "x": 5.0, "y": 78.0, "w": 20.2, "h": 15.5}, {"n": 2, "text": "strong covalent bond within layer", "alt": ["strong covalent bonds within the layer", "covalent bond"], "x": 38.4, "y": 78.0, "w": 23.4, "h": 15.5}], "src": "L|weak bond between layers"}, {"id": "ch02-f11h1", "type": "hotspot", "topic": "2.4", "source": "opus", "image": "img/L_p26_graphite.png", "figure": "L_p26_graphite", "q": "Click on the weak bond between layers in the diagram.", "caption": "Graphite: strong bonds inside each layer, weak bonds between the layers.", "target": {"x": 15.1, "y": 85.8, "r": 7.0}, "explain": "The weak bond between layers is labelled on this diagram in the textbook.", "src": "L|weak bond between layers"}, {"id": "ch02-f11h2", "type": "hotspot", "topic": "2.4", "source": "opus", "image": "img/L_p26_graphite.png", "figure": "L_p26_graphite", "q": "Click on the strong covalent bond within layer in the diagram.", "caption": "Graphite: strong bonds inside each layer, weak bonds between the layers.", "target": {"x": 50.1, "y": 85.8, "r": 7.0}, "explain": "The strong covalent bond within layer is labelled on this diagram in the textbook.", "src": "L|strong covalent bond within layer"}, {"id": "ch02-f12a", "type": "label", "topic": "2.4", "source": "opus", "image": "img/L_p29_circuit.png", "figure": "L_p29_circuit", "q": "Name the part labelled {n} in the diagram.", "caption": "Testing whether an ionic compound conducts electricity.", "labels": [{"n": 1, "text": "carbon rods", "alt": ["carbon rod", "carbon electrodes", "electrodes"], "x": 55.1, "y": 6.8, "w": 18.0, "h": 5.3}, {"n": 2, "text": "battery", "alt": [], "x": 14.2, "y": 33.3, "w": 11.0, "h": 5.3}, {"n": 3, "text": "ionic compound", "alt": ["ionic solution", "solution of an ionic compound"], "x": 72.9, "y": 48.4, "w": 16.7, "h": 10.5}, {"n": 4, "text": "bulb", "alt": [], "x": 71.4, "y": 77.2, "w": 7.0, "h": 5.3}], "src": "L|carbon rods"}, {"id": "ch02-f12h1", "type": "hotspot", "topic": "2.4", "source": "opus", "image": "img/L_p29_circuit.png", "figure": "L_p29_circuit", "q": "Click on the carbon rods in the diagram.", "caption": "Testing whether an ionic compound conducts electricity.", "target": {"x": 64.1, "y": 9.4, "r": 7.0}, "explain": "The carbon rods is labelled on this diagram in the textbook.", "src": "L|carbon rods"}, {"id": "ch02-f12h2", "type": "hotspot", "topic": "2.4", "source": "opus", "image": "img/L_p29_circuit.png", "figure": "L_p29_circuit", "q": "Click on the battery in the diagram.", "caption": "Testing whether an ionic compound conducts electricity.", "target": {"x": 19.7, "y": 35.9, "r": 7.0}, "explain": "The battery is labelled on this diagram in the textbook.", "src": "L|battery"}, {"id": "ch02-o001", "type": "short", "topic": "2.1", "source": "opus", "q": "An atom of lithium has a mass number of 7 and an atomic number of 3. Work out how many neutrons it has, and explain the calculation.", "answer": "It has 4 neutrons. The atomic number gives the 3 protons, and the mass number counts protons plus neutrons, so the neutrons are 7 - 3 = 4.", "keywords": ["4", "mass number", "protons"], "explain": "Neutrons = mass number - atomic number.", "src": "L|We know that there are three protons so we can work out that there are four neutrons"}, {"id": "ch02-o002", "type": "short", "topic": "2.1", "source": "opus", "q": "Explain why an atom has no overall electrical charge.", "answer": "An atom contains the same number of protons as electrons. Each proton carries +1 and each electron carries -1, so the positive and negative charges cancel out exactly.", "keywords": ["same number", "protons", "electrons", "cancel"], "explain": "Equal numbers of opposite charges add up to zero.", "src": "L|An atom has no overall charge, because the number of protons is the same as the number of electrons."}, {"id": "ch02-o003", "type": "fill", "topic": "2.1", "source": "opus", "q": "The atomic number of an element tells you how many ____ its atoms contain.", "answer": ["protons"], "explain": "Atomic number = number of protons.", "src": "L|Each element has an atomic number. This tells you how many protons it contains."}, {"id": "ch02-o004", "type": "fill", "topic": "2.1", "source": "opus", "q": "The mass number tells you how many ____ and ____ each atom has in total.", "answer": ["protons", "neutrons"], "explain": "Mass number counts the two heavy particles in the nucleus.", "src": "L|Each element has a mass number. This tells you how many protons and neutrons each atom in the element has in total."}, {"id": "ch02-o005", "type": "mcq", "topic": "2.1", "source": "opus", "q": "What is the charge on a proton and on an electron?", "options": ["Proton negative, electron positive", "Proton positive, electron negative", "Both positive", "Both negative"], "answer": 1, "explain": "Protons are positive; electrons are negative; neutrons carry no charge.", "src": "L|Protons have a positive charge. Electrons have a negative charge."}, {"id": "ch02-o006", "type": "short", "topic": "2.1", "source": "opus", "q": "One atom of carbon has an atomic mass of 12 and one atom of hydrogen has an atomic mass of 1. How many times more mass does the carbon atom have, and what general rule does this show?", "answer": "Twelve times more mass. It shows that the higher the mass number, the more mass the atom has.", "keywords": ["12", "higher", "mass number"], "explain": "Mass number is a direct measure of how heavy the atom is.", "src": "L|The higher the mass number, the more mass the atom has."}, {"id": "ch02-o007", "type": "short", "topic": "2.1", "source": "opus", "q": "1 cm3 of sodium has a mass of 0.97 g and 1 cm3 of iron has a mass of 7.87 g. What quantity is being compared here, and which metal is more dense?", "answer": "Density, which is the mass of a fixed volume of a substance, measured in g/cm3. Iron is more dense than sodium.", "keywords": ["density", "iron", "fixed volume"], "explain": "Same volume, different mass - that is density.", "src": "L|This measure of the mass for a fixed volume of a substance is called the density."}, {"id": "ch02-o008", "type": "short", "topic": "2.1", "source": "opus", "q": "What was Niels Bohr's contribution to the model of the atom?", "answer": "He had the idea, with evidence, that the electrons move in separate electron shells, also called energy levels, around the nucleus, rather than in a single cloud.", "keywords": ["electron shells", "energy levels", "nucleus"], "explain": "Bohr replaced Rutherford's electron cloud with shells; the model is still used today.", "src": "L|He had the idea and evidence that the electrons move in different electron shells (also called energy levels) around the nucleus."}, {"id": "ch02-o009", "type": "fill", "topic": "2.1", "source": "opus", "q": "The first electron shell has room for only ____ electrons, while the second and third shells each have room for up to ____ electrons.", "answer": ["two", "eight"], "explain": "2, 8, 8 is the filling pattern for the first twenty elements.", "src": "L|The second and third electron shells have room for up to eight electrons."}, {"id": "ch02-o010", "type": "short", "topic": "2.1", "source": "opus", "q": "What holds the electrons in place in their shells?", "answer": "Electrostatic forces - the attraction between the positively charged protons in the nucleus and the negatively charged electrons.", "keywords": ["electrostatic forces", "attraction", "charge"], "explain": "Opposite charges attract; that pull is what keeps an electron in its shell.", "src": "L|Remember that the electrons are held in place by electrostatic forces."}, {"id": "ch02-o011", "type": "short", "topic": "2.1", "source": "opus", "q": "A boron atom has 5 electrons. Explain why its electronic structure is written 2,3 and not 3,2.", "answer": "The first shell always fills up before any electrons go into the second shell. The first shell holds two, so the remaining three go into the second shell, giving 2,3.", "keywords": ["first shell", "fills up", "before"], "explain": "Shells fill from the inside outwards.", "src": "L|The first shell always fills up before electrons go into the second shell."}, {"id": "ch02-o012", "type": "short", "topic": "2.1", "source": "opus", "q": "In the card model of an atom in Activity 2.1.1, what do the concentric rings of card represent, and what do the small green circles stuck on them represent?", "answer": "The concentric rings represent the electron shells, and the small green circles stuck onto them represent the electrons.", "keywords": ["electron shells", "electrons"], "explain": "Rings are shells; green circles are the electrons in them.", "src": "L|Cut out concentric rings of card to represent the electron shells."}, {"id": "ch02-o013", "type": "short", "topic": "2.1", "source": "opus", "q": "Describe how the mass of the atoms changes as you move through the Periodic Table.", "answer": "The atoms increase in mass as you go from left to right, starting with hydrogen, and as you go downwards in the table.", "keywords": ["increase", "left to right", "down"], "explain": "Mass rises across a period and down a group.", "src": "L|The atoms of the elements increase in mass as you progress from left to right (starting with hydrogen) and downwards in the Periodic Table."}, {"id": "ch02-o014", "type": "mcq", "topic": "2.2", "source": "opus", "q": "Which three elements are named in the book as members of Group 1?", "options": ["Helium, neon and argon", "Fluorine, chlorine and bromine", "Lithium, sodium and potassium", "Carbon, silicon and nitrogen"], "answer": 2, "explain": "Group 1 is the alkali metals: lithium, sodium and potassium.", "src": "L|The first group, also known as the alkali metals, includes the elements lithium, sodium and potassium."}, {"id": "ch02-o015", "type": "short", "topic": "2.2", "source": "opus", "q": "Both the atomic number and the mass number rise as you go down Group 1. What does that tell you about the atoms themselves?", "answer": "It tells you that the size of the atom is increasing as you go down the group.", "keywords": ["size", "increasing", "bigger"], "explain": "More protons, neutrons and electrons means a bigger atom.", "src": "L|These increasing numbers tell you that the size of the atom is increasing."}, {"id": "ch02-o016", "type": "short", "topic": "2.2", "source": "opus", "q": "Potassium melts at 63 degrees Celsius. Rubidium is the next element down in Group 1. Predict its melting point and explain your prediction.", "answer": "Lower than 63 degrees Celsius, because the melting points go down as you go down the group.", "keywords": ["lower", "63", "down the group"], "explain": "Follow the trend one step further down the group.", "src": "L|The next element down in the group is the metal rubidium."}, {"id": "ch02-o017", "type": "short", "topic": "2.2", "source": "opus", "q": "Lithium, sodium and potassium have very similar chemical properties. Which feature of their atomic structure explains this?", "answer": "Every one of them has exactly one electron in its outermost electron shell, with the shells below it full. Because they all react by losing that single outer electron, they behave in the same way.", "keywords": ["one electron", "outermost", "outer shell"], "explain": "Similar outer-shell arrangement means similar chemistry.", "src": "L|The properties of lithium, sodium and potassium are similar and so is their atomic structure."}, {"id": "ch02-o018", "type": "short", "topic": "2.2", "source": "opus", "q": "Sodium has an atomic number of 11 and a mass number of 23. State the number of protons, electrons and neutrons in one sodium atom, and give its electronic structure.", "answer": "11 protons, 11 electrons and 12 neutrons. The electronic structure is 2,8,1.", "keywords": ["11", "12", "2,8,1"], "explain": "Protons = atomic number; neutrons = 23 - 11 = 12; electrons fill 2 then 8 then 1.", "src": "L|Sodium has an atomic number of 11 and a mass number of 23. This atom contains 11 protons, 11 electrons and 12 neutrons."}, {"id": "ch02-o019", "type": "fill", "topic": "2.2", "source": "opus", "q": "The electronic structure of potassium is 2,8,8,1, so a potassium atom has ____ electron in its outermost shell.", "answer": ["one", "1"], "explain": "That single outer electron is what makes potassium a Group 1 metal.", "src": "L|Potassium has an atomic number of 19 and a mass number of 39."}, {"id": "ch02-o020", "type": "short", "topic": "2.2", "source": "opus", "q": "Name the group called the halogens and give the three halogens named in the book.", "answer": "The halogens are Group 7. The three named are fluorine, chlorine and bromine.", "keywords": ["Group 7", "fluorine", "chlorine", "bromine"], "explain": "Group 7 is the halogens.", "src": "L|The halogens are another group in the Periodic Table, known as Group 7."}, {"id": "ch02-o021", "type": "short", "topic": "2.2", "source": "opus", "q": "Fluorine, chlorine and bromine are all in Group 7. Which of them is the most reactive and which is the least?", "answer": "Fluorine is the most reactive, then chlorine, and bromine is the least reactive of the three. Reactivity falls as you go down Group 7.", "keywords": ["fluorine", "most", "bromine", "least"], "explain": "In Group 7 reactivity decreases down the group - the opposite of Group 1.", "src": "L|The most reactive is fluorine, then chlorine. Bromine is the least reactive of the three."}, {"id": "ch02-o022", "type": "mcq", "topic": "2.2", "source": "opus", "q": "At room temperature, which statement about the first three halogens is correct?", "options": ["All three are gases", "Fluorine and chlorine are gases and bromine is a liquid", "All three are liquids", "Fluorine is a solid and the other two are gases"], "answer": 1, "explain": "Bromine is the odd one out - it is a liquid at room temperature.", "src": "L|The first two elements (fluorine and chlorine) are gases at room temperature. Bromine is a liquid."}, {"id": "ch02-o023", "type": "short", "topic": "2.2", "source": "opus", "q": "Chlorine has an atomic number of 17 and a mass number of 35. Give its electronic structure and say how many electrons are in its outermost shell.", "answer": "Its electronic structure is 2,8,7. There are seven electrons in the outermost shell.", "keywords": ["2,8,7", "seven"], "explain": "Seven outer electrons is the signature of a Group 7 element.", "src": "L|Chlorine has an atomic number of 17 and a mass number of 35."}, {"id": "ch02-o024", "type": "short", "topic": "2.2", "source": "opus", "q": "Why are the elements of Group 8 called the noble gases, and what does 'inert' mean?", "answer": "They are all gases, and they are inert - unreactive - so they do not form compounds. Their outer electron shells are already full, so they have no reason to react.", "keywords": ["gases", "inert", "unreactive", "do not form compounds"], "explain": "Full outer shell means no reaction.", "src": "L|They are inert (unreactive) and do not form compounds. They are called the noble gases."}, {"id": "ch02-o025", "type": "short", "topic": "2.2", "source": "opus", "q": "Argon has an atomic number of 18 and a mass number of 40. Show that it must contain 22 neutrons, and give its electronic structure.", "answer": "Neutrons = mass number - atomic number = 40 - 18 = 22. The electronic structure is 2,8,8, and all three shells are full.", "keywords": ["22", "40", "2,8,8"], "explain": "Argon is the third noble gas, with every shell full.", "src": "L|Argon has an atomic number of 18 and a mass number of 40. This atom contains 18 protons, 18 electrons and 22 neutrons."}, {"id": "ch02-o026", "type": "short", "topic": "2.3", "source": "opus", "q": "Which shell is called the outermost electron shell, and why does the book also describe it as the shell with the highest energy level?", "answer": "It is the shell on the outside of the atom, furthest from the nucleus. That outside shell is the one with the highest energy level.", "keywords": ["outside", "highest energy level"], "explain": "Outermost shell and highest energy level are two names for the same shell.", "src": "L|The shell with the highest energy level is the one on the outside of the atom"}, {"id": "ch02-o027", "type": "short", "topic": "2.3", "source": "opus", "q": "State the single rule that explains why most elements react at all.", "answer": "Atoms are more stable when their outermost electron shell is completely full of electrons, so atoms with incomplete outer shells react in order to fill them.", "keywords": ["stable", "outermost", "full"], "explain": "Everything in this topic follows from the drive for a full outer shell.", "src": "L|Atoms are more stable when the outermost electron shell (highest energy level) is completely full of electrons."}, {"id": "ch02-o028", "type": "short", "topic": "2.3", "source": "opus", "q": "Explain why the noble gases do not react to form compounds, using the idea of electron shells.", "answer": "Their outermost energy level of electrons is already full, so they are already stable and have nothing to gain by losing, gaining or sharing electrons.", "keywords": ["full", "outermost", "stable"], "explain": "A full outer shell is the stable arrangement every other element is reaching for.", "src": "L|The elements in Group 8, the noble gases, have their outermost energy level of electrons full so they do not react to form compounds."}, {"id": "ch02-o029", "type": "mcq", "topic": "2.3", "source": "opus", "q": "What is formed when a sodium atom loses an electron?", "options": ["A sodium molecule", "An ion", "A neutron", "A new element"], "answer": 1, "explain": "Losing or gaining an electron turns an atom into a charged particle called an ion.", "src": "L|Sodium reacts with other elements by losing an electron. When this happens, the sodium atom forms an ion."}, {"id": "ch02-o030", "type": "short", "topic": "2.3", "source": "opus", "q": "A sodium ion has one less electron than a sodium atom. Explain why the sodium ion is more stable than the atom it came from.", "answer": "When the sodium atom loses the electron from its outer shell, the next shell in becomes the outermost shell, and that shell is already full. A full outer shell is the stable arrangement.", "keywords": ["next shell", "outermost", "full"], "explain": "Stripping off the lone outer electron exposes a full shell underneath.", "src": "L|When a sodium atom loses the electron from the outer shell, which is the outermost electron shell, the next shell becomes the outermost electron shell."}, {"id": "ch02-o031", "type": "short", "topic": "2.3", "source": "opus", "q": "A chlorine atom has the structure 2,8,7. Explain what it does to become more stable and what charge the resulting ion carries.", "answer": "It gains one electron to fill its outermost shell, becoming a chloride ion with the structure 2,8,8. It now has one more electron than it has protons, so it carries a charge of -1 and is written Cl-.", "keywords": ["gains", "one electron", "-1", "full"], "explain": "Non-metals gain electrons and become negative ions.", "src": "L|To fill its outermost electron shell, a chlorine atom gains an electron and forms a chlorine ion."}, {"id": "ch02-o032", "type": "short", "topic": "2.3", "source": "opus", "q": "What exactly is an ionic bond?", "answer": "It is the attraction between a positively charged ion and a negatively charged ion - for example between the positive sodium ion and the negative chlorine ion in sodium chloride.", "keywords": ["attraction", "positively", "negatively"], "explain": "The bond is nothing more than opposite charges pulling on each other.", "src": "L|In an ionic bond there is an attraction between the positively charged ion, sodium, and the negatively charged ion, chlorine."}, {"id": "ch02-o033", "type": "short", "topic": "2.3", "source": "opus", "q": "A sodium ion has 10 electrons and 11 protons. Work out its charge and explain how you know.", "answer": "There are 11 positive charges from the protons and only 10 negative charges from the electrons, so there is one unbalanced positive charge. The ion has a charge of +1 and is written Na+.", "keywords": ["11", "10", "+1"], "explain": "Count protons against electrons; the leftover is the charge.", "src": "L|When the sodium atom loses one electron and becomes a sodium ion, it has 10 electrons and 11 protons."}, {"id": "ch02-o034", "type": "short", "topic": "2.3", "source": "opus", "q": "Potassium loses its outer electron more easily than lithium does. Explain why, using the idea of electrostatic forces.", "answer": "The outer electron of potassium is furthest away from the protons in the nucleus, so the electrostatic force pulling on it is weakest and it is easiest to overcome. Lithium's outer electron is much closer in, so the force on it is stronger and harder to overcome.", "keywords": ["furthest", "electrostatic", "easier", "closer"], "explain": "Distance from the nucleus decides how tightly an electron is held.", "src": "L|The electron in the outermost electron shell of potassium is furthest away from the protons so it is easier to overcome these forces."}, {"id": "ch02-o035", "type": "short", "topic": "2.3", "source": "opus", "q": "Group 1 gets more reactive down the group but Group 7 gets less reactive down the group. Explain how the same idea about distance from the nucleus produces these opposite trends.", "answer": "Group 1 metals react by losing an outer electron, so the further that electron is from the nucleus the easier it escapes - reactivity rises down the group. Group 7 non-metals react by gaining an electron, so the closer the outer shell is to the nucleus the more strongly an incoming electron is attracted - reactivity falls down the group.", "keywords": ["losing", "gaining", "distance", "nucleus"], "explain": "Same physics, opposite job: one group is giving an electron away, the other is taking one in.", "src": "L|Fluorine gains an electron in the outermost electron shell more easily than chlorine."}, {"id": "ch02-o036", "type": "fill", "topic": "2.3", "source": "opus", "q": "Ionic compounds are made from ions. They form when a ____ reacts with a ____.", "answer": ["metal", "non-metal"], "explain": "Metal plus non-metal is the fingerprint of an ionic compound.", "src": "L|Ionic compounds are those that are made from ions. They form when a metal reacts with a non-metal."}, {"id": "ch02-o037", "type": "short", "topic": "2.3", "source": "opus", "q": "Magnesium has the electronic structure 2,8,2 and oxygen has 2,6. Describe what happens when they react, including the charges on the two ions formed.", "answer": "The magnesium atom loses both of its outer electrons and becomes a magnesium ion, Mg2+. The oxygen atom gains those two electrons and becomes an oxide ion, O2-. The two oppositely charged ions attract each other and form the ionic compound magnesium oxide, MgO.", "keywords": ["loses two", "gains two", "Mg2+", "MgO"], "explain": "Two electrons move, so both ions carry a charge of 2.", "src": "L|A magnesium atom has two electrons in the outermost electron shell, its electronic structure is 2,8,2."}, {"id": "ch02-o038", "type": "short", "topic": "2.3", "source": "opus", "q": "Magnesium reacts with oxygen to give MgO but with chlorine to give MgCl2. Explain why two chlorine atoms are needed but only one oxygen atom.", "answer": "Magnesium always gives away two electrons. An oxygen atom can accept both of them, so one oxygen is enough. A chlorine atom can accept only one electron, so two chlorine atoms are needed to take the two electrons, forming two chloride ions and the formula MgCl2.", "keywords": ["two electrons", "one", "two chlorine"], "explain": "The formula is set by how many electrons each partner can take.", "src": "L|When magnesium forms an ionic compound with chlorine, two ions of chlorine are formed."}, {"id": "ch02-o039", "type": "short", "topic": "2.3", "source": "opus", "q": "Two non-metals cannot both lose electrons. How do they fill their outer shells instead?", "answer": "They share electrons. A shared pair counts towards the outer shell of both atoms at once, so both can end up with a full outer shell.", "keywords": ["share", "electrons", "full"], "explain": "Sharing is the covalent alternative to transferring.", "src": "L|When non-metals form compounds they do so by sharing electrons to fill their outermost electron shells."}, {"id": "ch02-o040", "type": "short", "topic": "2.3", "source": "opus", "q": "A hydrogen atom has one outer electron and a chlorine atom has seven. Explain how sharing a single pair of electrons satisfies both atoms.", "answer": "The shared pair belongs to both atoms. Hydrogen's first shell, which holds only two, is then full, and chlorine's outer shell, which holds eight, is also full. A molecule of hydrogen chloride, HCl, is formed.", "keywords": ["share", "pair", "full", "HCl"], "explain": "One shared pair, two satisfied atoms.", "src": "L|the atoms share a pair of electrons, so both hydrogen and chlorine have their outermost electron shells full of electrons"}, {"id": "ch02-o041", "type": "fill", "topic": "2.3", "source": "opus", "q": "A diagram that draws one atom's electrons as dots and the other atom's as crosses is called a ____ diagram.", "answer": ["dot and cross"], "explain": "The dots and crosses only show where each electron came from; all electrons are identical.", "src": "L|This type of diagram is known as a dot and cross diagram."}, {"id": "ch02-o042", "type": "mcq", "topic": "2.3", "source": "opus", "q": "What name is given to a chemical bond in which electrons are shared?", "options": ["An ionic bond", "A covalent bond", "An electrostatic bond", "A metallic bond"], "answer": 1, "explain": "Shared electrons make a covalent bond; transferred electrons make an ionic bond.", "src": "L|This type of chemical bond where electrons are shared is called a covalent bond."}, {"id": "ch02-o043", "type": "short", "topic": "2.3", "source": "opus", "q": "A nitrogen atom has an atomic number of 7. Explain why ammonia has the formula NH3 rather than NH2 or NH4.", "answer": "Nitrogen has two electrons in the first shell and five in its outer shell, which has room for eight. It therefore needs three more electrons, so it shares three pairs with three hydrogen atoms. That gives one nitrogen to three hydrogens: NH3.", "keywords": ["five", "three", "eight", "NH3"], "explain": "Count the gap in the outer shell and you have the formula.", "src": "L|an atom of nitrogen has an atomic number of 7, so it has two electrons in the first electron shell and has five electrons in its outermost electron shell"}, {"id": "ch02-o044", "type": "short", "topic": "2.3", "source": "opus", "q": "H2, O2, N2 and Cl2 are all covalent molecules, yet none of them is a compound. Explain why.", "answer": "Each of them contains atoms of only one element joined together, so it is an element, not a compound. A compound has to contain atoms of more than one element, like HCl, H2O, NH3, CH4 and CO2.", "keywords": ["one element", "more than one", "compound"], "explain": "Covalent bonding does not require two different elements - atoms of the same non-metal share too.", "src": "L|Covalent molecules are formed when atoms of different non-metals join together to form compounds and when atoms of the same non-metal join together."}, {"id": "ch02-o045", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why sodium chloride forms a giant lattice rather than separate NaCl molecules.", "answer": "The Na+ and Cl- ions have equal and opposite charges, so the electrostatic forces between them are strong and act in all directions. Every ion therefore attracts ions all around it, and the structure repeats outwards as a giant lattice.", "keywords": ["all directions", "electrostatic", "lattice"], "explain": "Because the pull works in every direction, the structure cannot stop at two ions.", "src": "L|These forces, called electrostatic forces, act in all directions and form ionic bonds."}, {"id": "ch02-o046", "type": "fill", "topic": "2.4", "source": "opus", "q": "In the sodium chloride lattice, each sodium ion is surrounded by ____ chloride ions.", "answer": ["six", "6"], "explain": "Six nearest neighbours, one in each direction.", "src": "L|In the lattice structure a sodium ion, Na+ is surrounded by six Cl- ions."}, {"id": "ch02-o047", "type": "short", "topic": "2.4", "source": "opus", "q": "Why do salt crystals have a regular shape?", "answer": "Because the ions inside them are arranged in a regular repeating pattern, so the crystal that grows takes on a regular shape too.", "keywords": ["regular", "pattern", "ions"], "explain": "The shape you can see is the arrangement of the ions you cannot see.", "src": "L|Sodium chloride forms crystals with a regular shape because the ions are arranged in a regular pattern."}, {"id": "ch02-o048", "type": "short", "topic": "2.4", "source": "opus", "q": "In a substance made of simple molecules, which forces are strong and which are weak?", "answer": "The covalent bonds holding the atoms together inside each molecule are very strong, but the intermolecular forces between one molecule and the next are weak.", "keywords": ["inside", "strong", "between", "weak", "intermolecular"], "explain": "Strong inside, weak between - that single contrast explains all their properties.", "src": "L|the forces holding the molecules together are very strong but the forces between the molecules are weak"}, {"id": "ch02-o049", "type": "short", "topic": "2.4", "source": "opus", "q": "Carbon dioxide boils at -78 degrees Celsius even though the bonds inside each CO2 molecule are very strong. Explain why boiling it is so easy.", "answer": "Boiling only has to separate the molecules from each other, not break the bonds inside them. The intermolecular forces between the molecules are weak, so only a small amount of energy is needed.", "keywords": ["intermolecular", "weak", "small amount of energy"], "explain": "Melting and boiling never break the covalent bonds inside a simple molecule.", "src": "L|This means that only a small amount of energy is needed to overcome these forces in order to melt or boil them."}, {"id": "ch02-o050", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why diamond is the hardest material on Earth, and give two uses that depend on this.", "answer": "Every carbon atom forms four strong covalent bonds, giving a rigid three-dimensional lattice with no weak direction anywhere in it. Diamond is used for jewellery and for cutting and drilling tools.", "keywords": ["four", "covalent", "rigid", "cutting"], "explain": "Four bonds per atom locks the whole structure solid.", "src": "L|The carbon atoms in diamond form a giant structure. Each carbon atom forms four strong covalent bonds."}, {"id": "ch02-o051", "type": "fill", "topic": "2.4", "source": "opus", "q": "Giant covalent structures such as diamond, graphite and silicon dioxide are also called ____.", "answer": ["macromolecules"], "explain": "A macromolecule is a giant molecule.", "src": "L|These large structures are called macromolecules."}, {"id": "ch02-o052", "type": "short", "topic": "2.4", "source": "opus", "q": "Diamond and graphite are both made only of carbon atoms, yet diamond is the hardest material on Earth and graphite is soft and slippery. Explain the difference.", "answer": "In diamond each carbon atom makes four covalent bonds in a rigid three-dimensional structure. In graphite each carbon atom makes bonds with only three other atoms, which builds flat layers. The bonds inside a layer are strong but the bonds between the layers are weak, so the layers slide over each other very easily.", "keywords": ["four", "three", "layers", "slide", "weak"], "explain": "Same atoms, different structure - and structure is what decides the properties.", "src": "L|In graphite, the carbon atoms each make bonds with three other atoms. This forms layers, which can easily slide over one another."}, {"id": "ch02-o053", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain, in terms of structure, what is happening when you write with a pencil.", "answer": "The pencil lead is graphite. The bonds between its layers are weak, so layers of carbon atoms slide off the surface very easily and come away onto the paper as the mark.", "keywords": ["graphite", "layers", "weak", "slide"], "explain": "The mark on the paper is layers of graphite that have slid off.", "src": "L|The bonds between the layers are weak so the layers slide over each other very easily."}, {"id": "ch02-o054", "type": "short", "topic": "2.4", "source": "opus", "q": "Why do ionic substances have very high melting and boiling points?", "answer": "Because there are very strong electrostatic forces holding the ions together throughout the giant lattice, and a great deal of energy is needed to overcome them.", "keywords": ["strong", "electrostatic", "energy"], "explain": "Melting an ionic solid means pulling apart an entire lattice of strong attractions.", "src": "L|Ionic substances have very high melting points and boiling points. This is because there are very strong electrostatic forces holding the ions together."}, {"id": "ch02-o055", "type": "short", "topic": "2.4", "source": "opus", "q": "Under what two conditions will an ionic compound conduct electricity, and why does it not conduct as a solid crystal?", "answer": "It conducts when it is dissolved in water or melted to form a liquid. Conduction needs charged particles that are free to move; in the solid crystal the ions are locked in the lattice and cannot move, so no charge is carried.", "keywords": ["dissolved", "melted", "free to move"], "explain": "Charge plus mobility - an ionic solid has the charge but not the mobility.", "src": "L|Ionic compounds will conduct electricity if they are dissolved in water or if they are melted to form a liquid."}, {"id": "ch02-o056", "type": "short", "topic": "2.4", "source": "opus", "q": "Explain why a covalent substance made of simple molecules cannot conduct electricity at all.", "answer": "Its molecules carry no electrical charge, so there are no charged particles available to move through the circuit and carry the current.", "keywords": ["no charge", "charged particles"], "explain": "No charged particles means no possible current, whatever state it is in.", "src": "L|Covalent substances made from simple molecules do not conduct electricity."}, {"id": "ch02-o057", "type": "short", "topic": "2.4", "source": "opus", "q": "Silicon dioxide is formed from two non-metals, is hard, and melts at 1610 degrees Celsius. Explain how these facts show it must be a giant covalent structure.", "answer": "Because it is made from two non-metals its bonds must be covalent, not ionic. But simple covalent molecules are soft and melt at low temperatures, and silicon dioxide is hard with a very high melting point. The only arrangement that fits both facts is a giant covalent structure.", "keywords": ["two non-metals", "covalent", "high melting point", "giant"], "explain": "Rule out ionic from the elements, rule out simple molecules from the properties.", "src": "L|However, some covalent substances such as silicon dioxide have giant covalent structures."}, {"id": "ch02-o058", "type": "short", "topic": "2.4", "source": "opus", "q": "A substance melts at 801 degrees Celsius and conducts electricity when dissolved in water. What kind of bonding does it have, and how do you know?", "answer": "Ionic bonding. The very high melting point shows there are strong forces throughout a giant structure, and conducting when dissolved shows the substance is made of charged ions that become free to move once the lattice breaks up.", "keywords": ["ionic", "high melting point", "ions", "free to move"], "explain": "Two independent clues, both pointing at ions.", "src": "L|Ionic compounds can conduct electricity because the ions have an electrical charge."}, {"id": "qwen-01-01", "type": "mcq", "topic": "2.1", "source": "qwen", "q": "What does the atomic number of an element tell you?", "explain": "The text states that each element has an atomic number which tells you how many protons it contains.", "src": "L|Each element has an atomic number. This tells you how many protons it contains.", "options": ["The total number of protons and neutrons", "The number of protons in the atom", "The number of electrons in the outer shell", "The mass of a single atom"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "2.1", "source": "qwen", "q": "The mass number of an atom is the total count of protons and ____.", "explain": "The document defines the mass number as telling you how many protons and neutrons each atom has in total.", "src": "L|This tells you how many protons and neutrons each atom in the element has in total.", "answer": ["neutrons"]}, {"id": "qwen-01-03", "type": "mcq", "topic": "2.1", "source": "qwen", "q": "Why does an atom have no overall charge?", "explain": "An atom is neutral because it has an equal number of positive protons and negative electrons.", "src": "L|An atom has no overall charge, because the number of protons is the same as the number of electrons.", "options": ["Protons and neutrons cancel each other out", "The number of protons equals the number of electrons", "Electrons are neutral particles", "Neutrons have a positive charge"], "answer": 1}, {"id": "qwen-01-04", "type": "fill", "topic": "2.1", "source": "qwen", "q": "The first electron shell can hold a maximum of ____ electrons.", "explain": "The text explicitly states that the first electron shell only has room for two electrons.", "src": "L|The first electron shell only has room for two electrons.", "answer": ["two"]}, {"id": "qwen-01-05", "type": "mcq", "topic": "2.1", "source": "qwen", "q": "Which scientist developed the model of electron shells in 1913?", "explain": "The text mentions that Niels Bohr developed Rutherford's model further in 1913 with the idea of electron shells.", "src": "L|In 1913, the Danish scientist Niels Bohr developed Rutherford’s model of the atom further.", "options": ["J.J. Thomson", "Ernest Rutherford", "Niels Bohr", "Isaac Newton"], "answer": 2}, {"id": "qwen-01-06", "type": "fill", "topic": "2.1", "source": "qwen", "q": "The electronic structure of a boron atom is written as 2,3, meaning it has two electrons in the first shell and ____ in the second.", "explain": "The text explains that 2,3 means two electrons in the first shell and three in the next.", "src": "L|This means that there are two electrons in the first electron shell and three in the next electron shell.", "answer": ["three"]}, {"id": "qwen-01-07", "type": "mcq", "topic": "2.2", "source": "qwen", "q": "What is the trend in melting points as you go down Group 1 (alkali metals)?", "explain": "The text states that melting points go down as you go down the group.", "src": "L|When you look at the melting points you can see that they go down as you go down the group.", "options": ["They increase", "They stay the same", "They decrease", "They become zero"], "answer": 2}, {"id": "qwen-01-08", "type": "fill", "topic": "2.2", "source": "qwen", "q": "The elements in Group 1 are also known as the ____ metals.", "explain": "The text identifies Group 1 as the alkali metals.", "src": "L|The first group, also known as the alkali metals, includes the elements lithium, sodium and potassium.", "answer": ["alkali"]}, {"id": "qwen-01-09", "type": "mcq", "topic": "2.2", "source": "qwen", "q": "What is the electronic structure of a sodium atom?", "explain": "The text describes sodium's structure as having two electrons in the first shell, eight in the second, and one in the third.", "src": "L|The electronic structure is 2,8,1.", "options": ["2,1", "2,8,1", "2,8,8,1", "2,7"], "answer": 1}, {"id": "qwen-01-10", "type": "fill", "topic": "2.2", "source": "qwen", "q": "Fluorine and chlorine are gases at room temperature, while bromine is a ____.", "explain": "The text states that the first two halogens are gases and bromine is a liquid.", "src": "L|The first two elements (fluorine and chlorine) are gases at room temperature. Bromine is a liquid.", "answer": ["liquid"]}, {"id": "qwen-01-11", "type": "mcq", "topic": "2.2", "source": "qwen", "q": "Which halogen is the most reactive?", "explain": "The text lists the reactivity order as fluorine, then chlorine, with bromine being the least reactive of the three.", "src": "L|The most reactive is fluorine, then chlorine.", "options": ["Bromine", "Chlorine", "Fluorine", "Iodine"], "answer": 2}, {"id": "qwen-01-12", "type": "fill", "topic": "2.2", "source": "qwen", "q": "Group 8 elements are called noble gases because they are ____ and do not form compounds.", "explain": "The text defines noble gases as being inert (unreactive) and not forming compounds.", "src": "L|They are inert (unreactive) and do not form compounds.", "answer": ["inert"]}, {"id": "qwen-02-03", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "Why is the chlorine ion written as Cl−?", "explain": "The text states that the chlorine ion has one more negatively charged electron than protons, giving it a negative charge.", "src": "L|there is now one more electron than the positively charged protons", "options": ["It has one more proton than electrons", "It has one more electron than protons", "It has lost a neutron", "It has gained a proton"], "answer": 1}, {"id": "qwen-02-04", "type": "fill", "topic": "2.3", "source": "qwen", "q": "The bond formed between a sodium ion and a chlorine ion is called an ____ bond.", "explain": "The text describes the attraction between positive and negative ions as an ionic bond.", "src": "L|form an ionic chemical bond", "answer": ["ionic"]}, {"id": "qwen-02-05", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "Which element is more reactive: potassium or lithium?", "explain": "The text explicitly states that potassium is the most reactive and lithium is the least reactive in Group 1.", "src": "L|Potassium is the most reactive and lithium the least reactive", "options": ["Lithium", "Potassium", "They are equally reactive", "Neither reacts"], "answer": 1}, {"id": "qwen-02-06", "type": "fill", "topic": "2.1", "source": "qwen", "q": "Electrons are held in their shells by ____ forces.", "explain": "The text mentions that electrons are held in place by electrostatic forces between protons and electrons.", "src": "L|Electrons are held in place by electrostatic forces", "answer": ["electrostatic"]}, {"id": "qwen-02-07", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "How many electrons does a magnesium atom lose to form an ion?", "explain": "The text states that a magnesium atom loses two electrons to form a magnesium ion.", "src": "L|The magnesium atom loses the two electrons", "options": ["One", "Two", "Three", "Four"], "answer": 1}, {"id": "qwen-02-08", "type": "fill", "topic": "2.3", "source": "qwen", "q": "When non-metals form compounds, they do so by ____ electrons.", "explain": "The text explains that non-metals form compounds by sharing electrons to fill their outer shells.", "src": "L|they do so by sharing electrons", "answer": ["sharing"]}, {"id": "qwen-02-09", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "What is the formula for a molecule of ammonia?", "explain": "The text identifies the formula for ammonia as NH3.", "src": "L|its formula is NH3", "options": ["NH2", "NH3", "N2H4", "HN"], "answer": 1}, {"id": "qwen-02-10", "type": "fill", "topic": "2.3", "source": "qwen", "q": "A diagram that uses dots and crosses to show electron sharing is called a dot and ____ diagram.", "explain": "The text defines this type of diagram as a dot and cross diagram.", "src": "L|known as a dot and cross diagram", "answer": ["cross"]}, {"id": "qwen-02-11", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "Why do noble gases not react to form compounds?", "explain": "The text states that noble gases have their outermost energy level of electrons full, so they do not react.", "src": "L|have their outermost energy level of electrons full", "options": ["They have no electrons", "Their outermost electron shell is full", "They are too heavy", "They have no protons"], "answer": 1}, {"id": "qwen-02-12", "type": "fill", "topic": "2.3", "source": "qwen", "q": "A group of atoms joined together by covalent bonds is called a ____.", "explain": "The text states that when atoms share electrons, a molecule is formed.", "src": "L|a molecule of hydrogen chloride is formed", "answer": ["molecule"]}, {"id": "qwen-03-01", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "What is the name of the giant structure formed by ions in sodium chloride?", "explain": "The text states that the ions in sodium chloride make a giant structure known as a lattice.", "src": "L|The ions in sodium chloride make a giant structure known as a lattice.", "options": ["lattice", "molecule", "layer", "chain"], "answer": 0}, {"id": "qwen-03-02", "type": "fill", "topic": "2.4", "source": "qwen", "q": "The forces between the ions in an ionic compound are called ____ forces.", "explain": "The text explains that the strong attractions between ions are called electrostatic forces.", "src": "L|These forces, called electrostatic forces, act in all directions and form ionic bonds.", "answer": ["electrostatic"]}, {"id": "qwen-03-03", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "How many chloride ions surround each sodium ion in the lattice structure of sodium chloride?", "explain": "The text specifies that in the lattice structure, a sodium ion is surrounded by six chloride ions.", "src": "L|In the lattice structure a sodium ion, Na+ is surrounded by six Cl− ions.", "options": ["four", "six", "eight", "two"], "answer": 1}, {"id": "qwen-03-04", "type": "fill", "topic": "2.4", "source": "qwen", "q": "The weak forces that hold simple covalent molecules together are called ____ forces.", "explain": "The text defines the forces between molecules as intermolecular forces.", "src": "L|The forces between the molecules are called intermolecular forces.", "answer": ["intermolecular"]}, {"id": "qwen-03-05", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "Why is diamond the hardest material on Earth?", "explain": "The text states diamond is hard because of its strong, rigid, three-dimensional lattice structure.", "src": "L|It is so hard because of the strong, rigid, three-dimensional structure of the lattice.", "options": ["It has weak bonds between layers.", "It has a strong, rigid, three-dimensional structure.", "Its atoms can slide over one another easily.", "It is made of simple molecules."], "answer": 1}, {"id": "qwen-03-06", "type": "fill", "topic": "2.4", "source": "qwen", "q": "In graphite, each carbon atom forms covalent bonds with ____ other atoms.", "explain": "The text states that in graphite, carbon atoms each make bonds with three other atoms.", "src": "L|In graphite, the carbon atoms each make bonds with three other atoms.", "answer": ["three"]}, {"id": "qwen-03-07", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "Why can graphite be used for the 'lead' in pencils?", "explain": "The text explains that weak bonds between layers allow them to slide, making the surface soft and leaving marks.", "src": "L|This makes the surface very soft and it easily comes away. This is what happens when you make a pencil mark on paper.", "options": ["The layers are hard and do not move.", "The layers slide over each other easily, leaving marks on paper.", "It conducts electricity very well.", "It has a very high melting point."], "answer": 1}, {"id": "qwen-03-08", "type": "fill", "topic": "2.4", "source": "qwen", "q": "Large covalent structures like diamond and graphite are called ____.", "explain": "The text states that these large structures are called macromolecules.", "src": "L|These large structures are called macromolecules.", "answer": ["macromolecules"]}, {"id": "qwen-03-09", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "Why do ionic substances have very high melting points?", "explain": "The text states ionic substances have high melting points because of strong electrostatic forces.", "src": "L|This is because there are very strong electrostatic forces holding the ions together.", "options": ["The intermolecular forces are weak.", "There are strong electrostatic forces holding the ions together.", "The molecules are very small.", "The atoms share electrons loosely."], "answer": 1}, {"id": "qwen-03-10", "type": "fill", "topic": "2.4", "source": "qwen", "q": "Covalent substances made from simple molecules have low melting points because the ____ forces are weak.", "explain": "The text explains that low melting points are due to weak forces between molecules, which are intermolecular forces.", "src": "L|the forces between the molecules, intermolecular forces are weak.", "answer": ["intermolecular"]}, {"id": "qwen-03-11", "type": "mcq", "topic": "2.4", "source": "qwen", "q": "Under which conditions can ionic compounds conduct electricity?", "explain": "The text states ionic compounds conduct electricity if dissolved in water or melted to form a liquid.", "src": "L|Ionic compounds will conduct electricity if they are dissolved in water or if they are melted to form a liquid.", "options": ["Only when they are solid crystals.", "When they are dissolved in water or melted.", "Always, regardless of state.", "Only when they are heated to very high temperatures."], "answer": 1}, {"id": "qwen-03-12", "type": "fill", "topic": "2.4", "source": "qwen", "q": "Ionic compounds can conduct electricity because the ions are free to ____ and carry charge.", "explain": "The text explains that ions must be free to move about to carry the electrical charge.", "src": "L|The ions must be free to move about and carry the electrical charge.", "answer": ["move about"]}, {"id": "qwen-04-01", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "What happens when a metal joins with a non-metal to form a compound?", "explain": "The text states that when a metal joins with a non-metal, atoms gain or lose electrons.", "src": "L|When a metal joins with a non-metal to form a compound", "options": ["Atoms gain or lose electrons", "Two atoms share electrons", "A compound dissolves in water", "Two non-metals join together"], "answer": 0}, {"id": "qwen-04-02", "type": "fill", "topic": "2.3", "source": "qwen", "q": "A covalent bond forms when two atoms ____ electrons.", "explain": "The document defines this process as two atoms sharing electrons.", "src": "L|When two atoms share electrons", "answer": ["share"]}, {"id": "qwen-04-05", "type": "mcq", "topic": "2.3", "source": "qwen", "q": "What happens to atoms when they form an ionic bond?", "explain": "The text states that atoms gain or lose electrons in this process.", "src": "L|When atoms gain or lose electrons", "options": ["They share electrons", "They gain or lose electrons", "They dissolve in water", "They join with non-metals only"], "answer": 1}, {"id": "qwen-04-06", "type": "fill", "topic": "2.3", "source": "qwen", "q": "The chemical formula for a molecule of methane is ____.", "explain": "The diagram shows one carbon atom bonded to four hydrogen atoms.", "src": "L|Write the formula for a molecule of methane", "answer": ["CH4"]}, {"id": "qwen-04-08", "type": "fill", "topic": "2.3", "source": "qwen", "q": "The positive ion in sodium chloride is called the ____ ion.", "explain": "The text labels the positive ion as a sodium ion.", "src": "L|sodium ion Na+", "answer": ["sodium"]}, {"id": "qwen-04-10", "type": "fill", "topic": "2.4", "source": "qwen", "q": "The lattice structure of sodium chloride suggests it has high ____ and boiling points.", "explain": "Ionic lattices typically have high melting and boiling points due to strong forces.", "src": "L|What does this lattice structure tell you about the melting and boiling points", "answer": ["melting"]}, {"id": "qwen-04-12", "type": "fill", "topic": "2.4", "source": "qwen", "q": "Sodium chloride is made up of sodium ions and ____ ions.", "explain": "The text identifies the two types of ions in the lattice.", "src": "L|chloride ion Cl−", "answer": ["chloride"]}, {"id": "qwenw-01-02", "type": "fill", "topic": "2.1", "source": "qwen", "q": "The mass number of an atom is the sum of its protons and ____.", "explain": "The text explains that 'The mass number tells you how many protons plus neutrons there are.'", "src": "W|The mass number tells you how many protons plus neutrons there are.", "answer": ["neutrons"]}, {"id": "qwenw-01-03", "type": "mcq", "topic": "2.1", "source": "qwen", "q": "In a neutral atom, the number of electrons is always equal to the number of ____.", "explain": "The text notes that the number of electrons is 'always the same as the number of protons'.", "src": "W|Number of electrons = 3 (always the same as the number of protons)", "options": ["neutrons", "protons", "shells", <script>
(function(){
var DATA = JSON.parse(document.getElementById('data').textContent);
var FIGS = DATA.figures || {};
var KEY = 'y9sci-' + DATA.chapter;

/* One question can hold several pins; a card is what the learner actually answers,
   so label questions are expanded into one card per pin before anything else runs. */
var CARDS = [];
DATA.questions.forEach(function(q){
  var pins = q.labels || q.pins;
  if(q.type === 'label' && pins){
    // the same words can label two ends of one arrow, or three arrows of one process;
    // every occurrence stays masked, but only the first becomes a card
    var seenText = {};
    pins.filter(function(p){
      var k = p.text.toLowerCase();
      if(seenText[k]) return false;
      seenText[k] = 1; return true;
    }).forEach(function(p, i){
      CARDS.push({id:q.id+'-'+p.n, type:'label', topic:q.topic, source:q.source,
                  q:q.q.replace('{n}', p.n), image:q.image, pin:p, explain:q.explain, src:q.src});
    });
  } else { CARDS.push(q); }
});

var state = load();
var view = [], idx = 0, shown = false, picked = null, mark = null;
var mode = 'flash';                       // flash | quiz
var filter = {type:'all', topic:'all'};

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

var TYPES = ['all','mcq','fill','short','label','hotspot'];
var TOPICS = ['all'].concat(Object.keys(CARDS.reduce(function(a,c){ a[c.topic]=1; return a; },{})).sort());

function buildFilters(){
  var f = document.getElementById('filters');
  f.innerHTML = '';
  TYPES.forEach(function(t){
    var n = t==='all' ? CARDS.length : CARDS.filter(function(c){return c.type===t;}).length;
    if(!n) return;
    var b = el('span','chip'+(filter.type===t?' on':''), (t==='all'?'All':cap(t))+' '+n);
    b.onclick = function(){ filter.type = t; refresh(); };
    f.appendChild(b);
  });
  var sep = el('span','', '|'); sep.style.color='#c3cad2'; f.appendChild(sep);
  TOPICS.forEach(function(t){
    var b = el('span','chip'+(filter.topic===t?' on':''), t==='all'?'All topics':t);
    b.onclick = function(){ filter.topic = t; refresh(); };
    f.appendChild(b);
  });
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

function refresh(){
  view = CARDS.filter(function(c){
    return (filter.type==='all'||c.type===filter.type) && (filter.topic==='all'||c.topic===filter.topic);
  });
  idx = 0; buildFilters(); render();
}

function norm(s){
  return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
}

function figure(card, opts){
  var f = FIGS[card.image];
  if(!f) return el('div','hint','[figure missing: '+card.image+']');
  var wrap = el('div','fig'+(opts.click?' click':''));
  var img = document.createElement('img'); img.src = f.image; img.alt = '';
  wrap.appendChild(img);
  // every printed label is covered, otherwise the answer is sitting on the diagram
  (f.pins||[]).forEach(function(p){
    var m = el('div','mask');
    m.style.cssText = 'left:'+p.x+'%;top:'+p.y+'%;width:'+p.w+'%;height:'+p.h+'%';
    wrap.appendChild(m);
    if(opts.numberAll || (opts.pin && p.n===opts.pin.n)){
      var d = el('div','pin'+(opts.pin && p.n===opts.pin.n ? '' : ' sm'), String(p.n));
      d.style.cssText += 'left:'+(p.x+p.w/2)+'%;top:'+(p.y+p.h/2)+'%';
      wrap.appendChild(d);
    }
  });
  return wrap;
}

function render(){
  var stage = document.getElementById('stage');
  stage.innerHTML = '';
  document.getElementById('mode').textContent = 'Mode: ' + (mode==='flash'?'Flashcards':'Quiz');
  var done = Object.keys(state).length;
  document.getElementById('pbar').style.width = Math.min(100, 100*done/CARDS.length)+'%';
  var right = 0, wrong = 0;
  Object.keys(state).forEach(function(k){ state[k]==='g' ? right++ : wrong++; });
  document.getElementById('score').textContent = right+' known / '+wrong+' to review';

  if(!view.length){ stage.appendChild(el('div','done','Nothing matches this filter.')); return; }
  if(idx >= view.length){
    var d = el('div','done');
    d.appendChild(el('div','big', right+'/'+CARDS.length));
    d.appendChild(el('h2','','Set finished'));
    d.appendChild(el('p','','Use the filters above to review a type again, or press Reset to start over.'));
    stage.appendChild(d); return;
  }
  document.getElementById('pos').textContent = 'Card '+(idx+1)+' of '+view.length;

  var c = view[idx], card = el('div','card');
  var h = el('p','q');
  h.appendChild(el('span','tag', c.type==='mcq'?'Multiple choice':c.type==='fill'?'Fill the gap':cap(c.type)));
  h.appendChild(document.createTextNode(c.q));
  card.appendChild(h);

  if(c.type==='label'){
    card.appendChild(figure(c, {pin:c.pin, numberAll:true}));
  } else if(c.type==='hotspot'){
    card.appendChild(el('div','hint','Click the correct place on the diagram.'));
    var w = figure(c, {click:true});
    w.onclick = function(ev){
      if(shown) return;
      var r = w.getBoundingClientRect();
      var x = 100*(ev.clientX-r.left)/r.width, y = 100*(ev.clientY-r.top)/r.height;
      var t = c.target;
      picked = {x:x, y:y, ok: Math.hypot(x-t.x, y-t.y) <= t.r};
      shown = true; mark = picked.ok ? 'g' : 'a'; commit(c); render();
    };
    card.appendChild(w);
  }

  if(c.type==='mcq'){
    c.options.forEach(function(o,i){
      var b = el('button','opt');
      b.appendChild(el('b','', 'ABCD'[i]));
      b.appendChild(document.createTextNode(o));
      if(shown){
        if(i===c.answer) b.className='opt right';
        else if(i===picked) b.className='opt wrong';
      } else if(i===picked) b.className='opt pick';
      b.onclick = function(){ if(shown) return; picked=i; shown=true; mark = (i===c.answer)?'g':'a'; commit(c); render(); };
      card.appendChild(b);
    });
  }
  if(c.type==='fill' && !shown){
    var inp = document.createElement('input'); inp.type='text'; inp.placeholder='Type your answer, then press Enter';
    inp.onkeydown = function(e){
      if(e.key!=='Enter') return;
      picked = inp.value; shown = true;
      mark = (c.answer||[]).some(function(a){ return norm(a)===norm(inp.value); }) ? 'g' : 'a';
      commit(c); render();
    };
    card.appendChild(inp);
    setTimeout(function(){ inp.focus(); }, 0);
  }

  if(shown){
    var a = el('div','ans'+(mark==='a'?' miss':''));
    a.appendChild(el('div','lab','Answer'));
    var txt = c.type==='mcq' ? c.options[c.answer]
            : c.type==='fill' ? (c.answer||[]).join(' / ')
            : c.type==='label' ? c.pin.text
            : c.type==='hotspot' ? 'See the marked position on the diagram.'
            : c.answer;
    var b = el('div'); b.appendChild(el('b','', txt)); a.appendChild(b);
    if(c.type==='fill' && picked) a.appendChild(el('div','kw','You typed: '+picked));
    if(c.keywords) a.appendChild(el('div','kw','Must mention: '+c.keywords.join(', ')));
    if(c.explain) a.appendChild(el('div','','' + c.explain));
    if(c.src) a.appendChild(el('div','src','Source: '+c.src.replace(/^[LW]\|/,'')));
    card.appendChild(a);
    if(c.type==='hotspot' && picked){
      var w2 = card.querySelector('.fig');
      var d1 = el('div','dot'); d1.style.cssText='left:'+picked.x+'%;top:'+picked.y+'%';
      var d2 = el('div','dot ok'); d2.style.cssText='left:'+c.target.x+'%;top:'+c.target.y+'%';
      w2.appendChild(d1); w2.appendChild(d2);
    }
  }

  var acts = el('div','acts');
  if(!shown){
    // in Quiz mode an answerable card must actually be attempted; only open-ended
    // types (short, label) keep the reveal button, because nothing can mark them
    var mustTry = mode==='quiz' && (c.type==='mcq'||c.type==='fill'||c.type==='hotspot');
    if(!mustTry){
      var s = el('button','b p','Show answer'); s.onclick = function(){ shown=true; render(); }; acts.appendChild(s);
    } else {
      acts.appendChild(el('div','hint','Answer the card to continue.'));
    }
  } else {
    var g = el('button','b g','Got it'); g.onclick = function(){ mark='g'; commit(c); next(); };
    var r2 = el('button','b r','Review again'); r2.onclick = function(){ mark='a'; commit(c); next(); };
    var n = el('button','b p','Next →'); n.onclick = next;
    acts.appendChild(g); acts.appendChild(r2); acts.appendChild(n);
  }
  card.appendChild(acts);
  stage.appendChild(card);
}

function commit(c){ if(mark){ state[c.id] = mark; save(); } }
function next(){ shown=false; picked=null; mark=null; idx++; render(); }

document.getElementById('mode').onclick = function(){ mode = mode==='flash'?'quiz':'flash'; shown=false; picked=null; render(); };
document.getElementById('shuf').onclick = function(){
  for(var i=view.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=view[i]; view[i]=view[j]; view[j]=t; }
  idx=0; shown=false; picked=null; render();
};
document.getElementById('rst').onclick = function(){ state={}; save(); idx=0; shown=false; picked=null; render(); };
document.addEventListener('keydown', function(e){
  if(e.target.tagName==='INPUT') return;
  var c = view[idx]; if(!c) return;
  if(e.key===' '){ e.preventDefault(); if(!shown){ shown=true; render(); } else next(); }
  else if(e.key==='ArrowRight'){ next(); }
  else if(e.key==='g' && shown){ mark='g'; commit(c); next(); }
  else if(e.key==='a' && shown){ mark='a'; commit(c); next(); }
  else if(!shown && c.type==='mcq' && '1234'.indexOf(e.key)>=0){
    var i = +e.key-1; if(i < c.options.length){ picked=i; shown=true; mark=(i===c.answer)?'g':'a'; commit(c); render(); }
  }
});
refresh();
})();
</script>
</body>
</html>
