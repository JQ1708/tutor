<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter 1 — Respiration — Flashcards</title>
<style>
:root{--ink:#1a1c1f;--mut:#5d6570;--line:#dfe3e8;--bg:#f2f4f6;--card:#fff;--acc:#1c6b4b;--accbg:#e9f4ee;--bad:#b3261e;--badbg:#fdecea;--good:#1c6b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;position:sticky;top:0;z-index:10}
.hrow{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:17px;margin:0;flex:1 1 200px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:10px;max-width:900px;margin-left:auto;margin-right:auto}
.bar>div{height:100%;background:var(--acc);border-radius:2px;width:0;transition:width .2s}
main{max-width:900px;margin:0 auto;padding:22px 20px 120px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.q{font-size:19px;font-weight:600;line-height:1.45;margin:0 0 14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--accbg);color:#12503a;border-radius:5px;padding:2px 8px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:7px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt.pick{border-color:var(--acc);background:var(--accbg)}
.opt.right{border-color:var(--good);background:var(--accbg);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt b{color:var(--mut);margin-right:8px}
input[type=text]{width:100%;font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:10px}
.ans{margin-top:14px;padding:14px;border-radius:10px;background:var(--accbg);border:1px solid #c6e0d2}
.ans .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ans b{color:#12503a}
.ans.miss{background:var(--badbg);border-color:#f0c4bf}
.src{font-size:12.5px;color:var(--mut);margin-top:8px;font-style:italic}
.kw{font-size:13px;color:var(--mut);margin-top:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer}
button.b.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.b.g{border-color:var(--good);color:var(--good)}
button.b.r{border-color:var(--bad);color:var(--bad)}
.fig{position:relative;display:inline-block;max-width:100%;margin:4px 0 12px;line-height:0}
.fig img{max-width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.mask{position:absolute;background:#fff;border:1px solid #cfd6dd;border-radius:3px}
.pin{position:absolute;display:flex;align-items:center;justify-content:center;background:#b3261e;color:#fff;border-radius:999px;width:26px;height:26px;font:700 13px/1 sans-serif;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin.sm{width:20px;height:20px;font-size:11px;background:#5d6570}
.dot{position:absolute;width:22px;height:22px;border-radius:999px;transform:translate(-50%,-50%);border:3px solid #b3261e}
.dot.ok{border-color:var(--good)}
.fig.click{cursor:crosshair}
.hint{font-size:13px;color:var(--mut);margin:2px 0 10px}
.done{text-align:center;padding:60px 20px}
.done h2{margin:.2em 0}
.big{font-size:44px;font-weight:700;color:var(--acc)}
kbd{background:#eef1f4;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:12px/1.6 ui-monospace,monospace}
.foot{max-width:900px;margin:14px auto 0;font-size:12px;color:var(--mut);text-align:center}
@media print{header,.acts,.foot{display:none}}
.jump{background:#e7f1ea;border:1px solid #bcd8c8;color:#14603c;border-radius:9px;padding:8px 12px;font-size:13px;margin:0 0 12px}
</style>
</head>

</main>

": "How oxygen is transported around the body.", "target": {"x": 47.0, "y": 13.0, "r": 5.0}, "explain": "The alveolus in lungs is labelled on this diagram in the textbook.", "src": "L|alveolus in lungs"}, {"id": "y8c01-f09a", "type": "label", "topic": "1.5", "source": "opus", "image": "img/L_p28_phagocytosis.png", "figure": "L_p28_phagocytosis", "q": "Name the part labelled {n} in the diagram.", "caption": "A white blood cell capturing a bacterium by phagocytosis.", "labels": [{"n": 1, "text": "bacterium", "alt": [], "x": 1.9, "y": 4.3, "w": 21.7, "h": 5.9}], "src": "L|bacterium"}, {"id": "y8c01-f09h1", "type": "hotspot", "topic": "1.5", "source": "opus", "image": "img/L_p28_phagocytosis.png", "figure": "L_p28_phagocytosis", "q": "Click on the bacterium in the diagram.", "caption": "A white blood cell capturing a bacterium by phagocytosis.", "target": {"x": 21.8, "y": 21.4, "r": 2.5}, "explain": "The bacterium is labelled on this diagram in the textbook.", "src": "L|bacterium"}, {"id": "y8c01-m001", "type": "mcq", "topic": "1.1", "source": "opus", "q": "Where in the body does respiration take place?", "options": ["Inside every living cell", "Only inside the lungs", "Only inside the blood", "Only inside the heart"], "answer": 0, "explain": "Respiration is a chemical process carried out by every living cell, not an event that happens only in the lungs.", "src": "L|Respiration is a series of chemical reactions that happens inside every living cell."}, {"id": "y8c01-m002", "type": "mcq", "topic": "1.1", "source": "opus", "q": "Which gas does aerobic respiration use?", "options": ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"], "answer": 0, "explain": "The word 'aerobic' tells you the reaction uses oxygen.", "src": "L|Aerobic respiration uses oxygen."}, {"id": "y8c01-m011", "type": "mcq", "topic": "1.2", "source": "opus", "q": "What is another name for the air sacs in the lungs?", "options": ["Alveoli", "Capillaries", "Bronchioles", "Villi"], "answer": 0, "explain": "Air sac and alveolus mean the same thing; the plural of alveolus is alveoli.", "src": "L|Another name for them is alveoli."}, {"id": "y8c01-m021", "type": "mcq", "topic": "1.3", "source": "opus", "q": "What happens to the pressure of a gas when the volume of its container decreases?", "options": ["The pressure increases", "The pressure decreases", "The pressure stays the same", "The gas turns into a liquid"], "answer": 0, "explain": "Squeeze a gas into a smaller space and its pressure goes up. This is what drives air out of the lungs.", "src": "L|The pressure of a gas increases when the volume of its container is decreased."}, {"id": "y8c01-m028", "type": "mcq", "topic": "1.4", "source": "opus", "q": "What do our digestive systems break carbohydrates down into?", "options": ["A kind of sugar called glucose", "A gas called oxygen", "A pigment called haemoglobin", "A liquid called plasma"], "answer": 0, "explain": "Glucose is the sugar that the blood delivers to every cell for respiration.", "src": "L|When we eat food containing carbohydrates, our digestive system breaks the carbohydrates down to a kind of sugar called glucose."}, {"id": "y8c01-m037", "type": "mcq", "topic": "1.5", "source": "opus", "q": "What is the liquid part of the blood called?", "options": ["Blood plasma", "Haemoglobin", "Oxyhaemoglobin", "Cytoplasm"], "answer": 0, "explain": "Plasma is the pale yellow liquid that the blood cells float in.", "src": "L|This liquid is called blood plasma.You can see that it is not red at all."}, {"id": "y8c01-m052", "type": "mcq", "topic": "1.3", "source": "opus", "q": "How do you calculate the mean of three values?", "options": ["Add them up and divide by 3", "Multiply them together and divide by 3", "Take the largest and subtract the smallest", "Add them up and divide by 2"], "answer": 0, "explain": "A mean is the total shared equally between the number of readings.", "src": "W|Remember: To calculate the mean of three values, add them up and divide by 3."}, {"id": "y8c01-m054", "type": "mcq", "topic": "1.4", "source": "opus", "q": "What is the correct way to measure the temperature of the mixture?", "options": ["Hold the thermometer in the liquid and stir gently", "Take the thermometer out of the liquid before reading it", "Rest the thermometer on the bottom of the cup", "Hold the thermometer just above the liquid"], "answer": 0, "explain": "Stirring gives an even temperature, and the bulb must stay in the liquid while you read it.", "src": "W|Hold the thermometer in the liquid and stir gently."}, {"id": "y8c01-m055", "type": "mcq", "topic": "1.4", "source": "opus", "q": "Where should your eyes be when you read a thermometer?", "options": ["Level with the meniscus", "Well above the meniscus", "Well below the meniscus", "It does not matter where they are"], "answer": 0, "explain": "Reading from an angle makes the liquid appear higher or lower than it really is.", "src": "W|Make sure her eyes are level with the meniscus to read the temperature."}, {"id": "y8c01-m057", "type": "mcq", "topic": "1.5", "source": "opus", "q": "What happens to the amount of oxygen in the air at high altitudes?", "options": ["There is less oxygen in the air", "There is more oxygen in the air", "The oxygen is exactly the same as at sea level", "There is no oxygen at all"], "answer": 0, "explain": "Thinner air at altitude is why the rats made extra red blood cells.", "src": "W|At high altitudes, there is less oxygen in the air."}, {"id": "y8c01-m060", "type": "fill", "topic": "1.1", "source": "opus", "q": "Respiration is a series of ____ reactions that happens inside every living cell.", "answer": ["chemical"], "explain": "Respiration is a chemical process, not a physical movement.", "src": "L|Respiration is a series of chemical reactions that happens inside every living cell."}, {"id": "y8c01-m064", "type": "fill", "topic": "1.2", "source": "opus", "q": "Another name for the air sacs in the lungs is ____.", "answer": ["alveoli"], "explain": "Alveolus is the singular; alveoli is the plural.", "src": "L|Another name for them is alveoli."}, {"id": "y8c01-m069", "type": "fill", "topic": "1.3", "source": "opus", "q": "Breathing works by changing pressure, which is possible because air is a ____.", "answer": ["gas"], "explain": "Because air is a gas, its pressure changes when the volume of the chest changes.", "src": "L|Remember that air is a gas."}, {"id": "y8c01-m073", "type": "fill", "topic": "1.4", "source": "opus", "q": "Glucose is an energy ____.", "answer": ["store"], "explain": "The energy is locked inside the glucose until respiration releases it.", "src": "L|Glucose is an energy store."}, {"id": "y8c01-m077", "type": "fill", "topic": "1.5", "source": "opus", "q": "The ____ pumps constantly, to keep the blood moving.", "answer": ["heart"], "explain": "The blood has to keep circulating to deliver glucose and oxygen and remove waste.", "src": "L|The heart pumps constantly, to keep the blood moving."}, {"id": "y8c01-r001", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why the rings of cartilage around the trachea are important.", "answer": "The trachea is a soft tube, and the air inside it is at a lower pressure than the air outside whenever you breathe in, which would tend to squash it flat. The rings of cartilage are firm, so they hold the tube open against that squeezing and stop it collapsing. A collapsed trachea would cut off the only route between the air outside and the lungs, so air could not keep moving in and out and gas exchange would stop altogether.", "keywords": ["the trachea is a soft tube that could be squashed flat", "cartilage rings are firm and hold it open", "they stop it collapsing when you breathe in", "air can keep moving in and out of the lungs"], "src": "L|These rings of cartilage keep the trachea open and prevent it collapsing so that air can be kept moving in and out of your body."}, {"id": "y8c01-r002", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why each bronchus divides into many smaller bronchioles.", "answer": "A single wide tube would deliver air to only one place, but the lungs need air brought to every one of their millions of air sacs. Each bronchus therefore divides again and again into smaller and smaller bronchioles, which carry the air deeper into the lung tissue and spread it out so that it reaches all of the air sacs. Every air sac then has fresh air next to it, so the whole surface of the lung can be used for gas exchange.", "keywords": ["one wide tube would reach only one place", "the branching carries air deeper into the lungs", "it spreads the air to all the air sacs", "so the whole lung surface can be used"], "src": "L|Each bronchus divides into several smaller tubes called bronchioles."}, {"id": "y8c01-r003", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why the air sacs, rather than the trachea, are where gas exchange happens.", "answer": "Gas exchange needs a huge surface, a very short distance for the gases to cross, and blood right next to the air. The air sacs provide all three: there are millions of them, each is tiny and has a wall only one cell thick, and each is surrounded by blood capillaries. The trachea has none of these features, since it is a single thick-walled tube whose job is simply to carry air, so no useful exchange can happen there.", "keywords": ["gas exchange needs a large surface and a short distance", "air sacs are tiny, thin-walled and very numerous", "each is surrounded by blood capillaries", "the trachea is a thick-walled tube that only carries air"], "src": "L|The bronchioles end by branching into many tiny structures called air sacs."}, {"id": "y8c01-r004", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why the wall of an air sac is made of only one layer of very thin cells.", "answer": "Diffusion is slow over long distances and fast over short ones. A wall made of a single layer of very thin cells means oxygen and carbon dioxide have only a very short distance to travel between the air in the sac and the blood in the capillary, so they cross quickly. If the wall were several cells thick, the same gases would take far longer to cross and the body could not take in oxygen fast enough to keep its cells respiring.", "keywords": ["diffusion is fast over short distances", "one layer of thin cells makes the distance very short", "oxygen and carbon dioxide cross quickly", "a thicker wall would slow gas exchange too much"], "src": "L|The air sac has a wall made of one layer of cells."}, {"id": "y8c01-r005", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why oxygen diffuses from the air in the air sac into the blood.", "answer": "Diffusion moves a substance from where it is in higher concentration to where it is in lower concentration. Air that has just been breathed in contains a lot of oxygen, while the blood arriving from the body has had most of its oxygen taken by respiring cells, so it contains much less. That difference in concentration is what makes oxygen molecules move from the air in the sac, across the thin wall, and into the blood.", "keywords": ["diffusion is movement from high to low concentration", "inspired air contains a lot of oxygen", "the arriving blood contains much less", "so oxygen moves from air sac into blood"], "src": "L|The oxygen molecules move from where there are a lot of them (in the air) to where there are fewer of them (in the blood)."}, {"id": "y8c01-r006", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why carbon dioxide diffuses in the opposite direction to oxygen.", "answer": "The direction of diffusion is set by where each gas is more concentrated, and for carbon dioxide that is the other way round. The blood arriving in the capillary has collected carbon dioxide from every respiring cell in the body, while the air in the sac has only a small quantity, so carbon dioxide diffuses out of the blood and into the air sac. Both gases move down their own concentration difference, which is why they cross in opposite directions at the same time.", "keywords": ["each gas diffuses down its own concentration difference", "the blood carries a lot of carbon dioxide from the cells", "the air in the sac contains only a little", "so carbon dioxide moves out of the blood"], "src": "L|There is a lot of it in the blood in the capillary, and only a small quantity in the air inside the air sac."}, {"id": "y8c01-r007", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why the blood arriving at the lungs contains only a small amount of oxygen and a lot of carbon dioxide.", "answer": "That blood has just come back from the organs of the body. In every cell there, respiration was combining glucose with oxygen to release energy, which used up the oxygen the blood was carrying and produced carbon dioxide as a waste product that passed into the blood. So the blood arriving at the lungs is exactly the blood that respiration has stripped of oxygen and loaded with carbon dioxide, which is why it needs to be refreshed.", "keywords": ["the blood has come from the organs of the body", "respiring cells used up its oxygen", "respiration produced carbon dioxide as waste", "that waste passed into the blood"], "src": "L|So, the blood in this capillary contains only a small amount of oxygen, and a lot of carbon dioxide."}, {"id": "y8c01-r008", "type": "short", "topic": "1.2", "source": "opus", "q": "Use the jelly and dye experiment to suggest why it is better to have a lot of very small air sacs in the lungs rather than a few large ones.", "answer": "The dye spreads through all of the small holes much faster, because many small holes have a much larger total surface area than a few large ones of the same volume, so more oxygen is absorbed in the same time.", "keywords": ["surface area", "faster", "small"], "src": "L|Use your observations to suggest why it is better to have a lot of very small air sacs in the lungs, rather than just a few large ones."}, {"id": "y8c01-r009", "type": "short", "topic": "1.2", "source": "opus", "q": "Suggest one way in which agar jelly with holes in it is not a good model for the lungs.", "answer": "The jelly is still, whereas a real lung is ventilated so that fresh air is constantly brought to the surface. The holes in the jelly are not surrounded by blood capillaries, so nothing carries the substance away once it has crossed, and in a real lung that removal keeps the concentration difference going. The dye is also a dissolved liquid, not a gas, so it does not diffuse in the same way as oxygen does.", "keywords": ["the jelly is still, while a lung is ventilated", "the holes have no blood capillaries to carry substances away", "removal keeps the concentration difference going in a real lung", "dye is a dissolved liquid, not a gas"], "src": "L|3 Do you think that the agar jelly with holes is a good model for what happens in the lungs?"}, {"id": "y8c01-r010", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain what it shows if the limewater in only one of the two tubes goes cloudy.", "answer": "Limewater goes cloudy when carbon dioxide is bubbled through it, and the more carbon dioxide there is, the faster and more strongly it turns. If only one tube goes cloudy, that is the tube the expired air passed through, so expired air must contain more carbon dioxide than inspired air. That extra carbon dioxide can only have come from the body, where respiring cells produced it, so the result is evidence of respiration as well as of the gas.", "keywords": ["limewater goes cloudy with carbon dioxide", "the cloudy tube is the one expired air passed through", "so expired air contains more carbon dioxide", "the extra came from respiring cells in the body"], "src": "L|7 Continue until the limewater in one of the tubes has gone cloudy."}, {"id": "y8c01-r011", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain how contracting the intercostal muscles and the diaphragm makes air move into the lungs.", "answer": "When the intercostal muscles contract the ribs move up and out, and when the diaphragm contracts it flattens and moves down. Both movements make the space inside the chest bigger, so the same air inside now occupies a larger volume and its pressure falls below the pressure of the air outside. Air always moves from higher to lower pressure, so it flows down the trachea into the lungs until the two pressures are equal again.", "keywords": ["the ribs move up and out and the diaphragm moves down", "the volume inside the chest increases", "so the pressure inside falls below outside pressure", "air flows in from high pressure to low pressure"], "src": "L|These two movements make more space inside the chest cavity."}, {"id": "y8c01-r012", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why the pressure inside the chest falls when the volume of the chest increases.", "answer": "The number of air particles in the chest does not change when you start to breathe in, but the space they are in gets bigger. The same particles are now spread through a larger volume, so they hit the walls less often and the pressure they exert is lower. This is the same relationship as squeezing a gas into a smaller container, which raises its pressure, run in the opposite direction.", "keywords": ["the number of air particles does not change", "they are spread through a larger volume", "so they hit the walls less often", "the pressure therefore falls"], "src": "L|The pressure of a gas increases when the volume of its container is decreased."}, {"id": "y8c01-r013", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why air is squeezed out of the lungs when the intercostal and diaphragm muscles relax.", "answer": "When the muscles relax, the ribs drop back down and in under their own weight and the diaphragm returns to its domed shape. The space inside the chest therefore gets smaller, so the air in the lungs is squeezed into a smaller volume and its pressure rises above the pressure outside. Air then moves from the higher pressure in the lungs to the lower pressure outside, so it is pushed out without any muscle having to push it.", "keywords": ["the ribs drop and the diaphragm returns to its domed shape", "the volume of the chest decreases", "so the pressure inside rises above outside pressure", "air is pushed out without muscles doing the pushing"], "src": "L|When the volume decreases, the pressure increases."}, {"id": "y8c01-r014", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why you should use three results to calculate a mean value for the volume of air you can breathe out.", "answer": "Any single reading may be unusually large or small because of how hard you happened to blow or how well the apparatus sealed that time. Taking three readings and calculating the mean lets those random differences partly cancel out, so the value is closer to the true one and more reliable. Three results also make it possible to spot an anomalous reading, which one result on its own never could.", "keywords": ["a single reading may be unusually large or small", "the difference is random, not a real change", "a mean of three lets random errors cancel out", "three results also let an anomaly be spotted"], "src": "L|Use your three results to calculate a mean value for the volume of air you can breathe out of your lungs."}, {"id": "y8c01-r015", "type": "short", "topic": "1.3", "source": "opus", "q": "Describe one way in which the bottle-and-syringe model does not completely represent what happens when you breathe in.", "answer": "In the model the container is rigid, whereas a real chest changes shape because the ribs move as well as the diaphragm. The model is worked by a hand pulling the plunger, not by muscles contracting, and it has only one balloon where the body has two lungs made of millions of air sacs. So the model shows how a pressure change moves air, but nothing about how the chest produces that change or what happens to the air afterwards.", "keywords": ["the model container is rigid, but real ribs move", "a hand pulls the plunger instead of muscles contracting", "one balloon stands for two lungs of millions of air sacs", "it shows the pressure change but not how the chest makes it"], "src": "L|6 Describe one way in which this model does not completely represent what happens when you breathe in."}, {"id": "y8c01-r016", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why energy has to be released from glucose before a cell can use it.", "answer": "Glucose is an energy store: the energy is locked up inside the molecule and a cell cannot use it while it stays there, in the same way that food in a cupboard is no use until it is cooked. Respiration in the mitochondria breaks the glucose down by combining it with oxygen, and that reaction releases the stored energy in a form the cell can use for movement, growth and keeping warm.", "keywords": ["glucose is an energy store with the energy locked inside", "a cell cannot use energy while it stays locked up", "respiration in the mitochondria releases it", "the released energy is used for movement, growth and warmth"], "src": "L|Before your cells can use the energy, it has to be released from the glucose."}, {"id": "y8c01-r017", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why it matters that respiration releases energy in a controlled way, a little at a time.", "answer": "A cell only needs a small quantity of energy at any one moment, and energy that is released but not used is wasted as heat. Releasing all the energy in a glucose molecule at once would therefore waste most of it and would raise the temperature inside the cell enough to damage it, in the way burning sugar releases its energy all at once. Respiration instead releases it a little at a time, matched to what the cell is doing.", "keywords": ["a cell needs only a small amount of energy at a time", "energy released but not used is wasted as heat", "a sudden release would overheat and damage the cell", "respiration releases it gradually, matched to demand"], "src": "L|Just a little bit of energy is released at a time – just enough for the cell’s needs."}, {"id": "y8c01-r018", "type": "short", "topic": "1.4", "source": "opus", "q": "Use the word equation for aerobic respiration to explain why the air you breathe out contains more carbon dioxide than the air you breathe in.", "answer": "The word equation is glucose plus oxygen giving carbon dioxide plus water, so carbon dioxide is a product made by every respiring cell in the body. It diffuses out of those cells into the blood, which carries it to the lungs, where it diffuses into the air in the air sacs. The air you breathe out therefore contains all the carbon dioxide that was in the air you breathed in plus the extra your cells have just made.", "keywords": ["respiration makes carbon dioxide as a product", "it diffuses from the cells into the blood", "the blood carries it to the lungs", "so expired air has the inspired carbon dioxide plus more"], "src": "L|Use the equation for aerobic respiration to explain why the air that you breathe out contains more carbon dioxide than the air that you breathe in."}, {"id": "y8c01-r019", "type": "short", "topic": "1.4", "source": "opus", "q": "Suggest why neurones contain more mitochondria than cheek cells do.", "answer": "Mitochondria are the structures where respiration releases energy from glucose, so the number of mitochondria a cell has is a good guide to how much energy it needs. A neurone is constantly carrying electrical impulses around the body and has to keep doing so without pause, which needs a great deal of energy, while a cheek cell mostly just lines a surface. The neurone therefore needs many more mitochondria to release energy fast enough.", "keywords": ["mitochondria release energy from glucose in respiration", "the number of mitochondria matches how much energy a cell needs", "neurones constantly carry impulses and need a lot of energy", "a cheek cell does far less work"], "src": "L|Neurones contain more mitochondria than cheek cells."}, {"id": "y8c01-r020", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why respiring cells are slightly warmer than their surroundings.", "answer": "Whenever energy is transferred from one store to another, some of it always ends up as thermal energy in the surroundings. Respiration is happening continuously in every cell, so every cell is constantly releasing energy, and some of it is transferred to the cell and the tissue around it as heat. That is why a respiring organism is a little warmer than its surroundings, and why a mammal can keep its whole body warm this way.", "keywords": ["some energy is always transferred as heat", "respiration happens continuously in every cell", "so heat is released all the time", "this keeps a respiring organism warmer than its surroundings"], "src": "L|In this process, some of the energy is changed to heat energy."}, {"id": "y8c01-r021", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain the difference between breathing and respiration.", "answer": "Breathing is a movement: muscles change the volume of the chest so that air moves into and out of the lungs, and it happens only in the chest. Respiration is a chemical reaction that happens inside every cell in the body, in which glucose is combined with oxygen to release energy. Breathing supplies the oxygen that respiration needs and removes the carbon dioxide it makes, so the two are connected, but they are not the same process.", "keywords": ["breathing is the movement of air into and out of the lungs", "respiration is a chemical reaction inside every cell", "respiration releases energy from glucose using oxygen", "breathing supplies the oxygen respiration needs"], "src": "L|In the activity, you had to work out for yourself how to explain the difference between breathing and respiration."}, {"id": "y8c01-r022", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why blood looks red even though blood plasma is a very pale yellow.", "answer": "Blood plasma, the liquid part, is a very pale yellow, so the colour must come from something in it. Floating in the plasma are enormous numbers of red blood cells, and each one is packed with haemoglobin, which is a deep red substance. There are so many of these cells in every drop that their colour completely masks the pale yellow of the plasma, which is why blood looks red rather than yellow.", "keywords": ["plasma itself is a very pale yellow", "blood contains huge numbers of red blood cells", "each is packed with red haemoglobin", "their colour masks the pale plasma"], "src": "L|Blood looks red because it contains a lot of red blood cells, which ﬂoat in this liquid."}, {"id": "y8c01-r023", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why it is useful that a red blood cell does not have a nucleus.", "answer": "A red blood cell has one job, which is to carry as much oxygen as possible, and oxygen is carried by haemoglobin. Losing the nucleus frees up the space it would have taken, so the cell can be filled with more haemoglobin and carry more oxygen on each trip round the body. The cost is that the cell cannot repair itself or divide, which is why red blood cells have to be replaced every few months.", "keywords": ["oxygen is carried by haemoglobin", "no nucleus leaves more space inside the cell", "so the cell holds more haemoglobin and carries more oxygen", "the cost is that it cannot repair itself or divide"], "src": "L|Scientists think that not having a nucleus makes more space for haemoglobin."}, {"id": "y8c01-r024", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why it is useful that a red blood cell does not have mitochondria.", "answer": "Mitochondria are where a cell uses oxygen in aerobic respiration. A red blood cell is carrying oxygen for the rest of the body, so if it had mitochondria it would use up some of the very cargo it is delivering. Without them it cannot respire aerobically at all, so every oxygen molecule it picks up in the lungs is still there when it reaches a respiring cell elsewhere in the body.", "keywords": ["mitochondria use oxygen in aerobic respiration", "a red blood cell is carrying oxygen for other cells", "with mitochondria it would use up its own cargo", "without them all the oxygen is delivered"], "src": "L|They also think that not having mitochondria stops the red blood cells from using up all the oxygen for themselves, instead of delivering it elsewhere."}, {"id": "y8c01-r025", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why being very small helps red blood cells to do their job.", "answer": "Blood capillaries are extremely narrow, in places barely wider than a cell, and they are the vessels that run right beside the air sacs in the lungs and beside the respiring cells in every organ. Only a very small cell can pass along them, so being small is what lets a red blood cell get close enough to collect oxygen in the lungs and close enough to deliver it where it is needed.", "keywords": ["capillaries are extremely narrow vessels", "they run beside the air sacs and the respiring cells", "only a very small cell can pass through them", "so being small lets it collect and deliver oxygen"], "src": "L|small helps them to get through very tiny blood capillaries."}, {"id": "y8c01-r026", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain how a white blood cell destroys a bacterium by phagocytosis.", "answer": "A white blood cell can change its shape, so when it meets a bacterium it pushes its cytoplasm out into finger-like extensions that reach around the bacterium until they meet on the far side. The bacterium is then trapped inside the cell, where the white blood cell releases chemicals that kill it and digest it into harmless pieces. The whole process destroys the bacterium rather than just holding it, so it cannot reproduce.", "keywords": ["the white blood cell changes shape", "it pushes cytoplasm out to surround the bacterium", "the bacterium is trapped inside the cell", "chemicals then kill and digest it"], "src": "L|Some kinds of white blood cell can change their shape, and push their cytoplasm out to make ‘fingers’ that can capture a bacterium."}, {"id": "y8c01-r027", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why a different kind of antibody is needed for each different kind of pathogen.", "answer": "An antibody works by sticking onto a pathogen, and it can only stick to a shape that matches its own, in the way a key fits one lock. Different pathogens have different substances on their surfaces, so an antibody that matches one will not fit another at all. That is why the body has to make a new, specific antibody for every new pathogen it meets, and why immunity to one disease gives no protection against a different one.", "keywords": ["antibodies work by sticking onto a pathogen", "an antibody only fits a matching shape", "different pathogens have different surfaces", "so immunity to one gives no protection against another"], "src": "L|Different kinds of antibodies are needed for each different kind of pathogen."}, {"id": "y8c01-r028", "type": "short", "topic": "1.5", "source": "opus", "q": "Suggest why gluing lots of pathogens together helps to protect the body.", "answer": "Antibodies can stick pathogens to one another as well as to themselves, so the pathogens end up in clumps. A clump cannot move about and spread through the body the way single pathogens can, so the infection stops spreading. The clump is also a large, easy target, so a white blood cell that engulfs pathogens can capture and digest many of them in one go instead of hunting each one separately.", "keywords": ["antibodies stick pathogens together in clumps", "a clump cannot move or spread through the body", "the clump is a large, easy target", "one white blood cell can then destroy many at once"], "src": "L|Sometimes, they glue lots of the pathogens together so that they cannot move."}, {"id": "y8c01-r2001", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why the respiratory system is described as a system rather than a single organ.", "answer": "It is a group of organs that work together for one purpose: taking oxygen out of the air and getting rid of carbon dioxide. The nose, trachea, bronchi, bronchioles and lungs each do part of the job, and none of them could do it alone.", "keywords": ["group of organs", "work together", "oxygen in", "carbon dioxide out"], "src": "L|The organs that help you to take oxygen out of the air, and get rid of carbon dioxide, make up the respiratory system."}, {"id": "y8c01-r2002", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why every cell in the body needs the blood as well as the lungs.", "answer": "The lungs only put oxygen into the blood. The blood then delivers that oxygen to every cell in the body so the cells can use it for respiration, and collects the waste carbon dioxide to take back to the lungs. Without the transport step the oxygen would never reach the cells that need it.", "keywords": ["lungs take in oxygen", "blood delivers", "every cell", "collects carbon dioxide"], "src": "L|The blood delivers the oxygen to every cell in the body, so that the cells can use it for respiration."}, {"id": "y8c01-r2003", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why it is better to breathe through your nose than through your mouth.", "answer": "Air gets into your body through your mouth or nose, and both connect to your trachea. The nose warms and moistens the air and traps dust and bacteria on its lining, so the air arriving at the lungs is cleaner and closer to body temperature than air taken straight in through the mouth.", "keywords": ["nose", "warms", "moistens", "traps dust", "cleaner"], "src": "L|Air gets into your body through your mouth or nose."}, {"id": "y8c01-r2004", "type": "short", "topic": "1.1", "source": "opus", "q": "Explain why it is not enough to memorise one particular diagram of the respiratory system.", "answer": "In a test the diagram might not be exactly the same as the one you learned — it may be drawn from a different angle, or labelled in a different order. What you need to know is what each structure does and where it lies in the pathway, so you can identify it on any diagram.", "keywords": ["not exactly the same", "different diagram", "know the function", "pathway"], "src": "L|Remember that, in a test, the diagram might not be exactly the same as this one."}, {"id": "y8c01-r2005", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why the air sacs are wrapped in a very large number of tiny blood vessels.", "answer": "The capillaries carry the blood that has to collect the oxygen. Wrapping many of them tightly around each air sac means a large area of blood is pressed close to the air, so a lot of oxygen can diffuse across at once and the blood is fully loaded before it leaves the lungs.", "keywords": ["capillaries", "pressed tightly", "large area", "close to the air", "diffuse"], "src": "L|There are also lots of very tiny blood vessels in the lungs, wrapped around the air sacs."}, {"id": "y8c01-r2006", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why there are only two thin cells between the air and the blood.", "answer": "Diffusion is faster over a shorter distance. The wall of the air sac and the wall of the capillary are each a single layer of very thin cells, so oxygen and carbon dioxide have only a tiny distance to travel and can move between the air and the blood quickly.", "keywords": ["two thin cells", "short distance", "diffusion faster", "quickly"], "src": "L|There are only two very thin cells between the air and the blood."}, {"id": "y8c01-r2007", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain, in terms of particle numbers, why oxygen moves into the blood and not out of it.", "answer": "The oxygen molecules move from where there are a lot of them, in the air in the air sac, to where there are fewer of them, in the blood arriving from the body. Diffusion always runs down this difference, so the net movement is into the blood until the numbers even out.", "keywords": ["a lot of them", "fewer of them", "diffusion", "net movement"], "src": "L|The oxygen molecules move from where there are a lot of them (in the air) to where there are fewer of them (in the blood)."}, {"id": "y8c01-r2008", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain what happens to oxygen immediately after it enters the blood.", "answer": "It dissolves in the blood and goes into the red blood cells, where it combines with haemoglobin. Combining with haemoglobin takes the oxygen out of solution, which keeps the amount of dissolved oxygen low so more can keep diffusing in from the air.", "keywords": ["dissolves", "red blood cells", "haemoglobin", "keeps diffusion going"], "src": "L|(You can find out about dissolving in Topic 2.1.) It goes into the red blood cells where it combines with haemoglobin."}, {"id": "y8c01-r2009", "type": "short", "topic": "1.2", "source": "opus", "q": "The 32 small holes have the same total volume as the 8 large holes. Explain why this matters.", "answer": "It makes the comparison fair. Because the total volume of jelly and dye is the same in both dishes, any difference in how fast the dye spreads must be caused by the number and size of the holes — that is, by the surface area — and not by there being more dye in one dish.", "keywords": ["same total volume", "fair comparison", "only surface area differs", "not more dye"], "src": "L|2 The total volume of the 32 small holes is the same as the total volume of the eight large holes."}, {"id": "y8c01-r2010", "type": "short", "topic": "1.2", "source": "opus", "q": "Explain why it is important not to get dye on the surface of the jelly.", "answer": "Dye on the surface would spread into the jelly from the top as well as from inside the holes, so you could not tell how much of the spreading came from the holes. The results would then overstate the diffusion and the comparison between the two dishes would be spoiled.", "keywords": ["spreads from the surface", "cannot tell", "overstate", "spoils the comparison"], "src": "L|It’s really important not to get any dye on the jelly!"}, {"id": "y8c01-r2011", "type": "short", "topic": "1.2", "source": "opus", "q": "In the limewater experiment, explain why the glass tubing into tube A and tube B is different.", "answer": "One tube has a long tube reaching down into the limewater and a short tube above it, and the other is the reverse. This arrangement means that when you blow, air is forced through the limewater in one tube, and when you suck, air from the room is drawn through the limewater in the other, so each tube tests a different sample of air.", "keywords": ["long tube", "short tube", "blow", "suck", "different air"], "src": "L|What is different about the glass tubing that goes into test tube A and test tube B?"}, {"id": "y8c01-r2012", "type": "short", "topic": "1.3", "source": "opus", "q": "State the pressure rule used in this topic and explain why it is needed to understand breathing.", "answer": "The pressure of a gas increases when the volume of its container is decreased. Breathing works by changing the volume of the chest cavity, so this rule is what links the movement of the ribs and diaphragm to the change in pressure that makes air flow.", "keywords": ["pressure increases", "volume decreased", "chest volume", "air flows"], "src": "L|The pressure of a gas increases when the volume of its container is decreased."}, {"id": "y8c01-r2013", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why air moves down the trachea on its own when you breathe in.", "answer": "When the volume of the chest cavity increases, the pressure inside the chest and lungs decreases and becomes lower than the pressure of the air outside. Gases move from higher to lower pressure, so air moves down through the trachea into the lungs to fill the extra space.", "keywords": ["volume increases", "pressure decreases", "lower than outside", "air moves in"], "src": "L|Air moves down through the trachea into the lungs, to fill the extra space."}, {"id": "y8c01-r2014", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain how a measuring cylinder can be used to mark a volume scale on a plastic bottle.", "answer": "You add a known volume of water from the measuring cylinder to the bottle and mark the level, then repeat, adding the same volume each time and marking again, until the scale goes all the way from the bottom to the top. Each mark then stands for a known extra volume.", "keywords": ["known volume", "mark the level", "repeat", "same volume", "scale"], "src": "L|In your group of three, discuss how you can use the measuring cylinder to mark a scale on the plastic bottle."}, {"id": "y8c01-r2015", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain why the water stays in the upside-down bottle instead of running out into the bowl.", "answer": "The bottle is full, so no air can get in above the water, and the pressure of the atmosphere pushing down on the water in the bowl holds the water up inside the bottle. Water can only leave if something takes its place, which is exactly what the expired air does.", "keywords": ["full", "no air can get in", "atmospheric pressure", "holds the water up"], "src": "L|You should find that all the water stays in the bottle."}, {"id": "y8c01-r2016", "type": "short", "topic": "1.3", "source": "opus", "q": "Describe one way in which the bell-jar or syringe model does not represent real breathing.", "answer": "In the model the plunger is pulled by your hand, but in the body there is no outside pull — the diaphragm and intercostal muscles do the work themselves. The model also uses a rigid container and a simple balloon, whereas the real chest wall moves and the lungs are made of millions of air sacs.", "keywords": ["pulled by hand", "muscles do the work", "rigid container", "millions of air sacs"], "src": "L|6 Describe one way in which this model does not completely represent what happens when you breathe in."}, {"id": "y8c01-r2017", "type": "short", "topic": "1.3", "source": "opus", "q": "Explain what 'contract' means for a muscle and what the intercostal muscles do when they contract.", "answer": "To contract means to get shorter. When the intercostal muscles between the ribs contract they pull the ribs upwards and outwards, which is one of the two movements that make more space inside the chest cavity.", "keywords": ["get shorter", "pull the ribs", "upwards and outwards", "more space"], "src": "L|The intercostal muscles between the ribs contract (get shorter)."}, {"id": "y8c01-r2018", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain the chain from eating a carbohydrate meal to a cell having usable energy.", "answer": "The digestive system breaks the carbohydrates down to glucose, the blood delivers glucose to every cell, the mitochondria inside the cells carry out aerobic respiration using oxygen, and that reaction releases the energy from the glucose in a form the cell can use.", "keywords": ["digested", "glucose", "blood delivers", "mitochondria", "respiration", "energy released"], "src": "L|When we eat food containing carbohydrates, our digestive system breaks the carbohydrates down to a kind of sugar called glucose."}, {"id": "y8c01-r2019", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain what the word 'aerobic' tells you about this kind of respiration.", "answer": "Aerobic means that the reaction uses oxygen from the air. That is why the body needs a respiratory system to take oxygen in and a blood system to carry it to the cells — without oxygen arriving, aerobic respiration cannot happen.", "keywords": ["uses oxygen", "from the air", "needs delivering", "cannot happen without"], "src": "L|Aerobic means that is uses oxygen, from the air."}, {"id": "y8c01-r2020", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why mitochondria are sometimes described as where a cell gets its energy.", "answer": "Mitochondria are the tiny structures inside cells that carry out aerobic respiration, and it is that reaction which releases the energy from glucose so the cell can use it. A cell with more mitochondria can release energy faster, which is why very active cells contain many of them.", "keywords": ["mitochondria", "aerobic respiration", "release energy", "more mitochondria", "faster"], "src": "L|This is done by tiny structures called mitochondria that are found inside cells."}, {"id": "y8c01-r2021", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why some energy always ends up as heat when respiration takes place.", "answer": "Every time energy is transferred or transformed, some of it is changed to heat energy. In respiration the chemical energy stored in glucose is transferred to other substances for the cell to use, so some of it becomes heat and the respiring cells get a little warmer than their surroundings.", "keywords": ["every transfer", "some becomes heat", "chemical energy", "warmer"], "src": "L|In Stage 7, you learned that every time energy is transferred, or transformed, some of it is changed to heat energy."}, {"id": "y8c01-r2022", "type": "short", "topic": "1.4", "source": "opus", "q": "Explain why a person who eats no food at all would eventually have no energy.", "answer": "All of our energy comes from the food that we eat. Food supplies the glucose that mitochondria use in respiration, so with no food arriving the body must use its stores, and once those run out there is no glucose left for the cells to respire and release energy from.", "keywords": ["all energy from food", "glucose", "respiration", "stores run out"], "src": "L|All of our energy comes from the food that we eat."}, {"id": "y8c01-r2023", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why every cell in the body needs to be close to a blood vessel.", "answer": "Every cell needs a constant supply of glucose and oxygen for respiration, and the carbon dioxide and water it makes must be taken away. The blood does both the delivery and the removal, and substances can only diffuse a short distance, so a cell far from a blood vessel would be starved and poisoned by its own waste.", "keywords": ["glucose and oxygen", "waste removed", "blood does both", "short distance", "diffuse"], "src": "L|So, every cell in your body needs a good supply of glucose and oxygen, and the carbon dioxide and water that the cell makes must be taken away."}, {"id": "y8c01-r2024", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why the heart must pump constantly rather than occasionally.", "answer": "The blood only delivers glucose and oxygen and removes carbon dioxide while it is moving. Cells respire all the time, so the supply and removal must also be continuous, and that means the heart has to keep the blood moving without stopping.", "keywords": ["blood must keep moving", "cells respire all the time", "continuous supply"], "src": "L|The heart pumps constantly, to keep the blood moving."}, {"id": "y8c01-r2025", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain the function of blood plasma, giving two examples of what it carries.", "answer": "Plasma is the pale liquid part of the blood. It transports the red and white blood cells around the body, and it also carries many substances in solution — for example glucose dissolved in plasma is carried from the digestive system to every cell, and carbon dioxide dissolves in plasma and is carried from the cells to the lungs.", "keywords": ["liquid", "carries the cells", "dissolved substances", "glucose", "carbon dioxide"], "src": "L|For example, glucose, dissolved in blood plasma, is transported from the digestive system to every cell."}, {"id": "y8c01-r2026", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain how haemoglobin lets a red blood cell pick up oxygen in the lungs and release it in the body.", "answer": "In the capillaries next to the alveoli, oxygen diffuses into the red blood cell and combines with haemoglobin to form oxyhaemoglobin. As the blood passes cells that are respiring, and so have very little oxygen, the oxyhaemoglobin lets go of its oxygen and gives it to those cells. The blood then returns to the lungs to collect more.", "keywords": ["combines", "oxyhaemoglobin", "lets go", "respiring cells", "returns"], "src": "L|It forms a very bright red compound called oxyhaemoglobin."}, {"id": "y8c01-r2027", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain how you would tell a white blood cell from a red blood cell under a microscope.", "answer": "White blood cells always have nuclei, which red blood cells do not have, and in a stained sample the nucleus shows up as a dark purple area. Some kinds of white blood cell are also larger than red blood cells, and there are far fewer of them.", "keywords": ["nucleus", "red cells have none", "stained dark", "larger", "fewer"], "src": "L|They always have nuclei, which red blood cells do not have."}, {"id": "y8c01-r2028", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why a stain is added to a blood sample before it is looked at under a microscope.", "answer": "White blood cells are almost colourless, so they are very hard to see against the plasma. A stain is added to make the cells show up more clearly, and it colours the nuclei strongly, which is what lets you tell the white cells from the red ones.", "keywords": ["colourless", "hard to see", "show up clearly", "nuclei"], "src": "L|They don'tlook white in the photograph because a stain has been added to the blood, to make the cells show up more clearly."}, {"id": "y8c01-r2029", "type": "short", "topic": "1.5", "source": "opus", "q": "Explain why having had one disease does not protect you from a different one.", "answer": "Different kinds of antibody are needed for each different kind of pathogen, because an antibody only attaches to the pathogen it matches. The antibodies made against one pathogen will not fit another, so the body has to make a new kind for each new pathogen it meets.", "keywords": ["different antibody", "each pathogen", "only fits its match", "new kind needed"], "src": "L|Different kinds of antibodies are needed for each different kind of pathogen."}, {"id": "y8c01-r2030", "type": "short", "topic": "1.5", "source": "opus", "q": "At high altitude there is less oxygen in the air. Predict and explain what happens to a person's red blood cell count.", "answer": "The number of red blood cells increases. With less oxygen in each breath, less oxygen diffuses into the blood, so the body makes more red blood cells, and therefore more haemoglobin, to carry as much oxygen as possible from the smaller amount available.", "keywords": ["increases", "less oxygen in the air", "more haemoglobin", "carry more oxygen"], "src": "W|At high altitudes, there is less oxygen in the air."}, {"id": "y8c01-r2031", "type": "short", "topic": "1.5", "source": "opus", "q": "Suggest two variables the scientists should have kept the same in the high-altitude rat experiment.", "answer": "The rats should have been of the same species, age, sex and size, and both groups should have had the same food, water and temperature, with blood samples taken on the same days and measured the same way. Only the altitude should have differed, otherwise a change in red blood cell count could have had another cause.", "keywords": ["same age", "same species", "same food", "same days", "only altitude differs"], "src": "W|Suggest two variables that the scientists should have kept the same."}, {"id": "y8c01-o001", "type": "short", "topic": "1.1", "source": "opus", "q": "Which characteristic shared by all living things is the subject of this chapter?", "answer": "Respiration.", "keywords": ["respiration"], "explain": "Respiration is one of the seven characteristics of living things, along with movement, nutrition, excretion, growth, reproduction and sensitivity.", "src": "L|You may remember that one of the characteristics shared by all living things is respiration."}, {"id": "y8c01-o002", "type": "short", "topic": "1.1", "source": "opus", "q": "What is respiration?", "answer": "A series of chemical reactions that happens inside every living cell.", "keywords": ["chemical reactions", "every living cell"], "explain": "Respiration is not breathing. It is a set of chemical reactions, and it happens in every living cell all the time.", "src": "L|Respiration is a series of chemical reactions that happens inside every living cell."}, {"id": "y8c01-o003", "type": "short", "topic": "1.1", "source": "opus", "q": "What is the name of the kind of respiration that usually happens inside our cells?", "answer": "Aerobic respiration.", "keywords": ["aerobic"], "explain": "Aerobic respiration is the usual form. 'Aerobic' tells you that oxygen is used.", "src": "L|The kind of respiration that usually happens inside our cells is called aerobic respiration."}, {"id": "y8c01-o006", "type": "short", "topic": "1.1", "source": "opus", "q": "Where does the oxygen your cells use come from?", "answer": "The air around you.", "keywords": ["air"], "explain": "Oxygen is one of the gases in the air, and breathing brings that air into the lungs.", "src": "L|The air around you contains oxygen."}, {"id": "y8c01-o007", "type": "short", "topic": "1.1", "source": "opus", "q": "What happens when you breathe in?", "answer": "You take air into your lungs.", "keywords": ["air", "lungs"], "explain": "Breathing is the movement of air into and out of the lungs.", "src": "L|When you breathe, you take air into your lungs."}, {"id": "y8c01-o008", "type": "short", "topic": "1.1", "source": "opus", "q": "What happens to some of the oxygen in the air you breathe in?", "answer": "It goes into your blood.", "keywords": ["into", "blood"], "explain": "Only some of the oxygen is absorbed; the rest is breathed out again.", "src": "L|Some of the oxygen from the air goes into your blood."}, {"id": "y8c01-o009", "type": "short", "topic": "1.1", "source": "opus", "q": "What does the blood do with the oxygen it collects in the lungs?", "answer": "It delivers the oxygen to every cell in the body, so that the cells can use it for respiration.", "keywords": ["delivers", "every cell", "respiration"], "explain": "Every living cell respires, so every cell needs a supply of oxygen.", "src": "L|The blood delivers the oxygen to every cell in the body, so that the cells can use it for respiration."}, {"id": "y8c01-o010", "type": "short", "topic": "1.1", "source": "opus", "q": "What does the blood do with the carbon dioxide made by the cells?", "answer": "It collects the waste carbon dioxide from the cells and takes it back to the lungs.", "keywords": ["collects", "lungs"], "explain": "The carbon dioxide is then breathed out.", "src": "L|The blood collects the waste carbon dioxide from the cells, and takes it back to the lungs."}, {"id": "y8c01-o011", "type": "short", "topic": "1.1", "source": "opus", "q": "What is the respiratory system?", "answer": "The organs that help you to take oxygen out of the air and get rid of carbon dioxide.", "keywords": ["organs", "oxygen", "carbon dioxide"], "explain": "The respiratory system is an organ system: several organs working together for one job.", "src": "L|The organs that help you to take oxygen out of the air, and get rid of carbon dioxide, make up the respiratory system."}, {"id": "y8c01-o032", "type": "short", "topic": "1.2", "source": "opus", "q": "What does a tiny part of the lungs look like under a powerful microscope?", "answer": "It is mostly holes.", "keywords": ["mostly", "holes"], "explain": "The holes are the air sacs, which give the lung its spongy appearance.", "src": "L|You can see the lungs are mostly holes."}, {"id": "y8c01-o033", "type": "short", "topic": "1.2", "source": "opus", "q": "What are the holes seen in lung tissue under a microscope called?", "answer": "Air sacs.", "keywords": ["air sacs"], "explain": "Each hole is an air sac at the end of a bronchiole.", "src": "L|These holes are called air sacs."}, {"id": "y8c01-o066", "type": "short", "topic": "1.3", "source": "opus", "q": "What safety point must you check about the bottle and tubing in the lung volume experiment?", "answer": "They must be clean, and the water used must be safe to drink.", "keywords": ["clean", "safe to drink"], "explain": "You put your mouth on the tubing, so hygiene matters.", "src": "L|Safety The bottle and bendy tubing must be clean, and the water you use must be safe to drink."}, {"id": "y8c01-o067", "type": "short", "topic": "1.3", "source": "opus", "q": "What extra hazard is created by the lung volume experiment?", "answer": "Water may get on the floor, so you could slip.", "keywords": ["water", "floor", "slip"], "explain": "Spilled water is a slip hazard in any laboratory.", "src": "L|You may get water on the floor as you do your experiment."}, {"id": "y8c01-o068", "type": "short", "topic": "1.3", "source": "opus", "q": "What apparatus do you use to mark a volume scale on the plastic bottle?", "answer": "A measuring cylinder.", "keywords": ["measuring cylinder"], "explain": "You add known volumes and mark the level each time.", "src": "L|In your group of three, discuss how you can use the measuring cylinder to mark a scale on the plastic bottle."}, {"id": "y8c01-o069", "type": "short", "topic": "1.3", "source": "opus", "q": "How far should the scale go along the plastic bottle?", "answer": "All the way from the bottom to the top of the bottle.", "keywords": ["bottom", "top"], "explain": "A full-length scale lets you read any volume that is displaced.", "src": "L|The scale should go all the way from the bottom to the top of the bottle."}, {"id": "y8c01-o070", "type": "short", "topic": "1.3", "source": "opus", "q": "What should you find when you take the lid off the full, upside-down bottle under water?", "answer": "All the water stays in the bottle.", "keywords": ["water", "stays"], "explain": "Air pressure outside holds the water up inside the bottle.", "src": "L|You should find that all the water stays in the bottle."}, {"id": "y8c01-o096", "type": "short", "topic": "1.4", "source": "opus", "q": "Where does all of our energy come from?", "answer": "From the food that we eat.", "keywords": ["food"], "explain": "Food is the energy store that respiration releases energy from.", "src": "L|All of our energy comes from the food that we eat."}, {"id": "y8c01-o097", "type": "short", "topic": "1.4", "source": "opus", "q": "Which type of nutrient is especially good for giving us energy?", "answer": "Carbohydrates.", "keywords": ["carbohydrates"], "explain": "Carbohydrates are broken down to glucose, the fuel for respiration.", "src": "L|Carbohydrates are especially good for giving us energy."}, {"id": "y8c01-o098", "type": "short", "topic": "1.4", "source": "opus", "q": "What does the digestive system break carbohydrates down into?", "answer": "A kind of sugar called glucose.", "keywords": ["glucose"], "explain": "Glucose is small enough to be absorbed into the blood.", "src": "L|When we eat food containing carbohydrates, our digestive system breaks the carbohydrates down to a kind of sugar called glucose."}, {"id": "y8c01-o099", "type": "short", "topic": "1.4", "source": "opus", "q": "Where does the glucose go after digestion?", "answer": "Into our blood.", "keywords": ["blood"], "explain": "The blood is the transport system that reaches every cell.", "src": "L|The glucose goes into our blood."}, {"id": "y8c01-o100", "type": "short", "topic": "1.4", "source": "opus", "q": "Which cells does the blood deliver glucose to?", "answer": "Every cell in the body.", "keywords": ["every cell"], "explain": "Every cell respires, so every cell needs glucose.", "src": "L|The blood delivers glucose to every cell in the body."}, {"id": "y8c01-w001", "type": "mcq", "topic": "1.1", "source": "opus", "q": "Which of these is the correct order that air passes through on its way into the lungs?", "options": ["trachea, bronchus, bronchiole, air sacs", "air sacs, bronchiole, bronchus, trachea", "bronchus, trachea, air sacs, bronchiole", "trachea, air sacs, bronchus, bronchiole"], "answer": 0, "explain": "Air goes down the windpipe (trachea), into one of the two bronchi, along the smaller bronchioles, and finally into the air sacs where gas exchange happens.", "src": "W|air sacs bronchiole bronchus diaphragm lung larynx (voice box) intercostal muscles rib trachea"}, {"id": "y8c01-w003", "type": "mcq", "topic": "1.2", "source": "opus", "q": "A table lists several mammals with their body mass and their breathing rate, in no particular order. How should you reorganise it so that a pattern is easier to see?", "options": ["Reorganise the entries so that the body masses are in order", "Delete any mammal that does not seem to fit", "Round every number to the nearest whole number", "Put the mammals into alphabetical order"], "answer": 0, "explain": "Ordering one column turns a jumble of numbers into a trend you can read straight off the table. Deleting awkward data would be dishonest.", "src": "W|Complete the table by reorganising the entries in a way that makes it easier to see any patterns in the data."}, {"id": "y8c01-w023", "type": "fill", "topic": "1.3", "source": "opus", "q": "To calculate the mean of three values, add them up and ____ by 3.", "answer": ["divide"], "explain": "A mean smooths out the differences between repeat readings.", "src": "W|Remember: To calculate the mean of three values, add them up and divide by 3."}, {"id": "y8c01-w024", "type": "fill", "topic": "1.5", "source": "opus", "q": "The pale yellow liquid part of blood is called ____.", "answer": ["plasma"], "explain": "It is mostly water, and it carries the blood cells and dissolved substances around the body.", "src": "W|Blood contains a pale yellow liquid, called ."}, {"id": "y8c01-w029", "type": "fill", "topic": "1.2", "source": "opus", "q": "Looking for a relationship between two sets of numbers is called looking for a ____ in the data.", "answer": ["correlation", "pattern"], "explain": "A correlation is not the same as proof of a cause, but it is where an explanation starts.", "src": "W|Suggest an explanation for the relationship you have described."}, {"id": "qwen-01-01", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "What is the name of the tube that carries air from your mouth or nose to your lungs?", "explain": "Your mouth and nose connect to the trachea, which is also called the windpipe.", "src": "L|Your mouth and nose both connect to your trachea.", "options": ["bronchus", "trachea", "bronchiole", "larynx"], "answer": 1}, {"id": "qwen-01-02", "type": "fill", "topic": "1.1", "source": "qwen", "q": "The trachea has strong rings of ____ around it to keep it open.", "explain": "Rings of cartilage keep the trachea open and prevent it collapsing.", "src": "L|It has strong rings of cartilage around it.", "answer": ["cartilage"]}, {"id": "qwen-01-06", "type": "fill", "topic": "1.2", "source": "qwen", "q": "The very tiny blood vessels wrapped around the air sacs are called ____.", "explain": "The tiny blood vessels in the lungs as capillaries.", "src": "L|These blood vessels are capillaries.", "answer": ["capillaries"]}, {"id": "qwen-01-07", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "What process allows oxygen to move from the air into the blood?", "explain": "Oxygen moves from the air into the blood through a process called diffusion.", "src": "L|This is called diffusion.", "options": ["respiration", "diffusion", "circulation", "digestion"], "answer": 1}, {"id": "qwen-01-09", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "Which gas moves from the blood into the air sacs?", "explain": "Carbon dioxide from the blood goes into the air in the air sac.", "src": "L|Carbon dioxide from the blood goes into the air.", "options": ["oxygen", "nitrogen", "carbon dioxide", "hydrogen"], "answer": 2}, {"id": "qwen-03-07", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "What do you use to measure the volume of air pushed out in the lung capacity experiment?", "explain": "The method says: 'Use the scale that you drew on the bottle to record the volume of air you breathed out.'", "src": "L|Use the scale that you drew on the bottle to record the volume of air you breathed out.", "options": ["a ruler", "a plastic bottle with a scale", "a thermometer", "a balance"], "answer": 1}, {"id": "qwen-03-08", "type": "fill", "topic": "1.3", "source": "qwen", "q": "In the lung capacity experiment, you fill the bottle right to the top with ____.", "explain": "Step 2 of the method says: 'Fill the bottle right to the top with water.'", "src": "L|Fill the bottle right to the top with water.", "answer": ["water"]}, {"id": "qwen-04-04", "type": "fill", "topic": "1.4", "source": "qwen", "q": "The tiny structures inside cells that release energy from glucose are called ____.", "explain": "Mitochondria as the structures that release energy from glucose.", "src": "L|This is done by tiny structures called mitochondria that are found inside cells.", "answer": ["mitochondria"]}, {"id": "qwen-04-06", "type": "fill", "topic": "1.4", "source": "qwen", "q": "Carbohydrates from food are broken down into a sugar called ____ which goes into the blood.", "explain": "Digestive systems break carbohydrates down into glucose.", "src": "L|our digestive system breaks the carbohydrates down to a kind of sugar called glucose.", "answer": ["glucose"]}, {"id": "qwen-05-02", "type": "fill", "topic": "1.5", "source": "qwen", "q": "Red blood cells contain a red pigment called ____ that carries oxygen.", "explain": "They are full of a red pigment called haemoglobin.", "src": "L|They are full of a red pigment called haemoglobin.", "answer": ["haemoglobin"]}, {"id": "qwen-05-03", "type": "mcq", "topic": "1.5", "source": "qwen", "q": "Why do red blood cells not have mitochondria?", "explain": "Not having mitochondria stops red blood cells from using up all the oxygen for themselves.", "src": "L|not having mitochondria stops the red blood cells from using up all the oxygen for themselves", "options": ["To make them smaller", "So they do not use up the oxygen for themselves", "To allow more room for nuclei", "To help them change shape"], "answer": 1}, {"id": "qwen-05-05", "type": "mcq", "topic": "1.4", "source": "qwen", "q": "What is the word equation for aerobic respiration?", "explain": "The equation: 'glucose + oxygen → carbon dioxide + water'.", "src": "L|glucose + oxygen → carbon dioxide + water", "options": ["glucose + water → carbon dioxide + oxygen", "glucose + oxygen → carbon dioxide + water", "carbon dioxide + water → glucose + oxygen", "oxygen + haemoglobin → carbon dioxide + water"], "answer": 1}, {"id": "qwenw-01-01", "type": "mcq", "topic": "1.1", "source": "qwen", "q": "Which part of the respiratory system is also known as the voice box?", "explain": "The larynx is also called the voice box. Air passing through it makes the vocal cords vibrate, which produces sound.", "src": "W|larynx (voice box)", "options": ["larynx", "trachea", "bronchus", "diaphragm"], "answer": 0}, {"id": "qwenw-01-02", "type": "fill", "topic": "1.1", "source": "qwen", "q": "The small tubes that branch off from the bronchi are called ____.", "explain": "The bronchi divide into many smaller tubes called bronchioles, which carry the air deeper into the lungs to the air sacs.", "src": "W|air sacs bronchiole bronchus diaphragm lung larynx (voice box) intercostal muscles rib trachea", "answer": ["bronchioles", "bronchiole"]}, {"id": "qwenw-01-05", "type": "mcq", "topic": "1.2", "source": "qwen", "q": "What is the relationship between body mass and the total surface area of air sacs?", "explain": "The data shows that larger mammals like humans have much higher surface areas than smaller ones like mice.", "src": "W|Describe the relationship between body mass and total surface area of the air sacs.", "options": ["As body mass increases, surface area increases", "As body mass increases, surface area decreases", "Body mass has no effect on surface area", "Smaller mammals have larger surface areas"], "answer": 0}, {"id": "qwenw-01-06", "type": "fill", "topic": "1.3", "source": "qwen", "q": "Sofia and Zara used a large, empty ____ to measure lung volume.", "explain": "They take a large, empty bottle and mark a scale on it.", "src": "W|The girls take a large, empty bottle.", "answer": ["bottle"]}, {"id": "qwenw-01-07", "type": "mcq", "topic": "1.3", "source": "qwen", "q": "How did the musicians push air into the bottle in the experiment?", "explain": "Marcus was asked to blow into the bottle as hard as he can.", "src": "W|ask Marcus to blow into the bottle as hard as he can", "options": ["They blew into it as hard as they could", "They used a pump to force air in", "They poured water into it", "They shook the bottle vigorously"], "answer": 0}, {"id": "qwenw-02-05", "type": "mcq", "topic": "1.5", "source": "qwen", "q": "In the experiment with rats at high altitude, what was the independent variable?", "explain": "The scientists kept one group at sea level and took another to high altitude. This is the variable they changed to see its effect.", "src": "W|They kept one group of rats at sea level, and took another group to high altitude.", "options": ["The number of red blood cells", "The altitude (sea level vs high)", "The time in days", "The volume of blood"], "answer": 1}, {"id": "qwenw-02-06", "type": "fill", "topic": "1.4"
